interface:
  display_name: "MAID Evolver"
  short_description: "Intentionally evolve existing MAID manifest contracts"
  default_prompt: "Use $maid-evolver to change something a prior MAID manifest already declared. For the current unmerged task, revise its existing draft or promoted contract in place with maid plan revise when locked. For a durable contract on main/master, classify the change as chain merge or supersede, make the supersede cost explicit, and validate the new contract structurally, behaviorally, and for coherence."
