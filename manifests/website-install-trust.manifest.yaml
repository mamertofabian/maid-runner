# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Make the website install section trustworthy: platform tabs, honest copy buttons, reviewable installer scripts, and version pinning"
type: feature
created: "2026-10-08T10:46:34Z"
metadata:
  planning_state: completed
  tags:
    - website
    - static-site
    - install
    - accessibility
    - browser-tests
  priority: high
description: |
  The 2026-10-08 Impeccable critique rated the quick-start install section a
  P1 trust failure for a security-minded audience: `curl ... | sh` and
  `irm ... | iex` sit in a decorative terminal with no copy affordance, no
  way to read the installer scripts first, no version pinning, comment lines
  rendered larger than the commands, and an unstyled `<details>` holding the
  uv and pip alternatives.

  Rework the install area of website/index.html (#quickstart), its styles,
  and website/script.js:
  - Platform tabs inside the terminal card: "macOS / Linux" (shell
    installer), "Windows" (PowerShell installer), and "uv / pip" (the two
    Python tool commands, replacing the `<details>`). Tabs follow the WAI-ARIA
    tabs pattern: one panel visible, aria-selected, roving focus with
    ArrowLeft/ArrowRight (wrapping)/Home/End, tabindex 0 on the selected tab
    and -1 on the others, click selection. Visitors whose navigator.userAgent
    contains "Windows" start on the Windows tab; everyone else starts on
    macOS / Linux. Detection uses navigator.userAgent because
    navigator.platform and userAgentData do not follow user-agent overrides.
  - Every install command gets a Copy button that writes the exact command
    text to the clipboard and announces "Copied" in a live status region only
    after navigator.clipboard.writeText resolves; the status never contains
    "Copied" before the first click. If the Clipboard API is missing or
    rejects, the visible status reads "Couldn't copy — select the command and
    copy it manually." and never claims success. The
    follow-up `maid init` and `maid howto --section quickstart` lines stay in
    the card.
  - The shell and PowerShell panels link to the served installer scripts
    with same-origin relative hrefs (install.sh, install.ps1), so visitors can
    read exactly what this deployment serves before running it, and
    show the pinned form using the installers' real flags:
    `curl -LsSf https://maidrunner.dev/install.sh | sh -s -- --version <version>`
    and the PowerShell scriptblock form with `-Version <version>`. The
    placeholder is literal: hard-coding a release number would go stale.
  - Without JavaScript (progressive enhancement, matching the navigation),
    the tabs and Copy buttons are hidden and every panel is shown, so every
    command remains readable and selectable.

  Markup conventions the tests rely on: each install command row is a
  [data-copy-row] element holding exactly one [data-command] element with the
  command text and one button whose accessible name contains "Copy"; one
  shared #quickstart [data-copy-status] live region; tabs with role="tab" and
  aria-controls pointing at role="tabpanel" panels; the macOS / Linux panel
  holds the shell pinned form and the Windows panel the PowerShell one.

  Contract design: like website-readable-type-floor, the behavioral tests
  drive the real page in headless Chromium (Playwright) rather than parsing
  markup, so they prove what a visitor experiences: tab selection and
  keyboard focus, clipboard contents after a click, the visible failure
  message, the served script bytes behind each link, and the no-JS view.

  Preserve the locked strings other website contracts assert inside
  #quickstart: the exact shell and PowerShell commands, the shell command
  appearing before "uv tool install", "pip install maid-runner", "maid init",
  "maid howto --section quickstart", "See the docs for detailed guides", and
  no "maid verify". Section order, the final CTA, and copy outside the install
  card stay unchanged; moving Quick start higher on the page belongs to the
  separate distill follow-up. New styles must keep the rendered type floor
  (12px text, no new media/container/supports conditions) enforced by
  tests/test_website_rendered_typography.py.

  This is an additive chain-merge onto the active website contract
  (fix-google-search-vercel-deployment, surface-knockout-strength,
  website-readable-type-floor); it does not supersede them. A dedicated test
  file avoids invalidating plan locks that hash the shared website test files.
temptations:
  - risk: "Do not make the Copy button report success without verifying the clipboard write, or swallow a rejected or missing Clipboard API."
    instead: "Await navigator.clipboard.writeText; announce \"Copied\" only after it resolves, and show a visible failure message telling the visitor to select the command manually when it is missing or rejects."
  - risk: "Do not break the locked quick-start strings by wrapping command text in extra spans, renaming commands, or moving the shell command after the uv command."
    instead: "Keep each command's exact text in a single data-command element, keep the shell panel first in source order, and rerun tests/test_website_static_contract.py and tests/test_bootstrap_installers.py."
  - risk: "Do not hard-code a release number in the pinning example or invent installer flags."
    instead: "Use a literal <version> placeholder with the install.sh --version and install.ps1 -Version parameters the scripts already define."
  - risk: "Do not make the section depend on JavaScript or add media queries for the tabs."
    instead: "Render all panels in HTML, hide tabs and Copy buttons with body.no-js and the hidden attribute until script.js enhances them, and fit the tab bar within the existing breakpoints."
  - risk: "Do not change the existing navigation script behavior or the strings its contract asserts."
    instead: "Add the install enhancement as a separate block in website/script.js after the navigation code, which returns early only for the navigation."
files:
  scope:
    - path: website/index.html
      reason: "The #quickstart install card gains platform tabs, per-command copy rows with a status region, installer script links, and pinning examples; the details element is replaced by the uv / pip tab."
    - path: website/styles.css
      reason: "Tab bar, copy rows, status message, script links, and no-JS presentation inside the terminal card."
    - path: website/script.js
      reason: "Progressive enhancement: tab selection with keyboard support, Windows preselection, and clipboard copying with honest success and failure reporting."
  create:
    - path: tests/test_website_install_section.py
      artifacts:
        - kind: test_function
          name: test_platform_tabs_show_one_installer_and_follow_the_keyboard
          args: []
          returns: None
          source_scenario: "A visitor on macOS or Linux reaches Quick start and switches platforms with the keyboard or mouse."
          actions:
            - type: api_call
              subject:
                function: page.keyboard.press
          expected:
            behavior: "Three platform tabs exist with roving tabindex (0, -1, -1); macOS / Linux is selected first and only its shell command is visible; ArrowRight selects and focuses Windows and shows only the PowerShell command; End shows the uv and pip commands; Home returns to macOS / Linux; ArrowLeft from the first tab wraps to uv / pip; clicking a tab selects it."
        - kind: test_function
          name: test_windows_visitors_see_the_powershell_installer_first
          args: []
          returns: None
          source_scenario: "A visitor on Windows opens the homepage."
          actions:
            - type: api_call
              subject:
                function: page.goto
          expected:
            behavior: "With a Windows user agent, the Windows tab is selected on load and the PowerShell command, not the shell command, is visible."
        - kind: test_function
          name: test_copy_buttons_copy_the_exact_command_and_confirm
          args: []
          returns: None
          source_scenario: "A visitor clicks Copy next to each install command."
          actions:
            - type: api_call
              subject:
                function: navigator.clipboard.readText
          expected:
            behavior: "Every copy row in every tab copies exactly its own command text to the clipboard, covering the shell, PowerShell, uv, and pip commands, and the status region reads Copied after each click and not before the first one."
        - kind: test_function
          name: test_copied_is_announced_only_after_the_clipboard_write_resolves
          args: []
          returns: None
          source_scenario: "A visitor clicks Copy while the browser is still completing the clipboard write."
          actions:
            - type: api_call
              subject:
                function: navigator.clipboard.writeText
          expected:
            behavior: "While writeText is pending the status does not say Copied; once the write resolves the status says Copied."
        - kind: test_function
          name: test_copy_failure_is_reported_instead_of_claiming_success
          args: []
          returns: None
          source_scenario: "A visitor's browser rejects clipboard access."
          actions:
            - type: api_call
              subject:
                function: navigator.clipboard.writeText
          expected:
            behavior: "When writeText rejects or navigator.clipboard is missing, the visible status says Couldn't copy and to select the command manually, and never says Copied."
        - kind: test_function
          name: test_installer_scripts_are_linked_for_review_with_pinning_help
          args: []
          returns: None
          source_scenario: "A cautious visitor wants to read the installer and pin a release before piping it to a shell."
          actions:
            - type: api_call
              subject:
                function: urllib.request.urlopen
          expected:
            behavior: "The install section links install.sh and install.ps1 with same-origin relative hrefs, each link serves bytes identical to the repository script, the macOS / Linux panel shows `curl -LsSf https://maidrunner.dev/install.sh | sh -s -- --version <version>`, and the Windows panel shows a PowerShell form with `-Version <version>`, using parameters the scripts define."
        - kind: test_function
          name: test_install_section_is_complete_without_javascript
          args: []
          returns: None
          source_scenario: "A visitor loads the homepage with JavaScript disabled."
          actions:
            - type: api_call
              subject:
                function: page.goto
          expected:
            behavior: "All four install commands are visible, and no tabs or Copy buttons are shown."
  read:
    - website/install.sh
    - website/install.ps1
    - tests/test_website_static_contract.py
    - tests/test_bootstrap_installers.py
    - manifests/website-readable-type-floor.manifest.yaml
validate:
  - uv run python -m pytest -q tests/test_website_install_section.py tests/test_website_rendered_typography.py tests/test_website_static_contract.py tests/test_bootstrap_installers.py tests/test_website_google_analytics.py
  - uv run maid validate manifests/website-install-trust.manifest.yaml --mode behavioral --quiet
  - uv run maid validate manifests/website-install-trust.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-10-08T11:40:00Z"
  summary: "Reworked the website's quick-start install card for a security-minded audience: platform tabs in the terminal bar (macOS / Linux, Windows, uv / pip) following the WAI-ARIA tabs pattern, with Windows preselected from navigator.userAgent; a Copy button per command that reports Copied only after the clipboard write resolves and shows a visible manual-copy message when it fails; same-origin links to read install.sh and install.ps1; a note on what the installers do, including the PATH change; and pinned-release forms using the scripts' real --version and -Version parameters. Without JavaScript all three panels render as plain labelled sections. The outsized comment lines and the unstyled details element are gone."
  rationale: "The Impeccable critique rated the install section a P1 trust failure: pipe-to-shell commands with no way to read the script first, no copy affordance, no version pinning, and comment lines larger than the commands. The contract is a Playwright browser test that drives what a visitor experiences (focus, clipboard contents, the failure message, the served script bytes, the no-JS view) and keeps the locked quick-start strings from earlier website contracts intact."
  lessons:
    - lesson_type: validation
      summary: "Browser tests for asynchronous UI feedback must hold the async step pending, not just mock success or failure: a plan reviewer showed that setting \"Copied\" before awaiting writeText passed both a success test and a rejection test. A test that resolves the clipboard promise on demand, and asserts the status before and after, is what pins honest success reporting."
      tags:
        - runtime-evidence
        - async-ui
        - website
      paths:
        - tests/test_website_install_section.py
    - lesson_type: validation
      summary: "Playwright innerText ignores display:none content, so text assertions over tabbed UIs must read each panel through its tab's aria-controls (or select the tab first). Otherwise a correct implementation fails because the hidden panel's text is invisible to the assertion."
      tags:
        - playwright
        - website
      paths:
        - tests/test_website_install_section.py
    - lesson_type: validation
      summary: "Having plan reviewers build a reasonable correct implementation in a scratch copy and run the tests against it found false failures (hidden-panel text, a stale status racing the next copy) that reading the tests alone missed. It was the most effective plan-review method across this website series."
      tags:
        - plan-review
        - review-method
      paths:
        - manifests/website-install-trust.manifest.yaml
  review_notes:
    - source: plan-review-subagents
      severity: ready
      summary: "Two fresh maid-plan-reviewer passes. The first found the hidden-panel pinning false failure, the premature-Copied hollow pass, status-read timing, absolute links fetching production, and unpinned wording, user-agent, and selector conventions. The second built a correct implementation (all seven tests plus the locked website contracts passed, 11 hollow variants caught) and found a stale-status race and an unchecked roving tabindex. All were fixed before lock."
    - source: implementation-review-subagent
      severity: needs-changes
      summary: "First review: all four Copy buttons shared the accessible name \"Copy\". Fixed with distinct aria-labels. Also applied: the status moved next to the panels so the failure message stays on screen on phones, the status clears on tab change, and the tab-panel roles move to script.js so the no-JS view is plain sections."
    - source: implementation-review-subagent
      severity: ready
      summary: "Fresh re-review: Ready to merge. Low nits applied after the verdict: the installer note now discloses the PATH change (both scripts run `uv tool update-shell`), the pinned code breaks at spaces before mid-word, and the bar alignment change is limited to the JS view. Re-ran the contract tests (31 passed) and checked overflow at 280/320/390 with and without JS (none)."
  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/test_website_install_section.py, tests/test_website_rendered_typography.py, tests/test_website_static_contract.py, tests/test_bootstrap_installers.py, tests/test_website_google_analytics.py]
      status: passed
      summary: "Manifest validate pytest command: 31 passed, including the locked typography, static-contract, bootstrap-installer, and analytics tests."
    - command: [uv, run, python, -m, pytest, tests/, -q, -n, "8"]
      status: passed
      summary: "Full suite: 5567 passed, 20 skipped."
    - command: [uv, run, maid, test, --jobs, "2", --pytest-workers, "4"]
      status: passed
      summary: "All manifest validation commands: 310 passed, 0 failed."
    - command: [uv, run, maid, verify, --profile, deep, --manifest-dir, manifests, --file-tracking-scope, task, --plan-lock-scope, task, --test-scope, task, --require-plan-lock, --require-red-evidence, --since, HEAD, --summary]
      status: passed
      summary: "Command printed by maid assess (deep tier): PASS, 0 blocking, 11 stages; only pre-existing E307 warnings. Repo-wide maid validate 0 failed; ruff and black clean."
    - command: [headless-chromium-render-inspection]
      status: passed
      summary: "Install card rendered at 1440 (Linux and Windows user agents, Copied state), 390 (rejected clipboard, failure message on screen; no-JS stacked panels), 320, and 280. No overflow in #quickstart at 280/320/390 with or without JS. The tab bar fits from 320px and scrolls 24px at 280px. The accessibility snapshot shows a named tablist, tab panels named by their tabs, distinct Copy names, and the status right after the panels. Not verified: clipboard in Firefox or Safari, or on the HTTPS production origin; the PowerShell pinned form was checked by reading install.ps1, not executed (no pwsh)."
