    status: failed
    summary: The revised contract red phase failed because the interim worktree reported 2.21.2 while the approved behavioral contract expected 2.22.0.
  - command:
    - uv
    - run
    - maid
    - --version
    status: passed
    summary: Local CLI reported maid 2.22.0.
  - command:
    - uv
    - run
    - python
    - -m
    - pytest
    - -q
    - tests/integration/test_library_api.py
    status: passed
    summary: Focused public API and release metadata suite passed with 29 tests.
  - command:
