    severity: P1
    summary: The reviewer identified that public functionality made the initially requested 2.21.2 patch inconsistent with the documented SemVer policy; the user accepted the finding and changed the release to 2.22.0.
  - source: maid-implementation-review-subagent/release_2212_review
    severity: P2
    summary: The reviewer found a stale roadmap update date; it was corrected from 2026-06-19 to the 2026-07-18 release date.
  - source: maid-implementation-review-subagent/release_2220_review
    severity: info
    summary: Ready with no actionable findings; the reviewer confirmed SemVer alignment, complete coverage of all nine commits, healthy plan locks, intentional remaining 2.21.2 audit evidence, and removal of obsolete patch-release artifacts.
