schema: "2"
goal: "Bound focused knockout to a small prefix of detecting nodeids"
type: refactor
created: "2026-08-13T11:08:49Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - knockout
    - runtime-evidence
description: |
  After 121-36, popular artifacts such as slug_from_path keep ~1500 proven
  detecting nodeids. Focused knockout then reruns those tests three times per
  artifact. Mutation replaces the body with NotImplementedError, so one caller
  is enough to detect the rewrite.

  Keep a stable prefix of at most eight proven detecting nodeids on the focused
  command. Fewer than eight stay unchanged. Exact fallback is unchanged.
  Do not claim the five-minute deep budget in this contract.
temptations:
  - risk: "Do not replay every detecting caller of a popular artifact during focused knockout."
    instead: "Use a stable prefix of at most eight proven detecting nodeids."
  - risk: "Do not drop focused knockout when more than eight detecting nodeids exist."
    instead: "Truncate the focused nodeid list; keep used_exact_fallback false."
files:
  create:
    - path: tests/core/test_focused_knockout_bounds_detecting_nodeids.py
      artifacts:
        - kind: test_function
          name: test_focused_knockout_uses_at_most_eight_detecting_nodeids
          args: []
  scope:
    - path: maid_runner/core/knockout.py
      reason: "Focused knockout must cap proven detecting nodeids so popular artifacts do not rerun thousands of tests."
  read:
    - manifests/121-36-focus-knockout-on-proven-detecting-nodeids.manifest.yaml
    - tests/core/test_focused_knockout_drops_unproven_detecting_nodeids.py
validate:
