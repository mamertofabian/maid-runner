schema: '2'
goal: Make plain maid plan revise carry valid red evidence forward automatically when the revision provably preserves the contract, so bookkeeping revisions stop discarding evidence and dead-ending in E705
type: feature
created: '2026-07-18T00:46:19Z'
metadata:
  epic: manifests/drafts/085-00-plan-lock-ceremony-reduction.epic.yaml
  bug_report: ~/.maid/bug-report/20260715-035754-manatal-coop-site-stash-implementation-bookkeeping.md
  tags:
  - plan-lock
  - red-phase
  - ceremony-reduction
  - cli
  priority: high
description: |
  `revise_plan_lock` (maid_runner/core/plan_lock.py) unconditionally sets
  `red_evidence=None`, and `cmd_plan_revise` (maid_runner/cli/commands/plan.py)
  then either recaptures (necessarily green -> not_red -> E705 for an
  already-implemented manifest) or requires the caller to know about
  `--preserve-red-evidence`. In the 2026-07-16 goal run this produced 207
  "red evidence refresh" revisions whose recorded contract deltas were
  empty — pure ceremony. Bug report 20260715-035754 shows the same
  mechanism making `--require-red-evidence` unsatisfiable for
  bookkeeping-only revisions mid-session.

  The lock already stores everything needed to decide safety
  deterministically: the persisted `_manifest_contract` (084-03) and the
  locked behavioral test hashes.

  Pinned decisions (do not redesign):

  1. Preservation rule (ALL must hold, byte-exact, no heuristics):
     a. the contract delta between the locked `_manifest_contract` and the
        revised manifest's contract is empty (no artifacts, files, or
        validate command changes — the exact sets `compute_contract_delta`
        already compares);
     b. every test file recorded in the lock's `test_hashes` is
        byte-identical on disk right now (same compute_manifest_hash
        digest), and the revised manifest introduces no new behavioral
        test files;
     c. the existing lock's `red_evidence` passes the current
        `_red_evidence_payload_is_valid` check.
     When all three hold, plain `maid plan revise --reason ...` (no
     explicit evidence flag) carries the existing red evidence forward
     instead of discarding it. When any fails, current behavior is
     unchanged (recapture, or the explicit flags).
  2. The decision predicate is a new PUBLIC core function so it is testable
     without CLI plumbing and reusable by future tooling:
     `revision_preserves_red_evidence(existing, manifest_path, project_root,
     prior_contract)` in maid_runner/core/plan_lock.py. It performs no I/O
     beyond reading the manifest and hashing the locked test files.
  3. Visibility is mandatory: when evidence is preserved automatically, the
     command prints a line stating red evidence was preserved because the
     revision is contract-preserving. Silent preservation is forbidden —
     agents and session logs must be able to see which path ran. The
     revision entry's empty contract_delta (already recorded since 084-03)
     is the machine-auditable trail; no lock schema change is added.
  4. Explicit flags keep their exact semantics: `--preserve-red-evidence`
     (requires valid evidence, refuses --no-run), `--stash-implementation`,
     and `--no-run` are untouched. The automatic path only replaces the
     default recapture in the plain case.
  5. E707 command cross-checks and E701/E702 enforcement are untouched;
     preserved evidence remains subject to them. Because rule 1a includes
     validate-command equality and rule 1b includes test-byte equality, the
     preserved evidence still describes exactly the commands and test
     content it was captured against.

  Rationale for byte-exactness: a formatting-only test change is NOT
  preserved by this manifest (the bytes differ, so the old evidence no
  longer describes the hashed test files). That looser case is explicitly
  out of scope here; the format-before-lock lesson in the packaged
  guidance (085-06) remains the answer for formatting churn.

  Sequencing: second child of epic 085; depends on nothing else in the
  epic. 085-03 later removes one common trigger (outcome capture) from
  even needing a revision, but this child covers the whole
  contract-preserving class including test_function pointer fixes where
  the manifest changes but tests and contract sets do not.

  Planning notes (Planning Handoff Mode): behavioral tests are declared
  below but not yet written; all new coverage goes in the dedicated
  tests/cli/test_plan_revise_auto_preserve.py module because
  tests/cli/test_plan_cmd*.py files are hashed by older plan locks. The
  implementing agent confirms the red phase, runs behavioral validation,
  plan-locks, and promotes before implementation.

  Open question for plan review: whether the preservation notice should
  also be embedded in the revision entry's reason text (recommended: no —
  contract_delta emptiness is the trustworthy signal; agent-authored
  reason strings must not carry evidence semantics, per the 084 epic's
  "evidence over claims" constraint).
temptations:
- risk: Do not preserve evidence when test bytes changed 'only by formatting' or 'only comments' — that requires content interpretation this epic forbids.
  instead: Compare compute_manifest_hash digests byte-exactly against the lock's test_hashes; any difference falls through to the existing recapture/stash paths.
- risk: Do not skip the stdout preservation notice or bury it behind --json only.
  instead: Print the preservation line on the plain text path and include an equivalent field in any JSON payload the command already emits.
- risk: Do not implement the predicate inline in cmd_plan_revise where it cannot be tested without git/CLI scaffolding.
  instead: Ship the public revision_preserves_red_evidence core function with direct behavioral tests plus CLI-level tests for the wiring.
- risk: Do not relax _red_evidence_payload_is_valid or E705/E707 semantics to make preservation apply more often.
  instead: Keep enforcement untouched; widen nothing beyond the three-part byte-exact rule.
- risk: Do not add assertions to existing plan-cmd test files hashed by older plan locks.
  instead: Put all new behavioral coverage in the dedicated test module owned by this manifest.
files:
  create:
  - path: tests/cli/test_plan_revise_auto_preserve.py
    artifacts:
    - kind: test_function
      name: test_revise_manifest_only_edit_preserves_red_evidence
      source_scenario: A locked temp-project manifest with valid red evidence gets an outcome-style manifest-only edit (contract sets unchanged, test files untouched), then plain maid plan revise with a reason.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The revision succeeds, the saved lock still carries the original valid red evidence payload, the revision entry records an empty contract delta, and stdout states that red evidence was preserved.
    - kind: test_function
      name: test_revise_with_changed_test_file_recaptures_evidence
      source_scenario: The same locked setup, but a locked behavioral test file's AST changed (assertion edit) before the revise.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The automatic preservation does not apply; the command follows the existing recapture path and the saved lock's evidence is the fresh capture result, not the prior payload.
    - kind: test_function
      name: test_revise_with_formatter_only_test_edit_preserves_red_evidence
      source_scenario: The same locked setup, but a locked behavioral test file receives only a comment/whitespace edit that leaves the AST unchanged.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Automatic preservation applies; the saved lock keeps the original red evidence and stdout states that red evidence was preserved.
    - kind: test_function
      name: test_revise_with_new_discovered_test_file_recaptures_evidence
      source_scenario: A locked temp-project whose files.read points at the tests/ directory (discovery can grow), then a new tests/test_extra.py appears before plain revise while contract sets and locked file bytes stay unchanged.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Preservation does not apply because the revised manifest introduces a new behavioral test file; the fresh-capture path runs.
    - kind: test_function
      name: test_revise_with_contract_delta_recaptures_evidence
      source_scenario: The revised manifest adds a validate command, producing a non-empty contract delta, while test files stay byte-identical.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Preservation does not apply and the fresh-capture path runs, keeping E707's capture-time command snapshot honest.
    - kind: test_function
      name: test_revise_with_invalid_existing_evidence_recaptures
      source_scenario: The existing lock's red_evidence payload is present but invalid (red false or an invalid command classification).
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Preservation does not apply; behavior matches today's plain revise exactly.
    - kind: test_function
      name: test_revision_preserves_red_evidence_predicate
      source_scenario: Direct calls to the public core predicate across the five quadrants — all conditions met, contract delta non-empty, test bytes changed, new discovered behavioral test file, evidence invalid.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: Returns True only when the contract delta is empty, every locked test hash matches current bytes, and the existing evidence is valid; False in each other quadrant.
    - kind: test_function
      name: test_preserved_evidence_passes_verify_red_evidence_gate
      source_scenario: After an automatic-preservation revise, enforce_plan_locks runs with require_red_evidence on the temp project.
      actions:
      - type: api_call
        subject:
          function: enforce_plan_locks
      expected:
        behavior: No E704/E705 errors are reported for the revised lock, closing the unsatisfiable-bookkeeping loop from bug report 20260715-035754 for the contract-preserving case.
  edit:
  - path: maid_runner/core/plan_lock.py
    artifacts:
    - kind: function
      name: revision_preserves_red_evidence
      args:
      - name: existing
        type: PlanLock
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: prior_contract
        type: dict | None
      returns: bool
      description: Deterministic predicate for the three-part preservation rule pinned in this manifest's description. Returns False whenever prior_contract is None (fail-closed for pre-084 locks without a persisted contract snapshot).
  - path: maid_runner/cli/commands/plan.py
    artifacts:
    - kind: function
      name: cmd_plan_revise
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: Plain revise (no evidence flag, no --no-run) consults revision_preserves_red_evidence and, when it returns True, carries the existing red evidence into the revised lock and prints the mandatory preservation notice; every other path, flag combination, and refusal is byte-for-byte today's behavior.
  read:
  - maid_runner/core/manifest.py
  - manifests/084-03-record-contract-deltas-in-lock-revisions.manifest.yaml
  - manifests/067-06-cross-check-red-evidence-commands.manifest.yaml
validate:
- uv run python -m pytest tests/cli/test_plan_revise_auto_preserve.py -v
- uv run maid validate manifests/085-02-preserve-red-evidence-on-contract-preserving-revisions.manifest.yaml --mode behavioral --quiet
- uv run maid validate manifests/085-02-preserve-red-evidence-on-contract-preserving-revisions.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-07-18T00:52:00Z"
  summary: "Plain maid plan revise now carries valid red evidence forward automatically when the revision is contract-preserving (empty contract delta, unchanged locked test bytes, no newly discovered tests, and valid existing evidence), with a mandatory stdout preservation notice."
  rationale: "Bookkeeping revisions were discarding red evidence and forcing green recapture (E705). The lock already stored the contract snapshot and test hashes needed for a deterministic byte-exact predicate, so auto-preserve closes the unsatisfiable bookkeeping loop without relaxing E705/E707 or changing the lock schema."
  agent:
    model: Composer
    provider: cursor
    client: cursor-auto
    skills:
