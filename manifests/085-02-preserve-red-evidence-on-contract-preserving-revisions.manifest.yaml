    summary: "Auto-preserve red evidence only when contract delta is empty and locked test digests still match byte-exactly, including refusing newly discovered behavioral test files that compute_contract_delta does not see."
    tags:
    - plan-lock
    - red-phase
    - ceremony-reduction
    paths:
    - maid_runner/core/plan_lock.py
    - maid_runner/cli/commands/plan.py
    - tests/cli/test_plan_revise_auto_preserve.py
  - lesson_type: testing
    summary: "Cover directory-backed discovery growth as its own False quadrant; empty contract delta alone is not enough when files.read points at a test directory that can gain new modules."
    tags:
