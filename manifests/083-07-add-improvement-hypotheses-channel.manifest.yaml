  read:
  - manifests/drafts/083-00-close-outcome-enrichment-consumption-loop.epic.yaml
  - manifests/083-06-harden-enrich-staleness-flags-and-prompt-scaling.manifest.yaml
  - manifests/081-01-add-outcome-enrichment-core.manifest.yaml
  - manifests/081-05-harden-enrichment-prompt-and-quality.manifest.yaml
  - maid_runner/cli/commands/insights.py
  - maid_runner/cli/commands/recall.py
  - tests/core/test_outcome_enrichment.py
  - tests/core/test_outcome_enrichment_quality.py
  - tests/cli/test_recall_theme_map_cmd.py
  create:
  - path: tests/cli/test_insights_ignores_hypotheses_cmd.py
    artifacts:
    - kind: test_function
      name: test_theme_map_insights_output_identical_with_and_without_hypotheses
      args: []
      returns: None
      description: maid insights --theme-map produces byte-identical output for the same digest with and without improvement_hypotheses, pinning the advisory-markdown-only consumption boundary.
    - kind: test_function
      name: test_theme_map_insights_ignores_invalid_hypotheses
      args: []
      returns: None
      description: maid insights --theme-map still succeeds for a valid theme map when advisory improvement_hypotheses are malformed, pinning that deterministic reports do not consume the advisory channel.
validate:
- uv run python -m pytest -q tests/core/test_outcome_enrichment.py tests/core/test_outcome_enrichment_quality.py tests/cli/test_insights_ignores_hypotheses_cmd.py tests/cli/test_recall_theme_map_cmd.py
