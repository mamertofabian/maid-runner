outcome:
  status: completed
  summary: "Completed named-profile adoption across live howto and init-distributed workflow guidance, then archived the fully consumed 092 and 095 epics as exact promoted-child pointers."
  rationale: "Actionable bounded-retry and handoff commands now lead with the agent-retry and handoff profiles while retaining literal flags only as labelled expansion text. The canonical, packaged, and freshly installed workflow document use the handoff profile byte-for-byte, and INSTRUCTION_PAYLOAD_VERSION advanced to 2026.08.07.2. Both formerly unmarked consumed epics are registered archive pointers rather than invisible planning records. Validation passed with 46 focused tests, 3,796 full-suite tests plus 5 skips, 228/228 MAID commands, zero repository manifest failures, Ruff, Black, both archive schemas, and all eight handoff gates. Independent read-only review returned ready with no blockers and one residual P2 archive-exactness advisory."
  lessons:
  - lesson_type: documentation
    summary: "An agent-payload inventory is not a complete distributed-guidance inventory: docs copied by maid init and live maid howto output are separate user-facing surfaces that require their own behavioral checks."
    tags:
