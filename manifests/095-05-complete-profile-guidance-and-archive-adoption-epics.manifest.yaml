# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Complete named verify-profile adoption in init-distributed human guidance 
  and archive the consumed 092 and 095 adoption epics
type: refactor
created: '2026-08-07T13:17:35Z'
metadata:
  epic: 095-00-onboarding-entry-point-wiring
  tags:
  - adoption
  - cli-guidance
  - generated-docs
  - draft-inventory
  - planning-hygiene
  priority: high
description: |
  Children 095-01 through 095-04 delivered newcomer entry-point wiring, named
  verify profiles, repository adoption, and generated hook/agent-payload
  migration. A final repository audit found two active human-guidance surfaces
  outside 095-04's twelve-file agent-payload inventory: `maid howto` still
  presents raw packet commands as the bounded-retry instruction, and the
  workflow document copied by `maid init` still presents the literal handoff
  stack as the final command.

  Complete the named-profile path without hiding how profiles expand. The
  actionable howto retry command becomes
  `maid verify --profile agent-retry --since <baseline>`. Handoff guidance
  presents `--profile handoff` as the command and retains the literal
  `--summary --require-plan-lock --require-red-evidence` stack only as a
  labelled expansion. The init-distributed workflow uses
  `maid verify --profile handoff --since <baseline>`. Because that generated
  document changes, advance `INSTRUCTION_PAYLOAD_VERSION` beyond
  `2026.08.07.1` so existing installations report the workflow payload stale.

  Close the planning inventory at the same boundary. The unmarked 092 and 095
  epic drafts are both fully consumed, and 095 explicitly recorded their
  marker/inventory reconciliation as follow-up work. Preserve both stable paths
  as `# archive-kind: consumed-draft-epic` pointers, set their status to
  archived, list every promoted child, and register both in the existing
  consumed-epic inventory contract. Do not delete historical epic paths.

  Outcome evidence digestion: the refreshed Outcome index reported recurring
  plan-lock, documentation, agent-skill, and planning-hygiene lessons. The
  relevant 095-04 lessons require auditing source and distributed inventories
  separately, freezing exact actionable commands, and preserving historical
  red evidence when shared tests change. This child therefore covers the CLI
  output, source/package/installed workflow parity, payload version, and archive
  pointers behaviorally. The stale enrichment digest was rejected and plain
  deterministic insights were used instead.

  Release version bumping, tagging, publishing, and changing the documented
  `maid-runner>=2.25.0` floor remain release work. Reference documentation that
  explains individual flags or shows a profile's labelled expansion is not an
  actionable incantation and remains literal.
temptations:
- risk: Do not claim all generated guidance is migrated after scanning only 
    agent payload directories.
  instead: Exercise the source, packaged, and freshly installed workflow 
    document, plus the live maid howto output.
- risk: Do not remove literal flag expansions that explain profile behavior.
  instead: Make the named profile the actionable command and retain literal 
    flags only as explicitly labelled expansion/reference text.
- risk: Do not hand-edit maid_runner/docs independently from the canonical docs 
    source.
  instead: Edit docs/draft-manifest-workflow.md, run make sync-agent-payloads, 
    and assert byte-for-byte source/package/installed parity.
- risk: Do not change init-distributed guidance without invalidating stale 
    payload detection.
  instead: Advance INSTRUCTION_PAYLOAD_VERSION and test it against the 095-04 
    version.
- risk: Do not delete consumed epic drafts or leave 092 invisible to the formal 
    inventory merely because the original files lacked draft markers.
  instead: Preserve both paths as archived pointers and register their complete 
    child lists in CONSUMED_EPICS.
