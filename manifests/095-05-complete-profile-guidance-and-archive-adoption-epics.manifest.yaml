    - payload-sync
    - onboarding
    paths:
    - docs/draft-manifest-workflow.md
    - maid_runner/docs/draft-manifest-workflow.md
    - maid_runner/cli/commands/howto.py
  - lesson_type: workflow
    summary: "Focused tests missed three shared howto expectations and indirect historical lock owners; full-suite and strict handoff verification remain necessary to expose validation-chain ownership beyond direct maid manifests output."
    tags:
    - plan-lock
    - full-suite
    - handoff
    paths:
    - tests/test_packet_skill_guidance_docs.py
    - tests/test_plan_lock_docs.py
    - tests/test_review_convergence_guidance.py
  - lesson_type: compatibility
    summary: "Changing an init-distributed workflow document requires an instruction payload bump even when runtime code is unchanged; the separately documented 2.25 executable floor still belongs to release delivery rather than epic closure."
    tags:
