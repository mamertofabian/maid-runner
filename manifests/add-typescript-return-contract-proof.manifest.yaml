outcome:
  status: completed
  completed_at: '2026-09-30T11:54:00Z'
  summary: 'Implemented the first compiler-return proof slice: frozen typed results, a source-file
    batch adapter, and fresh TypeScript-checker proofs through the existing bridge. Compiler
    results remain separate from syntactic artifacts; configuration and validator activation
    are deferred to the next slice. The original CSV component also matched through a read-only
    API probe with its local TypeScript 5.8.3 and effective strictNullChecks false.'
  rationale: Bidirectional checker assignability resolves module-scoped expected types without
    display-string equality or source edits. Source and request fingerprints protect provenance.
    Unsupported or unchecked targets, malformed replies and tooling failures are explicit unavailable
    results.
  lessons:
  - lesson_type: validation
    summary: Compiler semantic diagnostics can be suppressed by noCheck, source directives and
      library-check flags. Return proofs must reject unchecked targets, isolate synthetic aliases
      from trailing directives, and prevent target diagnostic skipping. Independent reviews
      reproduced false matches before these protections were added.
    tags:
    - typescript
    - compiler
    - maid-runner-feedback
    paths:
    - maid_runner/core/ts_compiler_resolver.cjs
    - tests/core/test_ts_return_contracts.py
  - lesson_type: validation
    summary: A source hash alone does not bind a semantic proof to the expected contract. Include
      source identity, owning config and exact expected-type batch in a request fingerprint
      and reject stale replies across those identities.
    tags:
    - typescript
    - provenance
    - maid-runner-feedback
    paths:
    - maid_runner/core/ts_return_contracts.py
    - tests/core/test_ts_return_contracts.py
