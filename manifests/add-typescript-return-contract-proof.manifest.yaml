# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Add a typed, compiler-backed TypeScript return-contract proof adapter without activating
  validator inference.
type: feature
created: '2026-09-30T11:30:17Z'
description: 'First implementation slice of the approved compiler-backed return-contract design.
  Keep syntactic artifact collection and validators unchanged. Add frozen data records and a
  public proof adapter; use the existing local Node/TypeScript bridge with command checkReturnContracts
  in one-shot and session modes. A transport callable accepts serialized JSON and returns serialized
  bridge output or None, allowing deterministic boundary tests without mocking TypeScript types.


  The request carries projectRoot, sourcePath, configPath, source, sourceSha256 and expectations
  (name, line, expectedType). The bridge envelope stays {ok: true, result: ...}; result contains
  sourceSha256, compilerVersion, configPath, strictNullChecks, and items (name, line, status,
  inferredType, diagnostics). Validate reply provenance and identity before trusting matched
  results. Any unavailable infrastructure or malformed response produces one unavailable item
  per expectation with a diagnostic; no syntax fallback.


  Use the explicit owning tsconfig and require source inclusion in its parsed file list. Create
  a fresh compiler program per request, overlay supplied UTF-8 source in memory, append collision-free
  exported expected-type aliases, and compare types bidirectionally using the checker. Require
  one inert, resolved type expression. Reject target-file semantic/syntax errors, top-level
  any/unknown/error types, annotated functions, overloads, unsupported declarations, and name/line
  ambiguity. Respect effective strictNullChecks rather than claiming stronger nullability. Never
  write, emit, evaluate source, install dependencies, or inherit NODE_OPTIONS preloads for proof
  requests. Preserve legacy import/reexport resolution behavior and the five-second timeout.


  An executable temporary SDK spike with TypeScript 5.9.3 passed eight semantic assertions and
  proved the overlay leaves disk source unchanged. Plain Outcome insights informed real compiler
  checks, explicit unavailable results, and dedicated tests instead of editing previously locked
  shared tests. Manifest-derived recall returned no related completed Outcomes; no feature-specific
  historical claims are assumed. Configuration, E309 registration, validator activation, snapshots
  and consumer changes are separate later slices.

  Request and response include requestSha256, a SHA-256 digest of compact UTF-8 JSON [sourceSha256,
  absolute normalized sourcePath, absolute normalized configPath, [[name, line, expectedType],
  ...]]. Verify this fingerprint to reject same-source stale replies for different expected
  contracts or source identities. Requests with compiler noCheck or an effective compiler-parsed
  @ts-nocheck directive produce unavailable results because semantic diagnostics cannot establish
  proof.


  Declaration files are unsupported for implementation-return proofs. Ensure skipDefaultLibCheck
  and skipLibCheck cannot suppress target semantic diagnostics; these performance flags may
  be disabled for the fresh proof program without strengthening effective strictNullChecks.

  '
temptations:
- risk: Do not compare checker display strings or accept only one-way assignability.
  instead: Compare actual and expected types bidirectionally in the same checker and test structural
    aliases plus wider unions.
- risk: Do not convert errors, any, unknown, missing tooling or stale replies into a match.
  instead: Reject each unsafe proof with typed unavailable items and nonempty diagnostics; validate
    source hash and item identities.
- risk: Do not write aliases into user files or execute project code.
  instead: Use a compiler-host overlay, noEmit, inert type-expression parsing and sanitized
    Node preload environment.
- risk: Do not reuse stale semantic programs or guess a referenced root configuration.
  instead: Parse the explicitly supplied owning config and create a fresh program for each source-file
    batch.
