  summary: "Shipped RecordedDetectionEvidenceSource plus the public knockout.cached_detecting_nodeids accessor, reading recorded detecting-nodeids from the implemented 121-22 cache."
  rationale: "Child 2 of the chain-merge-defragmentation epic (detection half; coverage source deferred). Corrects an earlier false status that called this 'blocked on unbuilt 121-21/122 caches' — the caches are implemented and passing on this perf-based branch. The accessor reads only fresh cache entries (content-digest key), so stale evidence is never returned and a cold cache yields UNKNOWN."
