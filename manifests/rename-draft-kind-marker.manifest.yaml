          name: cmd_manifest
          args:
            - name: args
              type: argparse.Namespace
          returns: int
          description: "Creates implementation drafts with '# manifest-kind: implementation' when output is under a drafts directory, and promotion preserves that marker."
    - path: maid_runner/core/manifest_from_diff.py
