      summary: "When a behavior is described as a writer contract, cover every public writer path, not only the first CLI branch that motivated the change. The initial implementation updated manifest create but missed manifest from-diff; independent review caught that the from-diff writer still produced unmarked inactive inventory. The fix added direct write_from_diff_manifest coverage and CLI from-diff coverage that both assert the line-one marker and parent-chain inactive diagnostics."
      tags:
