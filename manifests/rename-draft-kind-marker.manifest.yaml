        - tests/core/test_manifest_from_diff.py
        - tests/cli/test_manifest_from_diff_cmd.py
    - lesson_type: compatibility
      summary: "Marker migrations can be backward-compatible for upgraded readers without being forward-compatible for older binaries. This change intentionally makes new MAID accept legacy draft-kind comments, but older MAID versions may reject newly generated manifest-kind drafts until upgraded."
