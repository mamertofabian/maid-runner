      artifacts:
        - kind: function
          name: prepend_manifest_header
          args:
            - name: rendered
              type: str
          returns: str
          description: "Returns rendered manifest YAML with the canonical banner inserted after a leading manifest-kind, legacy draft-kind, or archive-kind marker, preserving the lifecycle marker as line one."
    - path: maid_runner/core/chain.py
      artifacts:
        - kind: class
          name: ManifestChain
          description: "Manifest chain reader whose inactive-manifest diagnostics accept legacy draft-kind markers and canonical manifest-kind markers."
        - kind: method
          name: inactive_manifest_diagnostics
          of: ManifestChain
          args: []
          returns: list[ValidationError]
          description: "Reports E109 with copyable manifest-kind marker choices for draft inventory while retaining archive guidance for archives."
    - path: maid_runner/cli/commands/manifest.py
