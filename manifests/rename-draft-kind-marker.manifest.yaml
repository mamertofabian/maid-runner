# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Rename draft-kind lifecycle comments to manifest-kind while preserving legacy marker compatibility"
type: fix
created: "2026-09-11T00:53:01Z"
metadata:
  tags:
    - developer-experience
    - manifest-lifecycle
    - compatibility
  priority: medium
description: |
  The inactive manifest marker currently uses the comment key
  `# draft-kind: implementation`, and promotion preserves that comment in the
  active manifest. The behavior is functionally safe, but the word "draft"
  reads stale once a manifest has been promoted or implemented.

  Keep the lifecycle value vocabulary unchanged and rename only the marker key:
  child implementation drafts use `# manifest-kind: implementation`; epic
  planning inventory uses `# manifest-kind: epic`. Existing `# draft-kind: ...`
  comments remain accepted so repos upgrading from older MAID versions continue
  to validate without rewriting historical manifests. Archive inventory keeps
  `# archive-kind: ...`; unifying archive markers is out of scope for this
  narrow copy fix.

  Expected red phase: focused tests fail because manifest creation, header
  insertion, inactive diagnostics, and promotion examples still expect or emit
  `# draft-kind: implementation`.
temptations:
  - risk: "Do not reject legacy '# draft-kind:' comments while renaming the emitted marker."
    instead: "Accept both legacy draft-kind and new manifest-kind in reader paths, and emit only manifest-kind from create and from-diff writers and diagnostics."
  - risk: "Do not collapse implementation drafts and epic planning inventory into one vague draft value."
    instead: "Keep the values implementation and epic; the fix is the marker key, not the lifecycle taxonomy."
  - risk: "Do not widen this into archive marker migration or historical manifest churn."
    instead: "Leave archive-kind and existing committed marker comments alone except where tests and docs describe the canonical future spelling."
files:
