  rationale: "The old marker key was functionally safe but confusing after promotion because active manifests preserved a comment containing the word draft. The change keeps the value vocabulary intact: implementation drafts and epic planning inventory remain distinct values, while the marker key becomes lifecycle-neutral. Existing repositories remain readable because the chain and header insertion paths still recognize legacy draft-kind comments."
  lessons:
