- uv run python -m pytest -q tests/cli/test_enrich_stale_digest_flag_cmd.py tests/cli/test_enrich_cmd.py tests/cli/test_insights_theme_map_cmd.py tests/core/test_outcome_enrichment.py tests/core/test_outcome_enrichment_quality.py tests/test_insights_skill_guidance.py tests/test_planner_theme_map_guidance.py tests/test_self_improvement_digest_guidance.py
