  - path: tests/cli/test_enrich_stale_digest_flag_cmd.py
    artifacts:
    - kind: test_function
      name: test_stale_digest_rejected_without_any_allow_flag
      args: []
      returns: None
      description: enrich validate, enrich render, and insights --theme-map all reject a source_generated_from mismatch with no waiver flags.
    - kind: test_function
