schema: "2"
goal: Prepare maid-runner 2.29.0 minor version metadata for Antigravity support
type: feature
created: "2026-11-26T09:40:41Z"
supersedes:
  - bump-version-2.28.2
description: |
  Advance the locally prepared, unpublished 2.28.2 package metadata on
  release/v2.next to minor version 2.29.0 for Google Antigravity support and
  keep pyproject metadata, the editable uv lock, runtime and CLI version,
  roadmap, and changelog links aligned.

  Because v2.28.1 is the latest published git tag and 2.28.2 was never tagged
  or published before the three Antigravity commits (c92ac672, ea952ea0,
  ff4e922e) landed on release/v2.next, fold the post-v2.28.1 TypeScript
  named-function re-export fix (90430b5a) into a dated 2.29.0 section alongside
  Added entries for Antigravity PreToolUse scope-check support, repo-level
  maid init --tool antigravity payloads, and user-level maid skills
  install/uninstall delivery under ~/.gemini/config/skills/maid-onboard. Point
  [Unreleased] at v2.29.0...HEAD and [2.29.0] at v2.28.1...v2.29.0 while
  removing the unpublished 2.28.2 heading and compare link, matching the
  2.18.0, 2.22.0, and 2.28.0 precedent. Also include antigravity in the
  documented maid init --tool choices in docs/ROADMAP.md.

  Supersede bump-version-2.28.2 and replace its version-pinned release test
  with tests/integration/test_release_2_29_0.py so the full test suite retains
  no stale 2.28.2 assertions. Refresh the shared
  snapshot-cli-commands--main-2.lock.json through maid plan revise --no-run
  after replacing that test while preserving existing hashes and its null red
  evidence. Keep maid_runner/__version__.py dynamic and
  tests/integration/test_library_api.py intact.
temptations:
  - risk: "Do not leave an unpublished [2.28.2] section or v2.28.2 compare target in CHANGELOG.md."
    instead: "Fold the post-v2.28.1 TypeScript function re-export fix into [2.29.0] alongside Antigravity Added entries and link [2.29.0] to compare/v2.28.1...v2.29.0."
  - risk: "Do not update only pyproject.toml while leaving uv.lock, CLI output, CHANGELOG.md, or docs/ROADMAP.md stale."
    instead: "Regenerate uv.lock through uv and validate package, lock, __version__, maid --version, changelog, and roadmap mirrors (including maid init --tool choices) together."
  - risk: "Do not retain tests/integration/test_release_2_28_2.py or hand-edit .maid/plan-locks/snapshot-cli-commands--main-2.lock.json."
    instead: "Supersede bump-version-2.28.2, delete tests/integration/test_release_2_28_2.py, and refresh snapshot-cli-commands--main-2.lock.json via maid plan revise --no-run."
  - risk: "Do not overclaim Antigravity auto-detection in maid init --tool auto or heuristic directory walking in maid hook scope-check."
    instead: "Document explicit maid init --tool antigravity (.agents/ and AGENTS.md), explicit stdin cwd plus --format antigravity in maid hook scope-check, and ~/.gemini/config/skills/maid-onboard in maid skills install/uninstall."
