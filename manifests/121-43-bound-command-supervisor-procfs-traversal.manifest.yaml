  completed_at: "2026-08-13T13:52:03Z"
  summary: "The Linux command subreaper traverses only the owned process tree through every /proc/<pid>/task/<tid>/children entry, repeats KILL scans for late reparenting, and fails if cleanup is not acknowledged. Global /proc enumeration is eliminated."
  rationale: "Global procfs scans cost 11.19 seconds per 100 trivial commands and raced with unrelated process churn. Kernel-provided child lists preserve ownership with bounded work, but independent review correctly found that every creating thread must be traversed."
  lessons:
