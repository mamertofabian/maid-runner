# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Traverse only owned procfs children in the Linux command supervisor"
type: refactor
created: "2026-08-13T13:05:22Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags: [performance, process-ownership, test-execution, procfs]
description: |
  Evolve the 121-14 descendant-ownership mechanism without changing its public
  signature or fail-closed guarantees. The Linux subreaper currently discovers
  descendants by enumerating every process under /proc before launch and during
  cleanup. That unrelated global work costs 11.19 seconds for 100 trivial
  supervised commands and adds a race surface under xdist process churn.

  Read each owned process's direct children from
  /proc/<pid>/task/<pid>/children and recursively traverse only that tree.
  A child that exits during traversal is harmless; a malformed child identity
  or unreadable procfs for a still-owned process remains an explicit ownership
  failure. Repeated cleanup scans still catch children reparented to the
  subreaper. Preserve detached-session signaling, TERM/KILL escalation,
  acknowledgement, timeout semantics, and missing-status failures from 121-14.
  Chain merging is sufficient because this narrows the internal discovery
  mechanism without changing _run_test_command's signature or superseding the
  broader knockout worker contract.
temptations:
  - risk: "Do not bypass the descendant-owning supervisor to win the microbenchmark."
    instead: "Keep the subreaper and fail-closed cleanup contract; replace only global procfs enumeration with recursive owned-child traversal."
  - risk: "Do not treat every procfs read race as success."
    instead: "Tolerate only a vanished process; malformed child IDs and other read failures remain explicit ownership errors."
  - risk: "Do not replace runtime ownership with a static source assertion alone."
    instead: "Execute the real supervisor while global /proc listing is denied, then retain the detached-child and cleanup adversaries."
