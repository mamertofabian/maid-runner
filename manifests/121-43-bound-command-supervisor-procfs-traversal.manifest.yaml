      paths:
        - maid_runner/core/_test_command_execution.py
    - lesson_type: validation-trust
      summary: "Linux children files are per task, not merely per process leader; a real detached child created by a non-main thread is required regression coverage."
      tags: [linux, threads, fail-closed]
      paths:
