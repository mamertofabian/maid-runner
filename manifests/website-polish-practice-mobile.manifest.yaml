# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Polish the MAID in practice section on phones: uncovered private-projects heading and two-row stats"
type: fix
created: "2026-10-08T12:46:35Z"
metadata:
  planning_state: completed
  tags:
    - website
    - static-site
    - responsive
    - polish
  priority: medium
description: |
  Final Impeccable polish pass after the typeset, harden, and distill follow-ups
  from the 2026-10-08 critique. A full desktop and phone render sweep (keyboard
  walk, console, layout shift, overflow) found two defects, both present at
  the pre-critique baseline 3ce5bb3d:

  - At 560px and below, the "Private production projects" shield icon covers
    the start of its heading (756-896 px² of overlap). The phone rule
    `.practice-card { padding: 18px 16px 16px }` overrides the desktop
    `.practice-card-private { padding-top: 54px }` that reserves room for the
    absolutely positioned icon.
  - At 560px and below, the four featured MAID Runner stats stack in a single
    column (four rows, about 320px tall), which the critique flagged as
    avoidable scrolling for phone visitors. A grid change alone does not fit:
    at 280-320px "verification" and "Python 3.10–3.14" are wider than half a
    card. The clean fix, prototyped against these tests, pairs two columns
    with tighter phone stat padding (about 10px 9px) and gap (8px), 18px stat
    values, and hyphens: auto; mid-word overflow-wrap: anywhere is not
    acceptable for stat values.

  Fix both in website/styles.css only, inside the existing
  `@media (max-width: 560px)` block: keep the private card's top padding
  large enough for the icon on phones, and give the featured and compact
  practice stats two columns on phones (the compact three-stat grids then take
  two rows). The tests assert the icon stays visible at full size inside its
  card above the heading, at most two stat rows per grid on phones, every stat
  inside its grid, and no page-level horizontal overflow. Markup, copy, colors, and section
  order stay unchanged; no new media conditions (the typography browser test
  pins the allowed set).

  This is an additive chain-merge onto the active website contract
  (website-distill-why-section and website-install-trust); it supersedes
  nothing. Rendered-geometry assertions live in a dedicated browser test file
  so no existing plan lock's sealed test files change.
temptations:
  - risk: "Do not hide the overlap by shrinking or removing the shield icon, or by moving it with a transform."
    instead: "Restore the reserved top padding for .practice-card-private inside the phone breakpoint so the icon keeps its size and place above the heading."
  - risk: "Do not fit two stat columns by shrinking stat text below the type floor, by mid-word breaking with overflow-wrap: anywhere, or by fixed-width columns that spill out of the card."
    instead: "Inside the phone breakpoint, use two minmax(0, 1fr) columns with an 8px gap, about 10px 9px stat padding, 18px values with hyphens: auto, and labels on the existing tokens; rerun tests/test_website_rendered_typography.py."
  - risk: "Do not add a new media query for these phone rules."
    instead: "Edit the existing @media (max-width: 560px) block that already holds the conflicting rules."
