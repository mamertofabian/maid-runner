      artifacts:
        - kind: test_function
          name: test_private_projects_icon_never_covers_its_heading
          args: []
          returns: None
          source_scenario: "A visitor on any screen width reads the Private production projects card."
          actions:
            - type: api_call
              subject:
                function: page.evaluate
          expected:
            behavior: "At widths 280 through 1920 the private-projects shield icon stays visible at its full size (at least 24 by 28px), sits inside its card above the heading, and never overlaps the heading."
        - kind: test_function
          name: test_featured_practice_stats_fit_in_two_rows_on_phones
          args: []
          returns: None
          source_scenario: "A phone visitor scrolls past the MAID Runner dogfooding stats."
          actions:
            - type: api_call
              subject:
                function: page.evaluate
          expected:
            behavior: "At 280, 320, 390, and 560px the four featured MAID Runner stats and each compact stats grid occupy at most two rows, every stat stays inside its grid, no stat value or label overflows its card, and the page does not scroll horizontally."
  read:
    - website/index.html
    - manifests/website-distill-why-section.manifest.yaml
validate:
  - uv run python -m pytest -q tests/test_website_practice_mobile.py tests/test_website_rendered_typography.py tests/test_website_static_contract.py tests/test_website_distilled_story.py tests/test_website_install_section.py
  - uv run maid validate manifests/website-polish-practice-mobile.manifest.yaml --mode behavioral --quiet
  - uv run maid validate manifests/website-polish-practice-mobile.manifest.yaml --mode schema --quiet
