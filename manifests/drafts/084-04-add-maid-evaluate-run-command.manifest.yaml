# draft-kind: child
schema: "2"
goal: "Add `maid evaluate run <manifest>` — a deterministic, advisory, after-action evaluation of a completed MAID run that reports provenance, evidence-based revision classification, red-evidence status, Outcome corroboration, and incident counts as evidence-cited findings in text and --json, with every missing input reported as an explicit unknown instead of a fabricated pass"
type: feature
created: "2026-07-04T03:44:00Z"
metadata:
  epic: 084-00-after-action-run-evaluation
  tags:
    - run-evaluation
    - agent-provenance
    - plan-lock
    - outcome-records
    - anti-gaming
    - cli
  priority: medium
description: |
  First consumer of the run-evidence trail. Depends on 084-01 (Outcome
  provenance), 084-02 (lock provenance), and 084-03 (contract deltas);
  degrades honestly when their data is absent on a given run.

  Pinned decisions (do not redesign):

  1. Policy is a pure core module separated from I/O. New module
     maid_runner/core/run_evaluation.py exposes `RunFinding` (frozen:
     `severity` in {"info", "warning", "attention"}, `category` in
     {"provenance", "plan-discipline", "red-evidence",
     "outcome-corroboration", "integrity"}, `summary: str`,
     `evidence: tuple[str, ...]` — pointers such as
     "plan-lock:revision-3", "outcome:validation[1]",
     "incident:<id>"; every warning/attention finding MUST cite at least
     one evidence pointer), `RunEvaluation` (frozen aggregate, fields
     declared below), and `evaluate_run(manifest_path, project_root)`
     which loads manifest, lock, and incident evidence and returns the
     evaluation. It never calls a model, never mutates anything, and
     never gates: it is a report generator.

  2. Revision classification is delta-evidence only, never
     reason-strings. Per revision: no stored ContractDelta ->
     "unclassified"; all-empty delta -> "neutral" (e.g. formatting-only
     test-hash refresh); delta with additions only (removals empty after
     excluding read-section file entries) -> "strengthening"; any removal
     among artifacts, edit/create file entries, or validate commands ->
     "narrowing". Narrowing revisions produce an "attention" finding
     citing the revision; unclassified ones produce an "info" finding
     stating that classification evidence predates 084-03. Reason strings
     appear in findings only as quoted context, never as classifier
     input.

  3. Outcome corroboration checks claims against contract: each
     outcome.validation evidence command is normalized and matched
     against the manifest's validate commands. Cited commands not in the
     manifest's validate list are reported (info) as uncorroborated
     extras; manifest validate commands with no cited evidence are
     reported (warning) when the outcome status is "completed". A missing
     outcome section on a lock-bearing manifest is a warning; the
     evaluator never re-runs commands (after-action, read-only).

  4. Provenance resolution order: outcome.agent first, then lock agent,
     then latest revision agent; the chosen source is recorded. Absent
     provenance is a "warning" finding (permanently anonymous run), not
     an error.

  5. Red evidence: "valid" when the lock's red_evidence parses and shows
     a genuine red per existing plan_lock semantics, "invalid" when
     present but unusable, "missing" when the lock has none, "no-lock"
     when the manifest has no plan lock. Incidents: count stored
     incidents whose record references this manifest slug or path
     (read-only via maid_runner/core/incidents.py listing).

  6. CLI: new command module maid_runner/cli/commands/evaluate.py with
     `cmd_evaluate` dispatching subcommand `run <manifest> [--project-root]
     [--json] [--quiet]`, registered in _main.py following the lazy
     dispatch pattern. Structured data first: text and JSON render the
     same RunEvaluation. Exit 0 regardless of findings (advisory); exit
     nonzero only for input errors (missing/unparseable manifest), fail
     loud with the path in the message. No composite score anywhere.
     Registering a top-level command trips the command-docs consistency
     check (067-01 outcome lesson), so README.md gets a command-reference
     row in the same change.

  RunEvaluation fields (all frozen): manifest_path: str,
  manifest_slug: str, provenance: Optional[AgentProvenance],
  provenance_source: Optional[str] ("outcome" | "plan-lock" |
  "plan-lock-revision"), outcome_status: Optional[str],
  outcome_uncorroborated_commands: tuple[str, ...],
  unevidenced_validate_commands: tuple[str, ...], lock_present: bool,
  red_evidence_status: str, revisions_total: int,
  revisions_strengthening: int, revisions_neutral: int,
  revisions_narrowing: int, revisions_unclassified: int,
  incidents_total: int, findings: tuple[RunFinding, ...].

  Planned behavioral tests (red phase pending — handoff stops before
  tests): tests/core/test_run_evaluation.py builds temp projects with
  synthesized locks/outcomes and asserts: a fully-evidenced clean run
  (provenance, valid red, delta-bearing strengthening revision,
  corroborated outcome) yields the expected counts and only info
  findings; a revision whose delta removes a validate command is
  classified narrowing with an attention finding citing
  "plan-lock:revision-N"; pre-delta revisions count as unclassified with
  an info finding; missing provenance yields the anonymity warning;
  outcome citing a command absent from manifest validate lands in
  outcome_uncorroborated_commands; a completed outcome citing none of
  the manifest validate commands yields the unevidenced warning; no-lock
  and missing-red cases report the exact red_evidence_status values; an
  incident referencing the manifest slug increments incidents_total with
  an integrity finding. tests/cli/test_evaluate_run_cmd.py asserts: text
  and --json render the same evaluation content; exit 0 with findings
  present; exit nonzero with a path-bearing error for a missing
  manifest; --quiet suppresses info findings in text while JSON stays
  complete; the README command row exists (command-docs consistency).
temptations:
  - risk: "Do not classify revisions from reason strings or outcome prose — the agent under evaluation wrote them."
    instead: "Classify exclusively from stored ContractDelta evidence; quote reasons in findings as context only, and report unclassified when deltas are absent."
  - risk: "Do not emit a composite score, grade, or verdict field to make output feel conclusive."
    instead: "Report per-dimension counts and evidence-cited findings; interpretation stays with the reader (and the 084-06 review pipeline)."
  - risk: "Do not skip dimensions silently when evidence is missing (no lock, no outcome, pre-delta revisions)."
    instead: "Every missing input becomes an explicit status value or finding — no-lock, missing, unclassified — so absence is visible."
  - risk: "Do not wire evaluation into verify, validate, plan, or promote, or change any exit code based on findings."
    instead: "Advisory exit 0 always except input errors; the command is a read-only report generator."
  - risk: "Do not re-run validation commands or mutate state to 'check' outcome claims."
    instead: "After-action corroboration is command-list matching only; live re-validation stays with maid verify."
files:
  edit:
    - path: maid_runner/cli/commands/_main.py
      artifacts:
        - kind: function
          name: build_parser
          args: []
          returns: argparse.ArgumentParser
          description: "Parser exposes an evaluate command group with a run subcommand taking a manifest path plus --project-root, --json, --quiet."
    - path: README.md
      artifacts:
        - kind: attribute
          name: _evaluate_command_reference_row
          of: documentation
          type: markdown table row
          description: "Command reference row for maid evaluate run, required by the command-docs consistency test."
  read:
    - maid_runner/core/plan_lock.py
    - maid_runner/core/manifest.py
    - maid_runner/core/types.py
    - maid_runner/core/incidents.py
    - maid_runner/core/outcomes.py
    - manifests/drafts/084-01-add-agent-provenance-to-outcome-records.manifest.yaml
    - manifests/drafts/084-02-capture-agent-provenance-in-plan-locks.manifest.yaml
    - manifests/drafts/084-03-record-contract-deltas-in-lock-revisions.manifest.yaml
  create:
    - path: maid_runner/core/run_evaluation.py
      artifacts:
        - kind: class
          name: RunFinding
          description: "Frozen dataclass: one evidence-cited evaluation finding; warnings and attention findings must cite at least one evidence pointer."
        - kind: attribute
          name: severity
          of: RunFinding
          type: str
          description: "One of 'info', 'warning', 'attention'."
        - kind: attribute
          name: category
          of: RunFinding
          type: str
          description: "One of 'provenance', 'plan-discipline', 'red-evidence', 'outcome-corroboration', 'integrity'."
        - kind: attribute
          name: summary
          of: RunFinding
          type: str
          description: "Human-readable finding text; may quote revision reasons as context but never derives from them."
        - kind: attribute
          name: evidence
          of: RunFinding
          type: tuple[str, ...]
          description: "Evidence pointers such as 'plan-lock:revision-3', 'outcome:validation[1]', 'incident:<id>'."
        - kind: class
          name: RunEvaluation
          description: "Frozen dataclass: the complete deterministic after-action evaluation of one manifest run; fields per the pinned list in the description."
        - kind: attribute
          name: manifest_path
          of: RunEvaluation
          type: str
          description: "Project-relative path of the evaluated manifest."
        - kind: attribute
          name: manifest_slug
          of: RunEvaluation
          type: str
          description: "Slug of the evaluated manifest."
        - kind: attribute
          name: provenance
          of: RunEvaluation
          type: Optional[AgentProvenance]
          description: "Resolved provenance (outcome first, then lock, then latest revision) or None."
        - kind: attribute
          name: provenance_source
          of: RunEvaluation
          type: Optional[str]
          description: "'outcome', 'plan-lock', or 'plan-lock-revision'; None when anonymous."
        - kind: attribute
          name: outcome_status
          of: RunEvaluation
          type: Optional[str]
          description: "The manifest outcome status value, or None when no outcome section exists."
        - kind: attribute
          name: outcome_uncorroborated_commands
          of: RunEvaluation
          type: tuple[str, ...]
          description: "Outcome-cited validation commands not present in the manifest validate list."
        - kind: attribute
          name: unevidenced_validate_commands
          of: RunEvaluation
          type: tuple[str, ...]
          description: "Manifest validate commands with no outcome validation evidence on a completed outcome."
        - kind: attribute
          name: lock_present
          of: RunEvaluation
          type: bool
          description: "Whether a plan lock exists for the manifest."
        - kind: attribute
          name: red_evidence_status
          of: RunEvaluation
          type: str
          description: "'valid', 'invalid', 'missing', or 'no-lock'."
        - kind: attribute
          name: revisions_total
          of: RunEvaluation
          type: int
          description: "Total lock revisions."
        - kind: attribute
          name: revisions_strengthening
          of: RunEvaluation
          type: int
          description: "Revisions whose delta only adds (ignoring read-section file entries)."
        - kind: attribute
          name: revisions_neutral
          of: RunEvaluation
          type: int
          description: "Revisions with an all-empty stored delta."
        - kind: attribute
          name: revisions_narrowing
          of: RunEvaluation
          type: int
          description: "Revisions whose delta removes artifacts, edit/create file entries, or validate commands."
        - kind: attribute
          name: revisions_unclassified
          of: RunEvaluation
          type: int
          description: "Revisions without stored delta evidence (pre-084-03)."
        - kind: attribute
          name: incidents_total
          of: RunEvaluation
          type: int
          description: "Stored gaming incidents referencing this manifest."
        - kind: attribute
          name: findings
          of: RunEvaluation
          type: tuple[RunFinding, ...]
          description: "All findings, deterministic order: attention, warning, info; stable within severity."
        - kind: function
          name: evaluate_run
          args:
            - name: manifest_path
              type: Path
            - name: project_root
              type: Path
          returns: RunEvaluation
          description: "Read-only after-action evaluation: loads manifest, plan lock, and incidents; classifies revisions from deltas; corroborates outcome claims by command matching; reports missing evidence explicitly. Raises on missing/unparseable manifest (fail loud); degrades honestly on missing lock/outcome."
    - path: maid_runner/cli/commands/evaluate.py
      artifacts:
        - kind: function
          name: cmd_evaluate
          args:
            - name: args
              type: argparse.Namespace
          returns: int
          description: "Dispatches evaluate subcommands; run renders one RunEvaluation as text or --json from the same structured data, exits 0 regardless of findings, nonzero with a path-bearing message on input errors; --quiet drops info findings from text output only."
    - path: tests/core/test_run_evaluation.py
      artifacts:
        - kind: test_function
          name: test_clean_fully_evidenced_run_reports_expected_dimensions
          args: []
          returns: None
          description: "Provenance present, valid red, strengthening delta revision, corroborated completed outcome: counts match and only info findings appear."
        - kind: test_function
          name: test_delta_removing_validate_command_classified_narrowing_with_citation
          args: []
          returns: None
          description: "A revision delta with a removed validate command increments revisions_narrowing and yields an attention finding citing plan-lock:revision-N."
        - kind: test_function
          name: test_pre_delta_revisions_reported_unclassified_not_neutral
          args: []
          returns: None
          description: "Revisions without stored deltas count as unclassified with an info finding, never as neutral."
        - kind: test_function
          name: test_missing_provenance_yields_anonymous_run_warning
          args: []
          returns: None
          description: "No agent anywhere: provenance None, provenance_source None, and a provenance warning finding."
        - kind: test_function
          name: test_outcome_corroboration_separates_uncorroborated_and_unevidenced
          args: []
          returns: None
          description: "Outcome citing a foreign command populates outcome_uncorroborated_commands (info); a completed outcome citing no manifest validate command populates unevidenced_validate_commands (warning)."
        - kind: test_function
          name: test_red_evidence_status_values_for_missing_lock_and_missing_red
          args: []
          returns: None
          description: "No lock reports 'no-lock'; a lock without red evidence reports 'missing'; unusable red payload reports 'invalid'."
        - kind: test_function
          name: test_incident_referencing_manifest_counts_with_integrity_finding
          args: []
          returns: None
          description: "A stored incident referencing the manifest slug increments incidents_total and yields an integrity finding citing the incident id."
    - path: tests/cli/test_evaluate_run_cmd.py
      artifacts:
        - kind: test_function
          name: test_evaluate_run_text_and_json_render_same_evaluation
          args: []
          returns: None
          description: "Counts, statuses, and findings in text output match the --json payload for the same run."
        - kind: test_function
          name: test_evaluate_run_exits_zero_despite_findings
          args: []
          returns: None
          description: "Warnings and attention findings never change the advisory exit code 0."
        - kind: test_function
          name: test_evaluate_run_missing_manifest_fails_loud_with_path
          args: []
          returns: None
          description: "A nonexistent manifest exits nonzero with the offending path in the error message."
        - kind: test_function
          name: test_evaluate_run_quiet_drops_info_from_text_only
          args: []
          returns: None
          description: "--quiet removes info findings from text output while the JSON payload remains complete."
        - kind: test_function
          name: test_readme_documents_evaluate_command
          args: []
          returns: None
          description: "README command reference includes the maid evaluate row required by the command-docs consistency check."
validate:
  - uv run python -m pytest -q tests/core/test_run_evaluation.py tests/cli/test_evaluate_run_cmd.py
