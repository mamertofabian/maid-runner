# draft-kind: child
schema: "2"
goal: "Add an optional, additive `agent:` provenance block to manifest Outcome records — provider, model, client, skills, instructions fingerprint, source — carried through schema validation, parse/serialize round-trip, and the deterministic Outcome index, so every future completed run permanently records which agent produced it"
type: feature
created: "2026-07-04T03:41:00Z"
metadata:
  epic: 084-00-after-action-run-evaluation
  tags:
    - run-evaluation
    - agent-provenance
    - outcome-records
    - schema
  priority: medium
description: |
  `OutcomeRecord` (maid_runner/core/types.py) captures status, summary,
  rationale, lessons, review notes, and validation evidence, but nothing
  about who produced the run. Provenance cannot be reconstructed after the
  fact, so this child adds the capture surface first; consumers follow in
  084-04/084-05.

  Pinned decisions (do not redesign):

  1. `AgentProvenance` is a frozen dataclass in maid_runner/core/types.py,
     beside the other Outcome dataclasses. Fields: `model: str` (required
     anchor — the primary comparison key), `provider: Optional[str] = None`
     (e.g. "anthropic", "openai", "local"), `client: Optional[str] = None`
     (e.g. "claude-code", "codex-cli"), `skills: tuple[str, ...] = ()`
     (free-form "name@version" strings), `instructions_fingerprint:
     Optional[str] = None` (opaque hash of the instruction set), `source:
     Optional[str] = None` (how it was captured: "flags", "environment",
     "mixed"; agent-authored outcome YAML normally omits it).
     `OutcomeRecord` gains `agent: Optional[AgentProvenance] = None`.

  2. The schema change mirrors how 047-01 added OutcomeRecord: a new
     `AgentProvenance` definition in
     maid_runner/schemas/manifest.v2.schema.json with
     `additionalProperties: false`, `required: ["model"]`, and an optional
     `agent` property on the OutcomeRecord definition. A present block with
     a missing/empty `model`, unknown keys, or non-string skills entries is
     a schema error (fail loud); an absent block is valid everywhere and
     changes no existing behavior.

  3. Parse and serialize live where Outcome parse/serialize already lives
     (maid_runner/core/manifest.py). Round-trip must be lossless and
     omission-preserving: a manifest without `agent:` saves without one, a
     manifest with only `model` saves only `model` (no null-filled keys).

  4. The Outcome index carries provenance so 084-05 can group by it:
     `OutcomeIndexRecord` (maid_runner/core/outcomes.py) gains
     `agent: AgentProvenance | None`, populated from the manifest Outcome
     and round-tripped through the index JSON. Index schema stays
     backward-readable: an index written before this child loads with
     `agent` as None on every record. Recall and insights are NOT extended
     here (out of epic scope).

  5. docs/manifest-outcome-records.md documents the block with a worked
     example and the explicit note that provenance is optional, advisory,
     and never a gate.

  Planned behavioral tests (red phase pending — handoff stops before
  tests): tests/core/test_outcome_agent_provenance.py asserts:
  load_manifest parses a full `agent:` block into AgentProvenance with
  exact field values; a minimal block (model only) parses with defaults;
  save_manifest round-trips both losslessly and omits the block when
  absent; validate_manifest_schema rejects an agent block missing `model`,
  with unknown keys, and with a non-list skills value, and accepts a
  manifest with no agent block; build_outcome_index populates
  OutcomeIndexRecord.agent from a completed Outcome and leaves it None
  when absent; write_outcome_index/read_outcome_index round-trip the
  provenance; read_outcome_index accepts a pre-provenance index file and
  yields agent None. tests/test_manifest_outcome_docs.py additions pin the
  documented `agent:` example to the schema fields.
temptations:
  - risk: "Do not loosen the OutcomeRecord or AgentProvenance schema with additionalProperties true or a permissive object type to make parsing easy."
    instead: "Declare the exact closed definition with required model, and add explicit schema-rejection tests for unknown keys and missing model."
  - risk: "Do not serialize absent optional fields as nulls or empty lists, silently rewriting user manifests on save."
    instead: "Omission-preserving serialization mirroring _outcome_to_dict: emit only fields that were present, and test the round-trip byte-shape both ways."
  - risk: "Do not make missing provenance a warning anywhere in existing flows (validate, learn, save)."
    instead: "Absent agent blocks are fully silent; only maid evaluate (084-04) reports provenance gaps, as findings."
  - risk: "Do not extend recall or insights scoring with the new field in this child."
    instead: "Index inclusion only; consumers arrive in 084-05 with their own contract."
files:
  edit:
    - path: maid_runner/core/types.py
      artifacts:
        - kind: class
          name: AgentProvenance
          description: "Frozen dataclass: optional agent identity attached to Outcome records and plan locks — who produced a run."
        - kind: attribute
          name: model
          of: AgentProvenance
          type: str
          description: "Required anchor field, e.g. 'claude-opus-4-8' or 'gpt-5.5-codex'; the primary comparison key."
        - kind: attribute
          name: provider
          of: AgentProvenance
          type: Optional[str]
          description: "Model provider, e.g. 'anthropic', 'openai', 'local'."
        - kind: attribute
          name: client
          of: AgentProvenance
          type: Optional[str]
          description: "Agent client/harness, e.g. 'claude-code', 'codex-cli'."
        - kind: attribute
          name: skills
          of: AgentProvenance
          type: tuple[str, ...]
          description: "Skill identifiers in use, free-form 'name@version' strings; defaults to empty."
        - kind: attribute
          name: instructions_fingerprint
          of: AgentProvenance
          type: Optional[str]
          description: "Opaque fingerprint of the instruction set/system prompt version."
        - kind: attribute
          name: source
          of: AgentProvenance
          type: Optional[str]
          description: "Capture channel when CLI-captured: 'flags', 'environment', or 'mixed'; None for agent-authored outcome YAML."
        - kind: attribute
          name: agent
          of: OutcomeRecord
          type: Optional[AgentProvenance]
          description: "Optional provenance of the run that produced this Outcome; None when not recorded."
    - path: maid_runner/schemas/manifest.v2.schema.json
      artifacts:
        - kind: attribute
          name: AgentProvenance
          of: MAID Manifest v2 schema
          type: closed object definition requiring model
          description: "Strict definitions entry: required model string; optional provider, client, skills (string array), instructions_fingerprint, source; additionalProperties false."
        - kind: attribute
          name: agent
          of: OutcomeRecord schema definition
          type: optional AgentProvenance object
          description: "Optional provenance property on the Outcome record definition."
    - path: maid_runner/core/manifest.py
      artifacts:
        - kind: function
          name: load_manifest
          args:
            - name: path
              type: Union[str, Path]
          returns: Manifest
          description: "Parses an optional outcome.agent block into AgentProvenance; manifests without one load exactly as before."
        - kind: function
          name: save_manifest
          args:
            - name: manifest
              type: Manifest
            - name: path
              type: Union[str, Path]
          returns: None
          description: "Serializes outcome.agent losslessly and omission-preservingly: absent block emits no agent key, absent optional fields emit no keys."
    - path: maid_runner/core/outcomes.py
      artifacts:
        - kind: attribute
          name: agent
          of: OutcomeIndexRecord
          type: AgentProvenance | None
          description: "Provenance carried from the manifest Outcome into the deterministic index; None for pre-provenance records and pre-provenance index files."
    - path: docs/manifest-outcome-records.md
      artifacts:
        - kind: attribute
          name: _outcome_agent_provenance_section
          of: documentation
          type: markdown section
          description: "Documents the optional agent block with a worked example and the advisory-never-gate note, consistent with the schema fields."
  read:
    - maid_runner/schemas/__init__.py
    - manifests/047-01-add-manifest-outcome-schema.manifest.yaml
    - manifests/047-03-add-maid-learn-outcome-index.manifest.yaml
    - tests/test_manifest_outcome_docs.py
  create:
    - path: tests/core/test_outcome_agent_provenance.py
      artifacts:
        - kind: test_function
          name: test_load_manifest_parses_full_agent_provenance_block
          args: []
          returns: None
          description: "A complete agent block yields AgentProvenance with exact provider, model, client, skills tuple, instructions_fingerprint, and source values."
        - kind: test_function
          name: test_load_manifest_parses_minimal_agent_block_with_defaults
          args: []
          returns: None
          description: "An agent block with only model parses with None/empty defaults for every other field."
        - kind: test_function
          name: test_save_manifest_round_trips_agent_block_omission_preserving
          args: []
          returns: None
          description: "Save/load round-trip is lossless; absent block emits no agent key and a model-only block emits only model."
        - kind: test_function
          name: test_schema_rejects_invalid_agent_blocks_and_accepts_absent
          args: []
          returns: None
          description: "validate_manifest_schema errors on missing model, unknown keys, and non-list skills; a manifest without an agent block stays valid."
        - kind: test_function
          name: test_outcome_index_carries_agent_provenance_round_trip
          args: []
          returns: None
          description: "build_outcome_index populates OutcomeIndexRecord.agent from a completed Outcome (None when absent) and write/read round-trips it."
        - kind: test_function
          name: test_read_outcome_index_accepts_pre_provenance_index
          args: []
          returns: None
          description: "An index JSON written without agent fields loads successfully with agent None on every record."
validate:
  - uv run python -m pytest -q tests/core/test_outcome_agent_provenance.py tests/test_manifest_outcome_docs.py
