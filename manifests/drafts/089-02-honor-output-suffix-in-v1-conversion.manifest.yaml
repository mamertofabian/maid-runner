# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Make convert_v1_file honor its output suffix and emit the self-describing header, so v1 migration cannot produce an unloadable or unlabeled v2 manifest"
type: fix
created: "2026-07-25"
metadata:
  planning_state: draft-inventory
  promotion_ready: false
  tests_status: planned-not-created
  sibling_drafts:
    - manifests/drafts/089-01-honor-output-suffix-in-save-manifest.manifest.yaml
  tags:
    - manifest-io
    - fail-loud
    - v1-compat
  priority: low
description: |
  Not promotion-ready: behavioral tests are planned but not written, and the red
  phase is unconfirmed. Land after 089-01, whose resolved design decides whether
  this writer should delegate to `save_manifest` instead of rendering YAML
  itself.

  Naming correction carried from the source review: the finding was reported
  against `migrate_v1_to_v2`, but no such symbol exists. The real entry point is
  `convert_v1_file` (`maid_runner/compat/v1_loader.py:136-153`), which writes
  `yaml.dump` output directly to a caller-supplied `output_path`:

  ```python
  def convert_v1_file(input_path, output_path=None):
      ...
      if output_path is None:
          output_path = input_path.parent / f"{slug}.manifest.yaml"
      output_path = Path(output_path)
      output_path.write_text(
          yaml.dump(v2_data, default_flow_style=False, sort_keys=False)
      )
      return output_path
  ```

  Two defects, both verified against the current tree:

  1. No suffix check. The derived default is `.manifest.yaml` and is safe, but an
     explicit `output_path` of `x.json` receives YAML that `load_manifest_raw`
     then rejects with a JSONDecodeError.
  2. No self-describing header. Unlike `save_manifest`
     (`maid_runner/core/manifest.py:469`), this writer never calls
     `prepend_manifest_header`, so every migrated v1 manifest lands without the
     086-01 banner. That is a second, independent gap: migrated manifests are
     precisely the ones most likely to be read by a teammate who has never seen
     MAID, which is the audience 086-01 exists for.

  Why this is separate from 089-01: this is v1 compatibility surface with its own
  consumers, and the header gap is unique to it. Deciding whether to fix by
  delegating to `save_manifest` or by adding a local suffix check depends on the
  signature 089-01 settles on, which is why this child is sequenced second.

  Scope boundary: this contract must not change the v1-to-v2 field conversion
  performed by `convert_v1_to_v2`. Only the write step is in scope.
temptations:
  - risk: "Do not fix only the suffix and leave the missing 086-01 banner; both defects are in this writer and a partial fix leaves migrated manifests unlabeled."
    instead: "Pin both: assert the migrated file round-trips through load_manifest_raw for its suffix, and assert the YAML output starts with the banner."
  - risk: "Do not alter convert_v1_to_v2 field mapping while touching this file; conversion correctness is out of scope and has its own coverage."
    instead: "Change only the write step, and assert converted field content is byte-identical to the pre-change output for a .yaml target."
files:
  edit:
    - path: maid_runner/compat/v1_loader.py
      artifacts:
        - kind: function
          name: convert_v1_file
          args:
            - name: input_path
              type: Union[str, Path]
            - name: output_path
              type: Union[str, Path, None]
              default: None
          returns: Path
          description: >-
            PLANNED. Write the format the output suffix implies, reject an
            unsupported suffix before any filesystem effect, and emit the
            086-01 self-describing header on YAML output.
  create:
    - path: tests/compat/test_v1_conversion_output_format.py
      artifacts:
        - kind: test_function
          name: test_convert_v1_file_json_suffix_round_trips_through_loader
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "PLANNED, NOT YET WRITTEN. A caller migrates a v1 manifest to an explicit .json output path."
          actions:
            - type: api_call
              subject:
                export: convert_v1_file
          expected:
            behavior: "load_manifest_raw parses the migrated file with strict json.loads and the converted goal and type survive."
        - kind: test_function
          name: test_convert_v1_file_yaml_output_carries_self_describing_header
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "PLANNED, NOT YET WRITTEN. A caller migrates a v1 manifest using the derived default output path."
          actions:
            - type: api_call
              subject:
                export: convert_v1_file
          expected:
            behavior: "The migrated manifest starts with the 086-01 banner and still round-trips through load_manifest_raw."
        - kind: test_function
          name: test_convert_v1_file_unsupported_suffix_is_rejected_without_writing
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "PLANNED, NOT YET WRITTEN. A caller passes an output path MAID cannot load."
          actions:
            - type: api_call
              subject:
                export: convert_v1_file
          expected:
            behavior: "convert_v1_file raises naming the unsupported suffix and leaves no file on disk."
  read:
    - maid_runner/core/manifest.py
    - maid_runner/core/snapshot.py
    - manifests/drafts/089-01-honor-output-suffix-in-save-manifest.manifest.yaml
validate:
  - uv run maid validate manifests/drafts/089-02-honor-output-suffix-in-v1-conversion.manifest.yaml --mode schema --quiet
