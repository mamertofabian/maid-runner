# draft-kind: epic
# promotion: split-before-promote
schema: "2"
goal: Materialize the manifest-chain merge as a first-class `maid chain merge`
  capability so a mature MAID repo can defragment per-file manifest history and
  consolidate behavioral tests without losing coverage or fault detection.
type: feature
created: "2026-08-13T21:45:00Z"
metadata:
  status: completed
  priority: medium
  origin: manifest-test-consolidation-design-2026-08-13
  backlog: docs/plans/maid-runner-manifest-test-consolidation.md
  tags:
    - chain-merge
    - defragmentation
