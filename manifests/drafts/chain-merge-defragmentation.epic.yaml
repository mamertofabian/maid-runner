    - artifact-coverage
    - snapshot
description: |
  COMPLETED EPIC. Every functional child and the final documentation child has
  been promoted with plan locks, behavioral contracts, implementation review,
  and Outcome evidence.

  ORIGIN

  From the 2026-08-13 manifest & test consolidation design note
  (docs/plans/maid-runner-manifest-test-consolidation.md). A mature MAID repo
  accumulates a long, fragmented per-file manifest chain and redundant behavioral
  tests. MAID's Merging Validator already merges a file's active chain into one
  effective contract in memory (ManifestChain.merged_artifacts_for); `maid chain
  replay` previews it; nothing MATERIALIZES it, and nothing decides where a merge
  is worth doing or proves a test collapse loses no protection. This epic adds
  the `maid chain merge` family that closes that gap.

  THE TWO HALVES

  A. Manifest-chain defrag (structural): report which files are fragmented, then
     materialize a snapshot that supersedes the chain and migrates provenance.
     Tests are untouched — this half is safe on its own.
  B. Test consolidation (behavioral): the report emits the acceptance bar
     (required coverage + required knockout detecting-nodeids); an equivalence
     gate proves a candidate consolidated test state is a superset before old
     tests are retired. Authoring the characterization module stays human/agent
     work — never auto-generated.

  DETERMINISM / EVIDENCE BOUNDARY (epic-wide invariant)

  The report and verdicts are pure aggregation over ManifestChain plus RECORDED
  runtime evidence. No child runs knockout or coverage to build a report; the
  execution-derived acceptance bar is read from the persisted evidence caches
  implemented in 121-21 / 121-22 (both promoted on this perf-based branch:
  .maid/cache/knockout-evidence-v1/*.json and .maid/cache/coverage-risk-v1.json).
  No child introduces a static/AST/control-flow
  analyzer (AGENTS.md Validator Hardening Constraints). No child auto-generates
  tests or claims a specific collapse is safe without the equivalence gate.

  BRANCH / INTEGRATION COUPLING

  This work is based on perf/full-deep-verification-speedups because
  detecting-nodeids AND the 121-21/121-22 evidence caches it reads exist there
  (all implemented on perf, absent on release/v2.next). It cannot merge to
  release/v2.next until perf lands. Confirm the integration sequence during
  hardening.

  Implemented child order:

  1. `chain-merge-fragmentation-report` — read-only `maid chain merge
     <file> --dry-run`: deterministic structural report (active/superseded/
     distinct/redundant counts, merged target contract, DEFRAG/LEAN/BLOCKED with
     structural reasons only) plus a DetectionEvidenceSource interface and an
     UNKNOWN default. Buildable now; no execution evidence.
  2. `chain-merge-evidence-sources` — concrete DetectionEvidenceSource and
     CoverageEvidenceSource that read the recorded 121-21/121-22 evidence caches,
     keyed per artifact identity, so the report and gate get a real, cheap
     acceptance bar. Depends on 121-21/121-22.
  3. `chain-merge-report-consumes-evidence` — wire the concrete sources into
     build_chain_merge_report so the acceptance spec carries real detecting-
     nodeids + coverage, and add the coverage/E710-derived BLOCKED verdict.
     Depends on children 1 and 2 (evolves child 1's contract).
  4. `chain-merge-apply-materialize` — `maid chain merge <file> --apply`:
     materialize the merged contract via the existing snapshot primitive and
     supersede the prior chain. Snapshots are not plan-locked, so there is no
     plan-lock/red-evidence to migrate; the real safety property is the
     artifact-preservation audit — apply refuses (writes nothing) if the fresh
     snapshot would drop a declared artifact, never auto-sealing the Grandfather
     lock. Manifest-side defrag; tests untouched. Depends on child 1.
  5. `chain-merge-equivalence-gate` — given the recorded acceptance bar and a
     candidate test state, assert coverage superset AND detection superset; a
     surviving gap is a blocking, error-coded finding. The safety gate for
     retiring old tests. Depends on children 2 and 3.
  6. `chain-merge-repo-wide-sweep` — `maid chain merge --all`: run the report
     across every production file and emit an aggregate DEFRAG/LEAN/BLOCKED
     summary — the finish-line view for a defrag program. Depends on child 1.
  7. `chain-merge-docs` — document the `maid chain merge` family in maid_specs.md
     (Consolidated Snapshots section), add a command reference, and reconcile the
     design note. Last.

  Completed child manifests:
  - manifests/chain-merge-fragmentation-report.manifest.yaml
  - manifests/chain-merge-evidence-sources.manifest.yaml
  - manifests/chain-merge-report-consumes-evidence.manifest.yaml
  - manifests/chain-merge-coverage-evidence.manifest.yaml
  - manifests/chain-merge-apply-materialize.manifest.yaml
  - manifests/chain-merge-equivalence-gate.manifest.yaml
  - manifests/chain-merge-repo-wide-sweep.manifest.yaml
  - manifests/chain-merge-docs.manifest.yaml

  Promotion prerequisites: the 121-21/121-22 evidence caches are already
  implemented, so child 2 is buildable now (an adapter that reads them); child 3
  cannot populate real acceptance until child 2 provides the sources; child 5
  cannot certify a collapse until children 2/3 supply the recorded bar; child 4
  may materialize the manifest side independently but must never claim the tests
  are safe. No child weakens an existing gate; each strengthens or is additive.
temptations:
  - risk: Do not let any child compute the acceptance bar by running knockout or
      coverage inline, turning a cheap report into a deep-verify pass.
    instead: Read execution-derived evidence only from the persisted 121-21/
      121-22 caches through the concrete evidence sources; report UNKNOWN when
      absent.
  - risk: Do not let `--apply` retire tests or claim a collapse is safe on its own.
    instead: Collapse only the manifest chain with `--apply` (tests untouched);
      retiring tests requires the child-5 equivalence gate to prove a superset.
  - risk: Do not auto-generate the consolidated characterization module.
    instead: Emit the acceptance bar; a human/agent authors the tests and the
      gate certifies them.
  - risk: Do not build a static analyzer to judge fragmentation or equivalence.
    instead: Aggregate ManifestChain primitives and recorded runtime evidence
      only.
