# draft-kind: child
schema: "2"
goal: "Capture this repository's strict-defaults migration debt as a regenerable backlog document, make every active manifest's validate commands coverage-safe (zero E900 under strict-delta), and plan the E710 burn-down batches so the 062-04 flip's dogfood gate has a measured path to green"
type: fix
created: "2026-07-04T07:30:00Z"
metadata:
  epic: 062-00-strict-by-default-validation-gates
  tags:
    - validation-trust
    - strict-defaults
    - migration
    - artifact-coverage
  priority: high
description: |
  Migration child of the strict-by-default epic, created because the 062-04
  release-flip implementation hit its own pinned dogfood blocker: with strict
  gates flipped on, this repository's own `uv run maid validate` fails the
  now-default artifact-coverage layer with widespread pre-existing `E710`
  (`ARTIFACT_NOT_EXECUTED_BY_TESTS`) findings and several `E900`
  (`INTERNAL_ERROR`) failures from validate commands that are not
  coverage-safe. Per the 062-04 manifest, that migration work must go
  through the 062-03 strict-delta path — not through exemptions added to the
  flip child. The completed flip implementation is parked on the scoped
  branch `feat/062-04-strict-default-flip` (commit 4d654f6) and must not
  merge until this migration path reports an empty strict delta.

  This child is deliberately the measurement-and-unblock slice, not the full
  burn-down. It has three outcomes:

  1. Debt inventory: run `uv run maid validate --strict-delta --json` on the
     current tree, and record the results in a new backlog document at
     `docs/plans/strict-coverage-migration-backlog.md` (same family as
     `docs/plans/maid-validate-hardening-backlog.md`). The document must
     contain: the generation command and date, per-code counts (at minimum
     E710 and E900), a per-manifest or per-cohort breakdown grouping related
     manifests (for example by epic prefix), a burn-down batch plan sized so
     each batch is one implementation-sized draft, and a deferral section
     where any contract that will be intentionally retired or superseded
     instead of strengthened gets an explicit written rationale. Numbers in
     the document must come from a cited strict-delta run, never from hand
     estimates; the document states its own regeneration command so later
     batches can refresh it.
  2. E900 elimination: every active manifest whose validate commands crash or
     error under the artifact-coverage harness gets its commands fixed so
     they run cleanly under `coverage.py` while still executing the declared
     artifacts. Fixing means repairing the command or its test invocation,
     not deleting the command, not replacing it with a no-op, and not
     retiring the manifest solely to dodge the harness. The identities of
     the affected manifests are not knowable until the inventory run, so
     the implementing agent must extend this manifest's `files.scope` list
     with each affected manifest path and a one-line reason (validate-command
     repairs do not contract those files' public artifact surfaces) before
     touching them, mirroring the extend-before-touch procedure 062-04 used
     for payload documents and its `files.scope` handling of the 062-02
     plan lock. If an E900 turns out to be a genuine artifact-coverage
     harness bug rather than a repo-side command problem, stop, report it
     per the repository's MAID bug-report procedure, and route the fix
     through a plan revision instead of working around the harness here.
  3. Batch queue: the burn-down batches for the remaining E710 debt are
     recorded in the backlog document as a draft-manifest queue (062-06
     onward, or a documented cohort scheme), each batch strengthening the
     validation commands and tests of a bounded manifest cohort so declared
     artifacts are genuinely executed. The batches are planned here and
     implemented later; they are out of scope for this child.

  Mechanics the implementer must respect (evidence from the 068-01 and
  062-03 Outcome records):

  - E710 applies to declared Python function/method/class artifacts and is
    satisfied only by runtime body execution under the coverage harness.
    Import-only or mention-only tests cannot satisfy it, by design; class
    artifacts count as executed only when a declared method body executes.
    Burn-down therefore means strengthening tests/validate commands or
    intentionally retiring stale contracts via the supersession workflow —
    never loosening the gate.
  - `--strict-delta` appends structured output and keeps the process exit
    code determined by the default-gate result, so inventory runs are safe
    in CI and on the current pre-flip tree.
  - A full-tree strict-delta run executes every active manifest's validation
    commands under coverage and takes tens of minutes (a 2026-07-04 run
    exceeded 20 minutes). The backlog document must record the observed
    runtime, and validation of this child must not embed a full-tree delta
    run in a pytest test. Full-run JSON snapshots (before and after the E900
    fixes) are captured as Outcome evidence instead.

  Epic gate this child feeds: 062-04 may merge only after (a) 062-01..062-03
  ship in a released minor, and (b) `uv run maid validate --strict-delta`
  reports an empty delta on this repository, at which point the flip's
  dogfood clause is satisfiable. This child does not itself flip any
  default and adds no gate logic.

  Planned behavioral tests (written by the implementing agent during
  contract hardening; not yet created, so this draft is not promotion-ready):

  - tests/test_strict_coverage_migration_docs.py (047-02 Path.read_text
    pattern): asserts the backlog document exists; names its regeneration
    command (`maid validate --strict-delta --json`); contains the per-code
    count section covering E710 and E900; contains a burn-down batch plan
    section; contains a deferral-rationale section; and states the
    zero-E900 completion claim with the citation of the delta run that
    demonstrated it.

  Planned validate commands:

  - uv run python -m pytest tests/test_strict_coverage_migration_docs.py -v
  - uv run maid validate manifests/drafts/062-05-consume-strict-delta-migration-debt.manifest.yaml --mode schema --quiet
temptations:
  - risk: "Do not weaken, waive, or special-case the artifact-coverage gate to make the dogfood run pass."
    instead: "Strengthen validate commands and tests so declared artifacts execute, or retire genuinely stale contracts through the supersession workflow with rationale recorded in the backlog document. Gate logic in maid_runner/ stays untouched."
  - risk: "Do not bulk-supersede or bulk-archive old manifests just to empty the strict-delta report."
    instead: "Every deferred or retired contract gets an individual entry in the deferral section stating why the contract no longer earns enforcement; batches of mechanical supersessions without per-contract rationale are a review blocker."
  - risk: "Do not fix E900 commands by deleting them, stubbing them, or pointing them at trivial tests."
    instead: "Repair the command so it runs under coverage.py and still executes the manifest's declared artifacts; verify with a focused --artifact-coverage run on that manifest before and after."
  - risk: "Do not hand-write or hand-adjust the debt numbers in the backlog document."
    instead: "Regenerate the numbers from a cited `maid validate --strict-delta --json` run and record the command, date, and runtime alongside them."
  - risk: "Do not let this child grow into the E710 burn-down itself."
    instead: "This child ends at inventory + zero E900 + a planned batch queue; each E710 batch becomes its own draft manifest consumed later, sized to one implementation-sized change."
files:
  create:
    - path: docs/plans/strict-coverage-migration-backlog.md
      artifacts:
        - kind: attribute
          name: _strict_coverage_migration_backlog
          of: documentation
          type: markdown document
          description: "Regenerable strict-defaults migration backlog: cited strict-delta inventory with per-code counts, per-cohort breakdown, E900 fix log, E710 burn-down batch queue, and per-contract deferral rationale."
  read:
    - maid_runner/core/artifact_coverage.py
    - maid_runner/core/strict_delta.py
    - maid_runner/cli/commands/validate.py
    - docs/plans/maid-validate-hardening-backlog.md
    - manifests/062-03-report-strict-migration-delta.manifest.yaml
    - manifests/068-01-add-artifact-execution-coverage-gate.manifest.yaml
    - manifests/drafts/062-04-flip-strict-defaults-in-major-release.manifest.yaml
validate:
  - uv run maid validate manifests/drafts/062-05-consume-strict-delta-migration-debt.manifest.yaml --mode schema --quiet
