description: 'Planning handoff only; tests are planned, no red evidence or lock exists, and this draft
  is not promotion-ready.


  Evidence: plan.py recovery unconditionally recommends installing prior dependency state when dependency
  lockfiles are targeted, although tests may require the upgraded dependency API to collect.


  Design and acceptance: Preserve fail-closed capture and exact stash restoration. Explain that when dependencies
  are test prerequisites, retain the prerequisite environment, restore only task implementation source
  to its real baseline in a controlled checkout, and use plain plan revise after genuine red. Offer prior-dependency
  recovery only when compatible with the behavioral tests. Present legacy-baseline only with its tracked-contract
  eligibility, never as a generic bypass. Do not add selective-stash flags or automatic dependency manipulation
  in this diagnostic-only child.


  Expected red: a cmd_plan_revise fixture whose tests import a dependency API absent at baseline prints
  unusable unconditional prior-dependency advice; assert useful source-baseline recovery without bypassing
  evidence. Existing public signatures remain unchanged.'
temptations:
- risk: Treat incompatible prior dependencies or legacy-baseline as universal recovery.
  instead: Preserve fail-closed capture and exact stash restoration. Explain that when dependencies are
    test prerequisites, retain the prerequisite environment, restore only task implementation source to
    its real baseline in a controlled checkout, and use plain plan revise after genuine red. Offer prior-dependency
    recovery only when compatible with the behavioral tests. Present legacy-baseline only with its tracked-contract
    eligibility, never as a generic bypass. Do not add selective-stash flags or automatic dependency manipulation
    in this diagnostic-only child.
- risk: Expand a diagnostic repair into selective stashing or relax evidence requirements.
  instead: Keep the stash lifecycle unchanged, verify restored source/lock bytes on failure, and change
    only actionable recovery guidance.
