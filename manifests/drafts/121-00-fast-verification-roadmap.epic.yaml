    - parallelism
description: |
  Reopened after 121-01 delivered a safe task-scoped handoff path and 121-02
  showed that blind pytest subprocess sharding can change outcomes when the
  execution environment is not held constant. Later reconstruction found its
  TypeScript failures were confounded by a missing npm dependency, so the first
  child now obtains controlled full-suite evidence instead of assuming a cache
  leak. The remaining
  repository-wide paths are still operationally unacceptable: the last green
  `maid test` took 233.22-235.27 seconds, while assessed deep verification ran
  1,827.5 seconds and stopped at artifact coverage before reaching knockout or
  the ordinary tests stage.

  The integrated timing probe at 0e4e2c5 recorded 3,927 pytest cases; a final
  collection recheck after reopening planning inventory found 3,936. The broad
  batch used 184.23 seconds, with 136.19 seconds concentrated in the slowest
  150 subprocess/Git-heavy tests. Deep coverage has 353 command
  declarations but 352 share one batch-compatibility key; the implementation
  nevertheless launches 297 exact coverage command tuples serially. Knockout
  would then process 1,093 declarations (554 unique artifacts) and up to 1,867
  validate commands through an in-place serial rewrite loop.

  The new strategy is ordered around correctness prerequisites, not raw
  concurrency:

  1. prove pytest process/file isolation in one dependency-complete environment;
  2. separate slow policy matrices from real subprocess and Git adapters while
     retaining focused adapter integration tests;
  3. separate advisory timing policy from runner-native worker execution;
  4. collect fixture-aware per-test runtime evidence once per compatible
     behavior group;
  5. prove evidence-to-report equivalence before deep reuses the run;
  6. replace knockout amplification through exact deduplication, differential
     detector evidence, isolated snapshots, and bounded workers;
  7. use the same proven snapshot/process-budget boundary to bound conservative
     exact artifact-coverage fallbacks that cannot use grouped fixture evidence.

  Planned child order:

  1. `121-03-prove-pytest-process-isolation-before-parallelism` - reproduce
     genuine order-sensitive fixture projects, correct the environment-confounded
     121-02 diagnosis, and provide a non-recursive external full-suite
     serial/xdist outcome-equivalence probe. Matching failures are not green,
     and there is no marker-only serial escape hatch.
  2. `121-04-separate-runtime-policy-from-subprocess-tests` - inject an owned
     runtime-evidence executor so artifact-coverage and nested strict-preview
     policy cases use deterministic fakes, while a bounded adapter suite still
     runs real coverage/pytest processes.
  3. `121-05-reuse-fast-real-git-test-projects` - replace repeated Git
     init/config/commit setup in plan-lock and stash policy matrices with
     clones of immutable tiny templates, preserving real index, stash, and
     worktree behavior.
  4. `121-06-record-duration-informed-pytest-policy` - keep advisory per-node
     timing history and scheduler decisions separate from test execution.
  5. `121-07-integrate-duration-informed-pytest-workers` - use the resolved
     consumer pytest environment and a bounded process budget to activate
     xdist only for expensive compatible groups, pinned to the loadscope
     scheduler and eight-worker count accepted by 121-03, with structured
     notices across repository, task, and single-manifest paths.
  6. `121-08-collect-fixture-aware-runtime-evidence` - capture node, fixture,
     collection, and command contexts with explicit completeness metadata;
     ambiguous contexts or unproven wider/autouse/yield fixture lifecycles fall
     back to exact commands.
  7. `121-09-prove-runtime-evidence-artifact-coverage-equivalence` - compare
     evidence-derived E710/E900 reports with the legacy runner before any CLI
     stage consumes them.
  8. `121-10-reuse-runtime-evidence-in-deep-verify` - reuse only overlapping
     pytest execution at the artifact-coverage stage and defer residual
     commands to their original tests-stage boundary.
  9. `121-11-deduplicate-knockout-mutation-specs` - build immutable unique
     mutation plans while retaining exact per-manifest declaration/command
     attribution and legacy per-declaration execution isolation.
  10. `121-12-require-differential-knockout-detection` - accept a focused
      detector only after green-mutant-red-restored-green proof; every
      inconclusive case runs the original command, including source,
      collection, fixture/order, and subprocess observers.
  11. `121-13-isolate-knockouts-in-project-snapshots` - execute every command
      against a materialized current-byte snapshot so source readers, path
      loaders, editable imports, and child processes see the mutation without
      touching shared source or ordinary/linked-worktree Git metadata.
  12. `121-14-run-isolated-knockouts-with-bounded-workers` - schedule snapshot
      workers under one process budget, give every declaration fresh/reset
      child state, and restore deterministic order regardless of completion.
  13. `121-15-parallelize-isolated-artifact-coverage-fallbacks` - preserve
      exact pytest lifecycles for unproven root/session fixtures while bounding
      the fallback wall time with independently verified snapshots, material
      write detection, deterministic reports, and serial fail-closed reruns.

  Promotion prerequisites are strict. 121-07 cannot enable workers until the
  121-03 full-suite probe is green. 121-09 cannot consume evidence until
  121-08 proves fixture/collection attribution or exact-command fallback.
  121-10 cannot reuse a run until 121-09 matches legacy reports. Knockout
  narrowing is never used as proof of non-detection: 121-12 must fall back to
  original commands whenever its three-point differential proof is absent.
  Buffered ordinary-test reuse is disabled when in-place knockout intervenes.
  The coverage/deep time budgets do not become enforceable until 121-15's full
  serial-versus-isolated exact-fallback comparison and timing acceptance pass.

  Target budgets on the 16-thread reference machine are under 60 seconds for
  green `maid test`, under 180 seconds for cold repository artifact coverage,
  and under five minutes for a known-green deep profile including knockout,
  after the 121-15 fallback acceptance is green.
  The repository target becomes enforceable only after the independent 1,680
  E710 debt items are closed; until then, use `--keep-going` and known-green
  fixtures for end-to-end timing. No performance child may suppress that debt.
temptations:
  - risk: "Do not revive raw round-robin, contiguous, or file-count-based pytest sharding."
    instead: "First prove file/process isolation, then use pytest's runner-native scheduler behind a duration-informed threshold and deterministic result buffering."
  - risk: "Do not make one global coverage run count unrelated ambient execution for every manifest."
    instead: "Capture coverage.py line and call contexts per pytest node and evaluate each manifest only against contexts selected by its original commands."
  - risk: "Do not infer that baseline non-execution makes a test irrelevant to a knockout."
    instead: "Use green-red-green differential detector evidence only as positive proof; source-inspection, fixture/order, collection, subprocess, or otherwise inconclusive cases run their original commands."
  - risk: "Do not run concurrent knockouts by rewriting the shared worktree or using an import-only overlay."
    instead: "Execute commands in materialized current-byte project snapshots so every source reader and child process sees the mutation while original bytes remain unchanged."
  - risk: "Do not cache a green deep result using an incomplete key."
    instead: "Reuse evidence only within the invocation; defer persistent pass caching until a hermetic input contract covers repository bytes, tools, dependencies, environment, and external services."
