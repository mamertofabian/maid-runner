# draft-kind: implementation
schema: "2"
goal: "Make assessed handoff verification run changed manifests' tests instead of the repository-wide test inventory"
type: refactor
created: "2026-08-10T14:05:00+08:00"
metadata:
  status: planning
  priority: high
  tags:
    - performance
    - verify
    - handoff
    - task-scope
description: |
  Repository-wide verify passed in 237.62s, with 228.48s in the tests stage.
  The same checkout using the existing changed-manifest selection completed in
  9.54s, including 0.51s for two task test commands, while repository-wide
  schema, behavioral, implementation, and coherence stages still ran.

  The current selection is coupled indirectly to file-tracking or plan-lock
  scope. Add an explicit tests-stage scope and let the handoff profile select
  task scope. `maid assess` already emits an explicit `--since` or `--base-ref`
  baseline, so its low/medium handoff recommendation can run only the validate
  commands of active manifests changed in that task window. Deep and explicit
  repository test scope remain repository-wide.

  Preserve the anti-gaming contract: all selected manifest commands execute;
  a failing selected command fails verify; changed-manifest resolution follows
  the same baseline rules as scope and plan-lock gates; unresolved selection
  never becomes a silent empty pass. JSON output stays deterministic.
temptations:
  - risk: "Do not turn task test scope into task-scoped static validation."
    instead: "Keep schema, behavioral, implementation, coherence, and default file-tracking behavior unchanged; narrow only `_tests_stage` command selection."
  - risk: "Do not infer test files directly from the git diff and bypass manifest validate commands."
    instead: "Resolve changed active manifests through the chain, then execute their declared commands through the existing integrity, batching, pruning, and cache paths."
  - risk: "Do not return success with zero tests when the task baseline cannot be resolved."
    instead: "Emit a stable blocking diagnostic or an explicit fail-closed repository-scope widening diagnostic, with behavioral tests for the chosen policy."
  - risk: "Do not make deep or explicitly repository-scoped verification task-only."
    instead: "Honor explicit CLI scope over profile defaults and retain repository as the parser default outside the handoff profile."
  - risk: "Do not assert speed only by wall clock in unit tests."
    instead: "Assert the exact selected manifest paths and command call counts, then retain the measured benchmark as Outcome evidence."
