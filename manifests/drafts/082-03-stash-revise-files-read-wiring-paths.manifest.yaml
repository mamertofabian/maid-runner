# draft-kind: implementation
schema: "2"
goal: "Let maid plan revise --stash-implementation stash dirty manifest-declared files.read wiring paths so red evidence can be recaptured after review-driven contract changes"
type: fix
created: "2026-07-03T06:47:00Z"
metadata:
  status: draft
  backlog: docs/plans/maid-runner-self-improvement-backlog.md#theme-3
  tags:
    - plan-lock
    - red-phase
    - workflow-hardening
    - cli
  priority: high
description: |
  `_cmd_plan_revise_with_stashed_implementation`
  (maid_runner/cli/commands/plan.py) builds its stash targets from
  `manifest.all_writable_paths` (create/edit/delete/snapshot/scope,
  maid_runner/core/types.py), which excludes `files.read`. Manifests that
  follow the documented touched-but-uncontracted wiring pattern (for example
  a SvelteKit `+page.svelte` under `files.read` that only rewires call
  sites) therefore cannot recapture red evidence after a review-driven
  contract change: the dirty read path is neither stashed nor tolerated, or
  when same-task tolerance admits it, the implementation edit leaks into the
  supposedly pre-implementation red capture. Downstream this dead-ends in
  E707 RED_EVIDENCE_COMMAND_MISMATCH with no sanctioned path forward
  (bug report 20260630-182412-life-dashboard-maid-plan-revise-files-read;
  the June 29 sibling fix, manifests/fix-stash-revise-scope-targets, covered
  only scope paths).

  This chain-merges over manifests/076-01-add-stash-backed-plan-revise and
  manifests/fix-stash-revise-scope-targets on the same cmd_plan_revise
  contract.

  Pinned decisions (do not redesign):

  1. Dirty manifest-declared `files.read` paths become stash TARGETS, not
     merely allowed dirt. They are implementation-era edits that must be
     hidden during red capture and restored afterwards, exactly like dirty
     writable paths. Tolerating them without stashing would leak
     implementation state into red evidence.

  2. The anti-gaming bound is manifest visibility: only paths explicitly
     listed in the revised manifest's `files.read` qualify. Genuinely
     undeclared dirty paths are still refused with the existing error, and
     that error message must now also say that declaring a wiring path under
     `files.read` is the sanctioned way to include it in the stash.

  3. Test files never ride the read-path stash. Any `files.read` entry that
     `_is_test_file` classifies as a test stays unstashed, so behavioral
     tests always remain visible to red capture; hiding failing tests would
     let a green run masquerade as red-capture input (the capture already
     refuses non-red evidence, but the exclusion keeps the failure mode
     impossible rather than merely detected).

  4. Existing refusals are all preserved: staged targets, missing git
     metadata, ambiguous stash failures, --preserve-red-evidence/--no-run
     combinations, contract-file hash mutation during capture, and the
     requirement that the manifest declares at least one non-test
     implementation file. The "found no dirty declared implementation paths
     to stash" guard now counts dirty declared files.read non-test paths as
     stashable.

  Planning notes (Planning Handoff Mode): behavioral tests are declared but
  not yet written; all new coverage goes in the dedicated
  tests/cli/test_stash_revise_files_read_targets.py module because the
  existing stash-revise test files are hashed by the 076-01 and
  fix-stash-revise-scope-targets plan locks. The implementing agent confirms
  the red phase, runs behavioral validation, plan-locks, and promotes before
  implementation.

  Open questions for the implementing agent:
  - Whether a manifest whose ONLY dirty declared paths are files.read
    entries should be allowed to proceed (recommended: yes — the wiring edit
    is the implementation in that scenario) or still require a dirty
    writable path; decide in plan review and cover the decision with a test.
temptations:
  - risk: "Do not widen the stash to all dirty paths or git stash -u without path arguments to make E707 recovery easy."
    instead: "Extend the target set only by the revised manifest's explicit files.read entries, keep passing exact paths to git stash push, and keep refusing undeclared dirty paths."
  - risk: "Do not downgrade files.read dirt to tolerated-but-unstashed dirt."
    instead: "Stash dirty declared files.read non-test paths so red capture runs against the pre-implementation state, then restore them with the same stash-identity checks used for writable targets."
  - risk: "Do not let test files, the manifest, or the lock file be stashed via files.read declarations."
    instead: "Filter read-path targets through _is_test_file and keep the manifest/lock hash checks; add the behavioral test proving a files.read-declared test file stays visible during capture."
  - risk: "Do not add assertions to the existing stash-revise test files hashed by older plan locks."
    instead: "Put all new behavioral coverage in the dedicated test module owned by this manifest."
files:
  create:
    - path: tests/cli/test_stash_revise_files_read_targets.py
      artifacts:
        - kind: test_function
          name: test_stash_revise_stashes_dirty_declared_files_read_wiring_path
          source_scenario: A locked manifest declares an implementation file under files.edit and a wiring file under files.read; both are dirty with implementation-era edits, and review tightened the behavioral tests (reproduction of the 2026-06-30 life-dashboard report).
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: The revise succeeds, red evidence is captured with both the writable and the files.read edits hidden, and the lock records valid red evidence instead of refusing the dirty read path.
        - kind: test_function
          name: test_stash_revise_restores_files_read_changes_after_capture
          source_scenario: The same wiring scenario, inspecting the worktree after the command returns.
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: The files.read path's dirty content is restored byte-identical after evidence capture, on success and on refused-capture failure paths alike.
        - kind: test_function
          name: test_stash_revise_still_refuses_undeclared_dirty_paths
          source_scenario: A dirty path that appears in no section of the revised manifest, alongside the declared dirty targets.
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: The command refuses with the unrelated-dirty-path error, leaves the lock unchanged, and the error text names files.read declaration as the sanctioned way to include a wiring path.
        - kind: test_function
          name: test_stash_revise_never_stashes_test_files_declared_under_files_read
          source_scenario: A revised manifest adversarially lists its behavioral test file under files.read while that test file is dirty with the tightened assertions.
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: The behavioral test file is not stashed, remains visible during red capture, and the captured evidence reflects the tightened tests rather than a pre-review green state.
        - kind: test_function
          name: test_stash_revise_counts_files_read_targets_for_dirty_guard
          source_scenario: A locked manifest whose only dirty declared path is a files.read wiring entry.
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: The command's dirty-target guard treats the declared files.read path as stashable per the decision recorded in plan review, instead of failing with the misleading no-dirty-implementation-paths error while the read path stays dirty.
  edit:
    - path: maid_runner/cli/commands/plan.py
      artifacts:
        - kind: function
          name: cmd_plan_revise
          args:
            - name: args
              type: argparse.Namespace
          returns: int
          description: "--stash-implementation derives stash targets from the manifest's writable paths plus manifest-declared files.read non-test paths, hides all dirty targets during red capture, restores them afterwards, still refuses undeclared dirty paths (error text names the files.read declaration escape hatch), and preserves every existing refusal and contract-hash check."
  scope:
    - path: docs/maid_specs.md
      reason: "Extend the plan-lock stash workflow specification to state that declared files.read wiring paths are stash targets and how the anti-gaming bound works."
    - path: docs/draft-manifest-workflow.md
      reason: "Update the review-driven revise guidance for the files.read wiring pattern."
    - path: maid_runner/docs/draft-manifest-workflow.md
      reason: "Keep the packaged copy of the workflow guidance in sync."
  read:
    - maid_runner/core/types.py
    - maid_runner/core/plan_lock.py
    - maid_runner/core/manifest.py
    - manifests/076-01-add-stash-backed-plan-revise.manifest.yaml
    - manifests/fix-stash-revise-scope-targets.manifest.yaml
validate:
  - uv run python -m pytest tests/cli/test_stash_revise_files_read_targets.py -v
  - uv run maid validate manifests/drafts/082-03-stash-revise-files-read-wiring-paths.manifest.yaml --mode behavioral --quiet
  - uv run maid validate manifests/drafts/082-03-stash-revise-files-read-wiring-paths.manifest.yaml --mode schema --quiet
