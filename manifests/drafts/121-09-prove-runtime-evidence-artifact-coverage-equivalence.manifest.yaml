# draft-kind: implementation
schema: "2"
goal: "Prove evidence-derived artifact coverage reports equal the legacy exact-command gate"
type: refactor
created: "2026-08-10T16:46:00+08:00"
metadata:
  status: planning
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - artifact-coverage
    - runtime-evidence
    - equivalence
description: |
  Consume 121-08 evidence in the artifact-coverage core without changing CLI
  stage execution yet. For each manifest command, include only node contexts
  selected by its immutable command identity plus fixture/collection contexts
  with proven attribution and equivalent lifecycle. Consumer closure alone is
  insufficient when grouping changes fixture multiplicity, state, order, or
  yield teardown. Missing selectors, any wider/autouse/dynamic or otherwise
  unproven fixture lifecycle, ambiguous collection execution, lost workers,
  unsupported commands, content changes, or resolved-environment identity
  changes execute that affected exact legacy command; they never produce an
  empty clean report.

  Compare evidence and legacy findings, E710/E900 errors, suggestions, and
  deterministic JSON on honest, missing, failing, fixture-heavy, and
  collection-heavy fixtures. The optimized call count must collapse compatible
  groups while fallback call counts remain exact. No verify orchestration may
  consume this evaluator until these equivalence tests are green.
temptations:
  - risk: "Do not union every context into every manifest report."
    instead: "Filter through exact command identities and proven node/fixture/collection consumer maps."
  - risk: "Do not infer fixture-lifecycle equivalence from a complete consumer map."
    instead: "Require proven-identical lifecycle multiplicity/state/order/teardown or execute the affected exact command."
  - risk: "Do not call an incomplete bundle a missing artifact without checking the legacy command."
    instead: "Execute only the affected exact command through the production executor and expose the fallback identity."
  - risk: "Do not compare only success booleans."
    instead: "Compare findings, error codes/messages/suggestions, command attribution, and normalized JSON."
  - risk: "Do not hide fallback work when claiming the 297-to-one reduction."
    instead: "Return fallback command identities and assert optimized and fail-closed call counts separately."
files:
  create:
    - path: tests/core/test_artifact_coverage_from_runtime_evidence.py
      artifacts:
        - kind: test_function
          name: test_evidence_report_matches_legacy_honest_and_missing_artifacts
          args: []
        - kind: test_function
          name: test_unrelated_ambient_context_cannot_satisfy_e710
          args: []
        - kind: test_function
          name: test_command_failure_attribution_and_e900_match_legacy
          args: []
        - kind: test_function
          name: test_stateful_wide_scope_yield_fixture_uses_exact_command_fallback
          args: []
        - kind: test_function
          name: test_ambiguous_dynamic_fixture_or_collection_context_runs_exact_fallback
          args: []
        - kind: test_function
          name: test_worker_loss_or_selector_gap_runs_exact_fallback
          args: []
        - kind: test_function
          name: test_content_digest_change_rejects_buffered_evidence
          args: []
        - kind: test_function
          name: test_resolved_environment_identity_change_runs_exact_fallback
          args: []
        - kind: test_function
          name: test_compatible_group_executes_once_and_reports_each_manifest
          args: []
        - kind: test_function
          name: test_evidence_and_legacy_json_match_except_duration_fields
          args: []
  edit:
    - path: maid_runner/core/artifact_coverage.py
      artifacts:
        - kind: class
          name: EvidenceArtifactCoverageResult
          description: "Per-manifest reports plus exact fallback identities used during fail-closed evaluation."
        - kind: attribute
          name: reports
          of: EvidenceArtifactCoverageResult
          type: Mapping[str, ArtifactCoverageReport]
        - kind: attribute
          name: fallback_identities
          of: EvidenceArtifactCoverageResult
          type: tuple[RuntimeCommandIdentity, Ellipsis]
        - kind: attribute
          name: complete
          of: EvidenceArtifactCoverageResult
          type: bool
        - kind: function
          name: evaluate_artifact_coverage_from_evidence
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: evidence
              type: RuntimeEvidenceBundle
            - name: fallback_executor
              type: RuntimeCommandExecutor | None
              default: "None"
          returns: EvidenceArtifactCoverageResult
          description: "Evaluates proven contexts and executes affected exact commands whenever evidence is incomplete."
  read:
    - manifests/drafts/121-00-fast-verification-roadmap.epic.yaml
    - manifests/drafts/121-08-collect-fixture-aware-runtime-evidence.manifest.yaml
    - manifests/068-01-add-artifact-execution-coverage-gate.manifest.yaml
    - manifests/096-01-deduplicate-identical-artifact-coverage-commands.manifest.yaml
    - maid_runner/core/_runtime_command_executor.py
    - tests/core/test_artifact_coverage.py
    - tests/core/test_artifact_coverage_batch.py
    - tests/core/test_artifact_coverage_failure_determinism.py
    - tests/core/test_artifact_coverage_timeout_config.py
    - docs/plans/full-and-deep-verification-performance-redesign.md
validate:
  - uv run python -m pytest -q tests/core/test_artifact_coverage_from_runtime_evidence.py tests/core/test_artifact_coverage.py tests/core/test_artifact_coverage_batch.py tests/core/test_artifact_coverage_failure_determinism.py tests/core/test_artifact_coverage_timeout_config.py
  - uv run maid validate manifests/drafts/121-09-prove-runtime-evidence-artifact-coverage-equivalence.manifest.yaml --mode schema --quiet
