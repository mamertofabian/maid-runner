# draft-kind: child
schema: "2"
goal: "Capture agent provenance at the two moments it verifiably exists — plan lock creation and plan lock revision — via explicit --agent-* flags with MAID_AGENT_* environment fallback resolved at the CLI composition root, stored on the lock and on each revision entry, and displayed by maid plan status, without ever making absent provenance an error"
type: feature
created: "2026-07-04T03:42:00Z"
metadata:
  epic: 084-00-after-action-run-evaluation
  tags:
    - run-evaluation
    - agent-provenance
    - plan-lock
    - cli
  priority: medium
description: |
  Plan locks record hashes, timestamps, and revision reasons but not who
  locked or revised the plan. In the multi-agent split (planning agent
  locks, implementing agent revises) per-revision provenance is the only
  record of which agent made which contract change. Depends on 084-01 for
  the AgentProvenance dataclass.

  Pinned decisions (do not redesign):

  1. Resolution is a pure, env-injected core seam, not inline CLI logic.
     New module maid_runner/core/agent_provenance.py exposes
     `ProvenanceResolution` (frozen dataclass: `provenance:
     Optional[AgentProvenance]`, `warning: Optional[str]`) and
     `resolve_agent_provenance(flag_values, env)` where `flag_values` is a
     mapping with keys "model", "provider", "client", "skills",
     "instructions_fingerprint" (values from argparse; skills is a
     sequence) and `env` is an injected string mapping (never a direct
     os.environ read inside the function). Flags win per-field; env fills
     only fields the flags left unset. Env vars: MAID_AGENT_MODEL,
     MAID_AGENT_PROVIDER, MAID_AGENT_CLIENT, MAID_AGENT_SKILLS
     (comma-separated), MAID_AGENT_INSTRUCTIONS_FINGERPRINT. `source` is
     "flags" when all resolved fields came from flags, "environment" when
     all came from env, "mixed" otherwise.

  2. Fail loud, never fake, never block: when no provenance input exists
     at all, resolution returns (None, None) and the command behaves
     exactly as today. When inputs exist but `model` is missing, the
     resolution returns (None, warning) and the CLI prints the warning as
     a labeled stderr advisory — provenance is dropped visibly, never
     silently, and the exit code never changes because of provenance.

  3. Lock storage is additive: the lock payload gains an optional `agent`
     object (AgentProvenance fields, omission-preserving) recording who
     created revision 1; each revision entry gains an optional `agent`
     recording who revised. `PlanLock` gains `agent:
     Optional[AgentProvenance] = None`; `PlanLockRevision` gains `agent:
     Optional[AgentProvenance] = None`. `create_plan_lock` and
     `revise_plan_lock` gain a trailing `agent: Optional[AgentProvenance]
     = None` parameter. Pre-existing lock files load with agent None
     everywhere; PlanLock.load stays fail-closed for structural
     corruption but treats a missing agent key as normal.

  4. CLI wiring: `maid plan lock` and `maid plan revise` gain
     --agent-model, --agent-provider, --agent-client, --agent-skill
     (repeatable), --agent-instructions-fingerprint. The env mapping is
     read once at the CLI composition root (cmd_plan_lock/cmd_plan_revise)
     and passed into resolve_agent_provenance. `maid plan status` shows
     lock and per-revision provenance in text mode when present (silent
     when absent — no noise for repos not using the feature) and always
     includes `agent` keys (value or null) in --json output.

  5. Tamper-evidence boundary: provenance is advisory metadata and MUST
     NOT enter manifest_hash, test hashes, contract-weakening checks, or
     enforce_plan_locks decisions. E707/E70x semantics are unchanged.

  Planned behavioral tests (red phase pending — handoff stops before
  tests): tests/core/test_agent_provenance_resolution.py exercises
  resolve_agent_provenance directly: flags only, env only, per-field
  merge with "mixed" source, comma-splitting and whitespace-trimming of
  MAID_AGENT_SKILLS, no-input (None, None), and model-less input
  producing (None, warning). tests/cli/test_plan_lock_provenance_cmd.py
  builds a temp project and asserts: lock with flags stores agent on the
  lock payload; lock with only env vars stores source "environment";
  revise with flags appends a revision entry carrying agent while the
  base lock agent is unchanged; lock with --agent-provider but no model
  prints a labeled stderr advisory, records no agent, and exits 0; plan
  status --json exposes lock and revision agent objects and text mode
  prints them only when present; a pre-provenance lock file loads and
  status reports agent null without error.
temptations:
  - risk: "Do not read os.environ inside core resolution logic or scatter env lookups across command paths."
    instead: "resolve_agent_provenance takes an injected env mapping; the CLI composition root reads the environment exactly once and passes it in."
  - risk: "Do not fold provenance into manifest or test hashing, or let its presence/absence change enforce_plan_locks, contract-weakening, or red-evidence outcomes."
    instead: "Store provenance as advisory payload only and add a regression test that locks with and without provenance verify identically."
  - risk: "Do not silently drop partial provenance when model is missing."
    instead: "Return the explicit warning from the pure seam and print it as a labeled stderr advisory with exit code unchanged."
  - risk: "Do not fail or warn on pre-provenance lock files."
    instead: "Missing agent keys parse as None; fail-closed behavior stays reserved for structural corruption."
files:
  edit:
    - path: maid_runner/core/plan_lock.py
      artifacts:
        - kind: attribute
          name: agent
          of: PlanLock
          type: Optional[AgentProvenance]
          description: "Provenance of the agent that created revision 1; None when not captured or for pre-provenance locks."
        - kind: attribute
          name: agent
          of: PlanLockRevision
          type: Optional[AgentProvenance]
          description: "Provenance of the agent that made this revision; None when not captured."
        - kind: function
          name: create_plan_lock
          args:
            - name: manifest_path
              type: Path
            - name: project_root
              type: Path
            - name: agent
              type: Optional[AgentProvenance]
              default: "None"
          returns: PlanLock
          description: "Builds the revision-1 lock as before, attaching optional provenance as advisory payload outside all hashes."
        - kind: function
          name: revise_plan_lock
          args:
            - name: existing
              type: PlanLock
            - name: manifest_path
              type: Path
            - name: project_root
              type: Path
            - name: reason
              type: str
            - name: agent
              type: Optional[AgentProvenance]
              default: "None"
          returns: PlanLock
          description: "Re-locks as before, attaching optional provenance to the appended revision entry; the fresh lock keeps its creator provenance semantics."
    - path: maid_runner/cli/commands/plan.py
      artifacts:
        - kind: function
          name: cmd_plan_lock
          args:
            - name: args
              type: argparse.Namespace
          returns: int
          description: "Resolves provenance from --agent-* flags with MAID_AGENT_* env fallback at the composition root, prints the labeled advisory for model-less input, and never changes exit codes for provenance states."
        - kind: function
          name: cmd_plan_revise
          args:
            - name: args
              type: argparse.Namespace
          returns: int
          description: "Same provenance resolution as lock; the resolved provenance lands on the new revision entry."
        - kind: function
          name: cmd_plan_status
          args:
            - name: args
              type: argparse.Namespace
          returns: int
          description: "Text mode prints lock and per-revision provenance only when present; --json always includes agent keys with object or null values."
    - path: maid_runner/cli/commands/_main.py
      artifacts:
        - kind: function
          name: build_parser
          args: []
          returns: argparse.ArgumentParser
          description: "plan lock and plan revise accept --agent-model, --agent-provider, --agent-client, repeatable --agent-skill, and --agent-instructions-fingerprint."
  read:
    - maid_runner/core/types.py
    - maid_runner/core/agent_provenance.py
    - manifests/067-01-add-plan-lock-storage-and-cli.manifest.yaml
    - manifests/drafts/084-01-add-agent-provenance-to-outcome-records.manifest.yaml
    - README.md
  create:
    - path: maid_runner/core/agent_provenance.py
      artifacts:
        - kind: class
          name: ProvenanceResolution
          description: "Frozen dataclass: the outcome of resolving provenance inputs — resolved provenance or an explicit human-readable warning, never a silent drop."
        - kind: attribute
          name: provenance
          of: ProvenanceResolution
          type: Optional[AgentProvenance]
          description: "The resolved provenance, or None when nothing usable was provided."
        - kind: attribute
          name: warning
          of: ProvenanceResolution
          type: Optional[str]
          description: "Labeled advisory text when inputs existed but were unusable (e.g. fields without model); None otherwise."
        - kind: function
          name: resolve_agent_provenance
          args:
            - name: flag_values
              type: Mapping[str, object]
            - name: env
              type: Mapping[str, str]
          returns: ProvenanceResolution
          description: "Pure per-field merge: flags win, MAID_AGENT_* env fills gaps (MAID_AGENT_SKILLS comma-split and trimmed), source set to flags/environment/mixed; (None, None) on no input, (None, warning) on model-less input."
    - path: tests/core/test_agent_provenance_resolution.py
      artifacts:
        - kind: test_function
          name: test_resolve_from_flags_only_sets_source_flags
          args: []
          returns: None
          description: "All fields from flags resolve with source 'flags' and exact values."
        - kind: test_function
          name: test_resolve_from_env_only_sets_source_environment
          args: []
          returns: None
          description: "MAID_AGENT_* env vars alone resolve with source 'environment', including comma-split trimmed skills."
        - kind: test_function
          name: test_resolve_merges_flags_over_env_as_mixed
          args: []
          returns: None
          description: "Flag model plus env provider yields per-field merge with source 'mixed'; flags win where both exist."
        - kind: test_function
          name: test_resolve_without_input_returns_none_without_warning
          args: []
          returns: None
          description: "Empty flags and env yield ProvenanceResolution(None, None)."
        - kind: test_function
          name: test_resolve_without_model_returns_warning_not_provenance
          args: []
          returns: None
          description: "Provider/client without model yields provenance None plus an explanatory warning naming the missing field."
    - path: tests/cli/test_plan_lock_provenance_cmd.py
      artifacts:
        - kind: test_function
          name: test_plan_lock_records_agent_from_flags
          args: []
          returns: None
          description: "maid plan lock with --agent-* flags stores the agent object on the lock payload with source 'flags'."
        - kind: test_function
          name: test_plan_lock_records_agent_from_env_fallback
          args: []
          returns: None
          description: "With only MAID_AGENT_* env vars set, the stored agent has source 'environment'."
        - kind: test_function
          name: test_plan_revise_attaches_agent_to_revision_entry
          args: []
          returns: None
          description: "Revise with agent flags appends a revision entry carrying agent while the base lock creator provenance is unchanged."
        - kind: test_function
          name: test_plan_lock_without_model_warns_and_records_no_agent
          args: []
          returns: None
          description: "--agent-provider without model prints a labeled stderr advisory, stores no agent, and exits 0."
        - kind: test_function
          name: test_plan_status_reports_agent_in_json_and_text
          args: []
          returns: None
          description: "plan status --json always includes agent keys (object or null); text mode prints provenance only when present."
        - kind: test_function
          name: test_pre_provenance_lock_loads_and_verifies_identically
          args: []
          returns: None
          description: "A lock file without agent keys loads, status reports null without error, and lock verification results match a provenance-bearing lock."
validate:
  - uv run python -m pytest -q tests/core/test_agent_provenance_resolution.py tests/cli/test_plan_lock_provenance_cmd.py
