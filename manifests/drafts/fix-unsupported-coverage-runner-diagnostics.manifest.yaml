description: 'Planning handoff only: tests are planned, red evidence is not captured, and this draft is
  not promotion-ready.


  Evidence: run_artifact_coverage silently continues for non-pytest commands, then emits E710 from empty
  execution data; applies to unittest, Django and isolated Docker wrappers.


  Design and acceptance: First inspect the runtime-evidence command abstraction and reuse supported collectors.
  For unsupported execution, emit an explicit blocking instrumentation diagnostic, distinguishing unknown
  execution from observed zero execution. Do not run isolated Django tests on the host or alter container
  safety. Supporting arbitrary Docker instrumentation is outside this child; cover exact and batched coverage
  paths. Confirm diagnostic code and public report shape during hardening.


  Scope: preserve existing public signatures; finalize exact public artifact declarations before behavioral
  approval. Private implementation wiring below is provisionally scoped and must be narrowed after characterization.
  No fix is implemented by this triage.


  Expected red: the planned downstream scenario fails for the reported behavior on the current implementation;
  first distinguish unsupported syntax and environment failures from the intended assertion failure.


  Advisory lessons: use dedicated behavioral modules to avoid shared-lock churn; retain exact identity
  and negative cases; do not weaken evidence gates to resolve false positives.

  '
temptations:
- risk: Treat the reported report unsupported coverage instrumentation instead of asserting nonexecution
