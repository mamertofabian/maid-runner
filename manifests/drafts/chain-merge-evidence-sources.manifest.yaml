# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Provide concrete DetectionEvidenceSource and CoverageEvidenceSource
  implementations that read the recorded 121-21/121-22 evidence caches, keyed per
  artifact identity, so the chain-merge report and equivalence gate consume a
  real, cheap acceptance bar instead of UNKNOWN.
type: feature
created: '2026-08-13T21:50:00Z'
metadata:
  status: planning
  origin: manifest-test-consolidation-design-2026-08-13
  epic: chain-merge-defragmentation
  tags:
  - chain-merge
  - knockout
  - artifact-coverage
  - evidence
  priority: medium
description: |
  PLANNING HANDOFF DRAFT (inventory). Design + adversarial self-review only.
  Hardening agent writes tests, confirms red, validates, plan-reviews, and locks.

  ORIGIN

  Child 1 (chain-merge-fragmentation-report) reads detecting-nodeids through an
  injected DetectionEvidenceSource interface and ships an UNKNOWN default because
  no persisted evidence exists. The 121 roadmap already plans persisted evidence
  caches: 121-21 (artifact-coverage evidence) and 121-22 (knockout differential
  evidence), keyed by a hermetic content + resolved-environment identity. This
  child provides the READERS: concrete evidence sources that answer per-artifact
  queries over those caches, so the acceptance bar becomes real and cheap.

  WHY THIS FITS THE HARDENING CONSTRAINTS

  Pure reading + indexing of already-recorded runtime evidence. No knockout or
  coverage run happens here; no static analysis. It reuses the persisted caches
  rather than reinventing a store (compose, do not duplicate).

  WHAT (first slice)

  - RecordedDetectionEvidenceSource: reads the 121-22 knockout evidence cache and
    answers detecting_nodeids_for(artifact_key) -> tuple[str, ...] | None (None
    when the artifact has no recorded knockout evidence).
  - CoverageEvidenceSource (interface) + RecordedCoverageEvidenceSource: reads the
    121-21 coverage evidence cache and answers whether each declared artifact is
    covered / which are uncovered (E710) for a file.
  Both must key by the same artifact identity the report merges on
  (KnockoutArtifactIdentity: name + kind + parent class) and degrade to
  None/UNKNOWN cleanly when the cache is absent, partial, or stale — never
  fabricate evidence.

  SCOPE BOUNDARIES

  IN: concrete recorded-evidence sources (detection + coverage) as pure readers
  over the persisted caches; per-artifact keying/index; explicit UNKNOWN on
  missing/partial/stale evidence; Python-first.

  OUT: producing or persisting the evidence (that is 121-21/121-22); running
  knockout/coverage; wiring the sources into the report (child 3); the
  equivalence gate (child 5); any cache-key or hermetic-identity redesign.

  EXPECTED RED PHASE

  Tests import the source classes and query them against a fake/recorded cache
  fixture inside the test bodies. Red: the classes do not exist yet
  (ImportError-from-within-test / assertion failure).

  PLANNED BEHAVIORAL TESTS (to be written by the hardening agent)

  - RecordedDetectionEvidenceSource returns the exact recorded detecting-nodeids
    for an artifact present in the cache;
  - it returns None for an artifact absent from the cache (UNKNOWN, not empty
    success);
  - it returns None (not stale data) when the cache identity does not match the
    current content/environment identity;
  - RecordedCoverageEvidenceSource reports the covered set and the uncovered
    (E710) set for a file from the recorded cache;
  - both sources key on KnockoutArtifactIdentity so overloaded names / methods on
    a class resolve to the right artifact;
  - the sources perform no knockout/coverage execution (observable: no runner
    invoked) and are deterministic across repeated queries.

  PLANNED VALIDATE COMMANDS

  - uv run python -m pytest tests/core/test_chain_merge_evidence.py -v
  - uv run maid validate manifests/drafts/chain-merge-evidence-sources.manifest.yaml --mode schema --quiet

  OPEN QUESTIONS (hardening / plan review)

  - Exact on-disk shape of the 121-21/121-22 caches and how to index them by
    artifact identity for per-artifact queries (121-22 is content-keyed for reuse,
    not necessarily artifact-keyed) — may require a thin index.
  - Staleness policy: how the source detects a cache whose hermetic identity no
    longer matches, and whether that is UNKNOWN vs a surfaced warning.
  - Whether CoverageEvidenceSource belongs in chain_merge.py's interface set or a
    parallel module.

  ADVERSARIAL SELF-REVIEW

  - Stale-data hazard: return cached evidence that no longer matches the tree.
    Defense: identity check; mismatch yields None/UNKNOWN, never stale success.
  - Fabrication hazard: default to "covered"/empty detection on missing cache.
    Defense: missing/partial evidence is UNKNOWN, asserted by test.
  - Duplication hazard: reinvent a persistence store. Defense: read the 121-21/
    121-22 caches only; persistence stays out of scope.
temptations:
- risk: Do not return stale cached evidence when the cache identity no longer
    matches the current content/environment.
  instead: Verify the hermetic identity and return None/UNKNOWN on mismatch;
    stale data is never a success.
- risk: Do not default a missing/partial cache to "covered" or empty detection.
  instead: Report UNKNOWN per artifact and let the report/gate surface it.
- risk: Do not run knockout or coverage to fill gaps in the report path.
  instead: Read only recorded evidence; producing it is 121-21/121-22.
files:
  create:
  - path: maid_runner/core/chain_merge_evidence.py
    artifacts:
    - kind: interface
      name: CoverageEvidenceSource
      description: Narrow interface answering per-file/per-artifact coverage
        questions (covered set, uncovered/E710 set) from recorded evidence. Exact
        method shape finalized during hardening.
    - kind: class
      name: RecordedDetectionEvidenceSource
      description: Concrete DetectionEvidenceSource that reads the persisted 121-22
        knockout evidence cache and returns per-artifact detecting-nodeids or None
        when unrecorded/stale. Pure reader; no knockout execution.
    - kind: class
      name: RecordedCoverageEvidenceSource
      description: Concrete CoverageEvidenceSource that reads the persisted 121-21
        coverage evidence cache and returns covered / uncovered (E710) artifacts
        for a file, or UNKNOWN when unrecorded/stale. Pure reader.
  read:
  - maid_runner/core/chain_merge.py
  - maid_runner/core/knockout.py
  - maid_runner/core/artifact_coverage.py
  - manifests/drafts/chain-merge-fragmentation-report.manifest.yaml
  - docs/plans/maid-runner-manifest-test-consolidation.md
  - AGENTS.md
validate:
- uv run python -m pytest tests/core/test_chain_merge_evidence.py -v
- uv run maid validate manifests/drafts/chain-merge-evidence-sources.manifest.yaml
  --mode schema --quiet
