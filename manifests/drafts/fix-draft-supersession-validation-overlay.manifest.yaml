description: 'Planning handoff only: tests are planned, red evidence is not captured, and this draft is
  not promotion-ready.


  Evidence: ManifestChain ignores drafts by design and builds the superseded set only from loaded active
  manifests; selected draft validation currently constructs that active-only chain.


  Design and acceptance: Overlay only the explicitly selected draft onto an ephemeral validation view.
  Honor its supersedes without activating unrelated drafts or mutating global chain state. Preserve E110
  dropped-artifact audits, missing targets, cycles and normal active validation; never replace this with
  --no-chain.


  Scope: preserve existing public signatures; finalize exact public artifact declarations before behavioral
  approval. Private implementation wiring below is provisionally scoped and must be narrowed after characterization.
  No fix is implemented by this triage.


  Expected red: the planned downstream scenario fails for the reported behavior on the current implementation;
  first distinguish unsupported syntax and environment failures from the intended assertion failure.


  Advisory lessons: use dedicated behavioral modules to avoid shared-lock churn; retain exact identity
  and negative cases; do not weaken evidence gates to resolve false positives.

  '
temptations:
- risk: Treat the reported validate an explicitly selected superseding draft against its proposed active
    chain scenario as a reason to bypass existing validation.
  instead: Overlay only the explicitly selected draft onto an ephemeral validation view. Honor its supersedes
    without activating unrelated drafts or mutating global chain state. Preserve E110 dropped-artifact
    audits, missing targets, cycles and normal active validation; never replace this with --no-chain.
- risk: Use private-helper assertions that pass while the downstream failure remains.
  instead: Exercise validate through the named regression scenarios, including the negative cases, before
    locking this draft.
