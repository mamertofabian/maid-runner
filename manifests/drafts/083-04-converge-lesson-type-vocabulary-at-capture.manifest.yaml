          description: "Claude source implementation-review Outcome capture rule: consult existing lesson_types (maid insights by_lesson_type, or fresh theme-map member_lesson_types) and reuse-first before coining a new lesson_type; advisory, never blocking capture."
    - path: .codex/skills/maid-implementation-review/SKILL.md
      artifacts:
        - kind: attribute
          name: _codex_capture_lesson_vocabulary_guidance
          of: skill
          type: markdown section
          description: "Codex source capture vocabulary rule identical to the Claude copy."
    - path: maid_runner/claude/skills/maid-implementation-review/SKILL.md
      artifacts:
