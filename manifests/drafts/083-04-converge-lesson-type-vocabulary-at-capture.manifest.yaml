    - path: docs/manifest-outcome-records.md
      artifacts:
        - kind: attribute
          name: _lesson_type_vocabulary_convergence_docs
          of: documentation
          type: doc-section
          description: "Outcome record docs section stating the reuse-first lesson_type vocabulary rule and its advisory, non-blocking nature."
    - path: maid_runner/docs/manifest-outcome-records.md
      artifacts:
        - kind: attribute
          name: _packaged_lesson_type_vocabulary_convergence_docs
