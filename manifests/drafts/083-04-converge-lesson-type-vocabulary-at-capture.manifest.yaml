# draft-kind: child
schema: "2"
goal: "Treat lesson_type fragmentation at its root: extend the Outcome capture guidance (distributed maid-implementation-review skill plus the Outcome docs) to require consulting the existing lesson_type vocabulary — via `maid insights` by_lesson_type or a fresh theme map's member_lesson_types — before coining a new lesson_type, and bump the instruction payload version so downstream `maid init --check` reports the changed payload as stale"
type: feature
created: "2026-07-03T23:14:00Z"
metadata:
  epic: 083-00-close-outcome-enrichment-consumption-loop
  tags:
    - agent-skills
    - outcome-records
    - learning
    - documentation
    - maid-workflow
  priority: medium
description: |
  The live index holds 78 distinct lesson_type values for 269 lessons because
  every Outcome capture coins lesson_types freely: no guidance anywhere says
  to check what already exists. Enrichment then normalizes downstream
  forever while the upstream vocabulary keeps diverging — the theme map is a
  palliative for a fixable capture-time behavior. This child adds the
  convergence rule where Outcome capture is actually specified: the
  maid-implementation-review skill (AGENTS.md places Outcome capture after
  implementation review and before final handoff) and
  `docs/manifest-outcome-records.md`.

  Pinned decisions (do not redesign):

  1. Guidance only; no runner enforcement. lesson_type remains free-form
     string data in the Outcome schema. No validator, error code, or CLI
     check rejects novel lesson_types in this child — a wrong-but-forced
     vocabulary is worse than a fragmented one, and enforcement would
     require the runner to judge semantic fit. If convergence guidance
     proves insufficient, a later child can consider advisory-only tooling.

  2. The rule, stated in both skill and docs: before writing new Outcome
     lessons, list the existing vocabulary — run `maid insights` and read
     the by_lesson_type keys, or when a fresh validated theme map exists,
     prefer its themes' member_lesson_types as the canonical families —
     and reuse an existing lesson_type when one fits the lesson. Coin a new
     lesson_type only when no existing value fits, and prefer singular,
     kebab-or-plain lowercase forms consistent with the existing vocabulary.
     The check is advisory and must not block or delay Outcome capture when
     the index or insights output is unavailable.

  3. Surfaces: the Outcome-Aware / Outcome capture guidance in the
     maid-implementation-review skill (Claude and Codex sources plus
     generated package copies, byte-for-byte synced) and the Outcome record
     documentation (`docs/manifest-outcome-records.md` plus its packaged
     copy). Tool parity: Claude and Codex payloads carry identical wording.

  4. Instruction payload version bump: advance `INSTRUCTION_PAYLOAD_VERSION`
     past the value current at implementation time (baseline at drafting:
     `2026.07.01.1`) because the distributed implementation-review skill
     payload changes.

  5. Registered commands only: the guidance quotes `maid insights` and the
     existing theme-map consumption surfaces; it must not invent flags or a
     nonexistent vocabulary-listing command.

  Planned behavioral tests (red phase pending — handoff stops before tests):
  `tests/test_outcome_vocabulary_guidance.py` reads the
  maid-implementation-review sources, their package copies, and both copies
  of the Outcome docs, asserting: (a) the capture guidance requires
  consulting existing lesson_types via maid insights before coining a new
  lesson_type; (b) it prefers fresh theme-map member_lesson_types as
  canonical families when available; (c) it states reuse-first and
  new-only-when-nothing-fits; (d) it keeps the check advisory and
  non-blocking for capture; (e) source and packaged skill copies stay equal
  after an isolated payload sync, and both doc copies carry the section;
  (f) INSTRUCTION_PAYLOAD_VERSION advanced past the pre-change baseline.

  Out of scope: schema or validator changes to lesson_type, migration or
  renaming of the 78 existing lesson_types (historical records are
  immutable evidence; the theme map already normalizes them), planner-skill
  changes, and any advisory CLI tooling for vocabulary suggestions.
temptations:
  - risk: "Do not add runner-side validation, an error code, or a hook that rejects novel lesson_types."
    instead: "Keep convergence a guidance rule at capture time; the Outcome schema and validators stay untouched, and the manifest declares no runner code."
  - risk: "Do not instruct agents to rewrite historical lesson_types in completed Outcome records to shrink the vocabulary."
    instead: "Historical records are immutable evidence; convergence applies to new lessons only, and the theme map handles the existing spread."
  - risk: "Do not make the vocabulary check a blocking precondition for Outcome capture."
    instead: "State the check is advisory: when insights or the index is unavailable, capture proceeds with the agent's best-fit lesson_type."
  - risk: "Do not edit only the skill sources and skip the packaged copies, the two doc copies, or the payload version bump."
    instead: "Edit sources and docs, sync package copies byte-for-byte, advance INSTRUCTION_PAYLOAD_VERSION, and pin each with a test."
files:
