# draft-kind: implementation
schema: "2"
goal: "Integrate duration-informed pytest workers with resolved-environment checks and one process budget"
type: feature
created: "2026-08-10T16:44:00+08:00"
metadata:
  status: planning
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - pytest
    - xdist
    - cli
description: |
  Consume the pure 121-06 decision only after the 121-03 repository acceptance
  probe proves serial/loadscope outcome equivalence. Detect xdist by probing
  the resolved consumer pytest environment, not MAID's importing interpreter.
  An explicit worker request fails visibly when unsupported; automatic mode
  returns a structured serial-fallback notice.

  Respect an existing command/config `-n` without double injection. Every
  automatic worker command injects exactly `-n <workers> --dist loadscope`, the
  scheduler accepted by 121-03; configuration rejects any other automatic
  scheduler until it has separate repository-wide equivalence evidence. Bind
  injected counts to the repository-accepted count set as well: this repository
  enables eight workers because 121-03 proves exactly eight. An unaccepted
  automatic count falls back visibly to serial; an unaccepted explicit count
  fails rather than extrapolating from different evidence. One is always the
  serial path. Pre-existing command/config `-n` remains explicit command
  behavior and is disclosed/accounted, not silently rewritten.
  Collect timing reports on the xdist controller, reject incomplete/lost-worker
  data, and atomically refresh advisory history after all selected nodes execute.
  A single max-process budget covers xdist workers and independent command
  groups so their product cannot oversubscribe the host. Buffer completion and
  retain existing manifest/result order. Consumer defaults remain serial;
  this repository opts in through `.maidrc.yaml`.
temptations:
  - risk: "Do not test xdist availability only in MAID's current interpreter."
    instead: "Probe the resolved pytest prefix/cwd once per invocation and disclose capability errors."
  - risk: "Do not append a second -n or override an explicit serial request."
    instead: "Normalize command/config addopts first; explicit command and CLI values outrank project defaults."
  - risk: "Do not multiply command jobs by pytest workers without a bound."
    instead: "Allocate both mechanisms from one positive max-process budget and preserve an explicit value of one."
  - risk: "Do not hide automatic fallback in captured subprocess stderr."
    instead: "Carry typed scheduling notices through BatchTestResult and render them in text and JSON."
  - risk: "Do not inject xdist's default scheduler or a worker count not accepted by the full 121-03 probe."
    instead: "Pin automatic execution to --dist loadscope and an accepted count; visibly fall back/fail rather than extrapolating evidence."
files:
  create:
    - path: maid_runner/core/_pytest_worker_execution.py
      artifacts:
        - kind: class
          name: PytestRunnerCapabilities
          description: "Resolved consumer-runner xdist capability and probe diagnostic."
        - kind: attribute
          name: xdist_available
          of: PytestRunnerCapabilities
          type: bool
        - kind: attribute
          name: xdist_version
          of: PytestRunnerCapabilities
          type: str | None
        - kind: attribute
          name: error
          of: PytestRunnerCapabilities
          type: str | None
        - kind: class
          name: TestSchedulingNotice
          description: "Stable automation-visible scheduling decision or fallback notice."
        - kind: attribute
          name: command_group
          of: TestSchedulingNotice
          type: tuple[str, Ellipsis]
        - kind: attribute
          name: mode
          of: TestSchedulingNotice
          type: str
        - kind: attribute
          name: workers
          of: TestSchedulingNotice
          type: int
        - kind: attribute
          name: reason
          of: TestSchedulingNotice
          type: str
        - kind: function
          name: probe_pytest_runner_capabilities
          args:
            - name: resolved_command
              type: tuple[str, Ellipsis]
            - name: cwd
              type: Path
          returns: PytestRunnerCapabilities
          description: "Probes xdist in the exact resolved runner environment and returns a typed failure instead of guessing."
        - kind: function
          name: apply_pytest_worker_decision
          args:
            - name: command
              type: tuple[str, Ellipsis]
            - name: decision
              type: PytestWorkerDecision
            - name: capabilities
              type: PytestRunnerCapabilities
            - name: dist_mode
              type: str
            - name: accepted_worker_counts
              type: tuple[int, Ellipsis]
            - name: max_processes
              type: int
            - name: explicit
              type: bool
          returns: tuple[tuple[str, Ellipsis], TestSchedulingNotice]
          description: "Produces one normalized command pinned to accepted loadscope/count evidence, visibly falling back or failing on unproven injection without changing selected targets."
    - path: maid_runner/core/_pytest_timing_plugin.py
      artifacts:
        - kind: class
          name: PytestTimingPlugin
          description: "Controller-side pytest plugin that records completed node durations and worker loss."
        - kind: attribute
          name: durations_ms
          of: PytestTimingPlugin
          type: dict[str, float]
        - kind: attribute
          name: output_path
          of: PytestTimingPlugin
          type: Path
        - kind: attribute
          name: incomplete_workers
          of: PytestTimingPlugin
