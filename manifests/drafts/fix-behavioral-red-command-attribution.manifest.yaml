description: 'Planning handoff only: tests are planned, red evidence is not captured, and this draft is
  not promotion-ready.


  Evidence: Ordinary capture correctly rejects mixed invalid/red commands, but stash_restoration mode
  accepts any red plus invalid when restored commands become valid; it does not require the red command
  to execute behavioral tests.


  Design and acceptance: Inspect the full stash-backed path before changing policy. Attribute red to an
  executing behavioral runner using the existing runner boundary, including registered/acceptance runners.
  Reject lint-only proof and persist the precise command provenance. Retain honest restore diagnostics
  and contract-preserving revision behavior; comment-only AST-equivalent edits need not recapture. No
  manufactured skeletons or acceptance of bare collection errors.


  Scope: preserve existing public signatures; finalize exact public artifact declarations before behavioral
  approval. Private implementation wiring below is provisionally scoped and must be narrowed after characterization.
  No fix is implemented by this triage.


  Expected red: the planned downstream scenario fails for the reported behavior on the current implementation;
  first distinguish unsupported syntax and environment failures from the intended assertion failure.


  Advisory lessons: use dedicated behavioral modules to avoid shared-lock churn; retain exact identity
  and negative cases; do not weaken evidence gates to resolve false positives.

  '
temptations:
- risk: Treat the reported require behavioral test failure evidence instead of lint-only red in stash
    restoration scenario as a reason to bypass existing validation.
  instead: Inspect the full stash-backed path before changing policy. Attribute red to an executing behavioral
    runner using the existing runner boundary, including registered/acceptance runners. Reject lint-only
    proof and persist the precise command provenance. Retain honest restore diagnostics and contract-preserving
    revision behavior; comment-only AST-equivalent edits need not recapture. No manufactured skeletons
    or acceptance of bare collection errors.
- risk: Use private-helper assertions that pass while the downstream failure remains.
  instead: Exercise capture_red_phase_evidence, revision_preserves_red_evidence through the named regression
    scenarios, including the negative cases, before locking this draft.
