# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Add `maid chain merge <file> --apply` that materializes the merged contract
  via the existing snapshot primitive, supersedes the prior chain, and migrates
  plan-lock / red-evidence / outcome provenance — the manifest-side defrag, with
  tests untouched.
type: feature
created: '2026-08-13T22:00:00Z'
metadata:
  status: planning
  origin: manifest-test-consolidation-design-2026-08-13
  epic: chain-merge-defragmentation
  tags:
  - chain-merge
  - snapshot
  - supersession
  - plan-lock
  - provenance
  priority: medium
description: |
  PLANNING HANDOFF DRAFT (inventory). Design + adversarial self-review only.
  Hardening agent writes tests, confirms red, validates, plan-reviews, and locks.

  ORIGIN

  Child 1 reports which files are fragmented and the merged target contract.
  This child performs the manifest-side collapse: it writes a single snapshot
  manifest describing the file's current state (reusing the existing `maid
  snapshot` primitive), supersedes the prior chain, and migrates the provenance
  MAID's gates depend on (plan lock, red evidence, outcome), exactly as `maid
  manifest promote` migrates a lock. Tests are NOT touched, so coverage is
  unchanged — this half is safe on its own.

  WHY PROVENANCE MIGRATION IS MANDATORY

  Plan locks, red evidence, and outcome records attach to manifests. A collapse
  that orphans them trips E702 / E707 and blocks handoff. So `--apply` must carry
  provenance through the supersession, not drop it — this is the load-bearing
  safety property of the child.

  WHAT

  - `maid chain merge <file> --apply`: build the merged target (child 1), write a
    snapshot manifest via the snapshot primitive, mark the superseded chain, and
    migrate lock/red-evidence/outcome onto the snapshot.
  - Refuses to apply on a BLOCKED verdict (structural or coverage-debt) and on a
    LEAN file (nothing to merge); prints what it would supersede on `--dry-run`.
  - Does NOT retire or rewrite any test, and does NOT claim the tests are safe —
    that is the child-5 equivalence gate.

  SCOPE BOUNDARIES

  IN: `--apply` materialize via snapshot; chain supersession; plan-lock /
    red-evidence / outcome provenance migration; refuse-on-BLOCKED/LEAN; read-only
    `--dry-run` preview of what would be superseded.

  OUT: test retirement or the equivalence gate (child 5); repo-wide sweep
    (child 6); any new snapshot-generation logic (reuse the primitive); relaxing
    supersession/lock rules.

  EXPECTED RED PHASE

  Tests invoke `--apply` on a fixture repo and assert a snapshot manifest is
  written, the chain is superseded, and the lock/red-evidence/outcome migrate.
  Red: `--apply` does not exist / does not migrate provenance.

  PLANNED BEHAVIORAL TESTS (to be written by the hardening agent)

  - `--apply` on a DEFRAG file writes one snapshot manifest declaring exactly the
    merged target artifacts and marks the prior chain superseded;
  - the applied snapshot carries the migrated plan lock, red evidence, and outcome
    (no orphaned provenance; `maid verify` provenance gates pass);
  - `--apply` refuses on a BLOCKED verdict and on a LEAN file with a clear reason
    and non-zero exit, writing nothing;
  - `--apply` leaves all test files untouched (observable: tests dir unchanged);
  - `--dry-run --apply`-preview writes nothing and lists what would be superseded.

  PLANNED VALIDATE COMMANDS

  - uv run python -m pytest tests/cli/test_chain_merge_apply.py -v
  - uv run maid validate manifests/drafts/chain-merge-apply-materialize.manifest.yaml --mode schema --quiet

  OPEN QUESTIONS (hardening / plan review)

  - Reuse surface of the snapshot primitive vs a thin wrapper for chain-aware
    supersession + provenance migration.
  - Exact provenance-migration path shared with `maid manifest promote` (extract a
    common helper vs call-through).
  - Whether `--apply` requires an explicit confirmation flag given it rewrites
    manifests.

  ADVERSARIAL SELF-REVIEW

  - Orphaned-provenance hazard: snapshot without migrating the lock. Defense: a
    test asserts lock/red-evidence/outcome migrate and verify gates pass.
  - Silent test loss hazard: apply touches tests. Defense: pin tests-dir-unchanged.
  - Unsafe-collapse hazard: apply on BLOCKED/LEAN. Defense: refuse with non-zero
    exit and write nothing.
  - Snapshot-logic-drift hazard: reimplement snapshot. Defense: reuse the existing
    primitive; new logic is only chain supersession + provenance migration.
temptations:
- risk: Do not write a snapshot without migrating the manifest's plan lock, red
    evidence, and outcome.
  instead: Migrate provenance through the supersession like `maid manifest
    promote`; pin a test that verify provenance gates still pass.
- risk: Do not let `--apply` touch, retire, or rewrite any test file.
  instead: Collapse only the manifest chain; pin a tests-directory-unchanged test.
- risk: Do not apply on a BLOCKED or LEAN verdict.
  instead: Refuse with a clear reason and non-zero exit, writing nothing.
- risk: Do not reimplement snapshot generation.
  instead: Reuse the existing snapshot primitive; add only chain supersession and
    provenance migration.
