# draft-kind: implementation
schema: "2"
goal: "Run knockout commands in equivalent current-byte project snapshots without touching the shared checkout"
type: refactor
created: "2026-08-10T17:13:00+08:00"
metadata:
  status: planning
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - knockout
    - isolation
    - worktree
description: |
  Serial rewrite/restore prevents safe workers and refuses dirty target files.
  An import-only overlay is not equivalent: source/AST readers, path loaders,
  editable installs, child processes, and non-pytest commands may still observe
  the original path. Materialize a complete current-input project snapshot per
  execution root, with no hardlink/symlink from mutable source or generated
  state back to the shared checkout. Run every command with snapshot cwd and
  environment/path binding, verify the source/input digest, and clean it
  recoverably. Each declaration receives a fresh snapshot lifecycle; duplicate
  mutation identities do not share mutable generated state or command effects.
  This intentionally removes accidental cross-declaration project-state
  coupling, so evolve the 068 execution contract and prove honest detection is
  monotonic; a newly exposed dependency must be a visible E712/hardening result,
  never coerced into success.

  Git isolation is part of the snapshot contract, not an inference from clean
  source status. Resolve both ordinary `.git/` directories and linked-worktree
  `.git` pointer/common-dir layouts into independently writable metadata. The
  snapshot may read/copy original history, but must not share writable index,
  refs, stash/logs, config, worktree records, or mutable object storage. Clear
  inherited `GIT_*` repository pointers. Snapshot commands that commit, stash,
  update refs/config/index, reset, or run maintenance must leave the original
  HEAD, refs/stashes, config, index, objects, worktree registrations, and status
  unchanged; uncertainty or a shared inode/pointer is E712.

  Snapshot creation may use a platform copy-on-write facility only after a
  write-isolation probe succeeds; otherwise use a safe materialized copy or
  fail closed with E712. It must preserve tracked, current modified, and
  relevant untracked bytes plus repository-relative command behavior. Dirty
  source becomes safe because the current bytes are copied and the original is
  never written. Keep `--knockout-allow-dirty` accepted as a deprecated
  compatibility no-op and update CLI help/canonical/packaged docs through
  `maid-evolver` for the 068 safety and declaration-isolation contract change.
temptations:
  - risk: "Do not call a PYTHONPATH import overlay equivalent to a project snapshot."
    instead: "Prove source readers, path imports, editable imports, subprocesses, and non-pytest commands all observe the mutated snapshot path."
  - risk: "Do not hardlink mutable source, caches, or generated outputs to the shared checkout."
    instead: "Use verified copy-on-write or materialized files and assert original bytes/status never change."
  - risk: "Do not omit current dirty or relevant untracked bytes from the mutation input."
    instead: "Bind snapshot and source digests to the exact current execution inputs and fail closed when they cannot be reproduced."
  - risk: "Do not silently remove the existing allow-dirty CLI flag."
    instead: "Keep it parseable as a documented deprecated compatibility no-op while isolated snapshots make it unnecessary."
  - risk: "Do not copy a linked-worktree .git pointer or share writable repository metadata."
    instead: "Materialize independent Git dir/common-dir state and prove commits, refs, stash, config, index, objects, and registrations cannot reach the source repository."
files:
  create:
    - path: maid_runner/core/_knockout_snapshot.py
      artifacts:
        - kind: class
          name: KnockoutProjectSnapshot
          description: "Materialized isolated project root bound to current input and source digests."
        - kind: attribute
          name: root
          of: KnockoutProjectSnapshot
          type: Path
        - kind: attribute
          name: input_digest
          of: KnockoutProjectSnapshot
          type: str
        - kind: attribute
          name: source_digests
          of: KnockoutProjectSnapshot
          type: Mapping[str, str]
        - kind: attribute
          name: git_dir
          of: KnockoutProjectSnapshot
          type: Path | None
        - kind: attribute
          name: git_common_dir
          of: KnockoutProjectSnapshot
          type: Path | None
        - kind: attribute
          name: source_repository_identity
          of: KnockoutProjectSnapshot
          type: str | None
          description: "Pre-execution digest of original HEAD, refs/stash, config, index, objects, worktree registrations, and status."
        - kind: class
          name: ProjectSnapshotBackend
          description: "Owned context-managed snapshot boundary for safe fake and production backends."
        - kind: method
          name: create
          of: ProjectSnapshotBackend
          args:
            - name: project_root
              type: Path
            - name: required_paths
              type: Sequence[str]
            - name: worker_id
              type: str
          returns: AbstractContextManager[KnockoutProjectSnapshot]
        - kind: class
          name: MaterializedProjectSnapshotBackend
          description: "Production backend using verified copy-on-write/materialization plus independent ordinary/linked-worktree Git metadata and fail-closed cleanup."
        - kind: method
          name: create
          of: MaterializedProjectSnapshotBackend
          args:
            - name: project_root
              type: Path
            - name: required_paths
              type: Sequence[str]
            - name: worker_id
              type: str
          returns: AbstractContextManager[KnockoutProjectSnapshot]
    - path: tests/core/test_knockout_snapshot.py
      artifacts:
        - kind: test_function
          name: test_snapshot_source_and_ast_reader_observes_mutated_bytes
          args: []
        - kind: test_function
          name: test_snapshot_path_loader_and_editable_import_observe_mutation
          args: []
        - kind: test_function
          name: test_snapshot_subprocess_and_nonpytest_command_observe_mutation
          args: []
        - kind: test_function
          name: test_snapshot_generated_and_cache_writes_are_worker_local
          args: []
        - kind: test_function
          name: test_duplicate_declarations_receive_fresh_snapshot_state
          args: []
        - kind: test_function
          name: test_stateful_cross_declaration_dependency_is_visible_hardening_not_silent_success
          args: []
        - kind: test_function
          name: test_snapshot_uses_current_dirty_and_relevant_untracked_inputs
          args: []
        - kind: test_function
          name: test_snapshot_never_changes_original_bytes_or_git_status
          args: []
        - kind: test_function
          name: test_ordinary_git_directory_is_independently_writable
          args: []
        - kind: test_function
          name: test_linked_worktree_git_pointer_and_common_dir_are_not_shared
          args: []
        - kind: test_function
          name: test_snapshot_git_commands_cannot_change_original_head_refs_stash_config_index_objects_or_registrations
          args: []
        - kind: test_function
          name: test_inherited_git_repository_pointer_environment_is_cleared
          args: []
        - kind: test_function
          name: test_unverified_copy_on_write_or_cleanup_failure_is_e712
          args: []
        - kind: test_function
          name: test_allow_dirty_flag_remains_accepted_but_is_not_required
          args: []
  edit:
    - path: maid_runner/core/knockout.py
      artifacts:
        - kind: function
          name: run_knockout_batch
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: evidence
              type: RuntimeEvidenceBundle | None
              default: "None"
            - name: limit
              type: int | None
              default: "None"
            - name: allow_dirty
              type: bool
              default: "False"
            - name: executor
              type: KnockoutCommandExecutor | None
              default: "None"
            - name: snapshot_backend
              type: ProjectSnapshotBackend | None
              default: "None"
          returns: dict[str, KnockoutReport]
          description: "Runs each declaration's serial differential lifecycle inside a fresh verified snapshot."
        - kind: function
          name: run_knockout
          args:
            - name: manifest
              type: Manifest
            - name: project_root
              type: Path
            - name: limit
              type: int | None
              default: "None"
            - name: allow_dirty
              type: bool
              default: "False"
          returns: KnockoutReport
          description: "Keeps compatibility while isolated snapshots make allow_dirty unnecessary."
    - path: maid_runner/cli/commands/_main.py
