          description: "The maid-run-review skill reaches both generated payload trees and both manifest registries."
  read:
    - .claude/skills/maid-outcome-enrich/SKILL.md
    - .codex/skills/maid-outcome-enrich/SKILL.md
    - tests/test_outcome_enrich_skill_guidance.py
    - manifests/081-04-add-outcome-enrich-skill.manifest.yaml
    - manifests/drafts/084-06-add-run-review-enrichment-pipeline.manifest.yaml
  create:
