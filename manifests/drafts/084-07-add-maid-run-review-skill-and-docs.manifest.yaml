          of: documentation
          type: markdown table row
          description: "Distribution row for maid-run-review across Claude and Codex payloads."
    - path: .claude/manifest.json
      artifacts:
        - kind: attribute
          name: _claude_manifest_run_review_entry
          of: repository configuration
