          args: []
          returns: None
          description: "docs/run-evaluation.md documents --agent-model, MAID_AGENT_MODEL, evaluate run, evaluate compare, and the unknown/unclassified honest-gap statuses; README points to the doc."
        - kind: test_function
          name: test_agent_skills_doc_lists_run_review_for_both_payloads
          args: []
          returns: None
