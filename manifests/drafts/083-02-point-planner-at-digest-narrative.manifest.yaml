        - kind: attribute
          name: _distributed_planner_digest_narrative_guidance
          of: skill
          type: markdown section
          description: "Generated Claude package copy of the digest narrative guidance, kept byte-for-byte in sync with the source skill."
    - path: maid_runner/codex/skills/maid-planner/SKILL.md
      artifacts:
        - kind: attribute
          name: _codex_distributed_planner_digest_narrative_guidance
          of: skill
          type: markdown section
          description: "Generated Codex package copy of the digest narrative guidance, kept byte-for-byte in sync with the source skill."
    - path: maid_runner/instruction_payload.py
      artifacts:
        - kind: attribute
          name: INSTRUCTION_PAYLOAD_VERSION
          type: str
          description: "Date-stamped instruction payload version advanced past the value current at implementation time (2026.07.01.1 at drafting), so downstream maid init --check reports the changed planner payload as stale."
