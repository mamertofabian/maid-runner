# draft-kind: epic
# promotion: split-before-promote
schema: "2"
goal: "Plan strict-by-default validation gates behind a staged v2.x release flip"
type: feature
created: "2026-06-10"
metadata:
  status: planning
  tags:
    - validation-trust
    - hardening
    - strict-defaults
    - pytest-config
    - release-flip
  priority: high
description: |
  Convert the landed anti-gaming hardening work into delivered trust by making
  the strongest gates the default behavior of directory-wide `maid validate`,
  and by closing the explicitly deferred pytest config coverage gap.

  Current-tree premise (re-audited 2026-07-03; supersedes the 2026-06-10
  framing): `maid verify` is already strict by default — 032-03 hardwired
  assertion checks, stub checks, and warning failure into `cmd_verify`, with
  `--advisory` as the labeled warning-policy hatch (082-01), advisory-exempt
  codes (E307 `VALIDATOR_NOT_AVAILABLE` and legacy chain codes), and
  severity-proportionate info diagnostics that never block (082-05).
  Identity-backed behavioral coverage (032-01) and coverage-miss errors
  (030-05) are already default in behavioral validation. The remaining
  opt-in gaps this epic closes are therefore: (a) `maid validate`'s
  `--strict` expansion (assertion checks, stub checks, fail-on-warnings via
  `_strict_options`) and (b) the artifact execution-coverage gate
  (`--artifact-coverage`, 068) on both `maid validate` and `maid verify`.
  A green default `maid validate` run is still weaker than the validator can
  prove; that is the gap the flip delivers.

  This epic follows the repository's hardening constraints: every behavioral
  gate change must be anchored to reproduced false-green paths already on
  file, not speculative static analysis. The epic adds no new analyzers; it
  changes defaults, adds migration tooling, and extends one existing guard to
  config formats pytest documents as equivalent to the already-covered
  `pyproject.toml` path.

  Design constraints agreed for this epic:

  1. Release target (user decision, 2026-07-04, superseding the original
     major-version constraint): the default flip ships in a later v2.x
     minor release, after 062-01 through 062-03 are stable in an earlier
     released minor. Because a minor-version flip changes green/red
     meaning for existing v2 users, the compensating controls are
     mandatory, not optional: the preview and delta tooling must be
     released at least one minor version before the flip, the flip
     release notes must lead with the behavior change, and the
     `--legacy-gates` hatch must ship in the same release as the flip.
     Until the flip, the strict behavior is reachable through the
     explicit opt-in so projects can migrate early.
  2. An escape hatch (`--legacy-gates` or equivalent) must exist in the flip
     release, must be visible in text and JSON output when active, and must be
     documented as a migration aid, not a permanent mode.
  3. Migration must be measurable before the flip: users need a command that
     reports exactly which manifests and files would fail under strict
     defaults, with structured error codes, before any default changes.
  4. The pytest config guard extension must reproduce each bypass shape in a
     throwaway project before the closure is implemented, matching the 044-01
     procedure.

  Decisions already made for the implementer. Do not redesign these:

  1. 062-01 extends `maid_runner/core/_pytest_config_addopts.py`. Pytest
     config discovery precedence to implement, first match wins:
     `pytest.ini` (always wins when present), then `pyproject.toml`
     `[tool.pytest.ini_options]`, then `tox.ini` `[pytest]`, then
     `setup.cfg` `[tool:pytest]`. Only the effective file's addopts are
     enforced; shadowed config files are ignored and must not produce
     diagnostics.
  2. Strict preview flag (062-02): `--strict-preview` on `maid validate`
     and `maid verify`. The preview gate set, mapped to the current tree:
     on `maid validate` it is the union of the existing `--strict`
     expansion (assertion checks, stub checks, fail-on-warnings) plus
     `--artifact-coverage`; on `maid verify` (already strict by default)
     it adds only `--artifact-coverage`. No new gate logic. Combining
     `--strict-preview` with `--advisory` on `maid verify` is a usage
     error (exit 2): the caller asked for contradictory gate sets.
     Fail-on-warnings keeps the current warning policy exactly:
     advisory-exempt codes stay exempt, and info-severity diagnostics
     (082-05) never fail a strict run. JSON output gains a top-level
     `"strict_preview": true` marker (in both full and `--summary` JSON);
     text output prefixes the summary line with `[strict-preview]` (in
     both classic and `--summary` text).
  3. Migration delta (062-03): `--strict-delta` on `maid validate` runs the
     default-gate evaluation and the strict-preview evaluation in one
     process and reports only the diagnostics unique to the strict run,
     grouped by manifest then file, in text and JSON (top-level key
     `"strict_delta"`). Artifact-coverage errors are `ValidationError`
     records with stable codes (for example E311
     `ARTIFACT_NOT_EXECUTED_BY_TESTS`) and participate in the delta like
     any other diagnostic. The process exit code stays determined by the
     default-gate result so CI adoption of the report is non-breaking.
  4. Major flip (062-04): the strict gates become the default —
     concretely, `maid validate` defaults gain the `--strict` expansion
     plus artifact coverage, and `maid verify` defaults gain artifact
     coverage; verify's existing strict posture is unchanged.
     `--legacy-gates` restores only the pre-flip defaults of this child
     (it does not resurrect pre-032-03 lax verify behavior), prints a
     deprecation notice on stderr, and marks JSON output with
     `"legacy_gates": true`. `--advisory` remains the orthogonal
     warning-policy hatch and stays valid alongside `--legacy-gates`. No
     environment-variable escape hatch; the flag is the single opt-out.

  Planned child order:

  1. `062-01-extend-pytest-config-addopts-guard` - extend the reproduced
     `pyproject.toml` `addopts` closure (044-01) to `pytest.ini`, `tox.ini`,
     and `setup.cfg`, respecting pytest config file precedence so ignored
     configs do not produce false positives. Each format gets a reproduced
     bypass fixture and an adversarial test proving the old gaming path fails.
  2. `062-02-add-strict-defaults-preview-mode` - add an explicit opt-in
     (flag and/or `maid` config) that runs directory-wide `maid validate` and
     `maid verify` with the intended future defaults: identity-backed
     behavioral coverage, assertion enforcement, and coverage-miss errors.
     Output must label the run as strict-preview in text and JSON.
  3. `062-03-report-strict-migration-delta` - add a migration report that
     compares current-default results against strict-preview results and
     lists, per manifest and file, the diagnostics that would newly fail,
     with stable error codes and locations. JSON output is required so CI can
     track migration progress over time.
  4. `062-04-flip-strict-defaults-in-major-release` - the release-flip child
     (slug retained for continuity; per the 2026-07-04 user decision the flip
     ships in a later v2.x minor, not a major): make the strict gates the
     default, add the documented legacy escape hatch, update README,
     troubleshooting, howto, and init payload guidance, and add upgrade notes
     that map each newly failing error code to its migration fix. This child
     must not land until 062-01 through 062-03 are stable in an earlier
     released minor version.

  Children must land strictly in order. If 062-04 grows beyond one
  implementation-sized draft, split the default flip from the documentation
  and init payload refresh before promotion.
temptations:
  - risk: "Do not add new static analyzers or speculative gate logic while changing defaults."
    instead: "Only flip defaults on gates that already exist and are backed by reproduced false-green evidence; route any new bypass ideas to the hardening backlog first."
  - risk: "Do not flip strict defaults silently or before the migration tooling has shipped."
    instead: "Release the preview and delta tooling at least one minor version before the flip, lead the flip release notes with the behavior change, and ship --legacy-gates in the same release, per the 2026-07-04 staged v2.x flip decision."
  - risk: "Do not make the legacy escape hatch invisible or permanent."
    instead: "Label legacy-gate runs in text and JSON output and document the hatch as a bounded migration aid."
  - risk: "Do not extend the pytest config guard from documentation alone."
    instead: "Reproduce each pytest.ini, tox.ini, and setup.cfg bypass in a throwaway project before implementing, and encode each reproduction as an adversarial test."
  - risk: "Do not let config precedence handling produce false positives that erode trust in the gate."
    instead: "Implement pytest's documented config discovery precedence so only the effective config file is enforced, with tests for shadowed configs."
