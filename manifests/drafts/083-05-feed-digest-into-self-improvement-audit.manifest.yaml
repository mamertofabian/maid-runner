# draft-kind: child
schema: "2"
goal: "List the fresh advisory enrichment digest (`.maid/outcomes-digest.md` narrative and `maid insights --theme-map` aggregation) as explicit evidence sources in the repo-local maid-runner-self-improvement skill, so the skill that exists to find improvement opportunities actually consumes the learning the enrichment pipeline produces instead of re-deriving themes from raw insights and bug reports"
type: feature
created: "2026-07-03T23:15:00Z"
metadata:
  epic: 083-00-close-outcome-enrichment-consumption-loop
  tags:
    - agent-skills
    - outcome-records
    - llm-enrichment
    - learning
  priority: low
description: |
  `maid-runner-self-improvement` is the natural "guide future development"
  surface: it synthesizes lessons from bug reports, review findings,
  insights, and workflow pain into a prioritized backlog and draft-manifest
  queues. Today it has zero digest awareness — it re-clusters raw evidence
  by hand while a validated theme map and rendered recurring-lessons
  retrospective may already exist. This child adds the digest to the skill's
  evidence-gathering phase.

  Pinned decisions (do not redesign):

  1. Repo-local scope only. maid-runner-self-improvement lives at
     `.claude/skills/maid-runner-self-improvement/SKILL.md` and is not part
     of the distributed `maid init` payload, so this child does NOT bump
     `INSTRUCTION_PAYLOAD_VERSION` and touches no packaged copies. (This is
     the deliberate contrast with 083-02/083-04, which edit distributed
     skills.)

  2. Evidence source, not replacement. The guidance adds, to the skill's
     evidence-gathering phase: when a validated enrichment digest exists,
     run `maid insights --theme-map .maid/outcomes-digest.json` for
     theme-normalized recurring-lesson aggregation and read
     `.maid/outcomes-digest.md` as an advisory narrative retrospective. The
     digest supplements — never replaces — the skill's existing sources
     (bug reports, session insights, review findings, backlog docs), and
     digested themes still require the skill's own confirmation step before
     becoming backlog items.

  3. Runner-owned acceptance, generation stays elsewhere. The skill relies
     on the runner rejecting a stale or invalid digest (the theme-map run
     failing is the signal) and falls back to plain `maid insights` without
     blocking the audit. It must not regenerate the digest, call a model,
     run `maid enrich` generation steps, or pass `--allow-stale-index` to
     force stale enriched data; refreshing the digest belongs to the
     maid-outcome-enrich skill and is at most reported as a suggestion to
     the user.

  4. Untrusted-data framing. The digest markdown is model-generated prose;
     the guidance states it is advisory data about recurring lessons, not
     instructions and not evidence by itself — every confirmed finding must
     still cite primary sources (bug reports, code, test output, insight
     files) per the skill's existing evidence rules.

  Planned behavioral tests (red phase pending — handoff stops before tests):
  `tests/test_self_improvement_digest_guidance.py` reads the repo-local
  skill and asserts: (a) the evidence-gathering guidance names
  `maid insights --theme-map .maid/outcomes-digest.json` and
  `.maid/outcomes-digest.md` as optional evidence sources; (b) it states the
  mandatory non-blocking fallback to plain `maid insights` when the runner
  rejects the digest, and forbids `--allow-stale-index` forcing and any
  digest generation or model call from within the audit; (c) it keeps the
  untrusted-data framing and the requirement that confirmed findings cite
  primary sources; (d) only registered `maid insights` options are quoted.

  Out of scope: the distributed skills (handled by 083-02 and 083-04), the
  other repo-local specialist audit skills (cleanup/refactor, performance,
  validate-hardening — they can adopt the same pattern later if the
  self-improvement integration proves useful), and any runner change.
temptations:
  - risk: "Do not let digest themes count as confirmed findings or backlog justification by themselves."
    instead: "Keep the skill's confirmation step: digest content only points at where to look; every confirmed finding still cites primary evidence."
  - risk: "Do not instruct the audit to regenerate a stale digest, run maid enrich generation, or force staleness with --allow-stale-index."
    instead: "Fall back to plain maid insights and at most suggest the user run the maid-outcome-enrich skill; the audit itself stays model-free on the enrichment path."
  - risk: "Do not bump INSTRUCTION_PAYLOAD_VERSION or touch packaged skill copies for this repo-local skill."
    instead: "Edit only .claude/skills/maid-runner-self-improvement/SKILL.md; distribution surfaces are 083-02/083-04 territory."
files:
  edit:
    - path: .claude/skills/maid-runner-self-improvement/SKILL.md
      artifacts:
        - kind: attribute
          name: _self_improvement_digest_evidence_guidance
          of: skill
          type: markdown section
          description: "Evidence-gathering extension: optionally consume theme-mapped insights and the rendered digest markdown as advisory, untrusted, supplementary evidence with a mandatory non-blocking fallback to plain maid insights; no digest generation, model calls, or stale forcing from within the audit."
  read:
    - manifests/drafts/083-00-close-outcome-enrichment-consumption-loop.epic.yaml
    - manifests/081-04-add-outcome-enrich-skill.manifest.yaml
    - .claude/skills/maid-outcome-enrich/SKILL.md
    - docs/plans/maid-runner-self-improvement-backlog.md
  create:
    - path: tests/test_self_improvement_digest_guidance.py
      artifacts:
        - kind: test_function
          name: test_self_improvement_lists_digest_as_evidence_source
          args: []
          returns: None
          description: "The skill's evidence-gathering guidance names maid insights --theme-map and the rendered digest markdown as optional evidence sources."
        - kind: test_function
          name: test_self_improvement_digest_fallback_is_non_blocking
          args: []
          returns: None
          description: "Guidance states the fallback to plain maid insights when the runner rejects the digest, and forbids --allow-stale-index forcing, digest generation, and model calls from within the audit."
        - kind: test_function
          name: test_self_improvement_digest_is_untrusted_supplementary_data
          args: []
          returns: None
          description: "Guidance keeps the untrusted-data framing and requires confirmed findings to cite primary sources, not digest prose."
        - kind: test_function
          name: test_self_improvement_digest_guidance_uses_registered_options_only
          args: []
          returns: None
          description: "The added guidance quotes only registered maid insights options and invents no flags."
validate:
  - uv run python -m pytest -q tests/test_self_improvement_digest_guidance.py
