description: 'Planning handoff only: tests are planned, red evidence is not captured, and this draft is
  not promotion-ready.


  Evidence: _repository_control_identity hashes common-dir refs and object metadata, so independent sibling
  Git writes change the identity even with stable task inputs.


  Design and acceptance: Separate source worktree/index/HEAD identity from shared immutable object availability
  and unrelated refs. Preserve mutation detection for actual tested inputs and snapshot-to-source writes.
  Reproduce concurrency with controlled barriers in disposable git repositories; avoid timing sleeps and
  user repositories. Do not delete all Git identity checks.


  Scope: preserve existing public signatures; finalize exact public artifact declarations before behavioral
  approval. Private implementation wiring below is provisionally scoped and must be narrowed after characterization.
  No fix is implemented by this triage.


  Expected red: the planned downstream scenario fails for the reported behavior on the current implementation;
  first distinguish unsupported syntax and environment failures from the intended assertion failure.


  Advisory lessons: use dedicated behavioral modules to avoid shared-lock churn; retain exact identity
  and negative cases; do not weaken evidence gates to resolve false positives.

  '
temptations:
- risk: Treat the reported avoid attributing unrelated sibling-worktree git writes to snapshot test commands
    scenario as a reason to bypass existing validation.
  instead: Separate source worktree/index/HEAD identity from shared immutable object availability and
