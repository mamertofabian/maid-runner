    Reproduce concurrency with controlled barriers in disposable git repositories; avoid timing sleeps
    and user repositories. Do not delete all Git identity checks.
- risk: Use private-helper assertions that pass while the downstream failure remains.
  instead: Exercise SharedEnvironmentProjectSnapshotBackend.create through the named regression scenarios,
    including the negative cases, before locking this draft.
