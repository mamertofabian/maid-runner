# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Add `maid chain merge --all` that runs the fragmentation report across every
  tracked production file and emits an aggregate DEFRAG/LEAN/BLOCKED summary — the
  finish-line view for a defrag program.
type: feature
created: '2026-08-13T22:10:00Z'
metadata:
  status: planning
  origin: manifest-test-consolidation-design-2026-08-13
  epic: chain-merge-defragmentation
  tags:
  - chain-merge
  - defragmentation
  - report
  - summary
  priority: low
description: |
  PLANNING HANDOFF DRAFT (inventory). Design + adversarial self-review only.
  Hardening agent writes tests, confirms red, validates, plan-reviews, and locks.

  ORIGIN

  The design note frames the purge as terminating work with a finish line: run a
  deterministic verdict across the repo and stop when every file is LEAN. A
  per-file report (child 1) answers one file; this child answers the whole repo in
  one run so the program has a scoreboard of structural counts (not a stopwatch).

  WHAT

  - `maid chain merge --all`: iterate ManifestChain.all_tracked_paths (or the
    writable production files), build each file's ChainMergeReport, and print an
    aggregate summary: counts of DEFRAG / LEAN / BLOCKED files and the worst
    offenders by redundant-declaration count. Text and single-document JSON.
  - Read-only; reuses child 1's builder per file. No apply.

  SCOPE BOUNDARIES

  IN: repo-wide iteration; aggregate DEFRAG/LEAN/BLOCKED summary; worst-offender
    ranking by redundancy; text/JSON; read-only.

  OUT: applying/materializing anything (child 4); the equivalence gate (child 5);
    parallel execution tuning; filtering DSLs beyond a simple verdict filter.

  EXPECTED RED PHASE

  Tests run `--all` against a fixture repo with mixed fragmentation and assert the
  aggregate counts + ranking. Red: `--all` does not exist.

  PLANNED BEHAVIORAL TESTS (to be written by the hardening agent)

  - `--all` on a fixture with N fragmented + M lean files reports the correct
    DEFRAG/LEAN/BLOCKED counts;
  - the worst-offender ranking orders files by redundant-declaration count
    descending, deterministically;
  - `--all --json` emits one document with a per-file verdict list and the
    aggregate;
  - `--all` writes nothing (read-only; manifest directory byte-unchanged);
  - determinism: repeated runs on the same tree produce an equal summary.

  PLANNED VALIDATE COMMANDS

  - uv run python -m pytest tests/cli/test_chain_merge_sweep.py -v
  - uv run maid validate manifests/drafts/chain-merge-repo-wide-sweep.manifest.yaml --mode schema --quiet

  OPEN QUESTIONS (hardening / plan review)

  - Which files count as production files to sweep (all_tracked_paths minus
    read-only/test paths); confirm the selection.
  - Whether `--all` accepts a verdict filter (e.g. only DEFRAG) in this child.

  ADVERSARIAL SELF-REVIEW

  - Mutation hazard: a sweep quietly applies. Defense: read-only; pin manifest-dir-
    unchanged.
  - Nondeterminism hazard: unordered file iteration. Defense: deterministic sort;
    pin a determinism test.
temptations:
- risk: Do not let `--all` apply or materialize anything.
  instead: Reuse child 1's read-only builder per file; pin a manifest-directory-
    unchanged test.
- risk: Do not emit a nondeterministic ordering or aggregate.
  instead: Sort files deterministically and pin a repeated-run equality test.
files:
  create:
  - path: maid_runner/core/chain_merge_sweep.py
    artifacts:
    - kind: function
      name: build_repo_merge_summary
      description: Builds an aggregate summary (DEFRAG/LEAN/BLOCKED counts and a
        deterministic worst-offender ranking) by running the per-file report over
        the repo's tracked production files; read-only. Exact signature finalized
        during hardening.
  read:
  - maid_runner/core/chain_merge.py
  - maid_runner/core/chain.py
  - maid_runner/cli/commands/chain.py
  - maid_runner/cli/commands/_main.py
  - manifests/drafts/chain-merge-fragmentation-report.manifest.yaml
  - AGENTS.md
validate:
- uv run python -m pytest tests/cli/test_chain_merge_sweep.py -v
- uv run maid validate manifests/drafts/chain-merge-repo-wide-sweep.manifest.yaml
  --mode schema --quiet
