# manifest-kind: epic
# promotion: split-before-promote
schema: "2"
goal: "Add first-class Google Antigravity support to MAID Runner across edit-time scope hooks, repo-local `maid init --tool antigravity` payloads, and user-level `maid skills install` onboarding."
type: feature
