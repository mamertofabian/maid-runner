# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Make save_manifest agree with load_manifest_raw about the output suffix so the core manifest writer cannot emit a file MAID rejects on read"
type: fix
created: "2026-07-25"
metadata:
  planning_state: draft-inventory
  promotion_ready: false
  tests_status: planned-not-created
  sibling_drafts:
    - manifests/drafts/089-02-honor-output-suffix-in-v1-conversion.manifest.yaml
    - manifests/drafts/089-03-validate-from-diff-output-suffix.manifest.yaml
  tags:
    - manifest-io
    - fail-loud
    - public-api
  priority: medium
description: |
  Not promotion-ready: behavioral tests are planned but not written, and the red
  phase is unconfirmed. Land this draft before 089-02 and 089-03, because
  `save_snapshot`'s YAML branch delegates here.

  Shared context for 089-01, 089-02, and 089-03 (recorded here because 089-01
  lands first; the three are sibling drafts, not an epic with children).

  `fix-snapshot-output-format-from-suffix` (landed 2026-07-25, commit 09b597e)
  fixed one instance of a defect family. Its implementation review identified
  three sibling writers with the same shape, each re-verified against the
  current tree before drafting rather than taken from the review report:

  - `save_manifest` (`maid_runner/core/manifest.py:465-469`) — this draft.
  - `convert_v1_file` (`maid_runner/compat/v1_loader.py:136-153`) — 089-02. The
    review packet called this `migrate_v1_to_v2`; no such symbol exists.
  - `write_from_diff_manifest` (`maid_runner/core/manifest_from_diff.py:108-120`)
    and its CLI guard — 089-03.

  The shared root cause is reader/writer asymmetry. `load_manifest_raw`
  (`maid_runner/core/manifest.py:423-436`) dispatches on the exact lowercase
  suffix: `.json` to strict `json.loads`, `.yaml`/`.yml` to the YAML loader, and
  anything else raises `Unknown extension`. Manifest chain discovery globs
  lowercase suffixes only. Every writer above ignores that contract, so each can
  emit a file MAID rejects on read while the command exits 0.

  The reference fix pattern is the one already shipped in `save_snapshot`
  (`maid_runner/core/snapshot.py:148-190`): derive the format from the suffix,
  match case-sensitively because the reader does, reject an unsupported suffix
  or one contradicting an explicit format, and validate before any filesystem
  effect so a rejected call leaves no partial artifact or orphan directory.

  These are three separate contracts rather than one, because they are distinct
  public writers with different consumers and blast radii. None of them may
  widen `load_manifest_raw` to accept new suffixes; making the reader
  case-insensitive is a separate contract with its own compatibility question
  and is out of scope for all three.

  `save_manifest` (`maid_runner/core/manifest.py:465-469`) renders YAML and
  writes it to whatever path it is handed:

  ```python
  def save_manifest(manifest: Manifest, path: Union[str, Path]) -> None:
      path = Path(path)
      data = _manifest_to_dict(manifest)
      rendered = yaml.dump(data, default_flow_style=False, sort_keys=False)
      path.write_text(prepend_manifest_header(rendered))
  ```

  `load_manifest_raw` (same module, lines 423-436) dispatches on the exact
  lowercase suffix and raises `Unknown extension` for anything outside
  `.json`/`.yaml`/`.yml`. So `save_manifest(m, "out.json")` writes YAML that the
  reader then rejects with a JSONDecodeError, and `save_manifest(m, "out.txt")`
  writes a file no MAID command can load.

  This is the same defect already fixed in `save_snapshot`
  (`maid_runner/core/snapshot.py:148-190`, commit 09b597e); reuse that pattern
  rather than inventing a second one: match the suffix case-sensitively because
  the reader does, and validate before any filesystem effect so a rejected call
  leaves nothing behind.

  Blocking design question to resolve before promotion. `save_manifest` is a
  public library export (`maid_runner/__init__.py:23,83` and
  `maid_runner/core/__init__.py:18,65`), so a hard rejection is potentially a
  breaking change for external consumers. Verified in-repo callers:

  - `maid_runner/core/snapshot.py:197` — always passes a suffix already
    validated by `save_snapshot`, so it is unaffected either way.
  - `tests/integration/test_library_api.py:523`,
    `tests/core/test_outcome_agent_provenance.py:62,73,83`,
    `tests/core/test_removed_artifacts.py:456` — all use `.yaml` paths.

  No in-repo caller breaks under strict rejection. The decision is therefore
  about external API compatibility only. Options, in the drafter's preferred
  order:

  1. Reject an unsupported suffix outright (consistent with `save_snapshot`,
     strongest fail-loud posture, a breaking change only for callers who were
     already producing unloadable files).
  2. Add an optional `format` parameter mirroring `save_snapshot`, rejecting
     only on contradiction.
  3. Emit JSON for `.json` and keep YAML as the fallback for unknown suffixes
     (weakest; leaves the silent-bad-artifact case open and is not recommended).

  Whichever is chosen, `.json` output must not receive the 086-01 banner, since
  JSON has no comment syntax.
temptations:
  - risk: "Do not widen load_manifest_raw to accept the suffixes the writer emits; that inverts the fix and is explicitly out of scope for epic 089."
    instead: "Change only the writer, and pin reader behavior as-is with a round-trip assertion."
  - risk: "Do not silently keep YAML as the fallback for unrecognized suffixes just to preserve compatibility; that is the defect."
    instead: "Pick option 1 or 2 from the description, record the choice and its rationale in the manifest, and pin the rejected case with a test asserting no file was written."
  - risk: "Do not assert only that a .json path contains JSON; a writer emitting valid-but-empty JSON would satisfy that."
    instead: "Round-trip through load_manifest_raw and assert declared goal and type survive, as tests/core/test_snapshot_output_format.py does."
files:
  edit:
    - path: maid_runner/core/manifest.py
      artifacts:
        - kind: function
          name: save_manifest
          args:
            - name: manifest
              type: Manifest
            - name: path
              type: Union[str, Path]
          returns: None
          description: >-
            PLANNED. Write the format the output suffix implies and reject an
            unsupported suffix before any filesystem effect, keeping the YAML-only
            self-describing banner off JSON output. Exact signature depends on
            whether the resolved design adds a format parameter.
  create:
    - path: tests/core/test_save_manifest_output_format.py
      artifacts:
        - kind: test_function
          name: test_save_manifest_json_suffix_round_trips_through_loader
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "PLANNED, NOT YET WRITTEN. A caller saves a manifest to a .json path."
          actions:
            - type: api_call
              subject:
                export: save_manifest
          expected:
            behavior: "load_manifest_raw parses the file with strict json.loads and the declared goal and type survive, with no YAML banner present."
        - kind: test_function
          name: test_save_manifest_unsupported_suffix_is_rejected_without_writing
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "PLANNED, NOT YET WRITTEN. A caller saves a manifest to a path MAID cannot load, such as .txt or uppercase .YAML."
          actions:
            - type: api_call
              subject:
                export: save_manifest
          expected:
            behavior: "save_manifest raises naming the unsupported suffix and leaves no file on disk."
        - kind: test_function
          name: test_save_manifest_yaml_suffix_still_writes_banner_and_loads
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "PLANNED, NOT YET WRITTEN. The unchanged .yaml path is exercised as a regression guard."
          actions:
            - type: api_call
              subject:
                export: save_manifest
          expected:
            behavior: "The file round-trips through load_manifest_raw and still starts with the 086-01 self-describing banner."
  read:
    - maid_runner/core/snapshot.py
    - maid_runner/__init__.py
    - tests/core/test_snapshot_output_format.py
    - tests/integration/test_library_api.py
validate:
  - uv run maid validate manifests/drafts/089-01-honor-output-suffix-in-save-manifest.manifest.yaml --mode schema --quiet
