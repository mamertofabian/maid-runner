        - kind: attribute
          name: evidence_run
          of: BufferedTestExecution
          type: RuntimeEvidenceRun
        - kind: attribute
          name: reused_group_keys
          of: BufferedTestExecution
          type: tuple[tuple[str, tuple[str, Ellipsis], tuple[str, Ellipsis]], Ellipsis]
        - kind: attribute
          name: residual_commands
          of: BufferedTestExecution
          type: tuple[tuple[tuple[str, Ellipsis], str], Ellipsis]
        - kind: attribute
