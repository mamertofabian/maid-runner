# draft-kind: implementation
schema: "2"
goal: "Reuse proven artifact-coverage pytest execution in deep verify without moving residual commands"
type: refactor
created: "2026-08-10T17:10:00+08:00"
metadata:
  status: planning
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - verify
    - artifact-coverage
    - runtime-evidence
description: |
  After 121-09 proves report equivalence, execute compatible pytest groups at
  the existing artifact-coverage boundary and retain their ordinary results.
  Artifact coverage evaluates the attributed bundle. At the later tests stage,
  reuse only a whole ordinary-plan group whose command, targets, behavior
  options, environment, and content identity match; partial groups are never
  reused. Run residual, non-pytest, unsupported, and non-overlapping commands
  there for the first time. This avoids moving their filesystem/external side
  effects earlier.

  Preserve external stage names, ordering, fail-fast behavior, E710/E900
  findings, test failures, and deterministic text/JSON. A digest mismatch,
  resolved-environment change, changed command plan, missing result, or
  incomplete group runs the current ordinary/legacy path visibly. Recompute
  all command-observable project state, including relevant generated/untracked
  bytes, immediately before reuse. Because in-place knockout sits between the
  two stages at this point in the sequence, `knockout=True` disables buffered
  ordinary-result reuse until 121-13 proves isolated Git-safe snapshots; tests
  run fresh after knockout. The standalone artifact-coverage command keeps its
  existing behavior and may use evidence only within its own invocation.
temptations:
  - risk: "Do not execute every residual command early merely to build one BatchTestResult."
    instead: "Buffer only overlapping pytest groups and execute the residual plan at the existing tests-stage boundary."
  - risk: "Do not reuse a partial or merely similar ordinary pytest group."
    instead: "Require exact command/target/behavior/environment/content identity for the whole planned group or run it normally at the tests stage."
  - risk: "Do not hide test failure because artifact coverage already reported the command."
    instead: "Retain the ordinary result and emit the same tests-stage failure if verification reaches that stage."
  - risk: "Do not remove or rename artifact_coverage and tests stages."
    instead: "Share internal execution while preserving separate stage results, ordering, and automation payloads."
  - risk: "Do not reuse across changed runner/environment/project bytes or the current in-place knockout stage."
    instead: "Bind typed environment plus observable state, recheck immediately, and run tests fresh when knockout precedes isolation."
files:
  create:
    - path: tests/cli/test_verify_deep_evidence_reuse.py
      artifacts:
        - kind: test_function
          name: test_deep_executes_each_overlapping_pytest_node_once_across_coverage_and_tests
          args: []
        - kind: test_function
          name: test_residual_and_nonpytest_commands_first_execute_at_tests_stage
          args: []
        - kind: test_function
          name: test_partial_or_environment_different_group_is_not_reused
          args: []
        - kind: test_function
          name: test_deep_preserves_artifact_coverage_before_tests_stage_output
          args: []
        - kind: test_function
          name: test_deep_json_matches_legacy_findings_and_tests_except_durations
          args: []
        - kind: test_function
          name: test_deep_test_failure_remains_visible_from_buffered_result
          args: []
        - kind: test_function
          name: test_artifact_coverage_fail_fast_does_not_emit_later_tests_stage
          args: []
        - kind: test_function
          name: test_changed_content_or_command_plan_runs_exact_fallback
          args: []
        - kind: test_function
          name: test_verify_worker_override_survives_coverage_and_buffered_tests_path
          args: []
          description: "Proves the parsed value reaches prepare, completion, and residual execution without being replaced by project defaults."
        - kind: test_function
          name: test_changed_resolved_environment_identity_runs_fresh_tests
          args: []
        - kind: test_function
          name: test_intervening_generated_or_untracked_side_effect_runs_fresh_tests
          args: []
        - kind: test_function
          name: test_knockout_disables_buffered_test_result_reuse_before_snapshot_isolation
          args: []
  edit:
    - path: maid_runner/core/test_runner.py
      artifacts:
