# draft-kind: implementation
schema: "2"
goal: "Build deduplicated knockout mutation specs without sharing declaration execution state"
type: refactor
created: "2026-08-10T17:11:00+08:00"
metadata:
  status: planning
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - knockout
    - deduplication
description: |
  The active chain contains 1,093 declarations but only 554 unique
  file/kind/class/name mutations. Build one immutable mutation specification
  per identity while retaining every manifest, declaration index, original
  command, and source digest. This child changes planning only: the existing
  runner still executes and restores each declaration independently.

  Do not run several declarations inside one mutation lifetime. The legacy
  runner restores the target bytes between declaration runs while retaining
  its established serial command-side-effect order; holding one mutation open
  across declarations would be observably different even when identities
  match. Shared scheduling begins only after 121-13 proves isolated snapshots;
  121-14 must give each declaration a fresh/reset child snapshot. This child
  does not narrow commands, change dirty-file refusal, create snapshots, add
  workers, or claim a runtime reduction.
temptations:
  - risk: "Do not deduplicate only by artifact name."
    instead: "Use normalized file, kind, parent class, and name identity bound to current source digest."
  - risk: "Do not collapse manifest attribution when commands are shared."
    instead: "Retain immutable declaration records and their exact command order in each unique specification."
  - risk: "Do not apply --knockout-limit after deduplication."
    instead: "Select legacy declaration order first, then deduplicate the selected identities."
  - risk: "Do not execute separate declarations in one mutable mutation lifetime."
    instead: "Keep legacy per-declaration restore semantics until independently reset snapshot children are available."
files:
  create:
    - path: tests/core/test_knockout_batch.py
      artifacts:
        - kind: test_function
          name: test_duplicate_declarations_build_one_unique_spec_without_combined_execution
          args: []
        - kind: test_function
          name: test_unique_spec_retains_independent_manifest_declaration_records
          args: []
        - kind: test_function
          name: test_spec_plan_preserves_legacy_declaration_and_command_order
          args: []
        - kind: test_function
          name: test_limit_selects_declaration_order_before_deduplication
          args: []
        - kind: test_function
          name: test_source_digest_change_rejects_stale_spec
          args: []
        - kind: test_function
          name: test_inter_declaration_target_restore_and_command_side_effect_order_match_legacy
          args: []
          description: "Scenario: the first duplicate command writes project state; action: run both declarations with and without spec planning; expected: target restore points, side-effect order, and outcomes are byte-for-byte legacy-equivalent."
  edit:
    - path: maid_runner/core/knockout.py
      artifacts:
        - kind: class
          name: KnockoutArtifactIdentity
          description: "Normalized unique mutation identity."
        - kind: attribute
          name: file_path
          of: KnockoutArtifactIdentity
          type: str
        - kind: attribute
          name: artifact_name
          of: KnockoutArtifactIdentity
          type: str
        - kind: attribute
          name: artifact_kind
          of: KnockoutArtifactIdentity
          type: str
        - kind: attribute
          name: parent_class
          of: KnockoutArtifactIdentity
          type: str | None
        - kind: class
          name: KnockoutDeclaration
          description: "Manifest/declaration/command attribution retained through deduplication."
        - kind: attribute
          name: manifest_path
          of: KnockoutDeclaration
          type: str
        - kind: attribute
          name: manifest_slug
          of: KnockoutDeclaration
          type: str
        - kind: attribute
          name: declaration_index
          of: KnockoutDeclaration
          type: int
        - kind: attribute
          name: commands
          of: KnockoutDeclaration
          type: tuple[tuple[str, Ellipsis], Ellipsis]
        - kind: class
          name: KnockoutMutationSpec
          description: "Unique current-source mutation plus all declaring manifests."
        - kind: attribute
          name: identity
          of: KnockoutMutationSpec
          type: KnockoutArtifactIdentity
        - kind: attribute
          name: source_digest
          of: KnockoutMutationSpec
          type: str
        - kind: attribute
          name: declarations
          of: KnockoutMutationSpec
          type: tuple[KnockoutDeclaration, Ellipsis]
        - kind: function
          name: build_knockout_mutation_specs
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: limit
              type: int | None
              default: "None"
          returns: tuple[KnockoutMutationSpec, Ellipsis]
          description: "Applies legacy declaration limits, then builds deduplicated exact current-source identities without changing execution."
  read:
    - manifests/drafts/121-00-fast-verification-roadmap.epic.yaml
    - manifests/068-02-add-artifact-knockout-harness.manifest.yaml
    - manifests/068-03-wire-knockout-into-verify.manifest.yaml
    - maid_runner/core/_test_command_execution.py
    - tests/core/test_knockout.py
    - tests/cli/test_verify_knockout_cmd.py
    - docs/plans/full-and-deep-verification-performance-redesign.md
validate:
  - uv run python -m pytest -q tests/core/test_knockout_batch.py tests/core/test_knockout.py tests/cli/test_verify_knockout_cmd.py
  - uv run maid validate manifests/drafts/121-11-deduplicate-knockout-mutation-specs.manifest.yaml --mode schema --quiet
