# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Document the `maid chain merge` family (report, evidence-backed acceptance,
  apply/materialize, equivalence gate, repo-wide sweep) in the MAID spec and a
  command reference, and reconcile the consolidation design note.
type: refactor
created: '2026-08-13T22:15:00Z'
metadata:
  status: planning
  origin: manifest-test-consolidation-design-2026-08-13
  epic: chain-merge-defragmentation
  tags:
  - chain-merge
  - documentation
  - maid-spec
  priority: low
description: |
  PLANNING HANDOFF DRAFT (inventory). Design + adversarial self-review only.
  Documentation child; the hardening agent confirms accuracy against the shipped
  commands before locking. Runs LAST, after the functional children land.

  ORIGIN

  The spec's "Consolidated Snapshots" section (docs/maid_specs.md) already says
  "a tool can be run to generate a snapshot" but never named a command or covered
  the behavioral (test-consolidation) half. Once the `maid chain merge` family
  exists, the spec and a command reference must describe it, and the design note
  must be reconciled to point at the shipped commands instead of a proposal.

  WHAT

  - Extend the Consolidated Snapshots section of docs/maid_specs.md to describe
    the `maid chain merge` family: `--dry-run` report + verdict, evidence-backed
    acceptance spec, `--apply` materialize + provenance migration, the
    `--verify-equivalence` gate (superset of coverage + detecting-nodeids), and
    `--all` sweep. State the determinism/evidence boundary explicitly.
  - Add a concise command reference doc (docs/maid-chain-merge.md).
  - Reconcile docs/plans/maid-runner-manifest-test-consolidation.md to reference
    the shipped commands and mark the tooling questions it raised as resolved.

  NOTE: pure markdown edits may skip full behavioral MAID per AGENTS.md, but doc
  changes under docs/ require `make sync-agent-payloads` so packaged copies stay
  in sync; the validate step includes it.

  SCOPE BOUNDARIES

  IN: spec + command-reference + design-note documentation for the shipped
    `maid chain merge` family; accuracy verified against the commands.

  OUT: any behavior change; documenting unshipped flags; skill/agent-payload
    content changes beyond the required sync.

  EXPECTED RED PHASE

  Characterization/accuracy check: a doc test (or `maid howto`/help snapshot)
  asserts the command reference matches the shipped `maid chain merge --help`.
  Red: the reference does not exist / does not match.

  PLANNED BEHAVIORAL TESTS (to be written by the hardening agent)

  - the command-reference doc lists every shipped `maid chain merge` mode and
    matches `--help` output (accuracy characterization);
  - the packaged doc copies are in sync after `make sync-agent-payloads`.

  PLANNED VALIDATE COMMANDS

  - uv run python -m pytest tests/docs/test_chain_merge_docs.py -v
  - uv run maid validate manifests/drafts/chain-merge-docs.manifest.yaml --mode schema --quiet

  OPEN QUESTIONS (hardening / plan review)

  - Whether a `maid howto chain-merge` entry is added alongside the reference doc.
  - How tightly to characterize doc/help parity without pinning prose word-for-word.

  ADVERSARIAL SELF-REVIEW

  - Drift hazard: docs describe unshipped flags. Defense: accuracy test against
    `--help`; docs child runs last.
  - Payload-desync hazard: docs/ edited without payload sync. Defense: validate
    includes `make sync-agent-payloads` and a sync test.
temptations:
- risk: Do not document flags or behavior that the functional children did not
    ship.
  instead: Verify the reference against `maid chain merge --help`; run this child
    last.
- risk: Do not edit docs/ without syncing packaged payload copies.
  instead: Run `make sync-agent-payloads` and pin a payload-in-sync test.
- risk: Do not pin doc prose word-for-word as the contract.
  instead: Characterize command/help parity, not exact wording.
files:
  create:
  - path: docs/maid-chain-merge.md
    artifacts:
    - kind: attribute
      name: _maid_chain_merge_command_reference
      of: manifest
      type: documentation
      description: Command reference for the `maid chain merge` family (report,
        acceptance spec, apply/materialize, equivalence gate, sweep) with the
        determinism/evidence boundary stated. Content finalized during hardening.
  read:
  - docs/maid_specs.md
  - docs/plans/maid-runner-manifest-test-consolidation.md
  - manifests/drafts/chain-merge-fragmentation-report.manifest.yaml
  - manifests/drafts/chain-merge-apply-materialize.manifest.yaml
  - manifests/drafts/chain-merge-equivalence-gate.manifest.yaml
  - AGENTS.md
validate:
- uv run python -m pytest tests/docs/test_chain_merge_docs.py -v
- uv run maid validate manifests/drafts/chain-merge-docs.manifest.yaml --mode schema
  --quiet
