description: |
  This split-before-promote epic has been consumed. Its implementation-sized
  child contracts were promoted as `097-01` through `097-03` and each records
  a completed Outcome.

  Together the children deliver privacy-bounded, local-only feedback export,
  fail-closed anonymous aggregation, and governed self-improvement intake.
  Imported reports remain advisory evidence that must be reproduced against
  the current MAID Runner tree before routing. There is no network transport,
  background upload, automatic issue creation, validator-policy mutation, or
  automatic self-modification in this completed roadmap.

  The file remains in `manifests/drafts/` only as a historical pointer.
  Do not promote or implement this archived epic. Any future submission mechanism
  requires a separate privacy and security specification covering explicit
  consent, destination ownership, authentication, retention, deletion,
  licensing, abuse handling, and service availability.
