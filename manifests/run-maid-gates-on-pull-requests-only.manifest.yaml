        - --since
        - 5e51cace
      status: passed
      summary: "All 11 deep verification stages passed, including plan-lock integrity, artifact coverage, knockout, scope, and tests."
    - command:
        - uv
        - run
        - maid
        - test
      status: failed-unrelated
      summary: "300 of 301 commands passed; the sole broad command failure was two release-metadata assertions caused by the pre-task local changelog commit at baseline 5e51cace."
  completed_at: "2026-09-18T09:12:19+08:00"
