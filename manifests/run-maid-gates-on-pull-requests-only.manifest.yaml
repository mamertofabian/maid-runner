    - command:
        - uv
        - run
        - maid
        - validate
      status: passed
      summary: "All 310 active manifests passed; 366 superseded manifests were skipped."
    - command:
        - uv
        - run
        - maid
        - verify
        - --profile
        - deep
        - --manifest-dir
        - manifests
        - --test-scope
        - task
        - --require-plan-lock
