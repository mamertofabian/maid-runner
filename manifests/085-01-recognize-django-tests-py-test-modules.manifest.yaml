schema: '2'
goal: Classify Django's app-level tests.py convention as a Python behavioral test file so declared artifacts exercised there stop failing E200 and plan locks hash it as a behavioral test
type: fix
created: '2026-07-18T00:20:39Z'
metadata:
  epic: manifests/drafts/085-00-plan-lock-ceremony-reduction.epic.yaml
  bug_report: ~/.maid/bug-report/20260714-110500-manatal-coop-django-tests-py.md
  tags:
  - test-discovery
  - django
  - e200
  - plan-lock
  priority: high
description: |
  `maid_runner/core/_file_discovery.py` classifies Python test files via
  `_TEST_PATTERNS` (`test_*.py`, `*_test.py`) plus the exact name
  `conftest.py`. Django's standard app-level module is named exactly
  `tests.py`, so behavioral validation ignores an explicitly declared
  Django test module and reports E200 for every artifact it exercises
  (bug report 20260714-110500; the 2026-07-16 goal-run log shows 138 E200
  occurrences, concentrated in the Django api repo). Renaming the file
  makes the artifacts visible without changing content, proving this is a
  filename-heuristic gap, not a project error.

  There are two Python test-file classifiers in the tree:

  - `maid_runner/core/_file_discovery.py::is_test_file` (public) — used by
    `_command_integrity_test_discovery.py`, which feeds
    `find_command_integrity_test_files` and therefore plan-lock behavioral
    test hashing (`_behavioral_test_paths` in core/plan_lock.py).
  - `maid_runner/core/manifest.py::_is_test_file` (private) — used by
    manifest-level classification, including the stash-revise target
    filtering in cli/commands/plan.py.

  Pinned decisions (do not redesign):

  1. Add ONLY the exact basename `tests.py` (case-sensitive, like the
     existing patterns). Do not add `test.py`, `*tests*.py`, or
     directory-based rules such as `tests/*.py`; those over-classify real
     production modules. The documented limit is: Django's app convention
     is the exact name `tests.py`, nothing broader.
  2. Single source of truth: make the private classifier in
     `maid_runner/core/manifest.py` delegate to
     `_file_discovery.is_test_file` instead of duplicating pattern lists,
     so this and any future pattern change lands in exactly one place. The
     delegation must preserve the existing JS/TS suffix behavior
     (`.test.ts` etc.), which both classifiers already agree on.
  3. No new config surface. This is a convention-recognition fix, not a
     configurable pattern system.
  4. JS/TS patterns are untouched.

  Sequencing: first child of epic 085. It has no dependency on the other
  children and removes the highest-frequency false-friction (every touch
  of a Django app currently manufactures E200 churn that later children's
  own validation runs would keep hitting).

  Behavioral tests live in the dedicated
  tests/core/test_django_tests_py_discovery.py module because existing
  discovery test files are hashed by older plan locks (see the 076-02
  Outcome lesson about shared behavioral test files). Delegation adopts
  the public classifier's case-sensitive basename rules (exact `tests.py`,
  not `Tests.py`), matching the pinned exact-basename decision.
temptations:
- risk: Do not broaden the pattern to tests/ directories, test.py, or fuzzy substring matches to make more repos pass.
  instead: Add the exact basename tests.py to the one public classifier and prove the negative cases (mytests.py, tests_util.py, test.py) stay non-test in a behavioral test.
- risk: Do not fix only _file_discovery.is_test_file and leave manifest.py's private classifier divergent.
  instead: Delegate the private classifier to the public one and cover the delegation through observable behavior (stash target filtering or manifest classification), not by importing the private symbol.
- risk: Do not assert on the private _TEST_PATTERNS list or the private _is_test_file helper in tests.
  instead: Exercise is_test_file directly and validate end-to-end behavior through maid validate on a fixture manifest declaring artifacts used in a tests.py module.
files:
  create:
  - path: tests/core/test_django_tests_py_discovery.py
    artifacts:
    - kind: test_function
      name: test_is_test_file_recognizes_django_tests_py
      source_scenario: A path whose basename is exactly tests.py, at repo root and nested under an app package (importer/tests.py).
      actions:
      - type: api_call
        subject:
          function: is_test_file
      expected:
        behavior: is_test_file returns True for both paths.
    - kind: test_function
      name: test_is_test_file_rejects_similar_non_test_names
      source_scenario: Paths named mytests.py, tests_util.py, test.py, and tests.txt.
      actions:
      - type: api_call
        subject:
          function: is_test_file
      expected:
        behavior: is_test_file returns False for every one of them, pinning the exact-basename limit documented in the manifest.
    - kind: test_function
      name: test_behavioral_validation_sees_artifacts_used_in_django_tests_py
      source_scenario: Reproduction of bug report 20260714-110500 in a temp project — a manifest declares a public artifact, lists app/tests.py under files.read, and app/tests.py imports and exercises the artifact.
      actions:
      - type: api_call
        subject:
          function: validate
      expected:
        behavior: Behavioral validation (maid_runner.core.validate.validate) reports no E200 for the artifact; removing the usage from app/tests.py brings E200 back.
    - kind: test_function
      name: test_plan_lock_hashes_django_tests_py_as_behavioral_test
      source_scenario: A lockable temp-project manifest whose only behavioral test module is app/tests.py.
      actions:
      - type: api_call
        subject:
          function: create_plan_lock
      expected:
        behavior: The created lock's test_hashes include app/tests.py, so E701 tamper detection covers Django test modules.
    - kind: test_function
      name: test_manifest_path_validation_classifies_django_tests_py
      source_scenario: |
        A temp-project manifest whose validate command is a non-pytest harness targeting parent-relative ../escape/tests.py. Non-pytest commands disable directory heuristics, so recognition depends on the private classifier (same helper stash-revise uses), without importing private symbols.
      actions:
      - type: api_call
        subject:
          function: validate_manifest_paths
      expected:
        behavior: |
          validate_manifest_paths reports MANIFEST_PATH_OUTSIDE_PROJECT for ../escape/tests.py. Without private-classifier delegation, the path is not recognized as a test path and the escape is silently skipped — pairing temptation #2.
  edit:
  - path: maid_runner/core/_file_discovery.py
    artifacts:
    - kind: function
      name: is_test_file
      args:
      - name: path
        type: str
      returns: bool
      description: Classifies the exact basename tests.py as a Python test file, in addition to the existing conftest.py, test_*.py, *_test.py, and JS/TS test/spec suffix rules. No other classification change.
  scope:
  - path: maid_runner/core/manifest.py
    reason: Delegate the private test-file classifier to _file_discovery.is_test_file so the tests.py rule has a single source of truth; no public surface change in this file.
  read:
  - maid_runner/core/_command_integrity_test_discovery.py
  - maid_runner/core/plan_lock.py
validate:
- uv run python -m pytest tests/core/test_django_tests_py_discovery.py -v
- uv run maid validate manifests/085-01-recognize-django-tests-py-test-modules.manifest.yaml --mode behavioral --quiet
- uv run maid validate manifests/085-01-recognize-django-tests-py-test-modules.manifest.yaml --mode schema --quiet
