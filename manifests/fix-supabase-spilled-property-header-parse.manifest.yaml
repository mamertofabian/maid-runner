schema: '2'
goal: Recover valid generated in_-prefixed property headers spilled into a preceding type annotation
type: fix
created: '2026-09-30T08:29:43Z'
metadata:
  priority: high
  tags:
  - typescript
  - supabase
  - parser-compatibility
  - assess
  bug_report: 20260916-215922-orchestrate-distribute-flow-typescript-assess.md
description: |-
  Finish the reported generated Supabase TypeScript parse failure. Current source
  still fails at id/string annotations on lines 311/329/347. Read-only grammar
  inspection shows each ERROR contains the preceding string type, a next-line
  in_reconciliation identifier, optional ? and colon under type_annotation of a
  property_signature in object_type. The existing workaround only matches ERROR
  bytes beginning with the in_ header and therefore misses this spilled shape.
  Extend the existing same-width in_-property repair narrowly. Keep current
  anchored-error behavior; additionally identify the documented header from direct
  parser child tokens within an ERROR owned by a property type annotation in an
  object/interface property container. Require an ASCII in_ identifier followed
  by exactly optional ? and colon, and a real newline separator after the preceding
  annotation token. Do not globally search/replace identifier text or accept
  same-line missing separators. Use standard tree-sitter context and existing
  property-shape rule, not a custom type/control-flow or reachability analyzer.
  Replace only the leading two in bytes at the identified property-name offset
  for parser input. Preserve original source_bytes, original collector names and
  byte coordinates. Retain strict fewer-diagnostic adoption, unrelated errors,
  existing type-query/JSX repair composition and public parser signatures.
  Support Row/Insert/Update required and optional fields, LF/CRLF and Unicode
  prefixes. Strings/comments, already valid source and malformed adjacent fields
  must remain protected. Assessment must read immutable baseline bytes through
  the same public parser rather than rewriting generated files or historical Git.
  Prior fix-supabase-generated-types-parser Outcome requires exact error-scoped
  same-width rewriting and a malformed neighbor; this extension follows those
  rules while handling the newly confirmed error ownership shape. The recent
  JSX parser contract reinforced carrying accepted parser input between stages.
  New tests use a dedicated module; older manifests/locks/tests remain intact.
temptations:
- risk: Globally replace in_ names or search raw ERROR strings without parser ownership.
  instead: Use direct child-token header shape and property-annotation/container ownership plus newline separation; replace only the identified two-byte name prefix.
- risk: Rewrite the preceding id/string annotation or alter original source bytes.
  instead: Retain session source_bytes and collector input unchanged; mask only the parser property-name prefix at its original offset.
- risk: Suppress syntax errors merely because the file is generated or a build passes.
  instead: Reparse and adopt only a strict diagnostic reduction; retain malformed neighboring property and unrelated-line regressions.
- risk: Repair only the current file and leave assessment blocked by old baseline bytes.
  instead: Exercise assessment against a real immutable Git baseline through public APIs and keep generated consumer files untouched.
