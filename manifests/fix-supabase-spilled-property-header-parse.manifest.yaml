    - kind: test_function
      name: test_full_row_insert_update_shapes_preserve_original_alias_fields_and_offsets
      description: Full Row/Insert/Update shapes collect original field names rather than placeholder names and preserve following artifacts/Unicode line locations.
    - kind: test_function
      name: test_spilled_header_recovery_preserves_malformed_or_unrelated_fields
      description: Same-line missing separators, missing colons/types, duplicate optional markers and malformed/unrelated siblings remain syntax errors.
    - kind: test_function
      name: test_spilled_header_repair_retains_the_unrelated_error_line
      description: Recovery removes only the known header grammar error while retaining the independent error at its original line.
    - kind: test_function
      name: test_header_looking_literals_and_valid_semicolon_fields_remain_unmodified
      description: Quoted/comment header text and already valid semicolon-delimited fields are not rewritten.
    - kind: test_function
      name: test_assessment_accepts_spilled_headers_in_an_immutable_generated_baseline
      description: Assessment parses both generated baseline and current additions without editing historical source.
