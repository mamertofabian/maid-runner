# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Collect Python PEP 695 type aliases as declared type artifacts
type: fix
created: '2026-10-20T19:09:05Z'
description: 'Collect public module-level PEP695 type statements as TYPE artifacts on interpreters that
  support the syntax, using the existing alias target renderer and type_parameters fields. Preserve alias
  name, target, source position and exact type-parameter declaration text (ordinary, bounded, TypeVarTuple
  and ParamSpec). Both public collection seams, exact implementation validation and public snapshot/save/load/validation
  roundtrips must agree. Wrong declared target or nonempty parameters remain E302 rather than a missing
  E300. No schema, parser or type-matching redesign. Preserve Python3.10 import/legacy TypeAlias compatibility
  using guarded AST access; unsupported or malformed syntax remains explicit parse errors. Preserve existing
  class/local alias behavior and private snapshot filtering; this report concerns module aliases, not
  new class-member type semantics. A module alias name is a binding: reuse the existing module-target
  invalidation path so aliases shadowing Protocol/module imports cannot retain trusted identities, while
  type-parameter names stay local to the alias and do not rebind module Protocol. Recall had no related
  records; apply existing producer/bounded-binding lessons and reject unrelated performance/enrichment
  work.'
temptations:
- risk: Emit only alias names while losing target or generic metadata, or bypass public exact validation/snapshot
    paths.
  instead: Reuse existing renderer/type_parameters fields and test both public collectors, exact positive/mismatch
    gates and serialized snapshot roundtrip.
- risk: Keep trusted Protocol/typing import identity after a type alias rebinds its module name, or treat
    type-parameter names as module assignments.
  instead: Route actual module alias binding through the existing unbinding path; retain type-parameter
    local scope and fail closed on shadowed origins.
- risk: Require ast.TypeAlias at import time on older interpreters or expand into new class/local alias
    semantics.
  instead: Keep guarded AST handling and explicit parse errors for unsupported syntax; preserve legacy/private/class/local
    behavior within this module-alias fix.
