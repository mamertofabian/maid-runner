    reason: Standard optional-hook metadata on existing xdist callbacks; no public API/body changes.
  - path: maid_runner/core/_pytest_timing_plugin.py
    reason: Standard optional-hook metadata on existing xdist callbacks; no public API/body changes.
  - path: docs/plans/bug-report-triage-2026-10-20.md
    reason: Record confirmed final contract, report resolution and current inventory including resolved
      duplicate.
