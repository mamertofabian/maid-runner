        type: float
      - name: environment_overrides
        type: Mapping[str, str] | None
        default: None
      - name: environment_removals
        type: Sequence[str]
        default: ()
      returns: RuntimeCommandRecord
      description: Run actual normalized pytest arguments with unchanged environment controls and real
        coverage/call observations.
