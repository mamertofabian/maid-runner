# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Allow injected pytest evidence plugins to run when optional xdist is absent
type: fix
created: '2026-10-21T00:24:37Z'
description: 'Confirmed report 20261007-063548-manatal-loan-deep-tests.md: ordinary pytest without xdist
  exits3 when MAID runtime instrumentation registers unknown pytest_configure_node/testnodedown hooks.
  The timing plugin also registers xdist-only collection/worker hooks; generated coverage plugin registers
  configure_node. Mark only these existing xdist-specific hooks optional through standard pytest.hookimpl(optionalhook=True),
  importing pytest inside the generated plugin source as needed. No xdist installation/dependency, fallback
  fabricated evidence, swallowed plugin errors, hook removal or changes to worker lifecycle/aggregation.
  Exercise public collect_runtime_evidence serial and explicit xdist, public subprocess executor with
  timing plugin serial/explicit xdist and generated coverage plugin controller launching a serial pytest
  child. Autoload is disabled for actual no-xdist serial regressions and explicit timing/coverage worker
  controls; runtime-evidence worker control uses its existing normal-autoload capability probe. No capability-probe
  behavior change is in scope. Baseline has three intended unknown-hook failures and two enabled-worker
  controls passing. Assert real tests, nodeids/timing/completeness and target call coverage; retain existing
  worker-loss/incomplete fail-closed controls. Private hook wiring uses existing fully covered production
  files; executor API/signatures unchanged. Reconcile the final report inventory and later resolved duplicate
  within existing triage documentation; no new evidence ledger. Recall from 121-04 and 121-15 calls for
  retained real subprocess adapter coverage and direct call/line records, applied here alongside exact
  selected node and timing evidence. Their historical broad inventory/Protocol class limitations and performance
  equivalence budgets do not expand this optional-hook metadata fix. Contract revision after confirmed
  self-instrumentation collision: the broad compatibility runtime suite replaces sys.monitoring with FakeMonitoring
  then constructs coverage collectors, causing missing LINE/tool1-occupied errors and coverage collector-stack
  teardown assertions under external artifact instrumentation. All79 adjacent cases remain separately
  run compatibility checks and part of full repository command validation; they are not behavioral contract
  inputs for this narrow metadata fix. Dedicated5 public regressions alone must prove both declared executor
  artifacts through the unchanged artifact-coverage and knockout gates. No production instrumentation
  redesign or coverage opt-out; preserve test bytes and recapture genuine baseline red through sanctioned
  stash-backed revision.'
temptations:
- risk: Install xdist or ignore unknown hook errors to force serial pytest through.
  instead: Use standard optional-hook declarations only for actual xdist hooks, prove genuine serial no-xdist
    execution, and preserve explicit xdist worker evidence.
- risk: Remove worker lifecycle hooks, manufacture complete evidence or test private generated source
    text rather than execution.
  instead: Keep hook bodies/lifecycle and aggregation unchanged; run public instrumentation with actual
    subprocesses and assert observed calls, selected nodes and evidence files. Existing incomplete-worker
    controls remain.
