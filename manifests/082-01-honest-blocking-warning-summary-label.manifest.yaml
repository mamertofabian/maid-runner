  rationale: "The change stays presentation-only: `stage.success` remains the blocking source of truth, verify policy and exit-code behavior are unchanged, and the builder uses structural severity evidence instead of duplicating warning-code policy from verify.py. Failed stages are warning-driven only when structured stage findings include at least one warning-severity diagnostic and no error-severity evidence; plain stage errors and error-severity validation diagnostics remain error-driven."
