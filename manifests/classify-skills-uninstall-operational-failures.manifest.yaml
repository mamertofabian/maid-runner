schema: "2"
goal: Classify expected skills-uninstall safety failures as operational errors
type: fix
created: "2026-08-20T10:53:11Z"
metadata:
  planning_state: behavioral-contract
  promotion_ready: true
  tests_status: created-red-confirmed
  status: implementation-ready
  tags: [cli, uninstall, windows, filesystem-safety]
  priority: high
description: |
  Keep `maid skills uninstall` consistent with `maid init --uninstall` when
  ownership or filesystem safety checks reject a mutation. The uninstall
  backend deliberately raises OSError for filesystem failures and ValueError
  for changed ownership, identity, or link boundaries. Both are expected,
  user-actionable operational failures: print the existing diagnostic and exit
  1. Preserve the global exit-2 path for unexpected programmer/internal errors.

  This is additive contract coverage for existing CLI composition. It changes
  no public signature, mutation algorithm, quarantine behavior, or rollback
  policy and does not supersede the Windows uninstall contract.
temptations:
- risk: Do not catch every Exception in the skills handler to make the CI job green.
  instead: Catch only the documented OSError and ValueError operational failures and leave unexpected exceptions to the global internal-error boundary.
- risk: Do not change the quarantine backend or weaken fail-closed validation.
  instead: Limit implementation to CLI error classification after the backend has already restored or preserved recoverable state.
files:
  scope:
  - path: maid_runner/cli/commands/skills.py
    reason: Existing private command-handler composition maps documented backend safety failures to the public CLI exit contract without adding an artifact.
  edit:
  - path: tests/cli/test_skills_install.py
    artifacts:
    - kind: test_function
      name: test_skills_uninstall_classifies_validation_rejection_as_operational_failure
      args:
      - {name: tmp_path, type: Path}
      - {name: monkeypatch, type: pytest.MonkeyPatch}
      - {name: capsys, type: pytest.CaptureFixture}
      returns: None
      description: A documented ValueError safety rejection is printed and returned as exit 1 rather than being mislabeled as an internal exit-2 failure.
  read:
  - manifests/fix-windows-uninstall-portability.manifest.yaml
  - maid_runner/core/skill_install.py
  - maid_runner/core/uninstall.py
validate:
- uv run python -m pytest -q tests/cli/test_skills_install.py
