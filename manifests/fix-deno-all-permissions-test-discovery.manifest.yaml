  - command:
    - uv
    - run
    - maid
    - test
    - --manifest
    - manifests/fix-deno-all-permissions-test-discovery.manifest.yaml
    status: passed
    summary: All 50 contract cases passed, including native Deno execution. The focused adjacent
      runner/target regression suite passed 190 tests. Ruff, Black and diff checks passed.
  - command:
    - uv
    - run
    - maid
    - validate
    status: passed
    summary: 313 active manifests passed; 367 superseded manifests skipped.
