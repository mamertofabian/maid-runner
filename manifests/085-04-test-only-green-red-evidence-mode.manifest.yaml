    - run
    - python
    - -m
    - pytest
    - tests/cli/test_plan_revise_test_only_green.py
    - -v
    status: passed
    summary: "All 11 test-only-green scenarios passed."
  - command:
    - uv
    - run
    - maid
    - validate
    - manifests/085-04-test-only-green-red-evidence-mode.manifest.yaml
    - --mode
