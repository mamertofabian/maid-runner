# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Count imported type artifacts used in annotations as behavioral references
type: fix
created: '2026-10-20T19:32:23Z'
description: 'Record imported type references in parameter/return (including variadic), variable, nested
  generic/union and quoted-forward annotation positions using the existing Python scope/import resolver
  and reference_context=type. The existing identity consumer restricts type context to TYPE/INTERFACE;
  do not change it or allow annotation-only proof for runtime function/class/attribute/method artifacts.
  Preserve exact source module/alias identity and fail closed for unknown/local/shadowed origins, metadata
  values and malformed forward expressions. Use CPython expression parsing for forward annotations and
  narrow type-position traversal, not evaluation or a new execution/control-flow analyzer. Known typing/typing_extensions
  Literal arguments and Annotated metadata are values, not type references; only Annotated''s first argument
  is a type. Preserve parameter annotation outer scope while generic type-parameter names shadow imported
  types in their own annotation scope. PEP695 type-alias values retain legitimate type use but cannot
  claim runtime artifact execution; actual alias rebinding and alias-local type parameters must not leave
  stale imported identity. Reuse existing binding/scope events rather than adding a parallel import analyzer.
  Public collection signature and core matching policy remain unchanged. After hardening, recall matched
  086-01-fix-path-backed-e200-identities: retain positive downstream reproductions and negative identity
  guards. Apply that bounded-identity lesson and exclude unrelated performance/enrichment work.'
temptations:
- risk: Fix E200 by treating annotation names as runtime access or allowing name-only fallback across
    local/wrong-module identities.
  instead: Emit only proven imported type-context identities through existing resolution, preserving the
    existing TYPE/INTERFACE-only consumer and runtime-kind negatives.
- risk: Count Literal/Annotated metadata strings or arbitrary executable annotation expressions as type
    proof.
  instead: Parse forward expressions without evaluation and traverse bounded type positions; preserve
    metadata exclusions and explicit unknown/malformed noncoverage.
- risk: Credit imported aliases after TypeAlias or generic parameters shadow them, or build a new scope/control-flow
    interpreter.
  instead: Reuse existing lexical scope/binding mechanics for annotation positions and demonstrated alias
    shadow controls, preserving unrelated collector behavior.
