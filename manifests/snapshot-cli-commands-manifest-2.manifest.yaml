# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Snapshot of maid_runner/cli/commands/manifest.py
type: snapshot
files:
  create:
  - path: maid_runner/core/manifest_from_diff.py
    artifacts:
    - kind: class
      name: FromDiffRenderError
      description: 'Structured generation failure: rendered draft failed schema validation
        or output refused.'
      bases:
      - Exception
    - kind: function
      name: build_from_diff_manifest
      description: Rendering now emits validate commands from suggest_validate_commands
        instead of hardcoding the schema-only fallback.
      args:
      - name: diff
        type: DiffScopeResult
      - name: project_root
        type: Union[str, Path]
      - name: slug
        type: str
      returns: dict
    - kind: function
      name: default_from_diff_slug
      description: Returns from-diff-<UTC-date>-<short-commit-hash> for the resolved
        baseline (HEAD short hash for worktree scope).
      args:
      - name: project_root
        type: Union[str, Path]
      - name: baseline
        type: DiffScopeBaseline
      returns: str
    - kind: function
      name: validate_from_diff_output_suffix
      description: Raise FromDiffRenderError naming the unsupported suffix when the
        output path's suffix is not one this writer can correctly emit. The accepted
        set is derived from _SUFFIX_FORMATS by selecting the suffixes mapped to the
        yaml format, so the guard cannot drift from load_manifest_raw. Shared by the
        writer and the CLI so both enforcement sites use one rule. Returns None when
        the suffix is supported.
      args:
      - name: output_path
        type: Union[str, Path]
      returns: None
      raises:
      - FromDiffRenderError
    - kind: function
      name: write_from_diff_manifest
      description: Reject an output path whose suffix MAID cannot load, with a FromDiffRenderError
        distinct from the drafts-directory containment failure, before any filesystem
        effect including the parent mkdir. Placed on the public writer so library
        callers are covered, not only the CLI.
      args:
      - name: data
        type: dict
      - name: output_path
        type: Union[str, Path]
      - name: force
        type: bool
        default: 'False'
      returns: Path
  - path: tests/core/test_manifest_from_diff.py
    artifacts:
    - kind: test_function
      name: test_build_from_diff_manifest_is_deterministic
    - kind: test_function
      name: test_build_from_diff_manifest_quotes_slug_path_in_validate_command
    - kind: test_function
      name: test_build_from_diff_manifest_rejects_empty_diff
    - kind: test_function
      name: test_build_from_diff_manifest_renders_schema_valid_review_marked_draft
    - kind: test_function
      name: test_default_from_diff_slug_uses_resolved_since_commit_hash
    - kind: test_function
      name: test_write_from_diff_manifest_force_overwrites_with_stable_yaml
    - kind: test_function
      name: test_write_from_diff_manifest_refuses_existing_output_without_force
    - kind: test_function
      name: test_write_from_diff_manifest_rejects_draft_path_outside_project
    - kind: test_function
      name: test_write_from_diff_manifest_rejects_non_draft_output
    - kind: test_function
      name: test_write_from_diff_manifest_writes_nothing_when_schema_invalid
  - path: tests/cli/test_manifest_from_diff_cmd.py
    artifacts:
    - kind: test_function
      name: test_manifest_from_diff_build_parser_registers_subcommand
    - kind: test_function
      name: test_manifest_from_diff_cmd_manifest_rejects_missing_baseline
    - kind: test_function
      name: test_manifest_from_diff_counts_empty_string_baseline_flags
    - kind: test_function
      name: test_manifest_from_diff_custom_output_sets_validate_command
    - kind: test_function
      name: test_manifest_from_diff_dry_run_json_writes_nothing
    - kind: test_function
      name: test_manifest_from_diff_dry_run_rejects_empty_diff
    - kind: test_function
      name: test_manifest_from_diff_force_overwrites_existing_output
    - kind: test_function
      name: test_manifest_from_diff_invalid_commitish_exits_without_writing
    - kind: test_function
      name: test_manifest_from_diff_quotes_spaced_slug_validate_command
    - kind: test_function
      name: test_manifest_from_diff_refuses_existing_output_without_force
    - kind: test_function
      name: test_manifest_from_diff_rejects_active_manifest_output
    - kind: test_function
      name: test_manifest_from_diff_rejects_draft_output_outside_project
    - kind: test_function
      name: test_manifest_from_diff_requires_exactly_one_baseline
    - kind: test_function
      name: test_manifest_from_diff_writes_default_draft_and_json_result
  - path: maid_runner/core/validate_suggestions.py
    artifacts:
    - kind: function
      name: suggest_validate_commands
      description: 'Returns the deterministic validate list: pytest commands for evidenced
        test files plus the schema-only command, or schema-only when no evidence exists.'
      args:
      - name: diff
        type: DiffScopeResult
      - name: project_root
        type: Union[str, Path]
      - name: draft_path
        type: Union[str, Path]
      returns: tuple[str, ...]
  - path: tests/cli/test_manifest_promote_yaml_style_cmd.py
    artifacts:
    - kind: test_function
      name: test_promote_does_not_emit_trailing_whitespace
      source_scenario: A promoted draft contains long plain scalar values that the
        default round-trip emitter would wrap.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: Every physical line in the promoted YAML equals its right-stripped
          form while the scalar values still round-trip.
    - kind: test_function
      name: test_promote_does_not_wrap_long_strings_with_backslashes
      source_scenario: A draft with a long single-line temptation string that requires
        quoting is promoted.
      actions:
      - type: api_call
        subject:
          function: cmd_manifest
      expected:
        behavior: No line in the promoted file ends with a backslash continuation
          and the string parses back identical.
    - kind: test_function
      name: test_promote_renders_multiline_description_as_literal_block
      source_scenario: A draft with a multiline description containing an em dash
        is promoted.
      actions:
      - type: api_call
        subject:
          function: cmd_manifest
      expected:
        behavior: The promoted file renders the description as a literal block scalar
          with no escaped newlines and the em dash appears literally.
    - kind: test_function
      name: test_promote_round_trips_multiline_description_content
      source_scenario: A draft with a multiline description is promoted.
      actions:
      - type: api_call
        subject:
          function: cmd_manifest
      expected:
        behavior: The promoted manifest parses back with the description byte-identical
          to the draft's.
  - path: tests/cli/test_manifest_from_diff_output_suffix.py
    artifacts:
    - kind: test_function
      name: test_from_diff_accepts_default_yaml_draft_path
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: The slug-derived default output path is used as a regression
        guard.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The generated draft is written, round-trips through load_manifest_raw,
          and its self-validate path points at the file that was actually written.
    - kind: test_function
      name: test_from_diff_accepts_yml_output_suffix
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: A caller passes --output manifests/drafts/custom.manifest.yml.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The draft is written and round-trips through load_manifest_raw,
          proving the guard accepts every yaml-format suffix the reader dispatches
          on rather than only '.yaml'.
    - kind: test_function
      name: test_from_diff_dry_run_rejects_unsupported_output_suffix
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: A caller passes --dry-run with --output manifests/drafts/x.json,
        the path that never reaches write_from_diff_manifest.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The command exits 2 and prints no manifest body, so --dry-run cannot
          hand back a manifest whose embedded self-validate command points at a file
          MAID cannot load. This is the case a writer-only guard would miss.
    - kind: test_function
      name: test_from_diff_force_does_not_touch_existing_file_with_unsupported_suffix
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: A caller passes --force with an existing manifests/drafts/x.json.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The command exits 2 and the existing file's bytes are unchanged,
          closing the write-then-restore rollback that satisfies a naive no-file assertion.
    - kind: test_function
      name: test_from_diff_rejects_suffixless_output_path
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: A caller passes an output path with no suffix at all.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The command exits 2 and writes nothing, closing the empty-suffix
          YAML fallback that 089-01's review found unpinned.
    - kind: test_function
      name: test_from_diff_rejects_unsupported_output_suffix_without_writing
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: A caller passes --output manifests/drafts/x.json.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The command exits 2 with an error naming the '.json' suffix, and
          no manifests directory is created at all, proving the rejection precedes
          the writer's parent mkdir.
    - kind: test_function
      name: test_from_diff_rejects_uppercase_yaml_output_suffix
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: A caller passes --output manifests/drafts/custom.YAML.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The command exits 2 and writes nothing, because load_manifest_raw
          and chain discovery match the lowercase suffix exactly, so an uppercase
          suffix is not a loadable manifest.
    - kind: test_function
      name: test_from_diff_still_rejects_output_outside_drafts_directory
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: A caller passes an --output path outside manifests/drafts/.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The existing containment rejection is unchanged in message and exit
          code, proving the new suffix condition was added alongside it rather than
          replacing it.
    - kind: test_function
      name: test_from_diff_suffix_rejection_is_distinct_from_containment_rejection
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture
      returns: None
      source_scenario: A caller passes a drafts-directory path with an unsupported
        suffix.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The error names the unsupported suffix and does not reuse the 'must
          be under manifests/drafts/' containment wording, so the two failures stay
          separately diagnosable.
    - kind: test_function
      name: test_validate_from_diff_output_suffix_accepts_every_reader_yaml_suffix
      returns: None
      source_scenario: Every suffix load_manifest_raw maps to the yaml format is offered
        to the shared guard.
      actions:
      - type: api_call
        subject:
          export: validate_from_diff_output_suffix
      expected:
        behavior: The guard accepts all of them, so it cannot drift narrower than
          the reader and start rejecting a suffix MAID can still load.
    - kind: test_function
      name: test_validate_from_diff_output_suffix_rejects_reader_suffixes_it_cannot_emit
      returns: None
      source_scenario: Every suffix load_manifest_raw maps to a non-yaml format is
        offered to the shared guard.
      actions:
      - type: api_call
        subject:
          export: validate_from_diff_output_suffix
      expected:
        behavior: Each raises FromDiffRenderError naming that suffix, so the guard
          cannot drift wider than what this YAML-only writer can correctly emit.
    - kind: test_function
      name: test_write_from_diff_manifest_rejects_unsupported_suffix_for_library_callers
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      returns: None
      source_scenario: A non-CLI caller invokes write_from_diff_manifest directly
        with an unsupported suffix and a body that would also fail schema validation.
      actions:
      - type: api_call
        subject:
          export: write_from_diff_manifest
      expected:
        behavior: FromDiffRenderError names the suffix rather than reporting a schema
          failure, proving the guard runs before schema validation and covers library
          callers, and nothing is written.
  - path: tests/core/test_inactive_manifest_repair_guidance.py
    artifacts:
    - kind: test_function
      name: test_archive_inventory_diagnostic_names_copyable_archive_marker
      source_scenario: An unmarked v2 manifest is hidden under manifests/v1-archive.
      actions:
      - type: api_call
        subject:
          export: ManifestChain
      expected:
        behavior: E109 keeps failing closed while its suggestion shows the exact archive
          marker form.
    - kind: test_function
      name: test_draft_inventory_diagnostic_names_copyable_marker_choices
      source_scenario: An unmarked v2 manifest is hidden under manifests/drafts.
      actions:
      - type: api_call
        subject:
          export: ManifestChain
      expected:
        behavior: E109 keeps failing closed while its suggestion shows the exact implementation
          and epic draft marker syntax.
  - path: tests/cli/test_manifest_create_draft_marker_cmd.py
    artifacts:
    - kind: test_function
      name: test_manifest_create_in_active_directory_keeps_generic_header
      source_scenario: maid manifest create writes an active manifest to the normal
        manifests output directory.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: The active manifest keeps the generic MAID header and does not receive
          an inactive draft marker.
    - kind: test_function
      name: test_manifest_create_under_drafts_writes_required_lifecycle_marker
      source_scenario: maid manifest create writes an implementation manifest below
        a manifests/drafts path component.
      actions:
      - type: api_call
        subject:
          export: cmd_manifest
      expected:
        behavior: 'The created file begins with # draft-kind: implementation and produces
          no inactive-manifest diagnostic from the parent chain.'
  - path: maid_runner/core/plan_lock.py
    artifacts:
    - kind: attribute
      name: artifacts_added
      description: Declared-artifact identities present in the new contract but not
        the prior, sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: artifacts_removed
      description: Declared-artifact identities present in the prior contract but
        not the new, sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: files_added
      description: Section-qualified file entries added, e.g. 'edit:path', 'create:path',
        'read:path', sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: files_removed
      description: Section-qualified file entries removed, sorted; the section prefix
        lets consumers treat read drops as neutral.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: validate_commands_added
      description: Normalized validate commands added, sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: validate_commands_removed
      description: Normalized validate commands removed, sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: baseline_commit
      description: Resolved Git HEAD commit containing the pre-existing manifest.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: baseline_manifest_hash
      description: Hash of the committed pre-migration manifest bytes.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: baseline_manifest_source
      description: Identifies whether baseline_manifest_hash was captured from the
        HEAD manifest blob or the staged index blob.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: captured_at
      description: UTC timestamp of the migration evidence capture.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: commands
      description: Current validate-command results, all classified not_red with exit
        code zero.
      of: LegacyBaselineEvidence
      type: tuple[RedPhaseCommandEvidence, ...]
    - kind: attribute
      name: contract_delta
      description: Structured committed-to-current contract delta retained for audit.
      of: LegacyBaselineEvidence
      type: ContractDelta
    - kind: attribute
      name: reason
      description: Required human explanation for using the legacy migration path.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: agent
      description: Provenance of the agent that created revision 1; None when not
        captured or for pre-provenance locks.
      of: PlanLock
      type: Optional[AgentProvenance]
    - kind: attribute
      name: created_at
      of: PlanLock
      type: str
    - kind: attribute
      name: legacy_baseline
      description: Separate audited legacy-baseline payload; None for ordinary and
        pre-feature locks.
      of: PlanLock
      type: Optional[dict]
    - kind: attribute
      name: manifest_hash
      of: PlanLock
      type: str
    - kind: attribute
      name: manifest_path
      of: PlanLock
      type: str
    - kind: attribute
      name: red_evidence
      of: PlanLock
      type: dict | None
    - kind: attribute
      name: revision
      of: PlanLock
      type: int
    - kind: attribute
      name: revisions
      of: PlanLock
      type: tuple[PlanLockRevision, ...]
    - kind: attribute
      name: test_hashes
      of: PlanLock
      type: dict[str, str]
    - kind: attribute
      name: lock_path
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: manifest_path
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: manifest_slug
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: recovery_command
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: test_hash_matches
      of: PlanLockDependent
      type: bool
    - kind: attribute
      name: test_path
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: agent
      description: Provenance of the agent that made this revision; None when not
        captured.
      of: PlanLockRevision
      type: Optional[AgentProvenance]
    - kind: attribute
      name: contract_delta
      description: The stored delta for this revision; None for pre-delta revisions
        and when the prior contract was unavailable.
      of: PlanLockRevision
      type: Optional[ContractDelta]
    - kind: attribute
      name: prior_manifest_hash
      of: PlanLockRevision
      type: str
    - kind: attribute
      name: prior_test_hashes
      of: PlanLockRevision
      type: dict[str, str]
    - kind: attribute
      name: reason
      of: PlanLockRevision
      type: str
    - kind: attribute
      name: revised_at
      of: PlanLockRevision
      type: str
    - kind: attribute
      name: classification
      of: RedPhaseCommandEvidence
      type: str
    - kind: attribute
      name: command
      of: RedPhaseCommandEvidence
      type: str
    - kind: attribute
      name: exit_code
      of: RedPhaseCommandEvidence
      type: int
    - kind: attribute
      name: output_tail
      of: RedPhaseCommandEvidence
      type: str
    - kind: attribute
      name: captured_at
      of: RedPhaseEvidence
      type: str
    - kind: attribute
      name: commands
      of: RedPhaseEvidence
      type: tuple[RedPhaseCommandEvidence, ...]
    - kind: attribute
      name: red
      of: RedPhaseEvidence
      type: bool
    - kind: class
      name: ContractDelta
      description: 'Frozen dataclass: deterministic set-difference between two locked
        manifest contracts, stored per revision as advisory evidence.'
    - kind: class
      name: LegacyBaselineEvidence
      description: Audited green-baseline evidence for a tracked manifest that predates
        plan-lock adoption.
    - kind: class
      name: PlanLock
      description: Tamper-evident per-manifest plan lock record stored at .maid/plan-locks/<manifest-slug>.lock.json.
    - kind: class
      name: PlanLockDependent
      description: Immutable public record describing one active manifest lock that
        pins the queried behavioral test.
    - kind: class
      name: PlanLockRevision
      description: One immutable revision history entry holding the prior hashes,
        revision timestamp, and non-empty reason.
    - kind: class
      name: RedPhaseCommandEvidence
      description: 'Per-command red-phase record: command string, exit code, 20-line
        output tail, derived classification.'
    - kind: class
      name: RedPhaseEvidence
      description: Aggregate red-phase evidence captured by maid plan lock/revise.
    - kind: function
      name: capture_legacy_baseline_evidence
      description: Capture legacy green evidence from a tracked HEAD manifest or,
        for first-commit brownfield adoption, an identical staged manifest whose declared
        implementation and behavioral tests already exist cleanly at HEAD.
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: reason
        type: str
      returns: LegacyBaselineEvidence
    - kind: function
      name: capture_red_phase_evidence
      description: Run the manifest's validate commands via the shared command execution
        helper and record per-command evidence.
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      returns: RedPhaseEvidence
    - kind: function
      name: classify_red_exit_code
      description: Exit 1 -> red; exit 0 -> not_red; exits 2/3/4/5 and any other nonzero
        exit -> invalid. Exit codes are the only classification input.
      args:
      - name: exit_code
        type: int
      returns: str
    - kind: function
      name: compute_behavioral_test_hash
      description: Writes sha256-pyast:v2 for parseable UTF-8 Python and sha256 byte
        hashes for other suffixes; raises instead of silently degrading.
      args:
      - name: path
        type: Path
      returns: str
    - kind: function
      name: compute_contract_delta
      description: Pure sorted set-difference over two persisted contract payloads;
        no reason parsing, no policy.
      args:
      - name: prior_contract
        type: dict
      - name: new_contract
        type: dict
      returns: ContractDelta
    - kind: function
      name: compute_manifest_contract_hash
      description: "Intentional evolution of the 085-03 contract \u2014 normalizes\
        \ date/datetime values to isoformat strings and non-string mapping keys to\
        \ their normalized string form before JSON canonicalization per pinned rule\
        \ 7, raising ValueError naming the manifest for any other non-JSON-native\
        \ value; prefix, exclusion boundary, and existing hashes are unchanged."
      args:
      - name: manifest_path
        type: Path
      returns: str
    - kind: function
      name: create_plan_lock
      description: Stores the current versioned compute_behavioral_test_hash result;
        public signature remains unchanged.
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: agent
        type: Optional[AgentProvenance]
      returns: PlanLock
    - kind: function
      name: default_plan_lock_path
      description: Return .maid/plan-locks/<manifest-slug>.lock.json under the project
        root.
      args:
      - name: project_root
        type: Path
      - name: manifest_slug
        type: str
      returns: Path
    - kind: function
      name: enforce_plan_locks
      description: Accepts mode test_only_green payloads as satisfying require_red_evidence
        only under the persisted-contract test-only bound re-derived on every call;
        all other payload and error semantics unchanged. Signature unchanged.
      args:
      - name: chain
        type: ManifestChain
      - name: project_root
        type: Path
      - name: require_plan_lock
        type: bool
      - name: require_red_evidence
        type: bool
      - name: changed_paths
        type: Collection[str] | None
        default: None
      - name: plan_lock_scope
        type: str
        default: repository
      returns: tuple[ValidationError, ...]
    - kind: function
      name: find_plan_lock_dependents
      description: Resolve one in-project test path and return every active readable
        lock that pins it, failing loudly on an unreadable active lock that must be
        inspected.
      args:
      - name: chain
        type: ManifestChain
      - name: project_root
        type: Path
      - name: test_path
        type: str | Path
      returns: tuple[PlanLockDependent, Ellipsis]
    - kind: function
      name: manifest_hash_matches
      description: Prefix-dispatched comparison supporting legacy sha256 byte hashes
        and sha256-contract hashes; unknown prefixes and missing files return False.
      args:
      - name: lock_hash
        type: str
      - name: manifest_path
        type: Path
      returns: bool
    - kind: function
      name: revise_plan_lock
      description: Re-locks current hashes and revision history, retaining an existing
        legacy_baseline only when requested and still valid for the new command contract;
        fresh-evidence callers explicitly replace it.
      args:
      - name: existing
        type: PlanLock
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: reason
        type: str
      - name: agent
        type: Optional[AgentProvenance]
        default: None
      - name: prior_contract
        type: Optional[dict]
        default: None
      - name: preserve_legacy_baseline
        type: bool
        default: 'True'
      returns: PlanLock
    - kind: function
      name: revision_preserves_red_evidence
      description: Returns true only for internally consistent red/test-only evidence
        whose contract and behavioral tests remain unchanged; ordinary red command
        payloads must bind classification to exit code through the existing consistency
        validator.
      args:
      - name: existing
        type: PlanLock
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: prior_contract
        type: dict | None
      returns: bool
    - kind: function
      name: test_hash_matches
      description: Fail-closed prefix dispatch for sha256-pyast:v2, historical sha256-pyast
        v1, and sha256 byte hashes.
      args:
      - name: lock_hash
        type: str
      - name: path
        type: Path
      returns: bool
    - kind: method
      name: to_payload
      description: Serialize an explicitly typed legacy_baseline payload without claiming
        red evidence.
      of: LegacyBaselineEvidence
      returns: dict
    - kind: method
      name: load
      description: Load a lock file; fail closed when the file exists but is corrupt,
        unreadable, or malformed.
      of: PlanLock
      args:
      - name: path
        type: Path
      returns: PlanLock
    - kind: method
      name: save
      description: Writes validate_commands into the _manifest_contract snapshot alongside
        artifacts and test_files.
      of: PlanLock
      args:
      - name: path
        type: Path
      returns: None
    - kind: method
      name: to_payload
      description: Serialize the evidence into the JSON payload stored in PlanLock.red_evidence.
      of: RedPhaseEvidence
      returns: dict
