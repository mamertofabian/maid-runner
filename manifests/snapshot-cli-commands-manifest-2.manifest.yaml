      type: array
    - kind: attribute
      name: agent
      description: Optional provenance property on the Outcome record definition.
      of: OutcomeRecord schema definition
      type: optional AgentProvenance object
    - kind: attribute
      name: scope
      description: Optional writable scope-only declarations remain part of manifest
