      source_scenario: Promotion rewrites a locked validate command from its self-referencing
        draft path to the active manifest path.
      actions:
      - type: api_call
        subject:
          function: cmd_manifest
      expected:
        behavior: Promotion recaptures evidence for the rewritten active-path command
          rather than preserving draft-path evidence that would violate E707 command
          binding.
    - kind: test_function
      name: test_promotion_docs_describe_valid_evidence_preservation
      source_scenario: A reader checks the promotion workflow after the evidence-preservation
        fix.
      actions:
      - type: api_call
        subject:
          export: Path
      expected:
        behavior: The source and packaged workflows match and document valid evidence
          preservation, recapture after contract or test changes, and --no-run behavior.
    - kind: test_function
      name: test_revision_preservation_rejects_contradictory_evidence_mode
      source_scenario: A red:true payload also claims the mutually exclusive test_only_green
        mode.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: The shared predicate rejects the contradictory evidence channel
          instead of treating it as ordinary red evidence.
    - kind: test_function
      name: test_revision_preservation_rejects_inconsistent_red_command_payload
      source_scenario: A direct preservation check receives forged red evidence whose
        exit code is zero but classification is red.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: The shared public predicate returns false because the serialized
          command payload is internally inconsistent.
    - kind: test_function
      name: test_revision_preservation_rejects_spliced_special_mode_commands
      source_scenario: Shape-valid stash-restoration and test-only-green evidence
        carries command text that differs from the persisted contract snapshot.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: The shared predicate rejects command-spliced evidence in both sanctioned
          special modes.
    - kind: test_function
      name: test_revision_preservation_requires_consistent_test_only_commands
      source_scenario: Test-only-green evidence is checked with a valid command, a
        Boolean false exit code, and a missing output tail.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: Only the fully shaped command with an exact integer zero exit code
          is preservable; Boolean and incomplete command payloads are rejected.
