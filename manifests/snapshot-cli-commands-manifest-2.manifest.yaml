      description: Strict optional boolean artifact property acknowledging an intentional
        documented default implementation; additionalProperties stays false.
      of: MAID Manifest v2 schema
      type: optional boolean on ArtifactSpec
    - kind: attribute
      name: outcome
      description: Strict optional top-level completion metadata schema for explicit
        manifest Outcome records.
      of: MAID Manifest v2 schema
