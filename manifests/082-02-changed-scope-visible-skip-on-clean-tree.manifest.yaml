    - verify
    - output-formatting
    - sarif
    paths:
    - maid_runner/core/result.py
    - maid_runner/core/verify_summary.py
    - maid_runner/cli/commands/_format.py
    - maid_runner/core/sarif.py
  - lesson_type: anti-gaming
    summary: "A clean-tree/no-baseline skip can improve handoff ergonomics without weakening changed-scope enforcement when the skip is limited to the implicit default gate and dirty or explicitly strengthened runs still fail closed with E115."
    tags:
    - changed-scope
