outcome:
  status: completed
  completed_at: "2026-08-13T04:15:00Z"
  summary: "Retained the isolated fallback and grouped-evidence APIs, but removed their speculative cost from maid-runner's fixture-bearing deep path after the live optimized phase exceeded five minutes. Deep now selects the exact legacy artifact stage through 121-10's 0.0108-second preflight."
  rationale: "Multiple safe parallel fallback and grouped-evidence designs improved individual phases but did not produce a stable accepted repository-wide result below the budget. The final collection-attribution proposal also admitted a selector-dependent import false green. Revision 26 therefore preserves the hardened machinery for separately accepted consumers while restoring the bounded production path for this repository."
  lessons:
    - lesson_type: performance
      summary: "Phase-level speedups do not count as an accepted optimization when incomplete evidence or worker safety causes replay; measure and enforce the complete production decision path."
      tags: [performance, artifact-coverage, replay]
      paths:
        - maid_runner/core/artifact_coverage.py
        - maid_runner/cli/commands/verify.py
    - lesson_type: design
      summary: "Unique collection-module attribution is not exact-command equivalence because grouped selectors and pytest options can change import-time behavior."
      tags: [runtime-evidence, fail-closed, command-equivalence]
      paths:
        - maid_runner/core/runtime_evidence.py
  review_notes:
    - source: review_121_15_revision19_plan
      severity: rejected
      summary: "Rejected module collection attribution because grouped command state could produce coverage absent from each exact command; approved the conservative rollback plan after nested, excluded, symlink, and early-order adversaries were added."
    - source: review_121_rollback_impl
      severity: ready
      summary: "Independent implementation review found only a transient active-task marker; after task stop, re-review returned Ready to merge with deep performance verification as the sole advisory limitation."
  validation:
