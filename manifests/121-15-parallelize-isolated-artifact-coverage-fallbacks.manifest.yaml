        - kind: attribute
          name: process_cost
          of: ArtifactCoverageFallbackWorkerResult
          type: int
          description: "Conservative outer-budget reservation units, which reserve max_processes for a nested-process directory selector while its xdist workers share two direct child-controller permits."
        - kind: attribute
          name: errors
          of: ArtifactCoverageFallbackWorkerResult
          type: tuple[ValidationError, Ellipsis]
        - kind: class
