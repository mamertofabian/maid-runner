            - name: executor
              type: RuntimeCommandExecutor
            - name: jobs
              type: int
            - name: max_processes
              type: int
          returns: ArtifactCoverageFallbackRun
          description: "Groups identical selectors only in the opt-in path, schedules accepted inner/outer workers within one process budget, requires process-safe child permits for nested-process directory xdist, and expands results back to immutable identity order."
