# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Bound exact artifact-coverage fallback time with isolated proven-equivalent workers"
type: refactor
created: "2026-08-12T04:07:08Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - artifact-coverage
    - fallback
    - isolation
    - parallelism
description: |
  The repository-wide grouped evidence fast path must exact-fallback every
  unproven fixture lifecycle. Maid-runner's root conftest contains two
  session-scoped autouse fixtures, so correctness-first 121-08/09 may route all
  365 ordered exact coverage identities to fallback. Make that conservative path fast
  without weakening it: after 121-13 proves current-byte and Git-metadata
  snapshot isolation and 121-14 establishes one process budget, run the
  original exact fallback commands concurrently in independent snapshots.

  Measurement of the first broad exact command proved that outer scheduling
  alone cannot meet the budget: one `pytest tests/ -v` coverage subprocess
  exceeded four minutes. Revision 15's per-runtest shared/exclusive lock was
  rejected by real acceptance: 70 of 355 modules matched the conservative
  predicate, blocked xdist lanes behind queued hazardous modules, and took
  374.920 seconds while the exact oracle took 1429.955 seconds. A subsequent
  isolated failure correctly triggered whole-batch serial replay, proving the
  design was also not stable enough to enable. Revision 16's single hazardous
  loadgroup was rejected when a fresh probe exceeded six minutes because all
  70 conservative matches were forced through one worker. Revision 17's single
  direct-child permit was rejected after a fresh probe crossed 300 seconds
  without completing. In the opt-in path, collapse byte-identical pytest
  argument tuples into one isolated command whose target set is the union of
  its declarations, and apply only the repository's already accepted pinned
  pytest worker count and ordinary accepted `--dist loadscope`. Charge those inner workers to the
  same process budget as outer fallback jobs. A directory selector whose test
  inventory contains statically visible nested process orchestration must use
  two process-safe child-controller permits shared by its xdist workers. Tests
  and fixture lifecycles retain ordinary loadscope scheduling; only the
  lifetime of actually spawned child processes is bounded. Reserve the full outer process budget for
  such a directory command so its internal workers do not overlap sibling
  fallback commands. Keep this a deliberately narrow
  scheduling predicate rather than behavioral reachability analysis: within
  the selected directory inventory, coordinate direct calls named
  `collect_runtime_evidence`, `run_knockout_batch`, `_git`, or
  `run_validate_commands_for_result`, and for direct `subprocess.run`,
  `Popen`, `call`, `check_call`, or `check_output` calls. Do not infer aliases
  or control flow. Treat a selected test file that cannot be read or parsed as
  requiring child-process coordination; a clean inventory without one of these forms
  retains ordinary xdist execution. Apply the same narrow scan to every
  applicable `conftest.py`; any process form or read/parse uncertainty there
  disables xdist because conftest module code and controller hooks can execute
  before worker-only coordination. Generated instrumentation leaves the xdist
  controller's `subprocess.Popen` and routing environment untouched. On worker
  plugin import, identified by `PYTEST_XDIST_WORKER`, it first copies owned
  paths, then wraps `subprocess.Popen` before initial conftests bind it, and
  consumes the worker's generated plugin entry and `MAID_ARTIFACT_*` routing
  before conftest imports can spawn a child. The wrapper
  holds one of two file-lock permits
  from child creation through successful `wait`, `communicate`, terminal
  `poll`, or context exit; constructor failure releases immediately and
  repeated completion calls cannot double-release. A daemon reaper observes
  natural termination and releases even when the caller never invokes a
  completion method. Acquisition failure is a worker error; abrupt worker
  death releases its descriptor. If the platform lacks the lock primitive, do
  not inject xdist. This bounds direct child-controller concurrency rather
  than claiming arbitrary descendant process-tree accounting; full outer
  reservation plus two direct controllers is the conservative stability
  policy. Preserve every selector and
  evaluate the resulting target evidence through the existing legacy report
  logic in immutable manifest/command order. The default one-worker path stays
  byte-for-byte serial and never deduplicates or injects xdist.

  Prove isolation eligibility at runtime. Workers record pre/post observable
  project and Git identities while excluding only MAID-owned temporary
  coverage output and explicitly proven cache files. If any command produces
  an unclassified material project write, loses a worker, uses an unsupported
  external execution shape, or cannot reproduce current inputs, discard the
  entire ordered fallback batch and execute it through the legacy serial path;
  this preserves a later command that observes an earlier command's state
  without attempting read/write dependency inference. Consumer defaults remain
  one fallback worker; this repository
  opts in only after a full serial-versus-isolated-parallel report comparison.
  Artifact-coverage xdist workers must copy the coverage-data and call-output
  paths into plugin-owned state, then consume their owned plugin and every
  `MAID_ARTIFACT_*` routing variable during worker plugin import, before
  session-start, collection, fixture, or test hooks can spawn nested pytest,
  runtime-evidence, or knockout processes that attach to the outer controller.
  Preserve the exact ordered list of every unrelated consumer
  `PYTEST_PLUGINS` entry; this is instrumentation isolation, not a reason to
  alter test behavior.
  The serial oracle itself must contain no artifact-coverage errors; an errored
  or non-cacheable exact command rejects acceptance rather than becoming a
  comparison baseline. The acceptance probe must also demonstrate three fresh parallel phases below
  the 270-second cold-stage budget before the budget becomes enforceable. Each
  phase must complete entirely in isolated workers: any legacy serial replay,
  worker diagnostic, or material project write rejects acceptance even when
  the replayed reports happen to match. The
  originally planned 180-second ceiling was rejected after the fully safe
  optimized inventory measured 233.06 seconds with zero fallback, write, or
  worker errors on the repository's effective eight-core runtime.

  The serial acceptance oracle uses the existing legacy batch evaluator, which
  executes each unique exact selector once and projects it to every declaring
  manifest. Persist successful command records in a content-bound advisory
  checkpoint so interruption resumes rather than discarding hours; failures
  are never cached. The optimized phase always runs fresh. Emit visible phase
  and command progress so acceptance cost cannot be confused with production
  deep-verify latency.

  Revision 18 is also rejected by fresh repository evidence. Full-budget
  execution, worker-side Popen coordination with one, two, four, six, and
  eight permits, removal of the wrapper, and a ten-unit weighted reservation
  all exceeded the 270-second ceiling. The exact inventory contains 309 unique
  commands, 217 of which repeat overlapping multi-file selectors, so further
  process-budget tuning cannot remove the dominant pytest startup work.

  Revision 19 restores the grouped runtime-evidence fast path before relying
  on isolated exact fallback. Collapse selectors already dominated by a
  selected directory in the physical pytest command while preserving every
  original selector-to-node mapping used for projection. Instrument only
  existing Python files declared by active manifests; generated, build, and
  unrelated automation trees are not artifact-coverage targets and must not be
  serialized into the child environment. This prevents duplicate collection
  and the observed 277-KB E2BIG payload without dropping a declared target.

  Keep wide-fixture fallback fail-closed. Absence of target calls cannot prove
  lifecycle equivalence because a fixture can mutate environment, files, or
  shared state later observed by target code. Permit reuse only for an exact
  fixture context ID explicitly approved by repository configuration and bound
  to the raw SHA-256 of its defining conftest file. Unknown fixtures, indirect
  state mutation, unapproved setup or teardown, changed/unreadable conftest
  bytes, missing contexts, collection/session ambiguity, worker loss, nested
  pytest, command failure, content mutation, or environment mismatch remain
  exact fallbacks. Approval is an explicit reviewed lifecycle-equivalence
  attestation for those exact bytes; it may approve fixture code that touches
  targets or indirect state because equivalence is established by the full
  serial report oracle, not inferred by tracing. It stays disabled by default
  for consumers. Approval paths must be root-relative contained regular
  readable `conftest.py` files with no symlink escape; context IDs must match
  the canonical fixture baseid/name/scope form, digests must be exactly 64
  lowercase hex characters, and malformed or duplicate/conflicting entries
  fail closed.

  This repository opts into the already accepted pinned eight-worker
  loadscope policy even when duration history is cold; the explicit accepted
  count, process ceiling, and xdist capability checks remain mandatory. Remove
  only the blanket conftest early exit after real tests prove target-neutral
  fixture reuse. Acceptance compares complete normalized reports and command
  order with the cached legacy oracle, rejects every exact fallback/replay,
  worker error, or material write, and requires three fresh real
  grouped-evidence runs below 270 seconds. The probe must not manufacture
  incomplete evidence or time the rejected isolated fallback engine.

  Revision 20 follows the first real grouped measurement. Selector collapse,
  declared-target payloads, digest approvals, and cold xdist all worked, but
  the single grouped phase still exceeded 270 seconds before evaluation.
  RuntimeEvidencePlugin installs `sys.setprofile` on every call in every xdist
  worker, while the faster exact worker already uses Python's low-overhead
  `sys.monitoring`. Replace whole-interpreter profiling with an owned
  monitoring tool using PY_START, PY_RETURN, PY_RESUME, PY_YIELD, and
  PY_UNWIND where available. Preserve exact
  called-qualname capture, nested-pytest incompleteness, generator-fixture
  context switching/restoration, prior instrumentation ownership, and cleanup;
  balance fixture context restoration per suspended frame/code lifecycle, and
  never disable repeat target callbacks because one callable may execute under
  multiple node contexts. Preserve pre-owned tools/profiles and release only
  the claimed tool. Fail closed into the legacy profile path, with restoration,
  when tool claim, event registration, or required events are unavailable.

  Revision 21 follows the first monitoring-backed repository measurement.
  Selective monitoring reduced grouped collection from more than 285 seconds
  to 117.906 seconds, versus 58.73 seconds for ordinary eight-worker pytest,
  but evaluation still exact-fell back because logical selector identities
  were lost when the physical command collapsed to `tests/`, function-fixture
  approvals were compared with per-node context IDs, and collection ambiguity
  was inferred from selector count rather than logical-command count. Preserve
  the minimized physical command while passing every logical selector to the
  evidence plugin; recompute selector support only after all xdist payloads are
  merged. Preserve support for every original selector independently: if any
  selector is absent from the merged inventory, its logical identity remains
  incomplete even when another selector in the same command selects nodes or
  physically dominates it. Normalize function fixture instances to their canonical
  baseid/name/scope definition solely for digest-bound approval lookup; retain
  per-node contexts for projection. A single original command with multiple
  selectors may retain its own collection context, while grouping two or more
  original commands with target execution during collection remains
  unresolved. Add locally enabled LINE monitoring for generator fixture code
  so its first teardown line is explicitly recorded in the fixture context;
  keep PY_START global and disable irrelevant code locations, never disable
  repeat target callbacks, and preserve legacy profiling whenever required
  monitoring or local-event support is unavailable. The full declared test
  scope includes runtime-evidence tests, and acceptance still rejects every
  fallback, replay, diagnostic, write, report difference, or ordering change.

  Revision 22 follows the first complete revision-21 repository collection:
  collection finished in 123.517 seconds, but exact replay remained because
  pytest's `-k` deselection ran after the evidence selector map, existing
  anchor-only test files were treated like invalid node selectors, and
  framework fixtures could not use the project-only approval format. Build
  selector maps after pytest deselection. Treat an existing root-contained
  Python file selector with no collected tests as supported only when another
  selector in that same original command selects a node; missing files and
  missing node selectors remain incomplete. Generalize project approvals to
  root-contained defining test modules while retaining exact baseid/path/hash
  binding. Add a separate distribution-fixture approval that resolves a
  relative installed distribution module, validates its raw SHA-256, requires
  an empty-baseid fixture identity, and matches the runtime fixture function's
  resolved source path before clearing uncertainty. Dependency/environment
  identity remains part of evidence freshness. Unknown sources, changed
  installed bytes, custom fixtures shadowing an approved framework name, and
  selectors absent after complete collection remain fail closed. Distribution
  module paths must be relative, resolve to regular files contained by the
  installed distribution root without symlink escape, and reject malformed,
  duplicate, or conflicting approvals. A physically dominated missing file
  selector remains unsupported even when a valid sibling selector collects
  successfully.

  Revision 26 rejects the repository-wide grouped path after the bounded live
  decision probe exceeded five minutes without completing and independent plan
  review found that proposed collection-module attribution could false-green
  command-dependent import behavior. Restore 121-10's cheap project-conftest
  preflight: fixture-bearing projects select complete legacy coverage before
  speculative collection, while fixture-free projects retain grouped evidence.
  Keep the isolated fallback engine and runtime proof APIs available for future
  explicitly accepted consumers, but do not add their cost to this repository's
  deep path until a real three-run acceptance completes below budget with exact
  report/order parity, no fallback/replay, no diagnostic, and no material
  write. Preserve instrumentation-observable legacy coverage semantics and
  always run the ordinary tests stage fresh.
temptations:
  - risk: "Do not run fallback processes concurrently against one mutable checkout."
    instead: "Use independently verified current-byte and Git-isolated snapshots for every active worker."
  - risk: "Do not accept parallel results after an unclassified project write or worker loss."
    instead: "Discard the whole ordered batch and run the exact legacy serial fallback, or emit visible E900/E712."
  - risk: "Do not assume repeated selectors or xdist preserve artifact reports, or multiply inner and outer workers beyond the shared budget."
    instead: "Keep the optimization disabled until complete ordered reports match; reserve the full outer budget for nested-process directories; retain loadscope and limit live direct child controllers with two process-safe permits; consume only the generated artifact plugin and preserve consumer plugin order."
  - risk: "Do not call a wide fixture safe merely because tracing observed no declared-target call."
    instead: "Require an exact context-ID approval bound to raw conftest bytes; any unknown or changed lifecycle exact-falls back."
  - risk: "Do not pass every project Python path or directory-dominated duplicate selector to pytest."
    instead: "Retain all active declared targets and logical selector mappings while minimizing only the physical command and instrumentation payload."
