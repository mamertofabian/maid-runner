# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Allow browser acceptance contracts to capture genuine plan-lock red evidence without violating the fast validate-layer boundary, and recognize standard Cypress test filenames"
type: fix
created: "2026-08-25T04:54:25Z"
metadata:
  bug_report: ~/.maid/bug-report/20260825-124100-codefrost-studyfinder-cypress-red-evidence.md
  planning_state: implementation_ready
  promotion_ready: true
  tests_status: red_confirmed
  priority: high
  tags:
    - plan-lock
    - red-phase
    - acceptance
    - cypress
    - validation-trust
description: |
  Browser commands correctly belong in `acceptance.tests`, not the fast
  behavioral `validate` layer, but plan-lock red capture currently runs only
  `validate`. A contract whose fast commands are green and whose genuine red
  exists only in Cypress therefore cannot satisfy both E231 and required red
  evidence.

  Preserve the fast-first behavior and existing lock format: run the declared
  validate commands first, stop when they already contain valid red evidence,
  and fall back to the ordered acceptance commands only when every validate
  command is green. Evidence captured through that fallback records an explicit
  `command_source: validate_and_acceptance` marker. E707 binds marked evidence
  to both command lists snapshotted in the lock, while unmarked historical
  evidence remains bound only to `validate_commands` and stays valid.

  If any validate command is invalid, do not let a failing browser command mask
  the infrastructure or collection failure. Run all acceptance commands once
  fallback begins so the existing aggregate rule still rejects invalid exits.
  Also extend the shared filename classifier for standard Cypress `.cy.ts`,
  `.cy.tsx`, `.cy.js`, and `.cy.jsx` suffixes so test-only-green remains a
  legitimate secondary path for Cypress-only contracts.

  Rationale: automatic fast-first fallback fixes the gate contradiction without
  adding a Cypress-specific CLI switch, and the explicit command-source marker
  preserves anti-splicing checks and backward compatibility for existing locks.
temptations:
  - risk: "Do not allow acceptance red to hide an invalid fast validate command."
    instead: "Enter acceptance fallback only when every validate command is classified not_red; otherwise return the validate evidence unchanged."
  - risk: "Do not change E707 to accept either command set heuristically."
    instead: "Persist an explicit validate_and_acceptance command source and compare marked evidence against both locked snapshots; keep unmarked legacy evidence bound to validate only."
  - risk: "Do not run browser acceptance when validate already provides genuine red evidence."
    instead: "Short-circuit after the validate phase when its aggregate evidence is valid red."
  - risk: "Do not classify arbitrary TypeScript files as tests because their directory mentions Cypress."
    instead: "Add only the conventional basename suffixes `.cy.ts`, `.cy.tsx`, `.cy.js`, and `.cy.jsx` to the shared classifier."
files:
  edit:
    - path: maid_runner/core/plan_lock.py
      artifacts:
        - kind: attribute
          name: command_source
          of: RedPhaseEvidence
          type: str | None
          description: "Identifies evidence captured from validate plus acceptance commands; null preserves the historical validate-only evidence shape."
        - kind: function
          name: capture_red_phase_evidence
          args:
            - name: manifest_path
              type: Path
            - name: project_root
              type: Path
            - name: command_timeout_seconds
              type: int
              default: "300"
          returns: RedPhaseEvidence
          description: "Captures fast validate evidence first, then falls back to acceptance commands only when every fast command is green; marked fallback evidence remains command-bound through E707."
        - kind: function
          name: enforce_plan_locks
          args:
            - name: chain
              type: ManifestChain
            - name: project_root
              type: Path
            - name: require_plan_lock
              type: bool
            - name: require_red_evidence
              type: bool
            - name: changed_paths
              type: Collection[str] | None
              default: None
            - name: plan_lock_scope
              type: str
              default: "'repository'"
          returns: tuple[ValidationError, ...]
          description: "Keeps legacy validate-only command integrity while binding validate_and_acceptance evidence to both locked command snapshots."
    - path: maid_runner/core/_file_discovery.py
      artifacts:
        - kind: function
          name: is_test_file
          args:
            - name: path
              type: str
          returns: bool
          description: "Recognizes standard Cypress .cy.ts/.tsx/.js/.jsx basenames in addition to existing test conventions."
    - path: maid_runner/cli/commands/plan.py
      artifacts:
        - kind: function
          name: cmd_plan_revise
          args:
            - name: args
              type: argparse.Namespace
          returns: int
          description: "Allows explicit preservation of valid validate_and_acceptance evidence only when both locked and current validate plus acceptance command multisets remain unchanged."
  create:
    - path: tests/core/test_acceptance_red_evidence.py
      artifacts:
        - kind: test_function
          name: test_capture_uses_acceptance_red_when_validate_commands_are_green
          source_scenario: "A manifest has one green validate command and one acceptance command that exits 1 for the intended behavior failure."
          actions:
            - type: api_call
              subject:
                function: capture_red_phase_evidence
          expected:
            behavior: "Capture records both commands, marks command_source validate_and_acceptance, and reports valid red evidence."
        - kind: test_function
          name: test_capture_skips_acceptance_when_validate_already_has_red
          source_scenario: "A validate command exits 1 while an acceptance command would create an observable marker if executed."
          actions:
            - type: api_call
              subject:
                function: capture_red_phase_evidence
          expected:
            behavior: "Capture returns validate-only red evidence and the acceptance marker is absent."
        - kind: test_function
          name: test_capture_does_not_mask_invalid_validate_with_acceptance_red
          source_scenario: "A validate command exits 2 and an acceptance command would exit 1."
          actions:
            - type: api_call
              subject:
                function: capture_red_phase_evidence
          expected:
            behavior: "Capture remains invalid and does not execute the acceptance command."
        - kind: test_function
          name: test_acceptance_red_evidence_passes_e707_command_integrity
          source_scenario: "A lock saves marked evidence captured from one green validate command and one red acceptance command, then plan-lock enforcement runs."
          actions:
            - type: api_call
              subject:
                function: enforce_plan_locks
          expected:
            behavior: "Required plan-lock and red-evidence enforcement pass without E707."
        - kind: test_function
          name: test_acceptance_red_evidence_missing_acceptance_command_fails_e707
          source_scenario: "Marked validate_and_acceptance evidence is spliced to omit the locked acceptance command."
          actions:
            - type: api_call
              subject:
                function: enforce_plan_locks
          expected:
            behavior: "Enforcement fails with RED_EVIDENCE_COMMAND_MISMATCH."
        - kind: test_function
          name: test_acceptance_red_evidence_cross_layer_swap_fails_e707
          source_scenario: "Marked evidence retains its original command order while the locked contract snapshot swaps the validate and acceptance commands."
          actions:
            - type: api_call
              subject:
                function: enforce_plan_locks
          expected:
            behavior: "Enforcement fails with RED_EVIDENCE_COMMAND_MISMATCH even though the flattened combined command multiset is unchanged."
        - kind: test_function
          name: test_acceptance_red_evidence_without_acceptance_snapshot_fails_e707
          source_scenario: "Marked validate_and_acceptance evidence is paired with a lock contract whose acceptance_commands snapshot is missing."
          actions:
            - type: api_call
              subject:
                function: enforce_plan_locks
          expected:
            behavior: "Enforcement fails closed with RED_EVIDENCE_COMMAND_MISMATCH instead of applying legacy validate-only tolerance."
        - kind: test_function
          name: test_acceptance_red_evidence_without_contract_snapshot_fails_e707
          source_scenario: "Marked validate_and_acceptance evidence is paired with a lock whose entire _manifest_contract snapshot is missing."
          actions:
            - type: api_call
              subject:
                function: enforce_plan_locks
          expected:
            behavior: "Enforcement fails closed with RED_EVIDENCE_COMMAND_MISMATCH because marked evidence cannot receive legacy snapshot tolerance."
        - kind: test_function
          name: test_acceptance_red_evidence_with_unknown_command_source_fails_e707
          source_scenario: "A captured lock is tampered to use an unsupported non-null command_source while its validate evidence is also spliced, and repository-scope enforcement treats the manifest as unchanged."
          actions:
            - type: api_call
              subject:
                function: enforce_plan_locks
          expected:
            behavior: "Enforcement fails unconditionally with RED_EVIDENCE_COMMAND_MISMATCH rather than relying on changed-manifest E705 validity checks."
        - kind: test_function
          name: test_legacy_validate_only_evidence_remains_valid_with_acceptance_contract
          source_scenario: "An existing unmarked lock has validate-only red evidence and the manifest also declares acceptance commands."
          actions:
            - type: api_call
              subject:
                function: enforce_plan_locks
          expected:
            behavior: "The historical lock remains valid and does not receive E707."
        - kind: test_function
          name: test_legacy_validate_only_evidence_without_contract_snapshot_remains_valid
          source_scenario: "An unmarked validate-only evidence lock predates the entire _manifest_contract snapshot."
          actions:
            - type: api_call
              subject:
                function: enforce_plan_locks
          expected:
            behavior: "Legacy unmarked evidence retains historical snapshot tolerance and remains valid while the manifest hash still matches."
        - kind: test_function
          name: test_capture_runs_all_acceptance_commands_and_rejects_invalid_exit
          source_scenario: "Fast validate is green, the first acceptance command exits 1, and a later acceptance command exits 2."
          actions:
            - type: api_call
              subject:
                function: capture_red_phase_evidence
          expected:
            behavior: "Both acceptance commands run and aggregate evidence is invalid rather than accepting the earlier red exit."
        - kind: test_function
          name: test_preserve_acceptance_red_evidence_accepts_unchanged_commands
          source_scenario: "A marked validate_and_acceptance lock is explicitly revised with --preserve-red-evidence while both command lists are unchanged."
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: "Revision succeeds and preserves the exact marked evidence payload."
        - kind: test_function
          name: test_preserve_acceptance_red_evidence_rejects_changed_acceptance_commands
          source_scenario: "A marked validate_and_acceptance lock is explicitly revised with --preserve-red-evidence after its acceptance command changes."
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: "Revision refuses without modifying the lock because the acceptance command multiset no longer matches."
        - kind: test_function
          name: test_preserve_acceptance_red_evidence_rejects_cross_layer_swap
          source_scenario: "A marked lock's current manifest swaps its validate and acceptance commands before explicit --preserve-red-evidence revision."
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: "Revision refuses without modifying the lock because command identity is bound separately to each layer."
        - kind: test_function
          name: test_preserve_acceptance_red_evidence_accepts_reordering_within_layers
          source_scenario: "A marked lock has two validate and two acceptance commands whose order changes only within each original layer."
          actions:
            - type: api_call
              subject:
                function: cmd_plan_revise
          expected:
            behavior: "Revision succeeds and preserves evidence because integrity comparison is order-insensitive inside each layer."
        - kind: test_function
          name: test_cypress_suffixes_are_test_files
          source_scenario: "The shared classifier receives conventional Cypress TypeScript and JavaScript basenames alongside a non-test source basename."
          actions:
            - type: api_call
              subject:
                function: is_test_file
          expected:
            behavior: "All four .cy.* test suffixes are accepted and the ordinary source file is rejected."
