# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Ship a generic maid-implement-draft skill through the Claude and Codex init payloads so downstream repos can resume a manifests/drafts child through lock, promote, implement, review, and Outcome capture
type: feature
created: '2026-09-02T02:10:37Z'
metadata:
  tags:
  - agent-skills
  - init-payload
  - draft-workflow
  - documentation
  priority: medium
description: |
  Add a generic, tool-agnostic `maid-implement-draft` coordinator skill to the
  per-repo `maid init` payload (Claude and Codex). It is the receiving skill
  for planner Planning Handoff Mode: take `manifests/drafts/<slug>.manifest.yaml`,
  harden tests, confirm red evidence, plan-review, `maid plan lock`, then
  `maid manifest promote`, then delegate to `maid-implementer` and
  `maid-implementation-review` before Outcome capture.

  Pinned decisions (do not redesign):

  1. This is a coordinator, not a replacement for `maid-implementer`. Already
     promoted contracts stay on `maid-implementer`. Do not ship
     `maid-runner-draft-implement` or any maid-runner automation wrapper
     (`AUTOMATION_STATUS`, standing reviewer authorization, loop scripts).

  2. Distribution follows 084-07: source skills under `.claude/skills/` and
     `.codex/skills/` (Codex `agents/openai.yaml`), register in
     `.claude/manifest.json` and `CODEX_DISTRIBUTABLE_SKILLS`, regenerate
     payloads with `make sync-agent-payloads`. Claude and Codex SKILL.md
     bodies must be identical.

  3. Command order is lock-then-promote. Handoff verify is `maid assess` /
     `maid verify --profile handoff`, not the stale
     `maid verify --require-plan-lock --require-red-evidence` example as the
     primary command. After-the-fact red evidence is forbidden.

  4. Name the skill in planner handoff text, implementer draft routing,
     docs/agent-skills.md, docs/draft-manifest-workflow.md, this repo's
     CLAUDE.md / AGENTS.md, onboard's generic-skill count, and the init
     marked-section workflow sentence.

  5. Advance `INSTRUCTION_PAYLOAD_VERSION` past `2026.08.25.1`. Update
     existing hardcoded distributable skill lists in the same change.

  Learning digestion: 084-07/081-04 require the whole payload surface in one
  child (sources, sync, generated copies, onboard count, payload version).
  Dedicated test file avoids hashing shared tests as this contract's only
  coverage, but the shared list fixtures still need files.scope updates so
  exact-equality assertions do not regress. Rejected: copying the user-level
  ~/.codex skill as-is (Codex-flavored, stale verify flags); putting this in
  user_skills like maid-onboard (it is per-repo workflow, not a bootstrapper).
temptations:
- risk: Do not copy maid-runner-draft-implement or the user-level Codex skill into the distributable payload.
  instead: Write a generic coordinator that delegates to maid-plan-review, maid-implementer, and maid-implementation-review, with identical Claude/Codex bodies.
- risk: Do not add the skill to sources without registries, sync, generated copies, onboard count, and INSTRUCTION_PAYLOAD_VERSION.
  instead: Update the full 084-07 distribution surface and pin it with tests/test_implement_draft_skill_guidance.py.
- risk: Do not tell agents to promote by moving files or to mint red evidence after implementation is green.
  instead: Pin lock-then-promote, never-manual-move, and the after-the-fact red-evidence prohibition.
- risk: Do not leave planner handoff pointing at an unnamed receiving agent.
  instead: Name maid-implement-draft in Planning Handoff Mode and route unpromoted drafts away from maid-implementer.
- risk: Do not edit generated maid_runner payload copies by hand or let Claude/Codex skill bodies diverge.
  instead: Author .claude/.codex sources and regenerate with make sync-agent-payloads; pin byte-for-byte source equality.
