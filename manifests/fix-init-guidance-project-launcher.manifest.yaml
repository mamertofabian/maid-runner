# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Use the detected project MAID launcher in generated agent guidance
type: fix
created: '2026-10-20T22:27:54Z'
description: Use the same scripts/maid file detection already used by init hooks to adapt runnable MAID
  commands in freshly rendered owned CLAUDE.md/AGENTS.md sections to ./scripts/maid. Cover recall, insights,
  learn, promotion, revision, validators and Codex scope-check examples. Preserve existing public cmd_init
  signature, marker ownership, all user text outside markers, skill identifiers, copied payload files
  and no-wrapper guidance. Force reruns keep the owned guidance stable and reflect wrapper appearance/removal.
  No new launcher inference, dependency installation, project dependency requirement, copied-skill rewriting,
  marker-boundary whitespace normalization, or changes to hook/precommit selection. A project path containing
  spaces still runs the emitted relative launcher. Bounded rendered-section adaptation avoids changing
  reusable packaged templates and unrelated user text. Tests build real distribution assets from tracked
  agent sources in a disposable workspace, then inject that filesystem through the owned _agent_payload_root
  I/O adapter. This avoids ignored generated source-tree dependencies without faking assets or mutating
  the project. Assert an installed skill matches the real generated payload bytes. All public cmd_init
  execution and owned guidance assertions remain real.
temptations:
- risk: Rewrite every maid occurrence including user text or skill identifiers, or require a new global/project
    dependency.
  instead: Adapt only freshly rendered owned guidance with existing wrapper-file detection; preserve skill
    names, marker-external text and no-wrapper commands. Execute an emitted concrete command through a
    fixture wrapper.
- risk: Fix only one agent or one command family and leave stale force reruns.
  instead: Exercise both public cmd_init agent modes, all runnable MAID prefixes, repeated force init
    owned-section stability and wrapper appearance/removal.
