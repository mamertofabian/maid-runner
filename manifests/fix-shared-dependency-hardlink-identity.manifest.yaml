# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Allow harmless uv hardlink bookkeeping in shared dependency snapshots without weakening material-change detection"
type: fix
created: "2026-08-19T17:11:22Z"
metadata:
  priority: high
  tags: [knockout, snapshots, uv, hardlinks, isolation]
description: |
  Shared-environment snapshots currently hash ctime for every dependency file.
  When uv creates or removes another hardlink to an unchanged cache-backed
  package inode, Linux advances that inode's ctime in every linked worktree.
  The dependency bytes, mode, size, mtime, and final link count remain stable,
  but snapshot teardown incorrectly reports that the command mutated the source
  dependency environment.

  Preserve the existing dependency identity behavior outside regular files
  that are already hardlinked when the snapshot captures its baseline. For
  that narrow class, bind identity to mode, size, mtime, final link count, and
  file content rather than ctime. This accepts only ctime bookkeeping on
  cache-backed hardlinks: a remaining link, byte change, permission change,
  size change, or mtime change still fails closed. In particular, hashing
  hardlinked content must reject a same-size write even if its mtime is
  restored, and an initially single-linked file does not qualify for the
  carveout merely because a command briefly links it.

  Snapshot command environments that reuse source dependencies must also set
  `PYTHONDONTWRITEBYTECODE=1`.
  The existing `PYTHONPYCACHEPREFIX` redirects cooperative Python processes,
  while the no-bytecode setting prevents nested validation processes that
  discard that redirect from writing derived `.pyc` files into the shared
  source dependency environment.
temptations:
  - risk: "Do not drop ctime from every dependency entry."
    instead: "Use content identity only for already-hardlinked regular files and preserve ctime checking elsewhere."
  - risk: "Do not treat a stable size and mtime as proof that hardlinked bytes are unchanged."
    instead: "Hash hardlinked regular-file content so same-size writes with restored mtime remain blocking."
  - risk: "Do not accept a hardlink that remains attached after the command."
    instead: "Keep the final link count in the dependency identity."
  - risk: "Do not whitelist source-venv __pycache__ writes as harmless."
    instead: "Prevent shared-environment bytecode writes with PYTHONDONTWRITEBYTECODE while retaining the dependency identity guard."
