          name: test_shared_snapshot_accepts_transient_external_hardlink_bookkeeping
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "The public shared snapshot context accepts a transient external link whose removal leaves hardlinked dependency bytes and meaningful metadata unchanged."
        - kind: test_function
          name: test_shared_snapshot_rejects_hardlinked_byte_change_with_restored_mtime
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "The public shared snapshot context still fails closed when hardlinked dependency bytes change at the same size after mtime restoration."
        - kind: test_function
          name: test_shared_snapshot_rejects_remaining_external_hardlink
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "The public shared snapshot context still fails closed when an extra dependency hardlink remains attached."
        - kind: test_function
          name: test_shared_snapshot_rejects_hardlinked_mode_change
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "The public shared snapshot context preserves mode identity for an already-hardlinked dependency file."
        - kind: test_function
          name: test_shared_snapshot_rejects_hardlinked_mtime_change
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "The public shared snapshot context preserves mtime identity for an already-hardlinked dependency file with unchanged bytes."
        - kind: test_function
          name: test_shared_snapshot_rejects_transient_link_for_initially_single_link_file
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "The public shared snapshot context retains ctime protection when a dependency file was not hardlinked at baseline capture."
        - kind: test_function
          name: test_shared_snapshot_disables_source_dependency_bytecode_writes
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "A public shared snapshot command cannot write imported dependency bytecode into the source venv even when the pycache redirect is removed downstream."
  scope:
    - path: maid_runner/core/_knockout_snapshot.py
      reason: "Refine the private dependency-tree identity encoding and disable bytecode only for snapshots that reuse source dependency environments; public signatures remain unchanged."
  read:
    - tests/core/test_shared_environment_snapshots.py
    - tests/core/test_knockout_snapshot.py
    - tests/core/test_knockout_snapshot_template.py
    - manifests/121-27-share-coverage-lane-dependency-environments.manifest.yaml
    - manifests/121-46-checkpoint-knockout-cache-per-worker.manifest.yaml
    - manifests/121-47-template-fresh-knockout-roots.manifest.yaml
    - manifests/121-49-clear-release-knockout-blockers.manifest.yaml
validate:
