  summary: "Extended `maid hook scope-check` to parse Antigravity PreToolUse stdin envelopes (`toolCall.args` Path/TargetFile/path/file_path) and explicit stdin `cwd` as `project_root`, and added `--format default|antigravity` so Antigravity receives strict `{\"decision\", \"reason\"}` protojson stdout with exit 0 while preserving the existing default contract (`{\"decision\", \"reason\", \"active_manifest\"}`, exit 0/2/1)."
  rationale: "Antigravity executes command hooks with CWD set to the folder containing `hooks.json` (`.agents/`), passes the workspace root explicitly in stdin `cwd`, and unmarshals `PreToolUse` stdout as protojson on exit 0. Honoring explicit stdin `cwd` avoids heuristic directory walking and keeps `_root_owns_manifest` fail-closed, while gating protojson stdout and exit-0 behavior behind `--format antigravity` keeps legacy, Claude, and Cursor hook contracts untouched."
