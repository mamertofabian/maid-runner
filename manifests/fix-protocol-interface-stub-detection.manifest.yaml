# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Recognize typing Protocol interface declarations without suppressing concrete
  stubs
type: fix
created: '2026-10-20T17:52:19Z'
description: Recognize signature-only members of known module-level typing.Protocol
  and typing_extensions.Protocol declarations as interface contracts, not E310 stubs.
  Support direct/module imports, aliases, known typing star imports, generic bases,
  async methods and docstring-only/pass/ellipsis bodies while preserving exact signatures.
  Reuse existing straight-line module binding/unbinding events; shadowed, relative,
  conditional/unknown imports and uncertain nested/local class origins remain fail-closed.
  Observed Protocol module-member rebinding/deletion invalidates eligibility. No arbitrary
  runtime-value, inheritance or control-flow interpreter. Concrete subclasses without
  explicit canonical Protocol bases and concrete Protocol default bodies retain ordinary
  stub checks; abstractmethod and exact default_hook behavior remain unchanged. Edit
  only the existing implementation collector, preserve public collection signatures
  and verify both public collection APIs plus E310 implementation validation. Runtime
  coverage applicability is a separate queued contract. Update the existing parser-boundary
  Protocol characterization to this declared interface contract, preserving its method/base/type
  assertions; refresh approved shared-test dependent locks only through sanctioned
  preservation with unchanged commands. Route actual Assign/valued AnnAssign/AugAssign/Delete
  binding changes consistently through existing target invalidation; annotation-only
  attribute declarations do not mutate their runtime binding.
temptations:
- risk: Exempt a class or method merely because its base name ends in Protocol, or
    leak interface context into concrete/nested/free-function bodies.
  instead: Require known unshadowed module-level typing bindings and direct Protocol
    bases; reset class context and keep unknown/local origins under ordinary checks.
- risk: Suppress all placeholders in a Protocol class, including concrete unsupported
    defaults or literal-return bodies.
  instead: Exempt only signature-only docstring/pass/ellipsis declarations; retain
    concrete stub warnings and existing abstractmethod/default_hook handling.
- risk: Grow a custom Python control-flow/type-resolution interpreter to infer every
    possible base.
  instead: Reuse existing bounded import/unbinding events, fail closed on uncertain
    bindings and document the narrow rule.
