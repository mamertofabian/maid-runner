          type: str | None
        - kind: function
          name: probe_pytest_runner_capabilities
          args:
            - name: resolved_command
              type: tuple[str, Ellipsis]
            - name: cwd
              type: Path
          returns: PytestRunnerCapabilities
          description: "Probes xdist in the exact resolved runner environment and returns a typed failure instead of guessing."
        - kind: function
          name: build_pytest_timing_identity
          args:
            - name: command
              type: tuple[str, Ellipsis]
            - name: project_root
