          returns: PreparedPytestCommand
          description: "Collects exact nodes, resolves explicit/config policy, probes the consumer runner, applies only accepted loadscope workers, and attaches child-only timing instrumentation."
        - kind: function
          name: finalize_pytest_timing
          args:
            - name: prepared
              type: PreparedPytestCommand
            - name: result
              type: TestRunResult
            - name: project_root
              type: Path
          returns: TestSchedulingNotice | None
          description: "On a successful exact-complete run only, validates plugin evidence and atomically refreshes 121-06 history; otherwise discards it with a visible notice and always cleans temporary state."
        - kind: function
          name: apply_pytest_worker_decision
          args:
            - name: command
              type: tuple[str, Ellipsis]
            - name: decision
              type: PytestWorkerDecision
            - name: capabilities
