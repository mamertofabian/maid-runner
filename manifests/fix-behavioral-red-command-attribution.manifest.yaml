# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Require behavioral test failure evidence instead of lint-only red in stash restoration
type: fix
created: '2026-10-20T15:27:37Z'
description: Require a failing executing behavioral runner in stash-restoration evidence,
  derived through existing command-target APIs against the locked behavioral inventory
  and current registered-wrapper configuration. A lint-only hidden failure plus invalid
  behavioral collection and restored-green tests is invalid, including forged provenance.
  Retain genuine behavioral red from either phase, exact restoration checks and ordinary
  acceptance red. Persist precise phase/command/test provenance and recompute it when
  verifying or preserving evidence; never trust output text or the stored attribution
  alone. No broad runner parser or ordinary evidence-policy expansion.
temptations:
- risk: Trust a stored behavioral attribution label or parse pytest output text as
    proof.
  instead: Derive executing test targets from existing command APIs against the locked
    behavioral inventory and registered wrapper context; recompute any persisted phase/command/test
    attribution at validation.
- risk: Reject all import-obstruction recovery or accept a lint-only red because restored
    commands are valid.
  instead: Retain genuine behavioral failures from either captured phase, preserve
    exact command matching and all restored-state safety checks, reject restored-green/lint-only
    proof, and preserve historical honest payloads without the new advisory attribution
    field.
- risk: Expand ordinary capture policy or build a new runner parser during this focused
    fix.
  instead: Change only stash-restoration attribution, reuse bounded runner target
    APIs, and retain ordinary acceptance red plus contract/test-hash preservation
    rules.
