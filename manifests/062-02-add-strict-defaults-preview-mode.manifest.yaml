schema: '2'
goal: Add a --strict-preview opt-in that runs maid validate and maid verify with the intended future strict defaults and labels the run in text and JSON
type: feature
created: '2026-07-03T23:56:15Z'
metadata:
  epic: 062-00-strict-by-default-validation-gates
  tags:
  - validation-trust
  - hardening
  - strict-defaults
  priority: high
description: |
  Add an explicit opt-in that runs `maid validate` and `maid verify` with the
  gate set intended to become the default in a later v2.x flip release
  (per the 2026-07-04 staged-flip decision recorded in the epic), so
  projects can migrate early and CI can adopt the future behavior before
  the flip.

  Current-tree premise (re-audited 2026-07-03): `maid verify` is already
  strict by default — 032-03 hardwired `check_assertions=True`,
  `check_stubs=True`, and warning failure into `cmd_verify`, with
  `--advisory` (082-01) as the labeled warning-policy hatch.
  Identity-backed behavioral coverage (032-01) and coverage-miss errors
  (030-05) are already default in behavioral validation. The remaining
  opt-in gaps are `maid validate`'s `--strict` expansion (assertion
  checks, stub checks, fail-on-warnings via `_strict_options` in
  `maid_runner/cli/commands/validate.py`) and the artifact
  execution-coverage gate (`--artifact-coverage`, 068) on both commands.

  Pinned decisions (do not redesign):

  - The flag is `--strict-preview`, available on both `maid validate` and
    `maid verify`.
  - Gate-set mapping (exhaustive; no new analyzers, no new gate logic):
    `maid validate --strict-preview` enables the union of the existing
    `--strict` expansion plus `--artifact-coverage`;
    `maid verify --strict-preview` adds only `--artifact-coverage` on top
    of verify's already-strict defaults.
  - Combining `--strict-preview` with `--advisory` on `maid verify` is a
    usage error (exit 2): the caller asked for contradictory gate sets.
  - The strict-preview warning policy is byte-identical to the current
    one: advisory-exempt codes (E307 `VALIDATOR_NOT_AVAILABLE`, legacy
    chain codes) stay exempt, manifest-level default-hook exemptions
    (082-04) stay honored, and info-severity diagnostics (082-05) never
    fail a strict-preview run. Preview strictness comes only from the
    gate-set mapping above, never from re-severity-ing diagnostics.
  - JSON output gains a top-level `"strict_preview": true` marker — in
    both the full JSON payload and `--summary` JSON on verify; text
    output prefixes the summary line with `[strict-preview]` — in both
    classic text and `--summary` text.
  - Default behavior is unchanged when the flag is absent. Default changes
    ship only in the release-flip child (062-04).

  Behavior specifics:

  - The exit code of a `--strict-preview` run reflects the strict
    evaluation: the caller explicitly opted in, so newly failing
    diagnostics fail the run. (Non-breaking side-by-side comparison is the
    job of `--strict-delta` in 062-03.)
  - The `[strict-preview]` prefix and `"strict_preview": true` marker
    appear on both passing and failing runs, so output is always
    distinguishable from a default-gate run.
  - Combining `--strict-preview` with the individual strict flags
    (`--strict`, `--check-assertions`, `--check-stubs`,
    `--fail-on-warnings`, `--artifact-coverage`) is allowed and behaves
    as the union; it never weakens the preview gate set.
  - `--strict-preview --json` and plain `--strict-preview` must report the
    same diagnostics (JSON parity).

  Test expectations (behavioral tests in tests/cli/test_strict_preview.py,
  written during planning of this child, using fixture projects in
  tmp_path):

  - `maid validate --strict-preview` fails on a fixture that passes the
    default gates but violates a strict gate (for example a behavioral
    test exercising an artifact without assertions), proving the preview
    is stronger than the default run.
  - `maid validate --strict-preview` fails on a fixture that passes the
    default gates and the `--strict` expansion but whose declared
    artifact is never executed by its validate command, proving artifact
    coverage is part of the preview set.
  - The same fixtures pass plain `maid validate`, proving defaults are
    unchanged.
  - Text output contains the `[strict-preview]` summary prefix and JSON
    output contains top-level `"strict_preview": true` on both passing and
    failing fixtures.
  - `maid verify --strict-preview` enables the artifact-coverage stage
    and labels classic text, `--summary` text, full JSON, and `--summary`
    JSON output.
  - `maid verify --strict-preview --advisory` exits 2 with a usage error.
  - An info-severity diagnostic (E307 on a recognized non-code file) does
    not fail a `--strict-preview` run.
  - A run without the flag emits no strict-preview marker in text or JSON.
  - Parser registration: `maid validate --strict-preview` and
    `maid verify --strict-preview` are accepted by `build_parser` and
    dispatch through `main`.

  Planning notes: the 2026-06-10 draft left the gate set as a
  conservative mapping exercise; the 2026-07-03 re-audit resolved it and
  the mapping above is now pinned. If implementation discovers a gate the
  mapping missed, stop and send it back to planning rather than widening
  the set ad hoc. The epic says the preview runs "directory-wide"
  validate; this child applies the flag uniformly to directory-wide and
  single-manifest invocations so output labeling never depends on
  invocation shape.

  Out of scope: the pytest config guard extension (062-01), the
  `--strict-delta` migration report (062-03), and flipping defaults plus
  `--legacy-gates` and documentation (062-04).
temptations:
- risk: Do not add new static analyzers or speculative gate logic while wiring the preview flag.
  instead: Only enable gates that already exist behind opt-in flags and are backed by reproduced false-green evidence; route new bypass ideas to the hardening backlog.
- risk: Do not flip any default behavior in this child.
  instead: Keep default runs byte-identical when --strict-preview is absent; defaults change only in the 062-04 release-flip child.
- risk: Do not make strict-preview runs indistinguishable from default runs.
  instead: Always emit the [strict-preview] text prefix and the top-level strict_preview JSON marker, on success and failure alike.
files:
  create:
  - path: tests/cli/test_strict_preview.py
    artifacts:
    - kind: test_function
      name: test_parser_accepts_strict_preview_for_validate_and_verify
      source_scenario: The validate and verify subparsers are built through build_parser.
      actions:
      - type: api_call
        subject:
          command: maid validate --strict-preview
      - type: api_call
        subject:
          command: maid verify --strict-preview
      expected:
        behavior: Both parsers accept --strict-preview and set args.strict_preview true.
    - kind: test_function
      name: test_main_dispatches_strict_preview_to_validate_and_verify_handlers
      source_scenario: main dispatches parsed validate and verify arguments to their handlers.
      actions:
      - type: api_call
        subject:
          command: maid validate --strict-preview
      - type: api_call
        subject:
          command: maid verify --strict-preview
      expected:
        behavior: The dispatched handler receives strict_preview=True for both commands.
    - kind: test_function
      name: test_validate_strict_preview_enables_strict_gates_and_labels_text
      source_scenario: A manifest passes default behavioral validation while its test calls an artifact without assertions.
      actions:
      - type: api_call
        subject:
          command: maid validate <manifest> --mode behavioral --no-chain
      - type: api_call
        subject:
          command: maid validate <manifest> --mode behavioral --no-chain --strict-preview
      expected:
        behavior: The default run passes unmarked; the strict-preview run fails with E210 and prefixes text output with [strict-preview].
    - kind: test_function
      name: test_validate_strict_preview_json_marks_and_enables_artifact_coverage
      source_scenario: A manifest passes schema validation but its validate command never executes the declared artifact body.
      actions:
      - type: api_call
        subject:
          command: maid validate <manifest> --mode schema --no-chain --json
      - type: api_call
        subject:
          command: maid validate <manifest> --mode schema --no-chain --strict-preview --json
      expected:
        behavior: The default JSON run is unmarked; strict-preview JSON has strict_preview=true and fails artifact coverage with E710.
    - kind: test_function
      name: test_validate_strict_preview_coherence_json_keeps_top_level_marker
      source_scenario: Directory-wide validate runs with --strict-preview, --coherence, and --json.
      actions:
      - type: api_call
        subject:
          command: maid validate --manifest-dir manifests/ --mode schema --coherence --strict-preview --json
      expected:
        behavior: The combined validation/coherence JSON keeps strict_preview=true as a top-level marker, not nested under validation.
    - kind: test_function
      name: test_validate_strict_preview_coherence_only_labels_text_and_json
      source_scenario: Coherence-only validation runs with --strict-preview in text and JSON modes.
      actions:
      - type: api_call
        subject:
          command: maid validate --coherence-only --strict-preview
      - type: api_call
        subject:
          command: maid validate --coherence-only --strict-preview --json
      expected:
        behavior: Text output starts with [strict-preview] and JSON output has top-level strict_preview=true.
    - kind: test_function
      name: test_verify_strict_preview_forwards_artifact_coverage_and_labels_outputs
      source_scenario: cmd_verify runs with strict-preview in classic text, summary text, full JSON, and summary JSON modes.
      actions:
      - type: api_call
        subject:
          command: maid verify --strict-preview
      - type: api_call
        subject:
          command: maid verify --strict-preview --summary
      - type: api_call
        subject:
          command: maid verify --strict-preview --json
      - type: api_call
        subject:
          command: maid verify --strict-preview --summary --json
      expected:
        behavior: All modes enable artifact_coverage and label output with [strict-preview] text or strict_preview=true JSON.
    - kind: test_function
      name: test_verify_strict_preview_rejects_advisory
      source_scenario: A caller asks verify to use both strict-preview gates and advisory warning policy.
      actions:
      - type: api_call
        subject:
          command: maid verify --strict-preview --advisory
      expected:
        behavior: The command exits 2 with a usage error instead of running contradictory gates.
    - kind: test_function
      name: test_verify_strict_preview_warning_policy_keeps_info_e307_nonblocking
      source_scenario: A validation result contains an info-severity E307 diagnostic under fail-on-warnings policy.
      actions:
      - type: api_call
        subject:
          export: _has_blocking_validation_warnings
      expected:
        behavior: Info-severity E307 does not become blocking under strict-preview warning policy.
    - kind: test_function
      name: test_verify_without_strict_preview_keeps_outputs_unmarked
      source_scenario: cmd_verify runs without strict-preview in JSON and summary text modes.
      actions:
      - type: api_call
        subject:
          command: maid verify --json
      - type: api_call
        subject:
          command: maid verify --summary
      expected:
        behavior: Output contains no strict-preview marker when the flag is absent.
  edit:
  - path: maid_runner/cli/commands/_main.py
    artifacts:
    - kind: function
      name: build_parser
      args: []
      returns: argparse.ArgumentParser
      description: The validate and verify subparsers accept --strict-preview.
    - kind: function
      name: main
      args:
      - name: argv
        type: list[str] | None
        default: None
      returns: int
      description: Dispatch carries the strict-preview option through to the validate and verify handlers.
  - path: maid_runner/cli/commands/validate.py
    artifacts:
    - kind: function
      name: cmd_validate
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: Run validation with the future-default strict gate set when --strict-preview is given and label text and JSON output.
  - path: maid_runner/cli/commands/verify.py
    artifacts:
    - kind: function
      name: cmd_verify
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: Run the verification gate with the future-default strict gate set when --strict-preview is given and label text and JSON output.
  read:
  - maid_runner/core/validate.py
  - maid_runner/core/artifact_coverage.py
  - maid_runner/core/verify_summary.py
  - maid_runner/cli/commands/_format.py
  - docs/plans/maid-validate-hardening-backlog.md
validate:
- uv run python -m pytest tests/cli/test_strict_preview.py -v
- uv run maid validate manifests/062-02-add-strict-defaults-preview-mode.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-07-04T08:45:00+08:00"
  summary: "Implemented --strict-preview for validate and verify, with validate enabling the existing strict expansion plus artifact coverage and verify adding artifact coverage while preserving existing strict defaults."
  rationale: "The implementation reused existing strict, warning-policy, and artifact-coverage gates instead of adding new analyzers; default behavior remains unmarked and unchanged without --strict-preview, while preview runs are labeled in text and JSON including validate coherence and coherence-only output paths."
  review_notes:
    - source: implementation-review-subagent-019f2a6c-eac4-7a53-b5fc-bbadaf49fe3e
      severity: warning
      summary: "Initial read-only review found validate --strict-preview --coherence --json could nest the marker under validation and validate --coherence-only --strict-preview was unmarked; both were fixed with regression tests."
    - source: implementation-review-subagent-019f2a71-7409-7f33-969d-7dcfc2beb262
      severity: info
      summary: "Re-review found no blockers or should-fix findings after marker placement fixes and returned verdict ready."
  lessons:
    - lesson_type: cli-output
      summary: "Preview-mode markers must be applied to the final rendered output document, especially when commands compose JSON across multiple result stages."
      tags:
        - strict-preview
        - cli
        - json-output
      paths:
        - maid_runner/cli/commands/validate.py
        - tests/cli/test_strict_preview.py
    - lesson_type: workflow
      summary: "Formatting behavioral tests after plan lock requires preserving or recapturing red evidence so plan-lock hashes remain honest."
      tags:
        - plan-lock
        - red-evidence
      paths:
        - .maid/plan-locks/062-02-add-strict-defaults-preview-mode.lock.json
  validation:
    - command:
        - uv
        - run
        - python
        - -m
        - pytest
        - tests/cli/test_strict_preview.py
        - -v
      status: passed
      summary: "10 strict-preview CLI tests passed, covering parser dispatch, validate strict/artifact gates, validate coherence JSON and coherence-only markers, verify output modes, advisory conflict, warning policy, and unmarked defaults."
    - command:
        - uv
        - run
        - maid
        - validate
        - manifests/062-02-add-strict-defaults-preview-mode.manifest.yaml
        - --mode
        - behavioral
      status: passed
      summary: "Behavioral validation passed for the promoted manifest after review-driven test strengthening."
    - command:
        - uv
        - run
        - maid
        - validate
        - manifests/062-02-add-strict-defaults-preview-mode.manifest.yaml
        - --mode
        - implementation
      status: passed
      summary: "Implementation validation passed for the promoted manifest."
    - command:
        - uv
        - run
        - maid
        - test
        - --manifest
        - manifests/062-02-add-strict-defaults-preview-mode.manifest.yaml
      status: passed
      summary: "The promoted manifest's two declared validation commands passed."
    - command:
        - uv
        - run
        - ruff
        - check
        - maid_runner/cli/commands/_main.py
        - maid_runner/cli/commands/validate.py
        - maid_runner/cli/commands/verify.py
        - tests/cli/test_strict_preview.py
      status: passed
      summary: "Ruff passed on the touched Python files."
    - command:
        - uv
        - run
        - maid
        - validate
      status: passed
      summary: "Repository-wide MAID validation passed for 400 manifests, with 308 passed and 92 superseded skipped."
    - command:
        - uv
        - run
        - maid
        - test
      status: passed
      summary: "Repository-wide MAID test passed all 171 manifest commands after the review-driven fix."
