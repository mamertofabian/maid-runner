# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Package generated Antigravity skills and `.agents/hooks.json` and wire `maid init --tool antigravity` with check, merge, launcher-rewrite, and safe uninstall support"
type: feature
created: "2026-11-26T05:07:33Z"
metadata:
  epic: antigravity-support
  tags:
    - antigravity
    - init-payloads
    - hooks
    - agent-integration
  priority: medium
description: |
  Slice 2 of `manifests/drafts/antigravity-support.epic.yaml`.

  Adds first-class repo-level Antigravity initialization (`maid init --tool
  antigravity`) using Antigravity's native `.agents/` workspace customization
  root and shared `AGENTS.md` rules without introducing a third manually
  maintained copy of identical `SKILL.md` files.

  Design decisions (rationale):

  1. Generated skill payload with targeted overlay (`scripts/sync_claude_files.py`):
     `sync_antigravity_payload()` reads the distributable skill list from
     `.claude/manifest.json` (falling back to `CODEX_DISTRIBUTABLE_SKILLS`),
     copies the generic `SKILL.md` files from canonical `.claude/skills/` into
     `maid_runner/antigravity/skills/`, and applies an explicit deterministic
     overlay to `maid-implementation-review/SKILL.md` replacing Claude's
     `subagent_type: "maid-implementation-reviewer"` bullets with Antigravity's
     fresh read-only `invoke_subagent` (`TypeName: "research"`,
     `Model: "inherit"`, `manage_subagents` cleanup) mechanics. If the expected
     source block is missing, `sync_antigravity_payload()` raises `ValueError`
     rather than silently shipping stale Claude instructions.
  2. Antigravity `hooks.json` schema & working directory:
     `maid_runner/antigravity/hooks.json` uses Antigravity's named-hook schema
     (`{"maid-scope-check": {"PreToolUse": [{"matcher": "write_file|edit_file|write_to_file|replace_file_content|multi_replace_file_content", "hooks": [{"type": "command", "command": "maid hook scope-check --stdin --format antigravity"}]}]}}`).
     Because Antigravity executes command hooks with process CWD set to the
     directory containing `hooks.json` (`.agents/`), when a project-local
     `scripts/maid` launcher exists, `maid init --tool antigravity` rewrites
     the hook command to `../scripts/maid hook scope-check --stdin --format
     antigravity` (while `AGENTS.md` command examples continue using
     `./scripts/maid`).
  3. Non-destructive `.agents/hooks.json` merge & safe uninstall:
     Installing or force-reinitializing merges `"maid-scope-check"` into any
     existing `.agents/hooks.json` without clobbering unrelated user hooks or
     sibling hooks. Uninstalling removes only the MAID scope-check command leaf
     (pruning empty MAID containers while preserving user hooks), removes
     MAID-owned `.agents/skills/*` and `.agents/manifest.json`, and cleans the
     `AGENTS.md` marker block. `maid init --uninstall` (`--tool auto`) includes
     `antigravity` alongside `claude`, `codex`, `cursor`, and `generic` and
     deduplicates shared `AGENTS.md` cleanup cleanly.
  4. Backward-compatible `maid init --check`:
     `maid init --tool antigravity` stamps `instruction_payload_metadata()` into
     `.agents/manifest.json`. `_instruction_payload_status()` always reports
     `claude` and `codex` (preserving exact-dict compatibility with plan-locked
     `tests/cli/test_init_instruction_payload_version.py`) and includes
     `antigravity` whenever `.agents/manifest.json` is present, reporting
     `current` or `stale` and participating in the overall status and exit code.
  5. Documentation sync:
     Updates `README.md` (Multi-Tool Support, CLI Reference, Repo-Level
     Antigravity Install, and Edit-Time Scope Enforcement prose) and
     `docs/agent-skills.md` while preserving all existing test-locked doc
     anchors.

  Outcome recall digestion:
  - Applied lesson from `069-03`: keep source/generator, generated package tree
    (`maid_runner/antigravity/`), `pyproject.toml` package-data globs, `Makefile`
    sync/clean targets, and isolated parity tests in the same child; declare
    new tests in a dedicated file so older plan locks remain intact.
  - Applied lesson from `fix-init-payload-portability`: hook merge and cleanup
    must target only the owned MAID scope-check command leaf without clobbering
    user-owned sibling hooks or empty user containers.
  - Applied lesson from `fix-claude-scope-check-stdin-envelope`: exercise the
    exact installed `.agents/hooks.json` command against a realistic
    Antigravity `PreToolUse` stdin envelope from `.agents/` in tests.

  Out of scope for Slice 2: `maid skills install` / `uninstall` user-level
  Antigravity support under `~/.gemini/config/skills/maid-onboard` (Slice 3).
temptations:
  - risk: "Do not add a third manually-maintained `.agents/skills/` tree to the repo."
    instead: "Generate `maid_runner/antigravity/skills/` from canonical `.claude/skills/` in `sync_antigravity_payload()` with an explicit overlay for `maid-implementation-review/SKILL.md`."
  - risk: "Do not rewrite Antigravity hook commands to `./scripts/maid` when `scripts/maid` exists."
    instead: "Rewrite Antigravity `.agents/hooks.json` commands to `../scripts/maid hook scope-check --stdin --format antigravity` because Antigravity runs hooks from the directory containing `hooks.json`."
  - risk: "Do not add an unconditional absent `antigravity` key to `maid init --check --json` output."
    instead: "Include `antigravity` in `installed` whenever `.agents/manifest.json` is present so existing plan-locked `test_init_instruction_payload_version.py` assertions remain green."
  - risk: "Do not clobber user hooks in `.agents/hooks.json` during install, force-reinit, or uninstall."
    instead: "Merge and clean only the MAID scope-check command leaf under `maid-scope-check`, preserving unrelated top-level hooks and sibling entries."
