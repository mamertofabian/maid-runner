    paths: [maid_runner/core/plan_lock.py, maid_runner/cli/commands/plan.py]
  - lesson_type: architecture
    summary: Changing a core reconstruction default requires auditing every caller that later attaches evidence, including stash, test-only, and manifest-promotion workflows.
    tags: [callers, promotion, evidence-transition]
    paths: [maid_runner/cli/commands/plan.py, maid_runner/cli/commands/manifest.py]
