schema: '2'
goal: Allow an explicit bounded command timeout when capturing plan-lock evidence
type: fix
created: '2026-08-20T08:41:42Z'
metadata:
  planning_state: behavioral-contract
  promotion_ready: true
  tests_status: created-red-confirmed
  status: implementation-ready
  source_bug_report: /home/atomrem/.maid/bug-report/20260820-142515-maid-runner-legacy-baseline-timeout.md
  tags:
  - plan-lock
  - legacy-baseline
  - timeout
  - release-blocker
  priority: high
description: |
  Add `maid plan lock --command-timeout <seconds>` so operators can raise the
  existing 300-second per-command evidence-capture limit for legitimately slow
  validation commands. The default remains 300 seconds, values must be positive,
  and the override applies identically to ordinary red-phase capture and audited
  legacy-green capture.

  This is a backward-compatible additive evolution: both public capture
  functions gain one optional integer argument, while existing callers retain
  the current timeout. The CLI makes the override explicit and auditable in the
  invoked command instead of trusting a hidden environment variable. Timeout
  exits remain invalid evidence; the change only permits waiting longer for the
  exact locked validation command.

  The immediate reproduction is the committed 8110ca1 canonical snapshot batch:
  `snapshot-cli-commands--main-2` includes `pytest tests/ -v`, which is green but
  exceeds the fixed supervisor timeout before legacy evidence can be recorded.
temptations:
- risk: Do not relabel timeout exit -1 as red or green evidence.
  instead: Preserve existing classification and only pass the explicit timeout to the owned command runner.
- risk: Do not read an unrecorded environment variable to extend capture time.
  instead: Expose a positive CLI integer with the current 300-second value as its visible default.
- risk: Do not special-case the snapshot slug or weaken its historical validate commands.
  instead: Fix the general evidence-capture boundary and rerun the exact committed command with a larger bound.
- risk: Do not apply the override only to legacy capture while ordinary plan locking silently retains different behavior.
  instead: Thread the same option through both public evidence-capture functions and cover both paths behaviorally.
files:
  edit:
  - path: maid_runner/core/plan_lock.py
    artifacts:
    - kind: function
      name: capture_red_phase_evidence
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: command_timeout_seconds
        type: int
        default: '300'
      returns: RedPhaseEvidence
      description: Capture ordinary red-phase evidence with a positive caller-selected per-command timeout while preserving invalid timeout classification.
    - kind: function
      name: capture_legacy_baseline_evidence
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: reason
        type: str
      - name: command_timeout_seconds
        type: int
        default: '300'
      returns: LegacyBaselineEvidence
      description: Capture audited legacy-green evidence with the same positive caller-selected per-command timeout.
  scope:
  - path: maid_runner/cli/commands/_main.py
    reason: Register the positive --command-timeout plan-lock option with a 300-second default.
  - path: maid_runner/cli/commands/plan.py
    reason: Forward the parsed timeout to ordinary and legacy evidence capture without changing evidence classification.
  create:
  - path: tests/cli/test_plan_lock_command_timeout.py
    artifacts:
