      name: test_plan_lock_parser_exposes_positive_command_timeout
      args: []
      returns: None
      description: The parser defaults to 300 seconds, accepts a positive override, and rejects zero, negative, and non-integer values.
    - kind: test_function
      name: test_red_capture_uses_explicit_command_timeout
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: A sleeping red command times out as invalid under a short bound and records genuine red evidence under a sufficient bound.
    - kind: test_function
      name: test_legacy_capture_uses_explicit_command_timeout
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: A committed sleeping green command fails legacy migration under a short bound and records audited green evidence under a sufficient bound.
    - kind: test_function
      name: test_plan_lock_cli_forwards_command_timeout_to_legacy_capture
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: The public CLI fails without a sufficient override and creates a valid legacy lock when the explicit bound is long enough.
    - kind: test_function
      name: test_plan_lock_cli_forwards_command_timeout_to_red_capture
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: The public CLI preserves invalid timeout classification under a short bound and creates a red-evidence lock under a sufficient bound.
