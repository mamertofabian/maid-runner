schema: '2'
goal: Ship the maid-run-review skill through the full agent-payload distribution surface (source .claude/.codex skills, generated maid_runner payload copies, manifest registries, sync script, distribution tests) that orchestrates the 084-06 pipeline — evaluate run, prompt, agent-available model generation with explicit cloud privacy disclosure, validate, render — plus docs/run-evaluation.md documenting the whole after-action evaluation layer
type: feature
created: '2026-07-06T10:01:23Z'
metadata:
  epic: 084-00-after-action-run-evaluation
  tags:
  - run-evaluation
