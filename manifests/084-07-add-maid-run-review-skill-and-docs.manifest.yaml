  - agent-skills
  - documentation
  priority: medium
description: |
  Final child: the model-calling half lives here, as a skill, keeping the
  runner AI-free. Mirrors the maid-outcome-enrich skill's structure,
  payload distribution, and guidance-test pattern established by 081-04.
  Depends on 084-06.

  Pinned decisions (do not redesign):

  1. Distribution follows the 081-04 surface exactly. Skill sources of
     truth are .claude/skills/maid-run-review/SKILL.md and
     .codex/skills/maid-run-review/SKILL.md (with the Codex
     agents/openai.yaml companion); scripts/sync_claude_files.py copies
     them into the generated maid_runner/claude/ and maid_runner/codex/
     payload trees, and the .claude/manifest.json /
     maid_runner/codex/manifest.json registries gain the skill entry.
     Never hand-edit generated copies out of sync with sources; the
     distribution tests (tests/test_agent_payload_distribution.py and
     the skill-list assertions they carry) are extended in the same
     change, per the 081-04 pattern.

  2. The skill procedure is fixed: (a) run `maid evaluate run
     <manifest>` and show the deterministic result first; (b) run `maid
     evaluate prompt <manifest> [--diff-file]` — the skill may prepare a
     diff file explicitly and must say so; (c) generate the review with
     an agent-available model, preceded by an explicit disclosure when
     that model is a cloud model naming what run evidence leaves the
     machine (mirroring maid-outcome-enrich's cloud privacy disclosure);
     (d) run `maid evaluate validate` and fix-or-regenerate on errors —
     never hand-edit citations to force validity; (e) run `maid evaluate
     render` and present the labeled advisory report. The skill must
     state that the review is advisory, never a gate, and must not be
     fed back to the implementing agent as instructions during an active
     run.

  3. docs/run-evaluation.md documents the full layer for humans:
     provenance capture (--agent-* flags, MAID_AGENT_* env), contract
     deltas, evaluate run/compare semantics including the honest-gap
     statuses (unclassified, unknown agent, no-lock), the review
     pipeline, the advisory-never-gate rule, and the
     no-composite-scores rationale. README gets the pointer;
     docs/agent-skills.md gains the maid-run-review distribution row.

  4. Guidance tests follow tests/test_outcome_enrich_skill_guidance.py:
     a new tests/test_run_review_skill_guidance.py pins the
     safety-critical strings in BOTH source SKILL.md files — cloud
     privacy disclosure requirement, validate-before-render order, the
     never-hand-edit-citations rule, and the advisory-never-gate
     statement — plus docs/run-evaluation.md's coverage of the
     MAID_AGENT_* variables and both evaluate subcommands.

  5. Because maid-run-review is installed through `maid init`, this child
     changes the init instruction payload. Advance
     `INSTRUCTION_PAYLOAD_VERSION` past the pre-change baseline
     `2026.07.05.1` so downstream `maid init --check` reports older
     installed payloads as stale.

  Planned behavioral tests (red phase pending — handoff stops before
  tests): tests/test_run_review_skill_guidance.py asserts both source
  SKILL.md files exist and contain the cloud privacy disclosure
  requirement, the prompt->model->validate->render order with
  fail-closed render, the prohibition on hand-editing citations to pass
  validation, and the advisory-never-gate statement; asserts
  docs/run-evaluation.md documents --agent-model, MAID_AGENT_MODEL,
  evaluate run, evaluate compare, and the unknown/unclassified honest
  gaps; asserts README references docs/run-evaluation.md; asserts
  docs/agent-skills.md lists maid-run-review for both payloads.
  tests/test_agent_payload_distribution.py additions assert the skill
  reaches both generated payload trees and both manifest registries.
temptations:
- risk: Do not edit generated maid_runner payload copies directly or let sources and generated trees diverge.
  instead: Author the .claude/.codex sources, register them in the sync script and manifests, and regenerate via make sync-agent-payloads, as the distribution tests enforce.
- risk: Do not soften or omit the cloud privacy disclosure to streamline the skill.
  instead: Keep the disclosure step mandatory before any cloud model call, naming what run evidence leaves the machine, and pin it with a guidance test.
- risk: Do not instruct the skill to fix validation failures by editing citations or evidence ids in the model output.
  instead: The skill regenerates or corrects via the model; hand-forcing validity defeats anti-fabrication and is explicitly forbidden in the SKILL.md.
- risk: Do not position the review as a quality gate or feed it to the implementing agent mid-run.
  instead: Document and pin the advisory-never-gate rule; reviews inform the human operator after the run.
- risk: Do not add or change an init-distributed skill without bumping the instruction payload version.
  instead: Advance INSTRUCTION_PAYLOAD_VERSION past 2026.07.05.1 and pin the bump with a guidance test.
