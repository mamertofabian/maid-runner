  epic: chain-merge-defragmentation
  priority: high
  tags:
    - chain-merge
    - supersession
    - artifact-coverage
    - manifest-consolidation
    - validation-trust
description: |
  Replace child 4's multi-file refusal with a preservation-safe file-scoped
  materialization. A target file in a mature repository is commonly declared
  by manifests that also own other files. Whole-manifest supersession remains
  the storage model, so the new replacement manifest must carry those owners'
  unrelated public contracts, imports, acceptance suites, removal records, and
  path intent forward rather than dropping them or weakening per-owner runtime
  evidence.

  `apply_chain_merge` continues to snapshot the target's complete current
  public surface. It additionally projects every directly superseded owner's
  other public artifact declarations into the replacement using the strictest
  original file mode (`create`/`snapshot` before `edit`), preserves file imports,
  scope/read/delete paths, acceptance tests, and removed artifacts, and uses the
  exact first-seen union of original validate commands. Duplicate artifact
  contracts, imports, paths, commands, acceptance tests, and removal records use
  stable first-owner order. The resulting chain passes the real
  supersession audit and exposes the same merged public contracts for unrelated
  files after the original owners become inactive.

  The target is the complete current public snapshot, including public symbols
  that no predecessor declared. Private declarations are intentionally omitted
  from both the target and preserved remainder. MAID's planner contract and supersession auditor define
  artifacts as public API; retaining legacy private declarations would preserve
  untestable E710 debt and recreate the invalid direct-private-test shortcut.
  Public target artifacts missing from current code still refuse atomically.
  Path precedence is explicit: an artifact-bearing file outranks scope/read,
  delete outranks scope/read, and scope outranks read. A carried-forward path
  declared both artifact-bearing and deleted is contradictory and refuses
  atomically instead of silently choosing one obligation.

  Repeated apply is safe: when the generated snapshot slug is already active,
  the replacement uses the first available numeric suffix. It never overwrites
  or supersedes itself, so supersession integrity and the prior snapshot's
  historical bytes remain intact.

  This is not partial schema supersession: history remains auditable through
  ordinary whole-manifest `supersedes`, and the replacement is self-contained.
  It does not retire tests, alter evidence aggregation, auto-seal grandfather
  locks, or claim equivalence without the existing coverage/knockout gate.
temptations:
  - risk: "Do not make multi-file apply pass by ignoring unrelated declarations or by writing a partial replacement before all checks pass."
    instead: "Build the complete replacement in memory, carry every unrelated public artifact forward under the strictest original file mode, verify all refusal conditions, choose a non-colliding snapshot slug, and save once before asserting the real supersession audit has zero violations."
  - risk: "Do not merge runtime evidence across still-active owners or weaken child 3b's conflicting-evidence E710 rule."
    instead: "Preserve each superseded owner's exact validate command in deterministic first-seen order so evidence becomes shared only inside the explicit consolidated replacement."
  - risk: "Do not retain legacy private artifacts or add tests that call private compatibility helpers directly."
    instead: "Filter private declarations consistently with snapshot generation and the supersession auditor; preserve only public contracts."
  - risk: "Do not lose non-artifact scope, read, or delete intent while focusing on artifact preservation."
    instead: "Project and deduplicate all directly superseded owners' scope/read/delete paths with the documented precedence, refusing artifact/delete contradictions, and test each category."
  - risk: "Do not preserve source artifacts while silently retiring imports, acceptance suites, or explicit removals."
    instead: "Carry forward first-seen imports, acceptance tests with strongest immutability, and removed-artifact records, then assert their exact loaded values."
