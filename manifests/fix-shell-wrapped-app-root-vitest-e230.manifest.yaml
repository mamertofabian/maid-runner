  completed_at: "2026-07-27T15:06:00Z"
  summary: "Resolved the reported E230 false positive for app-root Vitest commands wrapped in `bash -lc` with repo-root `$ROOT` test targets."
  rationale: "The implementation keeps E230 fail-closed by accepting only bounded shell structures that can be reduced to standalone assignments, successful `cd`, and one recognized executing runner segment. Dotenv is transparent only after an explicit `--` inner command, unresolved shell variables are rejected, `||` branches are rejected, and glob coverage is limited to concrete files selected by `Path.glob`."
