# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Credit executed Python package re-exports without weakening E710"
type: fix
created: "2026-08-16T13:38:55Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags: [artifact-coverage, validation-trust, reexport, E710]
description: |
  Repository-wide deep verification has 44 unique E710 failures for public
  functions declared from Python package __init__.py files. These declarations
  are import re-exports, so the declaration file has no local FunctionDef body
  for artifact coverage to execute. Calling the public export executes the
  resolved implementation body, but both the exact and derived evaluators
  currently discard that evidence and emit an unconditional E710.

  Resolve one-level Python package re-exports through the existing
  module_paths.resolve_reexport boundary. Coverage collection must include the
  resolved implementation file and evaluation must match the resolved source
  name/body while preserving the public declaration path/name in findings and
  diagnostics. Plain and aliased exports are supported. A re-export that is
  merely imported, or cannot be resolved to an executed implementation body,
  remains E710. Local function behavior and report ordering remain unchanged.

  This isolated bug fix addresses only executable re-exported functions. The
  separately reported abstract Protocol/value-class representation limits and
  the repository's concrete stale-test debt stay out of scope.
temptations:
  - risk: "Do not treat importing an __init__.py re-export as execution of the exported function."
    instead: "Resolve the implementation identity and require its function body or call qualname to execute before marking the public declaration covered."
  - risk: "Do not add dummy wrappers to package __init__.py files solely to manufacture executable lines."
    instead: "Reuse the existing one-level Python re-export resolver and preserve the current public API implementation shape."
  - risk: "Do not turn unresolved imports, star imports, or multi-hop barrels into coverage successes."
    instead: "Fail closed to the existing declaration-local evaluation unless the existing resolver returns a concrete source module and symbol."
  - risk: "Do not rewrite E710 findings to the implementation file and lose the manifest-facing contract identity."
    instead: "Collect from the resolved target but render findings and diagnostics against the declared package path and public symbol."
