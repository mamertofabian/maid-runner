              default: "None"
          returns: ArtifactCoverageReport
          description: "Exact artifact coverage resolves one-level package re-exports to executed implementation bodies while retaining public declaration identities."
        - kind: function
          name: run_artifact_coverage_batch
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: executor
