      status: passed
      summary: "All 51 cache-context, persistence, declaration, snapshot-isolation, and worker tests passed."
    - command: [uv, run, maid, validate, manifests/fix-knockout-cache-key-context.manifest.yaml, --mode, implementation, --packet]
      status: passed
      summary: "Implementation validation passed against plan-lock revision 6."
    - command: [uv, run, maid, validate]
      status: passed
      summary: "All 268 active manifests passed."
