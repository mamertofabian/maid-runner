  completed_at: "2026-08-17T13:36:50Z"
  summary: "Knockout cache reads and checkpoints now reuse one invocation-scoped hermetic key context, reject drifted worker inputs, skip empty and no-cache work, and tolerate only exact untracked checkpoint paths."
  rationale: "A 487-mutation release gate spent more than nine minutes recomputing the full repository and environment identity per cache read. Review hardened the optimization against mid-run input drift, empty plans, non-Git checkpoint identity, and Git repositories that do not ignore the cache."
  lessons:
