    - source: knockout_cache_context_impl_review
      severity: blocking-fixed
      summary: "Re-review reproduced Git repositories without cache ignores; exact untracked cache filtering now preserves checkpoint reuse while tracked and lookalike paths remain guarded."
    - source: knockout_cache_context_impl_review
