        - maid_runner/core/knockout.py
    - lesson_type: validation-trust
      summary: "Shared cache identity widens the drift window, so worker snapshots must prove they match the captured project and dependency inputs before checkpoint callbacks can persist evidence."
      tags: [cache-integrity, snapshot-isolation, fail-closed]
      paths:
        - maid_runner/core/knockout.py
        - maid_runner/core/_knockout_snapshot.py
  review_notes:
    - source: knockout_cache_context_impl_review
      severity: blocking-fixed
