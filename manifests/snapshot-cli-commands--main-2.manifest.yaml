      name: ValidationEngine
    - kind: function
      name: validate
      args:
      - name: manifest_path
        type: Union[str, Path]
      returns: ValidationResult
    - kind: function
      name: validate_all
      args:
      - name: manifest_dir
        type: Union[str, Path]
        default: '''manifests/'''
      returns: BatchValidationResult
    - kind: method
      name: run_file_tracking
      description: Reports files.scope through scope_only while preserving writable
        manifest-chain behavior.
      of: ValidationEngine
      args:
      - name: self
        type: ValidationEngine
      - name: chain
        type: ManifestChain
      returns: FileTrackingReport
    - kind: method
      name: validate
      description: Single-manifest behavioral and implementation validation appends
        registry plugin diagnostics as warnings, leaves schema mode manifest-only,
        and applies fail_on_warnings to plugin warnings.
      of: ValidationEngine
      args:
      - name: manifest
        type: Union[Manifest, str, Path]
      returns: ValidationResult
    - kind: method
      name: validate_acceptance
      of: ValidationEngine
      args:
      - name: manifest
        type: Manifest
      returns: list[ValidationError]
    - kind: method
      name: validate_all
      description: Directory-wide validation surfaces registry plugin diagnostics
        once on the batch result instead of duplicating them per manifest.
      of: ValidationEngine
      args:
      - name: manifest_dir
        type: Union[str, Path]
        default: '"manifests/"'
      returns: BatchValidationResult
    - kind: method
      name: validate_behavioral
      of: ValidationEngine
      args:
      - name: manifest
        type: Manifest
      - name: chain
        type: Optional[ManifestChain]
      returns: list[ValidationError]
    - kind: method
      name: validate_implementation
      of: ValidationEngine
      args:
      - name: manifest
        type: Manifest
      - name: chain
        type: Optional[ManifestChain]
      returns: list[ValidationError]
    - kind: method
      name: validate_removed_artifacts
      of: ValidationEngine
    - kind: method
      name: validation_cache_scope
      description: Include the re-export resolution cache in the caches cleared when
        the outermost validation scope is entered and exited.
      of: ValidationEngine
      returns: AbstractContextManager[None]
  - path: maid_runner/validators/registry.py
    artifacts:
    - kind: attribute
      name: extension
      of: UnsupportedLanguageError
    - kind: attribute
      name: detail
      of: ValidatorRecord
      type: str | None
    - kind: attribute
      name: extensions
      of: ValidatorRecord
      type: tuple[str, ...]
    - kind: attribute
      name: name
      of: ValidatorRecord
      type: str
    - kind: attribute
      name: source
      of: ValidatorRecord
      type: str
    - kind: attribute
      name: status
      of: ValidatorRecord
      type: str
    - kind: class
      name: UnsupportedLanguageError
      description: Public missing-validator exception whose message reuses the centralized
        plugin-discovery guidance.
    - kind: class
      name: ValidatorRecord
      description: 'Inspectable record of one registered or skipped validator: name,
        claimed extensions, source, status, and optional detail.'
    - kind: class
      name: ValidatorRegistry
    - kind: function
      name: auto_register
      args:
      - name: registry
        type: ValidatorRegistry
      returns: ValidatorRegistry
    - kind: method
      name: clear
      description: Clear validator registrations, cached instances, validator records,
        and plugin diagnostics.
      of: ValidatorRegistry
      returns: None
    - kind: method
      name: clone
      description: Copy registered validator classes, validator records, and plugin
        diagnostics while leaving cached validator instances isolated.
      of: ValidatorRegistry
      returns: ValidatorRegistry
    - kind: method
      name: get
      of: ValidatorRegistry
      args:
      - name: file_path
        type: Union[str, Path]
      returns: BaseValidator
    - kind: method
      name: has_validator
      of: ValidatorRegistry
      args:
      - name: file_path
        type: Union[str, Path]
      returns: bool
    - kind: method
      name: has_validator_for_extension
      of: ValidatorRegistry
      args:
      - name: ext
        type: str
      returns: bool
    - kind: method
      name: plugin_diagnostics
      description: Structured E902 VALIDATOR_PLUGIN_LOAD_FAILURE and E903 VALIDATOR_PLUGIN_CONFLICT
        warnings naming the affected distributions.
      of: ValidatorRegistry
      returns: list[ValidationError]
    - kind: method
      name: register
      of: ValidatorRegistry
      args:
      - name: validator_class
        type: type[BaseValidator]
      returns: None
    - kind: method
      name: supported_extensions
      of: ValidatorRegistry
      returns: set[str]
    - kind: method
      name: validator_records
      description: Deterministically ordered records for built-ins (first) and plugins
        (by distribution name), including conflict, error, and disabled entries.
      of: ValidatorRegistry
      returns: tuple[ValidatorRecord, ...]
    - kind: method
      name: with_builtin_validators
      description: Construct the registry with built-ins, then discover maid_runner.validators
        entry points once with deterministic ordering, built-in-wins precedence, isolated
        failures, and the kill switch.
      of: ValidatorRegistry
      returns: ValidatorRegistry
  - path: maid_runner/cli/commands/manifest.py
    artifacts:
    - kind: function
      name: cmd_manifest
      args:
      - name: args
        type: argparse.Namespace
      returns: int
  - path: maid_runner/cli/commands/plan.py
    artifacts:
    - kind: function
      name: cmd_plan
      description: Dispatches the additive dependents subcommand alongside lock, revise,
        and status.
      args:
      - name: args
        type: argparse.Namespace
      returns: int
    - kind: function
      name: cmd_plan_dependents
      description: Render the shared-test plan-lock dependency report as deterministic
        text or JSON without changing locks.
      args:
      - name: args
        type: argparse.Namespace
      returns: int
    - kind: function
      name: cmd_plan_lock
      description: Create a plan lock and advisory-backfill the manifest header; a
        backfill write failure prints a one-line stderr notice and does not change
        the exit code.
      args:
      - name: args
        type: argparse.Namespace
      returns: int
    - kind: function
      name: cmd_plan_revise
      description: Explicit --preserve-red-evidence rejection continues to identify
        the existing plan lock when stronger payload consistency checks reject malformed
        stored evidence.
      args:
      - name: args
        type: argparse.Namespace
      returns: int
    - kind: function
      name: cmd_plan_status
      description: "Treats a manifest that cannot be parsed or hashed as a structured\
        \ mismatch per pinned rule 8 \u2014 manifest_match false plus a manifest_error\
        \ detail field with mismatch exit code 1 \u2014 instead of surfacing a raw\
        \ exception through the generic CLI handler; all other status behavior is\
        \ unchanged."
      args:
      - name: args
        type: argparse.Namespace
      returns: int
