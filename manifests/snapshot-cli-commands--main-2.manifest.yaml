# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Snapshot of maid_runner/cli/commands/_main.py
type: snapshot
files:
  create:
  - path: maid_runner/cli/commands/chain.py
    artifacts:
    - kind: function
      name: cmd_chain
      args:
      - name: args
        type: argparse.Namespace
      returns: int
  - path: maid_runner/cli/commands/verify.py
    artifacts:
    - kind: function
      name: cmd_verify
      description: Forwards the explicit pytest worker override into the complete
        verify execution path.
      args:
      - name: args
        type: argparse.Namespace
      returns: int
    - kind: function
      name: run_verify
      description: Library verification can opt into failing when file tracking contains
        scope-only production files.
      args:
      - name: manifest_dir
        type: str
      - name: project_root
        type: Union[str, Path]
      - name: fail_on_scope_only
        type: bool
        default: 'False'
      returns: VerificationResult
  - path: tests/cli/test_verify_cmd.py
    artifacts:
    - kind: test_function
      name: test_cmd_verify_default_test_jobs_remains_serial
      source_scenario: '`cmd_verify` receives parsed args without an explicit test_jobs
        attribute from older callers.'
      actions:
      - type: api_call
        subject:
          function: cmd_verify
      expected:
        behavior: '`cmd_verify` forwards test_jobs=1 to `_run_verify` so existing
          direct Namespace callers remain serial.'
    - kind: test_function
      name: test_cmd_verify_forwards_test_jobs_to_run_verify
      source_scenario: '`cmd_verify` receives parsed args with test_jobs=3.'
      actions:
      - type: api_call
        subject:
          function: cmd_verify
      expected:
        behavior: '`cmd_verify` forwards test_jobs=3 to `_run_verify` and leaves existing
          verify flags unchanged.'
    - kind: test_function
      name: test_silent_verify_cli_uses_repository_worker_and_job_config
    - kind: test_function
      name: test_task_scoped_worker_override_reaches_selected_implementation_command_and_notice
    - kind: test_function
      name: test_verify_accepts_test_runner_validate_command
      source_scenario: A project has a valid manifest whose validate command runs
        pytest against the declared test file.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 0 when every stage and the real test command pass.
    - kind: test_function
      name: test_verify_advisory_mode_allows_missing_assertion_warning
      source_scenario: A caller explicitly requests advisory verify behavior for the
        same assertion-free test.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: The command exits according to advisory semantics and makes the
          warning visible.
    - kind: test_function
      name: test_verify_allow_empty_returns_0_without_manifest_directory
      source_scenario: A caller explicitly allows an empty manifest directory during
        bootstrap.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify --allow-empty exits 0 and reports skipped manifest-dependent
          stages visibly.
    - kind: test_function
      name: test_verify_cache_scope_clears_after_command
      source_scenario: A verify run populates validation caches and then a second
        run observes changed files.
      actions:
      - type: api_call
        subject:
          export: _run_verify
      expected:
        behavior: The second run recomputes changed content and does not return stale
          cache entries.
    - kind: test_function
      name: test_verify_changed_scope_stage_passes_with_since_for_writable_changes
      source_scenario: maid verify --since <baseline> runs after all changed production
        files are declared writable.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: The changed_scope stage passes and verify continues to the tests
          stage.
    - kind: test_function
      name: test_verify_changed_scope_stage_reports_read_only_changed_file
      source_scenario: maid verify --keep-going runs with default changed-scope on
        a repo where a changed production file is listed only in files.read.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: The JSON and text verify outputs include a failed changed_scope
          stage with the changed file path.
    - kind: test_function
      name: test_verify_created_timestamp_chain_warning_is_advisory_by_default
      source_scenario: A verify fixture has a post-policy date-only unsequenced created
        value.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: main(['verify', '--no-changed-scope']) passes by default and keeps
          the E118 advisory warning visible.
    - kind: test_function
      name: test_verify_default_changed_scope_requires_baseline
      source_scenario: maid verify runs without --since, --base-ref, metadata.maid_task_base,
        or --no-changed-scope.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: The changed_scope stage fails closed with ErrorCode.CHANGED_SCOPE_BASELINE_REQUIRED
          and does not guess origin/main.
    - kind: test_function
      name: test_verify_default_fails_when_test_has_no_assertions
      source_scenario: A manifest's test imports and calls the declared artifact but
        has no assertion.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 1 and reports E210 missing assertions.
    - kind: test_function
      name: test_verify_duplicate_created_chain_warning_is_advisory_by_default
      source_scenario: A verify fixture has duplicate post-policy unsequenced created
        values.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: main(['verify', '--no-changed-scope']) passes by default and keeps
          the E119 advisory warning visible with the slug fallback message.
    - kind: test_function
      name: test_verify_explicit_default_equal_jobs_and_workers_remain_explicit
    - kind: test_function
      name: test_verify_explicit_pytest_workers_reaches_tests_stage_and_overrides_project_default
      description: Parses the CLI value and proves the same value reaches the actual
        repository/task tests-stage runner.
    - kind: test_function
      name: test_verify_file_tracking_passes_for_scope_only_source_file
      source_scenario: Default verify sees legitimate scope-only route wiring.
      actions:
      - type: api_call
        subject:
          function: main
      expected:
        behavior: Default file tracking passes while rendering the route in the scope-only
          bucket.
    - kind: test_function
      name: test_verify_ignores_pytest_fixture_helpers_named_like_tests
      source_scenario: A test file has a pytest fixture helper whose function name
        starts with `test_`.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 0 and does not emit E210 for the fixture helper.
    - kind: test_function
      name: test_verify_json_output_matches_without_shared_cache_except_durations
      source_scenario: The same tmp project runs verify with shared cache enabled
        and with the legacy cache behavior.
      actions:
      - type: api_call
        subject:
          export: _run_verify
      expected:
        behavior: The structured VerificationResult payloads match apart from duration
          fields.
    - kind: test_function
      name: test_verify_json_preserves_missing_assertion_details
      source_scenario: A caller requests JSON output for a strict missing-assertion
        failure.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: JSON output includes E210 code, severity, and test-file location
          in the behavioral stage details.
    - kind: test_function
      name: test_verify_json_reports_all_stage_statuses
      source_scenario: A caller requests JSON verification output.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: JSON output contains schema, behavioral, implementation, coherence,
          file_tracking, and tests stage objects.
    - kind: test_function
      name: test_verify_json_reports_pytest_config_addopts_integrity_error
      source_scenario: A caller requests JSON output when pytest project config injects
        selector addopts that bypass declared behavioral tests.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify --json exits 1 and JSON includes VALIDATE_COMMAND_DOES_NOT_RUN_TESTS
          in the tests stage details.
    - kind: test_function
      name: test_verify_json_worktree_scope_reports_structured_errors
      source_scenario: A git worktree has an out-of-scope changed production file
        and JSON output is requested.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: JSON output preserves the worktree-scope E114 code, location, and
          message details.
    - kind: test_function
      name: test_verify_legacy_manifest_warning_is_advisory_by_default
      source_scenario: A pre-strict manifest has a visible missing-assertion warning.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 0 while preserving the warning in output for historical
          cleanup.
    - kind: test_function
      name: test_verify_legacy_manifest_warning_is_quiet_by_default
      source_scenario: A verify fixture has a pre-policy created value plus an advisory
        missing-assertion warning.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: main(['verify', '--no-changed-scope']) still passes and reports
          the real missing-assertion warning without printing an E118 legacy-created
          warning.
    - kind: test_function
      name: test_verify_parser_accepts_test_jobs_option
      source_scenario: A user invokes the parser with `maid verify --test-jobs 4`.
      actions:
      - type: api_call
        subject:
          function: build_parser
      expected:
        behavior: The parsed namespace contains test_jobs=4 and verify stage flags
          still parse.
    - kind: test_function
      name: test_verify_parser_rejects_invalid_test_jobs_option
      source_scenario: A user invokes the parser with zero, negative, and non-integer
        test-jobs values.
      actions:
      - type: api_call
        subject:
          function: build_parser
      expected:
        behavior: The parser rejects invalid test-jobs values before command execution.
    - kind: test_function
      name: test_verify_passes_test_jobs_to_tests_stage
      source_scenario: '`maid verify --keep-going --test-jobs 3` reaches the tests
        stage.'
      actions:
      - type: api_call
        subject:
          function: _run_verify
      expected:
        behavior: The tests stage calls `run_tests` with jobs=3 while validation stages
          are unchanged.
    - kind: test_function
      name: test_verify_rejects_noop_validate_command_for_behavioral_tests
      source_scenario: A project has a valid manifest and behavioral test file, but
        validate is a no-op Python command.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 1 and reports the validate-command integrity error.
    - kind: test_function
      name: test_verify_rejects_pytest_config_collect_only
      source_scenario: A manifest targets the right pytest directory, but pytest config
        makes the command collect tests without executing them.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 1 and the tests stage reports the command-integrity
          failure.
    - kind: test_function
      name: test_verify_rejects_pytest_config_selector_deselecting_behavioral_test
      source_scenario: A manifest's declared behavioral test would fail, but pytest
        config selects only an unrelated passing test.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 1 instead of reporting PASS tests.
    - kind: test_function
      name: test_verify_returns_0_when_all_gates_pass
      source_scenario: A project has a valid manifest, coherent chain, no undeclared
        files, and passing validate commands.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 0 and reports every stage as passing.
    - kind: test_function
      name: test_verify_returns_1_when_behavioral_validation_fails
      source_scenario: Schema validation passes but behavioral validation fails because
        tests do not exercise the artifact.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 1 and identifies behavioral validation as the
          failing stage.
    - kind: test_function
      name: test_verify_returns_1_when_manifest_validate_command_fails
      source_scenario: Structural validation passes but the manifest validate command
        exits non-zero.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: maid verify exits 1 and includes the failing command result.
    - kind: test_function
      name: test_verify_reuses_validation_cache_across_behavioral_and_implementation_stages
      source_scenario: A verify run validates overlapping TypeScript source and test
        files in both stages.
      actions:
      - type: api_call
        subject:
          export: _run_verify
      expected:
        behavior: Counting validators or resolver hooks show fewer duplicate collections/resolutions
          across stages.
    - kind: test_function
      name: test_verify_shares_one_manifest_chain_across_stages
      source_scenario: maid verify runs validation, coherence, file tracking, worktree-scope,
        tests-stage integrity, and an in-process `maid validate <manifest>` test command
        on the same manifest directory.
      actions:
      - type: api_call
        subject:
          export: _run_verify
      expected:
        behavior: ManifestChain construction is observed exactly once across all verify
          stages and every stage still succeeds.
    - kind: test_function
      name: test_verify_validator_unavailable_warning_is_advisory_by_default
      source_scenario: A new manifest has an E307 no-validator warning for README.md.
      actions:
      - type: api_call
        subject:
          export: _warnings_are_blocking
      expected:
        behavior: The E307 warning is classified as advisory even for a new manifest
          so verify can keep it visible without failing the gate.
  - path: maid_runner/core/outcomes.py
    artifacts:
    - kind: attribute
      name: generated_from
      of: OutcomeIndex
      type: str
    - kind: attribute
      name: included_statuses
      of: OutcomeIndex
      type: tuple[str, ...]
    - kind: attribute
      name: manifest_dir
      of: OutcomeIndex
      type: str
    - kind: attribute
      name: project_root
      of: OutcomeIndex
      type: str
    - kind: attribute
      name: records
      of: OutcomeIndex
      type: tuple[OutcomeIndexRecord, ...]
    - kind: attribute
      name: schema_version
      of: OutcomeIndex
      type: str
    - kind: attribute
      name: agent
      description: Provenance carried from the manifest Outcome into the deterministic
        index; None for pre-provenance records and pre-provenance index files.
      of: OutcomeIndexRecord
      type: AgentProvenance | None
    - kind: attribute
      name: artifacts
      of: OutcomeIndexRecord
      type: tuple[str, ...]
    - kind: attribute
      name: completed_at
      of: OutcomeIndexRecord
      type: str | None
    - kind: attribute
      name: created
      of: OutcomeIndexRecord
      type: str | None
    - kind: attribute
      name: declared_paths
      of: OutcomeIndexRecord
      type: tuple[str, ...]
    - kind: attribute
      name: lessons
      of: OutcomeIndexRecord
      type: tuple[OutcomeLesson, ...]
    - kind: attribute
      name: lifecycle_status
      of: OutcomeIndexRecord
      type: str
    - kind: attribute
      name: manifest_path
      of: OutcomeIndexRecord
      type: str
    - kind: attribute
      name: manifest_slug
      of: OutcomeIndexRecord
      type: str
    - kind: attribute
      name: review_notes
      of: OutcomeIndexRecord
      type: tuple[OutcomeReviewNote, ...]
    - kind: attribute
      name: source_fingerprint
      of: OutcomeIndexRecord
      type: str
    - kind: attribute
      name: status
      of: OutcomeIndexRecord
      type: str
    - kind: attribute
      name: superseded_by
      of: OutcomeIndexRecord
      type: str | None
    - kind: attribute
      name: tags
      of: OutcomeIndexRecord
      type: tuple[str, ...]
    - kind: attribute
      name: task_type
      of: OutcomeIndexRecord
      type: str | None
    - kind: attribute
      name: validation_commands
      of: OutcomeIndexRecord
      type: tuple[tuple[str, ...], ...]
    - kind: attribute
      name: validation_evidence
      of: OutcomeIndexRecord
      type: tuple[OutcomeValidationEvidence, ...]
    - kind: class
      name: OutcomeIndex
      description: Versioned deterministic index of explicit manifest Outcome records.
    - kind: class
      name: OutcomeIndexRecord
      description: Stable, traceable index entry derived from one manifest Outcome
        record.
    - kind: function
      name: build_outcome_index
      args:
      - name: manifest_dir
        type: Union[str, Path]
      - name: project_root
        type: Union[str, Path]
        default: '''.'''
      - name: include_statuses
        type: Collection[str] | None
        default: None
      returns: OutcomeIndex
    - kind: function
      name: outcome_index_is_stale
      args:
      - name: index_path
        type: Union[str, Path]
      - name: manifest_dir
        type: Union[str, Path]
      - name: project_root
        type: Union[str, Path]
        default: '''.'''
      returns: bool
    - kind: function
      name: read_outcome_index
      args:
      - name: index_path
        type: Union[str, Path]
      returns: OutcomeIndex
    - kind: function
      name: write_outcome_index
      args:
      - name: index
        type: OutcomeIndex
      - name: output_path
        type: Union[str, Path]
      returns: None
  - path: maid_runner/cli/commands/learn.py
    artifacts:
    - kind: function
      name: cmd_learn
      description: After refreshing and writing the index, checks the sibling outcomes-digest.json
        via check_digest_freshness; prints a stderr advisory for stale/malformed (respecting
        --quiet), always includes an enrichment_digest {status, path} object in --json
        output, and never changes the exit code for digest states.
      args:
      - name: args
        type: argparse.Namespace
      returns: int
  - path: tests/core/test_outcomes.py
    artifacts:
    - kind: test_function
      name: test_build_outcome_index_excludes_inactive_lifecycle_manifests_by_default
      source_scenario: Manifests with completed Outcome status are marked planning,
        draft, archived, archive, epic, or legacy in lifecycle metadata.
      actions:
      - type: api_call
        subject:
          function: build_outcome_index
      expected:
        behavior: Inactive lifecycle manifests are excluded from the default learned
          index even when Outcome status is completed.
    - kind: test_function
      name: test_build_outcome_index_fails_for_malformed_outcome
      source_scenario: A manifest contains malformed Outcome data.
      actions:
      - type: api_call
        subject:
          function: build_outcome_index
      expected:
        behavior: The builder fails loudly with the manifest path instead of emitting
          a partial index.
    - kind: test_function
      name: test_build_outcome_index_include_statuses_replaces_default_filter
      source_scenario: A caller requests partial and failed Outcome statuses.
      actions:
      - type: api_call
        subject:
          function: build_outcome_index
      expected:
        behavior: Only the requested statuses are included; completed records are
          excluded unless completed was explicitly requested.
    - kind: test_function
      name: test_build_outcome_index_includes_completed_outcomes_by_default
      source_scenario: A fixture manifest directory contains completed and non-completed
        Outcome statuses.
      actions:
      - type: api_call
        subject:
          function: build_outcome_index
      expected:
        behavior: The returned index contains only completed records from active lifecycle
          manifests by default, with traceable manifest paths, task type, declared
          artifacts, validation evidence, and lifecycle metadata.
    - kind: test_function
      name: test_build_outcome_index_records_chain_supersession_metadata
      source_scenario: A completed Outcome manifest is superseded by a later manifest
        in the same chain.
      actions:
      - type: api_call
        subject:
          function: build_outcome_index
      expected:
        behavior: The index records chain supersession metadata through superseded_by
          instead of losing the relationship.
    - kind: test_function
      name: test_build_outcome_index_rejects_invalid_status_filters
      source_scenario: A caller requests typoed or unsupported Outcome statuses.
      actions:
      - type: api_call
        subject:
          function: build_outcome_index
      expected:
        behavior: The builder fails loudly with the invalid status values instead
          of returning an empty or partial index.
    - kind: test_function
      name: test_build_outcome_index_skips_inactive_manifest_directories_by_default
      source_scenario: A manifest directory contains inactive draft and v1 archive
        subdirectories.
      actions:
      - type: api_call
        subject:
          function: build_outcome_index
      expected:
        behavior: Inactive child manifest directories are skipped by default instead
          of breaking the active learned index.
    - kind: test_function
      name: test_outcome_index_detects_changed_and_missing_sources
      source_scenario: An index is written, then a source manifest changes or is removed.
      actions:
      - type: api_call
        subject:
          function: outcome_index_is_stale
      expected:
        behavior: Staleness detection flips for changed source fingerprints and for
          indexed source manifests that no longer exist.
    - kind: test_function
      name: test_outcome_index_detects_manifest_dir_and_project_root_mismatch
      source_scenario: An index written for one manifest directory or project root
        is checked against another source tree.
      actions:
      - type: api_call
        subject:
          function: outcome_index_is_stale
      expected:
        behavior: Staleness detection returns true when manifest_dir or project_root
          differs from the index metadata.
    - kind: test_function
      name: test_outcome_index_round_trips_with_byte_stable_source_fingerprint
      source_scenario: An index is written twice from unchanged source manifests.
      actions:
      - type: api_call
        subject:
          function: write_outcome_index
      expected:
        behavior: Typed records round-trip exactly and identical source data produces
          identical generated_from and JSON bytes.
    - kind: test_function
      name: test_outcome_index_staleness_detects_excluded_supersession_metadata_change
      source_scenario: A non-indexed manifest later supersedes an indexed Outcome
        source.
      actions:
      - type: api_call
        subject:
          function: outcome_index_is_stale
      expected:
        behavior: Staleness detection reports stale when derived supersession metadata
          changes even if indexed source fingerprints do not.
    - kind: test_function
      name: test_outcome_index_staleness_detects_new_status_from_original_filter
      source_scenario: An index is written with multiple explicit statuses and one
        status initially has no matching records.
      actions:
      - type: api_call
        subject:
          function: outcome_index_is_stale
      expected:
        behavior: Staleness detection reports stale when a new source appears for
          a status that belonged to the original filter.
    - kind: test_function
      name: test_outcome_index_staleness_preserves_index_status_filter
      source_scenario: An index is written with an explicit non-completed status filter.
      actions:
      - type: api_call
        subject:
          function: outcome_index_is_stale
      expected:
        behavior: Staleness detection checks the same status set represented by the
          existing index rather than defaulting back to completed records.
    - kind: test_function
      name: test_outcome_index_staleness_preserves_zero_record_status_filter
      source_scenario: An index is written with an explicit status filter that currently
        matches no records.
      actions:
      - type: api_call
        subject:
          function: outcome_index_is_stale
      expected:
        behavior: Staleness detection preserves the stored status filter even when
          the index has zero records.
    - kind: test_function
      name: test_read_outcome_index_fails_for_malformed_index_data
      source_scenario: A previously written index file is malformed or uses the wrong
        schema version.
      actions:
      - type: api_call
        subject:
          function: read_outcome_index
      expected:
        behavior: The reader fails loudly with the index path instead of returning
          partial or placeholder records.
    - kind: test_function
      name: test_read_outcome_index_fails_for_unsupported_record_status
      source_scenario: A previously written index contains an unsupported Outcome
        status.
      actions:
      - type: api_call
        subject:
          function: read_outcome_index
      expected:
        behavior: The reader fails loudly instead of accepting semantically malformed
          status data.
  - path: tests/cli/test_learn_cmd.py
    artifacts:
    - kind: test_function
      name: test_cmd_learn_include_status_replaces_completed_default
      source_scenario: '`cmd_learn` receives include-status values for failed and
        partial outcomes.'
      actions:
      - type: api_call
        subject:
          function: cmd_learn
      expected:
        behavior: The command indexes only the explicitly requested statuses and reports
          completed records as skipped.
    - kind: test_function
      name: test_cmd_learn_rejects_invalid_include_status
      source_scenario: '`cmd_learn` receives an unsupported include-status value.'
      actions:
      - type: api_call
        subject:
          function: cmd_learn
      expected:
        behavior: The command returns nonzero and prints the invalid status instead
          of writing an empty or misleading index.
    - kind: test_function
      name: test_cmd_learn_returns_nonzero_for_malformed_existing_index
      source_scenario: '`cmd_learn` is asked to refresh an output path that already
        contains malformed index data.'
      actions:
      - type: api_call
        subject:
          function: cmd_learn
      expected:
        behavior: The command returns nonzero rather than silently replacing malformed
          existing index data.
    - kind: test_function
