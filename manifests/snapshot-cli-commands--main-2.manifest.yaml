      source_scenario: A TypeScript source imports ../models/Budget.ts while the manifest
        requires src/models/Budget.
      actions:
      - type: api_call
        subject:
          export: ValidationEngine
      expected:
        behavior: Implementation validation reports no ErrorCode.MISSING_REQUIRED_IMPORT
          errors.
    - kind: test_function
      name: test_typescript_relative_required_import_skips_compiler_bridge
      source_scenario: A TypeScript implementation satisfies a required import with
        a relative import.
      actions:
      - type: api_call
        subject:
          export: ValidationEngine
      expected:
        behavior: Implementation validation reports no ErrorCode.MISSING_REQUIRED_IMPORT
          errors and does not invoke the compiler bridge.
    - kind: test_function
      name: test_typescript_required_import_accepts_package_barrel_reexport_target
      source_scenario: A TypeScript implementation imports a binding from a package-style
        barrel whose re-export target is the required import.
      actions:
      - type: api_call
        subject:
          export: ValidationEngine
      expected:
        behavior: Implementation validation reports no ErrorCode.MISSING_REQUIRED_IMPORT
          errors.
    - kind: test_function
      name: test_typescript_required_import_rejects_aliased_different_barrel_binding
      source_scenario: A TypeScript implementation aliases a different package barrel
        export to the required target's local name.
      actions:
      - type: api_call
        subject:
          export: ValidationEngine
      expected:
        behavior: Implementation validation reports ErrorCode.MISSING_REQUIRED_IMPORT
          for the required barrel target.
    - kind: test_function
      name: test_typescript_required_import_rejects_unimported_package_barrel_reexport_target
      source_scenario: A TypeScript implementation imports a different binding from
        a package barrel while the required target binding is imported from an unrelated
        package.
      actions:
      - type: api_call
        subject:
          export: ValidationEngine
      expected:
        behavior: Implementation validation reports ErrorCode.MISSING_REQUIRED_IMPORT
          for the unimported barrel target.
    - kind: test_function
      name: test_typescript_required_import_resolves_only_relevant_unresolved_bare_import
      source_scenario: A TypeScript implementation imports unrelated bare packages
        plus one unresolved alias needed by a required import.
      actions:
      - type: api_call
        subject:
          export: ValidationEngine
      expected:
        behavior: Implementation validation invokes compiler-backed resolution only
          for the relevant unresolved alias and reports no ErrorCode.MISSING_REQUIRED_IMPORT
          errors.
    - kind: test_function
      name: test_typescript_required_import_skips_compiler_when_bare_import_already_matches
      source_scenario: A TypeScript implementation imports several bare packages and
        the required import already matches one collected bare import.
      actions:
      - type: api_call
        subject:
          export: ValidationEngine
      expected:
        behavior: Implementation validation reports no ErrorCode.MISSING_REQUIRED_IMPORT
          errors and does not invoke compiler-backed resolution.
    - kind: test_function
      name: test_typescript_root_relative_escape_does_not_satisfy_project_local_import
      source_scenario: A root-level TypeScript file imports ../outside/module while
        the manifest requires outside/module.
      actions:
      - type: api_call
        subject:
          export: ValidationEngine
      expected:
        behavior: Implementation validation reports ErrorCode.MISSING_REQUIRED_IMPORT
