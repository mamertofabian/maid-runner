      name: errors
      description: Blocking changed-scope findings (including E115 when the baseline
        is required), empty when the stage passes or skips.
      of: ChangedScopeDecision
      type: tuple[ValidationError, ...]
    - kind: attribute
      name: skip_reason
      description: Human-readable reason the gate was skipped (no resolvable baseline
        on a clean tree), None whenever the gate ran or must fail closed.
      of: ChangedScopeDecision
      type: Optional[str]
    - kind: class
      name: BaselineDeclaration
      description: One active manifest's declared changed-scope baseline, as considered
        by resolve_changed_scope_baseline, so callers can report which manifests disagree.
    - kind: class
      name: ChangedScopeBaseline
      description: Immutable value object describing the resolved changed-scope baseline
        source and commit-ish.
    - kind: class
      name: ChangedScopeDecision
      description: 'Frozen dataclass result of changed-scope evaluation: blocking
        errors plus an optional visible-skip reason; exactly one of (errors, skip_reason)
        is populated when the gate cannot run.'
    - kind: function
      name: changed_files
      description: Return git-reported changed file paths relative to the project
        root.
      args:
      - name: project_root
        type: Union[str, Path]
      returns: tuple[str, ...]
    - kind: function
      name: changed_files_since
      description: 'Return git paths changed between the resolved baseline and the
        current working tree, including committed, staged, and unstaged changes under
        the project root.

        '
      args:
      - name: project_root
        type: Union[str, Path]
      - name: baseline
        type: ChangedScopeBaseline
      returns: tuple[str, ...]
    - kind: function
      name: describe_changed_scope_baselines
      description: Return the baseline declarations resolution actually considered,
        ordered by manifest path, and an empty tuple when no considered manifest declares
        a baseline. Must apply 067-07's worktree-scoping rule by sharing _baseline_metadata_manifests
        rather than re-deriving it, so the reported cause cannot drift from the resolution
        that raised.
      args:
      - name: chain
        type: ManifestChain
      returns: tuple[BaselineDeclaration, ...]
    - kind: function
      name: evaluate_changed_scope
      description: Reports committed .cs, .cshtml, .razor, and .resx paths outside
        active writable scope when evaluating an explicit task baseline.
      args:
      - name: project_root
        type: Union[str, Path]
      - name: chain
        type: ManifestChain
      - name: since
        type: Optional[str]
        default: None
      - name: base_ref
        type: Optional[str]
        default: None
      - name: include_tests
        type: bool
        default: 'False'
      - name: allow_clean_tree_skip
        type: bool
        default: 'False'
      returns: ChangedScopeDecision
    - kind: function
      name: resolve_changed_scope_baseline
      description: Metadata baselines are sourced only from active manifests with
        uncommitted worktree changes; committed historical declarations are ignored,
        conflicts among considered manifests stay INVALID, and git failures keep chain-wide
        behavior.
      args:
      - name: chain
        type: ManifestChain
      - name: since
        type: Optional[str]
        default: None
      - name: base_ref
        type: Optional[str]
        default: None
      returns: ChangedScopeBaseline
    - kind: function
      name: validate_changed_scope
      args:
      - name: project_root
        type: Union[str, Path]
      - name: chain
        type: ManifestChain
      - name: since
        type: Optional[str]
        default: None
      - name: base_ref
        type: Optional[str]
        default: None
      - name: include_tests
        type: bool
        default: 'False'
      returns: list[ValidationError]
    - kind: function
      name: validate_worktree_scope
      description: Applies the same .NET production-path ownership policy to staged,
        unstaged, and untracked worktree changes.
      args:
      - name: project_root
        type: Union[str, Path]
      - name: chain
        type: ManifestChain
      - name: include_tests
        type: bool
        default: 'False'
      returns: list[ValidationError]
