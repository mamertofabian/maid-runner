    - kind: class
      name: RunComparisonRow
      description: 'Frozen dataclass: per-agent-group aggregate counts over RunEvaluations;
        the (None, None, None) group is the explicit unknown-agent bucket.'
    - kind: class
      name: RunEvaluation
      description: 'Frozen dataclass: the complete deterministic after-action evaluation
        of one manifest run; fields per the pinned list in the description.'
    - kind: class
      name: RunFinding
      description: 'Frozen dataclass: one evidence-cited evaluation finding; warnings
        and attention findings must cite at least one evidence pointer.'
    - kind: function
      name: compare_runs
      description: Pure aggregation grouped by (provider, model, client) including
        the explicit unknown bucket; deterministic order runs desc then model asc;
        empty input yields empty tuple.
      args:
      - name: evaluations
        type: Sequence[RunEvaluation]
      returns: tuple[RunComparisonRow, ...]
    - kind: function
      name: evaluate_run
      description: 'Read-only after-action evaluation: loads manifest, plan lock,
        and incidents; classifies revisions from deltas; corroborates outcome claims
        by command matching; reports missing evidence explicitly. Raises on missing/unparseable
        manifest (fail loud); degrades honestly on missing lock/outcome.'
      args:
      - name: manifest_path
        type: Path
