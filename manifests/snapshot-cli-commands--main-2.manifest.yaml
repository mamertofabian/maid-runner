  - path: tests/cli/test_verify_task_scoped_file_tracking.py
    artifacts:
    - kind: test_function
      name: test_filter_file_tracking_report_keeps_only_normalized_task_paths
      source_scenario: A full file-tracking report contains historical, registered,
        and tracked entries with metadata, while the task path set uses mixed path
        separators and reversed membership order.
      actions:
      - type: api_call
        subject:
          export: filter_file_tracking_report
      expected:
        behavior: The pure helper normalizes paths, preserves original deterministic
          report order plus status/manifests/issues metadata, and returns only task
          entries.
    - kind: test_function
      name: test_readme_documents_task_scoped_file_tracking_recipe
      source_scenario: A user consults the README for the supported incremental brownfield
        verification command.
      actions:
      - type: api_call
        subject:
          export: Path
      expected:
        behavior: The README gives the explicit --file-tracking-scope task recipe,
          states repository-wide tracking remains default, and points to maid files
          for the full repository inventory.
    - kind: test_function
      name: test_repository_file_tracking_remains_strict_by_default
      source_scenario: A brownfield repository contains an untouched historical undeclared
        source file and one changed manifest-covered source file; verify receives
        an explicit baseline but not the new scope selector.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: Default verify still fails repository-wide file_tracking and reports
          the historical undeclared source path, proving baseline flags alone do not
          activate task mode.
    - kind: test_function
      name: test_task_scoped_file_tracking_accepts_explicit_base_ref
      source_scenario: A clean repository has a covered change committed after the
        supplied --base-ref.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: Task-scoped file tracking resolves the merge-base, includes the
          committed covered source, and passes without reporting historical inventory.
    - kind: test_function
      name: test_task_scoped_file_tracking_accepts_manifest_metadata_baseline
      source_scenario: The active manifest declares metadata.maid_task_base and verify
        requests task file tracking without a baseline CLI flag.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: Task-scoped file tracking resolves the manifest baseline, includes
          the covered source change, and passes.
    - kind: test_function
      name: test_task_scoped_file_tracking_blocks_changed_read_only_production_file
      source_scenario: A new task-window production file is declared only under files.read
        while historical undeclared inventory also exists.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: Task-scoped verify fails file_tracking with the changed path in
          the registered bucket and does not report untouched historical undeclared
          inventory.
    - kind: test_function
      name: test_task_scoped_file_tracking_blocks_new_undeclared_source_even_when_changed_scope_is_disabled
      source_scenario: Task-scoped file tracking sees a newly added undeclared source
        file while verify is passed both --no-changed-scope and --advisory.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: Verify fails file_tracking on the new uncovered source, proving
          task tracking is independent from changed_scope and warning advisory policy,
          while ignoring untouched historical inventory.
    - kind: test_function
      name: test_task_scoped_file_tracking_fails_closed_without_resolvable_baseline
      source_scenario: Verify explicitly requests task-scoped file tracking without
        --since, --base-ref, or metadata.maid_task_base.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: The file_tracking stage fails with E115 instead of guessing a branch
          or treating an empty path set as success.
    - kind: test_function
      name: test_task_scoped_file_tracking_ignores_untouched_historical_inventory
      source_scenario: The same repository commits the covered source edit after the
        baseline, has a clean worktree, and runs verify with --file-tracking-scope
        task plus --since.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: Verify uses baseline history rather than worktree-only changes,
          passes file_tracking, reports the committed covered source as tracked, and
          ignores the untouched historical path.
    - kind: test_function
      name: test_task_scoped_file_tracking_reports_invalid_explicit_baseline
      source_scenario: Verify requests task file tracking with a --since commit-ish
        that git cannot resolve.
      actions:
      - type: api_call
        subject:
          export: main
      expected:
        behavior: The file_tracking stage fails with E116 instead of falling back
          to worktree-only or repository-wide behavior.
