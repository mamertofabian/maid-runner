      description: Preserves the existing deterministic version-1 packet payload contract.
      args:
      - name: command
        type: list[str]
      - name: exit_code
        type: int
      - name: project_root
        type: Union[str, Path]
      - name: validation
        type: BatchValidationResult | ValidationResult | VerificationResult
      - name: test_results
        type: BatchTestResult | None
        default: None
      returns: dict
    - kind: function
      name: clear_failure_packet
      description: Logically clears only a recognizable MAID packet through the verified
        file descriptor, returns False for a missing path, and refuses arbitrary files,
        directories, symlinks, hard links, and raced pathname replacements without
        modifying the colliding path.
      args:
      - name: path
        type: Union[str, Path]
      returns: bool
    - kind: function
      name: write_failure_packet
      description: Creates a missing packet or replaces a recognizable MAID packet,
        using exclusive creation or the already-verified file descriptor; refuses
        arbitrary files, directories, symlinks, hard links, and raced pathname replacements
        without modifying the colliding path.
      args:
      - name: packet
        type: dict
      - name: path
        type: Union[str, Path]
      returns: None
