        Boolean false exit code, and a missing output tail.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: Only the fully shaped command with an exact integer zero exit code
          is preservable; Boolean and incomplete command payloads are rejected.
  edit:
  - path: maid_runner/cli/commands/_format.py
    artifacts:
    - kind: function
      name: format_batch_result
      description: Format batch validation summaries and failure details, including
        available validation error context in normal text mode.
      args:
      - name: result
        type: BatchValidationResult
      returns: str
    - kind: function
      name: format_bootstrap_report
      args:
      - name: report
        type: BootstrapReport
      returns: str
    - kind: function
      name: format_chain_log
      args:
      - name: manifests
        type: list
      - name: manifest_dir
        type: str
      - name: json_mode
        type: bool
      - name: active_only
        type: bool
      returns: str
    - kind: function
      name: format_chain_merge_apply_result
      description: Render an applied or refused chain-merge materialization result
        as text or JSON.
      args:
      - name: result
        type: ChainMergeApplyResult
      - name: json_mode
        type: bool
        default: 'False'
      returns: str
    - kind: function
      name: format_chain_merge_equivalence_result
      description: Render one deterministic text or JSON equivalence result, including
        E715 diagnostics and categorized artifact regressions.
      args:
      - name: result
        type: MergeEquivalenceResult
      - name: json_mode
        type: bool
        default: 'False'
      returns: str
    - kind: function
      name: format_chain_merge_report
      description: Render one chain-merge report as deterministic text or a single
        JSON document.
      args:
      - name: report
        type: ChainMergeReport
      - name: json_mode
        type: bool
        default: 'False'
      returns: str
    - kind: function
      name: format_chain_merge_summary
      description: Render the repository-wide chain-merge sweep summary as text or
        JSON.
      args:
      - name: summary
        type: ChainMergeSweepSummary
      - name: json_mode
        type: bool
        default: 'False'
      returns: str
    - kind: function
      name: format_coherence_result
      args:
      - name: result
        type: CoherenceResult
      returns: str
    - kind: function
      name: format_file_tracking
      description: Renders scope-only paths separately in direct and verify text/JSON
        output.
      args:
      - name: report
        type: FileTrackingReport
      - name: json_mode
        type: bool
        default: 'False'
      - name: hide_private
        type: bool
        default: 'False'
      returns: str
    - kind: function
      name: format_manifests_list
      args:
      - name: manifests
        type: list
      - name: file_path
        type: str
      returns: str
    - kind: function
      name: format_replay_result
      args:
      - name: result
        type: dict
      - name: json_mode
        type: bool
      returns: str
    - kind: function
      name: format_supersession_audit
      args:
      - name: violations
        type: list[SupersessionViolation]
      - name: grandfathered_count
        type: int
      - name: sealed_at
        type: Optional[str]
      - name: json_mode
        type: bool
      returns: str
    - kind: function
      name: format_test_result
      description: Renders identical test results plus deterministic scheduling notices
        in text and JSON.
      args:
      - name: result
        type: BatchTestResult
      - name: verbose
        type: bool
        default: 'False'
      - name: json_mode
        type: bool
        default: 'False'
      returns: str
    - kind: function
      name: format_validation_result
      description: Validation formatter includes artifact-coverage report details
        in text and JSON output when the opt-in gate is requested.
      args:
      - name: result
        type: ValidationResult
      - name: json_mode
        type: bool
        default: 'False'
      - name: quiet
        type: bool
        default: 'False'
      - name: test_result
        type: BatchTestResult | None
        default: None
      - name: tests_requested
        type: bool
        default: 'False'
      - name: artifact_coverage_report
        type: ArtifactCoverageReport | None
        default: None
      returns: str
    - kind: function
      name: format_verify_result
      description: Renders skipped stages as 'SKIPPED <name>' lines with the reason
        in text mode and exposes skip_reason on stage entries in JSON mode.
      args:
      - name: result
        type: VerificationResult
      - name: json_mode
        type: bool
      returns: str
    - kind: function
      name: format_verify_summary
      description: Render grouped E701 recovery once in summary text or JSON while
        leaving every blocking diagnostic and non-summary output intact.
      args:
      - name: result
        type: VerificationResult
      - name: json_mode
        type: bool
        default: 'False'
      returns: str
    - kind: function
      name: print_error
      args:
      - name: message
        type: str
      returns: None
  - path: maid_runner/cli/commands/validate.py
    artifacts:
    - kind: function
      name: cmd_validate
      description: Treat an inherited private strict-preview execution context as
        strict assertion, stub, and warning policy without recursively re-entering
        artifact coverage, and propagate that context only while running strict artifact
        coverage, including the strict side of strict-delta.
      args:
      - name: args
        type: argparse.Namespace
      returns: int
    - kind: function
      name: run_coherence
      description: Public command helper that runs coherence once and returns the
        result used by validate output and exit status.
      args:
      - name: manifest_dir
        type: str
      - name: json_mode
        type: bool
      returns: CoherenceResult
    - kind: function
      name: run_validate_commands_for_result
      description: Command helper that runs manifest validate commands after structural
        validation succeeds.
      args:
      - name: manifest_path
        type: str
      - name: fail_fast
        type: bool
        default: 'False'
      returns: BatchTestResult
