    - kind: test_function
      name: test_nested_subcommand_option_abbreviation_rejected
      source_scenario: Prefix spellings are passed to nested subcommand families,
        e.g. `plan lock <manifest> --no-r` and `manifest create <file> --goal <goal>
        --dry`.
      actions:
      - type: api_call
        subject:
          export: build_parser
      expected:
        behavior: Nested parsers inherit the no-abbreviation behavior and exit with
          SystemExit code 2.
    - kind: test_function
      name: test_parser_exposes_verify_advisory_opt_out
