      type: str
    - kind: class
      name: DigestEntry
      description: 'Frozen dataclass: one recurring-lesson retrospective entry grounded
        in real lessons.'
    - kind: class
      name: DigestFreshness
      description: 'Frozen dataclass: the never-raising freshness assessment of an
        enrichment digest file against a given Outcome index.'
    - kind: class
      name: DigestQualityWarning
      description: 'Frozen dataclass: one advisory, non-blocking quality finding about
        a digest''s collapse/coverage/recurrence.'
    - kind: class
      name: EnrichmentDigest
      description: 'Frozen dataclass: the advisory enrichment artifact (theme map
        + recurring-lessons digest) with provenance.'
    - kind: class
      name: EnrichmentRequest
      description: 'Frozen dataclass: the deterministic prompt/corpus payload plus
        the validation universe for one enrichment generation.'
    - kind: class
      name: EnrichmentTheme
      description: 'Frozen dataclass: one canonical theme grouping several fragmented
        lesson_types.'
    - kind: class
      name: HypothesisEntry
      description: 'Frozen dataclass: one grounded forward-looking suggestion derived
        from cited past lessons.'
    - kind: class
      name: LessonRef
      description: 'Frozen dataclass: a stable reference to a source lesson by manifest
        slug and lesson_type, used to ground digest entries in real index lessons.'
    - kind: function
      name: apply_theme_map
      description: Deterministically re-aggregate the index lesson_types into canonical-theme
        buckets using the validated theme map, passing unmapped lesson_types through
        under their original key, with no generated narrative.
      args:
      - name: index
        type: OutcomeIndex
      - name: digest
        type: EnrichmentDigest
      returns: tuple[OutcomeInsightGroup, ...]
    - kind: function
      name: assess_digest_quality
      description: Deterministically assess digest quality against bounded named thresholds
        (lesson_type coverage, singleton-theme share, sources per digest entry) and
        return advisory warnings. Never raises; does not alter anti-fabrication validation.
      args:
      - name: digest
        type: EnrichmentDigest
      - name: index
        type: OutcomeIndex
      returns: tuple[DigestQualityWarning, ...]
    - kind: function
      name: build_enrichment_request
      description: System prompt additionally invites zero to five improvement_hypotheses,
        each grounded in at least two cited lessons from at least two manifests, with
        proposing nothing as an explicitly valid outcome.
      args:
      - name: index
        type: OutcomeIndex
      returns: EnrichmentRequest
    - kind: function
      name: check_digest_freshness
      description: 'Deterministic, never-raising freshness check: missing file, malformed
        digest, stale source_generated_from mismatch via digest_is_stale, or fresh.
        Does not perform deep structural validation against the index.'
      args:
      - name: index
        type: OutcomeIndex
      - name: digest_path
        type: Union[str, Path]
      returns: DigestFreshness
    - kind: function
      name: digest_is_stale
      description: Return True when the digest source_generated_from no longer matches
        the index generated_from fingerprint.
      args:
      - name: digest
        type: EnrichmentDigest
      - name: index
        type: OutcomeIndex
      returns: bool
    - kind: function
      name: enrichment_digest_from_dict
      description: Parses the optional improvement_hypotheses list, defaulting to
        empty when absent, with the existing strict type errors for malformed items.
      args:
      - name: data
        type: dict
      returns: EnrichmentDigest
    - kind: function
      name: enrichment_digest_to_dict
      description: Emits improvement_hypotheses only when non-empty, keeping legacy
        digest JSON byte-stable through a read-write round trip.
      args:
      - name: digest
        type: EnrichmentDigest
      returns: dict
    - kind: function
      name: read_enrichment_digest
      description: Load and structurally parse an EnrichmentDigest from a JSON file.
      args:
      - name: digest_path
        type: Union[str, Path]
      returns: EnrichmentDigest
    - kind: function
      name: render_digest_markdown
      description: Renders an 'Improvement Hypotheses (advisory)' section with a disclaimer
        line and per-hypothesis citations; the section is omitted entirely when no
        hypotheses exist.
      args:
      - name: digest
        type: EnrichmentDigest
      returns: str
    - kind: function
      name: theme_map_from_digest
      description: Deterministic lesson_type-to-canonical-theme mapping derived from
        the digest's themes; the shared seam reused by apply_theme_map and recall
        annotation. Unmapped lesson_types are simply absent.
      args:
      - name: digest
        type: EnrichmentDigest
      returns: dict[str, str]
    - kind: function
      name: validate_enrichment_digest
      description: 'Additionally enforces hypothesis grounding: co-occurring citations,
        minimum two lessons from two distinct manifests, and non-blank summaries,
        as hard ValueErrors.'
      args:
      - name: digest
        type: EnrichmentDigest
      - name: index
        type: OutcomeIndex
      returns: None
    - kind: function
      name: validate_enrichment_theme_map
      description: Validates only the deterministic theme-map surface used by insights
        and recall, deliberately ignoring advisory improvement_hypotheses.
      args:
      - name: digest
