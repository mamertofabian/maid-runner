        --manifest-dir`, `plan lock --no-run`, `test --manifest`.'
      actions:
      - type: api_call
        subject:
          export: build_parser
      expected:
        behavior: Full spellings parse to the same namespace values as before; disabling
          abbreviation does not change registered options.
    - kind: test_function
