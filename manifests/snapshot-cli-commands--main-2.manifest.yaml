      name: summary
      description: Short synthesized description of the theme.
      of: EnrichmentTheme
      type: str
    - kind: attribute
      name: source_lessons
      description: Grounding citations; at least two lessons from at least two distinct
        manifests, each co-occurring in the index.
      of: HypothesisEntry
      type: tuple[LessonRef, ...]
    - kind: attribute
      name: summary
      description: The improvement hypothesis prose; must be non-blank.
      of: HypothesisEntry
      type: str
    - kind: attribute
