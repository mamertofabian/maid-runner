      description: Stable unique id such as 'revision-2', 'outcome-lesson-1', 'finding-3',
        'diff'.
      of: ReviewEvidenceItem
      type: str
    - kind: attribute
      name: kind
      description: Item kind, e.g. 'revision', 'outcome-lesson', 'review-note', 'finding',
        'diff'.
      of: ReviewEvidenceItem
      type: str
    - kind: attribute
      name: text
      description: The evidence text shown to the model and inlined when cited in
        rendered output.
      of: ReviewEvidenceItem
      type: str
    - kind: attribute
      name: evaluation
      description: The serialized deterministic RunEvaluation the review must stay
        consistent with.
      of: ReviewRequest
      type: dict
    - kind: attribute
      name: evidence_items
      description: All citable evidence; ids outside this list are fabrication.
      of: ReviewRequest
      type: tuple[ReviewEvidenceItem, ...]
    - kind: attribute
      name: instructions
      description: 'Model instructions: cite evidence ids, state absence as absence,
        allowed severities info/warning/attention, required confidence low/medium/high.'
      of: ReviewRequest
      type: str
    - kind: attribute
      name: manifest_slug
      description: Slug of the run under review.
      of: ReviewRequest
      type: str
    - kind: attribute
      name: schema_version
      description: Request schema version for forward compatibility.
      of: ReviewRequest
      type: str
    - kind: class
      name: ReviewEvidenceItem
      description: 'Frozen dataclass: one citable fact in a review request; the universe
        of citable evidence is exactly the item list.'
    - kind: class
      name: ReviewRequest
      description: 'Frozen dataclass: the complete deterministic prompt packet for
        one run review, embedding the anti-fabrication instruction contract.'
    - kind: function
      name: build_review_request
      description: Itemizes revisions (reasons plus deltas), outcome lessons and review
        notes, and evaluation findings with stable ids; includes the diff item only
        when supplied and records its absence in the request otherwise.
      args:
      - name: evaluation
        type: RunEvaluation
      - name: manifest
        type: Manifest
      - name: lock_payload
        type: Optional[dict]
      - name: diff_text
        type: Optional[str]
      returns: ReviewRequest
    - kind: function
      name: render_run_review
      description: Markdown starting with the mandatory LLM-generated-advisory label,
        deterministic counts first, findings with cited evidence inlined; only called
        with validated input (render path fails closed).
      args:
      - name: review_data
        type: dict
      - name: request
        type: ReviewRequest
      returns: str
    - kind: function
      name: validate_run_review
      description: 'Exhaustive anti-fabrication errors: unknown/missing citations,
        invalid severity or confidence, unknown top-level keys, and file paths in
        finding text absent from all evidence texts; empty list means valid.'
      args:
      - name: review_data
        type: dict
      - name: request
        type: ReviewRequest
      returns: list[str]
