  - path: tools/maid_loop_core.py
    artifacts:
    - kind: attribute
      name: files
      of: CommitPacket
      type: list[str]
    - kind: attribute
      name: message
      of: CommitPacket
      type: str
    - kind: attribute
      name: attempts
      of: RetryLoopResult
      type: int
    - kind: attribute
      name: escalated
      of: RetryLoopResult
      type: bool
    - kind: attribute
      name: final_packet
      of: RetryLoopResult
      type: dict | None
    - kind: attribute
      name: success
      of: RetryLoopResult
      type: bool
    - kind: class
      name: CommitPacket
      description: Parsed READY commit message and exact file list, shared by both
        loop tools.
    - kind: class
      name: RetryLoopResult
      description: 'Outcome of a bounded retry loop run: attempts used, success, escalation,
        and the final failure packet if any.'
    - kind: function
      name: ask_commit_approval
      description: Require a per-pass typed approval before committing a READY packet.
      args:
      - name: pass_number
        type: int
      - name: status
        type: str
      returns: bool
    - kind: function
      name: commit_ready_changes
      description: Stage and commit a READY packet after approval.
      args:
      - name: packet
        type: CommitPacket
      - name: root
        type: Path
      returns: int
    - kind: function
      name: find_implementable_drafts
      description: Return sorted non-epic draft MAID manifests that remain to be implemented.
      args:
      - name: draft_dir
        type: Path
      returns: list[Path]
    - kind: function
      name: git_status_short
      description: Return `git status --short` output for worktree preflight.
      args:
      - name: root
        type: Path
      returns: str
    - kind: function
      name: parse_automation_status
      description: Extract the final AUTOMATION_STATUS marker from an agent's final
        message.
      args:
      - name: final_message
        type: str
      returns: str | None
    - kind: function
      name: parse_commit_packet
      description: Extract the commit message and explicit file list from a READY
        final message; last complete packet wins.
      args:
      - name: final_message
        type: str
      returns: CommitPacket | None
    - kind: function
      name: read_failure_packet
      description: Read and parse the failure packet JSON written by a failed gate
        run; return None for a missing or unreadable packet.
      args:
      - name: path
        type: Union[str, Path]
      returns: dict | None
    - kind: function
      name: run_bounded_retry_loop
      description: 'Drive the documented loop contract: run gate, on failure read
        packet and hand it to the next attempt, re-run, stop and escalate with the
        final packet after max_attempts.'
      args:
      - name: run_gate
        type: Callable[[], int]
      - name: run_attempt
        type: Callable[[dict | None], str]
      - name: packet_path
        type: Union[str, Path]
      - name: max_attempts
        type: int
        default: '5'
      returns: RetryLoopResult
    - kind: function
      name: stage_commit_packet_files
      description: Stage the exact existing or tracked-deleted files named by a READY
        packet; refuse absolute or parent-relative paths.
      args:
      - name: files
        type: list[str]
      - name: root
        type: Path
      returns: int
  - path: tests/ci/test_maid_loop_core.py
    artifacts:
    - kind: test_function
