        type: Sequence[str]
      - name: worker_id
        type: str
      returns: AbstractContextManager[KnockoutProjectSnapshot]
    - kind: method
      name: create
      description: Yield an isolated project snapshot whose VIRTUAL_ENV and NODE_PATH
        point at the source dependency environments rather than copied trees.
      of: SharedEnvironmentProjectSnapshotBackend
      args:
      - name: project_root
        type: Path
      - name: required_paths
        type: Sequence[str]
      - name: worker_id
