  rationale: >-
    The pinned tree-sitter grammar produces bounded false-positive ERROR nodes
    for nested properties such as `in_reply_to`. MAID now replaces only the
    leading two bytes of exact matching error spans for a parser-only retry and
    adopts the retry only when it strictly reduces errors. Original bytes stay
    authoritative for collectors, avoiding generated-source edits and broad
    parse-error suppression.
  lessons:
