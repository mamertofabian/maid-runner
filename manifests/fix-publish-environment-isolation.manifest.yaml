    - command: [uv, run, python, -m, pytest, -q, tests/ci/test_publish_environment_isolation.py, tests/ci/test_publish_workflow.py, tests/core/test_knockout_snapshot.py, tests/core/test_artifact_coverage_fallback_workers.py, tests/core/test_knockout_snapshot_template.py, tests/ci/test_maid_workflow_environment_isolation.py, tests/ci/test_github_pytest_worker_wiring.py, tests/ci/test_maid_workflow_pr_only_triggers.py]
      status: passed
      summary: 65 tests passed on each actual Python 3.10.16, 3.11.15 and 3.12.8 with job-equivalent uv selection and outer cache prefixes.
    - command: [uv, run, maid, validate, --packet]
      status: passed
