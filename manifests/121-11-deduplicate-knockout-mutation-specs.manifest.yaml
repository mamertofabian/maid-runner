    - command: [uv, run, maid, validate, --quiet]
      status: passed
      summary: "Repository-wide manifest validation passed before the raw-byte-only review correction; focused implementation validation passed afterward."
    - command: [uv, run, maid, test, --json]
      status: passed
      summary: "All 255 active manifest test command groups passed before the raw-byte-only review correction; the affected 28-test scope was rerun afterward."
    - command: [uv, run, python, -c, "build current active knockout mutation inventory"]
      status: passed
      summary: "Built 601 unique specs from 1,149 declarations across 425 active manifests in 1.47s."
    - command: [uv, run, ruff, check, maid_runner/core/knockout.py, tests/core/test_knockout_batch.py]
      status: passed
      summary: "Focused Ruff, Black, and git diff checks passed after the final review fix."
