  Include files.scope semantic tests in plan-lock hashing via an explicit discovery
  opt-in, preserving shared runner-command completeness semantics. Adapt the historical
  non-semantic fixture to a custom-runner class and refresh its shared dependent locks
  through sanctioned explicit preservation with unchanged commands. No new dotted-unittest
  support or command-policy changes.
temptations:
- risk: Treat the reported protect unittest and django test classes regardless of
    their class-name prefix scenario as a reason to bypass existing validation.
  instead: Recognize actual unittest/Django TestCase conventions with bounded base/import
    handling; retain pytest class semantics. Include scope-listed behavioral files
    without treating every scope file as a test. Exercise real lock creation and E701
    enforcement, direct and dotted Django targets. Do not add arbitrary dotted unittest
    selector support in this fix.
- risk: Use private-helper assertions that pass while the downstream failure remains.
  instead: Exercise find_command_integrity_test_files, is_python_behavioral_test_file
    through the named regression scenarios, including the negative cases, before locking
    this draft.
