      status: passed
      summary: All 11 task-scoped deep verification stages passed; advisory E307 warnings concerned an unrelated CJS file and non-code files.
    - command: [uv, run, ruff, check, maid_runner/core/_file_discovery.py, maid_runner/core/_test_runner_invocation.py, tests/core/test_solidity_foundry_discovery.py, tests/core/validation/test_foundry_test_runner.py]
      status: passed
      summary: Ruff reported no issues in the changed code and tests.
    - command: [uv, run, black, --check, maid_runner/core/_file_discovery.py, maid_runner/core/_test_runner_invocation.py, tests/core/test_solidity_foundry_discovery.py, tests/core/validation/test_foundry_test_runner.py]
