schema: "2"
goal: "Stop swapped sys.monitoring from corrupting artifact-coverage evidence"
type: fix
created: "2026-08-13T06:52:57Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - artifact-coverage
    - correctness
    - runtime-evidence
description: |
  The artifact-coverage runner and the grouped-evidence worker plugin both
  register a sys.monitoring PY_START callback that recorded which declared
  artifacts execute. Each callback returned `sys.monitoring.DISABLE`, re-read
  live on every call. A test inside the instrumented suite may legitimately
  monkeypatch `sys.monitoring` for its own assertions -- maid-runner's own
  tests/core/test_runtime_evidence.py swaps it for a stub that has a full
  events namespace but no `DISABLE`. When such a test runs under coverage
  instrumentation, the callback reads the stub, raises AttributeError, the
  exception becomes unraisable, and pytest's unraisableexception plugin fails
  the whole session (E900). An E900 leaves empty execution data, which then
  reports every artifact the command should have proven as an E710 coverage
  gap. So a single monitoring test silently fabricates coverage failures and
  inflates the repository-wide E710 debt that the deep gate stops on.

  This was found while measuring the 121-19 isolated coverage path: a bounded
  serial-versus-isolated probe on real manifests reproduced the AttributeError
  in both paths, proving it is a pre-existing runner defect rather than an
  isolation regression. It is fixed here as a correctness prerequisite so
  121-20's cold-coverage-stage measurement is not polluted by fabricated
  failures.

  The fix mirrors coverage.py's own sysmon module (`DISABLE = getattr(
  sys_monitoring, "DISABLE", None)` bound once) and the runtime-evidence
  plugin's existing `getattr(monitoring, "DISABLE", None)` call sites: capture
  the real monitoring object and its DISABLE sentinel once at registration and
  have the callback return the captured constant. The stop path uses the same
  captured reference so a later swap cannot break teardown either. Behavior is
  unchanged when sys.monitoring is never swapped.

  The change lives inside two private generated-script strings in
  maid_runner/core/_runtime_command_executor.py, so this manifest contracts the
  observable behavior through the public executor rather than the private
  script text. The file is scoped for edit; no public signature changes.
temptations:
  - risk: "Do not wrap the callback body in a bare try/except to swallow the AttributeError."
    instead: "Bind the real DISABLE sentinel once at registration and return the captured constant, so the callback never reads a swappable global."
  - risk: "Do not test by importing or exec-ing the private generated runner script string."
    instead: "Drive SubprocessRuntimeCommandExecutor.execute end to end against a project whose test swaps sys.monitoring mid-call and assert the returned record."
  - risk: "Do not weaken the test by dropping -W error so the unraisable becomes a silent warning."
    instead: "Keep error::pytest.PytestUnraisableExceptionWarning so a re-read regression deterministically fails the command."
  - risk: "Do not fix only the SubprocessRuntimeCommandExecutor script and leave the grouped worker plugin callback re-reading sys.monitoring."
    instead: "Apply the captured-sentinel pattern to both generated scripts in _runtime_command_executor.py."
files:
  create:
    - path: tests/core/test_coverage_runner_monitoring_stability.py
      artifacts:
        - kind: test_function
          name: test_swapped_monitoring_midrun_does_not_corrupt_coverage_evidence
          args: []
  scope:
    - path: maid_runner/core/_runtime_command_executor.py
      reason: "Harden the two private generated coverage-runner scripts to bind the sys.monitoring DISABLE sentinel once; no public artifact signature changes."
  read:
