        - uv
        - run
        - python
        - -m
        - pytest
        - -q
        - tests/integration/test_library_api.py
      status: failed
      summary: Red phase failed as intended because the worktree still
        reported 2.23.2 while the 2.24.0 contract expected the new metadata.
    - command:
