# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Make new Python behavioral-test plan-lock hashes stable across supported CPython
  interpreters while retaining fail-closed compatibility for existing hash formats"
type: fix
created: "2026-08-01T06:22:14Z"
supersedes:
  - 085-07-ast-scoped-behavioral-test-hash
metadata:
  tags:
    - plan-lock
    - hashing
    - python
    - cross-interpreter
    - anti-gaming
  priority: high
description: |
  The current sha256-pyast format hashes ast.dump output. CPython adds empty
  AST fields across interpreter versions (for example declaration type_params),
  so identical source can report E701 tampering when a lock moves between the
  supported Python 3.10-3.14 environments.

  Supersede 085-07 with a versioned sha256-pyast:v2 format for newly written
  Python test hashes. V2 recursively serializes AST node names and ordered
  fields, omits only absent/empty-list fields, type-tags strings and non-JSON
  scalar constants by exact value, and hashes compact UTF-8 JSON. This
  preserves formatting/comment neutrality while removing differences caused
  solely by version-added empty fields. The design was checked against all 305
  parseable repository tests:
  the aggregate per-file digest was identical on CPython 3.10, 3.11, 3.12,
  3.13, and 3.14.

  Existing sha256-pyast v1 and sha256 byte hashes remain readable through
  prefix dispatch; existing lock files are not bulk rewritten. V1 remains
  interpreter-shaped historical evidence and can be migrated only through an
  intentional plan-lock revision on the desired interpreter. Syntax and UTF-8
  decode failures still raise. Non-Python tests remain byte-hashed.
temptations:
  - risk: "Do not reuse the sha256-pyast v1 prefix for the new payload and make every
      existing lock appear tampered."
    instead: "Write sha256-pyast:v2 for new Python hashes and dispatch v2 before the
      broader v1 prefix when reading."
  - risk: "Do not ignore arbitrary AST fields or source tokens merely to make cross-version
      tests green."
    instead: "Omit only None and empty-list fields, preserve node/field order and
      exact string/code-point values, and keep logic/import/assertion mutation tests
      fail-closed."
  - risk: "Do not bulk-rewrite historical .maid/plan-locks as part of this fix."
    instead: "Retain v1 and byte readers; require an explicit sanctioned revision
      for migration."
  - risk: "Do not silently byte-hash invalid Python when parsing or canonical serialization
      fails."
    instead: "Raise the parse, decode, or unsupported-constant error so locking fails
      visibly."
