        - kind: test_function
          name: test_pyast_v2_hash_has_cross_interpreter_golden_digest
        - kind: test_function
          name: test_pyast_v2_hash_handles_surrogate_escapes_without_collisions
    - path: maid_runner/core/plan_lock.py
      artifacts:
        - kind: function
          name: compute_behavioral_test_hash
          args:
            - name: path
              type: Path
          returns: str
          description: "Writes sha256-pyast:v2 for parseable UTF-8 Python and sha256
            byte hashes for other suffixes; raises instead of silently degrading."
        - kind: function
          name: test_hash_matches
          args:
            - name: lock_hash
              type: str
            - name: path
              type: Path
          returns: bool
          description: "Fail-closed prefix dispatch for sha256-pyast:v2, historical
            sha256-pyast v1, and sha256 byte hashes."
        - kind: function
          name: create_plan_lock
          args:
            - name: manifest_path
              type: Path
            - name: project_root
              type: Path
            - name: agent
              type: Optional[AgentProvenance]
          returns: PlanLock
          description: "Stores the current versioned compute_behavioral_test_hash
            result; public signature remains unchanged."
  scope:
    - path: docs/maid_specs.md
      reason: "Document v2 writes, v1/byte compatibility, migration boundaries, and
        the formatting-neutral semantic limit."
    - path: maid_runner/docs/maid_specs.md
      reason: "Keep the packaged MAID specification synchronized with the canonical
        documentation."
  read:
    - maid_runner/cli/commands/plan.py
    - maid_runner/core/supersession_audit.py
    - manifests/085-07-ast-scoped-behavioral-test-hash.manifest.yaml
validate:
  - uv run python -m pytest tests/core/test_ast_scoped_behavioral_test_hash.py 
    -v
  - uv run maid validate 
    manifests/093-01-portable-python-plan-lock-hashes.manifest.yaml --mode 
    behavioral --quiet
  - uv run maid validate 
    manifests/093-01-portable-python-plan-lock-hashes.manifest.yaml --mode 
    schema --quiet
outcome:
  status: completed
  completed_at: '2026-08-01T15:06:37+08:00'
  summary: >-
    New Python behavioral-test locks use a cross-interpreter
    sha256-pyast:v2 canonical AST hash while historical v1 AST hashes and raw
    byte hashes remain readable through fail-closed prefix dispatch.
  rationale: >-
    CPython adds empty fields to AST nodes across supported interpreter
    versions, so the historical ast.dump payload could report false E701
    tampering for unchanged source. V2 recursively preserves node names,
    ordered populated fields, and exact typed values while omitting only None
    and empty-list fields. Exact UTF-8 surrogatepass bytes distinguish lone
    surrogates, explicit surrogate pairs, and astral code points without
    encoding failures. A new prefix avoids rewriting or reinterpreting
    historical evidence, and invalid Python remains fail-loud rather than
    falling back to byte hashing.
  lessons:
    - lesson_type: portability
      summary: >-
        A supposedly semantic serialization is portable only if both its
        structure and scalar encoding are interpreter-independent. Ordered
        ast.iter_fields with absent-field omission removed version-added empty
        fields, while typed surrogatepass byte encoding preserved exact Python
        string identity across all supported interpreters.
      tags:
        - python-ast
        - plan-lock
        - unicode
      paths:
        - maid_runner/core/plan_lock.py
        - tests/core/test_ast_scoped_behavioral_test_hash.py
    - lesson_type: test-design
      summary: >-
        Prefix-only and non-collision assertions were insufficient for a
        versioned portable format. Exact v2 prefix checks and golden digests
        make writer regressions and per-interpreter Unicode drift observable.
      tags:
        - behavioral-hash
        - golden-test
        - compatibility
      paths:
        - tests/core/test_ast_scoped_behavioral_test_hash.py
    - lesson_type: workflow
      summary: >-
        A stash-backed plan revision captures hashes with the implementation
        hidden, so a hash-algorithm change requires a subsequent sanctioned
        contract-preserving revision after restoration. Revision 5 re-pinned
        the final serializer and revision 6 pinned reviewer-requested golden
        assertions while preserving the original red evidence.
      tags:
        - plan-revise
        - red-evidence
        - implementation-review
      paths:
        - .maid/plan-locks/093-01-portable-python-plan-lock-hashes.lock.json
  review_notes:
