# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Recognize explicit Bun test commands as behavioral test runners"
type: fix
created: "2026-09-15T05:20:09Z"
metadata:
  bug_report: ~/.maid/bug-report/20260915-131500-adc-fix-support-hub-bun-test-e230.md
  priority: high
  tags: [bun, test-runner, command-integrity, e230, adc-fix-support-hub]
description: |
  Fix the E230 false positive reported by adc-fix-support-hub when a manifest
  declares an explicit `bun test <test-file>` command. Recognize only Bun's
  `test` subcommand as an executing test runner and expose only its positional
  test patterns to the existing concrete-path coverage checks.

  This is a private-scope extension of the durable test-runner classification
  contract; no public signatures change, so existing manifests remain active
  through chain merging. Help mode and test-selection flags remain fail-closed,
  while Bun option values such as reporter output paths cannot masquerade as
  executed behavioral tests. The bounded option model follows Bun 1.3.14's
  documented `bun test --help` surface and rejects unknown flags rather than
  guessing their argument semantics.
temptations:
  - risk: "Do not classify every bun command as a test runner merely because the executable is named bun."
    instead: "Require the exact `bun test` subcommand and prove a non-test Bun subcommand remains E230-blocked."
  - risk: "Do not bypass E230 merely because a Bun option value contains the declared test path."
    instead: "Scan only positional Bun test patterns and explicitly consume supported option values before applying concrete-path coverage."
  - risk: "Do not accept filtered or non-executing Bun test modes as whole-file behavioral evidence."
    instead: "Route help and Bun-specific selection flags through the existing E230 non-executing and selector guards."
  - risk: "Do not special-case the originating repository or replace direct Bun execution with Vitest."
    instead: "Extend the shared runner-classification seam for portable `bun test` argv and verify the originating command shape."
files:
  scope:
    - path: maid_runner/core/_test_runner_invocation.py
      reason: "Recognize exact direct Bun test invocations and scan their bounded option syntax without changing public API."
  create:
    - path: tests/core/validation/test_bun_test_runner.py
      artifacts:
        - kind: test_function
          name: test_command_integrity_accepts_explicit_bun_test_file
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "The reported direct Bun test command covers its explicitly declared TypeScript behavioral test without E230."
        - kind: test_function
          name: test_run_manifest_tests_executes_explicit_bun_test_command
          args:
            - {name: tmp_path, type: Path}
            - {name: monkeypatch, type: MonkeyPatch}
          returns: None
          description: "maid test executes the accepted Bun command unchanged and reports one passing command."
        - kind: test_function
          name: test_command_integrity_rejects_non_test_bun_subcommand
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "A Bun subcommand other than test does not satisfy behavioral test command integrity."
        - kind: test_function
          name: test_command_integrity_rejects_non_executing_bun_test_mode
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "A Bun test help invocation cannot prove that the behavioral test executed."
        - kind: test_function
          name: test_command_integrity_rejects_filtered_bun_test_run
          args:
            - {name: tmp_path, type: Path}
            - {name: selector, type: str}
          returns: None
          description: "Bun test-name, only, changed, and shard selectors cannot prove whole-file behavioral coverage."
        - kind: test_function
          name: test_command_integrity_rejects_bun_option_value_test_path
          args:
            - {name: tmp_path, type: Path}
            - {name: option, type: str}
          returns: None
          description: "A declared test path used only as a Bun reporter, coverage, or ignore option value cannot satisfy behavioral coverage."
        - kind: test_function
          name: test_command_integrity_rejects_unknown_bun_test_option
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "Unknown Bun test option syntax remains fail-closed even when its following value names the declared test file."
  read:
    - maid_runner/core/_test_command_targets.py
    - maid_runner/core/_validation_test_artifacts.py
    - maid_runner/core/test_runner.py
