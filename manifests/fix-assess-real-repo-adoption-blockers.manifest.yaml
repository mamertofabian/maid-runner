# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Make maid assess repeatable and safe for real MAID repositories without 
  routine lifecycle files inflating ceremony or deep recommendations dropping 
  handoff gates.
type: fix
created: '2026-08-10T02:34:24Z'
metadata:
  status: implementation-ready
  origin: tower-recall-real-repository-assessment
  tags:
  - developer-experience
  - verification
  - risk-scaling
  - cache
  priority: high
description: |
  A real-repository trial found three adoption blockers in the first `maid
  assess` implementation. First, assessment invoked risk-v1 with its persistent
  cache enabled, so the advisory read dirtied repositories and a repeated run
  assessed the newly-created cache path. Second, routine manifest and plan-lock
  envelope files made nearly every MAID-backed implementation look sensitive
  or wider than its material production/test change. Third, a deep recommendation
  printed only `--profile deep`, even though deep does not itself enable the
  handoff profile's plan-lock and red-evidence gates.

  Add a backward-compatible `use_cache` option to `recommend_coverage`; assess
  disables it so gathering signals neither reads nor writes persistent report
  state. Assessment discards generated `.maid/cache/**` paths. When a diff also
  contains material paths, it excludes an active-manifest and plan-lock envelope
  only when the changed manifest declares a changed material file. Lifecycle-only
  and unrelated manifest diffs remain conservatively sensitive, so a trivial
  extra file cannot hide a direct contract edit. Lifecycle recognition follows
  the configured manifest directory.

  Deep recommendations print an exact verify command that explicitly retains
  `--require-plan-lock` and `--require-red-evidence`. This does not change verify
  presets or execute verification; it makes the advisory command match the
  existing handoff safety floor while adding deep's artifact-coverage and
  knockout checks.
temptations:
- risk: Do not disable risk-v1 caching globally or change bootstrap behavior.
  instead: Add an optional cache-control argument whose default preserves 
    current callers, and disable it only from assessment.
- risk: Do not ignore all manifest changes and create a low-risk escape hatch.
  instead: Exclude routine lifecycle paths only when material paths are also 
    present; retain lifecycle-only diffs as sensitive evidence.
- risk: Do not redefine the deep preset and broaden this fix into verify-profile
    evolution.
  instead: Add the handoff requirements explicitly to the command emitted for a 
    deep assessment.
- risk: Do not let generated assessment cache files feed back into the next 
    assessment.
  instead: Prevent assessment from creating the cache and always exclude 
    `.maid/cache/**` from material change signals.
files:
  edit:
  - path: maid_runner/core/coverage_recommendation.py
    artifacts:
    - kind: function
      name: recommend_coverage
      args:
      - name: project_root
        type: Union[str, Path]
      - name: manifest_dir
        type: str
        default: manifests/
      - name: limit
        type: int
        default: '20'
      - name: exclude_patterns
        type: set[str] | None
        default: None
      - name: respect_gitignore
        type: bool
        default: 'True'
      - name: deep
        type: bool
        default: 'False'
      - name: use_cache
        type: bool
        default: 'True'
      returns: CoverageRecommendationReport
      description: Preserves persistent risk-v1 caching by default while 
        allowing read-only callers to bypass cache reads and writes 
        deterministically.
  - path: maid_runner/core/change_assessment.py
    artifacts:
    - kind: function
      name: assess_change_signals
      args:
      - name: project_root
        type: Path
      - name: baseline
        type: DiffScopeBaseline
      - name: manifest_dir
        type: str
        default: manifests/
      returns: ChangeSignalSummary
      description: Collects repeatable read-only signals, excludes generated 
        cache paths, and excludes routine manifest/plan-lock envelope paths only
        when material changed paths remain.
  - path: maid_runner/cli/commands/assess.py
    artifacts:
    - kind: function
      name: cmd_assess
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: Emits deep verify argv with explicit plan-lock and 
        red-evidence requirements while leaving handoff recommendations 
        unchanged.
  - path: maid_runner/instruction_payload.py
    artifacts:
    - kind: attribute
      name: INSTRUCTION_PAYLOAD_VERSION
      type: str
  - path: tests/core/test_coverage_recommendation.py
    artifacts:
    - kind: test_function
