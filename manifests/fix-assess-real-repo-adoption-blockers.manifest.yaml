outcome:
  status: completed
  completed_at: '2026-08-10T03:08:48Z'
  summary: Made change assessment read-only and repeatable, calibrated routine
    manifest/plan-lock envelopes without hiding substantive contract edits,
    preserved handoff gates in deep commands, and adopted assess-first guidance.
  rationale: |
    Assessment now bypasses persistent risk-v1 cache reads and writes, ignores
    generated cache paths, and recognizes active manifests beneath configured
    manifest roots using MAID's inactive-directory policy. A lifecycle envelope
    is excluded only when its manifest declares a changed material path; direct
    or unrelated manifest edits remain sensitive. Deep recommendations explicitly
    retain plan-lock and red-evidence flags. Repository and distributed skills
    now direct agents through the exact assessed command, with handoff as the
    fallback safety floor, and the instruction payload version is advanced.
    Evidence: 76 affected tests passed; `maid validate` passed all 406 active
    manifests; `maid test` passed 239/239 commands including full pytest; two
    tower-recall runs were identical and left the detached worktree clean; the
    final independent review found no remaining issues.
  agent:
    model: GPT-5
    provider: OpenAI
    client: Codex
    skills:
    - maid-implement-draft
    - maid-evolver
    - maid-planner
    - maid-implementation-review
    - skill-creator
  lessons:
  - lesson_type: real-repository-validation
    summary: Advisory assessment must not persist cache state because its own
      generated files can change the next assessment and dirty consumer repos.
    tags:
    - assessment
    - determinism
    - cache
    paths:
    - maid_runner/core/change_assessment.py
    - maid_runner/core/coverage_recommendation.py
  - lesson_type: anti-gaming
    summary: Routine lifecycle calibration is safe only when a changed manifest
      demonstrably declares a changed material path; blanket manifest filtering
      lets an unrelated trivial edit hide a substantive contract change.
    tags:
    - lifecycle
    - anti-gaming
    - verify-profiles
    paths:
    - maid_runner/core/change_assessment.py
    - tests/cli/test_assess_cmd.py
  - lesson_type: distribution
    summary: Changing shipped skill guidance requires advancing the instruction
      payload version so installed repositories can detect stale instructions.
    tags:
    - skills
    - payload-version
    paths:
    - maid_runner/instruction_payload.py
    - tests/cli/test_init_instruction_payload_version.py
  review_notes:
  - source: implementation-review-assess_adoption_fix_review_clean
    severity: P1/P2 fixed
    summary: Fixed configured-root matching, lifecycle downgrade resistance,
      payload versioning, and nested active-manifest discovery across revisions
      6 and 7; final reviewer verdict was Ready to merge with no findings.
