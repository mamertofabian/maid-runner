    - kind: test_function
      name: test_routine_lifecycle_files_do_not_inflate_material_change
    - kind: test_function
      name: test_manifest_only_change_remains_sensitive
    - kind: test_function
      name: test_unrelated_material_change_cannot_hide_manifest
    - kind: test_function
      name: test_custom_manifest_directory_lifecycle_pair_is_calibrated
    - kind: test_function
      name: test_nested_active_manifest_lifecycle_pair_is_calibrated
    - kind: test_function
      name: test_deep_recommendation_command_retains_handoff_gates
  - path: tests/cli/test_verify_profile_distribution.py
    artifacts:
    - kind: test_function
      name: test_actionable_payload_commands_use_gate_equivalent_profiles
  - path: tests/test_review_convergence_guidance.py
    artifacts:
    - kind: test_function
      name: test_implementation_review_skill_carries_convergence_protocol
    - kind: test_function
      name: test_implementer_skills_carry_iteration_recipe
  - path: tests/ci/test_codex_maid_loop.py
