outcome:
  status: completed
  completed_at: '2026-07-27T11:05:00+08:00'
  summary: >-
    Three uncached hot paths in the validation engine are now cached: manifest
    YAML parses through libyaml when the installed pyyaml provides it,
    resolve_reexport is memoized on (module, name, project_root), and
    ManifestChain resolves writable-path ownership through a per-chain index.
    Measured same-tree A/B, three runs each, with this manifest removed from
    both arms so changed_scope aborted identically: maid verify's validation
    stages 12.73s to 6.33s, maid validate 7.88s to 4.10s. Verify findings are
    byte-identical. Implementation review found one blocking regression, fixed
    in-session, and the manifest's own temptation was rewritten because it had
    prescribed the mitigation that failed.
  rationale: >-
    The three fixes were chosen from a cProfile run over 463 manifests, not from
    intuition. resolve_reexport ran 195,925 times per verify with no cache;
    manifests_for_file ran 8,140 times and re-evaluated the uncached
    all_writable_paths property 2,980,704 times; YAML parsing was 2.53s of a
    3.09s chain load. Caching the jsonschema Draft7Validator looked like an
    equally obvious win and was rejected on measurement (497ms versus 433ms
    across 463 manifests, inside noise on a full run), and that rejection is
    recorded in the temptations so it is not re-proposed.

    The re-export cache is the only member of the engine's clear-set that is not
    content-addressed. The artifact cache keys on a sha256 of the source and the
    TypeScript cache keys on a stat signature, so both self-invalidate; this one
    is keyed only by identity and depends entirely on being cleared. Signature-
    keying it would have made it self-invalidating but was measured to surrender
    roughly 80 percent of the win (5.07s uncached, 4.30s unkeyed, 4.87s
    signature-keyed), so per-request clearing in the daemon was chosen instead.
    That costs the daemon nothing measurable (1064ms versus 1044ms per request,
    inside noise) because the large resolution burst is a whole-chain effect that
    a single-manifest daemon request never had.
  lessons:
    - lesson_type: cache-invalidation
      summary: >-
        Scope-boundary clearing is not invalidation when a caller holds the scope
        open. DaemonValidationCacheScope enters the outermost validation scope
        once at construction and holds it for the daemon's lifetime, so every
        later request runs at depth 1 and the boundary clear never fires again.
        The result was a false PASS: after a barrel dropped a re-export, the
        daemon still validated the symbol as present. Before adding a cache to a
        shared clear-set, check whether every existing member self-invalidates on
        content; if the new one does not, the boundary is not enough and the
        long-lived caller has to clear per unit of work.
      tags:
        - fail-loud
        - daemon
        - performance
      paths:
        - maid_runner/core/module_paths.py
        - maid_runner/daemon/cache.py
    - lesson_type: test-design
      summary: >-
        A regression test for a stale-cache bug must separate the cached input
        from the declared artifact. The first attempt declared the barrel file
        itself and passed, which nearly led to the finding being dismissed as
        unreproducible: editing the declared file invalidates the
        content-addressed artifact cache, which reports E300/E301 before the
        stale resolution can matter. The defect only appears when the declared
        file (pkg/impl.py) and the edited barrel (pkg/__init__.py) are different
        files, so identity matching is the only consumer of the memoized answer.
        Asserting the exact code E200 rather than a bare failure is what makes
        the test specific; the reviewer confirmed it fails against both the
        unfixed code and a hollow fix that clears a different cache.
      tags:
        - anti-drift
        - testing
      paths:
        - tests/core/test_validation_hot_path_caches.py
    - lesson_type: measurement-discipline
      summary: >-
        Three measurement errors in this session all had the same root cause -
        an uncontrolled comparison - and each one produced a confident wrong
        number. A monkeypatch prototype imported maid_runner before starting its
        timer in the optimized arm only, inflating the win to 39 percent. A
        later A/B looked like only 5 percent because the baseline arm aborted
        early on fail-fast and did strictly less work. A sibling xdist slice was
        measured at one batch size and generalized to all, then rejected when
        the crossover was mapped. The rule that survived: measure the same tree,
        the same process shape, and the same stage set, repeat each arm, and
        confirm no other agent is writing to the repo.
      tags:
        - workflow
        - performance
      paths:
        - docs/plans/maid-runner-performance-backlog.md
  review_notes:
    - source: maid-implementation-reviewer
      severity: blocking
      summary: >-
        B1: the memoized resolve_reexport made the daemon return a false PASS
        after a barrel edit, reproduced end-to-end through handle_validate in
        both implementation and behavioral modes against task base 30ae431,
        which correctly reported E200. The reviewer identified that
        DaemonValidationCacheScope holds the outermost scope open for the
        daemon's lifetime, and that this cache is the only non-content-addressed
        member of the clear-set. Fixed by clearing per request; the reviewer
        then re-verified all six reachable daemon entry points as correct.
    - source: maid-implementation-reviewer
      severity: ready
      summary: >-
        Re-review returned ready to merge. It confirmed the per-request clear is
        correctly placed and complete, that the regression test fails against
        both the unfixed code and a hollow fix that clears the artifact and TS
        caches instead, and that the CLI win is intact (5.07s uncached versus
        4.30s cached). It additionally established the daemon pays no measurable
        cost for the clear, and noted the daemon is threaded but that verify only
        ever clears the global cache so concurrency cannot produce a stale answer.
    - source: maid-implementation-reviewer
      severity: advisory
      summary: >-
        Four advisories deferred to a follow-up draft. A1: the cache key uses an
        unresolved str(project_root), a latent cross-test hazard only, since the
        daemon resolves its root and production CLI never chdirs in-process. A2:
        CSafeLoader and SafeLoader diverge on three synthetic inputs (tab after a
        scalar or colon, lone surrogate), a portability inconsistency rather than
        wrong data; all 501 real manifests parse identically. A3: the SafeLoader
        fallback branch is never exercised on a libyaml-enabled machine. A4: a
        wrong implementation keying on (module, project_root) and dropping name
        would pass all declared tests.
    - source: maid-implementation-reviewer
      severity: advisory
      summary: >-
        Two completeness items raised at re-review and closed in-session rather
        than deferred. S1: the held-open-scope regression test was not declared
        as a contract artifact, so the manifest would not have required the test
        guarding this fix to exist. S2: the validate command did not cover
        tests/daemon even though daemon/cache.py had entered files.edit. Both
        landed in plan-lock revision 5.
  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/core/test_validation_hot_path_caches.py, tests/core/test_manifest.py, tests/core/test_chain.py, tests/core/test_ts_module_paths.py, tests/daemon/test_daemon_cache.py]
