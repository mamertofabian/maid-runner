# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Keep generated pre-commit plan-lock enforcement within the current task window
type: fix
created: '2026-07-11T04:55:15Z'
metadata:
  tags:
  - pre-commit
  - plan-lock
  - brownfield
  - validation-trust
  priority: high
description: |
  Add an explicit `maid verify --plan-lock-scope task` policy and use it in
  the hook generated by `maid init`. Task scope selects active manifests by
  changed manifest or behavioral-test paths. Changed manifests retain the
  lock and red-evidence requirements. Changed behavioral tests are checked
  against an existing lock, but do not force retroactive lock creation for an
  untouched historical manifest that predates plan locks.
  Untouched historical lock drift does not block an unrelated commit.

  Repository scope remains the CLI default so explicit handoff and CI keep
  enforcing every active lock. If the git task window cannot be computed,
  task scope fails closed by falling back to repository enforcement. This is
  a chain-merged correction to the existing plan-lock scoping and generated
  pre-commit manifests; neither prior contract is edited or superseded.
temptations:
- risk: Do not make task scope the global maid verify default.
  instead: Add an explicit repository-or-task option and select task only in the generated pre-commit hook.
- risk: Do not match ordinary production paths to every historical manifest that ever declared a shared file.
  instead: Match the manifest source and semantically discovered behavioral tests; leave changed production coverage to task-scoped file tracking.
- risk: Do not suppress integrity failures for a manifest implicated by the current changes.
  instead: Match current semantic tests plus trustworthy locked test paths so changed or deleted locked tests run all existing integrity checks.
- risk: Do not require brownfield manifests to manufacture historical red evidence merely because a currently changed test was once listed by them.
  instead: Apply missing-lock and red-evidence requirements only to changed manifest files while checking changed tests against locks that already exist.
- risk: Do not pass an empty scope when git baseline resolution fails.
  instead: Preserve the existing None fallback so task scope becomes repository-wide when changed paths cannot be determined.
files:
  edit:
  - path: maid_runner/core/plan_lock.py
    artifacts:
    - kind: function
      name: enforce_plan_locks
      args:
      - name: chain
        type: ManifestChain
      - name: project_root
        type: Path
      - name: require_plan_lock
        type: bool
      - name: require_red_evidence
        type: bool
      - name: changed_paths
        type: Collection[str] | None
        default: None
      - name: plan_lock_scope
        type: str
        default: repository
      returns: tuple[ValidationError, ...]
      source_scenario: A pre-commit verification runs in a brownfield repository with historical lock drift outside the paths changed since HEAD.
      actions:
      - type: api_call
        subject:
          function: enforce_plan_locks
      expected:
        behavior: Repository scope checks every active lock; task scope requires locks and red evidence for changed manifests, checks existing lock integrity for changed manifest or behavioral-test paths, does not demand retroactive locks for test-only historical manifests, and falls back to repository scope when changed paths are unavailable.
  - path: tests/core/test_plan_lock_scope_enforcement.py
    artifacts:
    - kind: test_function
      name: test_task_integrity_scope_ignores_untouched_historical_test_drift
      args:
      - name: tmp_path
        type: Path
      returns: None
      source_scenario: A historical manifest's locked test drifted before the current task changed another manifest's production file.
      actions:
      - type: api_call
        subject:
          function: enforce_plan_locks
      expected:
        behavior: Task-scoped enforcement ignores the unrelated historical integrity failure.
    - kind: test_function
      name: test_task_integrity_scope_still_rejects_tampering_in_changed_task
      args:
      - name: tmp_path
        type: Path
      returns: None
      source_scenario: The current task changes a behavioral test covered by its own plan lock.
      actions:
      - type: api_call
        subject:
          function: enforce_plan_locks
      expected:
        behavior: Task-scoped enforcement reports E701 for the implicated manifest.
    - kind: test_function
      name: test_task_scope_does_not_require_retroactive_lock_for_changed_legacy_test
      args:
      - name: tmp_path
        type: Path
      returns: None
      source_scenario: A changed test is listed by an untouched historical manifest that predates plan-lock adoption.
      actions:
      - type: api_call
        subject:
          function: enforce_plan_locks
      expected:
        behavior: Task scope does not report E700 or E704 solely because the historical manifest has no lock.
    - kind: test_function
      name: test_task_scope_rejects_deleted_locked_test_from_directory_target
      args:
      - name: tmp_path
        type: Path
      returns: None
      source_scenario: A directory-targeted validate command previously locked a behavioral test that is deleted in the current task.
      actions:
      - type: api_call
        subject:
          function: enforce_plan_locks
      expected:
        behavior: Task scope uses the trustworthy locked test path to select the manifest and reports E701 for the deletion.
  - path: tests/cli/test_verify_plan_lock_cmd.py
    artifacts:
    - kind: test_function
      name: test_verify_parser_exposes_task_scoped_plan_lock_policy
      args: []
      returns: None
      source_scenario: A caller selects task-scoped plan-lock verification.
      actions:
      - type: api_call
        subject:
          function: build_parser
      expected:
        behavior: The verify parser accepts task as the plan-lock scope.
    - kind: test_function
      name: test_cmd_verify_passes_plan_lock_scope_to_run_verify
      args:
      - name: monkeypatch
        type: pytest.MonkeyPatch
      - name: capsys
        type: pytest.CaptureFixture[str]
      returns: None
      source_scenario: The verify command dispatches a parsed task-scoped plan-lock policy.
      actions:
      - type: api_call
        subject:
          function: cmd_verify
      expected:
        behavior: The selected plan-lock scope reaches the verification pipeline.
  - path: tests/cli/test_init_pre_commit.py
    artifacts:
    - kind: test_function
      name: test_init_managed_hook_tracks_only_head_commit_candidates
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
        type: pytest.MonkeyPatch
      returns: None
      source_scenario: maid init provisions a commit-time hook in a brownfield repository.
      actions:
      - type: api_call
        subject:
          function: main
      expected:
        behavior: The generated hook selects advisory task-scoped file tracking and plan-lock enforcement from HEAD while retaining blocking errors and required evidence.
  scope:
  - path: maid_runner/cli/commands/_main.py
    reason: Add the public CLI choice without changing build_parser's signature.
  - path: maid_runner/cli/commands/verify.py
    reason: Thread the selected policy through private verification stages.
  - path: maid_runner/cli/commands/init.py
    reason: Append task plan-lock scope to the private generated-hook constant.
  - path: README.md
    reason: Keep commit-time policy and CLI option documentation synchronized.
  read:
  - manifests/067-05-scope-plan-lock-enforcement-to-changed-manifests.manifest.yaml
  - manifests/fix-init-pre-commit-brownfield-file-tracking.manifest.yaml
  - tests/cli/test_verify_plan_lock_scope_cmd.py
validate:
- uv run python -m pytest -q tests/core/test_plan_lock_scope_enforcement.py tests/cli/test_verify_plan_lock_cmd.py tests/cli/test_verify_plan_lock_scope_cmd.py tests/cli/test_init_pre_commit.py
- uv run maid validate manifests/fix-pre-commit-task-scoped-plan-locks.manifest.yaml --mode behavioral --quiet
outcome:
  status: completed
  completed_at: '2026-07-11T13:14:27+08:00'
  summary: Generated pre-commit verification now scopes plan-lock integrity to the current commit task while explicit verification retains repository-wide defaults.
  rationale: Task mode requires locks and red evidence for changed manifests, checks existing locks when their manifest or behavioral tests change, retains deleted locked tests through saved hashes, and does not require retroactive locks for untouched brownfield manifests.
  lessons:
  - lesson_type: design
    summary: Commit-time plan-lock scope needs separate requirement and integrity membership; changed manifests create requirements, while changed or deleted locked tests trigger existing-lock integrity without manufacturing historical locks.
    tags:
    - plan-lock
    - pre-commit
    - brownfield
    paths:
    - maid_runner/core/plan_lock.py
    - tests/core/test_plan_lock_scope_enforcement.py
  review_notes:
  - source: independent-implementation-reviewer
    severity: high
    summary: Initial review found that deletion of a directory-discovered locked test could evade task membership; the implementation now includes trustworthy saved test hashes and the re-review returned ready with no findings.
  validation:
  - command: [uv, run, python, -m, pytest, -q, tests/core/test_plan_lock_scope_enforcement.py, tests/core/test_plan_lock_evidence_integrity.py, tests/core/test_plan_lock_enforcement.py, tests/cli/test_verify_plan_lock_cmd.py, tests/cli/test_verify_plan_lock_scope_cmd.py, tests/cli/test_init_pre_commit.py, tests/cli/test_init_cmd.py]
    status: passed
    summary: Expanded plan-lock and init regression suite passed 91 tests.
  - command: [uv, run, maid, validate]
    status: passed
    summary: All 333 active manifests passed; 93 superseded manifests were skipped.
  - command: [uv, run, maid, test]
    status: passed
    summary: All 180 manifest commands passed.
  - command: [maid, verify, --summary, --advisory, --require-plan-lock, --require-red-evidence, --fail-fast, --no-changed-scope, --file-tracking-scope, task, --plan-lock-scope, task, --since, HEAD]
    status: passed
    summary: The generated hook command passed all eight stages in adc-youtube with no blocking findings or warnings.
