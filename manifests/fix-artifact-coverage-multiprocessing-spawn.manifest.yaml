schema: "2"
goal: "Preserve spawn-based multiprocessing semantics during artifact coverage"
type: fix
created: "2026-08-30T23:29:04Z"
metadata:
  priority: high
  tags: [artifact-coverage, multiprocessing, spawn, concurrency, downstream-bug]
description: |
  Artifact coverage currently launches pytest from a generated Python script
  whose execution body runs at module import time. Python multiprocessing in
  spawn mode re-imports that main script as `__mp_main__`, so a test-created
  child recursively starts pytest during its own bootstrap and fails before
  the target process can run. Spawn also copies the test process's current
  `sys.argv`, so every runner-specific argument parse and input-file read must
  remain inside the guarded original entry point. Make the generated coverage
  runner safe to import from spawn children while preserving the existing profiler lifecycle,
  strict-test environment, coverage output, timeout supervision, and public
  executor API.

  The downstream report attributed the failure to the xdist child-permit pool,
  but focused reproduction on the repository's default non-xdist path proved
  the first child fails in multiprocessing bootstrap. The regression therefore
  exercises two simultaneously live spawn children through the public executor
  instead of weakening the unrelated opt-in xdist resource budget.

  Outcome evidence digestion: prior artifact-coverage lessons favor real,
  bounded concurrency reproductions and narrow infrastructure fixes. This plan
  applies those lessons with an import-safe generated entry point and a
  30-second executor bound. Permit-starvation and TypeScript-resolver lessons
  are rejected as causal here because the reproduced command does not enable
  xdist and fails before either child starts.
temptations:
  - risk: "Do not remove or widen the xdist child-process permit pool for a non-xdist spawn bootstrap failure."
    instead: "Guard only the generated runner's executable entry point and retain all existing xdist worker coordination."
  - risk: "Do not simulate multiprocessing with mocks or assert on generated source text."
    instead: "Run a temporary pytest project through SubprocessRuntimeCommandExecutor and require two real spawn children to overlap and exit cleanly."
  - risk: "Do not make spawn children collect separate artifact evidence or silently accept missing parent evidence."
    instead: "Keep instrumentation owned by the original runner and assert that the parent process still records executed lines and the observed public function."
files:
