    - path: tests/core/test_artifact_coverage_multiprocessing_spawn.py
      artifacts:
        - kind: test_function
          name: test_artifact_coverage_preserves_overlapping_spawn_children
          args:
            - {name: tmp_path, type: Path}
          returns: None
          source_scenario: "A real artifact-coverage command runs a pytest test that replaces sys.argv, starts two spawn-based multiprocessing children, and holds both alive before releasing either."
          actions:
            - type: api_call
              subject: {export: SubprocessRuntimeCommandExecutor}
          expected:
            behavior: "The command exits successfully despite unrelated inherited argv, both children are simultaneously alive and return their results, and parent-process artifact execution evidence remains populated."
  scope:
    - path: maid_runner/core/_runtime_command_executor.py
      reason: "Make the private generated artifact-coverage runner import-safe for multiprocessing spawn without changing public signatures or xdist permit policy."
  read:
    - maid_runner/core/_test_command_execution.py
    - maid_runner/core/result.py
    - tests/core/test_artifact_coverage.py
    - tests/core/test_artifact_coverage_fallback_workers.py
    - tests/core/test_artifact_coverage_resolver_permits.py
    - manifests/121-15-parallelize-isolated-artifact-coverage-fallbacks.manifest.yaml
    - manifests/fix-artifact-coverage-resolver-permit-starvation.manifest.yaml
validate:
  - uv run python -m pytest -q tests/core/test_artifact_coverage_multiprocessing_spawn.py
  - uv run python -m pytest -q tests/core/test_artifact_coverage.py tests/core/test_artifact_coverage_fallback_workers.py tests/core/test_artifact_coverage_resolver_permits.py
outcome:
  status: completed
  completed_at: "2026-08-31T07:43:13+08:00"
  summary: >-
    Artifact coverage now runs pytest only from the generated runner's guarded
    original entry point. Multiprocessing spawn children can import the runner
    with inherited application arguments without recursively starting pytest or
    reading runner-owned input files, while parent-process artifact evidence and
    the existing xdist permit policy remain intact.
  rationale: >-
    Focused downstream reproduction disproved the report's permit-starvation
    diagnosis and located the failure in spawn's `__mp_main__` import of the
    generated script. Keeping runner argument parsing, profiler ownership,
    pytest execution, and evidence writing inside `main()` fixes that lifecycle
    boundary without weakening process budgeting or changing the public executor API.
  lessons:
    - lesson_type: validation-hardening
      summary: >-
        Generated Python entry points used under test instrumentation must be
        safe when multiprocessing spawn imports them as `__mp_main__`; both
        executable work and argument-dependent filesystem reads belong behind
        the original `__main__` guard.
      tags: [artifact-coverage, multiprocessing, spawn, maid-runner-feedback]
      paths:
        - maid_runner/core/_runtime_command_executor.py
        - tests/core/test_artifact_coverage_multiprocessing_spawn.py
    - lesson_type: test-design
      summary: >-
        A bounded real-spawn regression should vary inherited process state,
        prove multiple children overlap, and retain parent evidence so a narrow
        guard cannot pass by disabling instrumentation or serializing the behavior.
      tags: [concurrency, regression-coverage, process-isolation]
      paths:
