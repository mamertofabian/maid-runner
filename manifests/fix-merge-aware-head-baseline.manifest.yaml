# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Make an explicit HEAD task baseline merge-aware during an in-progress Git merge"
type: fix
created: "2026-09-10T09:25:47Z"
metadata:
  bug_report: ~/.maid/bug-report/20260904-211047-tma-studio-marker-manager.md
  priority: high
  tags: [git, merge, baseline, pre-commit, file-tracking, tma]
description: |
  Fix the pre-commit false positive produced by `maid verify --profile
  pre-commit --since HEAD` during an in-progress merge. When the resolved
  baseline source is `since`, its commitish is exactly the symbolic `HEAD`, and
  Git exposes a valid `MERGE_HEAD`, compare tracked task paths against
  `MERGE_HEAD`. This preserves the current branch's authored contributions and
  conflict resolution while excluding files that arrive unchanged from the
  incoming side.

  This is deliberately narrower than the existing AUTO_MERGE worktree-scope
  behavior. AUTO_MERGE identifies post-automatic-merge edits; MERGE_HEAD is the
  correct task baseline for distinguishing branch-authored content from
  incoming-only content. Explicit hashes, HEAD-relative expressions, base-ref
  and metadata baselines, invalid MERGE_HEAD state, and ordinary non-merge
  behavior remain unchanged. Multi-head (octopus) merges also retain literal
  HEAD semantics because no single MERGE_HEAD represents the complete incoming
  side; this conservative fallback avoids silently excluding only a subset.
temptations:
  - risk: "Do not reuse AUTO_MERGE as the task baseline and accidentally reduce task scope to conflict-resolution edits only."
    instead: "Use a valid MERGE_HEAD only for the exact symbolic since=HEAD case; keep AUTO_MERGE limited to worktree-scope dirt."
  - risk: "Do not rewrite hashes, HEAD~n, base-ref, or metadata baselines merely because a merge is in progress."
    instead: "Gate substitution on baseline.source == since and baseline.commitish == HEAD, with negative tests for literal non-HEAD baselines."
  - risk: "Do not suppress incoming paths through filename, status, or content heuristics."
    instead: "Let Git compute the diff from the incoming commit and preserve existing fail-closed fallback when MERGE_HEAD is absent or invalid."
