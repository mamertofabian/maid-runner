          returns: None
          description: "An exact since=HEAD baseline includes branch-authored and resolved files while excluding unchanged incoming-only files during a merge."
        - kind: test_function
          name: test_literal_commit_baseline_is_not_rewritten_during_merge
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "An explicit commit hash equal to the current HEAD remains literal and retains the existing local-side diff semantics."
        - kind: test_function
          name: test_non_since_head_baseline_is_not_rewritten_during_merge
          args:
            - {name: tmp_path, type: Path}
            - {name: source, type: str}
          returns: None
          description: "HEAD text from base-ref or metadata sources retains its existing semantics; merge substitution is exclusive to source=since."
        - kind: test_function
          name: test_head_since_remains_literal_outside_merge
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "Outside a merge, since=HEAD continues to report ordinary tracked worktree changes."
        - kind: test_function
          name: test_invalid_merge_head_falls_back_to_literal_head
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "An invalid MERGE_HEAD cannot change baseline semantics and falls back to literal HEAD."
        - kind: test_function
          name: test_multiple_merge_heads_fall_back_to_literal_head
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "An octopus merge with multiple incoming heads retains literal HEAD semantics instead of using only the first incoming commit as a partial baseline."
