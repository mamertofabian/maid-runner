schema: "2"
goal: "Prevent inherited Git hook repository pointers from escaping pytest temporary
  repositories and mutating the caller's worktree"
type: fix
created: "2026-08-09T16:17:03Z"
metadata:
  planning_state: behavioral-contract
  promotion_ready: true
  tests_status: created-red-confirmed
  source_bug_report:
    /home/atomrem/.maid/bug-report/20260809-225324-maid-runner-worktree-test-git-env-isolation.md
  tags:
    - git
    - pytest
    - test-isolation
    - worktree-safety
  priority: critical
description: |
  Add a session-wide pytest safety boundary that removes inherited Git repository
  pointer variables before any test runs. Git exports these variables while invoking
  hooks, and Git subprocesses honor them ahead of cwd, so temporary-repository tests
  can otherwise write commits, refs, objects, and index entries into the worktree
  that invoked the hook.

  The fixture restores the caller's environment when an embedded pytest session
  finishes. It removes only variables that redirect repository storage or worktree
  resolution; unrelated Git configuration and identity variables remain available.
  A focused behavioral test runs under hook-like sentinel values and requires all
  repository pointers to be absent inside the test session.
temptations:
  - risk: "Do not patch each existing temporary-repository helper independently and
      leave future helpers exposed."
    instead: "Enforce the invariant once in the root autouse pytest configuration
      and cover it with a hook-like regression command."
  - risk: "Do not remove every GIT_* variable, including harmless configuration and
      test identity controls."
    instead: "Remove only repository, worktree, index, common-directory, prefix, and
      object-directory pointers known to redirect Git operations."
  - risk: "Do not prove the fix by pointing a red-phase Git command at the real repository
      or another valuable worktree."
    instead: "Use inert sentinel values and assert the environment boundary directly
      before exercising the existing temporary-repository tests after implementation."
