    summary: >-
      CI=true changes pytest failure rendering without implying a timeout. Bounded
      diagnostics should preserve whole semantic lines and treat only truly
      pathological lines specially instead of blindly slicing raw characters.
    tags: [artifact-coverage, ci, diagnostics, maid-runner-feedback]
    paths:
    - maid_runner/core/artifact_coverage.py
  - lesson_type: test-design
    summary: >-
      Public-path fixtures covering indentation, caret alignment, near-limit
