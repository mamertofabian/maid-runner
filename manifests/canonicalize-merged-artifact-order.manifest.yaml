# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Make effective artifact ordering canonical and independent of surviving owner topology"
type: fix
created: "2026-08-17T05:08:03Z"
supersedes:
  - fix-chain-merge-target-contract-equivalence
metadata:
  priority: critical
  tags:
    - chain-merge
    - artifact-order
    - contract-equivalence
    - supersession
description: |
  ManifestChain currently preserves the insertion position of the first owner
  of each artifact while later owners replace only its value. A chain-merge
  replacement can therefore preserve every complete ArtifactSpec yet change
  effective list order when an older overlapping owner survives. Exact order
  preservation by superseding the overlap closure is unsafe in this repository:
  the 17 E710 consolidation targets form one connected component of 397 active
  manifests and 593 artifact-bearing paths.

  Canonicalize merged_artifacts_for output by complete contract identity after
  applying the existing latest-owner-wins value merge. This keeps validation
  semantics and complete values unchanged while making public list order
  deterministic across equivalent owner topologies, including exact overloads.
  The materialized replacement still retains existing effective specs first
  and appends newly inferred specs in source order; once replayed through the
  active chain, merged_artifacts_for exposes canonical contract-key order.
  Target metadata, imports, private-only path scope, atomic refusals, and
  signature-aware inferred-artifact deduplication remain unchanged.
temptations:
  - risk: "Do not supersede the 397-manifest overlap closure to force insertion order."
    instead: "Canonicalize the public merged result after latest-owner value resolution and prove topology-independent equivalence."
  - risk: "Do not sort manifests before merging or let an older ArtifactSpec win."
    instead: "Preserve created-order traversal and latest-owner replacement, then sort only the final complete ArtifactSpec values by contract_key."
  - risk: "Do not sort by bare name, which collapses owners and exact overloads."
    instead: "Use full contract_key identity and cover two signatures sharing one method merge key."
  - risk: "Do not weaken complete-value equivalence to make ordering assertions pass."
    instead: "Compare identity-to-spec mappings before and after apply as well as canonical key order."
files:
  edit:
    - path: maid_runner/core/chain.py
      artifacts:
        - kind: method
          name: merged_artifacts_for
          of: ManifestChain
          args:
            - name: path
              type: str
          returns: list[ArtifactSpec]
          description: "Return latest effective ArtifactSpecs in canonical contract-key order independent of active owner topology."
    - path: maid_runner/core/chain_merge_apply.py
      artifacts:
        - kind: class
          name: ChainMergeApplyResult
        - kind: attribute
          name: applied
          of: ChainMergeApplyResult
          type: bool
        - kind: attribute
          name: snapshot_path
          of: ChainMergeApplyResult
          type: str | None
        - kind: attribute
          name: superseded_slugs
          of: ChainMergeApplyResult
          type: tuple[str, ...]
        - kind: attribute
          name: refused_reason
          of: ChainMergeApplyResult
          type: str | None
        - kind: attribute
          name: missing_artifacts
          of: ChainMergeApplyResult
          type: tuple[str, ...]
        - kind: function
          name: apply_chain_merge
          args:
            - name: file_path
              type: str
            - name: chain
              type: ManifestChain
            - name: project_root
              type: str
              default: '"."'
            - name: output_dir
              type: str
              default: '"manifests/"'
            - name: registry
              type: ValidatorRegistry | None
              default: "None"
          returns: ChainMergeApplyResult
