# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Make both MAID uninstall commands ownership-safe and functional on native Windows
type: fix
created: '2026-08-10T23:47:58Z'
supersedes:
- add-owned-payload-uninstall
metadata:
  status: implementation-ready
  tags: [cli, uninstall, windows, filesystem-safety]
  priority: high
  reported_error: safe descriptor-relative uninstall is unavailable on this platform
description: |
  Supersede the original ownership-safe uninstall contract because it explicitly
  required platforms without POSIX descriptor-relative mutation to fail closed,
  making both `maid init --uninstall` and `maid skills uninstall` unusable on
  native Windows.

  Preserve the existing public function signatures, deterministic reports,
  ownership comparisons, dry-run parity, selected-tool boundaries, idempotence,
  merged-file cleanup, and modified-file preservation. POSIX keeps the current
  descriptor-relative no-follow backend unchanged.

  Add a Windows-only mutation backend that opens and pins the project/home root
  and every parent directory without delete sharing, rejects symbolic-link and
  reparse-point boundaries, and atomically quarantines the leaf under a
  cryptographically unpredictable sibling name while its parent is pinned.
  Revalidate identity and content at the quarantine path so validation is bound
  to the exact object already selected for mutation; restore the visible owned
  path on mismatch or cleanup failure. Whole-path removal deletes only that
  validated quarantine without following links. Managed-file edits use a
  same-directory temporary file, quarantine-first validation, atomic
  installation, and rollback on failure. Fail closed if parent locking,
  identity validation, mutation, cleanup, or rollback cannot be completed; do
  not enable a pathname fallback on other platforms lacking the POSIX primitives.
  Rollback uses Windows' atomic non-replacing rename semantics so a destination
  created concurrently is never overwritten. If cleanup of an old managed file
  fails after replacement, quarantine and validate the installed replacement
  before restoring the original; preserve both quarantines when the installed
  file changed concurrently. Inspection failures still attempt original-path
  restoration, and nested restoration failures report the exact paths and state
  of both retained quarantines.

  Extend the existing native Windows CI job to run init and uninstall
  portability coverage. Exercise successful repository and user-skill cleanup,
  preservation of custom project/user data, rejection of Windows junction
  boundaries, a leaf edit at the final validation/mutation boundary, and
  recoverable quarantine cleanup failure. The prior uninstall Outcomes require
  race injection at the exact planning/apply boundary and byte-bound snapshots;
  these controls remain part of the superseding contract.
temptations:
- risk: Do not make Windows pass by calling shutil.rmtree directly on a validated pathname.
  instead: Pin every ancestor with non-delete-sharing Windows handles, quarantine the selected leaf atomically, revalidate that exact quarantine, then remove only the validated quarantine path.
- risk: Do not weaken the existing POSIX descriptor-relative implementation or enable a generic unsafe fallback.
  instead: Dispatch to the Windows backend only on native Windows and keep every other unsupported platform fail-closed.
- risk: Do not treat ordinary symlinks as the only Windows redirection boundary.
  instead: Reject every ancestor carrying FILE_ATTRIBUTE_REPARSE_POINT, including directory junctions, before mutation.
- risk: Do not let successful deletion obscure partial ownership or user data loss.
  instead: Retain exact payload comparison, manifest validation, deterministic dry runs, custom-data assertions, quarantine-bound revalidation, and visible-path rollback on mismatch or cleanup failure.
files:
  edit:
  - path: maid_runner/core/uninstall.py
    artifacts:
    - {kind: class, name: UninstallReport, description: Deterministic report shared by both uninstall mechanisms.}
    - {kind: attribute, name: removed, of: UninstallReport, type: 'list[str]'}
    - {kind: attribute, name: preserved, of: UninstallReport, type: 'list[str]'}
    - {kind: attribute, name: missing, of: UninstallReport, type: 'list[str]'}
  - path: maid_runner/core/skill_install.py
    artifacts:
    - kind: function
      name: uninstall_onboard_skill
      args:
      - {name: target_root, type: Path}
      - {name: payload_root, type: Path}
      - {name: dry_run, type: bool}
      returns: UninstallReport
      description: Remove only unchanged user-level Claude and Codex maid-onboard directories on POSIX and Windows while preserving modified, redirected, and unrelated skills.
  - path: maid_runner/cli/commands/init.py
    artifacts:
    - kind: function
      name: uninstall_init_payload
      args:
      - {name: project_root, type: Path}
      - {name: tools, type: 'tuple[str, Ellipsis]'}
      - {name: dry_run, type: bool}
      returns: UninstallReport
      description: Preflight and safely remove selected MAID-owned repository payloads on POSIX and Windows without crossing link or reparse boundaries.
  - path: tests/cli/test_uninstall_cmd.py
    artifacts:
    - {kind: test_function, name: test_uninstall_onboard_skill_removes_only_owned_user_level_skills, args: [{name: tmp_path, type: Path}], returns: None}
    - {kind: test_function, name: test_uninstall_onboard_skill_preserves_modified_user_level_copy, args: [{name: tmp_path, type: Path}], returns: None}
    - {kind: test_function, name: test_uninstall_onboard_skill_removes_owned_links_without_following_targets, args: [{name: tmp_path, type: Path}], returns: None}
    - {kind: test_function, name: test_skills_uninstall_dry_run_is_non_mutating_and_repeatable, args: [{name: tmp_path, type: Path}, {name: capsys, type: pytest.CaptureFixture}], returns: None}
    - {kind: test_function, name: test_init_uninstall_removes_all_owned_agent_payloads_and_guidance, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None}
    - {kind: test_function, name: test_init_uninstall_removes_shared_scaffold_but_preserves_project_data, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None}
    - {kind: test_function, name: test_init_uninstall_preserves_modified_generated_files_and_reports_them, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None}
    - {kind: test_function, name: test_init_uninstall_selected_tool_boundaries_are_isolated, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None}
    - {kind: test_function, name: test_init_uninstall_rejects_malformed_markers_before_any_removal, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}, {name: capsys, type: pytest.CaptureFixture}], returns: None}
    - {kind: test_function, name: test_init_uninstall_rejects_unsafe_installed_manifests_without_mutation, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}, {name: capsys, type: pytest.CaptureFixture}], returns: None}
    - {kind: test_function, name: test_init_uninstall_rejects_symlinked_agent_boundaries_without_mutation, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}, {name: capsys, type: pytest.CaptureFixture}], returns: None}
    - {kind: test_function, name: test_init_uninstall_revalidates_plan_before_applying_mutations, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}, {name: capsys, type: pytest.CaptureFixture}], returns: None}
  create:
  - path: tests/cli/test_uninstall_windows_portability.py
    artifacts:
    - {kind: test_function, name: test_init_uninstall_completes_on_windows_and_preserves_project_data, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None, description: Native Windows repository uninstall succeeds and preserves custom manifests.}
    - {kind: test_function, name: test_skills_uninstall_completes_on_windows_and_preserves_custom_skills, args: [{name: tmp_path, type: Path}], returns: None, description: Native Windows user-skill uninstall succeeds and preserves custom skills.}
    - {kind: test_function, name: test_init_uninstall_rejects_windows_junction_boundaries, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None, description: Native Windows repository uninstall refuses a junctioned agent boundary without touching its target.}
    - {kind: test_function, name: test_init_uninstall_rejects_leaf_edit_at_mutation_boundary, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None, description: A user edit injected at the final mutation boundary is detected on the exact quarantined Windows leaf and restored rather than overwritten or deleted.}
    - {kind: test_function, name: test_skills_uninstall_restores_visible_path_when_cleanup_fails, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None, description: A simulated locked-descendant cleanup failure restores the visible owned path and leaves no hidden quarantine orphan.}
    - {kind: test_function, name: test_skills_uninstall_rollback_never_overwrites_new_destination, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None, description: 'A destination created at the rollback boundary remains untouched while the owned quarantine is preserved and reported through failure.'}
    - {kind: test_function, name: test_init_uninstall_preserves_concurrent_replacement_edit_during_rollback, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}], returns: None, description: 'Old-file cleanup failure quarantines and validates the installed replacement, restores the original, and preserves a concurrently edited replacement quarantine.'}
    - {kind: test_function, name: test_init_uninstall_restores_original_when_replacement_validation_fails, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}, {name: capsys, type: 'pytest.CaptureFixture[str]'}], returns: None, description: 'An inspection failure after replacement quarantine still restores the original visible path and reports the retained replacement quarantine.'}
    - {kind: test_function, name: test_init_uninstall_reports_both_quarantines_when_nested_restore_fails, args: [{name: tmp_path, type: Path}, {name: monkeypatch, type: pytest.MonkeyPatch}, {name: capsys, type: 'pytest.CaptureFixture[str]'}], returns: None, description: 'A changed replacement plus a concurrently recreated destination preserves user data and reports both exact quarantine paths when original restoration cannot proceed.'}
    - {kind: test_function, name: test_windows_ci_runs_uninstall_portability_regressions, args: [], returns: None, description: The native Windows CI job continuously runs both init and uninstall portability suites.}
