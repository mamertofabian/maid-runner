outcome:
  status: completed
  completed_at: "2026-08-11T08:56:23+08:00"
  summary: "Enabled `maid init --uninstall` and `maid skills uninstall` on native Windows with a fail-closed, reparse-aware quarantine backend while preserving the existing descriptor-relative POSIX implementation."
  rationale: "Windows cannot provide the POSIX dir-fd primitives used by the original uninstall path. The Windows-only backend pins the target ancestry with non-delete-sharing Win32 handles, rejects symlinks and all reparse-point ancestors, atomically quarantines each selected leaf, validates the exact quarantine before deletion, and restores or retains recoverable state on races and cleanup failures. Unsupported non-Windows platforms continue to refuse pathname mutation."
  lessons:
    - lesson_type: filesystem-safety
      summary: "A Windows pathname mutation can remain fail-closed without emulating POSIX dir-fd calls by combining ancestor handles, reparse-point rejection, same-parent atomic quarantine, and validation of the quarantined object rather than the now-vacant original pathname."
      tags:
        - windows
        - uninstall
        - reparse-points
        - race-safety
      paths:
        - maid_runner/core/uninstall.py
        - maid_runner/core/skill_install.py
        - maid_runner/cli/commands/init.py
    - lesson_type: review-hardening
      summary: "Rollback paths need the same race analysis as the forward delete: non-replacing restoration, validation of replacement quarantines, guarded inspection failures, and diagnostics naming every retained quarantine prevent recovery logic from overwriting concurrent user data."
      tags:
        - rollback
        - quarantine
        - concurrency
        - fail-loud
      paths:
        - maid_runner/core/uninstall.py
        - tests/cli/test_uninstall_windows_portability.py
  review_notes:
    - source: independent-review-rounds-1-to-3
      severity: needs-changes
      summary: "Review identified leaf mutation races, orphan cleanup risk, check-then-overwrite restoration, replacement-cleanup TOCTOU, unguarded inspection failures, and incomplete dual-quarantine diagnostics; each finding was fixed and covered by a native Windows regression scenario."
    - source: independent-review-final
      severity: info
      summary: "Final read-only re-review returned ready with no blocking findings. Residual risk is limited to native Win32 execution awaiting the configured windows-latest CI job and partial rmtree cleanup retaining recoverable owned state while failing loudly."
