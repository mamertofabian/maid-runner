              type: Path
            - name: prior_contract
              type: dict | None
          returns: bool
          description: "Returns true only for internally consistent red/test-only evidence whose contract and behavioral tests remain unchanged; ordinary red command payloads must bind classification to exit code through the existing consistency validator."
