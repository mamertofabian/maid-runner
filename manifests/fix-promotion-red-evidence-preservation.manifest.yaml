          expected:
            behavior: "Promotion rewrites self-referencing paths and migrates the matching lock transactionally; it preserves valid evidence when the contract, command strings, and behavioral tests are unchanged, otherwise recaptures by default or records null under --no-run; unreadable or mismatched locks fail closed and other active draft references are warned."
