schema: "2"
goal: "Preserve valid draft red evidence when migrating a plan lock during manifest promotion"
type: fix
created: "2026-08-15T13:19:28Z"
supersedes:
  - 073-01-migrate-plan-locks-on-draft-promotion
metadata:
  status: implementation-ready
  tags:
    - plan-lock
    - draft-promotion
    - red-evidence
    - contract-activation
  priority: high
description: |
  Fix the independently reproduced promotion bug recorded in
  `/home/atomrem/.maid/bug-report/20260815-202918-maid-chain-merge-promotion-red-evidence.md`.
  A draft can carry valid red-phase evidence whose failure is the absence of
  the active contract itself. Promotion activates that contract before lock
  migration captures evidence, so unconditional recapture turns the genuine
  historical red run green and overwrites it with `red: false`. The `--no-run`
  path likewise discards valid evidence by leaving the revised lock's evidence
  null.

  Supersede 073-01 because its public `cmd_manifest` behavior and documentation
  explicitly require unconditional recapture/nulling. The replacement keeps
  every prior promotion behavior and test contract, but changes evidence
  migration as follows:

  1. Preserve an existing valid red-evidence or test-only-green payload only
     when the existing revision predicate finds an empty contract delta, all
     locked behavioral test
     hashes still match, and no behavioral test was added.
  2. Treat a self-referencing validate-path rewrite as a command-identity
     change rather than normalizing it away. This keeps preserved evidence
     command strings bound to the migrated lock snapshot and prevents E707.
  3. If the preservation check fails, retain the existing fail-closed behavior:
     ordinary promotion recaptures evidence against the promoted manifest and
     `--no-run` records null evidence.
  4. Keep the promotion transaction, rollback, mismatch rejection, self-path
     rewriting, parser options, and cross-manifest warnings unchanged.
  5. Harden the shared public preservation predicate so ordinary red evidence
     is valid only when every serialized command's exact-integer exit code,
     classification, command text, and output tail are internally consistent.
     Reject contradictory or unknown evidence modes, and apply the same full
     command-shape rule to test-only-green evidence. This closes the
     independent-review finding where forged exit-code-0/classification-red
     evidence survived promotion and the handoff gate.

  Rationale: promotion is a path migration, not implementation. Genuine
  historical evidence remains bound to the same contract, command strings, and
  test bytes. Reusing `revision_preserves_red_evidence` keeps validity, evidence
  channel exclusivity, contract-delta, and behavioral-hash policy centralized;
  the CLI only normalizes the one path rewrite it owns.
temptations:
  - risk: "Do not preserve evidence merely because a lock contains a red:true field."
    instead: "Use revision_preserves_red_evidence against the unmodified prior locked contract so evidence validity, command identity, contract delta, and behavioral test hashes remain bound together."
  - risk: "Do not keep unconditional post-promotion recapture for contract-activation fixes."
    instead: "Carry the original evidence payload forward when the preservation predicate passes, even if the promoted validate command would now be green."
  - risk: "Do not let --no-run preserve stale evidence after contract or test changes."
    instead: "When the preservation predicate fails, keep --no-run fail-closed by saving null evidence; recapture only when command execution is allowed."
  - risk: "Do not normalize self-referencing validate-command rewrites away during the preservation check."
    instead: "Let a changed command fail the preservation predicate, then recapture it or record null under --no-run so E707 command binding remains intact."
  - risk: "Do not weaken or delete the original promotion migration regression suite."
    instead: "Re-declare and run every 073-01 behavioral test alongside the dedicated evidence-preservation regressions."
