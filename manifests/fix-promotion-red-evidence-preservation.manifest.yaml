  create:
    - path: tests/cli/test_manifest_promote_red_evidence_preservation.py
      artifacts:
        - kind: test_function
          name: test_promote_preserves_valid_red_evidence_when_activation_turns_green
          source_scenario: "A locked draft has valid red evidence because its activation-only validate command fails until the promoted manifest exists."
          actions:
            - type: api_call
              subject:
                function: cmd_manifest
          expected:
            behavior: "Promotion succeeds and preserves the exact original red evidence rather than overwriting it with the now-green post-activation result."
        - kind: test_function
          name: test_promote_no_run_preserves_valid_red_evidence
          source_scenario: "A locked draft has valid red evidence and is promoted with --no-run."
          actions:
            - type: api_call
              subject:
                function: cmd_manifest
          expected:
            behavior: "Promotion succeeds without executing commands and preserves the exact valid red evidence payload."
        - kind: test_function
          name: test_promote_recaptures_when_locked_validate_commands_changed
          source_scenario: "A draft's validate command changes after valid red evidence was locked, then ordinary promotion runs."
          actions:
            - type: api_call
              subject:
                function: cmd_manifest
          expected:
            behavior: "The stale evidence is not preserved; promotion recaptures evidence for the current command and stores its current red output."
        - kind: test_function
          name: test_promote_no_run_clears_evidence_when_locked_tests_changed
          source_scenario: "A locked behavioral test changes after red evidence capture, then promotion runs with --no-run."
          actions:
            - type: api_call
              subject:
                function: cmd_manifest
          expected:
            behavior: "The stale evidence is not preserved and no command is run, so the migrated lock records null evidence."
        - kind: test_function
          name: test_promote_recaptures_when_self_referencing_validate_path_is_rewritten
          source_scenario: "Promotion rewrites a locked validate command from its self-referencing draft path to the active manifest path."
          actions:
            - type: api_call
              subject:
                function: cmd_manifest
          expected:
            behavior: "Promotion recaptures evidence for the rewritten active-path command rather than preserving draft-path evidence that would violate E707 command binding."
        - kind: test_function
          name: test_revision_preservation_rejects_inconsistent_red_command_payload
          source_scenario: "A direct preservation check receives forged red evidence whose exit code is zero but classification is red."
          actions:
            - type: api_call
              subject:
                function: revision_preserves_red_evidence
          expected:
            behavior: "The shared public predicate returns false because the serialized command payload is internally inconsistent."
        - kind: test_function
          name: test_promote_does_not_preserve_inconsistent_red_command_payload
          source_scenario: "A locked draft carries command-matching but internally inconsistent red evidence and is promoted with --no-run."
          actions:
            - type: api_call
              subject:
                function: cmd_manifest
          expected:
            behavior: "Promotion rejects preservation and records null evidence rather than carrying the forged payload through the handoff gate."
        - kind: test_function
          name: test_promote_does_not_preserve_command_spliced_red_evidence
          source_scenario: "A locked draft carries shape-valid red evidence whose command text was substituted after capture."
          actions:
            - type: api_call
              subject:
                function: cmd_manifest
          expected:
            behavior: "Promotion rejects the command-spliced payload and records null evidence under --no-run rather than creating an E707-invalid migrated lock."
        - kind: test_function
          name: test_revision_preservation_rejects_contradictory_evidence_mode
          source_scenario: "A red:true payload also claims the mutually exclusive test_only_green mode."
          actions:
            - type: api_call
              subject:
                function: revision_preserves_red_evidence
          expected:
            behavior: "The shared predicate rejects the contradictory evidence channel instead of treating it as ordinary red evidence."
        - kind: test_function
          name: test_revision_preservation_requires_consistent_test_only_commands
          source_scenario: "Test-only-green evidence is checked with a valid command, a Boolean false exit code, and a missing output tail."
          actions:
            - type: api_call
              subject:
                function: revision_preserves_red_evidence
          expected:
            behavior: "Only the fully shaped command with an exact integer zero exit code is preservable; Boolean and incomplete command payloads are rejected."
        - kind: test_function
          name: test_revision_preservation_rejects_spliced_special_mode_commands
          source_scenario: "Shape-valid stash-restoration and test-only-green evidence carries command text that differs from the persisted contract snapshot."
          actions:
            - type: api_call
              subject:
                function: revision_preserves_red_evidence
          expected:
            behavior: "The shared predicate rejects command-spliced evidence in both sanctioned special modes."
        - kind: test_function
          name: test_promote_preserves_consistent_test_only_evidence
          source_scenario: "A test-only manifest carries internally consistent test_only_green evidence and is promoted with --no-run."
          actions:
            - type: api_call
              subject:
                function: cmd_manifest
          expected:
            behavior: "Promotion preserves the exact valid test-only evidence payload, proving hardening did not disable the sanctioned channel."
        - kind: test_function
          name: test_promotion_docs_describe_valid_evidence_preservation
          source_scenario: "A reader checks the promotion workflow after the evidence-preservation fix."
          actions:
            - type: api_call
              subject:
                export: Path
          expected:
            behavior: "The source and packaged workflows match and document valid evidence preservation, recapture after contract or test changes, and --no-run behavior."
