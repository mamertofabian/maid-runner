# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Use grouped runtime evidence in deep artifact coverage while always running ordinary tests fresh"
type: refactor
created: "2026-08-10T09:10:00Z"
metadata:
  status: implementation-ready
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags: [performance, verify, artifact-coverage, runtime-evidence]
description: |
  At the existing artifact-coverage boundary, collect fixture-aware evidence
  once per compatible pytest behavior group and evaluate it through 121-09's
  exact report-equivalence boundary. Evidence is limited to manifests with
  runtime coverage targets. Missing, stale, incomplete, selector-different,
  environment-different, or otherwise unsafe evidence executes the affected
  exact legacy coverage command; evidence preparation failure or unsupported
  outer command concurrency runs the complete legacy coverage stage. Bind the
  evidence run to the project digest captured before execution. If the
  instrumented command itself changes project content, fail the artifact stage
  visibly because the pre-execution legacy baseline can no longer be replayed.
  A project-owned conftest.py alone does not force legacy execution after
  121-15 adds runtime lifecycle/source proof and explicit digest-bound
  approvals. Target-neutral conftests may reach grouped evidence; unproven
  fixture, hook, collection, mutation, command, or source evidence still
  selects exact fallback, bounding uncertainty without paying speculative work
  solely for file presence.

  Never reuse the instrumented command as the ordinary tests result. Pytest
  instrumentation, project mutations, and refreshed timing history are
  observable, so the tests stage always runs fresh at its original boundary
  with the current project bytes, environment, scheduler, notices, ordering,
  fail-fast behavior, task scope, and worker/process-budget policy. Knockout
  therefore needs no special result invalidation: tests remain fresh after it.
  Preserve stage names/order and deterministic text/JSON except durations.
temptations:
  - risk: "Do not treat an instrumented coverage result as an ordinary test result."
    instead: "Use evidence only for artifact coverage and always execute the ordinary tests stage fresh."
  - risk: "Do not run noncoverage or nonpytest commands early."
    instead: "Collect evidence only for manifests with runtime coverage targets; leave every residual command at the tests boundary."
  - risk: "Do not fail verification merely because the optimization cannot prepare evidence."
    instead: "Run the complete legacy artifact-coverage stage for preparation errors or unsupported outer command concurrency."
  - risk: "Do not bind evidence to project bytes produced by the instrumented test itself."
    instead: "Compare pre- and post-execution project digests and fail coverage visibly when the evidence command mutates project content."
  - risk: "Do not treat conftest file presence alone as either proof of safety or proof of required fallback."
    instead: "Use 121-15's runtime lifecycle/source evidence and exact digest-bound approvals; retain exact fallback for every unproven context."
