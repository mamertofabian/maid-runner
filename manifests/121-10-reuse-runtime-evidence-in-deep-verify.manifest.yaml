outcome:
  status: completed
  completed_at: "2026-08-13T04:15:00Z"
  summary: "Deep artifact coverage now selects complete legacy coverage before chain, digest, or pytest work for fixture-bearing projects, while retaining grouped runtime evidence for fixture-free projects and always running ordinary tests fresh. On maid-runner the decision fell from about 132 seconds of speculative collection to 0.0108 seconds."
  rationale: "The attempted repository-wide grouped path left 131 lifecycle contexts unresolved, exceeded the agreed five-minute decision bound, and a proposed collection-attribution refinement failed independent safety review because grouped selectors could change import behavior. Restoring the canonical-exclusion-aware conftest preflight removes known wasted work without claiming that the remaining 24–30-minute legacy artifact stage is solved."
  lessons:
    - lesson_type: design
      summary: "Instrumented evidence can safely accelerate coverage attribution but is not observationally equivalent to fresh ordinary tests; those execution boundaries must remain separate."
      tags: [verification, runtime-evidence, fail-closed]
      paths:
        - maid_runner/cli/commands/verify.py
        - maid_runner/cli/commands/validate.py
    - lesson_type: testing
      summary: "Coverage optimization contracts need adversaries for profiler-visible behavior, self-mutation, disappeared targets, mutation followed by preparation failure, worker policy, stage ordering, and exact legacy report parity."
      tags: [behavioral-testing, artifact-coverage, anti-gaming]
      paths:
        - tests/cli/test_verify_deep_evidence_reuse.py
    - lesson_type: performance
      summary: "A speculative optimization must bound its fallback overhead. The fixture-heavy repository run exceeded 61 minutes versus prior 28–30 minute baselines because it paid for contextual execution and exact replay; the conftest bypass now restores the legacy bound in 0.14–0.15s of preflight overhead."
      tags: [performance, deep-verify, fallback]
      paths:
        - maid_runner/cli/commands/verify.py
    - lesson_type: performance
      summary: "The next significant slice must replace the conservative conftest bypass with cheap lifecycle preflight or smaller exact fallback identities; this manifest is a safe prerequisite, not the final repository-wide time reduction."
      tags: [performance, pytest-fixtures, roadmap]
      paths:
        - maid_runner/core/runtime_evidence.py
        - maid_runner/core/artifact_coverage.py
    - lesson_type: performance
      summary: "A bounded optimization attempt must be removed when it cannot beat its kill criterion; avoiding a 132-second speculative prepass is a real bound improvement but is not an end-to-end deep verification speedup."
      tags: [performance, rollback, measurement]
      paths:
        - maid_runner/cli/commands/verify.py
  review_notes:
