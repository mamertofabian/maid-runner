outcome:
  status: completed
  completed_at: "2026-08-11T14:45:02Z"
  summary: "Deep artifact coverage now uses grouped runtime evidence only for fixture-free projects, always executes ordinary tests fresh, fails closed on stale/incomplete/mutating evidence, and selects the complete legacy coverage stage before speculative execution when a project owns conftest.py. This establishes a safe fast path without regressing the known fixture-heavy repository worst case."
  rationale: "Independent review disproved reusing instrumented pytest results as ordinary results because profiler observability, project mutation, scheduler history, and notices can change behavior. A subsequent real deep benchmark showed that collecting incomplete fixture evidence before exact fallback more than doubled wall time, so revision 17 added a conservative conftest guard until a cheap lifecycle preflight can distinguish reusable fixture-bearing groups."
  lessons:
    - lesson_type: design
      summary: "Instrumented evidence can safely accelerate coverage attribution but is not observationally equivalent to fresh ordinary tests; those execution boundaries must remain separate."
      tags: [verification, runtime-evidence, fail-closed]
      paths:
        - maid_runner/cli/commands/verify.py
        - maid_runner/cli/commands/validate.py
    - lesson_type: testing
      summary: "Coverage optimization contracts need adversaries for profiler-visible behavior, self-mutation, disappeared targets, mutation followed by preparation failure, worker policy, stage ordering, and exact legacy report parity."
      tags: [behavioral-testing, artifact-coverage, anti-gaming]
      paths:
        - tests/cli/test_verify_deep_evidence_reuse.py
    - lesson_type: performance
      summary: "A speculative optimization must bound its fallback overhead. The fixture-heavy repository run exceeded 61 minutes versus prior 28–30 minute baselines because it paid for contextual execution and exact replay; the conftest bypass now restores the legacy bound in 0.14–0.15s of preflight overhead."
      tags: [performance, deep-verify, fallback]
      paths:
        - maid_runner/cli/commands/verify.py
    - lesson_type: performance
      summary: "The next significant slice must replace the conservative conftest bypass with cheap lifecycle preflight or smaller exact fallback identities; this manifest is a safe prerequisite, not the final repository-wide time reduction."
      tags: [performance, pytest-fixtures, roadmap]
      paths:
        - maid_runner/core/runtime_evidence.py
        - maid_runner/core/artifact_coverage.py
  review_notes:
    - source: review_121_10_implementation
      severity: warning
      summary: "The rejected buffered-test design had false-green paths from self-mutation, profiler-observable instrumentation, scheduler changes, lost notices, and preparation failures."
    - source: review_121_10_safe_redesign
      severity: warning
      summary: "Review found target deletion and mutation-followed-by-exception could produce empty successful coverage reports; revisions 15 and 16 added digest and disappeared-target failures."
    - source: review_121_10_safe_redesign
      severity: ready
      summary: "Revision 17 bounds the known repository regression by detecting project conftests before chain/evidence work; final performance re-review found no blocking issues."
  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/cli/test_verify_deep_evidence_reuse.py]
      status: passed
      summary: "All 13 focused safety, parity, mutation, and worst-case bypass scenarios passed in 20.61s."
