schema: '2'
goal: Keep unrelated read-only sibling dependencies present during stash-backed revision
type: fix
created: '2026-10-20T16:11:40Z'
description: 'Preserve verified CURRENT sibling-task read dependencies during stash
  revision only with explicit --allow-sibling-dirty. Current ownership requires a
  new/dirty active sibling manifest or lock, exact implementation-writable ownership
  outside the active writable set, and a matching lock with intact test hashes, command
  identity and valid evidence. Preserve source and consumed owner metadata/test inputs,
  audit retained dirty paths and fingerprint them across capture/restoration. Invalid
  or competing current claims fail before stashing with files.scope guidance. Clean
  historical owners do not prove sibling ownership and retain baseline legacy read-wiring
  stashing; unowned legacy wiring and scope-only read rules remain unchanged. Current
  writable ownership always wins. Do not overwrite readonly context changed by validation
  or another task: refuse lock save, restore only this task implementation, and identify
  changed paths. No custom static analysis or blanket files.read exemption. Exact
  current ownership uses create/edit/scope/delete task declarations, not broad snapshot
  inventory alone. Context checks cover both initial capture and restoration validation.
  Resolve ownership in the configured or selected manifest directory; refuse symlink-backed
  consumed context before mutation.'
temptations:
- risk: Infer a current sibling task from ordinary historical file coverage, a basename
    match or an unverified owner record.
  instead: Require a dirty/new active sibling manifest or lock, exact non-current
    writable ownership, matching lock/test/evidence identities and exactly one current
    claimant. Clean historical coverage retains baseline legacy wiring behavior.
- risk: Use --allow-sibling-dirty as a blanket files.read or active-scope bypass.
  instead: Retain only verified current dependency context with explicit flag; active
    writable paths remain targets, invalid/competing claims refuse with files.scope
    guidance, and existing legacy wiring/scope-only/undeclared-dirt rules stay enforced.
- risk: Save evidence after a sibling dependency or its ownership proof changed, or
    overwrite another task changes while recovering.
  instead: Fingerprint retained source, owner manifest/lock and proof test inputs
    across command capture/restoration; abort on change, report exact paths, preserve
    existing stash restoration guarantees for own implementation, and leave unowned
    mutations visible.
