# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Recognize explicit Python unittest file commands as behavioral test runners"
type: fix
created: "2026-09-10T06:12:32Z"
metadata:
  bug_report: ~/.maid/bug-report/20260910-104500-articulearn-api-unittest-classification.md
  priority: high
  tags: [python, unittest, test-runner, command-integrity, e230]
description: |
  Fix the current E230 false positive for an explicit
  `uv run python -m unittest <test-file>` command. Recognize Python's standard
  unittest module as a test runner without applying pytest-only configuration
  semantics, and expose its concrete file arguments to the existing target
  coverage checks.

  This contract intentionally supports explicit unittest file targets only.
  Help mode, dotted class/method selectors, and `unittest discover` remain
  fail-closed because they do not prove whole-file execution through the same
  bounded path syntax. Shell-wrapped unittest commands also remain fail-closed
  because shell quoting and expansions cannot be reconstructed safely after
  tokenization. Public validation and test-runner signatures remain unchanged.
temptations:
  - risk: "Do not add unittest to the pytest-specific runner set and accidentally apply PYTEST_ADDOPTS or pytest override-ini semantics."
    instead: "Separate Python module runner recognition from pytest-only effective-argument normalization."
  - risk: "Do not treat every `python -m <module>` command as behavioral test execution."
    instead: "Recognize only the exact unittest module alongside the existing pytest module runners."
  - risk: "Do not accept unittest discovery or dotted selectors merely because they may eventually run the declared file."
    instead: "Contract concrete file targets now and keep unsupported unittest target syntax fail-closed under E230."
  - risk: "Do not partially interpret shell expansion syntax to make wrapped unittest commands pass."
    instead: "Reject shell-wrapped unittest commands and support the reported direct and uv-run forms through argv-preserving paths."
