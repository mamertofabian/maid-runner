    - command: [uv, run, maid, validate, manifests/121-19-route-exact-coverage-batch-through-isolated-lanes.manifest.yaml, --mode, implementation, --packet]
      status: passed
      summary: "Implementation validation passed."
    - command: [uv, run, maid, verify, --profile, handoff, --since, 08b73b9, --summary]
