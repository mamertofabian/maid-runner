  completed_at: "2026-08-20T03:28:24+08:00"
  summary: >-
    Runtime-evidence collection, pytest preparation and capability probes,
    environment-identity and freshness probes, and final execution now share
    the snapshot executor's explicit environment overrides and removals without
    mutating process-global state.
  rationale: >-
    Child environments are composed from the executor-owned policy, while the
    source-oriented semantic environment digest remains stable for byte-identical
    snapshot evidence rebinding. Timing and runtime instrumentation extend the
    explicit child PYTHONPATH and plugin set without reviving removed ambient
    values. The real chain-refresh reproduction no longer creates a snapshot
    .venv; it continues to reject genuine generated-package writes through the
    existing fail-closed material-write guard.
  lessons:
