      summary: >-
        Subprocess isolation requires passing one explicit environment through
        preparation, capability, identity, freshness, and execution paths;
        temporarily changing os.environ would permit policy bleed between
        concurrent evidence workers.
      tags: [runtime-evidence, subprocess, environment, snapshots]
      paths:
