# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Preserve target contracts, artifact order, and tracked paths when materializing a file-scoped chain merge"
type: fix
created: "2026-08-17T04:18:49Z"
supersedes:
  - fix-chain-merge-full-artifact-spec
metadata:
  priority: critical
  tags:
    - chain-merge
    - contract-equivalence
    - supersession
    - validation-trust
description: |
  File-scoped chain merge now preserves complete ArtifactSpecs for carried
  non-target files, but it still replaces the target file's effective contract
  with structurally inferred snapshot declarations. That weakens descriptions,
  parameters, types, default-hook flags, and other behavioral metadata, and it
  changes first-seen artifact order. Private-only carried files are also
  dropped entirely, which silently removes their path ownership.

  Materialization must retain every structurally matched existing public target
  ArtifactSpec exactly and in the active chain's first-seen order, then append
  genuinely new public artifacts with their complete inferred specs in source
  order. Exact-signature declarations that structural snapshot evidence cannot
  match remain an atomic refusal rather than being weakened. The same ordered
  equivalence must hold through the post-apply active chain and a subsequent
  materialization. Because schema-valid FileSpecs require at least one artifact,
  a carried writable path left with no public artifacts after private filtering
  remains tracked as an explicit scope entry instead of disappearing. Existing
  carried-contract preservation, private artifact filtering, target and carried
  imports, other scope/read/delete obligations, validation commands,
  acceptance, removals, and atomic refusals remain unchanged.

  The public apply function accepts an optional ValidatorRegistry dependency and
  forwards it to snapshot generation. The default remains the built-in registry,
  while the seam makes plugin-provided exact-signature evidence testable without
  global entry-point mutation or implementation-private monkeypatching.
temptations:
  - risk: "Do not replace all target artifacts with the generated structural snapshot."
    instead: "Keep the active chain's complete public target specs first and append only snapshot keys that the chain did not already declare."
  - risk: "Do not compare target artifacts as unordered identity maps."
    instead: "Assert whole ArtifactSpec tuple equality before and after apply so both values and first-seen order are contractual."
  - risk: "Do not discard a carried writable path merely because all of its declared artifacts are private, or emit an invalid empty FileSpec."
    instead: "Filter private artifacts and retain ownership through a deterministic files.scope entry, which is the schema-valid artifact-free representation."
  - risk: "Do not make the consolidation snapshots or current repository state part of the implementation."
    instead: "Fix the generic materializer against an isolated temporary-project regression and regenerate consolidation output only after review."
