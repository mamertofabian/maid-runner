schema: '2'
goal: Keep promoted YAML valid when literal descriptions confuse indentation guessing
type: fix
created: '2026-10-20T23:57:11Z'
description: 'Confirmed source report 20261020-222455-si-trace-promote-indent.md: valid literal description
  lines containing a continuation colon and dash bullet produce negative ruamel indentation guesses. Public
  promotion without a lock publishes invalid YAML; locked promotion rolls back during migration. Retain
  source literal content and normal presentation while accepting only valid sequence indentation/offset
  guesses; use supported renderer defaults for invalid guesses. Validate generated YAML through the existing
  safe parser before publishing so rendering errors remain loud and cannot delete the valid draft or alter
  an existing lock. Preserve schema/input errors, self-reference rewrites, migration/evidence/lifecycle
  semantics and rollback. No description rewriting, bullet substitution, new parser, schema/flag changes
  or lock-gate bypass. Four public API cases exercise exact reconstructed block scalar with locked and
  unlocked promotion, genuine preexisting lock red/self-reference migration, ordinary nondefault valid
  indentation, and malformed-input preservation. Unlocked style/input cases use the existing no-run promotion
  API to isolate rendering; the locked case captures genuine red before promotion and recaptures it after
  self-referencing command migration. These fixture operations do not claim implementation completion.
  Production changes remain bounded renderer safety wiring behind unchanged cmd_manifest. Recall matched
  promotion-red preservation, 073-01 lock migration, multiline-style and output-routing Outcomes. Apply
  literal-content/style preservation, fail-closed transaction order and exact command-bound evidence;
  recapture self-referencing command changes rather than normalizing red. Output-routing/from-diff flags
  and historical unrelated backlog are outside this renderer fix.'
temptations:
- risk: Fix the input by deleting literal lines, replacing dash bullets, flattening description or disabling
    lock migration.
  instead: Keep parsed description/files/test commands intact through public locked/unlocked promotion
    and preserve genuine migrated red evidence.
- risk: Ignore all indentation guesses or silently accept malformed YAML to avoid this one failure.
  instead: Keep valid nondefault sequence presentation, bound only invalid guessed parameters and safe-parse
    rendered output before writes; malformed input must leave draft/lock untouched.
