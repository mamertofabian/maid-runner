  - uv run python -m pytest -q tests/cli/test_verify_deep_evidence_reuse.py tests/cli/test_artifact_coverage_evidence_cache.py tests/core/test_runtime_evidence.py
outcome:
  status: completed
  completed_at: "2026-08-18T22:34:22Z"
  summary: "Runtime artifact-coverage content identity now follows Git tracked/non-ignored selection while binding every effective ignore source and interpretation setting, so ignored generated advisory files remain harmless without weakening mutation detection."
  rationale: "The overnight release gate was interrupted and its resumed run then failed because generated `.claude/insights` files were locally excluded by Git but still hashed. The fix uses Git's content selection, sanitizes ambient repository pointers, binds effective Git configuration plus local/global/in-tree ignore metadata, and falls back to the conservative filesystem walk whenever Git identity cannot be established safely."
  lessons:
    - lesson_type: validation-trust
      summary: "A Git-aware content digest must bind both the selected paths and every rule/configuration source that can change selection; hashing paths alone creates fail-open holes when ignore metadata changes during execution."
      tags: [artifact-coverage, gitignore, fail-closed]
      paths:
        - maid_runner/core/runtime_evidence.py
        - tests/cli/test_verify_git_ignored_runtime_content.py
    - lesson_type: test-design
      summary: "Ignored-output acceptance needs paired adversarial controls for unignored output, tracked-but-ignored files, ambient repository pointers, mutable exclude files, self-ignored `.gitignore`, and ignore interpretation settings."
      tags: [behavioral-contract, git, regression]
      paths:
        - tests/cli/test_verify_git_ignored_runtime_content.py
