# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Keep Git-ignored generated files from invalidating runtime artifact-coverage evidence"
type: fix
created: "2026-08-18T22:03:20Z"
metadata:
  status: implementation-ready
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags: [verify, artifact-coverage, runtime-evidence, gitignore]
description: |
  Runtime artifact-coverage collection compares a project content digest before
  and after instrumented test execution. The digest currently walks every file
  except a fixed directory list, so generated advisory files intentionally
  excluded by Git can make a valid deep gate fail after hours of work. Define
  project content as tracked files plus non-ignored untracked files whenever the
  project root belongs to a Git worktree. Honor both repository ignore rules and
  local Git exclusions, while continuing to hash tracked files even if a later
  ignore rule matches them. For roots outside Git, retain the existing bounded
  filesystem exclusion behavior. Remove ambient Git repository-pointer
  variables from the read-only content query so caller state cannot redirect
  it to another worktree or index. Bind the worktree's local exclude metadata
  into the digest as well as its selected content, so an instrumented command
  cannot hide a newly created file by changing `.git/info/exclude`, an
  effective `core.excludesFile`, or an active in-tree `.gitignore` mid-run.
  Bind the complete effective Git configuration that interprets those sources,
  so settings such as `core.ignoreCase` cannot change selection invisibly.

  This is an additive behavioral strengthening of the existing public verify
  command with no signature change and therefore chain-merges rather than
  superseding the earlier runtime-evidence contracts. The fail-closed boundary
  remains intact: an instrumented command that creates or changes an unignored
  project file must still fail artifact coverage visibly.
temptations:
  - risk: "Do not special-case `.claude/insights` or any one generated directory."
    instead: "Derive the content set from Git's tracked and standard non-ignored path semantics so `.gitignore` and `.git/info/exclude` behave consistently."
  - risk: "Do not omit tracked files merely because an ignore rule now matches their path."
    instead: "Include Git index entries and non-ignored untracked files, then hash existing regular-file content deterministically."
  - risk: "Do not turn an unavailable or failed Git query into an empty digest."
    instead: "Fall back to the existing filesystem walk and canonical fixed exclusions when Git cannot provide the content set."
  - risk: "Do not weaken the mutation guard for ordinary untracked output."
    instead: "Keep the unignored generated-file negative control failing at the public verify command with the existing content-change diagnostic."
  - risk: "Do not trust ambient Git repository pointers or mutable ignore metadata outside the selected path list."
    instead: "Sanitize repository-pointer environment variables for the Git query and bind effective Git configuration, local excludes, the effective core.excludesFile, and active in-tree .gitignore bytes into the content digest."
