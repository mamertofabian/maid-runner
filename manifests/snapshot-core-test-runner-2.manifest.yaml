  - path: maid_runner/daemon/cache.py
    artifacts:
    - kind: class
      name: DaemonValidationCacheScope
      description: Daemon-owned ValidationEngine and long-lived validation cache scope
        with request-level hit/miss accounting.
    - kind: function
      name: content_cache_key
      args:
      - name: content
        type: bytes
      - name: version
        type: str
      returns: str
    - kind: method
      name: clear
      of: DaemonValidationCacheScope
      returns: None
    - kind: method
      name: stats
      of: DaemonValidationCacheScope
      returns: dict
    - kind: method
      name: validate
      description: Drop the re-export resolution cache at the start of every daemon
        request. The daemon holds one validation scope open for its whole lifetime,
        so the scope-boundary clear never fires after construction and the cache would
        otherwise answer from a resolution taken before the source changed. Per-request
        clearing keeps the full intra-run benefit because every resolution burst happens
        inside one request.
      of: DaemonValidationCacheScope
      args:
      - name: manifest_path
        type: str
      - name: mode
        type: str
        default: '"implementation"'
      - name: use_chain
        type: bool
        default: 'True'
      - name: manifest_dir
        type: str
        default: '"manifests/"'
      - name: check_assertions
        type: bool
        default: 'False'
      - name: check_stubs
        type: bool
        default: 'False'
      - name: fail_on_warnings
        type: bool
        default: 'False'
      returns: dict
  - path: maid_runner/core/worktree.py
    artifacts:
    - kind: attribute
      name: commitish
      description: The declared metadata.maid_task_base value, stripped.
      of: BaselineDeclaration
      type: str
    - kind: attribute
      name: manifest_path
      description: Project-relative path of the manifest that declares the baseline.
      of: BaselineDeclaration
