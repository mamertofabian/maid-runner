    - kind: attribute
      name: MANIFEST_HEADER_COMMENT
      description: Canonical ASCII-only, flush-left four-line comment banner stating
        what a manifest is, that it is not required to build or run the project, and
        the https://github.com/mamertofabian/maid-runner pointer. Each line starts
        with '#' and the text ends with a newline.
      type: str
    - kind: attribute
      name: path
      of: ManifestLoadError
    - kind: attribute
      name: reason
      of: ManifestLoadError
    - kind: attribute
      name: errors
      of: ManifestSchemaError
    - kind: attribute
      name: path
      of: ManifestSchemaError
    - kind: class
      name: ManifestLoadError
    - kind: class
      name: ManifestSchemaError
      bases:
      - Exception
    - kind: function
      name: backfill_manifest_header
      description: Read the manifest text, apply prepend_manifest_header, and write
        it back only when the banner was missing. Returns True when the file was updated,
        False when it already had the banner. Raises OSError to the caller so the
        CLI layer can decide advisory handling; performs no YAML round-trip so author
        formatting is untouched.
      args:
      - name: manifest_path
        type: Union[str, Path]
      returns: bool
    - kind: function
      name: load_manifest
      args:
      - name: path
        type: Union[str, Path]
      returns: Manifest
    - kind: function
      name: load_manifest_raw
      description: Parse manifest YAML with the libyaml-backed loader when the installed
        pyyaml provides it, falling back to the pure-Python loader, with duplicate-key
        rejection registered on whichever loader is selected.
      args:
      - name: path
        type: Union[str, Path]
      returns: dict
    - kind: function
      name: prepend_manifest_header
      description: 'Return rendered YAML with MANIFEST_HEADER_COMMENT inserted flush-left
        above the first YAML key. Idempotent: returns rendered unchanged when the
        banner already appears in the leading comment block, detected by scanning
        only that block rather than the whole document so a manifest whose body quotes
        the banner still gets one, and comparing each line with trailing whitespace
        stripped so an editor-scuffed banner is still recognized rather than stacked.
        Inserts the banner immediately after a leading ''# draft-kind:'' or ''# archive-kind:''
        marker line when one is present, otherwise at the very top. Makes no other
        modification to rendered.'
