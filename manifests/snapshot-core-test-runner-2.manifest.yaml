        the outermost validation scope is entered and exited.
      of: ValidationEngine
      returns: AbstractContextManager[None]
  - path: maid_runner/core/chain.py
    artifacts:
    - kind: attribute
      name: all_manifests
      of: ManifestChain
      type: list[Manifest]
    - kind: attribute
      name: load_errors
      of: ManifestChain
      type: list[ValidationError]
    - kind: class
      name: ManifestChain
    - kind: function
      name: clear_manifest_chain_cache
      description: Drop all cached ManifestChain instances; called at the end of each
        CLI invocation.
      returns: None
    - kind: function
      name: get_cached_manifest_chain
      description: Return a per-invocation cached ManifestChain for the given manifest
        directory, rebuilding when the on-disk signature changes.
      args:
      - name: manifest_dir
        type: Union[str, Path]
      - name: project_root
        type: Optional[Path]
        default: None
      returns: ManifestChain
    - kind: method
      name: active_manifests
      of: ManifestChain
      returns: list[Manifest]
    - kind: method
      name: all_read_only_paths
      of: ManifestChain
      returns: set[str]
    - kind: method
      name: all_tracked_paths
      of: ManifestChain
      returns: set[str]
    - kind: method
      name: audit_supersession_artifacts
      of: ManifestChain
      args:
      - name: lock
        type: Optional[GrandfatherLock]
        default: None
      returns: list[ValidationError]
    - kind: method
      name: diagnostics
      description: Return normal chain diagnostics while omitting E118/E119 entries
        that come only from parseable pre-2026-06-03 legacy created values.
      of: ManifestChain
      returns: list[ValidationError]
    - kind: method
      name: event_log
      of: ManifestChain
      returns: list[Manifest]
    - kind: method
      name: event_log_until
      of: ManifestChain
      args:
      - name: sequence_number
        type: Optional[int]
      - name: version_tag
        type: Optional[str]
      returns: list[Manifest]
    - kind: method
      name: file_mode_for
      of: ManifestChain
      args:
      - name: path
        type: str
      returns: Optional[FileMode]
    - kind: method
      name: inactive_manifest_diagnostics
      description: Reports E109 with copyable lifecycle marker choices tailored to
        draft or archive inventory.
      of: ManifestChain
      returns: list[ValidationError]
    - kind: method
      name: is_superseded
      of: ManifestChain
      args:
      - name: slug
        type: str
      returns: bool
    - kind: method
      name: lifecycle_metadata_diagnostics
      description: Return diagnostics for active manifests that declare inactive lifecycle
        metadata statuses.
      of: ManifestChain
      returns: list[ValidationError]
    - kind: method
      name: manifests_for_file
      of: ManifestChain
      args:
      - name: path
        type: str
      returns: list[Manifest]
    - kind: method
      name: merged_artifacts_for
      description: Return latest effective ArtifactSpecs in canonical contract-key
        order independent of active owner topology.
      of: ManifestChain
      args:
      - name: path
        type: str
      returns: list[ArtifactSpec]
    - kind: method
      name: reload
      description: Invalidate the writable-path index alongside the existing active
        manifest cache so a reloaded chain cannot answer from a stale index.
      of: ManifestChain
      returns: None
    - kind: method
      name: replay_until
      of: ManifestChain
      args:
      - name: sequence_number
        type: Optional[int]
      - name: version_tag
        type: Optional[str]
      returns: dict[str, list[ArtifactSpec]]
    - kind: method
      name: superseded_by
      of: ManifestChain
      args:
      - name: slug
        type: str
      returns: Optional[str]
    - kind: method
      name: superseded_manifests
      of: ManifestChain
      returns: list[Manifest]
    - kind: method
      name: validate_supersession_integrity
      of: ManifestChain
      returns: list[ValidationError]
  - path: maid_runner/validators/registry.py
    artifacts:
    - kind: attribute
      name: extension
      of: UnsupportedLanguageError
    - kind: attribute
      name: detail
      of: ValidatorRecord
      type: str | None
    - kind: attribute
      name: extensions
      of: ValidatorRecord
      type: tuple[str, ...]
    - kind: attribute
      name: name
      of: ValidatorRecord
      type: str
    - kind: attribute
      name: source
      of: ValidatorRecord
      type: str
    - kind: attribute
      name: status
      of: ValidatorRecord
      type: str
    - kind: class
      name: UnsupportedLanguageError
      description: Public missing-validator exception whose message reuses the centralized
        plugin-discovery guidance.
    - kind: class
      name: ValidatorRecord
      description: 'Inspectable record of one registered or skipped validator: name,
        claimed extensions, source, status, and optional detail.'
    - kind: class
      name: ValidatorRegistry
    - kind: function
      name: auto_register
      args:
      - name: registry
        type: ValidatorRegistry
      returns: ValidatorRegistry
    - kind: method
      name: clear
      description: Clear validator registrations, cached instances, validator records,
        and plugin diagnostics.
      of: ValidatorRegistry
      returns: None
    - kind: method
      name: clone
      description: Copy registered validator classes, validator records, and plugin
        diagnostics while leaving cached validator instances isolated.
      of: ValidatorRegistry
      returns: ValidatorRegistry
    - kind: method
      name: get
      of: ValidatorRegistry
      args:
      - name: file_path
        type: Union[str, Path]
      returns: BaseValidator
    - kind: method
      name: has_validator
      of: ValidatorRegistry
      args:
      - name: file_path
        type: Union[str, Path]
      returns: bool
    - kind: method
      name: has_validator_for_extension
      of: ValidatorRegistry
      args:
      - name: ext
        type: str
      returns: bool
    - kind: method
      name: plugin_diagnostics
      description: Structured E902 VALIDATOR_PLUGIN_LOAD_FAILURE and E903 VALIDATOR_PLUGIN_CONFLICT
        warnings naming the affected distributions.
      of: ValidatorRegistry
      returns: list[ValidationError]
    - kind: method
      name: register
      of: ValidatorRegistry
      args:
      - name: validator_class
        type: type[BaseValidator]
      returns: None
    - kind: method
      name: supported_extensions
      of: ValidatorRegistry
      returns: set[str]
    - kind: method
      name: validator_records
      description: Deterministically ordered records for built-ins (first) and plugins
        (by distribution name), including conflict, error, and disabled entries.
      of: ValidatorRegistry
      returns: tuple[ValidatorRecord, ...]
    - kind: method
      name: with_builtin_validators
      description: Construct the registry with built-ins, then discover maid_runner.validators
        entry points once with deterministic ordering, built-in-wins precedence, isolated
        failures, and the kill switch.
      of: ValidatorRegistry
      returns: ValidatorRegistry
