# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Snapshot of maid_runner/core/test_runner.py
type: snapshot
files:
  create:
  - path: maid_runner/core/ts_module_paths.py
    artifacts:
    - kind: function
      name: clear_ts_resolution_cache
      returns: None
    - kind: function
      name: resolve_relative_ts_import
      args:
      - name: specifier
        type: str
      - name: importer_module
        type: str
      returns: str
    - kind: function
      name: resolve_ts_import
      description: Resolve Svelte state-module tsconfig aliases to the same canonical
        identity as direct `.svelte` imports.
      args:
      - name: specifier
        type: str
      - name: importer_module
        type: str
      - name: project_root
        type: Path
      returns: str
    - kind: function
      name: resolve_ts_reexport
      description: Resolve Svelte state-module barrel exports without changing ordinary
        TypeScript module-entry precedence.
      args:
      - name: module
        type: str
      - name: name
        type: str
      - name: project_root
        type: Path
      returns: Optional[tuple[str, str]]
    - kind: function
      name: ts_file_to_module_path
      description: Canonicalize `.svelte.ts` and `.svelte.js` state-module files to
        the same extensionless identity produced by their `.svelte` runtime imports.
      args:
      - name: file_path
        type: Union[str, Path]
      - name: project_root
        type: Path
      returns: str
  - path: tests/core/validation/test_pytest_command_normalization.py
    artifacts:
    - kind: test_function
      name: test_looks_like_pytest_invocation_accepts_unbatchable_pytest_aliases
      source_scenario: A command looks like pytest even when it is not batchable by
        the narrow normalizer.
      actions:
      - type: api_call
        subject:
          export: _looks_like_pytest_invocation
      expected:
        behavior: The helper recognizes pytest aliases and python -m pytest, and rejects
          unrelated commands.
    - kind: test_function
      name: test_non_combinable_pytest_options_include_stateful_or_fail_fast_flags
      source_scenario: A pytest option tuple contains fail-fast, last-failed, maxfail,
        or ordinary reporting options.
      actions:
      - type: api_call
        subject:
          export: _has_non_combinable_pytest_options
      expected:
        behavior: Stateful and fail-fast options are non-combinable while ordinary
          reporting options remain combinable.
    - kind: test_function
      name: test_normalize_pytest_command_accepts_direct_and_python_module_forms
      source_scenario: Direct pytest and uv-wrapped python -m pytest commands include
        explicit targets and safe options.
      actions:
      - type: api_call
        subject:
          export: _normalize_pytest_command
      expected:
        behavior: Normalization preserves the command prefix, target, and options
          exactly.
    - kind: test_function
      name: test_normalize_pytest_command_preserves_maxfail_value_option_pair
      source_scenario: A python3.x -m pytest command uses --maxfail with a following
        value.
      actions:
      - type: api_call
        subject:
          export: _normalize_pytest_command
      expected:
        behavior: Normalization keeps --maxfail and its value together in the options
          tuple.
    - kind: test_function
      name: test_normalize_pytest_command_rejects_unbatchable_shapes
      source_scenario: Commands are empty, missing targets, missing option values,
        using py.test, or using another test runner.
      actions:
      - type: api_call
        subject:
          export: _normalize_pytest_command
      expected:
        behavior: Normalization returns None so batching policy can fail closed.
    - kind: test_function
      name: test_pytest_behavior_options_drop_only_verbosity_flags
      source_scenario: A pytest option tuple mixes verbosity and behavior-affecting
        options.
      actions:
      - type: api_call
        subject:
          export: _pytest_behavior_options
      expected:
        behavior: Only verbosity flags are removed.
    - kind: test_function
      name: test_python_command_detection_preserves_uv_resolution_boundary
      source_scenario: Command resolution needs to know which executable names belong
        to the Python ecosystem.
      actions:
      - type: api_call
        subject:
          export: _is_python_command
      expected:
        behavior: The helper preserves the current Python command classification.
  - path: tests/core/validation/test_vitest_command_normalization.py
    artifacts:
    - kind: test_function
      name: test_normalize_vitest_command_accepts_npx_and_direct_run_forms
      source_scenario: Vitest commands use `npx vitest run` and direct `vitest run`
        with safe reporter options.
      actions:
      - type: api_call
        subject:
          export: _normalize_vitest_command
      expected:
        behavior: Normalization preserves the command prefix, target, and options
          exactly.
    - kind: test_function
      name: test_normalize_vitest_command_preserves_value_and_standalone_flags
      source_scenario: A Vitest command combines safe value flags and safe standalone
        flags.
      actions:
      - type: api_call
        subject:
          export: _normalize_vitest_command
      expected:
        behavior: Normalization keeps value flag pairs and standalone flags in order.
    - kind: test_function
      name: test_normalize_vitest_command_rejects_unbatchable_shapes
      source_scenario: Unsupported pnpm and Vitest forms must remain non-batchable.
      actions:
      - type: api_call
        subject:
          export: _normalize_vitest_command
      expected:
        behavior: The existing rejection coverage is revised so unsupported pnpm forms
          still fail closed while supported run forms pass.
  - path: tests/core/validation/test_test_command_batching.py
    artifacts:
    - kind: test_function
      name: test_batch_compatible_test_commands_combines_pytest_verbosity_differences
      source_scenario: Compatible pytest commands differ only by verbosity flags.
      actions:
      - type: api_call
        subject:
          export: _batch_compatible_test_commands
      expected:
        behavior: The helper combines targets into one pytest command and drops verbosity-only
          options.
    - kind: test_function
      name: test_batch_compatible_test_commands_combines_vitest_targets_with_same_options
      source_scenario: Existing direct/npx Vitest batching behavior must remain stable
        while pnpm support is added.
      actions:
      - type: api_call
        subject:
          export: _batch_compatible_test_commands
      expected:
        behavior: Direct and npx Vitest commands still batch exactly as before.
    - kind: test_function
      name: test_batch_group_key_normalizes_uv_pytest_runner_aliases_in_uv_project
      source_scenario: A uv-managed project uses both `uv run pytest` and `uv run
        python -m pytest`.
      actions:
      - type: api_call
        subject:
          export: _batch_group_key
      expected:
        behavior: Both command forms produce the same pytest group key.
    - kind: test_function
      name: test_can_batch_rejects_empty_mixed_and_non_combinable_commands
      source_scenario: Command groups are empty, mixed with non-test commands, or
        use stateful pytest options.
      actions:
      - type: api_call
        subject:
          export: _can_batch
      expected:
        behavior: The helper rejects those groups as non-batchable.
    - kind: test_function
      name: test_dedupe_commands_keeps_stateful_pytest_duplicates
      source_scenario: Duplicate implementation commands include safe pytest commands,
        stateful pytest commands, and safe non-pytest commands.
      actions:
      - type: api_call
        subject:
          export: _dedupe_commands
      expected:
        behavior: The helper deduplicates safe commands and preserves repeated stateful
          pytest commands.
    - kind: test_function
      name: test_prune_covered_pytest_commands_keeps_focused_targets_over_directory_target
      source_scenario: A broad pytest directory target and focused file target appear
        in the same command group.
      actions:
      - type: api_call
        subject:
          export: _prune_covered_pytest_commands
      expected:
        behavior: The helper drops the broad covered target and keeps the focused
          target plus unrelated commands.
  - path: tests/core/validation/test_maid_validate_command_cache.py
    artifacts:
    - kind: test_function
      name: test_parse_maid_validate_command_accepts_quiet_flag
      source_scenario: A quiet validate command uses the same supported command shape
        that MAID manifests now commonly declare.
      actions:
      - type: api_call
        subject:
          function: _parse_maid_validate_command
      expected:
        behavior: 'The parsed command includes `quiet: True` and remains cache-compatible.'
    - kind: test_function
      name: test_parse_maid_validate_command_accepts_supported_flags
      source_scenario: A uv-wrapped `maid validate` command uses manifest path, mode,
        manifest-dir, json, and no-chain flags.
      actions:
      - type: api_call
        subject:
          export: _parse_maid_validate_command
      expected:
        behavior: The helper returns the same parsed fields as the legacy parser.
    - kind: test_function
      name: test_parse_maid_validate_command_rejects_unsupported_shapes
      source_scenario: Commands are empty, not validate commands, have missing values,
        invalid modes, unknown flags, or multiple manifest paths.
      actions:
      - type: api_call
        subject:
          export: _parse_maid_validate_command
      expected:
        behavior: The helper returns None so test_runner can fall back to subprocess
          execution.
    - kind: test_function
      name: test_run_cached_maid_validate_command_clears_manifest_chain_between_direct_calls
      source_scenario: _run_cached_maid_validate_command is called directly twice
        in one Python process with unchanged manifests.
      actions:
      - type: api_call
        subject:
          export: _run_cached_maid_validate_command
      expected:
        behavior: The command-level cache reuses the ValidationEngine but does not
          leak a ManifestChain across separate direct calls.
    - kind: test_function
      name: test_run_cached_maid_validate_command_json_takes_precedence_over_quiet
      source_scenario: A cached single-manifest validation command includes both `--json`
        and `--quiet`.
      actions:
      - type: api_call
        subject:
          function: _run_cached_maid_validate_command
      expected:
        behavior: 'The returned result succeeds and stdout is valid JSON with `success:
          true`, proving JSON mode takes precedence over quiet formatting.'
    - kind: test_function
      name: test_run_cached_maid_validate_command_preserves_quiet_batch_success_output
      source_scenario: A quiet cached directory-wide validation succeeds.
      actions:
      - type: api_call
        subject:
          function: _run_cached_maid_validate_command
      expected:
        behavior: The returned result succeeds with exit code 0 and stdout matching
          the subprocess newline shape, proving quiet is passed into the batch formatter
          without changing `maid test --json` payloads.
    - kind: test_function
      name: test_run_cached_maid_validate_command_preserves_quiet_failure_output
      source_scenario: A quiet cached single-manifest validation fails with a real
        validation error.
      actions:
      - type: api_call
        subject:
          function: _run_cached_maid_validate_command
      expected:
        behavior: The returned result fails with exit code 1, includes the quiet error-code/message
          diagnostic, and omits non-quiet summary text such as `FAIL <slug>` and `Mode:`.
    - kind: test_function
      name: test_run_cached_maid_validate_command_preserves_quiet_success_output
      source_scenario: A quiet cached single-manifest validation succeeds.
      actions:
      - type: api_call
        subject:
          function: _run_cached_maid_validate_command
      expected:
        behavior: The returned result succeeds with exit code 0 and empty stdout.
    - kind: test_function
      name: test_run_cached_maid_validate_command_returns_none_for_non_validate_command
      source_scenario: A candidate command is a normal test runner command.
      actions:
      - type: api_call
        subject:
          export: _run_cached_maid_validate_command
      expected:
        behavior: The helper returns None instead of synthesizing a result.
    - kind: test_function
      name: test_run_cached_maid_validate_command_reuses_engine_and_chain_cache
      source_scenario: Two cacheable validate commands run against the same existing
        manifest directory.
      actions:
      - type: api_call
        subject:
          export: _run_cached_maid_validate_command
      expected:
        behavior: The helper reuses the same cached engine and manifest chain objects.
    - kind: test_function
      name: test_run_cached_maid_validate_command_validates_without_existing_chain_dir
      source_scenario: A command validates a standalone manifest with --manifest-dir
        pointing at a missing directory.
      actions:
      - type: api_call
        subject:
          export: _run_cached_maid_validate_command
      expected:
        behavior: The helper returns a successful TestRunResult and does not cache
          a missing chain.
    - kind: test_function
      name: test_run_tests_executes_quiet_maid_validate_commands_in_process
      source_scenario: An active manifest declares `uv run maid validate manifests/target.manifest.yaml
        --mode schema --quiet` as its validate command.
      actions:
      - type: api_call
        subject:
          function: run_tests
      expected:
        behavior: '`run_tests` returns a successful `TestRunResult` for the quiet
          validate command without invoking `run_command` subprocess fallback.'
    - kind: test_function
      name: test_run_tests_keeps_unsupported_validate_flags_on_subprocess_path
      source_scenario: An active manifest declares a `maid validate` command with
        an unsupported flag.
      actions:
      - type: api_call
        subject:
          function: run_tests
      expected:
        behavior: The unsupported command still reaches `run_command`, proving the
          cache parser remains fail-closed.
  - path: tests/core/validation/test_test_command_execution.py
    artifacts:
    - kind: test_function
      name: test_missing_supervisor_status_fails_closed
    - kind: test_function
      name: test_required_descendant_ownership_fails_closed_when_unsupported
    - kind: test_function
      name: test_run_test_command_converts_completed_process
      source_scenario: subprocess.run returns a completed process with non-zero exit
        code, stdout, and stderr.
      actions:
      - type: api_call
        subject:
          export: _run_test_command
      expected:
        behavior: The helper returns a TestRunResult preserving command, stream, exit
          code, stdout, stderr, and duration.
    - kind: test_function
      name: test_run_test_command_maps_timeout_to_exit_code_minus_one
      source_scenario: subprocess.run raises TimeoutExpired.
      actions:
      - type: api_call
        subject:
          export: _run_test_command
      expected:
        behavior: The helper returns a failed TestRunResult with exit_code -1 and
          timeout stderr text.
    - kind: test_function
      name: test_run_test_command_maps_unexpected_exception_to_exit_code_minus_two
      source_scenario: subprocess.run raises a non-timeout exception.
      actions:
      - type: api_call
        subject:
          export: _run_test_command
      expected:
        behavior: The helper returns a failed TestRunResult with exit_code -2 and
          the exception message.
    - kind: test_function
      name: test_run_test_command_scopes_environment_overrides_to_child
    - kind: test_function
      name: test_run_test_command_strips_pytest_addopts_from_subprocess_env
      source_scenario: The parent process would otherwise inject a pytest selector
        through PYTEST_ADDOPTS.
      actions:
      - type: api_call
        subject:
          export: _run_test_command
      expected:
        behavior: The subprocess environment passed to subprocess.run does not contain
          PYTEST_ADDOPTS.
    - kind: test_function
      name: test_supervisor_owns_descendants_without_global_proc_enumeration
    - kind: test_function
      name: test_test_command_environment_removes_ambient_pytest_addopts
      source_scenario: The parent process has PYTEST_ADDOPTS and unrelated environment
        variables.
      actions:
      - type: api_call
        subject:
          export: _test_command_environment
      expected:
        behavior: The helper removes only PYTEST_ADDOPTS.
    - kind: test_function
      name: test_timeout_cleanup_failure_fails_closed
    - kind: test_function
      name: test_timeout_reaps_detached_child_created_by_non_main_thread
    - kind: test_function
      name: test_timeout_terminates_and_reaps_descendant_process_group
    - kind: test_function
      name: test_unavailable_procfs_fails_descendant_ownership
  - path: maid_runner/core/_pytest_worker_execution.py
    artifacts:
    - kind: attribute
      name: behavior_group_digest
      of: PreparedPytestCommand
      type: str | None
    - kind: attribute
      name: command
      of: PreparedPytestCommand
      type: tuple[str, Ellipsis]
    - kind: attribute
      name: environment_overrides
      of: PreparedPytestCommand
      type: Mapping[str, str]
    - kind: attribute
      name: input_digest
      of: PreparedPytestCommand
      type: str | None
    - kind: attribute
      name: notice
      of: PreparedPytestCommand
      type: TestSchedulingNotice | None
    - kind: attribute
      name: selected_nodeids
      of: PreparedPytestCommand
      type: tuple[str, Ellipsis]
    - kind: attribute
      name: error
      of: PytestCollectionResult
      type: str | None
    - kind: attribute
      name: nodeids
      of: PytestCollectionResult
      type: tuple[str, Ellipsis]
    - kind: attribute
      name: error
      of: PytestRunnerCapabilities
      type: str | None
    - kind: attribute
      name: xdist_available
      of: PytestRunnerCapabilities
      type: bool
    - kind: attribute
      name: xdist_version
      of: PytestRunnerCapabilities
      type: str | None
    - kind: attribute
      name: command_group
      of: TestSchedulingNotice
      type: tuple[str, Ellipsis]
    - kind: attribute
      name: mode
      of: TestSchedulingNotice
      type: str
    - kind: attribute
      name: reason
      of: TestSchedulingNotice
      type: str
    - kind: attribute
      name: workers
      of: TestSchedulingNotice
      type: int | str
    - kind: class
      name: PreparedPytestCommand
      description: One resolved command, child-only plugin environment, exact selection/identity
        evidence, and cleanup lifecycle.
    - kind: class
      name: PytestCollectionResult
      description: Exact node IDs collected in the resolved consumer environment or
        a typed collection error.
    - kind: class
      name: PytestRunnerCapabilities
      description: Resolved consumer-runner xdist capability and probe diagnostic.
    - kind: class
      name: TestSchedulingNotice
      description: Stable automation-visible scheduling decision or fallback notice.
    - kind: function
      name: apply_pytest_worker_decision
      description: Produces one normalized command pinned to accepted loadscope/count
        evidence, visibly falling back or failing on unproven injection without changing
        selected targets.
      args:
      - name: command
        type: tuple[str, Ellipsis]
      - name: decision
        type: PytestWorkerDecision
      - name: capabilities
        type: PytestRunnerCapabilities
      - name: dist_mode
        type: str
      - name: accepted_worker_counts
        type: tuple[int, Ellipsis]
      - name: max_processes
        type: int
      - name: command_jobs
        type: int
      - name: project_root
        type: Path
      - name: explicit
        type: bool
      returns: tuple[tuple[str, Ellipsis], TestSchedulingNotice]
    - kind: function
      name: build_pytest_timing_identity
      description: Builds deterministic behavior-group and repository/test/config
        content digests without storing outcomes.
      args:
      - name: command
        type: tuple[str, Ellipsis]
      - name: project_root
        type: Path
      returns: tuple[str, str]
    - kind: function
      name: collect_pytest_nodeids
      description: Collects the exact current node set in the resolved consumer pytest
        environment and fails closed on incomplete or invalid evidence.
      args:
      - name: resolved_command
        type: tuple[str, Ellipsis]
      - name: cwd
        type: Path
      returns: PytestCollectionResult
    - kind: function
      name: finalize_pytest_timing
      description: On a successful exact-complete run only, validates plugin evidence
        and atomically refreshes 121-06 history; otherwise discards it with a visible
        notice and always cleans temporary state.
      args:
      - name: prepared
        type: PreparedPytestCommand
      - name: result
        type: TestRunResult
      - name: project_root
        type: Path
      returns: TestSchedulingNotice | None
    - kind: function
      name: prepare_pytest_command
      description: Collects exact nodes, resolves explicit/config policy, probes the
        consumer runner, applies only accepted loadscope workers, and attaches child-only
        timing instrumentation.
      args:
      - name: resolved_command
        type: tuple[str, Ellipsis]
      - name: project_root
        type: Path
      - name: pytest_workers
        type: Union[Union[int, str], None]
      - name: command_jobs
        type: int
      returns: PreparedPytestCommand
    - kind: function
      name: probe_pytest_runner_capabilities
      description: Probes xdist in the exact resolved runner environment and returns
        a typed failure instead of guessing.
      args:
      - name: resolved_command
        type: tuple[str, Ellipsis]
      - name: cwd
        type: Path
      returns: PytestRunnerCapabilities
    - kind: function
      name: timing_plugin_environment
      description: Materializes a standalone plugin in a child-only import path so
        consumer environments never need maid-runner installed.
      args:
      - name: directory
        type: Path
      returns: tuple[dict[str, str], str]
  - path: maid_runner/core/_pytest_timing_plugin.py
    artifacts:
