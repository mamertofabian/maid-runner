  scope:
  - path: maid_runner/core/_tsconfig_paths.py
    reason: Align private tsconfig alias path canonicalization with the public Svelte
      state-module identity without adding or changing public artifacts.
  - path: maid_runner/core/_ts_export_scanner.py
    reason: Align private barrel path canonicalization and module-entry lookup with
      the public Svelte state-module identity while preserving ordinary TypeScript
      precedence.
  - path: maid_runner/core/diagnostics_registry.py
    reason: Extend the E310 repair recipe to name the default_hook acknowledgment
      and warn that acknowledging genuine stubs is a gaming pattern.
  - path: docs/troubleshooting.md
    reason: Document the default_hook exemption under the E310 troubleshooting entry.
  - path: tests/core/test_diagnostics_registry.py
    reason: Update pinned diagnostic recipe coverage for the new E310 repair recipe.
  - path: maid_runner/core/_dependency_index.py
    reason: Delegate per-file dependency collection to registered validator hooks.
  - path: maid_runner/core/_risk_metrics.py
    reason: Delegate per-file complexity collection to registered validator hooks.
  - path: docs/validator-plugin-authoring.md
    reason: Document the new public hook, its compatible default, raw-spelling boundary,
      and fail-loud override requirements.
  - path: maid_runner/core/_behavioral_validation.py
    reason: Carry ArtifactSpec.signature into behavioral identity matching.
  - path: maid_runner/core/_implementation_coverage.py
    reason: Apply the same exact-versus-representative evidence rule in implementation
      coverage.
  - path: maid_runner/core/validate_suggestions.py
    reason: Do not suggest a test as covering an exact changed overload when its reference
      is signatureless or different.
  - path: maid_runner/core/diff_scope.py
    reason: Retain multiple signed overloads as distinct diff identities, deterministically
      sort them, and treat discriminator changes as exact artifact changes.
  - path: maid_runner/core/manifest_from_diff.py
    reason: Render the optional signature in generated draft artifact declarations.
  - path: maid_runner/core/plan_lock.py
    reason: Prefix locked declarations with contract_key and include signature so
      overload-specific return/argument changes cannot be reassociated without changing
      the hash.
  - path: docs/maid_specs.md
    reason: Document the bounded direct-stdlib-base Python enum recognition rule and
      single-artifact member semantics.
  - path: docs/plans/maid-runner-performance-backlog.md
    reason: Records the re-benchmark that gated this performance pass and closes the
      backlog's open xdist candidate with the measured negative result, so the rejected
      slice is not re-proposed. Edited, not merely read.
