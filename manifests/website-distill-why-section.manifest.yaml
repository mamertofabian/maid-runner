      summary: "Two fresh maid-plan-reviewer passes. The first found a title check that failed valid quote markup, an incomplete claim map, section slices widened by the reorder, hollow-pass gaps, and tool chips that would break the type floor inside the answer. The second built the approved content in a scratch copy and found the retired-title check scanning <head> (og:description), so faithful content would fail, plus three unpinned claims. All were fixed before lock."
    - source: implementation-review-subagent
      severity: ready
      summary: "Ready to merge. Verified scope, complete supersession, minimal shared-test edits, and both re-sealed sibling locks (website-install-trust contract_delta empty with red evidence preserved; snapshot-cli-commands--main-2 manifest hash and legacy-baseline evidence byte-identical). Advisories applied afterwards: restored the '(or produce equivalent red evidence)' qualifier, tightened chip spacing, and turned the tools row into a labelled group (role=group with aria-labelledby; the old aria-label sat on a role-less div). Not applied: card 3 reuses the scope-arrows icon (aria-hidden, visual only); the 'Proven, not just covered' framing ('exercise the code, not just execute a line') survives only as the knockout mechanism; the declared behavior says eight retired titles while the test bans ten (the test is stricter); the snapshot re-seal also pinned five test files from its generated test list, two from earlier commits."
    - source: deferred-follow-ups
