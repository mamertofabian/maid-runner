  priority: medium
description: |
  The 2026-10-08 Impeccable critique found three consecutive sections
  restating the same four or five ideas: a Strengths band (five cards), Why MAID
  Runner (three problem cards), and Capabilities (six cards). Plan locks, red
  evidence, and scope each appeared three or four times across about 1500px,
  pushing Quick start to roughly 86% of the page on phones. The user approved a
  merged structure on 2026-10-08.

  Merge them into one Why section (#why-maid) led by "Governs the artifacts your
  agents produce — not just the prompts they follow." with exactly four
  problem-to-answer cards, keeping every existing product claim and adding none:
  - Plan drift → an approved plan lock becomes the contract an agent can't
    quietly rewrite; only declared files and operations are allowed (absorbs
    Scope expansion, Plan locks, Scope enforcement, and the contract half of
    Tamper-evident planning).
  - Test rewriting → tests must fail before the change, and deep verification can
    delete a function's body and require your tests to fail, so a gutted test
    can't pass (Knockout: Python, opt-in) (absorbs Red-phase evidence, Proven,
    not just covered, and the fake-passing-test half of Tamper-evident
    planning).
  - Self-reported "done" → structure, behavior, and scope are verified, then
    independently reviewed before handoff (absorbs Evidence-backed handoff,
    Three-stream validation, Independent review).
  - Rules that live in one tool → the manifest is the contract — a
    deterministic, AST-level contract, not prose an agent reinterprets — so MAID
    runs the same under Claude Code, Codex, Cursor, Windsurf, or any harness
    (absorbs Machine-checkable contracts, Portable across agents, and the tools
    row). The existing tool chips sit in this card but outside .problem-answer,
    so they keep their label size without falling under the 15px body-copy
    floor.
  Outcome learning remains workflow step 7. Each merged claim appears once on
  the page. Quick start moves directly after the
  workflow, and navigation becomes Why MAID Runner, Workflow, Quick start, MAID in
  practice.

  Supersession: removing the Strengths and Capabilities sections makes declared
  expectations in three committed contracts false (six capability cards, the
  strength titles, and the strength and capability body-copy roles in the
  typography browser test), and chain merges cannot remove expectations. This
  manifest supersedes fix-google-search-vercel-deployment,
  surface-knockout-strength, and website-readable-type-floor and redeclares their
  complete contract: every scope file, deletion, and test artifact carries over
  unchanged except the evolved expectations. test_homepage_renders_workflow_capabilities_tools_and_quickstart
  keeps its name although the Capabilities section is gone: renaming it fails
  chained behavioral validation of this draft (E600) because the superseded
  manifests stay active until promotion. Its declared behavior is updated
  instead; rename it in a later additive change. The new
  structure assertions live in tests/test_website_distilled_story.py. Moving Quick start also re-bounds
  the section slices in the shared tests: quick-start slices now end at
  #maid-in-practice and the practice slice at the final CTA, so each still
  checks only its own section. Editing the
  shared static-contract, bootstrap-installer, and typography test files changes hashes sealed by the
  active website-install-trust and snapshot-cli-commands--main-2 locks; those are
  re-sealed with maid plan revise --preserve-red-evidence because their own
  contracts are unchanged. website-install-trust stays active and unsuperseded.
temptations:
- risk: Do not drop a product claim while merging cards, or add new claims, numbers, or tool names the old sections did not make.
  instead: Map every retired card to one of the four answers (listed in the description) and reuse its existing wording; the only tools named are the existing chips.
- risk: Do not weaken unrelated assertions in the shared static-contract test while evolving it.
  instead: Change only the assertions that encode the removed sections (capabilities id, label, and link; strength titles; Scope expansion; card counts; the Proven card) and keep every hero, practice, brand, navigation-script, accessibility, SEO, and deployment check.
- risk: Do not supersede without carrying the superseded contracts' scope, deletions, and test artifacts forward.
  instead: Redeclare all three superseded manifests' files and artifacts, and run all of their test files in validate so nothing stops being checked.
- risk: Do not reseal sibling plan locks with plain maid plan revise, which recaptures red evidence on a green tree.
  instead: Use maid plan revise <manifest> --reason ... --preserve-red-evidence for website-install-trust and snapshot-cli-commands--main-2, after confirming their own contracts are unchanged.
- risk: Do not leave orphaned CSS or break the rendered type floor when removing sections.
  instead: Delete strength-card and capability-card rules that no longer match markup, keep the new cards on the existing type tokens, and rerun tests/test_website_rendered_typography.py.
