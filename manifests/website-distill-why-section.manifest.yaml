outcome:
  status: completed
  completed_at: "2026-10-08T13:20:00Z"
  summary: "Merged the homepage's Strengths band (5 cards), Why MAID Runner (3 problem cards), and Capabilities (6 cards) into one Why section of four problem-to-answer cards: Plan drift, Test rewriting, Self-reported \"done\", and Rules that live in one tool. Each retired claim now appears once, in its matching answer. Quick start moved directly after the workflow, and navigation became Why MAID Runner, Workflow, Quick start, MAID in practice. On a 390px phone Quick start now starts about halfway down the page (y=3574 of 7242) instead of about 86% down, and the desktop page shrank from 4297px to 3839px."
  rationale: "The Impeccable critique found three consecutive sections restating plan locks, red evidence, and scope three or four times. The user approved the four-card structure. Removing sections makes declared expectations in three committed website contracts false, so this manifest supersedes fix-google-search-vercel-deployment, surface-knockout-strength, and website-readable-type-floor and redeclares their complete contract with evolved expectations."
  lessons:
    - lesson_type: tooling
      summary: "A superseding draft cannot rename or remove a test function: chained behavioral validation treats manifests/drafts/ as inactive, so the draft's own supersedes list is ignored and the to-be-superseded manifests still demand the old artifact (E600). The workaround was to keep the old test name and update its declared behavior. Reported in ~/.maid/bug-report/20261008-193712-maid-runner-superseding-draft-chain.md."
      tags:
        - maid-runner-bug
        - supersede
        - drafts
      paths:
        - maid_runner/core/chain.py
        - manifests/website-distill-why-section.manifest.yaml
    - lesson_type: contract-scope
      summary: "Reordering page sections silently widens string-slice tests that end at the next section's marker (quick start ending at the final CTA, practice ending at quickstart). Re-bound each slice to the section that actually follows it, so each test still checks only its own section."
      tags:
        - website
        - test-quality
      paths:
        - tests/test_website_static_contract.py
        - tests/test_bootstrap_installers.py
    - lesson_type: validation
      summary: "Content-merge contracts need a claim map plus pinned phrases per answer and single-occurrence checks. Plan review found two claims (tamper-evident planning; the deterministic, AST-level contract) missing from the first mapping, and three more that could be silently dropped. Scope content checks to <main> so unchanged head metadata does not force unapproved copy edits."
      tags:
        - content
        - plan-review
      paths:
        - tests/test_website_distilled_story.py
  review_notes:
