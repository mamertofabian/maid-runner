# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Merge the repetitive Strengths, Why, and Capabilities sections into one four-row problem-to-answer Why section and move Quick start after the workflow
type: refactor
created: '2026-10-08T11:48:57Z'
supersedes:
- fix-google-search-vercel-deployment
- surface-knockout-strength
- website-readable-type-floor
metadata:
  planning_state: completed
