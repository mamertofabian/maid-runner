schema: '2'
goal: Pin plan locks to a contract-scoped manifest hash that ignores the outcome section, so Outcome capture stops flipping maid plan status to TAMPERED and stops manufacturing refresh revisions
type: feature
created: '2026-07-18T01:15:56Z'
metadata:
  epic: manifests/drafts/085-00-plan-lock-ceremony-reduction.epic.yaml
  tags:
  - plan-lock
  - outcome-records
  - ceremony-reduction
  - hashing
  priority: high
description: |
  Plan locks store `manifest_hash` as a raw byte hash of the manifest file
  (`compute_manifest_hash` in maid_runner/core/supersession_audit.py, wired
  in create_plan_lock). Outcome capture — a REQUIRED post-review step in
  this repo's workflow — appends an `outcome:` section to the promoted
  manifest, changes the bytes, and makes `maid plan status` report
  TAMPERED with exit 1. Agents dutifully respond with `maid plan revise
  --reason "Refresh plan lock after outcome capture"`: 31 such revisions
  in the 2026-07-16 goal run, all pure ceremony. Verify's own enforcement
  (`enforce_plan_locks`) does not hard-fail on a byte mismatch without
  contract weakening, so the pressure comes specifically from the status
  command's byte comparison and from workflow guidance reacting to it.

  Pinned decisions (do not redesign):

  1. New public function `compute_manifest_contract_hash(manifest_path)`
     in maid_runner/core/plan_lock.py (NOT in supersession_audit.py — the
     supersession byte hash keeps its meaning and callers). It parses the
     manifest YAML, removes ONLY the top-level `outcome` key, serializes
     the remainder canonically (json.dumps with sort_keys=True and
     stable separators over the parsed structure), and returns
     "sha256-contract:<hexdigest>".
  2. Exclusion is EXACTLY the top-level `outcome` key. `description`,
     `temptations`, `metadata`, `goal`, files, artifacts, and validate
     commands all remain hash-relevant: they are contract or
     contract-rationale. If plan review wants `metadata.status` lifecycle
     flips excluded too, that is a recorded decision for a future
     manifest, not silent scope growth here.
  3. Format dispatch, not migration: new public function
     `manifest_hash_matches(lock_hash, manifest_path)` compares by prefix
     — "sha256:" values use the legacy byte hash, "sha256-contract:"
     values use the contract hash. Existing locks stay valid unmodified;
     `create_plan_lock` (and therefore lock and revise) writes the new
     format going forward. No bulk rewrite of .maid/plan-locks/, no
     load-time upgrade, no new lock schema field.
  4. Callers that compare `lock.manifest_hash` against a freshly computed
     hash go through `manifest_hash_matches`: `cmd_plan_status` (its
     manifest_match line and exit code) and `_contract_weakening_detail`'s
     short-circuit in core/plan_lock.py. The supersession audit and the
     lock's `test_hashes` (byte hashes of test files) are untouched.
  5. Documented limit, stated in docs: under the new format, YAML
     comment/formatting-only edits to a manifest no longer flip status —
     the lock pins the parsed contract data, not the file bytes. This is
     the intended trade; tamper evidence for the contract itself is
     unchanged because every parsed key except `outcome` participates.

  Failure-mode note for the implementing agent: if the manifest fails to
  parse as YAML, compute_manifest_contract_hash must raise (fail loud),
  not fall back to byte hashing — a silently degraded hash would make
  status lie about what it compared.

  Sequencing: third child of epic 085, after 085-02. Together they remove
  both halves of the outcome-capture tax: 085-02 makes such a revision
  free (evidence preserved) and this child makes it unnecessary.

  Behavioral tests live in the dedicated
  tests/core/test_contract_scoped_manifest_hash.py module because existing
  plan-lock test files are hashed by older plan locks.
temptations:
- risk: Do not exclude more than the top-level outcome key (metadata, description, temptations) to make more edits hash-neutral.
  instead: Strip exactly data.pop('outcome') at the top level, cover the exclusion boundary with a behavioral test that proves a description edit still changes the hash.
- risk: Do not change or re-route supersession_audit.compute_manifest_hash — supersession and test-file hashing must keep byte semantics.
  instead: Add the new function in plan_lock.py and leave every existing compute_manifest_hash call site outside the two pinned comparison points untouched.
- risk: Do not rewrite existing lock files in place during status or verify to 'migrate' them.
  instead: Dispatch on the stored hash prefix; new-format hashes appear only through create_plan_lock/revise writes.
- risk: Do not fall back to byte hashing when the manifest YAML fails to parse.
  instead: Raise the parse error so status/lock report a loud failure, matching the fail-loud constraint recorded in the epic.
files:
  create:
  - path: tests/core/test_contract_scoped_manifest_hash.py
    artifacts:
    - kind: test_function
      name: test_contract_hash_ignores_outcome_section
      source_scenario: Two copies of a manifest identical except one carries a populated outcome section.
      actions:
      - type: api_call
        subject:
          function: compute_manifest_contract_hash
      expected:
        behavior: Both files produce the same sha256-contract-prefixed digest.
    - kind: test_function
      name: test_contract_hash_tracks_contract_changes
      source_scenario: Manifest variants that change an artifact name, a files entry, a validate command, and (separately) only the description text.
      actions:
      - type: api_call
        subject:
          function: compute_manifest_contract_hash
      expected:
        behavior: Every variant, including the description-only edit, produces a different digest from the baseline — proving the exclusion is outcome-only.
    - kind: test_function
      name: test_contract_hash_ignores_yaml_formatting_only_edits
      source_scenario: The same manifest re-serialized with different quoting, key order, and comments but identical parsed data.
      actions:
      - type: api_call
        subject:
          function: compute_manifest_contract_hash
      expected:
        behavior: The digest is unchanged, pinning the documented parsed-data limit.
    - kind: test_function
      name: test_manifest_hash_matches_dispatches_on_prefix
      source_scenario: A legacy sha256-prefixed byte hash and a new sha256-contract-prefixed hash for the same manifest, checked before and after appending an outcome section.
      actions:
      - type: api_call
        subject:
          function: manifest_hash_matches
      expected:
        behavior: The legacy hash matches only the original bytes; the contract hash matches both before and after the outcome append; an unknown prefix returns False (fail-closed).
    - kind: test_function
      name: test_new_locks_store_contract_prefixed_hash
      source_scenario: create_plan_lock on a temp-project manifest.
      actions:
      - type: api_call
        subject:
          function: create_plan_lock
      expected:
        behavior: The created lock's manifest_hash carries the sha256-contract prefix.
    - kind: test_function
      name: test_plan_status_reports_match_after_outcome_capture
      source_scenario: Lock a temp-project manifest with the new format, then append an outcome section and run plan status.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_status
      expected:
        behavior: Status reports the manifest as matching with exit code 0; a contract-changing edit still flips it to TAMPERED with exit 1.
    - kind: test_function
      name: test_contract_hash_raises_on_unparseable_manifest
      source_scenario: A manifest file containing invalid YAML.
      actions:
      - type: api_call
        subject:
          function: compute_manifest_contract_hash
      expected:
        behavior: The function raises instead of returning any digest.
  edit:
  - path: maid_runner/core/plan_lock.py
    artifacts:
    - kind: function
      name: compute_manifest_contract_hash
      args:
      - name: manifest_path
        type: Path
      returns: str
      description: sha256-contract-prefixed digest over the canonical JSON serialization of the parsed manifest minus the top-level outcome key; raises on unparseable YAML.
    - kind: function
      name: manifest_hash_matches
      args:
      - name: lock_hash
        type: str
      - name: manifest_path
        type: Path
      returns: bool
      description: Prefix-dispatched comparison supporting legacy sha256 byte hashes and sha256-contract hashes; unknown prefixes and missing files return False.
    - kind: function
      name: create_plan_lock
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: agent
        type: Optional[AgentProvenance]
      returns: PlanLock
      description: Stores the contract-scoped hash format for manifest_hash; test_hashes remain byte hashes. Signature unchanged.
  scope:
  - path: maid_runner/cli/commands/plan.py
    reason: Route cmd_plan_status's manifest comparison through manifest_hash_matches; no flag or output-format changes beyond the corrected match result.
  - path: docs/maid_specs.md
    reason: Document the contract-scoped hash format, the legacy-prefix compatibility, and the parsed-data documented limit.
  - path: maid_runner/docs/maid_specs.md
    reason: Keep the packaged spec copy in sync.
  - path: tests/cli/test_manifest_promote_lock_cmd.py
    reason: "Adapt the promote-migration assertion that equated lock.manifest_hash to the legacy byte hash so new locks expect the sha256-contract prefix."
  - path: tests/core/test_plan_lock.py
    reason: "Adapt create_plan_lock characterization that asserted startswith('sha256:') so new locks expect sha256-contract: (the prefixes do not nest)."
  - path: tests/cli/test_plan_cmd.py
    reason: "Adapt lock-record prefix assertion and replace the comment-only tamper status case with a contract-field edit, matching the documented formatting-neutral limit."
  read:
  - maid_runner/core/supersession_audit.py
  - maid_runner/core/manifest.py
validate:
- uv run python -m pytest tests/core/test_contract_scoped_manifest_hash.py -v
- uv run maid validate manifests/085-03-contract-scoped-plan-lock-manifest-hash.manifest.yaml --mode behavioral --quiet
- uv run maid validate manifests/085-03-contract-scoped-plan-lock-manifest-hash.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-07-18T01:25:00Z"
  summary: "Plan locks now pin a sha256-contract digest over the parsed manifest minus only the top-level outcome key, so Outcome capture no longer flips maid plan status to TAMPERED or forces refresh revisions."
  rationale: "Byte-hash pinning treated outcome bookkeeping as tampering. Prefix-dispatched contract hashing keeps legacy sha256 locks valid, leaves supersession/test byte hashes alone, and makes formatting-only YAML edits intentionally hash-neutral under the new format."
  agent:
    model: Composer
    provider: cursor
    client: cursor-auto
    skills:
    - maid-implement-draft
    - maid-implementer
    - maid-plan-review
    - maid-implementation-review
  lessons:
  - lesson_type: design
    summary: "Dispatch sha256-contract before sha256 when comparing lock hashes; the prefixes do not nest, so startswith('sha256:') alone rejects the new format."
    tags:
    - plan-lock
    - hashing
    - ceremony-reduction
    paths:
    - maid_runner/core/plan_lock.py
    - tests/core/test_contract_scoped_manifest_hash.py
  - lesson_type: testing
    summary: "Put new plan-lock coverage in a dedicated unlocked test module; adapt older locked characterizations only through scoped edits and sanctioned plan revise, and expect comment-only tamper cases to become contract-field edits under the formatting-neutral limit."
    tags:
    - plan-lock
    - testing
    - anti-gaming
    paths:
    - tests/core/test_contract_scoped_manifest_hash.py
    - tests/cli/test_plan_cmd.py
  review_notes:
  - source: maid-plan-review-round-1
    severity: ready
    summary: "Approved; non-blocking advisories on stale planning note and untested _contract_weakening_detail short-circuit."
  - source: maid-implementation-review-round-1
    severity: ready
    summary: "Ready to merge; scope, temptations, artifacts, docs, and verify gates held."
  validation:
  - command:
    - uv
    - run
    - python
    - -m
    - pytest
    - tests/core/test_contract_scoped_manifest_hash.py
    - -v
    status: passed
    summary: "All 7 contract-scoped hash scenarios passed."
  - command:
    - uv
    - run
    - maid
    - validate
    - manifests/085-03-contract-scoped-plan-lock-manifest-hash.manifest.yaml
    - --mode
    - implementation
    status: passed
    summary: "Implementation validation passed."
  - command:
    - uv
    - run
    - maid
    - verify
    - --summary
    - --require-plan-lock
    - --require-red-evidence
    - --since
    - HEAD
