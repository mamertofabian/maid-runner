# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Validate an explicitly selected superseding draft against its proposed active chain
type: fix
created: '2026-10-20T20:52:40Z'
description: For chained validation of an explicitly selected superseding draft under the selected manifest
  directory drafts subtree, construct an ephemeral proposed chain containing that draft and active/history
  contracts. Honor its supersedes while excluding every unselected draft. Reuse normal chain merge, supersession
  integrity and production dropped-artifact audit diagnostics. Never mutate caller-provided or cached
  chain state, disk manifests or global active inventory. Preserve direct active validation and configured
  manifest directories. Implement only bounded private chain-view wiring and the existing validate entry
  point; no global draft activation, no-chain bypass, parser or evidence-policy changes. Both inventory
  and hardened-scope recall returned no related records. Reuse existing chain/audit mechanisms and apply
  exact identity/isolated-view regression discipline; no advisory lesson requires broader scope. Fixtures
  execute genuine pytest before validation. Temporary draft fixtures carry required implementation markers;
  an explicit unmarked negative retains E109. Update source and packaged workflow documentation together.
  The selected proposal retains exact inactive metadata without receiving active-only E117; unrelated
  active lifecycle errors remain enforced. This exception belongs only to the isolated selected-source
  context.
temptations:
- risk: Make a superseding draft pass by disabling chain checks or activating all drafts.
  instead: Add only the explicitly selected proposal to an isolated chain view and retain unrelated active
    test-name demands plus missing-target/cycle/E110 diagnostics.
- risk: Mutate a supplied or cached chain or persist draft activation during validation.
  instead: Construct a separate view and assert supplied public chain queries, normal active validation
    and all fixture bytes remain unchanged.
