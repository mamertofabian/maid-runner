        default: 'False'
      - name: check_assertions
        type: bool
        default: 'False'
      - name: fail_on_warnings
        type: bool
        default: 'False'
      - name: registry
        type: ValidatorRegistry | None
        default: None
      returns: ValidationResult
      description: Validate selected contracts through the existing public entry point and isolated chained
        context.
