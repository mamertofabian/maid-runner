# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Prepare maid-runner 2.25.0 release metadata and changelog
type: feature
created: '2026-08-07T13:50:01Z'
supersedes:
- bump-version-2.24.0
metadata:
  planning_state: behavioral-contract
  promotion_ready: true
  tests_status: created-red-confirmed
  status: implementation-ready
  tags:
  - release
  - version
  - changelog
  priority: high
description: |
  Bump maid-runner from 2.24.0 to 2.25.0 and synchronize package metadata,
  editable lock metadata, changelog, roadmap version/date references, and the
  release metadata behavioral contract.

  This is a SemVer minor release because the post-v2.24.0 branch adds
  backward-compatible public CLI and validation surfaces: named `maid verify
  --profile` presets, newcomer entry-point guidance, profile-bearing generated
  hooks and distributed payloads behind an explicit 2.25 floor, and Python enum
  artifact contracts. It also improves the public website and ships focused
  safety fixes for plan evidence, packet ownership, configured manifest
  directories, generated empty-repository hooks, legacy baseline workflows,
  scope-only contracts, and .NET changed-scope tracking.

  Outcome evidence digestion: prior release Outcomes require package, lock,
  changelog, roadmap, runtime metadata, compare-link, built artifact, and
  review evidence to stay synchronized. The completed 095 Outcomes also require
  the 2.25 executable floor to remain distinct from the instruction-payload
  version. The contract therefore pins every release mirror and names the
  user-visible behavior expected in the changelog rather than trusting commit
  subjects alone.

  This task prepares local release metadata only. Do not tag, publish, push,
  create a GitHub release, merge to main, or otherwise perform external release
  actions.
temptations:
- risk: Do not update only pyproject.toml and leave editable lock, roadmap, or
    runtime release assertions stale.
  instead: Update every release mirror in one contract and regenerate uv.lock
    with uv.
- risk: Do not derive release notes only from commit subjects or omit safety
    boundaries.
  instead: Reconcile commits with completed manifest Outcomes and summarize
    observable behavior, compatibility floors, and fail-closed guarantees.
- risk: Do not describe profile-bearing generated hooks as compatible with
    maid-runner 2.24.
  instead: State that named profile hooks and distributed guidance activate at
    the 2.25 executable floor while instruction payload staleness is separate.
- risk: Do not omit or mistype the changelog compare link.
  instead: Add and behaviorally assert the exact v2.24.0...v2.25.0 compare URL.
- risk: Do not publish, tag, push, merge, or create release artifacts merely
    because metadata preparation is green.
  instead: Stop after local build, metadata checks, review, and Outcome; require
    separate explicit publication authorization.
files:
  scope:
  - path: pyproject.toml
    reason: Package version metadata has no analyzer-visible public artifact
      contract.
  - path: uv.lock
    reason: Editable package lock metadata must mirror pyproject version and be
      regenerated through uv.
  - path: CHANGELOG.md
    reason: Release notes document the 2.25.0 behavior, date, compatibility
      boundary, safety fixes, and compare link.
  - path: docs/ROADMAP.md
    reason: Roadmap current-version references mirror the prepared CLI version
      and release date.
  edit:
  - path: tests/integration/test_library_api.py
    artifacts:
    - kind: test_function
      name: test_release_metadata_is_current_version
      of: TestPublicAPIImports
      args:
      - name: self
        type: TestPublicAPIImports
      returns: None
      description: Runtime version, pyproject metadata, uv.lock metadata,
        changelog heading/content/compare link, and roadmap all report 2.25.0.
  read:
  - maid_runner/__version__.py
  - manifests/bump-version-2.24.0.manifest.yaml
  - manifests/snapshot-maid-runner-version.manifest.yaml
  - manifests/095-01-wire-guidance-to-cli-entry-points.manifest.yaml
  - manifests/095-02-add-verify-profile-presets.manifest.yaml
  - manifests/095-03-migrate-generated-hook-to-verify-profile.manifest.yaml
  - manifests/095-04-migrate-generated-profile-payloads.manifest.yaml
  - manifests/095-05-complete-profile-guidance-and-archive-adoption-epics.manifest.yaml
  - manifests/fix-python-enum-artifacts.manifest.yaml
  - manifests/fix-preserve-red-command-mismatch.manifest.yaml
  - manifests/fix-packet-output-ownership.manifest.yaml
  - manifests/fix-configured-manifest-directory.manifest.yaml
  - manifests/fix-init-empty-pre-commit-hook.manifest.yaml
  - manifests/fix-legacy-baseline-first-commit.manifest.yaml
  - manifests/fix-legacy-baseline-revise-preservation.manifest.yaml
  - manifests/094-01-separate-scope-only-contract-coverage.manifest.yaml
  - manifests/fix-changed-scope-dotnet-production-files.manifest.yaml
  - manifests/website-static-landing-page.manifest.yaml
  - manifests/website-supplied-logo-png.manifest.yaml
  - manifests/website-maid-in-practice-section.manifest.yaml
validate:
- uv run python -m pytest -q tests/integration/test_library_api.py
