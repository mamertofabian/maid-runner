  priority: medium
description: |
  `maid snapshot` declares two flags that no code reads. Verified against the
  current tree: `cmd_snapshot` (`maid_runner/cli/commands/snapshot.py:11-36`)
  reads only `args.file_path`, `args.dry_run`, `args.json`, `args.output_dir`,
  and `args.output`. Neither `args.with_tests` nor `args.force` is referenced
  anywhere in `maid_runner/`.

  This contract chooses the least-invasive cleanup: remove both options from
  the snapshot parser instead of implementing new snapshot behavior. This keeps
  existing snapshot overwrite behavior and bootstrap behavior unchanged, avoids
  designing ambiguous test-discovery or test-stub semantics, and prevents
  agents/users from seeing CLI options that appear meaningful but are inert.

  - `--force` ("Overwrite an existing output manifest",
    `maid_runner/cli/commands/_main.py:670-672`) silently no-ops. Worse, the
    default is already destructive: `save_snapshot` overwrites unconditionally,
    so a user who omits `--force` still loses an existing manifest, and a user
    who passes it gets no additional guarantee. The flag's existence implies a
    safety default that does not exist.
  - `--with-tests` ("Include discovered test files in the snapshot",
    `_main.py:665-669`) silently no-ops. `generate_test_stub`
    (`maid_runner/core/snapshot.py:202`) already exists and is the obvious
    intended implementation, but nothing wires it to the flag.

  Scope boundary: do not change `save_snapshot`, `cmd_snapshot`, snapshot
  artifact collection, output-format selection, bootstrap behavior, or test-stub
  generation. The only production behavior change is argparse rejecting these
  two previously accepted inert flags.
temptations:
  - risk: "Do not implement new --force overwrite semantics in this cleanup task."
    instead: "Remove the inert parser option and leave existing snapshot write behavior
      untouched."
  - risk: "Do not wire --with-tests to generate_test_stub or invent test-discovery
      semantics here."
    instead: "Remove the inert parser option and leave test-stub generation as a separate
      future feature decision."
  - risk: "Do not leave parser tests asserting that the removed options are accepted."
    instead: "Change the behavioral tests to assert argparse rejects --force and --with-tests
      for maid snapshot."
