# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Generate fresh chain-merge coverage and knockout evidence for one explicit production file without running repository-wide mutations"
type: feature
created: "2026-08-19T15:16:03Z"
metadata:
  priority: high
  tags: [chain-merge, evidence, knockout, artifact-coverage, performance]
description: |
  Add an explicit `maid chain merge FILE --refresh-evidence` mode for the
  documented baseline and equivalence workflow. The mode executes live
  artifact coverage only for active manifests that declare artifacts in FILE,
  treating non-executable structural declarations as satisfied by the live
  manifest/implementation contract because they have no runtime body,
  plans knockout mutation identities from the complete active manifest chain,
  and executes only the function/method mutation specifications belonging to
  FILE. Successful JSON output remains the ordinary complete chain-merge report
  schema so it can be saved directly as an equivalence baseline.

  Execute coverage collection in an isolated current-byte project snapshot so
  test-side material writes cannot escape into the source worktree. Convert
  snapshot setup, cache-boundary, and teardown failures into structured E712
  diagnostics instead of propagating a traceback.
  Use watchdog's native Linux, macOS, and Windows backends to detect persistent
  and restored material writes on every supported platform.

  Refresh is opt-in and never changes the default cache-only report. It may be
  combined with `--verify-equivalence` so candidate evidence is collected live
  before comparison, including when consolidated tests use different nodeids.
  It is incompatible with repository sweep and structural apply. Any coverage
  executable-body coverage or knockout diagnostic fails closed with exit 1 and structured errors rather
  than emitting a misleading baseline. `--dry-run` remains harmless because
  refresh mutates only isolated test snapshots and ignored evidence caches.

  Keep existing full-repository cache contracts intact. Targeted coverage is
  consumed directly for this report and must not be written under the
  full-repository coverage-cache identity. Targeted knockout may populate the
  existing per-spec cache only after mutation specs are built from the full
  active plan, so the normal cache-only report can safely reuse the requested
  file's detection evidence without warming a sibling file.

  This is additive evolution: existing public signatures and default CLI
  behavior remain unchanged. The new core entry points compose the shipped
  runtime-backed coverage and isolated knockout engines instead of introducing
  static reachability logic or a separate evidence implementation.
temptations:
  - risk: "Do not build knockout specs from only the target's owner manifests."
    instead: "Build the complete active mutation plan first, then filter immutable specs by normalized file path before execution and cache writes."
  - risk: "Do not label a selected-manifest coverage report as the full-repository coverage cache."
    instead: "Use targeted coverage directly for the live report and leave the existing full-cache namespace untouched."
  - risk: "Do not emit a baseline-shaped success document when coverage collection fails or a knockout survives."
    instead: "Return exit 1 with the exact structured E710/E711/E712 diagnostics and no misleading acceptance report."
  - risk: "Do not execute refreshed coverage directly in the source worktree."
    instead: "Collect runtime evidence in an isolated current-byte snapshot, discard test writes, and rebind only byte-identical evidence to the source identity."
  - risk: "Do not weaken nodeid identity rules to make consolidated tests pass."
    instead: "Reuse artifact-identity equivalence: refreshed candidate nodeids may differ, but every eligible artifact must still have real detecting nodeids."
