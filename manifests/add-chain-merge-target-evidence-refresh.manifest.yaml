  summary: "Chain merge can now collect fresh file-scoped coverage and full-plan/file-filtered knockout evidence for unchanged consolidation targets, while leaving default reports cache-only and failing closed on evidence or isolation defects."
  rationale: "The refresh composes existing runtime coverage and knockout engines, executes coverage in a disposable snapshot with sanitized environment bindings, rejects persistent and restored material writes through portable watchdog barriers plus full byte-state comparison, and retains only safe per-spec knockout cache evidence."
  lessons:
    - lesson_type: validation-trust
      summary: "Evidence collected in a snapshot is trustworthy only when absolute execution paths and environment identity are rebound to byte-identical source inputs and all material writes, including restored writes, are rejected."
      tags: [chain-merge, evidence, isolation, watchdog]
      paths:
        - maid_runner/core/chain_merge_evidence.py
        - maid_runner/core/_runtime_command_executor.py
    - lesson_type: test-design
      summary: "Material-write tests must isolate coverage from knockout, exercise hostile ambient Git environment variables, and include write-then-delete behavior; otherwise another gate can accidentally satisfy the expected E712."
      tags: [behavioral-tests, fail-closed, portability]
      paths:
        - tests/cli/test_chain_merge_refresh_evidence_command.py
