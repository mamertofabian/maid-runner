# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Distribute branch-independent contract acceptance and committed-code evidence guidance
type: fix
created: '2026-09-17T22:22:52Z'
description: |
  Refine the accepted distributed guidance without replacing its existing
  contracts or changing their behavioral tests. Durable contracts are based
  on acceptance into shared project history, including integration and release
  branches. Unfinished local commits remain revisable but cannot be hidden by
  stash-backed revision. Explain compatible evidence preservation, fresh red
  evidence for failing revised tests, and an explicit recovery blocker when
  committed implementation already passes strengthened tests.
  The implementation was initially completed under an explicit user MAID skip.
  The user subsequently requested MAID compliance before committing. Temporarily
  shelve only this task's uncommitted implementation, sync the baseline payload,
  and capture regression evidence against HEAD 3183778cee9f3bfae017acefc968ad26bf74733d
  before restoring it. This is post-hoc baseline verification, not a claim of
  original test-first development. Existing accepted contracts remain intact.
temptations:
- risk: Rewrite accepted manifests or shared tests to conceal the workflow transition.
  instead: Add this compatible follow-on contract and dedicated installed-output tests; preserve prior locks and tests.
- risk: Present reconstructed red evidence as having preceded the initial implementation.
  instead: Record the explicit MAID skip and subsequent baseline capture in this contract and Outcome; restore only the task changes after locking.
- risk: Cover repository prose while downstream agent payloads remain stale.
  instead: Exercise real Codex and Claude init output, including skill metadata and installed workflow docs; sync generated assets before red and green runs.
