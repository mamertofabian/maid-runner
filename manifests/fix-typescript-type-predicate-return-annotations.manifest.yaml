  rationale: "Tree-sitter exposes ordinary types, predicates, and assertion signatures through one named return_type field even though their concrete node kinds differ. Reading that field at the existing shared signature seam fixes every supported function-like collector path while leaving the generic comparator, JavaScript JSDoc fallback, and downstream validation policy unchanged."
  completed_at: "2026-08-25T07:49:13+08:00"
