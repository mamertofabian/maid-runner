schema: "2"
goal: "Collect explicit TypeScript type-predicate and assertion return annotations without false E304 warnings"
type: fix
created: "2026-08-24T23:38:49Z"
metadata:
  bug_report: ~/.maid/bug-report/20260824-222144-studyfinder-typescript-type-predicate.md
  tags:
    - typescript
    - tree-sitter
    - implementation-validation
    - e304
  priority: high
description: |
  TypeScript's Tree-sitter grammar exposes ordinary return annotations as
  `type_annotation`, predicates such as `value is GeoPoint` and `this is Box`
  as `type_predicate_annotation`, and assertion signatures such as
  `asserts value is GeoPoint` as `asserts_annotation`. The shared implementation
  collector currently searches only for a direct `type_annotation` child, so
  valid predicates and assertions are collected with no return type and later
  produce the misleading E304 "Missing return type annotation" warning.

  Read the grammar's named `return_type` field at the existing function-signature
  collection seam so declarations, arrow functions, class methods, and interface
  methods preserve all explicit return annotation forms. Keep ordinary return
  collection, argument collection, JavaScript JSDoc fallback, generic type
  comparison, diagnostic severity, and downstream application contracts
  unchanged. The behavioral contract exercises the public TypeScriptValidator
  API rather than private parser helpers.
temptations:
  - risk: "Do not weaken a predicate manifest return to boolean or suppress E304 to make strict verification pass."
    instead: "Preserve the explicit predicate text during TypeScript artifact collection so normal implementation validation can compare the real contract."
  - risk: "Do not add a Studyfinder-specific string or AST-node whitelist."
    instead: "Use Tree-sitter's named return_type field at the shared function-signature seam and cover every supported function-like form."
  - risk: "Do not broaden the generic type matcher or shared E304 policy as part of this collector fix."
    instead: "Keep comparison and diagnostic behavior unchanged; prove the exact predicate annotation reaches them through the public validator API."
  - risk: "Do not test the private _extract_func_signature helper directly."
    instead: "Collect artifacts through TypeScriptValidator and assert observable return annotations and end-to-end diagnostics."
files:
  create:
    - path: tests/validators/test_typescript_type_predicates.py
      artifacts:
        - kind: test_function
          name: test_collects_type_predicate_returns_from_function_like_declarations
          source_scenario: "TypeScript function declarations, arrow functions, class methods, and interface methods explicitly return parameter or this type predicates."
          actions:
            - type: api_call
              subject:
                method: TypeScriptValidator.collect_implementation_artifacts
          expected:
            behavior: "Every collected function or method preserves its exact explicit predicate return annotation instead of reporting no return type."
        - kind: test_function
          name: test_collects_assertion_signature_returns
          source_scenario: "TypeScript functions explicitly return both asserts-value-is-Type and asserts-condition assertion signatures."
          actions:
            - type: api_call
              subject:
                method: TypeScriptValidator.collect_implementation_artifacts
          expected:
            behavior: "Each collected function preserves the complete assertion annotation while ordinary argument annotations remain unchanged."
        - kind: test_function
          name: test_type_predicate_contract_avoids_false_missing_return_warning
          source_scenario: "A manifest declares a TypeScript function returning value is GeoPoint and the implementation carries that exact explicit predicate annotation."
          actions:
            - type: api_call
              subject:
                function: validate
          expected:
            behavior: "Implementation validation emits neither E304 MISSING_RETURN_TYPE nor E302 TYPE_MISMATCH for the correctly annotated predicate function."
  scope:
