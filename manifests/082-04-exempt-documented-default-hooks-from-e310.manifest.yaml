schema: '2'
goal: Add a contract-visible default_hook artifact acknowledgment so intentional base-class default implementations stop flagging E310 while real stubs still do
type: fix
created: '2026-07-03T00:52:26Z'
supersedes:
- 042-01-base-validator-default-hook-verify-warnings
metadata:
  backlog: docs/plans/maid-runner-self-improvement-backlog.md#theme-4
  tags:
  - validation-trust
  - hardening
  - stub-detection
  - anti-gaming
  - schema
  priority: high
description: |
  Every verify run on this repository emits repeated E310
  STUB_FUNCTION_DETECTED warnings for BaseValidator.module_path,
  .resolve_reexport, .get_test_function_bodies, and .generate_test_stub
  (maid_runner/validators/base.py). These are documented template-method
  default hooks (trivial `return None` / `{}` / `""` bodies that subclasses
  override), not stubs. Today there is a hardcoded advisory whitelist in
  maid_runner/cli/commands/verify.py (_BASE_VALIDATOR_DEFAULT_HOOK_STUBS +
  _is_base_validator_default_hook_stub_warning) that is pinned to this
  repo's own file path, only stops the warnings from *blocking*, still
  renders them on every run, and gives downstream repos with the same
  pattern nothing. Dogfooded false positives teach agents to ignore E310 —
  the exact signal the anti-gaming design needs to stay credible.

  Per the Validator Hardening Constraints in AGENTS.md, the fix is a
  contract-visible acknowledgment, not a heuristic: no docstring inspection,
  no subclass-override detection, no control-flow modeling.

  Pinned decisions (do not redesign):

  1. New optional boolean artifact property `default_hook` (default false)
     in the v2 manifest schema and on ArtifactSpec. Setting it declares:
     "this artifact's trivial body is an intentional documented default
     implementation." Because it lives in the manifest, the exemption is
     visible to plan review and diffs instead of growing silently.

  2. Suppression is chain-level and artifact-scoped. During validation, the
     set of acknowledged (file path, qualified artifact name) pairs is
     collected from every ACTIVE manifest declaration carrying
     `default_hook: true`; the E310 stub check skips exactly those pairs and
     nothing else. Chain-level matters because several historical manifests
     declare the same BaseValidator hooks and each re-emits E310 today;
     acknowledging once in the currently governing declaration must silence
     the finding everywhere without editing historical contracts.

  3. Dogfood closure: this active manifest declares the four BaseValidator
     template-method default hooks with `default_hook: true`, and the now-dead
     hardcoded whitelist in verify.py is removed. Acceptance: a clean verify on
     this repo emits zero E310 for maid_runner/validators/base.py, while a
     genuine stub (bare pass / NotImplementedError body without the
     acknowledgment) still flags.

  4. Scope guard: `default_hook` is only meaningful on function and method
     artifacts; the loader ignores-with-warning or schema rejects it
     elsewhere (decide the exact mechanism in plan review — recommended:
     schema allows it on ArtifactSpec, loader emits a schema-mode error when
     set on non-callable kinds, so the bound is enforced rather than
     documented).

  5. The exemption is documented where agents will meet it: the E310 entry
     in docs/troubleshooting.md and the diagnostics-registry repair recipe
     say that intentional default hooks should be acknowledged with
     `default_hook: true` in the declaring manifest — and that acknowledging
     a genuinely unimplemented function to silence E310 is a gaming pattern
     reviewers should reject.

  Planning notes (Planning Handoff Mode): behavioral tests are declared but
  not yet written; all new coverage goes in the dedicated
  tests/core/test_default_hook_stub_exemption.py module. The implementing
  agent confirms the red phase, runs behavioral validation, plan-locks, and
  promotes before implementation. Declaring the BaseValidator default hooks in
  this active manifest is part of this task's scope.

  Open questions for the implementing agent:
  - Whether acknowledged default hooks should surface as INFO-severity
    diagnostics instead of disappearing entirely (fail-loud tradeoff;
    recommended: fully suppressed, because the manifest itself is the
    visible record).
temptations:
- risk: Do not build docstring, subclass-override, or control-flow heuristics to auto-detect default hooks.
  instead: 'Honor the AGENTS.md validator-hardening constraint: the only exemption input is the explicit default_hook flag on a declared artifact in an active manifest.'
- risk: Do not suppress E310 file-wide, code-wide, or for undeclared artifacts sharing the file.
  instead: Key the exemption on exact (file path, qualified artifact name) pairs collected from active-manifest declarations, and keep the adversarial test where a second stub in the same file still flags.
- risk: Do not keep the hardcoded _BASE_VALIDATOR_DEFAULT_HOOK_STUBS whitelist alongside the new mechanism.
  instead: Retire the verify.py special case in the same change so the dogfooded repo exercises the contract-visible path.
- risk: Do not loosen the artifact schema with additionalProperties or an untyped property to make parsing easy.
  instead: Declare default_hook as an explicit boolean property on ArtifactSpec in manifest.v2.schema.json and cover valid and invalid shapes in schema-mode tests.
files:
  create:
  - path: tests/core/test_default_hook_stub_exemption.py
    artifacts:
    - kind: test_function
      name: test_default_hook_true_suppresses_e310_for_trivial_default
      source_scenario: An active manifest declares a method whose body is a trivial documented default return and marks it default_hook true; implementation validation runs on the file.
      actions:
      - type: api_call
        subject:
          function: validate
      expected:
        behavior: Validation reports no E310 STUB_FUNCTION_DETECTED finding for the acknowledged artifact.
    - kind: test_function
      name: test_real_stub_without_default_hook_still_reports_e310
      source_scenario: The same file also declares a function with a bare pass body and no default_hook acknowledgment.
      actions:
      - type: api_call
        subject:
          function: validate
      expected:
        behavior: E310 is still reported for the unacknowledged stub, proving the exemption is artifact-scoped rather than file-scoped.
    - kind: test_function
      name: test_default_hook_parses_from_manifest_yaml
      source_scenario: A manifest YAML declares artifacts with default_hook true, default_hook false, and the property omitted.
      actions:
      - type: api_call
        subject:
          function: load_manifest
      expected:
        behavior: The loaded ArtifactSpec.default_hook is True only for the explicit true declaration and False for both the explicit false and the omitted cases.
    - kind: test_function
      name: test_schema_rejects_non_boolean_default_hook
      source_scenario: A manifest YAML sets default_hook to a string value on an artifact.
      actions:
      - type: api_call
        subject:
          function: load_manifest
      expected:
        behavior: Schema validation rejects the manifest with a schema error instead of coercing or silently ignoring the value.
    - kind: test_function
      name: test_schema_rejects_default_hook_on_non_callable_artifact
      source_scenario: A manifest YAML sets default_hook true on a class artifact instead of a function or method artifact.
      actions:
      - type: api_call
        subject:
          function: load_manifest
      expected:
        behavior: Schema validation rejects the manifest because default_hook acknowledgments are only valid for callable function or method artifacts.
    - kind: test_function
      name: test_chain_level_acknowledgment_covers_other_declaring_manifests
      source_scenario: Two active manifests declare the same trivial-default method for one file; only the newer declaration carries default_hook true.
      actions:
      - type: api_call
        subject:
          function: validate
      expected:
        behavior: Validating the older manifest also reports no E310 for that artifact, because acknowledgment is collected chain-wide from active manifests.
  edit:
  - path: maid_runner/schemas/manifest.v2.schema.json
    artifacts:
    - kind: attribute
      name: default_hook
      of: MAID Manifest v2 schema
      type: optional boolean on ArtifactSpec
      description: Strict optional boolean artifact property acknowledging an intentional documented default implementation; additionalProperties stays false.
  - path: maid_runner/core/types.py
    artifacts:
    - kind: attribute
      name: default_hook
      of: ArtifactSpec
      type: bool
      description: True when the manifest acknowledges this artifact's trivial body as an intentional documented default implementation; defaults to False.
  - path: maid_runner/validators/base.py
    artifacts:
    - kind: method
      name: module_path
      of: BaseValidator
      args:
      - name: file_path
        type: Union[str, Path]
      - name: project_root
        type: Path
      returns: Optional[str]
      default_hook: true
      description: Intentional documented default hook returning no language-specific module identity.
    - kind: method
      name: resolve_reexport
      of: BaseValidator
      args:
      - name: module
        type: str
      - name: name
        type: str
      - name: project_root
        type: Path
      returns: Optional[tuple[str, str]]
      default_hook: true
      description: Intentional documented default hook returning no re-export resolution.
    - kind: method
      name: get_test_function_bodies
      of: BaseValidator
      args:
      - name: source
        type: str
      - name: file_path
        type: Union[str, Path]
      returns: dict[str, str]
      default_hook: true
      description: Intentional documented default hook returning no parsed test-function bodies.
    - kind: method
      name: generate_test_stub
      of: BaseValidator
      args:
      - name: artifacts
        type: list[FoundArtifact]
      - name: file_path
        type: Union[str, Path]
      returns: str
      default_hook: true
      description: Intentional documented default hook returning no generated test template.
  scope:
  - path: maid_runner/core/manifest.py
    reason: Parse the artifact default_hook property into ArtifactSpec; no public loader signature changes.
  - path: maid_runner/core/_implementation_validation.py
    reason: Skip E310 for (file, qualified name) pairs acknowledged by active-manifest default_hook declarations; private stub-check plumbing only.
  - path: maid_runner/cli/commands/verify.py
    reason: Retire the hardcoded _BASE_VALIDATOR_DEFAULT_HOOK_STUBS advisory whitelist now superseded by the contract-visible mechanism.
  - path: maid_runner/core/diagnostics_registry.py
    reason: Extend the E310 repair recipe to name the default_hook acknowledgment and warn that acknowledging genuine stubs is a gaming pattern.
  - path: docs/troubleshooting.md
    reason: Document the default_hook exemption under the E310 troubleshooting entry.
  - path: tests/cli/test_verify_cmd.py
    reason: Update stale verify test expectation now that BaseValidator default-hook E310 warnings are no longer made advisory in verify.py.
  - path: tests/core/test_diagnostics_registry.py
    reason: Update pinned diagnostic recipe coverage for the new E310 repair recipe.
  read:
  - maid_runner/core/result.py
  - maid_runner/core/chain.py
validate:
- uv run python -m pytest tests/core/test_default_hook_stub_exemption.py tests/cli/test_verify_cmd.py -v
- uv run maid validate manifests/082-04-exempt-documented-default-hooks-from-e310.manifest.yaml --mode behavioral --quiet
- uv run maid validate manifests/082-04-exempt-documented-default-hooks-from-e310.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-07-03T01:49:01Z"
  summary: "Added a manifest-visible `default_hook: true` artifact acknowledgment for intentional documented default hook implementations. E310 suppression is now keyed to exact active-manifest `(file path, qualified artifact name)` callable declarations, the BaseValidator dogfood hooks are acknowledged in the manifest, and the old verify.py hardcoded BaseValidator advisory whitelist was removed."
  rationale: "A contract-level acknowledgment keeps the exemption visible to plan review and diffs without adding heuristics for docstrings, subclass overrides, or control flow. The schema restricts `default_hook: true` to function and method artifacts, the parser preserves the flag on ArtifactSpec serialization, and docs/diagnostics warn reviewers not to use the acknowledgment for genuine unimplemented stubs."
