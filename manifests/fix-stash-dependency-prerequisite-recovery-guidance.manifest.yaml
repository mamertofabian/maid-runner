schema: '2'
goal: Give usable stash-revision recovery advice when tests require upgraded dependencies
type: fix
created: '2026-10-20T23:32:33Z'
description: 'Improve only the dependency-target invalid-red refusal in cmd_plan_revise. Prior dependency
  recovery is conditional on compatibility with behavioral tests. When upgraded dependencies are required
  to collect tests, advise retaining that prerequisite environment, saving the current implementation
  before restoring only task implementation source to its real pre-implementation baseline in a controlled
  checkout, and using plain plan revise after genuine red; then restore the saved implementation and rerun
  green. Legacy baseline remains a separate eligible tracked-baseline workflow, never a generic collection-error
  bypass. Keep evidence classification, exit status, bounded command details, stash targeting/restoration,
  source/lock integrity and lock-write ordering unchanged. No selective-stash flags, automatic package
  installation, new evidence modes or relaxed gates. Real owned SDK version fixtures expose Client only
  in v2: initial lock captures actual assertion red with SDKv2; stash restores dependency configv1 causing
  actual pytest collection ImportError; failed revision must restore all original bytes/modes and leave
  original lock unchanged. Public plain revise with exact HEAD source and SDKv2 then captures genuine
  assertion red, restored implementation is green. Use -B in fixture commands to avoid same-second bytecode
  artifacts without sleeps or fake runner results. Preserve existing public signature. Source and packaged
  spec mirrors must replace unconditional advice consistently. Initial inventory recall had no related
  records. Hardened recall matched 067-02 capture-red, 076-01 stash-backed revise, 076-03 lifecycle dirt
  and related lock/diagnostic Outcomes. Apply exact stash identity, contract/source restoration and bounded
  command-detail lessons. Parser-flag, lifecycle-policy and historical unrelated coverage/release-backlog
  advice is irrelevant because this task adds no flags or stash/evidence policy.'
temptations:
- risk: Treat prior dependencies or legacy baseline as universal recovery, or imply that invalid collection
    can serve as red evidence.
  instead: State test compatibility and baseline eligibility explicitly, retain required dependency environment
    and prove real source-baseline/plain-revise red followed by restored green.
- risk: Add selective stashing, install dependencies automatically, or change classification/restoration
    to make the diagnostic test pass.
  instead: Change only operator guidance/specs; assert exit2 remains invalid, original lock/files/modes
    restore exactly and stash is removed on refusal.
