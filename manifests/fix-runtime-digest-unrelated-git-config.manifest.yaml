      status: passed
      summary: All 53 adjacent runtime evidence and cache scenarios passed.
    - command: [uv, run, maid, validate, manifests/fix-runtime-digest-unrelated-git-config.manifest.yaml, --mode, implementation, --packet]
      status: passed
      summary: Implementation validation matched the approved revision-3 contract.
