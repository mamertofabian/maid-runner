        - HEAD
      status: failed
      summary: "The measured deep gate reached artifact coverage after 1577.263 seconds and reported 1703 repository-wide historical E710 gaps plus the known live-121 inventory E900; schema, behavioral, and implementation stages passed. This is recorded as the remaining optimization target rather than a 121-05 regression."
