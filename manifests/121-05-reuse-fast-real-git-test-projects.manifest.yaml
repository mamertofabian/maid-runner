# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Reuse immutable real-Git templates across plan-lock and stash policy tests"
type: refactor
created: "2026-08-11T00:18:31Z"
metadata:
  priority: medium
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - tests
    - git
    - plan-lock
description: |
  The duration profile records more than 30 seconds in plan-lock, stash, and
  legacy-baseline cases that repeatedly create files, initialize Git, configure
  identity, add, and commit nearly identical tiny repositories. These tests
  need real Git semantics, so replacing Git with mocks would reduce confidence.

  Build immutable session-scoped template repositories for the common red,
  green, and legacy-baseline starting states. Each test receives a local clone
  or Git-native worktree with independent index/worktree bytes, then applies
  only its scenario delta. Preserve dedicated tests for initial repository,
  first-commit, subdirectory, staged, untracked, stash, and race behavior that
  cannot share a template safely.

  Prove byte/state equivalence against the former builders and assert that
  expensive init/config/initial-commit setup occurs once per template rather
  than once per policy case. Register the session fixture in the root pytest
  configuration and pass it explicitly into every
  policy case that uses a reusable builder; the optional helper arguments exist
  only to retain bespoke setup for topology/history cases, not as an unexercised
  escape hatch.
temptations:
  - risk: "Do not replace Git behavior with a mocked subprocess return table."
    instead: "Use real local clones/worktrees of immutable tiny templates and keep assertions on the actual index, HEAD, stash, and worktree."
  - risk: "Do not share a mutable working tree or index between tests."
    instead: "Give every test an independent clone/worktree and verify template HEAD and status remain unchanged after the test."
  - risk: "Do not force first-commit, subdirectory, or race tests through a template that erases the behavior they cover."
    instead: "Retain bespoke builders for scenarios whose observable precondition is the absence or topology of Git history."
  - risk: "Do not assert a machine-specific millisecond budget in unit tests."
    instead: "Assert init/config/commit call counts and keep wall-time improvement as benchmark evidence."
files:
  create:
    - path: tests/support/git_project_templates.py
      artifacts:
        - kind: class
          name: GitProjectTemplate
          description: "Immutable template descriptor with source repository, committed revision, and declared fixture shape."
        - kind: attribute
          name: source_root
          of: GitProjectTemplate
          type: Path
        - kind: attribute
          name: revision
          of: GitProjectTemplate
          type: str
        - kind: attribute
          name: shape
          of: GitProjectTemplate
          type: str
        - kind: class
          name: GitProjectTemplateFactory
          description: "Session-owned cache that builds each immutable template shape once."
        - kind: attribute
          name: root
          of: GitProjectTemplateFactory
          type: Path
        - kind: attribute
          name: build_count
          of: GitProjectTemplateFactory
          type: int
        - kind: method
          name: get
          of: GitProjectTemplateFactory
          args:
            - name: shape
              type: str
          returns: GitProjectTemplate
          description: "Returns the cached immutable shape or builds it once under the session root."
        - kind: function
          name: build_git_project_template
          args:
            - name: root
              type: Path
            - name: shape
              type: str
          returns: GitProjectTemplate
          description: "Creates and commits one canonical tiny real-Git project for a supported shape."
        - kind: function
          name: clone_git_project_template
          args:
            - name: template
              type: GitProjectTemplate
            - name: destination
              type: Path
          returns: Path
          description: "Creates an independent local clone/worktree and verifies it starts at the template revision with a clean index."
    - path: tests/core/test_git_project_templates.py
      artifacts:
        - kind: test_function
          name: test_template_clone_has_independent_index_and_worktree
          args: []
        - kind: test_function
          name: test_template_source_remains_byte_and_status_clean_after_clone_mutation
          args: []
        - kind: test_function
          name: test_template_setup_runs_once_for_multiple_policy_cases
          args: []
        - kind: test_function
          name: test_template_and_legacy_builder_expose_equivalent_initial_git_state
          args: []
        - kind: test_function
          name: test_distinct_template_shape_builds_distinct_committed_state
          args: []
        - kind: test_function
          name: test_policy_builders_use_templates_when_factory_is_explicit
          args: []
        - kind: test_function
          name: test_session_fixture_exposes_factory_contract
          args: []
        - kind: test_function
          name: test_stash_templates_match_bespoke_committed_git_state
          args: []
        - kind: test_function
          name: test_template_factory_rejects_unsupported_or_escaping_shape_without_writes
          args: []
        - kind: test_function
          name: test_fixture_loader_reraises_transitive_module_import_failure
          args: []
  edit:
    - path: tests/conftest.py
      artifacts:
        - kind: function
          name: load_git_project_template_factory
          args: []
          returns: type[GitProjectTemplateFactory] | None
          description: "Loads optional template support only when its exact module exists and propagates transitive import failures."
        - kind: function
          name: git_project_template_factory
          args:
            - name: tmp_path_factory
              type: pytest.TempPathFactory
          returns: Iterator[GitProjectTemplateFactory]
          description: "Session-scoped pytest fixture that owns and cleans the immutable template cache and fails behaviorally when its implementation is absent."
    - path: tests/cli/test_plan_legacy_baseline_cmd.py
      artifacts:
        - kind: function
          name: _write_committed_legacy_project
          args:
            - name: project_root
              type: Path
            - name: committed_command
              type: str
              default: "'python scripts/validate.py'"
            - name: committed_additional_commands
              type: tuple[str, Ellipsis]
              default: "()"
            - name: validate_exit
              type: int
              default: "0"
            - name: validation_mutation
              type: str | None
              default: "None"
            - name: validation_lock_payload
              type: str | None
              default: "None"
            - name: ignore_maid
              type: bool
              default: "False"
            - name: template_factory
              type: GitProjectTemplateFactory | None
              default: "None"
          returns: Path
          description: "Uses the immutable legacy template for ordinary cases and preserves bespoke setup for scenario-specific history."
    - path: tests/cli/test_plan_cmd_stash_implementation.py
      artifacts:
        - kind: function
          name: _write_tracked_project
          args:
            - name: project_root
              type: Path
            - name: template_factory
              type: GitProjectTemplateFactory | None
              default: "None"
          returns: Path
          description: "Clones the common red-contract template before applying each stash scenario delta."
    - path: tests/cli/test_plan_cmd_stash_import_obstruction.py
      artifacts:
        - kind: function
          name: _write_locked_full_stack_project
          args:
            - name: project_root
              type: Path
            - name: template_factory
              type: GitProjectTemplateFactory | None
              default: "None"
          returns: Path
          description: "Reuses a committed import-obstruction template without sharing mutable Git state."
  read:
    - maid_runner/core/plan_lock.py
    - maid_runner/core/worktree.py
    - maid_runner/cli/commands/plan.py
    - docs/plans/full-and-deep-verification-performance-redesign.md
validate:
  - uv run python -m pytest -q tests/core/test_git_project_templates.py tests/cli/test_plan_legacy_baseline_cmd.py tests/cli/test_plan_cmd_stash_implementation.py tests/cli/test_plan_cmd_stash_import_obstruction.py
  - uv run maid validate manifests/121-05-reuse-fast-real-git-test-projects.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-11T01:28:33Z"
  summary: "Reused worker-local immutable real-Git templates for common legacy-baseline and stash-plan test projects, reducing the unchanged 42-test comparison scope from 31.33 seconds to 11.61 seconds (about 63%) without sharing mutable repositories or weakening scenario-specific setup."
  rationale: "The high-frequency builders previously repeated Git initialization, configuration, commits, MAID lock construction, and fixture-file setup for every test. The implementation constructs each supported canonical project shape once per pytest worker, then makes independent `git clone --no-hardlinks` copies with no origin or alternates. Bespoke history and mutation cases retain their original setup paths. This reduced the full MAID test gate from the post-121-04 reference of 192.57 seconds to 183.12 seconds, but did not improve the deep gate: its measured duration was 1577.263 seconds versus 1552.902 seconds previously because serialized artifact coverage remains the dominant stage."
  lessons:
    - lesson_type: performance
      summary: "Caching immutable committed Git project shapes and cloning them locally removes repeated repository construction while keeping each test's index, worktree, refs, and objects independent."
      tags:
        - pytest
        - git
        - fixtures
        - caching
      paths:
        - tests/support/git_project_templates.py
        - tests/conftest.py
    - lesson_type: test-design
      summary: "A reusable test-project optimization needs behavioral equivalence checks for tracked blobs, normalized locks, commit history, clean status, remotes, actual Git command counts, path containment, and clone isolation; path-dependent Python caches must be removed symmetrically before comparison."
      tags:
        - equivalence
        - isolation
        - fail-loud
      paths:
        - tests/core/test_git_project_templates.py
    - lesson_type: validation-boundary
      summary: "This slice accelerates Git-heavy pytest setup but cannot slash deep verification because the measured long pole is serialized artifact coverage; subsequent deep-speed work must target that stage directly rather than extrapolating focused-test gains."
      tags:
        - deep-verify
        - artifact-coverage
        - benchmarking
      paths:
        - docs/plans/full-and-deep-verification-performance-redesign.md
  review_notes:
    - source: independent-reviewer-subagent
      severity: needs_changes
      summary: "Initial review required equivalence coverage for both stash templates, assertions over actual Git subprocess counts, and destination containment before writes."
    - source: independent-reviewer-subagent
      severity: needs_changes
      summary: "Re-review found that the optional fixture import could mask a transitive ModuleNotFoundError; the loader was narrowed to tolerate only the exact absent support module and a regression test proves transitive failures propagate."
    - source: independent-reviewer-subagent
      severity: ready
      summary: "Final re-review reported no findings; Git equivalence, setup counts, path containment, isolation, fail-loud imports, and performance evidence were all resolved."
  validation:
    - command:
        - uv
        - run
        - python
        - -m
        - pytest
        - -q
        - tests/core/test_git_project_templates.py
        - tests/cli/test_plan_legacy_baseline_cmd.py
        - tests/cli/test_plan_cmd_stash_implementation.py
        - tests/cli/test_plan_cmd_stash_import_obstruction.py
      status: passed
      summary: "All 53 focused template and policy tests passed in 20.39 seconds; the unchanged 42-test baseline comparison passed in 11.61 seconds versus 31.33 seconds before implementation."
    - command:
        - uv
        - run
        - maid
        - validate
      status: passed
      summary: "Repository validation passed all 419 active manifests with 111 superseded manifests skipped."
    - command:
        - uv
        - run
        - maid
        - verify
        - --profile
        - handoff
        - --summary
        - --require-plan-lock
        - --require-red-evidence
        - --since
        - HEAD
      status: passed
      summary: "Strict handoff verification passed all 9 stages in 42.073 seconds with only pre-existing no-validator warnings."
    - command:
        - uv
        - run
        - maid
        - verify
        - --profile
        - deep
        - --require-plan-lock
        - --require-red-evidence
