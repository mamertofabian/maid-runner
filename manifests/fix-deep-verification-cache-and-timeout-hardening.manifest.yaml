      status: passed
      summary: "The post-review-fix repository suite passed: 4,288 tests passed and 14 were skipped in 329.07 seconds."
    - command: [uv, run, maid, verify, --profile, deep, --require-plan-lock, --require-red-evidence, --since, f6c50b6]
      status: failed
      summary: "Schema, behavioral, and implementation stages passed; the only blocking stage was the pre-existing repository-wide artifact-coverage backlog of 1,841 E710 findings. E307 warnings remained non-blocking."
    - command: [uv, run, ruff, check, .]
      status: passed
      summary: "Repository Ruff, Black check, and git diff check passed before Outcome capture."
