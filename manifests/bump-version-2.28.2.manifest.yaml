description: |
  Advance the published 2.28.1 package to local patch version 2.28.2 and
  keep pyproject metadata, the uv lock, runtime and CLI version, roadmap, and
  changelog links aligned. The only package change since v2.28.1 is the
  TypeScript named-function re-export validation fix in 90430b5a. Add a dated
  Fixed entry for that change while preserving the 2.28.1 release notes.

  Supersede the prior release contract and replace its version-pinned test so
  the full test suite does not retain stale current-version assertions. The
  broad snapshot-cli-commands--main-2 lock also hashes that test; refresh the
  existing lock through maid plan revise after the replacement, without
  manufacturing red evidence for that unchanged legacy snapshot contract.
  Keep the public dynamic version loader and the shared library API test intact.
temptations:
  - risk: "Do not update only the package version while leaving lock, CLI, roadmap, or changelog references stale."
    instead: "Regenerate the uv lock and validate every version mirror and release link together."
  - risk: "Do not leave a test pinned to the previous current version in the full suite."
    instead: "Supersede the old release contract, replace its test, and refresh the dependent snapshot lock through maid plan revise."
  - risk: "Do not describe unsupported re-export forms as universally supported."
    instead: "Describe the shipped named-function re-export fix and its originating signature checks accurately."
