    summary: Demonstrated that a file-and-token capability was still forgeable
      and had setup-leak risk; replaced it with generated-runner runtime state.
  - source: implementation-review-runtime_review_098_03
    severity: blocking-fixed
    summary: Found that ContextVar alone did not reach worker threads; added a
