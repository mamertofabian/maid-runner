metadata:
  planning_state: behavioral_contract
  promotion_ready: true
  tests_status: red_confirmed
  tags:
    - release
    - version
    - changelog
  priority: high
description: |
  Bump maid-runner from the published 2.27.1 release to patch release 2.27.2
  and synchronize package metadata, editable lock metadata, changelog,
  roadmap version/date references, and the shared release-metadata test.

  The release contains the complete v2.27.1..HEAD patch inventory: TypeScript
  predicate and assertion return annotations are collected without false E304
  warnings; HTML and stylesheet E307 diagnostics are retained at info severity;
  assess and manifest promotion preserve the owning configured manifest chain;
  and distributed implementation-review guidance authorizes every writable
  manifest category while keeping artifact checks limited to contracted files.

  This task prepares local release metadata only. Tagging, publishing, pushing,
  merging to main, and creating a GitHub release remain separate actions.
temptations:
  - risk: Do not derive release notes only from the branch name or the remote integration tip.
    instead: Inventory every commit and changed contract in the exact v2.27.1..HEAD tag range.
  - risk: Do not update only pyproject.toml while leaving other release mirrors stale.
    instead: Update pyproject.toml, uv.lock, changelog, roadmap, and runtime assertions together.
  - risk: Do not collapse the configured-chain fixes into vague CLI wording that hides their fail-closed boundaries.
    instead: Name assess propagation, draft-parent promotion inference, explicit overrides, and ambiguity refusal accurately.
  - risk: Do not tag, publish, push, merge to main, or create a GitHub release because local preparation passes.
    instead: Stop after build, validation, independent review, Outcome capture, and handoff.
files:
  scope:
    - path: pyproject.toml
      reason: Package version metadata has no analyzer-visible public artifact.
    - path: uv.lock
      reason: Editable package lock metadata must mirror pyproject and be regenerated through uv.
    - path: CHANGELOG.md
      reason: Release notes document the 2.27.2 fixes, date, boundaries, and comparison link.
    - path: docs/ROADMAP.md
      reason: Roadmap current-version references mirror the prepared CLI release.
  edit:
    - path: tests/integration/test_library_api.py
      artifacts:
        - kind: test_function
          name: test_release_metadata_is_current_version
          of: TestPublicAPIImports
          args:
            - name: self
              type: TestPublicAPIImports
          returns: None
          description: Runtime version, package metadata, editable lock metadata, changelog heading and compare link, and roadmap all report 2.27.2 and identify the complete patch inventory.
  read:
    - maid_runner/__version__.py
    - manifests/bump-version-2.27.1.manifest.yaml
    - manifests/fix-typescript-type-predicate-return-annotations.manifest.yaml
    - manifests/fix-presentation-asset-e307-noise.manifest.yaml
    - manifests/fix-assess-changed-manifest-directory.manifest.yaml
    - manifests/fix-manifest-promote-output-routing.manifest.yaml
    - manifests/fix-reviewer-writable-scope-guidance.manifest.yaml
validate:
