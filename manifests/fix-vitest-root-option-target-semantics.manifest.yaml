# manifest-kind: draft
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Prevent Vitest root option values from claiming test coverage while preserving
  genuine rooted selectors
type: fix
created: '2026-09-30T07:01:19Z'
metadata:
  priority: high
  tags:
  - vitest
  - command-integrity
  - root-options
  - e230
  bug_report: 20260930-055618-maid-vitest-root-option-e230.md
description: 'Fix the shared --root target-classification gap identified during the
  direct

  Node package-entry review. A root value such as tests/unit/value.test.ts currently

  counts as an executed target. The actual SDK rejects that file-valued root;

  this task repairs static command integrity without claiming a runtime bypass.

  For known Vitest invocations only, consume --root PATH, --root=PATH and -r PATH

  as runner context, never as targets. Resolve the literal existing directory

  against the effective process/package/shell cwd and apply it to all explicit

  selectors regardless of option order. Reject missing, empty, nonexistent,

  file-valued, dynamic/glob or repeated root declarations as unproven executing

  coverage. Keep discovery and executing-coverage normalization consistent.

  Actual installed SDK probes confirmed both root-relative filters and cwd-relative

  filters inside the selected root. Support these bounded literal file/directory

  forms, but admit candidates only when they remain within the selected root and

  map to repository-relative declared inventory. Deduplicate equivalent candidates;

  do not double-prefix cwd-relative targets with the root. Root values alone do

  not prove execution and do not persist as process cwd into later command segments.

  Compose with existing supported package cwd prefixes and bare Vitest shell

  context; preserve the direct-Node shell/VM restrictions delivered previously.

  Leave non-Vitest flags and targets unchanged, including pytest --rootdir.

  No new custom shell parser, selector language or SDK/config execution is needed.

  Existing mode, selector and config/output-value guards stay authoritative.

  Dedicated tests avoid shared-lock revisions. Optional real SDK proof is controlled

  by MAID_TEST_VITEST_ENTRY, uses an isolated project, excludes a failing outside-root

  suite and detects a planted inside-root failure. No consumer or SDK file is edited.

  This additively evolves public target parsing with unchanged signatures; a new

  contract is appropriate because the previous entry-recognition fix is committed.

  Contract hardening: respect the SDK option delimiter so root-looking filter data
  after -- cannot establish or override root context.

  '
temptations:
- risk: Add --root to a global flag list and leave rooted selectors bound to the old
    cwd.
  instead: Normalize root context only for identified Vitest invocations, consume
    every supported root spelling, and apply the resolved root before checking any
    target.
- risk: Treat the root directory or option value itself as evidence of a selected
    test.
  instead: Require independent explicit targets under the root and keep invalid/dangling/file-valued-root
    E230 regressions.
- risk: Apply root streaming in argv order or leak it into another command.
  instead: Determine runner root before scanning selectors and retain segment-local
    root state separate from process cwd.
- risk: Widen wrapper, mode or non-Vitest behavior while fixing root paths.
  instead: Reuse existing invocation guards and prove package/shell composition, direct-Node
    restrictions through adjacent tests, and pytest-rootdir compatibility.
