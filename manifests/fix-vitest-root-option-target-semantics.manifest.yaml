    - kind: function
      name: test_paths_from_executing_validate_command
      args:
      - name: command
        type: tuple[str, ...]
      - name: project_root
        type: Path
      - name: allow_selectors
        type: bool
      - name: django_test_paths_from_validate_segment
        type: _DjangoPathResolver | None
      - name: test_runner_wrappers
        type: tuple[TestRunnerWrapperConfig, ...]
      returns: list[str]
      description: Parse Vitest root as runner-specific selection context rather than
        a target, retaining existing non-Vitest behavior and command boundaries.
    - kind: function
      name: test_files_covered_by_validate_command
      args:
      - name: command
        type: tuple[str, ...]
      - name: test_files
        type: list[str]
      - name: project_root
        type: Path
      - name: django_test_paths_from_validate_segment
        type: _DjangoPathResolver | None
      - name: test_runner_wrappers
        type: tuple[TestRunnerWrapperConfig, ...]
      returns: set[str]
      description: Parse Vitest root as runner-specific selection context rather than
        a target, retaining existing non-Vitest behavior and command boundaries.
  scope:
  - path: docs/troubleshooting.md
    reason: Explain Vitest root option values, supported explicit selector forms and
      fail-closed root handling.
  create:
  - path: tests/core/validation/test_vitest_root_option_targets.py
    artifacts:
    - kind: test_function
      name: test_vitest_root_values_never_count_as_executed_test_targets
      description: Separated, equals and short root values cannot satisfy coverage
        for bare, local-binary or direct-Node Vitest forms.
    - kind: test_function
      name: test_explicit_vitest_targets_resolve_under_root_independent_of_option_order
      description: Explicit relative test selectors bind to the root before coverage
        checks regardless of root option ordering and spelling.
    - kind: test_function
      name: test_cwd_relative_filter_inside_vitest_root_remains_covered
      description: SDK-supported working-directory-relative filters inside the root
        remain supported without double-prefixing root paths.
    - kind: test_function
      name: test_vitest_root_prevents_coverage_claims_for_tests_outside_it
      description: Targets outside the selected SDK root cannot claim coverage of
        declared files, including traversal candidates.
    - kind: test_function
      name: test_absolute_literal_vitest_root_resolves_repo_relative_targets
      description: Literal absolute root directories map selected test files back
        to repository-relative inventory.
    - kind: test_function
      name: test_missing_dynamic_or_ambiguous_vitest_roots_fail_closed
      description: Dangling, empty, nonexistent, dynamic and repeated roots cannot
        claim executing targets.
    - kind: test_function
      name: test_vitest_root_bindings_compose_with_package_cwd_and_shell_context
      description: Supported package-wrapper cwd and bare-Vitest shell context supply
        the correct root base without altering direct-Node wrapper restrictions.
    - kind: test_function
      name: test_vitest_root_does_not_leak_into_following_discovery_segments
      description: Discovery for later command segments uses process cwd rather than
        a prior runner-specific root.
    - kind: test_function
      name: test_pytest_rootdir_keeps_existing_cwd_relative_target_semantics
      description: Pytest rootdir remains an option value and does not acquire Vitest
        root-relative path semantics.
    - kind: test_function
      name: test_vitest_root_runtime_proof_when_sdk_available
      description: Optional actual SDK proof excludes a failing outside-root test
        and catches a planted inside-root failure in an isolated project.
    - kind: test_function
      name: test_root_looking_filter_after_option_delimiter_does_not_change_root
      description: SDK filters after -- are target data, not another root declaration;
        preserve the already bound root and deduplicate equivalent selected targets.
