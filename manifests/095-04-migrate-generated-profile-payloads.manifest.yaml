description: |
  095-02 added the `maid verify --profile` mechanism after the v2.24.0
  release. 095-03 dogfoods `--profile handoff` inside this repository while
  deliberately keeping every downstream-facing command on literal flags.
  This child moves that compatibility boundary.

  TWO FLOORS, WITH DIFFERENT JOBS

  The command floor is `maid-runner>=2.25.0`, the first release that can contain
  the profile implementation. The instruction-payload floor is the current
  pre-change `INSTRUCTION_PAYLOAD_VERSION`, `2026.07.31.1`; this child must
  advance it so `maid init --check` reports pre-migration guidance as stale.
  These are not interchangeable. The date-stamped payload version detects stale
  installed text. It does not make an older CLI understand `--profile`.

  The generator in this next-release branch writes
  `verify --profile pre-commit --since HEAD`. Released v2.24 code keeps writing
  the frozen ten-flag command because it does not contain this change; the new
  configuration is a v2.25 contract and is not backported. The profile form
  must produce the same effective verify namespace and gate set as the frozen
  literal form. The comparison excludes only profile-reporting metadata; it may
  not exclude gate-governing values.

  Do not implement a shell retry such as `profile-command || literal-command`:
  a genuine verification failure would run twice and could be mistaken for an
  argument-compatibility fallback.

  MIXED-VERSION LIMIT

  A 2.25+ init can still be invoked from a different environment than the
  executable later resolved by a system-language pre-commit hook. This child
  does not pretend the payload-version bump solves that. The supported contract
  is explicit: a profile-bearing generated
  hook requires the hook's resolved runner to be 2.25.0 or newer. README and
  maid-onboard guidance must say so, and maid-onboard must verify the detected
  `<maid> --version` meets that floor before refreshing the payload. Running a
  newer global init into a project whose hook deliberately resolves an older
  runner is an unsupported mixed-version operation and must be described as a
  hard incompatibility, not silently claimed as safe. A future portable
  launcher-identity resolver is out of scope.

  PAYLOAD INVENTORY: TWELVE PACKAGED, EIGHT ACTIONABLE SOURCES

  095-03 found twelve packaged files containing `maid verify`. That is the
  audit inventory, not a reason to mechanically rewrite twelve files. Five are
  descriptions, profiling examples, or command stacks with no equivalent
  profile and must stay literal. Eight canonical/source guidance files contain
  actionable stacks that have exact presets. Seven have generated/package
  copies refreshed with `make sync-agent-payloads`; the repo-internal Claude
  draft-implement counterpart has no packaged copy but carries the same
  handoff contract and must migrate with its Codex counterpart.

  Exact migrations:

  - `--summary --require-plan-lock --require-red-evidence` becomes
    `--profile handoff`; an explicit `--since <baseline>` remains explicit.
  - `--packet` becomes `--profile agent-retry`; an explicit baseline remains.
  - `--artifact-coverage --knockout` becomes `--profile deep`; an explicit
    baseline remains.
  - The generated ten-flag stack becomes `--profile pre-commit --since HEAD`
    in the v2.25 next-release payload.

  The task-scoped inner loop `--summary --plan-lock-scope task`, generic
  `--summary`, `--keep-going`, `--json`, and prose that merely names
  `maid verify` stay literal because no shipped profile is gate-equivalent.
  Tests must classify every invocation in the twelve-file packaged inventory;
  they may not assert that every mention contains `--profile`.

  SOURCE OF TRUTH AND GENERATED COPIES

  Edit `.claude/` and `.codex/` canonical sources, then run
  `make sync-agent-payloads`. Never hand-edit `maid_runner/claude/`,
  `maid_runner/codex/`, or `maid_runner/user_skills/` as independent sources.
  Parity tests must cover the seven actionable source/package pairs and the
  complete twelve-file audit inventory. Behavioral mapping covers all eight
  actionable source files. The existing 095-03 boundary test is replaced,
  not weakened: it must positively assert the exact new generator form, prove
  it gate-equivalent to the frozen v2.24 flags, and assert the expected profile
  mapping in each actionable payload.

  LOCK CASCADE

  `tests/cli/test_init_pre_commit.py` is currently hashed by seven plan locks,
  including 095-03. Before implementation, enumerate the live owners again.
  Revise affected locks through `maid plan revise --preserve-red-evidence`
  where eligible. Do not recreate red evidence after changing the generator or
  rewrite an older manifest merely to avoid an E701 failure.

  OUT OF SCOPE

  New profiles, changes to profile gate definitions, baseline inference,
  retry-on-failure compatibility fallbacks, CI examples whose stacks have no
  exact profile, and a general launcher/dependency resolver. Package release
  publication and the eventual version bump are separate release work; this
  child defines and tests the 2.25.0 activation floor without publishing.
temptations:
- risk: Do not treat the INSTRUCTION_PAYLOAD_VERSION bump as proof that an old 
    runner can parse --profile.
  instead: Declare the generated output as a v2.25 contract, bump the payload 
    version separately, and state that mixed-version execution is unsupported.
- risk: Do not use `profile-command || literal-command` as a compatibility 
    fallback.
  instead: Select the command before writing the hook so a real verification 
    failure is returned once and cannot be masked by a second run.
- risk: Do not replace every `maid verify` mention in the twelve-file audit 
    inventory.
  instead: Migrate only stacks exactly represented by handoff, pre-commit, 
    agent-retry, or deep; positively retain unmatched stacks.
- risk: Do not edit packaged payload copies independently or forget the user 
    maid-onboard copies.
  instead: Edit canonical sources, run make sync-agent-payloads, and assert 
    byte-for-byte source/package parity across both distribution paths.
- risk: Do not relax or delete the 095-03 boundary test merely because it was 
    designed to obstruct this migration.
  instead: Replace the frozen deferral assertions with positive generator, 
    equivalence, inventory, version-floor, and profile-mapping assertions, then 
    revise every affected lock with preserved red evidence.
