outcome:
  status: completed
  summary: "Migrated the v2.25 generated pre-commit hook and exact actionable guidance stacks to named verify profiles, advanced the instruction payload version, and documented the runner compatibility floor."
  rationale: "The generator now emits `maid verify --profile pre-commit --since HEAD`, with an independent effective-namespace comparison proving equivalence to the frozen v2.24 ten-flag stack. Exact handoff, agent-retry, and deep stacks were migrated across eight actionable source files and seven generated source/package pairs, while all twelve packaged verify payloads remain inventoried and unmatched commands remain literal. README and onboard guidance require `maid-runner>=2.25.0` and make unsupported mixed-version hook execution explicit. Validation passed with 79 focused tests, 3,793 full-suite tests plus 5 skips, 227/227 manifest commands, repository validation with zero failures, Ruff, Black, and all eight handoff gates. An independent read-only implementation review found no blocking or advisory issues and returned ready."
  lessons:
  - lesson_type: test-quality
    summary: "Profile equivalence must compare against independently frozen pre-migration flags; importing the generator constant after migration would collapse the test into a self-comparison."
    tags:
    - profiles
    - regression-testing
    - test-design
    paths:
    - tests/cli/test_verify_profiles.py
    - tests/cli/test_verify_profile_distribution.py
  - lesson_type: contract-scope
    summary: "Packaged inventory and actionable source inventory are different dimensions: twelve packaged files contain verify commands, while eight source files are actionable and only seven have generated package counterparts."
    tags:
    - payloads
    - inventory
    - scope
    paths:
    - tests/cli/test_verify_profile_distribution.py
    - .claude/skills/maid-runner-draft-implement/SKILL.md
  - lesson_type: workflow
    summary: "Full-suite convergence tests can reveal shared contracts omitted from a focused draft; add those files through one sanctioned scope revision and preserve historical red evidence for contract-equivalent lock cascades."
    tags:
    - plan-lock
    - red-evidence
    - full-suite
    paths:
    - tests/test_review_convergence_guidance.py
    - tests/test_constraint_evidence_docs.py
    - tests/cli/test_init_empty_pre_commit_hook.py
  - lesson_type: compatibility
    summary: "A payload-version bump detects stale installed text but cannot make an older CLI parse a new profile; the generated command needs a separately documented executable version floor and an explicit mixed-version failure boundary."
    tags:
    - compatibility
    - version-floor
    - generated-hooks
    paths:
    - README.md
    - maid_runner/instruction_payload.py
