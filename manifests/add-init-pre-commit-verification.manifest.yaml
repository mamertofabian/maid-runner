# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Provision the MAID verify pre-commit hook safely through maid init
type: feature
created: '2026-07-11T01:23:50Z'
metadata:
  tags:
  - init
  - pre-commit
  - verification
  - downstream
  priority: high
description: |
  Extend `maid init` so every newly initialized or force-refreshed MAID
  repository has a project-local pre-commit configuration entry for the
  commit-time verification gate:

  `maid verify --summary --require-plan-lock --require-red-evidence --fail-fast --no-changed-scope`

  This is an additive evolution of the existing `cmd_init` contract. The
  command owns one explicitly marked block inside `.pre-commit-config.yaml`.
  On a fresh repository it creates a valid config. When a supported block-style
  config already exists, it inserts the managed local-repository block into the top-level
  `repos` sequence without reserializing or otherwise changing user-owned
  hooks, comments, formatting, or other top-level keys. Repeated force init is
  byte-idempotent, while a future MAID refresh may replace only the marked
  block.

  An unmarked hook using the reserved `maid-verify` id, malformed managed
  markers, invalid YAML, or a non-sequence `repos` value is a visible conflict:
  init exits nonzero before creating or rewriting MAID project files and tells
  the operator to reconcile the config. Dry-run reports whether the config
  would be created, updated, or left current without writing it.

  `maid init` provisions configuration only. It does not run `pre-commit
  install`, change Git `core.hooksPath`, or overwrite native/global hooks.
  Successful output and README guidance explain that the repository's existing
  hook runner must invoke `.pre-commit-config.yaml`, with `pre-commit install`
  named only as the standard activation path.

  Outcome evidence considered during planning: init/payload Outcomes repeatedly
  favor downstream throwaway-repository tests, preservation of user-owned
  configuration, and visible failure over silent partial setup. Those lessons
  shape the byte-preservation, conflict, dry-run, and idempotence scenarios
  below. No recalled record directly governed `.pre-commit-config.yaml` init
  behavior, so no broader payload or hook backend changes are inferred.
  Flow-style top-level mappings or `repos` sequences are intentionally rejected
  with conversion guidance because adding a comment-marked managed block would
  require rewriting their compact syntax.
  Existing or broken symbolic links at `.pre-commit-config.yaml` are rejected
  before any init writes so MAID never crosses the repository boundary through
  a user-controlled config path.
temptations:
- risk: Do not parse and dump the entire existing YAML file, which would rewrite user comments and formatting.
  instead: Use parsed YAML structure only to validate and locate the repos sequence, then insert or replace only the marked MAID-owned text block.
- risk: Do not overwrite an unmarked hook that already reserves the maid-verify id.
  instead: Fail before any init writes with a clear conflict message and leave the existing file byte-for-byte unchanged.
- risk: Do not call pre-commit install or change core.hooksPath from maid init.
  instead: Provision the project configuration and print activation guidance that works with standard or global dispatchers.
- risk: Do not make repeated maid init --force append duplicate MAID hooks.
  instead: Recognize and refresh exactly one managed marker block idempotently.
- risk: Do not follow a symbolic link at .pre-commit-config.yaml while reading or atomically replacing the managed configuration.
  instead: Reject existing and broken symbolic-link destinations before any init writes and leave the link and its target untouched.
files:
