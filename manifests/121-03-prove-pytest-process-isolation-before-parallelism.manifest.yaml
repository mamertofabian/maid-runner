          description: "Complete observed worker-id to collected-node mapping used to prove worker count and collection agreement."
        - kind: attribute
          name: serial_environment
          of: PytestEquivalenceReport
          type: tuple[tuple[str, str], Ellipsis]
          description: "Observed Python, pytest, and xdist identity for the serial subprocess."
        - kind: attribute
          name: parallel_environment
          of: PytestEquivalenceReport
          type: tuple[tuple[str, str], Ellipsis]
          description: "Observed Python, pytest, and xdist identity for the parallel subprocess."
        - kind: attribute
          name: differences
