          description: "Canonical serial/parallel collection, outcome, exit-code, and difference report."
        - kind: attribute
          name: serial_outcomes
          of: PytestEquivalenceReport
          type: tuple[CanonicalPytestOutcome, Ellipsis]
        - kind: attribute
          name: parallel_outcomes
          of: PytestEquivalenceReport
