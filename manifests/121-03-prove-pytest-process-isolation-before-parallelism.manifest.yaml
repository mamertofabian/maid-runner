  immutable: true
validate:
  - uv run python -m pytest -q tests/performance/test_pytest_parallel_equivalence_probe.py
  - uv run maid validate manifests/121-03-prove-pytest-process-isolation-before-parallelism.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-10T15:37:35Z"
  summary: >-
    Proved the complete repository pytest suite produces identical serial and
    8-worker loadscope collections, phase outcomes, exit status, worker evidence,
    and execution-environment identities from independent disposable snapshots.
    The previously measured direct parallel candidate completed in 44.11 seconds
    versus the 187.53-second serial broad pytest baseline (about 4.25x faster),
    establishing a safe prerequisite for later worker-policy integration without
    changing the default gate in this manifest.
  rationale: >-
    The rejected 121-02 sharding experiment was environment-confounded and reused
    state across runs. The replacement probe copies exact dependency boundaries,
    isolates serial and parallel state, sanitizes all Git remotes, fingerprints
    worktree and Git-control state, remaps only safe selectors, and binds evidence
    to the requested scheduler, worker IDs, Python, pytest, and xdist versions.
    Any source escape, unsafe link, collection drift, phase drift, nonzero exit,
    missing worker, or environment mismatch fails closed.
  lessons:
    - lesson_type: performance
      summary: >-
        Repository-wide pytest parallelism is viable: the direct 8-worker
        loadscope run was about 4.25x faster than serial while the immutable
        equivalence probe certified the full observable outcome set.
      tags:
        - pytest
        - xdist
        - loadscope
        - performance
      paths:
        - tools/check_pytest_parallel_equivalence.py
        - tests/performance/test_pytest_parallel_equivalence_probe.py
    - lesson_type: anti-gaming
      summary: >-
        A serial/parallel comparison must isolate filesystem and Git state,
        sanitize remotes, bind every worker identity, and detect source escapes;
        matching test names or exit codes alone can certify contaminated runs.
      tags:
        - fail-closed
        - process-isolation
        - git-isolation
        - environment-identity
      paths:
        - tools/check_pytest_parallel_equivalence.py
        - tests/performance/test_pytest_parallel_equivalence_probe.py
    - lesson_type: performance
      summary: >-
        The exact deep gate spent 1,767.56 seconds before failing artifact
        coverage, while aggregate maid test completed in 231.98 seconds. Deep
        speedups therefore require runtime-evidence reuse and knockout isolation
        in addition to pytest workers.
      tags:
        - deep-verify
        - artifact-coverage
        - runtime-evidence
      paths:
        - manifests/121-08-collect-fixture-aware-runtime-evidence.manifest.yaml
        - manifests/drafts/121-10-reuse-runtime-evidence-in-deep-verify.manifest.yaml
        - manifests/drafts/121-14-run-isolated-knockouts-with-bounded-workers.manifest.yaml
  review_notes:
    - source: implementation-review-rounds
      severity: needs-changes
      summary: >-
        Independent adversarial review found and drove closure of unsafe venv
        interpreter links, linked-worktree Git pointer sharing, unbound worker
        identities, nondeterministic clone reflogs, source-pointing remotes,
        FETCH_HEAD/empty-directory/mode state channels, and non-origin remotes.
    - source: implementation-re-review
      severity: ready
      summary: >-
        Final revision-17 review found no remaining blockers and confirmed
        complete Git-control metadata/topology coverage, remote sanitization,
        deterministic snapshot seeding, and the existing selector, symlink,
        environment, and source-escape protections.
    - source: assessed-deep-gate
      severity: warning
      summary: >-
        The exact deep command ran for 1,767.56 seconds and stopped at 1,684
        repository-wide artifact findings. Focused coverage isolated two E710
        errors for annotation-only frozen dataclasses that are instantiated and
        behaviorally asserted; this validator limitation is recorded in
        ~/.maid/bug-report/20260810-233645-maid-runner-dataclass-artifact-coverage.md.
  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/performance/test_pytest_parallel_equivalence_probe.py]
      status: passed
      summary: "All 55 focused isolation, equivalence, escape, scheduler, environment, and CLI tests passed."
    - command: [uv, run, maid, validate, manifests/121-03-prove-pytest-process-isolation-before-parallelism.manifest.yaml, --mode, implementation, --quiet]
      status: passed
      summary: "Implementation validation passed against approved plan-lock revision 17."
    - command: [uv, run, python, tools/check_pytest_parallel_equivalence.py, --project-root, ., --workers, '8', --dist, loadscope, tests/]
      status: passed
      summary: >-
        The exact immutable command passed in an isolated byte-copy of the
        current dirty project in 301.70 seconds; the watched checkout separately
        demonstrated fail-closed invalidation during concurrent Git writes.
    - command: [uv, run, maid, validate, --quiet]
      status: passed
      summary: "Repository-wide manifest validation passed."
    - command: [uv, run, maid, test]
      status: passed
      summary: "All 246 repository manifest command groups passed in 231.98 seconds."
    - command: [uv, run, maid, verify, --profile, deep, --require-plan-lock, --require-red-evidence, --since, 0e4e2c5]
      status: failed
      summary: >-
        Schema, behavioral, and implementation passed; artifact coverage blocked
        on 1,684 repository-wide findings after 1,767.56 seconds, including two
        annotation-only dataclass E710 limitations documented in the bug report.
