# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Prove full-suite pytest outcome equivalence before enabling runner-native workers"
type: refactor
created: "2026-08-10T12:21:31Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - pytest
    - isolation
    - xdist
description: |
  The rejected 121-02 subprocess shards changed outcomes, but reconstruction
  of that session found an uncontrolled environment difference: its isolated
  worktree had no `node_modules/typescript`. The same session installed the
  declared npm dependency, after which the suspected TypeScript files and the
  full serial `maid test` passed. The experiment therefore did not prove a
  process-order leak, and speculative cache-reset fixtures would encode the
  wrong diagnosis.

  Add pytest-xdist as a development dependency but do not enable it in MAID.
  Provide a non-recursive external probe that runs a supplied target set in
  fresh serial and pinned `--dist loadscope` processes, captures collection and
  setup/call/teardown outcomes through a tiny plugin, and compares canonical
  node/phase result sets and exit status. The report binds evidence to the
  observed scheduler, worker identities, and complete per-worker collections;
  the repository acceptance command proves `loadscope` with eight workers,
  not an extrapolated range. The probe materializes two byte-and-mode-equivalent
  disposable project snapshots and runs serial and parallel pytest in separate
  snapshots, so neither run can change its successor's starting state. It also
  fingerprints the source worktree before and after both runs and fails closed
  if an absolute-path or editable-environment escape mutates the source. Inside-root
  absolute path/node selectors are remapped into each snapshot; parent and
  outside-root selectors are rejected. Snapshots preserve bytes, modes, empty
  directories, and internal relative symlinks, while absolute or escaping
  symlinks fail closed before execution except interpreter links inside the
  copied `.venv` dependency boundary that resolve to the probe's actual Python
  executable. For a linked worktree whose `.git` is a pointer file, each
  snapshot receives independently cloned Git metadata before identical dirty
  and untracked worktree bytes are overlaid. Every Git remote is removed from
  both linked and standalone snapshot seeds, then the second snapshot is
  byte-copied from that sanitized seed so
  clone-time reflogs cannot create false inequality; the pointer is never copied
  or shared. Source Git contents, topology, and lstat metadata use the worktree's
  fail-closed policy (mode, ownership, link count, and ctime, excluding access
  time); config, index, object, `FETCH_HEAD`, ref, empty-directory, or permission
  escapes all fail. Concurrent external Git changes therefore
  invalidate the proof instead of becoming a hidden state channel. This makes Git
  control metadata an explicit isolation boundary rather than part of the
  byte-equivalent worktree payload. Generated roots (`.claude-automation`,
  `.codex-automation`, `.pytest_cache`, `.ruff_cache`, `.mypy_cache`,
  `__pycache__`, and `maid_runner.egg-info`) are excluded from snapshot inputs
  and cannot be selected as targets. `.venv` and `node_modules` are copied into
  both snapshots rather than shared or omitted. The report also requires equal
  environment identities for both runs: resolved `sys.executable` plus Python
  implementation/version, `pytest.__version__`, and the installed
  `pytest-xdist` distribution version. Missing, forged, or unequal worker
  identities block success. Its focused
  fixture-project tests run in the normal suite; the expensive whole-repository
  probe is immutable acceptance evidence that must be green before 121-07 may
  promote. Equivalence is green only when both runs exit successfully: matching
  failures never count, so a dependency-broken environment cannot certify
  parallel execution.

  There is no marker-only serial lane: xdist would ignore it. Any remaining
  lifecycle case must be made process/file independent or block worker
  enablement.
temptations:
  - risk: "Do not preserve the disproven claim that 121-02 established a TypeScript process-order leak."
    instead: "Record the missing npm dependency and rely on a fresh full-suite serial/worker comparison for actual evidence."
  - risk: "Do not treat two matching nonzero pytest runs as successful equivalence."
    instead: "Require both fresh runs to exit zero in addition to matching collection and phase outcomes."
  - risk: "Do not generalize one scheduler/worker-count result to untested counts or a marker with no enforcement."
    instead: "Bind evidence to loadscope and eight workers; block any other injected count until separately proven."
  - risk: "Do not recursively launch the full suite from a normally collected test."
    instead: "Refuse equivalent repository-wide selectors while under pytest, unit-test the probe on adversarial fixture projects, and run the repository-wide comparison as explicit acceptance evidence."
  - risk: "Do not let the serial probe contaminate the parallel probe through persistent project files."
    instead: "Materialize equivalent disposable snapshots, fingerprint the source worktree, remap only canonical inside-root selectors, preserve internal relative links and the copied .venv interpreter boundary, and reject every other parent, outside-root, absolute-link, or escaping-link path before subprocess launch."
