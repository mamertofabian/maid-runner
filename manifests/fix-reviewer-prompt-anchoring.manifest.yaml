  - anti-gaming
  priority: high
description: |
  Fix the implementation-review orchestration defect recorded in
  ~/.maid/bug-report/20260820-144024-maid-reviewer-prompt-anchoring.md.
  The current convergence wording can be translated into reviewer prompts
  labeled "final" and supplemented with summaries that assert earlier fixes
  are correct. A subsequent neutral review found an account-switch blocker,
  demonstrating that this approval-oriented framing can weaken the independent
  review gate.

  Replace the fixed two-round stopping rule with issue-driven convergence.
  Every fresh reviewer receives the complete task-baseline-to-current delta,
  all manifest-declared implementation and behavioral-test artifacts, factual
  validation outcomes, environment limits, and the plan-revision signal. It
  receives no prior findings, fix lineage, verdicts, round count, or statements
  that intended behavior already works. The coordinator—not the reviewer
  prompt—owns convergence state and decides whether the latest independent
  verdict permits handoff.

  This manifest supersedes 085-06 because that approved contract explicitly
  requires a two-round bound. It preserves the earlier contract's unrelated
  iteration, planner, payload-sync, and baseline-aware verification guidance.
  Source skill and documentation payloads remain authoritative; packaged
  copies are regenerated through scripts/sync_claude_files.py.
temptations:
- risk: Keep the phrase "final review" while merely telling reviewers to remain independent.
  instead: Prohibit outcome- and convergence-framing in every reviewer prompt and reserve finality for the coordinator's post-review decision.
- risk: Give later reviewers only the latest fix hunks or list the findings they are expected to confirm.
  instead: Provide the complete baseline-to-current delta and all declared artifacts on every round without disclosing review lineage.
- risk: Retain a fixed round limit to reduce review cost even when actionable findings remain.
  instead: Continue fresh independent rounds after issue-driven fixes until the latest verdict has no blocking or current-scope actionable findings.
- risk: Hand-edit generated maid_runner skill or documentation copies.
  instead: Edit source payloads and run scripts/sync_claude_files.py to regenerate packaged copies.
- risk: Treat passing tests or validation commands as correctness conclusions in the review packet.
  instead: Report commands and factual outcomes only; require the reviewer to inspect behavior and reach its own verdict.
