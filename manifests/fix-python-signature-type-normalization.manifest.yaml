  - path: maid_runner/core/_type_compare.py
    artifacts:
    - kind: function
      name: normalize_type
      args:
      - name: type_str
        type: Optional[str]
      returns: Optional[str]
      description: Canonicalize supported nested type positions while retaining value metadata and fallback
        behavior.
    - kind: function
      name: types_match
      args:
      - name: manifest_type
        type: Optional[str]
      - name: impl_type
        type: Optional[str]
      returns: bool
      description: Preserve symmetric public comparison and wildcard semantics.
  - path: maid_runner/validators/_python_implementation.py
    artifacts:
    - kind: function
      name: collect_implementation_artifacts
      args:
      - name: tree
        type: ast.AST
      - name: file_path
        type: str
      returns: list[FoundArtifact]
      description: Preserve public collection while retaining Literal/Annotated value quoting in signature
        types.
