# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Compare nested Python unions and Literal string annotations symmetrically
type: fix
created: '2026-10-20T20:08:30Z'
description: 'Normalize supported nested standard annotation type positions symmetrically using CPython
  AST/parser services without evaluating types. Pipe unions, Optional and nested Union member ordering
  must compare consistently inside generic/Callable positions. Keep value positions distinct: preserve
  Literal string quoting/numeric-vs-string and value differences, and Annotated metadata including whitespace,
  ordering and non-type expressions. Correct Python signature rendering through the existing value-aware
  alias renderer where appropriate so parameters and returns validate against source spellings and survive
  snapshot roundtrips. Preserve existing wildcard behavior, legacy tuple-ellipsis implementation compatibility
  and plugin/non-Python spelling semantics; unsupported syntax retains the existing comparison path. No
  schema, parser replacement, language evaluator or import/type resolution analyzer. Public signatures
  unchanged. Hardened recall matched PEP695/Protocol/enum producer Outcomes: reuse existing value-aware
  alias rendering. Their import/binding redesign lessons are outside this task; preserve exact-value and
  compatibility boundaries without new resolution analysis. Intentionally evolve the prior alias-only
  Literal characterization to quoted signature success plus explicit unquoted mismatch under this contract;
  retain its test signature and refresh approved shared-test dependent hashes with unchanged commands
  through public revision.'
temptations:
- risk: Make Literal signatures pass by stripping quotes or coercing string/numeric values, or normalize
    Annotated metadata as types.
  instead: Preserve value positions and test distinct strings/numbers/metadata through public comparison
    and validation; reuse existing value-aware rendering.
- risk: Normalize unions only at the outermost position or only one side of the comparison.
  instead: Normalize supported nested type positions symmetrically with canonical public results and parameter/return/snapshot
    regressions.
- risk: Turn the shared matcher into a Python-only evaluator or alter established plugin and tuple-ellipsis
    behavior.
  instead: Use bounded parser-backed syntax normalization with legacy fallback and explicit cross-language/ellipsis
    compatibility controls; preserve public API signatures.
