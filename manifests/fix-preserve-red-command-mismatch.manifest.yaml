              type: argparse.Namespace
          returns: int
          description: "Rejects explicit preserved-evidence revisions whose evidence
            command multiset differs from the current manifest validate commands,
            reports an actionable fresh-evidence workflow, and leaves the lock unchanged;
            matching metadata-only preservation remains supported."
