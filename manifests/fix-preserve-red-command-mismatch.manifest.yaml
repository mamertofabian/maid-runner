        - kind: test_function
          name:
            test_preserve_red_evidence_accepts_reordered_validate_command_multiset
          description: "Explicit preserve mode still succeeds and carries the original
            evidence when the current validate commands are only reordered, matching
            E707 multiset semantics rather than imposing list-order equality."
        - kind: test_function
          name:
            test_preserve_red_evidence_rejects_existing_e707_mismatch_without_revising_lock
          description: "For both red and test-only-green evidence classes, explicit
            preserve mode rejects an existing lock whose evidence commands mismatch
            its locked contract even when the current manifest was changed to match
            the spliced evidence; lock bytes and revision remain unchanged."
        - kind: test_function
          name:
            test_preserve_red_evidence_rejects_malformed_command_entries_without_revising_lock
          description: "Malformed non-string command entries in either the locked
            contract snapshot or red evidence produce exit 2 without an exception,
            lock rewrite, or revision advance."
