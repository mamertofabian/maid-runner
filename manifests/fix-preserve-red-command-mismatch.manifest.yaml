    - validation-trust
    - fail-closed
    - cli
description: |
  `maid plan revise --preserve-red-evidence` currently accepts a manifest whose
  validate command strings changed, saves a new lock contract containing those
  commands, and carries forward evidence captured from the old commands. The
  command reports success even though immediate strict verification rejects the
  saved lock with E707 RED_EVIDENCE_COMMAND_MISMATCH.

  Fail before writing the revised lock when explicitly preserved evidence does
  not match either the existing lock's validate-command snapshot or the current
  manifest's validate commands. The refusal must explain that validate commands
  changed and direct the caller to a fresh-evidence revision workflow. This
  prevents an already E707-invalid lock from being laundered by changing the
  manifest to match spliced evidence. Metadata-only revisions with identical
  command multisets keep their existing successful behavior. E707 enforcement
  remains unchanged. Malformed non-string command entries in either the locked
  contract or evidence must fail closed with exit 2 rather than raising.

  This is a behavioral tightening of the existing `cmd_plan_revise` contract,
  with no public signature change, so it chain-merges with the prior plan-lock
  manifests rather than superseding their public artifacts.
temptations:
  - risk: "Do not weaken or bypass E707 so the invalid revised lock verifies."
    instead: "Reject the incompatible preserve request before `PlanLock.save` and
      leave verifier enforcement unchanged."
  - risk: "Do not compare only the prior and current manifest hashes or revision reason."
    instead: "Compare the preserved evidence command multiset with the current validate
      command multiset using the same command-string semantics as E707."
  - risk: "Do not partially write or advance the lock before reporting the mismatch."
    instead: "Detect the mismatch before saving and assert the existing lock bytes
      remain unchanged."
  - risk: "Do not validate preserved evidence only against the current manifest,
      which could legitimize evidence already inconsistent with the locked contract."
    instead: "Require the evidence command multiset to match both the existing lock
      snapshot and the current manifest before revising."
  - risk: "Do not pass untrusted lock or evidence command values directly into Counter."
    instead: "Require every compared command entry to be a string and reject malformed
      payloads before multiset construction."
