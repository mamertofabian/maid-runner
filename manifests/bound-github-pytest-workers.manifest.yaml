schema: "2"
goal: Bound GitHub pytest workers to hosted-runner capacity
type: fix
created: "2026-08-20T12:15:30Z"
metadata:
  planning_state: behavioral-contract
  promotion_ready: true
  tests_status: created
  status: implementation-ready
  tags: [ci, pytest, xdist, reliability, release]
  priority: critical
description: |
  Keep the repository's local eight-worker policy, but make both reusable
  GitHub workflows accept an optional pytest-workers input and cap this
  repository's direct CI runs at four. Reusable callers that omit the input
  retain their own repository worker policy; explicit caller overrides pass
  through to `maid test` and `maid verify`. Hosted runners are
  oversubscribed at eight workers: the 4,544-test aggregate takes 254-442
  seconds instead of 124 locally and repeatedly trips timing-sensitive tests.
  Four remains parallel, fits the accepted worker policy, and is caller
  overridable for larger runners.

  This is an additive chain extension rather than a supersession: it adds one
  optional input to each reusable workflow, preserves every existing input,
  trigger, default command, report, and failure semantic, and leaves the
  repository's existing eight-worker local policy intact.
temptations:
- risk: Do not disable xdist or retry failed test commands.
  instead: Match the default CI worker count to hosted capacity and preserve first-run failures.
- risk: Do not lower the repository's local default from eight workers.
  instead: Add four to accepted explicit counts and wire only workflow defaults to four.
