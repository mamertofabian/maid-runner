# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Resolve legacy-baseline git paths against the project root so plan-lock migration
  works when MAID is scoped to a git subdirectory"
type: fix
created: "2026-07-25T10:07:45Z"
metadata:
  maid_task_base: 86e02b691133c71233334a9c186b69b62ef1b7d4
  source_bug_report: 
    /home/atomrem/.maid/bug-report/20260725-071959-maid-runner-plan-lock-subdirectory-git-paths.md
  tags:
    - plan-lock
    - legacy-migration
    - git-paths
    - monorepo
  priority: high
description: |
  `maid plan lock --legacy-baseline` is unusable when `project_root` is a
  subdirectory of the git repository, which MAID already treats as a supported
  configuration: `maid_runner/core/worktree.py` deliberately resolves the git
  prefix via `git rev-parse --show-prefix` and strips it, so changed-scope
  verification is already correct in that layout.
  `maid_runner/core/plan_lock.py` contradicts it by assuming the project root is
  the repository root. Two defects follow.

  1. `capture_legacy_baseline_evidence` reads the committed manifest with
     `git show HEAD:<manifest_rel>`, where `manifest_rel` is project-relative.
     `git show` resolves paths from the repository root regardless of cwd, so
     from a subdirectory it fails with `fatal: path '<prefix><path>' exists, but
     not '<path>'`.

  2. `_git_changed_paths` unions two path namespaces without normalizing them:
     `git diff --name-only` emits repository-root-relative paths regardless of
     cwd, while `git ls-files --others` emits cwd-relative paths. The dirty
     guards then compare that inconsistent set against the project-relative
     `manifest_rel`, so a dirty manifest arrives as `<prefix>manifests/x.yaml`,
     never matches, and the guard rejects the one file it exists to whitelist.

  Rationale for the chosen fix. Both defects are resolved by making the git
  invocations agree on a single namespace — project-relative — rather than by
  normalizing after the fact. Defect 1 addresses the blob by its repository-root
  path (`HEAD:<prefix><manifest_rel>`), because that is the only namespace
  `git show` accepts. Defect 2 passes `--relative` to `git diff`, which makes
  git emit cwd-relative paths directly instead of post-stripping them in Python;
  `git ls-files --others` is already cwd-relative and is left alone, since
  stripping both would corrupt the untracked set.

  Rationale for the scoping semantics. `--relative` also filters `git diff`
  output to the subdirectory, so dirty files elsewhere in a monorepo no longer
  block a legacy-baseline migration. This is deliberate and matches the existing
  precedent in `worktree.py::_to_project_relative_paths`, which likewise drops
  paths outside the prefix: the MAID project scope is the subdirectory, and a
  sibling application's dirty tree is not evidence about this contract. Inside
  the project scope the guard stays exactly as strict as before.

  Both git behaviors were confirmed directly before drafting: from a
  subdirectory, `git diff --name-only --relative` returns `tracked.txt` while the
  bare form returns `sub/tracked.txt`, and `git show HEAD:$(git rev-parse
  --show-prefix)tracked.txt` succeeds where the unprefixed form fatals. At the
  repository root the prefix is empty and `--relative` is a no-op, so ordinary
  single-root repositories are unaffected.
temptations:
  - risk: "Do not strip the git prefix from both path sources; `git ls-files --others`
      is already cwd-relative and would be corrupted."
    instead: "Normalize only the `git diff` source, by passing `--relative` so git
      emits project-relative paths at the source."
  - risk: "Do not widen the dirty guard (for example by matching on basename or by
      comparing suffixes) to make the subdirectory case pass."
    instead: "Keep exact project-relative string comparison against `manifest_rel`
      and prove with a test that an unrelated dirty path inside the project still
      raises."
  - risk: "Do not import the private `_git_prefix` or `_to_project_relative_paths`
      helpers from `worktree.py`; their errors are worded for the worktree scope gate
      and would surface as misleading plan-lock failures."
    instead: "Resolve the prefix through plan_lock's own `_git_text` helper so failures
      keep the existing legacy-baseline error wording."
  - risk: "Do not assert only that the subdirectory case stops raising; a fix that
      disabled the guard entirely would also stop raising."
    instead: "Pin all four states: subdirectory accepts the dirty manifest, subdirectory
      rejects an unrelated in-project dirty path, out-of-project dirt is ignored,
      and repository-root behavior is unchanged."
files:
  edit:
    - path: maid_runner/core/plan_lock.py
      artifacts:
        - kind: function
          name: capture_legacy_baseline_evidence
          args:
            - name: manifest_path
              type: Path
            - name: project_root
              type: Path
            - name: reason
              type: str
          returns: LegacyBaselineEvidence
          description: >-
            Resolve the committed manifest blob by its repository-root path and
            compare dirty paths in a single project-relative namespace, so the
            migration succeeds when project_root is a git subdirectory while the
            in-scope dirty guard stays exactly as strict as at the repository
            root.
  create:
    - path: tests/core/test_plan_lock_git_subdirectory.py
      artifacts:
        - kind: test_function
          name: test_legacy_baseline_accepts_dirty_manifest_in_git_subdirectory
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "MAID is scoped to apps/frontend inside a monorepo and
            the tracked manifest there is dirty because its validate command was strengthened."
          actions:
            - type: api_call
              subject:
                export: capture_legacy_baseline_evidence
          expected:
            behavior: "capture_legacy_baseline_evidence returns LegacyBaselineEvidence
              whose baseline_commit is repository HEAD, instead of failing on git
              show or on the dirty-path guard."
        - kind: test_function
          name: 
            test_legacy_baseline_rejects_unrelated_dirty_path_in_git_subdirectory
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "The same subdirectory project also has a dirty source
            file beside the manifest."
          actions:
            - type: api_call
              subject:
                export: capture_legacy_baseline_evidence
          expected:
            behavior: "capture_legacy_baseline_evidence raises ValueError naming the
              unrelated project-relative path, proving the prefix fix did not relax
              the guard."
        - kind: test_function
          name: test_legacy_baseline_rejects_untracked_path_in_git_subdirectory
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "The subdirectory project has an untracked implementation
            file alongside its dirty manifest."
          actions:
            - type: api_call
              subject:
                export: capture_legacy_baseline_evidence
          expected:
            behavior: "capture_legacy_baseline_evidence raises ValueError naming the
              untracked project-relative path, proving git ls-files output was not
              prefix-stripped along with git diff output."
        - kind: test_function
          name:
            test_legacy_baseline_ignores_dirty_paths_outside_the_project_subdirectory
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "A sibling application elsewhere in the monorepo is dirty
            while the MAID-scoped subdirectory is clean apart from its manifest."
          actions:
            - type: api_call
              subject:
                export: capture_legacy_baseline_evidence
          expected:
            behavior: "capture_legacy_baseline_evidence succeeds, because the MAID
              project scope is the subdirectory and out-of-scope dirt is not evidence
              about this contract."
        - kind: test_function
          name: 
            test_legacy_baseline_still_rejects_unrelated_dirty_path_at_repository_root
          args:
            - name: tmp_path
              type: Path
          returns: None
          source_scenario: "An ordinary single-root repository where the project root
            is the repository root has a dirty file beside the manifest."
          actions:
            - type: api_call
              subject:
                export: capture_legacy_baseline_evidence
          expected:
            behavior: "capture_legacy_baseline_evidence still raises ValueError naming
              the unrelated path, confirming the empty-prefix path is unchanged."
  read:
    - maid_runner/core/worktree.py
    - maid_runner/core/manifest.py
    - tests/cli/test_plan_legacy_baseline_cmd.py
    - manifests/fix-legacy-plan-lock-baseline-migration.manifest.yaml
validate:
  - uv run python -m pytest -q tests/core/test_plan_lock_git_subdirectory.py 
    tests/cli/test_plan_legacy_baseline_cmd.py
  - uv run maid validate 
    manifests/fix-plan-lock-git-subdirectory-paths.manifest.yaml --mode 
    behavioral --quiet
outcome:
  status: completed
  completed_at: '2026-07-25T18:40:56+08:00'
  summary: >-
    maid plan lock --legacy-baseline now works when the MAID project root is a
    git subdirectory, because the committed manifest blob is addressed by its
    repository-root path while every dirty-path comparison happens in a single
    project-relative namespace.
  rationale: >-
    Two independent path-namespace defects blocked a configuration MAID already
    treats as supported. git show resolves from the repository root regardless
    of cwd, so the blob is now addressed as HEAD:<prefix><manifest_rel>; git
    diff --name-only emits repository-root-relative paths while git ls-files
    --others emits project-relative ones, so --relative was added to the diff
    call only, normalizing at the source instead of post-stripping in Python.
    Stripping both sources would have silently discarded every untracked file in
    a subdirectory project and reopened the escape hatch the legacy-baseline
    guard exists to close. The prefix is read with splitlines()[0] rather than
    strip() so a directory name carrying leading or trailing whitespace is not
    corrupted. --relative also scopes the guard to the subdirectory, matching
    the existing precedent in worktree.py::_to_project_relative_paths; at the
    repository root the prefix is empty and --relative is provably a no-op, so
    no previously working configuration changes behavior.
  lessons:
    - lesson_type: cross-module-consistency
      summary: >-
        When two modules shell out to git for the same concept, they must agree
        on one path namespace explicitly; worktree.py normalized the subdirectory
        prefix while plan_lock.py assumed the repository root, and the
        contradiction sat undetected because the primary flow never exercised the
        legacy-baseline path from a subdirectory.
      tags:
        - git-paths
        - monorepo
        - plan-lock
      paths:
        - maid_runner/core/plan_lock.py
        - maid_runner/core/worktree.py
    - lesson_type: anti-gaming
      summary: >-
        Normalizing a mixed path union is not symmetric: git diff needs
        --relative but git ls-files --others is already project-relative, and
        stripping both passes every obvious test while silently dropping all
        untracked files. Independent review caught that the first four tests
        could not tell the two implementations apart, and the added fifth test
        was empirically proven to be the sole discriminator.
      tags:
        - test-discrimination
        - implementation-review
        - fail-closed
      paths:
        - tests/core/test_plan_lock_git_subdirectory.py
    - lesson_type: scope-discipline
      summary: >-
        Fixing the pre-run dirty guard narrowed the post-run mutation guard as a
        side effect, but restoring repository-wide post-run detection requires
        switching that guard from an absolute comparison to a pre/post delta,
        which is a separate behavioral contract; it was filed as a follow-up
        instead of being folded into this fix.
      tags:
        - scope-boundary
        - follow-up
      paths:
        - maid_runner/core/plan_lock.py
  review_notes:
    - source: maid-implementation-reviewer
      severity: medium
      summary: >-
        First review returned ready to merge with two actionable items: the
        locked tests could not distinguish the shipped fix from a strip-both
        implementation that discards untracked files, and _git_prefix used
        strip() where worktree.py uses splitlines()[0], corrupting a
        whitespace-bearing directory name. Both were fixed in-session rather than
        deferred.
    - source: maid-implementation-reviewer
      severity: ready
      summary: >-
        Re-review confirmed both fixes empirically: a runtime-patched strip-both
        implementation failed only the new fifth test while the original four
        still passed, and _git_prefix now returns byte-identical output to
        worktree.py on the pathological whitespace input. No blocking or residual
        findings; the post-run guard delta redesign was agreed as a follow-up
        draft.
