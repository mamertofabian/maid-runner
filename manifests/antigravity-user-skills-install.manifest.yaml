# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Deliver and safely uninstall the user-level `maid-onboard` skill for Antigravity under `~/.gemini/config/skills/maid-onboard` via `maid skills install|uninstall`"
type: feature
created: "2026-11-26T05:42:05Z"
metadata:
  epic: antigravity-support
  tags:
    - antigravity
    - user-skills
    - packaging
    - agent-integration
  priority: medium
description: |
  Slice 3 (final child) of `manifests/drafts/antigravity-support.epic.yaml`.

  Extends the user-level `maid-onboard` bootstrapper (`maid skills install` /
  `maid skills uninstall`) to cover Google Antigravity's documented global
  discovery path (`~/.gemini/config/skills/maid-onboard/`) without duplicating
  a third manual `maid-onboard` source file or breaking existing 2-tool
  synthetic-payload tests.

  Design decisions (rationale):

  1. Explicit per-tool destination map in `maid_runner/core/skill_install.py`:
     Replace the implicit `f".{tool}" / "skills"` assumption with an explicit
     mapping (`claude -> .claude/skills`, `codex -> .codex/skills`,
     `antigravity -> .gemini/config/skills`) and map each installed destination
     label back to its payload tool name directly during uninstall rather than
     parsing the first path segment (`label.split("/")[0]`). This also ensures
     `_has_symlinked_parent()` guards every component (`.gemini`,
     `.gemini/config`, `.gemini/config/skills`) before removing anything.
  2. Backward-compatible optional tool handling for synthetic unit-test
     payloads:
     `claude` and `codex` remain required payload directories (`FileNotFoundError`
     if either is absent, preserving `test_install_onboard_skill_requires_both_tool_payloads`).
     `antigravity` is installed whenever `payload_root / "antigravity" / "maid-onboard"`
     exists (always true in the real packaged `maid_runner/user_skills/`). During
     uninstall, `antigravity` is evaluated whenever either its packaged payload
     source exists OR `<target_root>/.gemini/config/skills/maid-onboard` exists
     on disk (preserving it safely if installed without a matching payload
     source, while keeping 2-tool synthetic test expectations identical).
  3. Single canonical `maid-onboard` source (`scripts/sync_claude_files.py`):
     `sync_user_skills()` copies `.claude/skills/maid-onboard` into
     `maid_runner/user_skills/antigravity/maid-onboard` alongside the existing
     `claude` and `codex` user-skill copies, keeping `maid-onboard` out of
     `maid_runner/antigravity/manifest.json` (`skills.distributable`).
  4. Onboard guidance & epic closure:
     Updates `.claude/skills/maid-onboard/SKILL.md` and
     `.codex/skills/maid-onboard/SKILL.md` (and their synced `user_skills`
     copies) so `maid-onboard` knows about `--tool antigravity`,
     `.agents/skills`, and `~/.gemini/config/skills`; updates `pyproject.toml`
     package-data and `README.md`; and archives the consumed epic
     `manifests/drafts/antigravity-support.epic.yaml`.

  Outcome recall digestion:
  - Applied lesson from `add-skills-install-command`: keep `install_onboard_skill`
    and `uninstall_onboard_skill` pure over injected `(target_root, payload_root)`
    parameters, keep `maid-onboard` out of per-repo init distributables, and
    preserve fail-loud / convergent-reinstall / copy-fallback behavior.
  - Applied lesson from `069-03` and `antigravity-init-payload`: place new
    behavioral tests in a dedicated manifest-owned file
    (`tests/cli/test_skills_antigravity_install.py`) so plan-locked
    `tests/cli/test_skills_install.py` and `tests/cli/test_uninstall_cmd.py`
    stay untouched and green.
temptations:
  - risk: "Do not hardcode `label.split('/', 1)[0].removeprefix('.')` to map `.gemini/config/skills/maid-onboard` back to its payload directory."
    instead: "Use an explicit tool-to-relative-destination table so uninstall resolves `payload_root / tool / 'maid-onboard'` directly for every tool."
  - risk: "Do not break existing 2-tool synthetic payload tests in `test_skills_install.py` and `test_uninstall_cmd.py` by unconditionally requiring `payload_root / 'antigravity'`."
    instead: "Require `claude` and `codex`, install `antigravity` whenever `payload_root / 'antigravity' / 'maid-onboard'` is present, and always ship `maid_runner/user_skills/antigravity/maid-onboard` in the package."
  - risk: "Do not let `maid-onboard` leak into `maid_runner/antigravity/manifest.json` (`skills.distributable`)."
    instead: "Keep `maid-onboard` exclusively under `maid_runner/user_skills/` and assert its absence from `maid_runner/antigravity/manifest.json`."
  - risk: "Do not drop existing `maid-onboard` workflow anchors tested by `tests/cli/test_skills_install.py`."
    instead: "Add Antigravity (`--tool antigravity`, `.agents/skills`, `~/.gemini/config/skills`) alongside existing Claude/Codex guidance while preserving every existing anchor."
