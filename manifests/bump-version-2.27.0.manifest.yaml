  priority: high
description: |
  Bump maid-runner from the published 2.26.0 release to 2.27.0 and synchronize
  package metadata, editable lock metadata, changelog, roadmap version/date
  references, and the shared release-metadata behavioral contract.

  This is a SemVer minor release because the post-v2.26.0 branch adds the
  backward-compatible `maid chain merge` command family, differential knockout
  proof, recorded evidence reuse, and substantial deep-verification performance
  improvements. The branch also adds exact Python TypeAlias support and fixes
  plan-lock evidence integrity, merge-aware worktree scope, Windows uninstall,
  release-PR reuse, snapshot timestamp portability, evidence-cache isolation,
  reviewer-prompt anchoring, and bounded plan-lock command timeouts.

  Prior release Outcomes require package metadata, the editable lock, changelog,
  roadmap, runtime assertions, comparison links, built artifacts, and independent
  review evidence to remain synchronized. Release notes therefore summarize the
  observable feature groups and their fail-closed boundaries rather than copying
  commit subjects or exposing internal implementation churn.

  This task prepares local release metadata only. Tagging, publishing, pushing,
  merging to main, and creating a GitHub release remain separate actions requiring
  explicit authorization.
temptations:
- risk: Do not update only pyproject.toml while leaving uv.lock, roadmap, runtime assertions, or changelog stale.
  instead: Update all 2.27.0 mirrors together and regenerate uv.lock through uv.
- risk: Do not describe chain merging without its preservation and evidence-equivalence boundaries.
  instead: State that apply is refusal-based and retains unrelated multi-file contracts and validation obligations.
- risk: Do not turn the 121 performance series into dozens of implementation-level changelog bullets.
  instead: Summarize the observable deep-verification speedup, isolation, cache, and fail-closed behavior as cohesive entries.
- risk: Do not tag, publish, push, merge, or create a GitHub release because local preparation is green.
  instead: Stop after build, metadata checks, independent review, Outcome capture, and handoff verification.
- risk: Do not reuse the earlier ready verdict after post-review fixes landed on the release branch.
  instead: Add the late fixes to the release inventory, rerun release-wide validation and packaging, and obtain a fresh verdict-neutral implementation review.
