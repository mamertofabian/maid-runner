# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Bump maid-runner patch version to 2.23.1
type: fix
created: "2026-07-27T15:24:00Z"
supersedes:
  - bump-version-2.23.0
metadata:
  tags:
    - release
    - version
  priority: high
description: |
  Bump the package version from 2.23.0 to 2.23.1 for a future patch release.
  Keep package metadata, editable lockfile metadata, changelog, roadmap version
  references, and release metadata tests synchronized.

  The patch version follows SemVer because the post-2.23.0 branch contains
  compatibility and diagnostic fixes without new public feature surfaces:
  stash-backed plan-revise red-evidence diagnostics and E230 recognition for
  bounded shell-wrapped app-root Vitest commands.
temptations:
  - risk: Do not update only pyproject.toml and leave release mirrors stale.
    instead: Update uv.lock, CHANGELOG.md, docs/ROADMAP.md, and the release metadata test alongside the package version.
  - risk: Do not turn this into a minor release without public feature evidence.
    instead: Keep 2.23.1 as a patch release because the included commits are fixes to existing MAID workflow behavior.
  - risk: Do not omit the changelog compare link from automated coverage.
    instead: Assert the 2.23.1 heading and v2.23.0...v2.23.1 compare link in the release metadata test.
  - risk: Do not add runtime version constants that duplicate pyproject.toml.
    instead: Keep maid_runner.__version__ reading package or source metadata dynamically.
files:
  scope:
    - path: pyproject.toml
      reason: Package version metadata has no analyzer-visible public artifact contract.
    - path: uv.lock
      reason: Editable package lock metadata must mirror pyproject version.
    - path: CHANGELOG.md
      reason: Release notes document the patch version, release date, and compare link.
    - path: docs/ROADMAP.md
      reason: Roadmap current-version references mirror the released CLI version.
  edit:
    - path: tests/integration/test_library_api.py
      artifacts:
        - kind: test_function
          name: test_release_metadata_is_current_version
          of: TestPublicAPIImports
          args:
            - name: self
              type: TestPublicAPIImports
          returns: None
          description: Runtime version, pyproject metadata, uv.lock metadata, changelog heading and compare link, and roadmap all report 2.23.1.
  read:
    - maid_runner/__version__.py
    - manifests/bump-version-2.23.0.manifest.yaml
    - manifests/snapshot-maid-runner-version.manifest.yaml
validate:
  - uv run python -m pytest -q tests/integration/test_library_api.py
outcome:
