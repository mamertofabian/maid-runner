  rationale: "The post-v2.23.0 branch contains compatibility and diagnostic fixes rather than new public feature surfaces, so 2.23.1 is a SemVer patch release. The release metadata test keeps pyproject, uv.lock, changelog, roadmap, and runtime version aligned."
  lessons:
