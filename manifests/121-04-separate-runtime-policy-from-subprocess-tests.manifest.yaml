# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Make runtime-evidence policy tests fast by injecting an owned executor boundary"
type: refactor
created: "2026-08-10T22:44:59Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - tests
    - artifact-coverage
    - testability
description: |
  The duration profile attributes more than 30 recorded seconds to artifact
  coverage tests and another 18.66 seconds to five nested strict-preview
  cases. Most scenarios validate deterministic policy (attribution, merging,
  error mapping, strict-boundary propagation) but each launches real
  coverage/pytest subprocesses.

  Introduce an owned runtime-command executor protocol. Keep the existing
  subprocess implementation as the production default, but let policy code
  consume deterministic execution records. Convert policy matrices to a fake
  executor and retain a bounded real-adapter suite covering success, command
  failure, timeout, line/call capture, nested strict propagation, and output
  equivalence. The fake must model observable records, not private subprocess
  calls.

  Prove the refactor with result/JSON equivalence and executor call counts.
  Wall-clock assertions remain benchmark evidence only. Because this evolves
  the existing artifact-coverage execution signatures declared by 068-01 and
  the directory batch behavior declared by 096-01, contract hardening must use
  `maid-evolver` rather than treating this draft as a standalone replacement.
temptations:
  - risk: "Do not mock coverage.py data classes or subprocess.CompletedProcess throughout policy tests."
    instead: "Define MAID-owned immutable execution records and a fake executor that returns those values."
  - risk: "Do not delete all real nested or coverage subprocess tests to make the suite fast."
    instead: "Retain bounded adapter integration cases for success, failure, timeout, runtime calls, and strict-boundary propagation."
  - risk: "Do not change E710/E900 attribution or JSON ordering while extracting the boundary."
    instead: "Compare legacy and injected result payloads byte-for-byte after normalizing duration fields."
  - risk: "Do not make a fake executor the production fallback when coverage is unavailable."
    instead: "Keep the real executor as the default and preserve the existing visible validator-unavailable diagnostic."
files:
  create:
    - path: maid_runner/core/_runtime_command_executor.py
      artifacts:
        - kind: class
          name: RuntimeFileExecution
          description: "Immutable owned line/call evidence for one normalized source path."
        - kind: attribute
          name: executed_lines
          of: RuntimeFileExecution
          type: frozenset[int]
        - kind: attribute
          name: called_qualnames
          of: RuntimeFileExecution
          type: frozenset[str]
        - kind: class
          name: RuntimeCommandRecord
          description: "Immutable MAID-owned value carrying command, return code, stdout, stderr, line execution, call identities, and report errors."
        - kind: attribute
          name: command
          of: RuntimeCommandRecord
          type: tuple[str, Ellipsis]
        - kind: attribute
          name: returncode
          of: RuntimeCommandRecord
          type: int
        - kind: attribute
          name: stdout
          of: RuntimeCommandRecord
          type: str
        - kind: attribute
          name: stderr
          of: RuntimeCommandRecord
          type: str
        - kind: attribute
          name: execution_data
          of: RuntimeCommandRecord
          type: Mapping[str, RuntimeFileExecution]
        - kind: attribute
          name: report_errors
          of: RuntimeCommandRecord
          type: tuple[ValidationError, Ellipsis]
        - kind: class
          name: RuntimeCommandExecutor
          description: "Protocol for executing one normalized pytest command with runtime evidence."
        - kind: method
          name: execute
          of: RuntimeCommandExecutor
          args:
            - name: command
              type: tuple[str, Ellipsis]
            - name: target_files
              type: set[str]
            - name: project_root
              type: Path
            - name: timeout_seconds
              type: float
          returns: RuntimeCommandRecord
          description: "Owned execution seam shared by the production adapter and deterministic test fake."
        - kind: class
          name: SubprocessRuntimeCommandExecutor
          description: "Production adapter preserving the existing coverage.py plus pytest subprocess behavior and timeout semantics."
        - kind: method
          name: execute
          of: SubprocessRuntimeCommandExecutor
          args:
            - name: command
              type: tuple[str, Ellipsis]
            - name: target_files
              type: set[str]
            - name: project_root
              type: Path
            - name: timeout_seconds
              type: float
          returns: RuntimeCommandRecord
          description: "Runs the real instrumented command and returns stable runtime evidence."
  edit:
    - path: maid_runner/core/artifact_coverage.py
      artifacts:
        - kind: function
          name: run_artifact_coverage
          args:
            - name: manifest
              type: Manifest
            - name: project_root
              type: Path
            - name: executor
              type: RuntimeCommandExecutor | None
              default: "None"
          returns: ArtifactCoverageReport
          description: "Evaluates one manifest using the production executor by default or an explicitly supplied owned executor."
        - kind: function
          name: run_artifact_coverage_batch
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: executor
              type: RuntimeCommandExecutor | None
              default: "None"
          returns: dict[str, ArtifactCoverageReport]
          description: "Preserves per-manifest attribution while accepting an injected executor for policy tests."
    - path: maid_runner/core/_test_command_execution.py
      artifacts:
        - kind: function
          name: _strict_validation_test_environment
          args:
            - name: enabled
              type: bool
            - name: process_wide
              type: bool
              default: "False"
          returns: Iterator[None]
          description: "Remains the single strict-boundary policy seam and is tested directly for thread/process restoration."
    - path: tests/core/test_artifact_coverage.py
      artifacts:
        - kind: test_function
          name: test_fake_runtime_executor_preserves_single_manifest_report
          args: []
          returns: None
        - kind: test_function
          name: test_runtime_record_change_invalidates_evaluated_execution
          args: []
          returns: None
        - kind: test_function
          name: test_real_runtime_executor_preserves_timeout_exception
          args: []
          returns: None
    - path: tests/core/test_artifact_coverage_batch.py
      artifacts:
        - kind: test_function
          name: test_policy_matrix_uses_owned_fake_without_spawning_pytest
          args: []
          returns: None
        - kind: test_function
          name: test_real_and_fake_executor_reports_are_equivalent
          args: []
          returns: None
        - kind: test_function
          name: test_batch_executor_call_count_matches_unique_command_count
          args: []
          returns: None
    - path: tests/cli/test_nested_strict_preview.py
      artifacts:
        - kind: test_function
          name: test_strict_boundary_policy_matrix_restores_state_without_nested_subprocesses
          args: []
          returns: None
        - kind: test_function
          name: test_real_nested_strict_preview_adapter_still_propagates_once
          args: []
          returns: None
  scope:
    - path: tests/core/test_artifact_coverage_failure_determinism.py
      reason: "Replace repeated real subprocess stimulus with owned runtime records while retaining bounded failure-adapter coverage in the batch suite."
    - path: tests/core/test_artifact_coverage_timeout_config.py
      reason: "Assert timeout policy through the injected executor and retain one direct real-adapter TimeoutExpired contract."
  read:
    - manifests/068-01-add-artifact-execution-coverage-gate.manifest.yaml
    - manifests/096-01-deduplicate-identical-artifact-coverage-commands.manifest.yaml
    - maid_runner/cli/commands/validate.py
    - docs/plans/full-and-deep-verification-performance-redesign.md
validate:
  - uv run python -m pytest -q tests/core/test_artifact_coverage.py tests/core/test_artifact_coverage_batch.py tests/core/test_artifact_coverage_failure_determinism.py tests/core/test_artifact_coverage_timeout_config.py tests/cli/test_nested_strict_preview.py
  - uv run maid validate manifests/121-04-separate-runtime-policy-from-subprocess-tests.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-10T23:30:00Z"
  summary: >-
    Extracted immutable, normalized runtime-command records behind an injected
    executor boundary, retained the real coverage/pytest adapter as the
    production default, and converted repeated policy tests to deterministic
    owned fakes. The focused contract fell from 55.51 seconds to 5.58 seconds
    (about 90 percent faster), while the measured full maid test fell from the
    225.79-second latest baseline to 192.57 seconds (about 15 percent) despite
    both runs retaining the known live-121-epic inventory failure.
  rationale: >-
    Artifact attribution, E710/E900 mapping, timeout configuration, strict
    boundary restoration, and exact-command grouping are deterministic policy;
    repeatedly launching coverage and pytest added no new evidence. The final
    design evaluates owned records in fast policy matrices and keeps bounded
    real adapter cases for success equivalence, one-line call evidence, command
    failure, TimeoutExpired propagation, and nested strict propagation. Runtime
    paths are resolved against the project root and line/call evidence is merged
    into one immutable value per normalized source path.
  lessons:
    - lesson_type: performance
      summary: >-
        Moving deterministic artifact-coverage policy behind an injected owned
        executor reduced its focused suite by about 90 percent without caching
        pass/fail results or removing real subprocess adapter evidence.
      tags:
        - artifact-coverage
        - testability
        - subprocess-boundary
        - performance
      paths:
        - maid_runner/core/_runtime_command_executor.py
        - maid_runner/core/artifact_coverage.py
        - tests/core/test_artifact_coverage.py
        - tests/core/test_artifact_coverage_batch.py
    - lesson_type: test-design
      summary: >-
        Real/fake equivalence must inspect a one-line artifact's owned execution
        record directly: final report equality alone can hide split relative
        line keys and absolute call-trace keys or missing call evidence.
      tags:
        - one-line-artifacts
        - runtime-evidence
        - implementation-review
        - path-normalization
      paths:
        - maid_runner/core/_runtime_command_executor.py
        - tests/core/test_artifact_coverage_batch.py
    - lesson_type: validation-trust
      summary: >-
        Abstract Protocol bodies and dataclass/value-class construction cannot
        honestly satisfy the current E710 class-body model; executing an
        abstract ellipsis solely for coverage would game the gate, so the
        limitation was reported instead of weakening the contract.
      tags:
        - artifact-coverage
        - protocol
        - dataclass
        - fail-closed
        - maid-runner-feedback
      paths:
        - maid_runner/core/_runtime_command_executor.py
        - tests/core/test_artifact_coverage.py
  review_notes:
    - source: independent-implementation-review-round-1
      severity: P2-fixed
      summary: >-
        Review found split relative/absolute evidence keys and shallow
        RuntimeFileExecution immutability. Revision 4 normalized both evidence
        sources, added defensive frozenset coercion, and strengthened the real
        one-line adapter and ownership-isolation tests.
    - source: independent-implementation-re-review
      severity: ready
      summary: >-
        Fresh re-review found no remaining issues and confirmed multi-command
        final-call semantics, failure and timeout behavior, strict-boundary
        fidelity, scope compliance, and retained real adapter coverage.
    - source: strict-deep-follow-up-review
      severity: ready
      summary: >-
        The final reviewer confirmed @abstractmethod is the correct Protocol
        contract, does not weaken ordinary E310 enforcement, and that the four
        new E710 findings are validator representation limits rather than
        focused behavior gaps.
    - source: assessed-deep-gate
      severity: warning
      summary: >-
        The exact deep gate passed schema, behavioral, and implementation, then
        stopped at repository-wide historical artifact debt after 1,552.90
        seconds. The Protocol-specific limitation is recorded in
        ~/.maid/bug-report/20260811-073000-maid-runner-protocol-artifact-coverage.md.
  validation:
