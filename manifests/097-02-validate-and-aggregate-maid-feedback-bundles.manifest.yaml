outcome:
  status: completed
  completed_at: "2026-08-08T12:06:57Z"
  summary: "Added fail-closed local feedback bundle intake and deterministic aggregation through `maid feedback aggregate`, including duplicate-key rejection, content-ID verification, canonical bundle deduplication, anonymous evidence counts, overwrite protection, and advisory-only guidance."
  rationale: "This completes the second 097 bridge without weakening the export privacy boundary: intake accepts only the exact version-1 contract, revalidates direct public-API callers, never restores repository identities, and produces a local report that cannot submit data or mutate MAID state."
  lessons:
    - lesson_type: schema-hardening
      summary: "Strict JSON intake must reject duplicate object keys as well as extra fields; ordinary json.loads last-value behavior otherwise makes an apparently exact schema ambiguous."
      tags:
        - maid-runner-feedback
        - feedback-intake
        - fail-closed
      paths:
        - maid_runner/core/feedback_intake.py
        - tests/core/test_feedback_intake.py
    - lesson_type: privacy
      summary: "Anonymous cross-bundle source counts must be labeled as reported evidence rather than unique repositories because privacy-preserving bundles intentionally contain no identity for global deduplication."
      tags:
        - aggregation
        - privacy-boundary
        - evidence-semantics
      paths:
        - maid_runner/core/feedback_intake.py
        - docs/manifest-outcome-records.md
    - lesson_type: test-design
      summary: "A fail-closed file reader does not protect a public aggregation API by itself; behavioral tests should construct invalid dataclasses directly and require the aggregation boundary to revalidate them."
      tags:
        - public-api
        - validation-boundary
        - behavioral-contract
      paths:
        - tests/core/test_feedback_intake.py
