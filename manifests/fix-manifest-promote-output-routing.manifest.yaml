  summary: Manifest promotion now infers root and nested owning chains from a direct drafts parent, honors explicit output directories, and fails before mutation when an omitted destination cannot be inferred safely.
  rationale: Treating omission as None lets the command distinguish it from an explicit root-manifests override. The source path's direct drafts parent is a deterministic ownership signal that does not depend on an unrelated monorepo default, while refusing ambiguous paths prevents silent cross-chain writes.
  lessons:
