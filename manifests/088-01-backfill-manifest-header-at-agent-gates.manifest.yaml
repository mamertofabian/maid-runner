        - uv
        - run
        - python
        - -m
        - pytest
        - tests/cli/test_manifest_header_backfill.py
        - -v
      status: passed
      summary: "11 focused behavioral tests passed after adding coverage for
        helper idempotency, atomic failure preservation, all revise paths, and
        promotion backfill."
