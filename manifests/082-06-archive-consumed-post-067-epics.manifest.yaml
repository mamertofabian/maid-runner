  rationale: "Implementation preserved stable draft epic paths as archive pointers, listed promoted child manifests, left only 062 and 064 as live planning epics, and added characterization coverage for both draft inventory and stale backlog prose after implementation review found a takeover-summary contradiction. A later read-only review found the archive inventory test had been extended for 084 without declaring 084 in this governing manifest, so the contract now includes the 084 archived pointer, child-manifest read dependencies, and schema validation command."
  lessons:
