      type: draft epic
      description: Archived pointer for promoted child manifests 081-01 through 081-06.
  - path: manifests/drafts/084-00-after-action-run-evaluation.epic.yaml
    artifacts:
    - kind: attribute
      name: _archived_after_action_run_evaluation_epic
      of: manifest
      type: draft epic
      description: Archived pointer for promoted child manifests 084-01 through 084-07.
  - path: manifests/drafts/085-00-plan-lock-ceremony-reduction.epic.yaml
