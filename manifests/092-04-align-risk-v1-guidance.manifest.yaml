    - documentation
  priority: medium
description: |
  Complete the risk-v1 rollout at the guidance layer. The CLI already exposes
  both ranking models, but its `--rank` help still describes undeclared files
  only, the built-in how-to still teaches the legacy raw-signal ordering, and
  the brownfield auditor/onboarding skills do not use risk-v1 when choosing
  what incomplete coverage to address next.

  Pinned behavior:

  1. Keep `legacy-v1` as the compatibility default. Help and how-to content
     recommend the explicit `--model risk-v1` command for evidence-backed
     brownfield migration ordering while explaining that `legacy-v1` preserves
     the original undeclared-file ordering.

  2. Describe risk-v1 candidates as inadequately covered files, including
     undeclared files, read-only registrations, and writable manifests without
     declared artifacts. Guidance names evidence, confidence, `--explain`, and
     `--json` without changing the command surface or claiming that low
     confidence means low risk.

  3. Keep `maid files` as the auditor's source for coverage totals and tracking
     status. Use `maid bootstrap --rank --model risk-v1` only to prioritize
     incomplete brownfield coverage; recommendation scores are advisory and
     must not change the audit verdict.

  4. Teach maid-onboard to offer risk-v1 after repository setup when incomplete
     brownfield coverage remains. Do not make ranking a prerequisite for init,
     validation, or ordinary MAID work.

  5. Edit canonical Claude and Codex skill sources, then run
     `uv run python scripts/sync_claude_files.py` so packaged auditor skills and
     user-level onboard skills stay byte-aligned with their sources.

  6. Advance `INSTRUCTION_PAYLOAD_VERSION` beyond `2026.07.25.1` because
     maid-auditor is installed through `maid init`. This lets downstream
     `maid init --check` report the older distributed guidance as stale.

  Behavioral tests confirmed the intended red phase before plan lock:

  - Bootstrap parser help identifies risk-v1 as the recommended coverage-risk
    model, identifies legacy-v1 as the compatibility default, and no longer
    limits `--rank` conceptually to completely undeclared files.
  - Built-in how-to output recommends explicit risk-v1 commands and accurately
    distinguishes risk-v1 evidence from the legacy lexicographic raw signals.
  - Auditor guidance uses risk-v1 only for prioritization, retains `maid files`
    for coverage status, and states that recommendation output is advisory.
  - Onboard guidance offers risk-v1 as the next-step migration order only when
    brownfield coverage remains incomplete.
  - Canonical Claude/Codex skill sources and every generated or packaged copy
    remain synchronized.
  - The instruction payload version advances beyond the pre-change
    `2026.07.25.1` value.

  Initial red phase: the parser-help assertion failed on the current
  "undeclared files" wording; how-to assertions failed because the output
  omitted `--model risk-v1` and presented only churn/inbound/public-artifact
  ordering; skill assertions failed because neither auditor nor onboard
  guidance named
  risk-v1.

  The review follow-up adds a version-floor assertion; plan revision captures
  its red phase before the payload version is changed.

  Outcome recall applied: prior agent-guidance work showed that every active
  source and packaged copy needs parity coverage, and prior CLI help work showed
  that documented options should be checked against the real argparse surface.
  Older locked test contracts must be revised through MAID's plan-revision
  workflow with preserved evidence where eligible, not by manufacturing a new
  historical red phase.

  Out of scope: risk-v1 scoring or collection changes, model-default changes,
  README changes, general AGENTS.md or CLAUDE.md policy, planner/implementer/
  reviewer/evolver skills, historical 061 manifests, and mandatory recommender
  execution for every coding task.
temptations:
  - risk: "Do not silently replace legacy-v1 or change the bootstrap default."
    instead: "Recommend explicit --model risk-v1 commands while documenting legacy-v1
      as the compatibility default."
  - risk: "Do not edit packaged skill copies as independent sources."
    instead: "Edit canonical Claude and Codex skills, run the sync script, and assert
      source/copy parity."
  - risk: "Do not let an advisory recommendation score determine audit success or
      failure."
    instead: "Use maid files for tracking truth and risk-v1 only to order incomplete
      coverage work."
  - risk: "Do not spread risk-v1 instructions across every MAID workflow skill or
      global agent policy."
    instead: "Limit guidance to bootstrap help/how-to and the auditor/onboard brownfield
      decision points."
  - risk: "Do not change an init-distributed skill without a payload version signal."
    instead: "Advance INSTRUCTION_PAYLOAD_VERSION and pin the new floor in the focused guidance test."
