# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Preserve the latest effective complete ArtifactSpec for every unrelated public artifact carried by file-scoped chain merge"
type: fix
created: "2026-08-17T03:09:18Z"
supersedes:
  - chain-merge-file-scoped-apply
metadata:
  priority: critical
  tags:
    - chain-merge
    - supersession
    - contract-equivalence
    - validation-trust
description: |
  File-scoped apply currently preserves unrelated artifact identities but keeps
  the first matching ArtifactSpec found only among directly superseded owners.
  Because the generated snapshot is newest, an older partial carried spec can
  then override a later complete declaration, including one in a still-active
  owner. Real consolidation weakened public parameters and behavioral metadata
  while implementation validation and the identity-only supersession audit
  remained green.

  Evolve the file-scoped apply contract so every carried artifact uses the
  latest effective complete ArtifactSpec from the full active ManifestChain.
  The self-contained replacement preserves the pre-apply chain's first-seen
  contract-key order while replacing values with their latest effective
  declarations; the post-apply active chain must preserve the same complete
  identity-to-spec mapping even when still-active owners determine a different
  iteration order. Complete value preservation covers args, defaults, return
  and raise contracts, async/default-hook flags, class bases and type
  parameters, owners and attribute types, descriptions, exact signatures, and
  every test-function detail. A second materialization after another target
  owner arrives must preserve the same values again. Target snapshot behavior,
  private filtering, file-mode
  policy, imports, commands, acceptance, removals, path precedence, atomic
  refusals, and non-colliding repeated apply remain unchanged.
temptations:
  - risk: "Do not fix only the concrete missing parameters observed in repository snapshots."
    instead: "Select each carried value from ManifestChain.merged_artifacts_for(path) and prove whole ArtifactSpec equality before and after apply."
  - risk: "Do not preserve latest values by removing and re-appending duplicate keys, which changes deterministic artifact order."
    instead: "Keep first-seen contract-key positions and replace their values with the latest effective specs."
  - risk: "Do not limit the lookup to directly superseded owners."
    instead: "Include still-active owners because the newly dated snapshot would otherwise override their newer effective declarations."
  - risk: "Do not weaken implementation validation or the supersession audit to bless partial specs."
    instead: "Correct materialization and verify observable active-chain equivalence through public APIs."
files:
  edit:
    - path: maid_runner/core/chain_merge_apply.py
      artifacts:
        - kind: class
          name: ChainMergeApplyResult
        - kind: attribute
          name: applied
