          of: ChainMergeApplyResult
          type: tuple[str, ...]
        - kind: attribute
          name: refused_reason
          of: ChainMergeApplyResult
          type: str | None
        - kind: attribute
          name: missing_artifacts
          of: ChainMergeApplyResult
          type: tuple[str, ...]
        - kind: function
          name: apply_chain_merge
          args:
            - name: file_path
              type: str
            - name: chain
              type: ManifestChain
            - name: project_root
              type: str
              default: '"."'
            - name: output_dir
              type: str
              default: '"manifests/"'
          returns: ChainMergeApplyResult
          description: "Materialize the target snapshot while preserving latest effective complete public ArtifactSpecs and all existing whole-manifest obligations without changing first-seen artifact order."
