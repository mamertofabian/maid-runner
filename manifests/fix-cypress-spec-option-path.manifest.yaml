outcome:
  status: completed
  completed_at: "2026-08-31T06:58:30Z"
  summary: >-
    Acceptance validation now resolves directly tokenized Cypress and Nx e2e
    `--spec` values instead of treating attached options as literal files. It
    preserves legacy acceptance command containment, reports E500 against
    extracted missing paths, and applies project-boundary checks across lists,
    command working directories, wrappers, and Windows paths.
  rationale: >-
    The 2.27.2 regression passed each raw acceptance token to the test-file
    classifier, so an existing `--spec=path.cy.ts` became a nonexistent literal
    path. A bounded command parser now separates wrapper options, effective
    Cypress/Nx target identity, spec values, and runner-local cwd state while
    retaining the prior general path parser as a containment union. This avoids
    false E500 diagnostics without weakening outside-project rejection.
  agent:
    model: gpt-5
    provider: openai
    client: codex
    source: "System-provided model family; exact runtime slug and reasoning effort were unavailable."
    skills:
      - maid-planner
      - maid-evolver
      - maid-plan-review
      - maid-implementer
      - maid-implementation-review
  lessons:
    - lesson_type: validation-design
      summary: >-
        Command option ownership must be parsed at the executable layer that
        defines it: package-runner cwd and injection options, Cypress spec
        selectors, Nx target forms, and shell command strings cannot safely
        share a raw suffix-based token heuristic. Containment should union new
        semantic extraction with historical general-path coverage so hardening
        does not silently drop prior path sources.
      tags:
        - acceptance
        - cypress
        - nx
        - path-containment
      paths:
        - maid_runner/core/manifest.py
        - maid_runner/core/validate.py
        - tests/core/validation/test_cypress_spec_option_path.py
  review_notes:
    - source: independent-read-only-review
      severity: ready
