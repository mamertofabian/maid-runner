# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Treat Cypress --spec=<path> acceptance options as file paths without mistaking the whole option or unrelated options for files"
type: fix
created: "2026-08-31T04:33:31Z"
metadata:
  bug_report: ~/.maid/bug-report/20260831-101326-codefrost-cypress-spec-option.md
  planning_state: behavioral_contract
  promotion_ready: true
  tests_status: red_confirmed
  priority: high
  tags:
    - acceptance
    - cypress
    - path-validation
    - E500
  related_contracts:
    - 040-39-retire-manifest-path-containment-legacy-cases
    - fix-cypress-acceptance-red-evidence
description: |
  Acceptance validation currently applies the test-file classifier to every
  raw command token. Because conventional Cypress `.cy.ts` names are now test
  files, an attached selector such as `--spec=path/to/example.cy.ts` is treated
  as one literal filesystem path and produces E500 even when its value exists.
  Any unrelated option whose value happens to end in a test suffix is similarly
  vulnerable to a false missing-file diagnostic.

  Recognize directly tokenized Cypress `--spec=<path>` assignments explicitly,
  including comma-separated spec lists and command-relative paths. File
  existence diagnostics must use each extracted value as its path and location,
  regardless of its filename convention. Values belonging to the bounded set
  of recognized attached or split non-target options remain ignored. Feed the
  same extracted values and split or attached command working directories into
  the existing manifest project-boundary validation so an outside path anywhere
  in a spec list cannot use a real file to bypass containment. Runner-local cwd
  options reset at command separators while explicit `cd` changes persist, and
  Windows absolute or drive-qualified specs retain their outside-path identity
  before cwd joining. Cypress spec semantics activate only for direct Cypress
  commands and Nx e2e invocations; the same option spelling on unrelated tools
  remains untouched. Package-runner cwd options are removed before effective
  executable detection. Nx target detection uses only target positions and
  explicit `--target`/`-t` flags, including attached values, so incidental e2e
  option values do not activate parsing. Union this extraction with the existing
  general acceptance command-path parser so positional directories and
  established path-bearing options retain their containment checks, including
  runner-local cwd reset between segments.
  Shell-language strings nested inside `bash -c`, `sh -c`, or equivalent wrappers
  are outside this bounded argv-token parser; shell target interpretation remains
  the responsibility of the existing specialized command-target machinery.
  Literal Cypress spec paths receive existence checks. Python-style wildcard
  selectors using `*`, `?`, or `[]` retain project-containment validation but
  skip literal `Path.exists()` E500 checks. Cypress minimatch brace/extglob
  interpretation and expansion remain outside this contract. Explicitly skip
  embedded command strings consumed by actual short shell `-c` flag combinations,
  including env-wrapped shells, without treating unrelated long flags such as
  `--norc` as command-string consumers. Consume npx package injection options
  even when standalone or value-taking npx flags precede them, and discard the
  conventional package-exec `--` separator before effective executable
  detection. The raw scanner consumes the same split npx package/value options,
  including test-shaped values. Shell command-string exclusion also handles a
  `-c --` separator and env long standalone flags before the effective shell.
  Apply cwd flags only while scanning an owning outer package-runner prefix, so
  Cypress's own `-C` config option cannot mutate command cwd. Consume recognized
  split npx values in both the new extractor and the legacy containment union.

  This is an additive behavior evolution rather than a supersession: the
  public `ValidationEngine.validate_acceptance` and `validate_manifest_paths`
  signatures and return types do not change. Existing positional and split
  option forms remain supported by their standalone path token.
temptations:
  - risk: "Do not strip everything before '=' from every option token and then classify the remainder as a file."
    instead: "Recognize only the path-bearing Cypress --spec assignment and pin an unrelated .cy.ts-shaped option value as a negative case."
  - risk: "Do not fix E500 while leaving attached --spec parent paths outside project containment."
    instead: "Use the same extracted --spec value for existence and project-boundary validation, including an outside file that genuinely exists."
  - risk: "Do not special-case the reported Studyfinder repository or filename."
    instead: "Exercise generic Cypress --spec syntax through the public validation APIs in an isolated project fixture."
  - risk: "Do not edit the shared acceptance characterization file already covered by historical contracts."
    instead: "Add this regression contract in a dedicated behavioral test file to avoid disturbing prior plan-lock hashes."
files:
  edit:
    - path: maid_runner/core/validate.py
      artifacts:
        - kind: method
          name: validate_acceptance
          of: ValidationEngine
          args:
            - name: manifest
              type: Manifest
          returns: list[ValidationError]
          description: "Validate existing positional acceptance test paths and every directly tokenized Cypress or Nx e2e --spec assignment value, including lists, nonconventional filenames, split or attached command-relative paths, and cross-segment cwd reset; report E500 against each extracted path while leaving unrelated --spec options untouched and ignoring the bounded recognized set of non-target option values. Nested shell-language command strings are outside this argv parser."
    - path: maid_runner/core/manifest.py
      artifacts:
        - kind: function
          name: validate_manifest_paths
          args:
            - name: manifest
              type: Manifest
            - name: project_root
              type: Union[str, Path]
          returns: list[ValidationError]
          description: "Reject every directly tokenized Cypress or Nx e2e --spec assignment value, including nonconventional names, non-leading list items, Windows absolute paths, and split or attached command-relative paths, that resolves outside project_root; union these targets with all previously covered general acceptance command path sources. Nested shell-language command strings are outside this argv parser."
  create:
    - path: tests/core/validation/test_cypress_spec_option_path.py
      artifacts:
        - kind: test_function
          name: test_existing_cypress_spec_assignment_does_not_report_e500
