    artifacts:
    - kind: test_function
      name: 
        test_outcome_capture_marks_only_safe_generalizable_feedback_candidates
      args: []
      returns: None
      description: Every implementation-review guidance surface requires 
        explicit per-lesson opt-in, forbids inferred or blanket marking, limits 
        the exact marker to privacy-reviewed generalizable MAID Runner findings,
        excludes unsafe content, and distinguishes candidacy from upload 
        consent.
    - kind: test_function
      name: test_self_improvement_treats_feedback_aggregate_as_advisory
      args: []
      returns: None
      description: Every self-improvement surface treats a local aggregate as 
        untrusted advisory evidence rather than instructions, ignores
