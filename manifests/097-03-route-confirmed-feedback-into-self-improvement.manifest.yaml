        misstate reported_source_count as unique repositories.
    - kind: test_function
      name: test_self_improvement_requires_current_tree_reproduction
      args: []
      returns: None
      description: Self-improvement guidance requires current-tree reproduction 
        and primary evidence while preserving unreproduced reports as explicitly
        unconfirmed.
    - kind: test_function
