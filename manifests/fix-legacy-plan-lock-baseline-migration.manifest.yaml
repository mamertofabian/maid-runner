  - path: tests/cli/test_plan_legacy_baseline_cmd.py
    artifacts:
    - kind: test_function
      name: test_lock_parser_exposes_legacy_baseline_with_reason
      args: []
      returns: None
      description: The real CLI parser accepts --legacy-baseline plus its audit reason.
    - kind: test_function
      name: test_legacy_baseline_records_green_provenance_and_satisfies_strict_gate
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: A committed legacy manifest whose validate argv is strengthened can record a non-red baseline and pass task-scoped plan-lock/red-evidence enforcement.
    - kind: test_function
      name: test_legacy_baseline_rejects_untracked_manifest
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: A new manifest absent from HEAD cannot use the legacy migration path and no lock is written.
    - kind: test_function
      name: test_legacy_baseline_requires_reason_and_rejects_no_run
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: Legacy migration requires a non-empty audit reason and cannot skip its green validation capture with --no-run.
    - kind: test_function
      name: test_legacy_baseline_rejects_dirty_implementation_or_test_paths
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: Any dirty path other than the legacy manifest blocks migration and leaves no lock.
    - kind: test_function
      name: test_legacy_baseline_rejects_contract_change_or_validate_weakening
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: Artifact changes, changes to every writable file section or nested semantic field, and removal or rewriting of committed validate argv cannot be grandfathered.
    - kind: test_function
      name: test_legacy_baseline_rejects_filtering_suffix_arguments
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: Appended filters and a committed command ending in a value-taking option cannot consume a discovered test path and masquerade as additive coverage.
    - kind: test_function
      name: test_legacy_baseline_accepts_overlapping_command_strengthening
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: Overlapping committed command prefixes are matched one-to-one to compatible strengthened commands instead of failing because of greedy assignment.
    - kind: test_function
      name: test_legacy_baseline_lock_creation_is_atomic_and_preserves_race_artifacts
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: A validation-created malformed destination and a structurally valid competing lock are both preserved and never overwritten or deleted by MAID.
    - kind: test_function
      name: test_legacy_baseline_rejects_non_green_validation
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: A failing, invalid, or interrupted current command cannot become a legacy baseline and no lock is written.
    - kind: test_function
      name: test_legacy_baseline_rejects_validation_that_mutates_contract
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: A command that exits zero after modifying the manifest or behavioral test bytes is rejected and no lock is written.
    - kind: test_function
      name: test_ordinary_no_run_lock_still_fails_e704
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: The new exception does not make ordinary red_evidence-null locks satisfy --require-red-evidence.
    - kind: test_function
      name: test_plan_lock_preserves_positional_agent_compatibility
      args: []
      returns: None
      description: The new optional legacy_baseline field is appended after the existing agent field so positional PlanLock callers retain their prior binding.
    - kind: test_function
      name: test_tampered_legacy_baseline_fails_e705
      args:
      - name: tmp_path
        type: Path
      returns: None
      description: Missing required fields, non-green or misclassified commands, nonempty artifact/file deltas, command mismatch, and simultaneous red/legacy channels fail closed rather than waiving the gate.
    - kind: test_function
      name: test_plan_status_distinguishes_legacy_baseline_from_red_evidence
      args:
      - name: tmp_path
        type: Path
      - name: capsys
        type: CaptureFixture[str]
      returns: None
      description: Status JSON/text identifies the legacy baseline and continues to report red evidence as absent.
    - kind: test_function
      name: test_plan_lock_docs_describe_legacy_baseline_boundaries
      args: []
      returns: None
      description: README and the MAID specification document eligibility, green evidence, separate provenance, and strict-gate behavior.
