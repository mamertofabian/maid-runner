# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Provide an auditable legacy-baseline plan-lock migration for completed pre-plan-lock manifests
type: fix
created: '2026-07-13T03:14:57Z'
metadata:
  planning_state: behavioral-contract
  promotion_ready: true
  tests_status: created-red-confirmed
  maid_task_base: a2e0c3d4d677b69fd40237d38aad81037e9dbc4c
  source_bug_report: /home/atomrem/.maid/bug-report/20260711-211020-tower-recall-legacy-plan-lock-migration.md
  tags:
  - plan-lock
  - legacy-migration
  - red-evidence
  - brownfield
  - anti-gaming
  priority: high
description: |
  A completed manifest created before plan locks existed cannot acquire genuine
  historical red-phase evidence after a validation-command metadata repair.
  `maid plan lock --no-run` leaves E704 unavoidable, while normal lock captures
  an already-green tree and `plan revise --stash-implementation` cannot help
  when there is no dirty implementation delta. The Tower Recall report proves
  this is a runner workflow gap rather than a failed implementation or weak
  behavioral contract.

  Add an explicit `maid plan lock --legacy-baseline --reason <text>` migration
  mode. It records a separate `legacy_baseline` payload and keeps
  `red_evidence: null`, so the lock never claims that historical TDD evidence
  exists. A structurally valid legacy baseline satisfies the opt-in
  `--require-red-evidence` gate as an audited brownfield exception, while
  ordinary new manifests still require genuine red evidence.

  The exception is deliberately narrow and fail-closed. The manifest must be a
  tracked file that already exists at Git HEAD; no path except that manifest may
  be dirty; the committed and current manifests must declare identical
  artifacts and full file-section semantics (including imports, status, test
  details, and default-hook metadata); current behavioral-test discovery may only grow;
  every prior validate command must remain present or be strengthened only by
  appending discovered behavioral-test targets to a complete command that does
  not end in an option token; overlapping commands must be matched one-to-one;
  and every current validate command must exit zero.
  Evidence records the required reason, baseline commit and manifest hash,
  bounded per-command green results, contract delta, and capture time. The lock
  snapshots the current command contract as usual. Manifest and behavioral-test
  hashes are checked before and after command execution so validation cannot
  rewrite the contract being captured. Lock creation is exclusive so a
  validation command or concurrent process cannot inject or overwrite the
  destination. Unexpected destination artifacts are never deleted by MAID:
  malformed files remain visible and block retry for operator inspection, while
  structurally valid competing locks are preserved. Enforcement rejects a
  malformed or command-mismatched legacy payload instead of silently waiving
  E704/E705.

  This is an additive chain evolution: existing PlanLock fields, positional
  constructor binding, and public function signatures remain compatible. Legacy-baseline state is not carried
  into later plan revisions; new behavioral work must use a new manifest and
  genuine red evidence.
temptations:
- risk: 'Do not encode a legacy migration as red_evidence.red: true or relabel green command exits as red.'
  instead: Store a separate legacy_baseline payload, leave red_evidence null, and display both provenance channels independently.
- risk: Do not let --legacy-baseline become a generic escape hatch for newly added implementation or behavioral tests.
  instead: Require a tracked manifest present at HEAD, reject every dirty path except the manifest, and reject artifact or file-contract deltas.
- risk: Do not accept arbitrary validation-command rewrites during migration.
  instead: Require each committed command to map one-to-one to an exact command or one extended only by discovered behavioral-test paths after a non-option token, bind green results to the saved snapshot, and reject manifest/test hash mutations during capture.
- risk: Do not let validation or a concurrent process replace the plan lock between the initial existence check and save.
  instead: Publish a new lock with exclusive filesystem semantics, remove only MAID's private temporary file, and preserve every unexpected destination artifact for explicit operator inspection.
- risk: Do not weaken normal --require-red-evidence behavior for unlocked, new, malformed, or ordinary no-run locks.
  instead: Accept only a fully valid legacy_baseline payload; retain E704 for missing evidence and E705 for invalid evidence.
files:
  edit:
  - path: maid_runner/core/plan_lock.py
    artifacts:
    - kind: class
      name: LegacyBaselineEvidence
      description: Audited green-baseline evidence for a tracked manifest that predates plan-lock adoption.
    - kind: attribute
      name: reason
      of: LegacyBaselineEvidence
      type: str
      description: Required human explanation for using the legacy migration path.
    - kind: attribute
      name: baseline_commit
      of: LegacyBaselineEvidence
      type: str
      description: Resolved Git HEAD commit containing the pre-existing manifest.
    - kind: attribute
      name: baseline_manifest_hash
      of: LegacyBaselineEvidence
      type: str
      description: Hash of the committed pre-migration manifest bytes.
    - kind: attribute
      name: contract_delta
      of: LegacyBaselineEvidence
      type: ContractDelta
      description: Structured committed-to-current contract delta retained for audit.
    - kind: attribute
      name: commands
      of: LegacyBaselineEvidence
      type: tuple[RedPhaseCommandEvidence, ...]
      description: Current validate-command results, all classified not_red with exit code zero.
    - kind: attribute
      name: captured_at
      of: LegacyBaselineEvidence
      type: str
      description: UTC timestamp of the migration evidence capture.
    - kind: method
      name: to_payload
      of: LegacyBaselineEvidence
      args: []
      returns: dict
      description: Serialize an explicitly typed legacy_baseline payload without claiming red evidence.
    - kind: attribute
      name: legacy_baseline
      of: PlanLock
      type: Optional[dict]
      description: Separate audited legacy-baseline payload; None for ordinary and pre-feature locks.
    - kind: function
      name: capture_legacy_baseline_evidence
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: reason
        type: str
      returns: LegacyBaselineEvidence
      description: Fail closed unless the manifest existed at HEAD, only that manifest is dirty, every file section and artifact contract is unchanged, validate strengthening adds only discovered behavioral-test targets with one-to-one command matching, and all current commands are green.
    - kind: function
      name: enforce_plan_locks
      args:
      - name: chain
        type: ManifestChain
      - name: project_root
        type: Path
      - name: require_plan_lock
        type: bool
      - name: require_red_evidence
        type: bool
      - name: changed_paths
        type: Collection[str] | None
        default: None
      - name: plan_lock_scope
        type: str
        default: repository
      returns: tuple[ValidationError, ...]
      description: Treat a valid command-bound legacy_baseline as the explicit brownfield substitute for unavailable historical red evidence while retaining E704/E705 for absent or invalid evidence.
  - path: maid_runner/cli/commands/plan.py
    artifacts:
    - kind: function
      name: cmd_plan_lock
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: Support --legacy-baseline with required --reason, reject --no-run conflicts, capture green baseline evidence, publish the lock exclusively, remove only the private temporary file, and preserve unexpected destination artifacts.
    - kind: function
      name: cmd_plan_status
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: Expose legacy_baseline independently from red_evidence in JSON and text status output.
  - path: maid_runner/cli/commands/_main.py
    artifacts:
    - kind: function
      name: build_parser
      args: []
      returns: argparse.ArgumentParser
      description: Expose --legacy-baseline and --reason on maid plan lock without changing ordinary lock defaults.
  - path: README.md
    artifacts:
    - kind: attribute
      name: _legacy_baseline_plan_lock_quick_reference
      of: documentation
      type: markdown paragraph
      description: List the explicit legacy-baseline migration option and distinguish it from normal red evidence.
  - path: docs/maid_specs.md
    artifacts:
    - kind: attribute
      name: _legacy_baseline_plan_lock_specification
      of: documentation
      type: markdown section
      description: Specify eligibility, captured provenance, green validation, enforcement semantics, and anti-gaming boundaries for legacy migration.
