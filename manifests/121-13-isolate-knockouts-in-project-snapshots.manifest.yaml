outcome:
  status: completed
  completed_at: "2026-08-12T04:15:00Z"
  summary: "Knockout baseline, mutant, and restored-control commands now run in a fresh materialized current-byte project snapshot per declaration. Source files, ignored Python and Node dependency environments, ordinary and linked-worktree Git metadata, command environment routing, generated outputs, and cleanup are isolated and verified fail-closed without requiring a clean checkout or the legacy allow-dirty override."
  rationale: "Snapshot isolation removes the shared-checkout rewrite bottleneck required before bounded parallel knockout workers can be safe. The implementation copies current tracked, dirty, and relevant untracked inputs; independently materializes dependency environments; rewrites source-bound launchers and editable-install metadata; sanitizes process-bearing Git configuration; and verifies source input, dependency, and repository identities after every command lifecycle."
  lessons:
    - lesson_type: design
      summary: "A safe project snapshot includes dependency launch paths and Git control state, not only project source bytes: console-script shebangs, generated editable finders, config.worktree, fsmonitor, hooks, filters, and inherited location variables can otherwise escape the execution root."
      tags: [knockout, isolation, git, dependency-environments]
      paths:
        - maid_runner/core/_knockout_snapshot.py
        - tests/core/test_knockout_snapshot.py
    - lesson_type: testing
      summary: "Isolation needs adversarial write tests at the command boundary and final identity guards for non-Git inputs, same-status untracked Git bytes, per-worktree config, source venvs, node_modules, external symlinks, and gitlinks; creation-time checks alone cannot prove teardown safety."
      tags: [fail-closed, behavioral-testing, source-integrity]
      paths:
        - maid_runner/core/_knockout_snapshot.py
        - tests/core/test_knockout_snapshot.py
    - lesson_type: performance
      summary: "Bulk copy with filesystem-assisted reflink fallback reduced a real repository snapshot from about 3.0 seconds to 1.16 seconds to create while retaining independent writable files; declaration-level parallelism remains the next slice needed to amortize this fixed setup cost."
      tags: [performance, snapshot, knockout]
      paths:
        - maid_runner/core/_knockout_snapshot.py
        - manifests/drafts/121-14-run-knockouts-in-bounded-workers.manifest.yaml
  review_notes:
    - source: review_121_13_implementation
      severity: warning
      summary: "Initial review found per-worktree core.worktree redirects, writable source dependency paths, inherited location variables, and unsupported gitlinks; revision 5 added isolated dependencies, environment cleanup, Git config sanitization, and gitlink refusal."
    - source: review_121_13_implementation
      severity: warning
      summary: "Second review found source-bound launcher shebangs, generated editable finder mappings, and core.fsmonitor execution; revision 6 rewrote dependency metadata and rejected or removed process-bearing Git configuration."
    - source: review_121_13_implementation
      severity: warning
      summary: "Third review found missing post-command source input verification and omitted config.worktree identity; revision 7 added final source-input and per-worktree metadata guards."
    - source: review_121_13_implementation
      severity: ready
      summary: "Final independent review found no blocking issues; snapshot-local dependency, Git, environment, input, cleanup, and current-byte guarantees match the revision-7 contract."
  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/core/test_knockout_snapshot.py, tests/core/test_knockout_differential_detection.py, tests/core/test_knockout_batch.py, tests/core/test_knockout.py, tests/cli/test_verify_knockout_differential_cmd.py, tests/cli/test_verify_knockout_cmd.py, tests/core/validation/test_test_command_execution.py]
      status: passed
      summary: "All 72 declared snapshot, differential, batch, legacy, CLI, and command-boundary tests passed in 87.04s."
    - command: [uv, run, maid, validate, manifests/121-13-isolate-knockouts-in-project-snapshots.manifest.yaml, --mode, implementation]
      status: passed
      summary: "Implementation validation passed against plan-lock revision 7."
    - command: [uv, run, maid, verify, --profile, handoff, --require-plan-lock, --require-red-evidence, --since, 79ccf0e, --summary]
      status: passed
      summary: "The proportional handoff safety floor passed all nine stages in 121.28s with only pre-existing E307 warnings."
    - command: [uv, run, maid, assess, --since, 79ccf0e]
