          of: KnockoutDifferentialProof
          type: tuple[str, Ellipsis]
        - kind: attribute
          name: used_exact_fallback
          of: KnockoutDifferentialProof
          type: bool
        - kind: attribute
          name: diagnostics
          of: KnockoutDifferentialProof
          type: tuple[ValidationError, Ellipsis]
        - kind: function
          name: rewrite_artifact_body
          args:
            - name: source
              type: str
            - name: artifact_name
              type: str
            - name: artifact_kind
              type: str
            - name: parent_class
              type: str | None
              default: "None"
          returns: str
          description: "Replace the named Python function or method body while preserving its decorators, signature, and newline convention."
        - kind: function
          name: run_knockout_batch
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: evidence
              type: RuntimeEvidenceBundle | None
              default: "None"
            - name: limit
              type: int | None
              default: "None"
            - name: allow_dirty
              type: bool
              default: "False"
            - name: executor
              type: KnockoutCommandExecutor | None
              default: "None"
            - name: snapshot_backend
              type: ProjectSnapshotBackend | None
              default: "None"
          returns: dict[str, KnockoutReport]
          description: "Runs each declaration's serial differential lifecycle inside a fresh verified snapshot."
        - kind: function
          name: run_knockout
          args:
            - name: manifest
              type: Manifest
            - name: project_root
              type: Path
            - name: limit
              type: int | None
              default: "None"
            - name: allow_dirty
              type: bool
              default: "False"
            - name: evidence
              type: RuntimeEvidenceBundle | None
              default: "None"
            - name: executor
              type: KnockoutCommandExecutor | None
              default: "None"
            - name: snapshot_backend
              type: ProjectSnapshotBackend | None
              default: "None"
          returns: KnockoutReport
          description: "Preserves differential detection compatibility while each declaration executes in a fresh snapshot and allow_dirty becomes unnecessary."
    - path: maid_runner/core/result.py
      artifacts:
        - kind: attribute
          name: ARTIFACT_KNOCKOUT_NOT_DETECTED
          of: ErrorCode
          type: str
