          args: []
  edit:
    - path: maid_runner/core/knockout.py
      artifacts:
        - kind: class
          name: KnockoutResult
          description: "Per-artifact outcome backed by mutation-caused differential proof when detection succeeds."
        - kind: attribute
          name: artifact_name
          of: KnockoutResult
          type: str
        - kind: attribute
          name: artifact_kind
          of: KnockoutResult
          type: str
        - kind: attribute
