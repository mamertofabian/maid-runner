        - tests/core/test_test_runner.py
        - tests/core/validation/test_test_runner_invocation.py
        - tests/core/validation/test_test_command_targets.py
        - tests/core/validation/test_pnpm_vitest_batching.py
        - tests/core/validation/test_test_command_batching.py
