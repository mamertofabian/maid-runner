  completed_at: "2026-07-22T18:00:59+08:00"
  summary: "Resolved the E230/E231 conflict by excluding only explicitly acceptance-targeted tests from fast validate-command coverage while preserving E230 for unrelated declared tests."
  rationale: "Acceptance commands remain metadata and are never executed by the fast gate. Their targets are resolved through the shared command parser, with bounded Playwright normalization for runner subcommands, option values, variadic projects, and package-runner cwd prefixes so command syntax cannot accidentally exempt unrelated test directories."
  lessons:
