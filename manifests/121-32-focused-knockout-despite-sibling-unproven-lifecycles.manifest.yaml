# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Keep focused knockout when only sibling commands have unproven fixtures"
type: refactor
created: "2026-08-13T10:31:13Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - knockout
    - runtime-evidence
description: |
  121-31 ignores collection:global, but focused knockout still requires the
  bundle completeness to be usable. Grouped pytest unions merge sibling
  unproven fixture lifecycles onto the bundle. On this repo that is 131
  unproven fixtures, so bundle-level focused knockout stays off even though
  305 of 369 commands project clean enough for nodeid-focused detectors.

  Per-command projection already keeps only fixtures that consume the
  command's selected nodeids. Decide focused knockout from that command
  completeness. Sibling unproven lifecycles on the bundle must not force
  exact fallback. Unproven fixtures, missing workers, unsupported selectors,
  and non-collection unresolved contexts on the command itself still exact
  fallback. Ordinary tests-stage reuse is unchanged here.

  Do not claim the five-minute deep budget in this contract.
temptations:
  - risk: "Do not treat bundle unproven_fixture_lifecycles as this command's unproven lifecycle."
    instead: "Use the command's projected completeness for focused knockout; ignore sibling fixtures merged onto the bundle."
  - risk: "Do not run focused knockout when this command's own fixture lifecycle is unproven."
    instead: "Keep exact fallback when the command completeness has unproven_fixture_lifecycles, missing workers, unsupported selectors, or non-collection unresolved contexts."
files:
  create:
    - path: tests/core/test_focused_knockout_despite_sibling_unproven_lifecycles.py
      artifacts:
        - kind: test_function
          name: test_bundle_sibling_unproven_lifecycle_still_uses_focused_knockout
          args: []
        - kind: test_function
          name: test_command_unproven_lifecycle_still_forces_exact_knockout_fallback
          args: []
  scope:
    - path: maid_runner/core/knockout.py
      reason: "Focused-command selection must use command completeness, not bundle-merged sibling unproven fixtures."
  read:
    - maid_runner/core/runtime_evidence.py
    - manifests/121-08-collect-fixture-aware-runtime-evidence.manifest.yaml
    - manifests/121-31-focused-knockout-with-collection-incompleteness.manifest.yaml
    - tests/core/test_focused_knockout_with_collection_incompleteness.py
validate:
  - uv run python -m pytest -q tests/core/test_focused_knockout_despite_sibling_unproven_lifecycles.py tests/core/test_focused_knockout_with_collection_incompleteness.py
  - uv run maid validate manifests/121-32-focused-knockout-despite-sibling-unproven-lifecycles.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-13T10:40:00Z"
  summary: "Focused knockout uses the command's projected completeness. Sibling unproven fixture lifecycles merged onto the bundle no longer force exact fallback. Command-level unproven lifecycles still exact-fallback."
  rationale: "Grouped pytest unions merge every sibling unproven fixture onto bundle completeness. Requiring the bundle to be usable disabled nodeid-focused knockout for all 369 commands even though 305 projected clean enough. Per-command projection already excludes fixtures that do not consume the command's selected nodeids."
  lessons:
    - lesson_type: performance
      summary: "Decide focused knockout from command completeness; bundle-merged sibling unproven fixtures must not force exact fallback."
      tags: [performance, knockout, runtime-evidence]
      paths:
        - maid_runner/core/knockout.py
  review_notes:
    - source: self-review
      severity: ready
      summary: "Removed the bundle completeness gate from focused-command selection. Command unproven fixtures, missing workers, and unsupported selectors still exact-fallback. User rule disabled reviewer subagents; this is a local-only review."
  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/core/test_focused_knockout_despite_sibling_unproven_lifecycles.py, tests/core/test_focused_knockout_with_collection_incompleteness.py, tests/core/test_knockout_differential_detection.py]
      status: passed
      summary: "23 tests passed."
    - command: [uv, run, maid, validate, manifests/121-32-focused-knockout-despite-sibling-unproven-lifecycles.manifest.yaml, --mode, implementation]
      status: passed
      summary: "Implementation validation passed."
