  rationale: "Shared AST-aware discovery prevents future filename false positives. Historical entries lack immutable semantic provenance, so enforcement permits compatibility only across a fail-closed predicate covering snapshot structure, command multiplicity, declaration presence, regular-file hashing, and current non-test semantics."
