# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Show dated, caveated PyPI download statistics on the website and in the README"
type: feature
created: "2026-11-28T15:05:01Z"
metadata:
  planning_state: draft
  tags:
    - website
    - readme
    - evidence
    - distribution
  priority: medium
description: |
  A BigQuery investigation of the PyPI public dataset
  (bigquery-public-data.pypi.file_downloads), run on 2026-11-28, measured
  63,063 maid-runner distribution downloads (65,525 unfiltered), 2,654 of
  them with a standard Python package manager as the installer, from 32
  countries. These are distribution figures. They include automated and
  repeated downloads (CI, mirrors) and are not a count of users or installs.

  Publish them without presenting them as adoption:
  - website/data/download-stats.json records the source, an updatedAt date,
    the three counts, and semantics text stating the counts include
    automated and repeated downloads and are not unique users.
  - website/index.html gains a section id="distribution" directly after the
    hero and before #why-maid, headed "Open-source. Tool-agnostic. Built for
    reliability.", with four tiles: distribution downloads, package-manager
    downloads, countries in download records, and the MIT license. Each
    count tile carries data-download-stat="<key>" and shows a floor-rounded
    compact value of the JSON count (63063 -> 63K+, 2654 -> 2.6K+, 32 -> 32),
    so the page never overstates the JSON. A source note names the PyPI
    public BigQuery dataset, shows <time datetime="<updatedAt>"> with an
    English date, says the counts include automated and repeated downloads
    and are not unique users, and states the CLI collects no usage
    telemetry. The section links to GitHub and PyPI. The primary navigation
    is unchanged (test_website_distilled_story pins its four links).
  - README.md gains pepy.tech total and monthly download badges (downloads,
    never users or installs) and a "Downloads and privacy" section with the
    same floor-rounded figures (63,000+, 2,600+, 32 countries), the same
    date, the same caveats, a note that pepy.tech counts differ from the
    filtered BigQuery figures, and the no-telemetry statement.
  - No page or README text claims a number of users, installs, or
    developers.

  The no-telemetry claim was checked against the package: maid_runner imports
  no HTTP client, and its only sockets are the local daemon's AF_UNIX socket
  and loopback TCP listener.

  The figures are a hand-recorded snapshot from that investigation. A
  scheduled BigQuery refresh script is out of scope; the JSON's updatedAt
  keeps the snapshot visibly dated. Additive chain-merge onto the active
  website contracts; it supersedes nothing and does not edit the shared
  tests/test_website_static_contract.py.
temptations:
  - risk: "Do not round the counts up or label them users, installs, or developers."
    instead: "Floor-round the display values and keep the 'downloads' label; the tests compare each tile and README figure to the JSON."
  - risk: "Do not drop the source, date, or automated-download caveat to make the section look cleaner."
    instead: "Keep the dated source note in the section and the caveat paragraph in the README; both are asserted."
  - risk: "Do not add a nav link or edit the shared website contract test to make room for the section."
    instead: "Leave the nav and tests/test_website_static_contract.py untouched; the new section is covered by its own test file."
