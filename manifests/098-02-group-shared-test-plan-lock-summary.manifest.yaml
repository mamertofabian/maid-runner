      repeated; otherwise it contradicts the separately required singleton
      behavior and cannot define an implementable contract.
    tags:
    - behavioral-tests
    - plan-revision
    paths:
    - tests/cli/test_verify_summary_plan_lock_recovery.py
  - lesson_type: backward-compatibility
    summary: Additive fields on public result dataclasses should be trailing and
      defaulted so existing positional and keyword construction remains valid.
    tags:
    - public-api
    - dataclasses
    paths:
