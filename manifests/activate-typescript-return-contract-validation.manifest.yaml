# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Activate opt-in TypeScript return proofs in implementation validation while preserving
  raw source contracts.
type: feature
created: '2026-09-30T12:18:28Z'
description: 'Second slice of the approved compiler-return design, following the committed proof
  adapter. Add frozen TypeScriptReturnContractsConfig with mode syntax (default) or compiler,
  and optional tsconfig; compiler mode requires a nonempty explicit owning tsconfig. Add MaidConfig.typescript_return_contracts
  and parse the matching .maidrc.yaml section. Reject invalid modes, config path types and unknown
  section keys through load_config ValueError instead of silently selecting syntax.

  ImplementationFileValidator reads configuration in its validation operation, not its constructor.
  Its constructor gains an optional owned return_contract_checker dependency whose call contract
  is (Path project_root, str source_path, str config_path, str source, tuple[ReturnContractExpectation,
  ...] expectations) -> ReturnContractResult. Default to the existing public check_return_contracts
  adapter. Batch the file''s requested missing-return proofs once per per-file validation stage,
  without persistent semantic-result caching. No bridge call is needed in syntax mode, for an
  annotated return or for a contract without a return expectation.

  Apply compiler proof results at artifact comparison, retaining independent kind, argument,
  binding-pattern, type-parameter and strict-public-artifact checks. For requested absent callable
  returns in .ts/.tsx source, matched suppresses only that return''s E304; mismatched emits
  blocking E302; unavailable (including invalid expectations, unsupported methods/arrows/overloads,
  missing SDK/Node/config or suppressed semantic checking) emits blocking E309 COMPILER_RETURN_CONTRACT_UNAVAILABLE
  with declaration identity, source location and proof diagnostics. Explicit source annotations
  still compare syntactically. Python and other source languages retain current behavior. The
  context-free compare_artifacts public helper remains syntactic.

  Do not replace FoundArtifact.returns, mutate artifact-cache entries, manufacture a props alias,
  rewrite snapshots, or activate compiler checks in schema/behavioral modes. Existing ValidationEngine
  and CLI routing consume the per-file policy without new engine public API. Keep JSON, text
  and failure packets consistent with the same blocking E309 diagnostic. Add diagnostic metadata
  through the existing registry, retaining the common-issues help anchor until the documentation
  slice.

  Use additive chain evolution for existing config/result/per-file contracts; no durable public
  artifact is removed or renamed, and no existing locked tests are edited. The proof adapter
  remains read-only. The prior Outcome''s suppressed-diagnostic and reply-provenance lessons
  shape actual SDK tests and failure cases; reuse its safety guards rather than reimplementing
  TypeScript semantics. Documentation and final bug-report archival remain in the subsequent
  acceptance slice.

  Manifest-derived recall reinforced compatibility boundaries: the existing type-comparison-hook
  Outcome kept compare_artifacts signatures unchanged, and the enum/variadic-tuple Outcomes
  preserved historical collector representation. This slice therefore leaves collector records
  and old callable APIs unchanged, adds an optional owned constructor dependency, and isolates
  new policy in private comparison wiring. Their unrelated release-metadata failures remain
  outside this task.
  '
temptations:
- risk: Do not write inferred return strings into FoundArtifact or snapshot contracts.
  instead: Consume typed proof decisions only in per-file comparison and test raw collection,
    snapshots and the pure comparison helper remain syntactic.
- risk: Do not remove every E304 after a successful compiler proof.
  instead: Suppress only the matching missing-return diagnostic while retaining parameter annotation
    warnings and exact binding-pattern errors.
- risk: Do not silently fall back to syntax when explicitly enabled compiler proof fails.
  instead: Emit blocking E309 with original proof diagnostics and verify text, JSON and packet
    results.
- risk: Do not call the compiler once per artifact or for default syntax validation.
  instead: Collect requested absent-return contracts into one file batch and use the owned checker
    seam to assert one invocation; bypass proof for explicit annotations and unspecified returns.
