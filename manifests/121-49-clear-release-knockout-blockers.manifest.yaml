metadata:
  priority: critical
  epic: 121-00-fast-verification-roadmap
  tags: [knockout, deep-verification, reexport, performance, validation-trust]
description: |
  The exact release-baseline deep gate completed schema, behavioral,
  implementation, and artifact coverage, then failed knockout after 4h28m.
  Five E712 failures came from repeated waves of identical `pytest tests/ -v`
  baselines launched under different manifest slugs: seven copies contend at
  once and exceed the fixed 300-second command timeout even though the command
  is green without that contention. Another E712 came from the public
  `maid_runner.daemon.serve` package re-export, whose declaration file has no
  local function body. Two E711 findings came from older chain-merge owner
  commands that do not distinguish their abstract protocol bodies from the
  knockout sentinel.

  Evolve 121-48 so the owned default `KnockoutCommandExecutor` may share one
  immutable post-baseline checkpoint across manifest slugs when the exact
  selected command and all captured project/environment identities match.
  The slug is only result attribution at this owned boundary and is not passed
  to the subprocess environment. Injected executors retain the existing
  slug-isolated lifecycle because they may assign custom slug semantics. Every
  artifact still receives its own mutant and restored green control, cache
  attribution, deterministic report, and fail-closed drift checks.

  Some release mutations remain deliberately ineligible for shared baselines:
  duplicate-owner specs retain independent declaration lifecycles, and legacy
  snapshot owners carry ordered multi-command validation. The owned default
  executor must serialize an identical command across those independent
  lifecycles so several broad baselines cannot contend into false E712
  timeouts. Different commands remain parallel, and injected executors retain
  their existing behavior.

  Resolve a declared one-level Python package re-export through the existing
  module-path resolver and mutate the resolved implementation body while
  preserving the public facade path/name in results and diagnostics. Plain and
  aliased named exports are supported; unresolved, star, and multi-hop exports
  remain E712. Finally, strengthen the exact test files already executed by the
  older DetectionEvidenceSource and CoverageEvidenceSource owner manifests so
  each command rejects the `maid-knockout` exception payload independently.
temptations:
  - risk: "Do not share baselines across injected executors, different commands, environments, repository inputs, or dependency identities."
    instead: "Cross slug boundaries only for the default executor whose subprocess behavior is slug-invariant; preserve legacy isolation everywhere else."
  - risk: "Do not let duplicate-owner or multi-command specs bypass contention control merely because their declaration execution must remain independent."
    instead: "Serialize identical commands at the owned default-executor boundary while retaining separate snapshots, mutations, restored controls, command order, and report attribution."
  - risk: "Do not mutate or wrap the public package facade merely to manufacture a local function body."
    instead: "Resolve one safe named re-export, mutate its implementation body in the snapshot, and keep manifest-facing report identity unchanged."
  - risk: "Do not guess through star or multi-hop exports or turn an unresolved body into success."
    instead: "Use the existing one-level resolver and retain deterministic E712 whenever it cannot prove a concrete implementation target."
  - risk: "Do not satisfy the two E711 findings by sharing detection between independent manifest declarations."
    instead: "Make each older owner command itself fail on the sentinel payload while remaining green for the intended abstract contract body."
