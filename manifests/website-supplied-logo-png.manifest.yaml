# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Use the supplied PNG logo as the website's authoritative brand asset"
type: fix
created: "2026-08-02T22:21:26Z"
supersedes:
  - website-static-landing-page
metadata:
  planning_state: completed
  tags:
    - website
    - branding
    - static-site
  priority: medium
description: |
  Correct the website branding implementation after review showed that the
  generated logo.svg does not match the supplied logo. Use the supplied
  transparent logo.png for the header, footer, favicon, Apple touch icon, and
  404 page, and remove the generated SVG from the production asset graph.

  Preserve the completed mockup-aligned page, social card, dependency-free
  implementation, progressive-enhancement navigation, canonical metadata,
  fallback route, and path-scoped GitHub Pages deployment contract.
temptations:
  - risk: "Do not keep the generated SVG as an alternate brand mark or leave HTML
      references pointing at it."
    instead: "Use website/assets/logo.png for every logo surface, assert its PNG signature,
      and assert logo.svg is absent and unreferenced."
  - risk: "Do not remove the supplied PNG after adopting it."
    instead: "Declare logo.png as the production asset and keep it in the deployed
      asset graph."
  - risk: "Do not regress the completed mockup redesign while correcting the brand
      asset."
    instead: "Redeclare the complete static website contract and keep all existing
      story, navigation, workflow, capability, quick-start, accessibility, fallback,
      SEO, and deployment checks."
files:
  scope:
    - path: website/index.html
      reason: "Homepage brand surfaces and favicon metadata must use the supplied
        PNG asset while retaining the mockup-aligned page contract."
    - path: website/styles.css
      reason: "Existing responsive visual system remains part of the superseded website
        contract."
    - path: website/script.js
      reason: "Existing progressive-enhancement navigation remains part of the superseded
        website contract."
    - path: website/404.html
      reason: "Fallback brand surface and favicon must use the supplied PNG asset."
    - path: website/robots.txt
      reason: "Crawler policy remains part of the canonical static deployment surface."
    - path: website/sitemap.xml
      reason: "Search-engine discovery metadata remains part of the canonical static
        deployment surface."
    - path: website/assets/logo.png
      reason: "The supplied transparent PNG is the authoritative production brand
        asset."
    - path: website/assets/social-card.png
      reason: "The final social preview remains part of the website asset contract."
    - path: .github/workflows/deploy-website.yml
      reason: "The existing Pages workflow remains part of the website deployment
        contract."
  delete:
    - path: website/assets/logo.svg
      reason: "Generated logo variant does not match the supplied brand asset and
        must not ship."
    - path: website/assets/mockup-redesign.png
      reason: "Disposable supplied visual reference is not a production website asset."
    - path: website/assets/social-card-v2.png
      reason: "Disposable supplied source artwork is represented by the production
        social-card.png asset."
  edit:
    - path: tests/test_website_static_contract.py
      artifacts:
        - kind: test_function
          name: test_homepage_matches_mockup_story_and_navigation
          args: []
          returns: None
          source_scenario: "A visitor opens the MAID Runner homepage and scans the
            product story."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The homepage exposes the mockup-aligned hero, primary actions,
              navigation anchors, validation panels, problem cards, and all major
              page sections with semantic headings."
        - kind: test_function
          name: test_homepage_renders_workflow_capabilities_tools_and_quickstart
          args: []
          returns: None
          source_scenario: "A visitor scrolls through the homepage to understand the
            MAID loop and how to start."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The page renders seven plan-to-evidence steps, six capability
              cards, tool compatibility labels, and the documented quick-start commands
              without suggesting maid verify on an empty repository."
        - kind: test_function
          name: test_homepage_uses_final_local_brand_and_social_assets
          args: []
          returns: None
          source_scenario: "A browser and social crawler load the homepage after the
            supplied logo has replaced the generated mark."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "Favicon, touch-icon, header/footer logo, and social metadata
              point to local final assets; the supplied PNG has a valid signature;
              every local HTML reference exists; and logo.svg plus all disposable
              design inputs are absent and unreferenced."
        - kind: test_function
          name: test_mobile_navigation_covers_javascript_and_no_javascript_paths
          args: []
          returns: None
          source_scenario: "A visitor uses the compact navigation on a small screen
            with JavaScript enabled or disabled."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The script covers open/close, link dismissal, Escape dismissal,
              and focus return while CSS keeps navigation visible and usable without
              JavaScript."
        - kind: test_function
          name: test_dark_surface_accessibility_contract_is_declared
          args: []
          returns: None
          source_scenario: "A visitor reads and navigates the dark mockup-aligned
            page across desktop and mobile."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The stylesheet declares readable text tokens, visible focus
              states on dark surfaces, responsive rules, and reduced-motion handling."
        - kind: test_function
          name: test_static_fallback_and_search_metadata_target_canonical_domain
          args: []
          returns: None
          source_scenario: "A visitor follows a stale Pages URL or a crawler reads
            deployment metadata."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "404.html provides a real recovery link and the supplied local
              PNG brand asset, robots.txt points to the canonical sitemap, sitemap.xml
              is valid XML, and all canonical locations target https://maidrunner.dev/."
        - kind: test_function
          name: test_pages_workflow_is_path_scoped_and_uploads_website_root
          args: []
          returns: None
          source_scenario: "A website change lands on main or an operator manually
            dispatches the Pages workflow."
          actions:
            - type: api_call
              subject:
                function: yaml.load
          expected:
            behavior: "The workflow triggers only for main website/workflow changes
              or manual dispatch, uses least-privilege Pages permissions, uploads
              website as the artifact root, and deploys through GitHub Pages with
              immutable action SHAs."
  read:
    - README.md
    - pyproject.toml
validate:
  - uv run python -m pytest -q tests/test_website_static_contract.py
  - uv run maid validate manifests/website-supplied-logo-png.manifest.yaml
    --mode behavioral --quiet
  - uv run maid validate manifests/website-supplied-logo-png.manifest.yaml
    --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-02T22:32:46Z"
  summary: "Replaced the generated logo variant with the exact supplied transparent PNG across the homepage and fallback page, while preserving the completed mockup-aligned website and removing the incorrect SVG asset."
  rationale: "The supplied PNG is the authoritative brand artwork. SVG is not required for this static site, and retaining a visually different generated mark would make the deployed header, favicon, touch icon, and fallback page inconsistent with the approved design."
  lessons:
    - lesson_type: asset-fidelity
      summary: "When a user-provided brand asset is available, the production asset graph and metadata should point to that exact file rather than to a recreated approximation, even when the approximation is technically scalable."
      tags:
        - branding
        - png
        - static-site
      paths:
        - website/assets/logo.png
        - website/index.html
        - website/404.html
    - lesson_type: validation
      summary: "A logo correction needs both source-level reference assertions and an HTTP smoke check so the exact local image, favicon metadata, fallback page, and deployed asset path are verified together."
      tags:
        - assets
        - metadata
        - browser-smoke
      paths:
        - tests/test_website_static_contract.py
        - website/assets/logo.png
  review_notes:
    - source: implementation-review-subagent-harvey
      severity: advisory
      summary: "An independent read-only reviewer was spawned with a fresh context and explicit packet, but timed out without returning a verdict after a follow-up interrupt; the reviewer was closed and the local-only fallback review was completed."
    - source: local-read-only-fallback
      severity: ready
      summary: "Local adversarial review found no blockers: the supplied PNG exists and is served as image/png, all homepage and 404 brand surfaces use it, logo.svg and disposable source assets are absent/unreferenced, the existing mockup sections and deployment contract remain intact, and diff/scope checks are clean."
  validation:
