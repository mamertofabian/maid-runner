outcome:
  status: completed
  completed_at: '2026-07-26T07:00:19+08:00'
  summary: >-
    maid manifest from-diff now rejects an --output path whose suffix it cannot
    correctly emit, at both sites the drafts-directory containment condition is
    already checked, so the guard covers --dry-run and library callers as well
    as the writing path. The rejection produces no filesystem effect at all, not
    even the writer's parent mkdir. from-diff is YAML-only by decision, and the
    accepted set is derived from the reader's own _SUFFIX_FORMATS map rather
    than restated, so the writer cannot drift away from load_manifest_raw.
  rationale: >-
    Third and last of the sibling writers found by the
    fix-snapshot-output-format-from-suffix review, after 089-01 (save_manifest)
    and 089-02 (convert_v1_file). This one mattered most because a from-diff
    manifest is a draft, and a draft exists to be promoted: the old behavior
    exited 0, wrote YAML to manifests/drafts/x.json, and embedded
    "maid validate manifests/drafts/x.json --mode schema --quiet" into the draft
    as its own validate command, which then failed with E003. The agent or human
    had already moved on believing the command succeeded.

    Two questions the draft deferred were resolved with tree-verified evidence
    before the plan lock, and both were approved by the user.

    First, whether from-diff supports JSON at all. It does not. _cmd_promote
    (maid_runner/cli/commands/manifest.py:165-169) accepts only *.manifest.yaml
    and *.manifest.yml, so a JSON draft would be unpromotable even if written as
    well-formed JSON; and the writer emits the 086-01 comment banner, which JSON
    cannot carry. Unlike save_manifest and convert_v1_file, whose callers choose
    the format, this writer's contract is drafts-for-promotion.

    Second, where the check belongs. The writer alone is not enough:
    _cmd_from_diff returns for --dry-run without ever reaching
    write_from_diff_manifest, and the existing containment guard was confirmed
    to fire under --dry-run. A writer-only suffix check would therefore have
    been weaker than the condition it was meant to sit alongside, leaving
    --dry-run printing a manifest whose embedded self-validate path names a file
    MAID cannot load. One shared validate_from_diff_output_suffix helper is
    called from both sites so they cannot drift apart.
  lessons:
    - lesson_type: guard-placement
      summary: >-
        A guard added "alongside" an existing one should be checked at every
        site the existing one is checked at. Comparing enforcement sites, rather
        than just adding the new condition where it seemed natural, is what
        surfaced the --dry-run gap: _cmd_from_diff returns before the writer, so
        a writer-only suffix check would have been strictly weaker than the
        containment check it was meant to accompany, and the declared contract
        would have shipped a cmd_manifest whose stated exit-2 behavior was false
        for one flag. Enumerate the existing condition's enforcement sites
        before deciding where the new one lives.
      tags:
        - contract-design
        - cli
      paths:
        - maid_runner/cli/commands/manifest.py
        - maid_runner/core/manifest_from_diff.py
    - lesson_type: drift-resistance
      summary: >-
        Deriving an accepted set from the reader's own map beats restating it.
        A hardcoded {".yaml", ".yml"} passes every test in this contract today,
        because _SUFFIX_FORMATS maps exactly those two suffixes to yaml, so no
        test can currently discriminate the two implementations. Deriving the
        set anyway is what makes the guard track load_manifest_raw the moment
        the reader changes, and the derivation tests become discriminating at
        exactly that point. Review confirmed this survivor is inherent rather
        than a test defect.
      tags:
        - anti-drift
        - manifest-io
      paths:
        - maid_runner/core/manifest.py
        - maid_runner/core/manifest_from_diff.py
    - lesson_type: repo-tooling
      summary: >-
        Editing a doc under docs/ can break tests in this repo.
        docs/draft-manifest-workflow.md is mirrored into maid_runner/docs/ for
        the packaged init payload, and test_packaged_workflow_docs_match_source_docs
        plus test_learning_digest_payload_sources_and_packages_match both fail
        until `make sync-agent-payloads` runs. Run the sync in the same pass as
        any docs/ edit, and commit both copies together.
      tags:
        - workflow
        - documentation
      paths:
        - docs/draft-manifest-workflow.md
        - maid_runner/docs/draft-manifest-workflow.md
    - lesson_type: promotion-side-effects
      summary: >-
        Promotion strands sibling pointers in both directions. 089-02's Outcome
        recorded this when 089-01 was promoted and predicted 089-03 would hit it
        twice; it did, with both 089-01 and 089-02 pointing at 089-03's draft
        path, and both needed a plan revise --preserve-red-evidence on
        already-completed contracts. Two independent recurrences now confirm the
        earlier recommendation: reference sibling manifests by slug rather than
        by path, so promotion cannot invalidate the pointer.
      tags:
        - workflow
        - manifest-authoring
      paths:
        - manifests/089-01-honor-output-suffix-in-save-manifest.manifest.yaml
        - manifests/089-02-honor-output-suffix-in-v1-conversion.manifest.yaml
  review_notes:
    - source: maid-implementation-reviewer
      severity: ready
      summary: >-
        Verdict ready to merge, zero blocking findings. The reviewer
        independently re-ran implementation validation, the focused tests plus
        tests/core/test_manifest_from_diff.py (39 passed), the strict handoff
