# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Report unsupported coverage instrumentation instead of asserting nonexecution
type: fix
created: '2026-10-20T17:12:20Z'
description: 'When no instrumentable test command exists, report blocking instrumentation-unavailable
  rather than observed nonexecution. Recognized Python behavioral runners (pytest/unittest/django,
  including existing recognized wrappers) that cannot be instrumented must produce
  explicit blocking E307 instrumentation-unavailable errors, not empty-data E710.
  Classify commands using existing bounded runner semantics and registered wrappers;
  non-test validation (Ruff/mypy/maid validate) and non-Python runners (Vitest/Deno/Cargo/Foundry)
  remain ignored when instrumentable Python tests exist, because this gate covers
  Python artifacts only. Preserve observed executed=True target findings from supported
  pytest commands, omit unknown negative findings/E710 when unsupported runners could
  execute them, and mark incomplete reports partial rather than exact or derived;
  runtime-evidence result completeness must be false. Apply consistent behavior through
  direct coverage, serial/isolated batch finalization, and exact/derived evidence
  consumers. Do not run Django/container/wrapper commands on the host or add arbitrary
  runner instrumentation. Preserve real observed nonexecution E710 for fully instrumentable
  suites. Existing signatures and report shape remain unchanged; unavailable severity
  is explicitly error and public verify must block despite advisory E307 warning policy.
  Preserve existing abstract/default-hook/runtime-exempt applicability: when the existing
  target evaluator requires no runtime observations, instrumentation is not needed.
  Do not add a separate static applicability analyzer. Reuse the existing pytest runner
  family including py.test aliases when classifying unsupported wrappers; do not duplicate
  an incomplete alias list.'
temptations:
- risk: Convert missing instrumentation into proof that an artifact did not execute,
    or hide the limitation behind advisory E307 severity.
  instead: Emit explicit error-severity instrumentation-unavailable diagnostics, preserve
    positive observations, omit unsupported negative claims and block public verification.
- risk: Classify non-test validators or non-Python test runners as unavailable Python
    instrumentation, or silently mark mixed Python behavioral instrumentation exact.
  instead: Reuse existing recognized runner/wrapper semantics; keep non-test validation
    compatible and explicitly mark incomplete recognized test-runner reports partial.
- risk: Execute isolated Django/container/wrapper commands on the host to obtain coverage,
    or add a custom command parser.
  instead: Keep unsupported instrumentation explicit and reuse bounded existing classification
    without running those commands.
