- uv run maid validate manifests/085-06-review-convergence-and-iteration-guidance.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-07-18T17:11:10+08:00"
  summary: "Updated Claude and Codex MAID workflow skills plus the draft workflow documentation with a convergent review protocol, task-scoped iteration recipes, baseline-aware handoff commands, evidence-flag guidance, and dedicated-test-file planning guidance; synced packaged payloads and advanced the instruction payload version to 2026.07.18.1."
  rationale: "The observed cost came from repeated agent turns and evidence revisions rather than runner execution time. The implementation therefore keeps review convergence advisory, teaches reviewers to report and classify findings exhaustively, batches blocking fixes into one revision cycle, preserves advisories for future drafts, and makes every executable verify recipe carry the explicit baseline required by changed-scope validation."
  agent:
    model: GPT-5
    provider: OpenAI
    client: Codex
    skills:
    - maid-implement-draft
    - maid-plan-review
    - maid-implementer
    - maid-implementation-review
  lessons:
  - lesson_type: design
    summary: "Agent guidance that invokes maid verify must distinguish the canonical gate name from an executable recipe and include --since or --base-ref on every standalone execution example, because changed-scope validation fails closed with E115 when no baseline is supplied."
    tags:
    - agent-skills
    - verify
    - changed-scope
    paths:
    - .claude/skills/maid-implementation-review/SKILL.md
    - .codex/skills/maid-implementation-review/SKILL.md
    - .claude/skills/maid-runner-draft-implement/SKILL.md
    - .codex/skills/maid-runner-draft-implement/SKILL.md
  - lesson_type: testing
    summary: "Guidance payload tests should render both tool sources into a temporary workspace, compare only package outputs the sync manifest actually declares, and preserve older canonical-command assertions while pinning new executable forms."
    tags:
    - behavioral-testing
    - payload-sync
    - compatibility
    paths:
    - tests/test_review_convergence_guidance.py
    - scripts/sync_claude_files.py
  - lesson_type: review-fix-loop
    summary: "Classifying review findings as blocking or advisory enabled both blocking fixes to land in one plan-lock revision and one validation cycle, while residual vocabulary and packet-test suggestions remained recorded future work rather than causing more lock churn."
    tags:
    - implementation-review
    - convergence
    - plan-lock
    paths:
    - docs/draft-manifest-workflow.md
    - .claude/skills/maid-implementation-review/SKILL.md
    - .codex/skills/maid-implementation-review/SKILL.md
  review_notes:
  - source: maid-implementation-review-round-1
    severity: needs-changes
    summary: "Found two blockers in one pass: baseline-less handoff/packet/artifact verify examples reproduced E115, and the workflow doc omitted persisting advisories for possible future drafts. Both were batched into plan-lock revision 4 with fresh red evidence."
  - source: maid-implementation-review-round-2
    severity: ready
    summary: "Confirmed both blockers closed, scope and generated-payload parity intact, plan lock revision 4 OK, focused tests green, and final strict verification passing; no blocking findings remained."
  - source: maid-implementation-review-round-2
    severity: advisory
    summary: "Future drafts may map legacy should-fix/nitpick priority vocabulary explicitly to advisory and add packet-example-specific regression coverage; neither advisory justified another current-session revision."
