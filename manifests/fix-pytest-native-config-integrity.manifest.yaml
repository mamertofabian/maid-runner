# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Prevent native pytest TOML configuration from bypassing behavioral command integrity.
type: fix
created: '2026-09-28T14:13:29Z'
metadata:
  priority: critical
description: |
  Pytest 9 can obtain addopts from pytest.toml, .pytest.toml and native
  [tool.pytest] TOML tables which the legacy inspector does not model.
  Detect potentially relevant native config from explicit choices and from
  project/test ancestors, without assuming the host pytest version or deciding
  consumer precedence. Check only pytest commands; explicit legacy config and
  CLI addopts overrides retain their existing paths and execution guards.
  Potential native configuration must enter guarded consumer-interpreter proof
  before the empty/benign legacy-addopts fast path. Reuse the existing protected
  pytest loop, final node IDs, runnable mode, environment and command resolver.
  The baseline overrides addopts only for proof; the configured probe validates
  native effective option syntax directly rather than matching legacy-inspected
  options. Identical nonempty selections are required. Actual commands/configs
  remain unchanged. Unsupported command/option shapes fail with E230.
  Preserve the legacy selection-proof API behavior and its existing tests.
  Recognize pytest's --collectonly alias in existing execution guards so explicit
  overrides cannot disguise nonexecution. Exercise real pytest 8 and 9, including
  alternate consumer interpreters within the same host test session.
temptations:
- risk: Do not read host pytest metadata to decide whether consumer config applies.
  instead: Treat files as candidates only and let the resolved native process prove behavior.
- risk: Do not silently skip unknown or nonexecuting native settings.
  instead: Require complete runnable native evidence or return an explicit E230 diagnostic.
- risk: Do not treat ignored pytest-9-only files as active in pytest 8.
  instead: Test both consumer versions, native precedence and explicit config/override behavior.
files:
  edit:
  - path: maid_runner/core/_pytest_config_addopts.py
    artifacts:
    - kind: function
      name: requires_native_pytest_config_check
      args:
      - {name: project_root, type: Path}
      - {name: command, type: 'Sequence[str]'}
      - {name: test_files, type: 'Sequence[str]'}
      returns: bool
  - path: maid_runner/core/_pytest_addopts_selection.py
    artifacts:
    - kind: function
      name: pytest_native_config_collection_error
      args:
      - {name: project_root, type: Path}
      - {name: command, type: 'Sequence[str]'}
      returns: str | None
  scope:
  - path: maid_runner/core/_validation_test_artifacts.py
    reason: Route potential native configuration to authoritative proof before legacy config shortcuts.
  - path: maid_runner/core/_test_runner_invocation.py
    reason: Retain nonexecution protection for the native pytest --collectonly alias, including CLI overrides.
  - path: docs/troubleshooting.md
    reason: Document native config proof, interpreter-specific precedence and unsupported shapes.
  read:
  - tests/core/validation/test_pytest_native_config_integrity.py
  - maid_runner/core/_test_command_targets.py
  - maid_runner/core/_test_command_execution.py
  - maid_runner/core/test_runner.py
validate:
- [uv, run, python, -m, pytest, tests/core/validation/test_pytest_native_config_integrity.py, -q]
- [uv, run, --with, pytest==9.0.2, python, -m, pytest, tests/core/validation/test_pytest_native_config_integrity.py, -q]

