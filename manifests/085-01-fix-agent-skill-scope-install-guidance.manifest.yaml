schema: '2'
goal: Fix distributed MAID agent skill guidance so Claude and Codex implementers treat files.scope/files.delete as writable while keeping files.read read-only, planners recommend PyPI/package-manager maid-runner installs instead of local dev setup assumptions, generated advisory run-review artifacts are gitignored, and downstream maid init detects the payload update through an instruction-payload version bump
type: fix
created: '2026-07-06T22:26:45Z'
metadata:
  tags:
  - agent-skills
  - init-payloads
  - files-scope
  - documentation
  priority: medium
description: |
  A downstream onboarding review found three related payload defects:

  1. Implementer guidance lagged the files.scope contract. Codex source
     guidance already described files.scope as writable but its hard "NEVER
     modify" rule omitted files.scope and files.delete; Claude source guidance
     still only mentioned files.create/files.edit. Both tools must describe
     files.scope as writable no-artifact implementation scope and files.read as
     dependency context only.

  2. Planner prerequisites still recommended `pip show` and local review found
     an overcorrection toward `uv sync --dev`. Distributable skill guidance
     should not assume a local editable ../maid-runner checkout; it should probe
     for the `maid` command and tell agents to install `maid-runner` from PyPI
     using the repository's package manager.

  3. Run-review skills mention `.maid/run-review.json` as generated advisory
     output, but `.gitignore` omitted that file. The other advisory digest and
     run-review patterns already exist and remain pinned.

  Related Outcome lessons: prior payload work repeatedly found that source and
  packaged skill copies must be kept byte-for-byte in sync, guidance-only
  changes need direct string tests, and init-distributed payload changes must
  advance INSTRUCTION_PAYLOAD_VERSION so downstream `maid init --check`
  reports stale installs.
temptations:
- risk: Do not patch only repo-local downstream skill copies and leave upstream packaged payloads stale.
  instead: Edit the upstream source skills, run the payload sync, and assert source/package equality for both Claude and Codex.
- risk: Do not make files.read writable to solve scope-only implementation friction.
  instead: State files.scope/files.delete are writable implementation scope and files.read remains dependency context that requires plan revision before editing.
- risk: Do not change init-distributed skill guidance without bumping the instruction payload version.
  instead: Advance INSTRUCTION_PAYLOAD_VERSION past 2026.07.06.1 and pin it with a focused test.
- risk: Do not force downstream repositories into this repo's local editable maid-runner development setup.
  instead: Keep prerequisite guidance PyPI/package-manager oriented, while still allowing uv projects to run maid through uv.
- risk: Do not rely on prose review to catch the same guidance regression later.
  instead: Add behavioral tests that scan both source and packaged payload files for the required positive and negative guidance.
files:
