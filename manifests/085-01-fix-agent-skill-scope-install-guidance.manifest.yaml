    - kind: attribute
      name: _packaged_codex_planner_pypi_prerequisite_guidance
      of: skill
      type: markdown guidance
      description: Packaged Codex planner payload copy mirrors the PyPI/package-manager prerequisite guidance.
  - path: .gitignore
    artifacts:
    - kind: attribute
      name: _maid_advisory_artifact_ignore_patterns
      of: gitignore
      type: ignore pattern list
      description: Ignore generated advisory Outcome and run-review artifacts, including .maid/run-review.json.
  - path: maid_runner/instruction_payload.py
    artifacts:
        - kind: attribute
          name: INSTRUCTION_PAYLOAD_VERSION
          type: str
          description: Date-stamped instruction payload version advanced past 2026.07.06.1 because init-distributed skill guidance changed.
