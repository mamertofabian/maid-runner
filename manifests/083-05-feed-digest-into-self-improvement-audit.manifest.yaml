    - kind: test_function
      name: test_self_improvement_digest_fallback_is_non_blocking
      args: []
      returns: None
      description: Guidance states the fallback to plain maid insights when the runner rejects the digest, and forbids --allow-stale-index forcing, digest generation, and model calls from within the audit across all self-improvement skill surfaces.
    - kind: test_function
