outcome:
  status: completed
  completed_at: "2026-08-17T23:11:00Z"
  summary: Exact-command knockout groups now share one immutable post-baseline checkpoint while preserving per-artifact mutant and restored controls, focused fallback, weighted scheduling, fail-closed drift handling, and durable cache checkpoints.
  rationale: |
    Eligible single-command declarations with the same manifest slug and exact
    selected command now execute one green baseline, freeze the complete
    baseline-generated root, and recreate the same pathname from that immutable
    checkpoint before every mutation. Each artifact still runs its own mutant
    and restored control, reducing an N-artifact group from 3N command launches
    to 1+2N without reusing mutable generated or Git state.

    Revision review evolved three inherited assumptions that contradicted the
    grouped lifecycle: interrupted cache evidence now uses public execution,
    cache invalidation expects 14 rather than 18 launches across two
    three-artifact misses, and dirty-state reset expects one shared baseline.
    Deterministic E711 negative evidence remains cacheable; incomplete E712
    harness/control evidence does not.

    Evidence: the expanded contract passed 117 tests; implementation validation
    passed; all 268 active manifests validated; all 297 declared command groups
    passed, including 4,440 pytest passes and 9 skips in the broad batch; the
    task-scoped verify gate passed all 8 stages in 70 seconds; Black, Ruff, and
    git diff checks passed; and independent implementation review returned
    Ready to merge with no blockers, should-fixes, or nitpicks.
  lessons:
    - lesson_type: performance
      summary: Repeated exact mutation commands can safely share only their immutable post-baseline filesystem checkpoint; every artifact must retain its own mutant and restored control.
      tags: [knockout, command-grouping, deep-verification, performance]
      paths:
        - maid_runner/core/_knockout_snapshot.py
        - maid_runner/core/_knockout_worker.py
        - maid_runner/core/knockout.py
    - lesson_type: validation-trust
      summary: Shared controls widen the trust boundary, so complete root reset, stable pathname, live source and repository identity, retained dependency identity, and E712 cache exclusion must remain fail-closed.
      tags: [snapshot-isolation, cache-integrity, fail-closed, restored-control]
      paths:
        - maid_runner/core/_knockout_snapshot.py
        - maid_runner/core/knockout.py
  review_notes:
