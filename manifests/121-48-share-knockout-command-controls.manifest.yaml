# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Share exact-command knockout baselines without weakening restored-control proof"
type: refactor
created: "2026-08-17T22:16:03Z"
supersedes:
  - 121-47-template-fresh-knockout-roots
description: |
  The release-baseline deep gate still launches every selected mutation command
  three times: green baseline, mutant, and restored green. A 40-minute sample
  advanced only 109 durable checkpoints, and 304 cached proofs contained just
  162 distinct executed command tuples. Repeated exact commands therefore pay
  the same green setup hundreds of times even after 121-47 removed live-source
  snapshot contention.

  Evolve 121-47 only for declarations that have one validate command and share
  the exact manifest slug, selected focused-or-exact command, environment,
  source/repository/dependency identity, and process cost. Materialize one
  stable-path command-group root, run its baseline once, and freeze the complete
  post-baseline source/Git/generated state as an immutable checkpoint. Before
  every mutation, delete and recreate that same pathname from the checkpoint,
  verify the reset byte-for-byte, then run the mutant and restored control in
  that root. This preserves baseline-generated prerequisites and absolute-path
  behavior while reducing a group of N proofs from 3N command executions to
  1+2N. Retained dependency identity must be verified between mutations.

  Multi-command declarations, singleton groups, custom snapshot backends,
  unsafe or incomplete focused evidence, and any group-key mismatch stay on
  the existing per-declaration lifecycle. Reset uncertainty, retained
  dependency or live input identity drift, and baseline failure stop the group
  and project deterministic E712 errors. A focused mutant that remains green
  still takes the unchanged exact fallback. Each completed artifact is
  checkpointed before the next mutation so an interruption preserves only
  finalized proofs. Returned report ordering, proof fields, cache eligibility,
  weighted process budgets, and E711/E712 semantics remain deterministic.
temptations:
  - risk: "Do not reuse a green exit code while starting mutants from a different filesystem state or pathname."
    instead: "Freeze the complete post-baseline state and recreate the same stable group pathname before every mutation, then verify the reset before execution."
  - risk: "Do not share controls across merely similar pytest commands, different manifest slugs, environments, identities, or process costs."
    instead: "Use the exact selected command plus slug, environment, captured input identities, and process cost as the group boundary; leave mismatches ungrouped."
  - risk: "Do not share the restored control or infer detection from a mutant exit alone."
    instead: "Run the restored command after every mutant in that mutation's reset root and require green-red-green proof for each artifact."
  - risk: "Do not reintroduce the generated-state leak from a mutable worker root."
    instead: "Replace the entire group root from an immutable post-baseline checkpoint before each mutation and prove non-target generated state cannot cross artifacts."
  - risk: "Do not force multi-command or unsafe declarations through grouping to improve benchmark counts."
    instead: "Keep the existing isolated per-declaration lifecycle as the explicit fallback whenever the grouping proof is incomplete."
