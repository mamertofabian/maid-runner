schema: '2'
goal: Make plan revise --stash-implementation usable in real multi-manifest sessions by adding audited sibling-dirty tolerance, reliable untracked files.create stashing, staged-path recovery guidance, and a specific dependency-lockfile limitation error, and close the 2026-07-18 review follow-ups so plain revise preserves test-only-green evidence, contract hashing accepts YAML-typed manifest values, and plan status reports unreadable manifests instead of crashing
type: fix
created: '2026-07-18T05:39:57Z'
metadata:
  epic: manifests/drafts/085-00-plan-lock-ceremony-reduction.epic.yaml
  bug_reports: |
    ~/.maid/bug-report/20260715-035754-manatal-coop-site-stash-implementation-bookkeeping.md
    ~/.maid/bug-report/20260714-083456-life-dashboard-stash-untracked-create.md
    ~/.maid/bug-report/20260715-175500-erindelle-dependency-stash-red-evidence.md
  tags:
  - plan-lock
  - red-phase
  - stash-implementation
  - test-only-green
  - contract-hash
  - workflow-hardening
  - cli
  review_findings: |
    2026-07-18 post-implementation review of the landed 085-01..04 children
    (release/v2.next commits 2a2540e, 147fdff, 829520e, be3d7bb). All three
    follow-ups below were reproduced empirically on this tree before being
    folded into this draft.
  priority: medium
description: |
  `_cmd_plan_revise_with_stashed_implementation`
  (maid_runner/cli/commands/plan.py) is the sanctioned recovery tool for
  recapturing red evidence after review-driven changes, but three failure
  modes from the July bug-report cluster make it unusable exactly when it
  is needed most:

  1. SIBLING-DIRTY REFUSAL (20260715-035754): the unrelated-dirty-path
     guard refuses when ANY dirty path exists repo-wide. In a legitimate
     multi-manifest session, dozens of dirty paths belong to sibling
     manifests' own contracted scope; declaring them under this manifest's
     files.read would misrepresent scope, and committing sibling work
     first splits one reviewed change into artificial commits. The
     targeted `git stash push -- <pathspec>` never touches those paths.
  2. UNTRACKED files.create FAILURE (20260714-083456): for a promoted
     manifest whose files.create implementation exists but is not yet
     committed (the normal pre-first-commit state), the flow fails to
     produce red evidence; intent-to-add breaks `git stash` outright, and
     the staged-path refusal gives no recovery instruction.
  3. DEPENDENCY LOCKFILE LIMITATION (20260715-175500): when the declared
     implementation is a dependency upgrade (package.json + lockfile), the
     stash restores the file contents but node_modules stays at the new
     version, capture stays green, and the generic "did not capture valid
     red evidence" error hides the real cause.

  The 2026-07-18 post-implementation review of 085-01..04 added three
  follow-up failure modes on the same revise/status ceremony surface, each
  reproduced empirically before drafting:

  4. TEST-ONLY-GREEN DOWNGRADE: a plain contract-preserving `maid plan
     revise` on a test-only lock strips the `mode: test_only_green` marker
     recorded by 085-04 — the 085-02 auto-preserve rule requires
     `red: true`, and `--preserve-red-evidence` refuses green payloads
     ("requires existing valid red evidence") — so one bookkeeping revise
     silently degrades a verify-passing lock into an E705 dead-end until
     the agent remembers to re-run with --test-only-green. This recreates,
     for test-only locks, exactly the revision class this epic removes.
  5. CONTRACT-HASH TYPE CRASH: compute_manifest_contract_hash (085-03)
     fails with "Object of type date is not JSON serializable" for
     schema-valid manifests whose free-form metadata carries YAML-typed
     scalars (unquoted dates/datetimes parse to date/datetime objects),
     making such manifests impossible to plan-lock at all — a real risk
     for brownfield repos where unquoted dates are common.
  6. STATUS PARSE-ERROR REPORTING: `maid plan status` on a manifest that
     no longer parses exits 2 through the generic top-level CLI handler
     with a raw YAML error instead of a structured mismatch report; in
     --json mode automation gets {"error": ...} instead of a status
     payload with manifest_match.

  Pinned decisions (do not redesign):

  1. Sibling-dirty tolerance is opt-in behind a new flag,
     `--allow-sibling-dirty`. Without it, today's repo-wide refusal is
     byte-for-byte unchanged except the error text additionally names the
     flag. With it:
     a. dirty paths that intersect the revised manifest's OWN surface
        (declared writable paths, files.read, behavioral test files, the
        manifest, the lock) keep exactly today's handling — target,
        tolerate, or refuse per the existing 076-01/082-03 rules;
     b. dirty paths outside that surface are tolerated WITHOUT being
        stashed, and their full sorted list is recorded inside the
        captured evidence payload under `sibling_dirty_paths` plus echoed
        on stdout, so implementation review and `maid evaluate` can audit
        what else was in the tree during capture. Silent tolerance is
        forbidden.
     c. No "plausible impact" analysis of any kind: the boundary is the
        exact declared-path set. Per the epic and AGENTS.md validator
        constraints, we accept the documented limit that a sibling dirty
        path COULD influence capture through undeclared coupling — which
        is precisely why the audit trail, not a heuristic, is the control.
  2. Untracked declared files.create paths are first-class stash targets:
     pin with characterization tests that an untracked declared create is
     hidden during capture and restored byte-identical afterwards (the
     stash push already passes --include-untracked with pathspecs; the
     tests must reproduce the reported failure and drive whatever fix the
     red phase reveals — including the intent-to-add state, which must
     either work or be refused with a clear instruction to
     `git reset -- <path>` first, never a raw git "Cannot merge" error).
  3. The staged-path refusal keeps refusing (staged state is a deliberate
     user action) but the error must name the exact recovery command
     (`git restore --staged <paths>`) and the paths to run it on.
  4. Dependency-lockfile limitation gets a specific error: when capture
     completes without valid red evidence AND the stashed target set
     includes a recognized dependency lockfile (exact basenames:
     package.json, package-lock.json, bun.lock, yarn.lock, pnpm-lock.yaml,
     uv.lock, poetry.lock, Cargo.lock, go.sum), the failure message must
     explain that materialized dependency state (node_modules, .venv,
     vendor) is not stashed, and point to the documented alternatives
     (temporarily install the prior dependency state and use plain revise,
     or record a reasoned legacy baseline). No attempt to stash or rebuild
     dependency trees — that is out of scope by design.
  5. All existing refusals and integrity checks stay: stash identity
     restore/drop, contract-file hash guard around capture, test files
     never stashed, scope-only manifest rules, --no-run/--preserve
     exclusions. 085-04 owns the test-only refusal text change; this
     manifest must not conflict with it (coordinate the shared function
     edit at implementation time — 085-04 lands first).
  6. TEST-ONLY-GREEN PRESERVATION: revision_preserves_red_evidence
     additionally accepts a valid test_only_green payload under the SAME
     three-part 085-02 rule — empty contract delta, locked behavioral
     test bytes unchanged with no newly discovered test files, payload
     internally valid (red: false, mode: test_only_green, every command
     classification not_red with exit 0) — PLUS a revise-time re-check
     that every current writable path still classifies as a test file via
     is_test_file. The re-check exists because classifier changes (085-01
     is live precedent) can reclassify paths between captures; fail
     closed and recapture rather than preserve a payload enforcement
     would reject. The function keeps its name and signature (the lock
     field is red_evidence regardless of mode); the stdout preservation
     notice must name which evidence class was carried forward.
     --preserve-red-evidence likewise accepts a valid test_only_green
     payload instead of refusing — verify accepts the class, so the flag
     refusing it recreates the dead-end. E701/E705/E707 semantics and
     _red_evidence_is_valid are untouched.
  7. CONTRACT-HASH SCALAR NORMALIZATION: compute_manifest_contract_hash
     normalizes exactly two YAML-native cases before JSON
     canonicalization — datetime.date/datetime.datetime values become
     their isoformat() string, and non-string mapping keys become their
     normalized string form. Any other non-JSON-native value raises
     ValueError naming the manifest path and offending location (fail
     loud; still no byte-hash fallback, preserving the 085-03
     temptation). Normalization is identity for every manifest that can
     lock today, so existing sha256-contract hashes are unchanged, and
     manifests with YAML dates could never lock, so no legacy hashes
     exist to migrate. Pinned property: an unquoted YAML date and the
     equivalent quoted ISO string produce the same digest, so quoting the
     value later does not flip TAMPERED.
  8. STATUS REPORTS UNREADABLE MANIFESTS: cmd_plan_status treats a
     manifest that cannot be parsed or hashed as a mismatch, not a crash:
     manifest_match false, a manifest_error field carrying the parse
     detail in the JSON payload (text mode prints one equivalent line),
     and the existing mismatch exit code 1. Only status changes — plan
     lock and revise keep raising loudly at creation time, because
     refusing to create evidence from an unreadable manifest is correct
     fail-closed behavior while status's job is to report state.

  Sequencing: fifth child of epic 085, after 085-04.

  Planning notes (Planning Handoff Mode): behavioral tests are declared
  below but not yet written; all new coverage goes in the dedicated
  tests/cli/test_stash_revise_session_robustness.py,
  tests/cli/test_plan_session_robustness.py, and
  tests/core/test_contract_hash_normalization.py modules because the
  existing stash-revise, plan-cmd, auto-preserve, test-only-green, and
  contract-hash test files are hashed by the 076-01,
  fix-stash-revise-scope-targets, 082-03, and 085-02..04 plan locks. The
  implementing agent confirms the red phase, runs behavioral validation,
  plan-locks, and promotes before implementation.

  Open question for plan review: whether `sibling_dirty_paths` should also
  appear in `maid plan status` output for locks whose evidence carries it
  (recommended: yes, one summary line — cheap visibility, no schema
  change beyond the evidence payload key added here).
temptations:
- risk: Do not make sibling-dirty tolerance the default, drop the repo-wide refusal without the flag, decide which sibling paths could affect validation via imports/globs/static analysis, or widen the stash to tolerated sibling paths 'just in case' (the 082-03 anti-pattern in reverse).
  instead: Keep the fail-closed default; gate tolerance behind --allow-sibling-dirty using the exact declared-path boundary, stash only the manifest's own declared targets exactly as today, and record every tolerated path in the evidence payload and stdout — the audit trail, not a heuristic, is the control.
- risk: Do not paper over the untracked-create failure by skipping red validation when the file is untracked.
  instead: Reproduce the reported failure in a characterization test first, then fix the stash/restore path so capture genuinely runs without the created file present.
- risk: Do not detect dependency lockfiles by fuzzy matching or by parsing package manager state.
  instead: Match the exact basename list pinned in this manifest and only to select the error message; capture logic is unchanged.
- risk: Do not preserve a test_only_green payload on the empty contract delta alone — skipping the revise-time writable-path re-check preserves evidence enforcement will reject after a classifier change.
  instead: Apply the full pinned rule 6 including the is_test_file re-check; when any part fails, fall through to recapture and let --test-only-green stay the sanctioned refresh path.
- risk: Do not fix the contract-hash crash with json.dumps(default=str), which silently coerces every unknown type, and do not implement the plan-status unreadable state by wrapping the whole command in a broad try/except.
  instead: Normalize exactly date/datetime values and non-string mapping keys per pinned rule 7, raising a ValueError naming the manifest for anything else; in cmd_plan_status catch only the parse/normalization failure around the manifest_hash_matches call per pinned rule 8, populate manifest_error, and leave every other failure to the existing handlers.
files:
  create:
  - path: tests/cli/test_stash_revise_session_robustness.py
    artifacts:
    - kind: test_function
      name: test_allow_sibling_dirty_tolerates_and_records_unrelated_paths
      source_scenario: Reproduction of the 20260715-035754 session — a locked manifest needing stash-backed revise while sibling manifests' contracted files are dirty elsewhere in the tree, run with --allow-sibling-dirty.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The revise succeeds, sibling paths are never stashed or modified, and the saved evidence payload lists every tolerated path under sibling_dirty_paths with the same list echoed on stdout.
    - kind: test_function
      name: test_default_refusal_unchanged_and_names_flag
      source_scenario: The same dirty session without the flag.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command refuses exactly as today and the error text names --allow-sibling-dirty and the files.read declaration alternative.
    - kind: test_function
      name: test_allow_sibling_dirty_still_refuses_own_surface_conflicts
      source_scenario: --allow-sibling-dirty with a dirty path that belongs to the revised manifest's own declared surface in a refusing state (e.g. staged).
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The existing own-surface refusal fires; the flag never loosens handling of the manifest's own paths.
    - kind: test_function
      name: test_untracked_files_create_is_stashed_and_restored
      source_scenario: Reproduction of 20260714-083456 — a promoted locked manifest whose files.create implementation exists untracked, with a tightened behavioral test needing fresh red evidence.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Capture runs with the untracked create absent (yielding genuine red), the file is restored byte-identical, and the lock records valid red evidence.
    - kind: test_function
      name: test_intent_to_add_state_is_handled_or_cleanly_refused
      source_scenario: The same scenario after git add -N on the created file.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Either the flow succeeds as with plain untracked state, or it refuses with an instruction naming git reset -- <path>; a raw git 'Cannot merge' error is a failure of this contract.
    - kind: test_function
      name: test_staged_refusal_names_recovery_command
      source_scenario: A declared implementation path staged in the index.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The refusal error names git restore --staged and lists the exact paths.
    - kind: test_function
      name: test_lockfile_only_green_capture_reports_dependency_limitation
      source_scenario: Reproduction of 20260715-175500 — declared writable paths are package.json and a lockfile, the dependency is installed at the new version, and capture stays green after stashing.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The failure message explains that materialized dependency state is not stashed and names the documented alternatives, instead of the generic no-valid-red-evidence error.
  - path: tests/cli/test_plan_session_robustness.py
    artifacts:
    - kind: test_function
      name: test_plain_revise_preserves_test_only_green_evidence
      source_scenario: Reproduction of review finding 4 — a test-only lock carrying valid test_only_green evidence undergoes a plain contract-preserving bookkeeping revise.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The saved lock still carries the full test_only_green payload including the mode marker, stdout names the preserved evidence class, and enforce_plan_locks with require_red_evidence reports no error for the lock.
    - kind: test_function
      name: test_plain_revise_recaptures_test_only_green_when_tests_change
      source_scenario: The same lock after the locked behavioral test bytes change.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The test_only_green payload is not preserved; the revise records fresh evidence per the plain flow, proving the preservation rule fails closed.
    - kind: test_function
      name: test_revision_preserves_test_only_green_predicate_bounds
      source_scenario: revision_preserves_red_evidence called directly with a test_only_green payload under an empty contract delta, and again with a payload whose commands include a non-zero exit.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: The predicate returns True only for the internally valid payload; a payload with any failing command returns False.
    - kind: test_function
      name: test_preserve_red_evidence_flag_accepts_test_only_green
      source_scenario: maid plan revise --preserve-red-evidence on a test-only lock whose evidence is valid test_only_green.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The revise succeeds and carries the payload forward verbatim instead of refusing with the valid-red-evidence error.
    - kind: test_function
      name: test_plan_status_reports_unreadable_manifest_as_mismatch
      source_scenario: Reproduction of review finding 6 — a locked manifest is corrupted into invalid YAML, then plan status runs in text and json modes.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_status
      expected:
        behavior: Exit code 1 with manifest_match false; the json payload carries a manifest_error string describing the parse failure and text mode prints an equivalent line, with no generic top-level Error fallback.
  - path: tests/core/test_contract_hash_normalization.py
    artifacts:
    - kind: test_function
      name: test_contract_hash_accepts_yaml_date_metadata
      source_scenario: Reproduction of review finding 5 — a schema-valid manifest whose metadata carries an unquoted YAML date.
      actions:
      - type: api_call
        subject:
          function: compute_manifest_contract_hash
      expected:
        behavior: A sha256-contract-prefixed digest is returned instead of raising a serialization error.
    - kind: test_function
      name: test_contract_hash_equates_yaml_date_and_quoted_string
      source_scenario: Two manifests identical except one writes the date unquoted and the other as the quoted ISO string.
      actions:
      - type: api_call
        subject:
          function: compute_manifest_contract_hash
      expected:
        behavior: Both produce the same digest, so quoting the value later does not flip the lock to TAMPERED.
    - kind: test_function
      name: test_contract_hash_normalizes_non_string_mapping_keys
      source_scenario: A manifest whose metadata mapping uses a non-string key alongside a variant using the equivalent quoted string key.
      actions:
      - type: api_call
        subject:
          function: compute_manifest_contract_hash
      expected:
        behavior: Hashing succeeds deterministically and both variants produce the same digest.
    - kind: test_function
      name: test_contract_hash_raises_named_error_for_unsupported_values
      source_scenario: A manifest carrying a YAML value outside the normalized set (for example a binary tag).
      actions:
      - type: api_call
        subject:
          function: compute_manifest_contract_hash
      expected:
        behavior: A ValueError naming the manifest path is raised; no digest and no byte-hash fallback is produced.
  edit:
  - path: maid_runner/cli/commands/plan.py
    artifacts:
    - kind: function
      name: cmd_plan_revise
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: Stash-backed revise gains --allow-sibling-dirty with audited tolerance outside the manifest's own declared surface, reliable untracked files.create stashing with intent-to-add handling, a staged-path refusal that names git restore --staged, and the dependency-lockfile limitation error; plain revise additionally preserves valid test_only_green evidence under pinned rule 6 and --preserve-red-evidence accepts that payload class; every existing integrity check, refusal, and restore guarantee is preserved.
    - kind: function
      name: cmd_plan_status
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: Treats a manifest that cannot be parsed or hashed as a structured mismatch per pinned rule 8 — manifest_match false plus a manifest_error detail field with mismatch exit code 1 — instead of surfacing a raw exception through the generic CLI handler; all other status behavior is unchanged.
  - path: maid_runner/core/plan_lock.py
    artifacts:
    - kind: function
      name: revision_preserves_red_evidence
      args:
      - name: existing
        type: PlanLock
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: prior_contract
        type: dict | None
      returns: bool
      description: Intentional evolution of the 085-02 contract — additionally returns True for an internally valid test_only_green payload under the same empty-delta and unchanged-test-bytes rule plus the revise-time is_test_file writable-path re-check pinned in rule 6; name, signature, and all red-evidence acceptance behavior are unchanged.
    - kind: function
      name: compute_manifest_contract_hash
      args:
      - name: manifest_path
        type: Path
      returns: str
      description: Intentional evolution of the 085-03 contract — normalizes date/datetime values to isoformat strings and non-string mapping keys to their normalized string form before JSON canonicalization per pinned rule 7, raising ValueError naming the manifest for any other non-JSON-native value; prefix, exclusion boundary, and existing hashes are unchanged.
  scope:
  - path: maid_runner/cli/commands/_main.py
    reason: Register the --allow-sibling-dirty flag on the plan revise subparser.
  - path: docs/maid_specs.md
    reason: Document sibling-dirty tolerance semantics, the audit-trail control, the untracked-create behavior, the dependency-lockfile limitation with its alternatives, test-only-green preservation on contract-preserving revise, contract-hash scalar normalization with its ValueError bound, and the plan-status manifest_error state.
  - path: maid_runner/docs/maid_specs.md
    reason: Keep the packaged spec copy in sync.
  read:
  - maid_runner/core/_file_discovery.py
  - manifests/076-01-add-stash-backed-plan-revise.manifest.yaml
  - manifests/082-03-stash-revise-files-read-wiring-paths.manifest.yaml
  - manifests/085-02-preserve-red-evidence-on-contract-preserving-revisions.manifest.yaml
  - manifests/085-03-contract-scoped-plan-lock-manifest-hash.manifest.yaml
  - manifests/085-04-test-only-green-red-evidence-mode.manifest.yaml
validate:
- uv run python -m pytest tests/cli/test_stash_revise_session_robustness.py -v
- uv run python -m pytest tests/cli/test_plan_session_robustness.py -v
- uv run python -m pytest tests/core/test_contract_hash_normalization.py -v
- uv run maid validate manifests/085-05-stash-implementation-session-robustness.manifest.yaml --mode behavioral --quiet
- uv run maid validate manifests/085-05-stash-implementation-session-robustness.manifest.yaml --mode schema --quiet
