  rationale: "Real multi-manifest sessions need targeted recovery without misdeclaring sibling work, but every relaxation must remain exact, opt-in, and reviewable. The implementation separates declared-surface conflicts from sibling paths, records tolerated siblings in evidence, keeps dependency trees out of scope, and extends preservation/hashing/status only under the manifest's pinned fail-closed bounds."
