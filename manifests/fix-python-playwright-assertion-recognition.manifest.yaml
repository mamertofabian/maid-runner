# manifest-kind: draft
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Recognize direct Python Playwright expect assertion chains without suppressing E210 for ordinary calls
type: fix
created: '2026-09-30T02:41:25Z'
metadata:
  priority: high
  tags:
  - python
  - playwright
  - assertion-checking
  - e210
description: |-
  Resolve report 20260928-152652-python-playwright-assertions.
  The Python E210 heuristic accepts assert statements, raises calls and
  assert-prefixed calls, but omits Playwright expect(locator).to_be_visible().
  Add a deliberately narrow syntax rule: a called attribute must be a documented
  Playwright Python 1.58 matcher or its not_to_ counterpart, directly on an
  expect(...) call with an actual positional argument or actual keyword.
  Recognize sync/awaited calls and calls inside pytest test classes. Preserve
  existing assertion forms, fixture handling, diagnostics and non-Python behavior.
  Reject bare expect calls, matcher attribute access without invocation, unknown
  matchers, unrelated receivers, extra receiver-chain properties and empty or
  message-only expect calls. Do not count method names alone as assertions.
  The matcher vocabulary is grounded in microsoft/playwright-python v1.58.0
  playwright/sync_api/_generated.py (PageAssertions, LocatorAssertions and
  APIResponseAssertions), fetched read-only during planning. No runtime Playwright
  dependency or browser service is needed for this source-inspection rule.
  Rationale: match the reported direct API pattern without building a custom
  import-binding, control-flow, alias or reachability analyzer. This is syntactic
  assertion recognition, consistent with existing E210 heuristics, not proof of
  execution or import provenance; runtime tests and deep evidence gates remain
  unchanged. Imported aliases, module-qualified expect and assertions stored in
  variables are outside this narrow addition and remain subject to existing rules.
  Public helper signatures stay unchanged. A dedicated behavioral module avoids
  rewriting test files hashed by historical plan locks.
temptations:
- risk: Accept every to_ method or every expect call as an assertion.
  instead: Require a called known matcher directly rooted at expect with an actual argument, and keep false-positive rejection cases.
- risk: Build custom Python import-binding or control-flow interpretation to recognize the reported API.
  instead: Use the existing AST service for the documented bounded chain shape; state its syntactic limits and retain runtime evidence gates.
- risk: Add placeholder asserts to consumer browser tests or weaken E210 severity.
  instead: Fix source recognition and prove valid chains produce no E210 while ordinary calls still carry the original diagnostic and location.
