    - kind: test_function
      name: test_python_playwright_matcher_calls_are_recognized
      description: Recognize direct sync expect(subject) calls terminating in documented Playwright 1.58 matchers and their Python not_to_ forms.
    - kind: test_function
      name: test_async_python_playwright_assertions_are_recognized
      description: Recognize awaited matcher calls, custom messages, actual keyword arguments, and negated async assertions.
    - kind: test_function
      name: test_nonasserting_python_calls_still_report_e210
      description: Bare expect, unknown matchers, unrelated receivers, attribute access, strings, missing actuals, and indirect receiver chains remain assertion-free.
    - kind: test_function
      name: test_python_playwright_recognition_preserves_per_test_diagnostics
      description: Test-class matcher calls count while the separate click-only test retains exact E210 function and location diagnostics.
    - kind: test_function
      name: test_existing_python_assertion_forms_remain_recognized
      description: Existing assert statements, assert-named helpers, assertion methods, and pytest.raises remain accepted.
