schema: '2'
goal: Add `maid evaluate compare` — deterministic cross-run aggregation of RunEvaluations grouped by agent provenance (provider/model/client), reporting per-dimension counts with run counts always visible and explicit unknown-agent grouping, with no composite scores, ranking, or verdicts
type: feature
created: '2026-07-06T08:47:32Z'
metadata:
  epic: 084-00-after-action-run-evaluation
  tags:
  - run-evaluation
  - agent-provenance
  - outcome-records
  - cli
  priority: medium
description: |
  Second consumer: answers "how do my agent setups differ in this repo?"
  from accumulated run evidence. Depends on 084-01 (index provenance) and
  084-04 (evaluate_run, RunEvaluation, evaluate CLI group).

  Pinned decisions (do not redesign):

  1. Aggregation is a pure function over evaluations — policy separated
     from mechanism. maid_runner/core/run_evaluation.py gains
     `RunComparisonRow` (frozen: `provider: Optional[str]`,
     `model: Optional[str]`, `client: Optional[str]`, `runs: int`,
     `outcomes_completed: int`, `outcomes_other: int`,
     `revisions_narrowing_total: int`,
     `revisions_unclassified_total: int`, `red_evidence_valid: int`,
     `incidents_total: int`) and
     `compare_runs(evaluations) -> tuple[RunComparisonRow, ...]`.
     Grouping key is (provider, model, client); runs without provenance
     group under the explicit (None, None, None) row rendered as
     "(unknown agent)" — anonymity is a visible bucket, never dropped.
     Rows sort deterministically by runs desc, then model asc.

  2. Honest small-N: `runs` is always the first rendered column, there
     are no percentages, averages, scores, or rankings — raw counts
     only. Interpreting three runs as a trend is the reader's mistake to
     make, not the tool's suggestion.

  3. CLI: `maid evaluate compare [--manifest-dir] [--project-root]
     [--json]` in maid_runner/cli/commands/evaluate.py. It evaluates
     every manifest in the manifest dir that has a plan lock or an
     outcome section (runs with neither leave no evidence and are
     skipped with a visible skipped-count line, not silently) and
     renders compare_runs output as an aligned text table or JSON from
     the same structured rows. Advisory: exit 0 with results, nonzero
     only for input errors (missing manifest dir). Per-manifest
     evaluation errors (unparseable manifest) are reported to stderr
     with the path and counted as skipped — fail loud per item without
     aborting the sweep.

  4. This child does NOT read .maid/outcomes.json: it evaluates live
     manifests directly via evaluate_run so results never depend on
     index freshness. The 084-01 index provenance remains available for
     future recall/insights consumers.

  Planned behavioral tests (red phase pending — handoff stops before
  tests): tests/core/test_run_comparison.py exercises compare_runs
  directly: two provenances group into two rows with correct per-row
  counts; anonymous evaluations land in the (None, None, None) row;
  deterministic ordering by runs desc then model asc; empty input yields
  an empty tuple. tests/cli/test_evaluate_compare_cmd.py builds a temp
  manifest dir with provenance-bearing and anonymous completed runs plus
  one evidence-free manifest and asserts: the table groups by agent with
  runs as the first column and an "(unknown agent)" row; the
  evidence-free manifest is reported in a skipped count, not silently
  dropped; --json rows match the text table; an unparseable manifest is
  reported to stderr with its path while remaining rows still render and
  exit stays 0; a missing manifest dir exits nonzero with the path in
  the error.
temptations:
- risk: Do not add scores, percentages, averages, or rank ordering to make the comparison look decisive.
  instead: Raw counts only with runs always visible first; ordering is runs desc then model asc as a deterministic layout choice, not a ranking claim.
- risk: Do not drop anonymous or evidence-free runs silently, biasing the comparison toward instrumented agents.
  instead: Anonymous runs get the explicit (unknown agent) row; evidence-free manifests are counted and reported as skipped.
- risk: Do not abort the whole sweep on one unparseable manifest, and do not swallow it either.
  instead: Report each failed item to stderr with its path, count it as skipped, and continue.
- risk: Do not read the outcomes index and inherit its staleness semantics.
  instead: Evaluate live manifests via evaluate_run; index consumers stay out of scope.
