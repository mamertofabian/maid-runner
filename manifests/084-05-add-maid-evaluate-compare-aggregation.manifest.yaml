  summary: Added deterministic `maid evaluate compare` aggregation over live RunEvaluations with an explicit unknown-agent bucket, raw count rows, visible skipped counts, JSON/text rendering from shared structured rows, and robust project-root/manifest-dir resolution.
  rationale: "The implementation keeps comparison advisory and deterministic: compare_runs is pure policy over RunEvaluation values, the CLI sweeps live manifests through evaluate_run instead of reading the Outcome index, anonymous runs remain visible as an unknown-agent row, and evidence-free or malformed manifests are counted as skipped instead of silently disappearing or aborting the whole sweep."
  completed_at: "2026-07-06T00:00:00Z"
