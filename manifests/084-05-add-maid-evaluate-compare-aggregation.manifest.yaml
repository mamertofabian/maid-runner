  - path: maid_runner/core/run_evaluation.py
    artifacts:
    - kind: class
      name: RunComparisonRow
      description: 'Frozen dataclass: per-agent-group aggregate counts over RunEvaluations; the (None, None, None) group is the explicit unknown-agent bucket.'
    - kind: attribute
      name: provider
      of: RunComparisonRow
      type: Optional[str]
      description: Group provider; None in the unknown-agent row.
    - kind: attribute
      name: model
      of: RunComparisonRow
      type: Optional[str]
      description: Group model; None in the unknown-agent row.
    - kind: attribute
      name: client
      of: RunComparisonRow
      type: Optional[str]
      description: Group client; None in the unknown-agent row.
    - kind: attribute
      name: runs
      of: RunComparisonRow
      type: int
      description: Run count for the group; always the first rendered column.
    - kind: attribute
      name: outcomes_completed
      of: RunComparisonRow
      type: int
      description: Runs whose outcome status is completed.
    - kind: attribute
      name: outcomes_other
      of: RunComparisonRow
      type: int
      description: Runs with a non-completed or missing outcome status.
    - kind: attribute
      name: revisions_narrowing_total
      of: RunComparisonRow
      type: int
      description: Sum of narrowing revisions across the group's runs.
    - kind: attribute
      name: revisions_unclassified_total
      of: RunComparisonRow
      type: int
      description: Sum of unclassified revisions across the group's runs.
    - kind: attribute
      name: red_evidence_valid
      of: RunComparisonRow
      type: int
      description: Runs whose red_evidence_status is valid.
    - kind: attribute
      name: incidents_total
      of: RunComparisonRow
      type: int
      description: Sum of incidents across the group's runs.
    - kind: function
      name: compare_runs
      args:
      - name: evaluations
        type: Sequence[RunEvaluation]
      returns: tuple[RunComparisonRow, ...]
      description: Pure aggregation grouped by (provider, model, client) including the explicit unknown bucket; deterministic order runs desc then model asc; empty input yields empty tuple.
  - path: maid_runner/cli/commands/evaluate.py
    artifacts:
    - kind: function
      name: cmd_evaluate
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: compare subcommand sweeps the manifest dir, evaluates evidence-bearing manifests via evaluate_run, reports per-item failures to stderr with paths and a visible skipped count, renders text table and --json from the same rows, exits 0 except for input errors.
  - path: maid_runner/cli/commands/_main.py
    artifacts:
    - kind: function
      name: build_parser
      args: []
      returns: argparse.ArgumentParser
      description: evaluate command group gains a compare subcommand with --manifest-dir, --project-root, --json.
