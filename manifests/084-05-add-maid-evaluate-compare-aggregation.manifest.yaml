    - kind: test_function
      name: test_evaluate_compare_relative_project_root_does_not_double_prefix_manifest_paths
      args: []
      returns: None
      description: A relative --project-root does not double-prefix discovered manifest paths before evaluate_run.
    - kind: test_function
      name: test_evaluate_compare_continues_past_unparseable_manifest_loudly
      args: []
      returns: None
      description: An unparseable manifest is reported to stderr with its path and counted skipped while remaining rows render and exit stays 0.
    - kind: test_function
      name: test_evaluate_compare_missing_manifest_dir_fails_loud
      args: []
      returns: None
      description: A nonexistent manifest dir exits nonzero naming the path.
