# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Preserve parameter names and bare identifier default expressions in TypeScript
type: fix
created: '2026-10-20T20:42:11Z'
description: Separate TypeScript parameter binding identity from its default expression in the existing
  tree-sitter extractor. Once = is seen, consume the following expression as default before considering
  identifier/pattern binding branches. Preserve the exact initializer source, declared type and parameter
  name for typed/inferred functions, arrows, methods and constructor parameter properties. Keep existing
  optional/destructured/rest/literal/expression behavior and public signatures. Verify both public collectors,
  implementation validation and snapshot save/load plus a negative where initializer W cannot satisfy
  parameter windowMs. No default-expression evaluation, type inference extension, schema change or broader
  comparison-policy change. Both inventory and hardened-scope recall found no related records. Apply existing
  exact-identity and producer-only regression discipline; no advisory lesson requires broader scope.
temptations:
- risk: Fix only a named-function special case or accept the initializer as a second binding name.
  instead: Repair the shared parameter extractor and exercise functions/arrows/methods and constructor-property
    identity, including wrong-name rejection.
- risk: Evaluate defaults or broaden type inference/default comparison while repairing collection.
  instead: Keep exact source expression strings with literal/expression and optional/destructured/rest
    compatibility controls; use existing snapshot/validation APIs.
