          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "The reported deno test command covers its explicitly declared TypeScript behavioral test without E230."
        - kind: test_function
          name: test_run_manifest_tests_executes_explicit_deno_test_command
          args:
            - {name: tmp_path, type: Path}
            - {name: monkeypatch, type: MonkeyPatch}
          returns: None
          description: "maid test executes the accepted Deno command and reports one passing command."
        - kind: test_function
          name: test_command_integrity_rejects_non_test_deno_subcommand
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "A Deno subcommand other than test does not satisfy behavioral test command integrity."
        - kind: test_function
          name: test_command_integrity_rejects_non_executing_deno_test_mode
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "A Deno test help invocation cannot prove that the behavioral test executed."
        - kind: test_function
          name: test_command_integrity_rejects_filtered_deno_test_run
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "A filtered Deno test invocation cannot prove whole-file behavioral coverage."
        - kind: test_function
          name: test_command_integrity_rejects_deno_no_run_mode
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "Deno's --no-run cache-only mode cannot prove that the behavioral test executed."
        - kind: test_function
          name: test_command_integrity_ignores_deno_script_argument_test_paths
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "A declared test path after Deno's -- separator is a script argument and cannot satisfy behavioral coverage."
        - kind: test_function
          name: test_command_integrity_rejects_deno_option_value_test_path
          args:
            - {name: tmp_path, type: Path}
          returns: None
          description: "A declared test path used only as --junit-path output cannot satisfy behavioral coverage."
  read:
