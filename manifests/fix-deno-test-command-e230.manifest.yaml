# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Recognize explicit Deno test commands as behavioral test runners"
type: fix
created: "2026-09-10T02:41:02Z"
metadata:
  bug_report: ~/.maid/bug-report/20260910-014300-hubb-ops-deno-test-classification.md
  priority: high
  tags: [deno, test-runner, command-integrity, e230, hubb-ops]
description: |
  Fix the E230 false positive reported by HUBB Ops when a manifest declares an
  explicit `deno test ... <test-file>` command. Recognize only Deno's `test`
  subcommand as an executing test runner and scan only its post-subcommand
  arguments for concrete behavioral test paths.

  This is an additive private-scope evolution of the existing test-runner
  invocation contract. Public validation and test-runner signatures remain
  unchanged. Existing selector and non-executing-mode guards continue to apply,
  Deno script arguments after `--` never count as test targets, and supported
  option values cannot masquerade as executed test paths. Unrecognized Deno
  options remain fail-closed for target coverage.
temptations:
  - risk: "Do not classify every deno command as a test runner just because the executable is named deno."
    instead: "Require the exact `deno test` subcommand and prove another Deno subcommand remains E230-blocked."
  - risk: "Do not bypass E230 merely because a manifest mentions a .test.ts path."
    instead: "Feed only post-subcommand Deno arguments through the existing concrete-path coverage checks."
  - risk: "Do not special-case the HUBB Ops repository or weaken selector/non-executing guards."
    instead: "Extend the shared invocation seam with bounded Deno syntax and reuse the existing fail-closed command-integrity pipeline."
  - risk: "Do not treat every non-flag Deno argument as an input test path."
    instead: "Stop target scanning at `--`, skip explicitly supported option values, and reject unknown option syntax rather than guessing whether its next token is a path."
files:
