# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Preserve safe Git author behavior and deterministic overlap proof inside isolated verification snapshots
type: fix
created: "2026-08-12T14:55:16Z"
metadata:
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - snapshot-isolation
    - git
    - test-determinism
  priority: high
description: |
  Close two prerequisites exposed by the complete 121-15 isolated fallback
  inventory. Snapshot commands currently discard all global Git configuration,
  which correctly blocks aliases, hooks, credential helpers, and other ambient
  behavior but also removes the resolved author name and email required by
  ordinary commit-based tests. Resolve only `user.name` and `user.email` from
  the source execution environment, write those two scalar values into a
  snapshot-local config under the copied Git metadata, and keep system config
  disabled. Never copy the source global config or any alias, credential,
  include, signing, hook, pager, or process-bearing setting.

  Replace the bounded-worker overlap test's scheduler-sensitive 20ms timing
  assumption with a two-party synchronization barrier. A genuinely serial
  implementation must still fail when the barrier times out; a parallel
  implementation proves both workers were active concurrently without relying
  on host load. This is an additive compatibility evolution of 121-13 and a
  shared-test hardening for 121-14, so neither manifest is superseded.
temptations:
  - risk: Copy the user's complete global Git configuration into snapshots.
    instead: Resolve and materialize only user.name and user.email in a snapshot-local config; retain the existing system/global isolation for every other key.
  - risk: Set a hard-coded fake Git identity for all snapshot commands.
    instead: Preserve the source command's resolved non-secret author identity so isolated and legacy execution agree.
  - risk: Make the overlap sleep longer until the loaded suite happens to pass.
    instead: Use a bounded barrier that deterministically distinguishes parallel from serial execution.
files:
  scope:
    - path: maid_runner/core/_knockout_snapshot.py
      reason: Resolve available Git author identity values independently and wire a snapshot-local two-key config without exposing a new public API.
  edit:
    - path: tests/core/test_knockout_snapshot.py
      artifacts:
        - kind: test_function
          name: test_snapshot_preserves_only_resolved_git_author_identity
          args:
            - name: tmp_path
              type: Path
            - name: monkeypatch
              type: pytest.MonkeyPatch
    - path: tests/core/test_knockout_workers.py
      artifacts:
        - kind: test_function
          name: test_independent_mutations_overlap_without_shared_snapshot_state
          args:
            - name: tmp_path
  read:
    - manifests/121-13-isolate-knockouts-in-project-snapshots.manifest.yaml
    - manifests/121-14-run-isolated-knockouts-with-bounded-workers.manifest.yaml
    - manifests/121-15-parallelize-isolated-artifact-coverage-fallbacks.manifest.yaml
    - maid_runner/core/_knockout_worker.py
validate:
  - uv run python -m pytest -q tests/core/test_knockout_snapshot.py tests/core/test_knockout_workers.py
  - uv run maid validate manifests/121-18-preserve-safe-snapshot-test-prerequisites.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-12T15:07:31Z"
  summary: "Preserved resolved Git author behavior inside repository snapshots without copying ambient configuration, and made bounded-worker overlap proof deterministic under load."
  rationale: "Exact fallback snapshots must reproduce legitimate commit behavior while continuing to isolate aliases, credentials, includes, hooks, signing, and other ambient Git policy. Non-repository snapshots retain their prior no-extra-file behavior, and a synchronization barrier now proves actual worker overlap without relying on scheduler timing."
  lessons:
    - lesson_type: security
      summary: "Environment equivalence should materialize the smallest resolved scalar capability needed by tests rather than copying a complete user configuration file."
      tags:
        - git
        - snapshot-isolation
        - least-privilege
      paths:
        - maid_runner/core/_knockout_snapshot.py
        - tests/core/test_knockout_snapshot.py
    - lesson_type: test-design
      summary: "Concurrency contracts need synchronization primitives; sleep windows become false failures under the exact loaded verification environment they are intended to validate."
      tags:
        - concurrency
        - determinism
        - performance
      paths:
        - tests/core/test_knockout_workers.py
  review_notes:
    - source: review_121_18_implementation
      severity: ready
      summary: "Independent review found and then verified the fix for a non-Git snapshot root-file regression; final re-review returned Ready with all dependent locks current."
  validation:
    - command:
        - uv
        - run
        - python
        - -m
        - pytest
        - -q
        - tests/core/test_knockout_snapshot.py
        - tests/core/test_knockout_workers.py
      status: passed
      summary: "Declared snapshot and worker scope passed: 26 tests in 48.92 seconds."
    - command:
        - uv
        - run
        - python
        - snapshot-git-template-probe
      status: passed
      summary: "The previously failing 121-05 Git-template selector passed all 54 tests inside MaterializedProjectSnapshotBackend with no errors or material writes."
    - command:
        - uv
        - run
        - maid
        - validate
        - manifests/121-18-preserve-safe-snapshot-test-prerequisites.manifest.yaml
