schema: '2'
goal: Treat Protocol interface-only members as inapplicable to runtime body coverage
type: fix
created: '2026-10-20T18:32:24Z'
description: 'Treat only signature-only members of producer-proven known typing/typing_extensions Protocol
  classes as runtime-inapplicable. Reuse the existing Python collector import/binding policy and explicit
  source-position proof for both classes and members, including Protocol properties; ordinary property
  metadata is not proof. Preserve concrete defaults, fake/rebound Protocol names, ordinary empty/data
  classes, concrete adapters, ABC behavior and unsupported-instrumentation diagnostics. No new static
  analyzer, public schema or public signature. Share authoritative source identity between runtime applicability
  and knockout mutation selection: same-name redefinitions select the effective last direct definition,
  and real concrete mutations must be detected and restored. Apply through direct/batch and exact/derived
  coverage evidence plus public knockout planning/execution. Empty/attribute-only classes preserve existing
  non-body policy. Getter probes explicitly target callable bodies as METHOD; ordinary ATTRIBUTE exclusion
  remains unchanged. Removed methods must not survive a later same-name class definition as interface
  proof. Preserve knockout direct-definition scope: nested same-name classes must not displace direct
  targets. Coverage replacement clearing is scoped to direct class identity; nested same-short-name classes
  must not erase or displace direct targets, while nested-only indexing stays compatible.'
temptations:
- risk: Infer interfaces from a name, generic is_stub=False metadata, or missing method positions.
  instead: Reuse producer-proven class and signature member source positions; retain concrete and unknown
    targets.
- risk: Skip mutation with one identity but rewrite another same-name definition.
  instead: Use authoritative exact source identity consistently and execute both redefinition directions
    with restoration assertions.
- risk: Hide unsupported runner or concrete nonexecution failures.
  instead: Only exempt proven interface bodies before existing runtime policy; preserve observations and
    explicit failures.
