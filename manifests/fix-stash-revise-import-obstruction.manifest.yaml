      severity: P1-fixed
      summary: "Proved Git stash loses non-executable POSIX mode changes such as 0600; fixed by capturing modes before stashing and restoring them after every apply."
    - source: independent-reviewer-round-3
      severity: ready
      summary: "Found no blockers; recorded advisory gaps for ignored targets, non-empty-directory replacement recovery, and direct deleted/symlink tests."
