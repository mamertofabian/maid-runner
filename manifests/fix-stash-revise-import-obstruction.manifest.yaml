        - anti-gaming
        - maid-runner-feedback
      paths:
        - maid_runner/cli/commands/plan.py
        - maid_runner/core/plan_lock.py
        - tests/cli/test_plan_cmd_stash_import_obstruction.py
    - lesson_type: test-design
      summary: "Git-backed recovery tests must cover metadata Git does not preserve, such as full POSIX modes, and must prove user work survives validator mutation rather than checking only stash cleanup."
      tags:
        - git
        - recovery
        - behavioral-tests
        - maid-runner-feedback
      paths:
        - maid_runner/cli/commands/plan.py
        - tests/cli/test_plan_cmd_stash_import_obstruction.py
