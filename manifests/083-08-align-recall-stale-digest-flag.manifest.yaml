      args: []
      returns: None
      description: A stale digest on recall --theme-map is rejected with no waiver flags and the error names --allow-stale-digest as the narrow fix.
    - kind: test_function
      name: test_recall_allow_stale_digest_accepts_stale_theme_map
      args: []
      returns: None
      description: --allow-stale-digest accepts the stale digest and recall output carries the theme annotations, with match selection unchanged.
    - kind: test_function
      name: test_recall_allow_stale_index_keeps_backward_compatible_double_duty
      args: []
      returns: None
      description: Bare --allow-stale-index still waives digest staleness on recall as shipped in 083-03, pinning backward compatibility.
    - kind: test_function
      name: test_recall_allow_stale_digest_does_not_waive_index_staleness
      args: []
      returns: None
      description: A stale Outcome index with only --allow-stale-digest is still rejected with recall's index-stale error and exit conventions.
    - kind: test_function
      name: test_recall_stale_digest_flag_is_registered_unabbreviated
      args: []
      returns: None
      description: --allow-stale-digest is a registered option on the recall parser and abbreviation remains disabled.
    - kind: test_function
      name: test_instruction_payload_version_bumped_for_recall_docs_payload_change
      args: []
      returns: None
      description: INSTRUCTION_PAYLOAD_VERSION advanced past the pre-change baseline because maid init distributes the changed Outcome docs.
validate:
- uv run python -m pytest -q tests/cli/test_recall_stale_digest_flag_cmd.py tests/cli/test_recall_theme_map_cmd.py tests/test_manifest_outcome_docs.py tests/cli/test_init_instruction_payload_version.py
