      description: Date-stamped instruction payload version advanced past 2026.07.04.2 because the init-distributed Outcome docs changed.
  read:
  - manifests/drafts/083-00-close-outcome-enrichment-consumption-loop.epic.yaml
  - manifests/083-03-add-theme-aware-recall.manifest.yaml
  - manifests/083-06-harden-enrich-staleness-flags-and-prompt-scaling.manifest.yaml
  - manifests/072-01-disable-cli-option-abbreviation.manifest.yaml
  - manifests/079-01-version-init-instruction-payload.manifest.yaml
  - maid_runner/cli/commands/insights.py
  - maid_runner/core/outcome_enrichment.py
  - tests/cli/test_init_instruction_payload_version.py
  create:
  - path: tests/cli/test_recall_stale_digest_flag_cmd.py
    artifacts:
    - kind: test_function
