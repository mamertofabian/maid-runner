# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: 'Align `maid recall --theme-map` digest staleness semantics with the 083-06 insights/enrich split: register `--allow-stale-digest` on the recall subparser as the narrow opt-in that waives only the digest `source_generated_from` mismatch, keep `--allow-stale-index` backward compatible (it continues to waive both index and digest staleness on recall), and never let the new flag waive Outcome index staleness'
type: fix
created: '2026-07-05T03:00:21Z'
metadata:
  epic: 083-00-close-outcome-enrichment-consumption-loop
  tags:
  - outcome-records
  - recall
  - llm-enrichment
  - cli
  priority: low
description: |
  083-03 (theme-aware recall) landed before 083-06 (staleness flag split), so
  recall's `--theme-map` digest staleness is still waived only by the broad
  legacy `--allow-stale-index` flag, while `maid insights --theme-map` and
  `maid enrich validate/render` now accept the narrow `--allow-stale-digest`
  opt-in. 083-06 explicitly scoped recall out with a note that whichever child
  landed second should rebase on the other's flag semantics; 083-03 landed
  first, so no rebase happened and the surfaces diverged. An operator who only
  wants to tolerate a slightly old digest on recall is currently forced to
  also waive index staleness. This child restores cross-surface parity.

  Pinned decisions (do not redesign):

  1. Flag semantics are copied from 083-06, not reinvented. On recall, digest
     staleness (`digest_is_stale` against the recall index) is waived by
     `--allow-stale-digest` OR (unchanged, for backward compatibility)
     `--allow-stale-index`. Outcome index staleness
     (`outcome_index_is_stale`) is waived ONLY by `--allow-stale-index`;
     `--allow-stale-digest` alone must not suppress the index staleness
     rejection. This mirrors `cmd_insights` exactly.

  2. Error message parity. The stale theme-map rejection steers users to the
     narrow flag ("run `maid enrich` or pass --allow-stale-digest"), matching
     the insights wording. The existing 083-03 test
     `test_recall_rejects_stale_theme_map_without_allow_flag` asserts only a
     "stale" substring, so this message change does not touch the 083-03
     behavioral contract or its plan lock.

  3. Registered, unabbreviated option (072-01 convention), added to the
     recall subparser in `build_parser` with help text distinguishing it from
     `--allow-stale-index`, in the same style as the insights and enrich
     registrations.

  4. No other recall behavior changes. Theme-map consumption stays
     annotation-only (083-03 contract): match selection, scoring, ordering,
     deep validation via `validate_enrichment_theme_map`, and unmapped
     pass-through are untouched. This is an additive flag; the 083-03 and
     083-06 contracts are evolved by chain merge through this manifest, not
     by rewriting those manifests.

  5. Docs stay accurate. The advisory-enrichment section of
     `docs/manifest-outcome-records.md` currently describes the
     `--allow-stale-digest` / `--allow-stale-index` split only for insights
     consumption; extend it to state that `maid recall --theme-map` follows
     the same opt-in semantics, and sync the packaged copy
     `maid_runner/docs/manifest-outcome-records.md` byte-for-byte.

  6. Instruction payload version bump. `maid init` distributes
     `docs/manifest-outcome-records.md` into downstream repositories, so this
     docs payload change must advance `INSTRUCTION_PAYLOAD_VERSION` past the
     current baseline (`2026.07.04.2`) so `maid init --check` reports installed
     older payloads as stale.

  Planned behavioral tests (red phase pending — handoff stops before tests):
  a new dedicated `tests/cli/test_recall_stale_digest_flag_cmd.py` (new file
  rather than additions to `tests/cli/test_recall_theme_map_cmd.py`, so the
  083-03 plan lock's red evidence is not invalidated — the lesson recorded on
  083-01) asserts: a stale digest on recall is rejected without either flag
  with an error naming `--allow-stale-digest`; accepted with
  `--allow-stale-digest` and annotating themes normally; still accepted with
  bare `--allow-stale-index` (backward-compatibility pin); a stale INDEX with
  only `--allow-stale-digest` is still rejected with recall's index-stale
  error; and the flag is registered unabbreviated on the recall parser.
  `tests/cli/test_recall_theme_map_cmd.py` reruns unchanged as the 083-03
  regression guard, `tests/test_manifest_outcome_docs.py` reruns as the
  source/packaged docs guard, the dedicated recall stale-digest test file
  asserts the instruction payload version advanced for the distributed docs
  change, and `tests/cli/test_init_instruction_payload_version.py` reruns as
  the payload metadata regression guard.

  Expected red-phase failures: argparse rejects the unknown
  `--allow-stale-digest` option on recall; the stale-rejection error message
  does not yet name the new flag; the waiver behavior is absent.

  Out of scope: narrowing or deprecating `--allow-stale-index` anywhere,
  recall skill/guidance updates pointing agents at the new flag (guidance
  children own that surface), enrichment core changes, and any insights or
  enrich behavior.
temptations:
- risk: Do not let --allow-stale-digest waive recall's Outcome index staleness to simplify the flag handling.
  instead: Only the digest source_generated_from mismatch is waived; index staleness remains --allow-stale-index-only, pinned by a stale-index-with-digest-flag rejection test.
- risk: Do not change or narrow --allow-stale-index behavior on recall while adding the new flag.
  instead: Pin bare --allow-stale-index still accepting a stale digest with a backward-compatibility test, exactly as 081/083-03 shipped it.
- risk: Do not add the new assertions to tests/cli/test_recall_theme_map_cmd.py, whose red evidence belongs to the 083-03 plan lock.
  instead: New coverage lives in the dedicated tests/cli/test_recall_stale_digest_flag_cmd.py; the 083-03 file reruns unchanged as a regression guard in this manifest's validate command.
- risk: Do not silently rewrite the 083-03 or 083-06 manifests to describe the aligned semantics.
  instead: Evolve the cmd_recall and build_parser contracts additively through this manifest via chain merge; the 081/083 lineage stays auditable.
- risk: Do not update init-distributed Outcome docs without advancing the instruction payload version.
  instead: Bump INSTRUCTION_PAYLOAD_VERSION and pin it with a test so downstream maid init --check reports older installed payloads as stale.
