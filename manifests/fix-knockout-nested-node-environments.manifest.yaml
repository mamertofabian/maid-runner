# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Retain declared subproject Node dependency environments in knockout snapshots
type: fix
created: '2026-10-20T21:42:26Z'
description: 'Retain root Node environments and subproject node_modules only for package.json roots already
  present in bounded snapshot inputs. Preserve relative directory layout and nearest-package identity,
  including distinct root/UI versions, hoisted imports, Node ESM and actual pnpm --dir ui exec. Shared
  snapshots borrow validated managed Node environment paths with existing dependency mutation checks;
  materialized snapshots use isolated copies and retained workers copy once then link private environments
  across fresh roots. Do not flatten dependencies into NODE_PATH or recursively discover package roots
  inside node_modules. Preserve root dependency behavior, source/Git/input guards, safe cleanup and no
  installs in snapshots. Reject escaping dependency-root and internal symlinks, while accepting contained
  pnpm store and bin links. No source-module import through an environment escape. Containment allows
  relative pnpm links among the selected managed Node environments (including a root store shared by subprojects),
  while rejecting project-source or external escapes. Reuse normal Node resolution rather than implementing
  a package resolver. Hardened recall matched 121-27 dependency sharing and the preceding worktree identity
  fix: preserve shared borrowing/once-per-worker copies and all tested-worktree controls without copying
  dependency trees per coverage lane. Managed dependency roots must be real directories, never symlink
  aliases into project source or external state. Materialize subproject paths without adding them to global
  NODE_PATH/PATH; keep root-only compatibility and let native Node/pnpm package context select subproject
  modules and tools. Root-only imports/executables must not gain access to subproject-only dependencies.
  Evolve the historical shared-environment absence assertion to managed-path/source identity: Node paths
  are present as borrowed aliases without cloning the environment. Preserve its test name and source before/after
  invariants; refresh shared-dependent locks with unchanged validate commands through sanctioned preservation.'
temptations:
- risk: Make the command pass through host/global tooling or a flattened dependency search path with the
    wrong package version.
  instead: Run real pnpm and Node ESM fixtures with different root/UI versions and a hoisted dependency;
    retain bounded managed relative paths in all snapshot modes.
- risk: Follow arbitrary nested directories or expose writable source paths without existing integrity
    checks.
  instead: Select only package roots present in snapshot inputs, validate managed environment symlink
    containment, retain source/dependency mutation checks and verify teardown/source preservation.
- risk: Copy dependency trees for every retained-worker declaration or install missing packages during
    validation.
  instead: Reuse existing retained private environments by relative key; preserve shared borrowing and
    test repeated fresh roots with unchanged original dependencies.
