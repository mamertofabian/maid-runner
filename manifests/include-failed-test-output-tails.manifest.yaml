  - lesson_type: test-design
    summary: "Output-tail contracts need exact boundary assertions, successful and empty omission cases, and negative coverage for every public formatter that must remain output-free."
    tags: [behavioral-contract, bounded-output, regression]
    paths: [tests/cli/test_failed_test_output_json.py]
  review_notes:
