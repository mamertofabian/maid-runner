  - uv run maid validate manifests/fix-google-search-vercel-deployment.manifest.yaml --mode behavioral --quiet
  - uv run maid validate manifests/fix-google-search-vercel-deployment.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-17T00:52:50Z"
  summary: "Retired the repository's stale GitHub Pages publisher, defined website/ as Vercel's static output directory, documented the intentional HTTP/www canonical redirects, and superseded the remaining Pages-specific analytics and installer contracts without changing their behavior."
  rationale: "The live apex site already returned 200 while HTTP and www variants permanently redirected to it, so Search Console's redirect classification was intentional. The repository defect was conflicting deployment ownership: a Pages workflow and active Pages-specific contracts remained after production moved to Vercel. The replacement contract keeps one repository-declared publisher, protects canonical crawl surfaces, and distinguishes repository automation from external hosting settings."
  lessons:
    - lesson_type: workflow
      summary: "A hosting migration is incomplete when only the deployment workflow is removed; every active additive manifest that still names the old platform or deleted workflow must be superseded while its independent behavior is redeclared."
      tags:
        - deployment
        - manifest-evolution
        - supersession
      paths:
        - manifests/add-google-analytics.manifest.yaml
        - manifests/add-bootstrap-installers.manifest.yaml
        - manifests/fix-google-search-vercel-deployment.manifest.yaml
    - lesson_type: test-design
      summary: "A single-path absence check cannot prove exclusive deployment ownership; scan all workflow YAML for platform markers and assert every crawler-facing surface avoids redirecting host aliases."
      tags:
        - seo
        - canonical-url
        - deployment
      paths:
        - tests/test_website_static_contract.py
        - website/robots.txt
        - website/sitemap.xml
    - lesson_type: validation
      summary: "Fresh maid-runner worktrees need npm ci before the full test batch so TypeScript workspace-package resolution is tested with the locked compiler dependency rather than misreported as a product regression."
      tags:
        - environment
        - typescript
        - dependency-setup
      paths:
        - package-lock.json
        - tests/core/test_ts_module_paths.py
  review_notes:
