# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Retire the stale GitHub Pages deployment and make Vercel the repository-defined canonical website deployment"
type: fix
created: "2026-08-17T00:09:17Z"
supersedes:
  - website-maid-in-practice-section
  - add-google-analytics
  - add-bootstrap-installers
metadata:
  planning_state: implementation_ready
  tags:
    - website
    - seo
    - vercel
    - deployment
  priority: high
description: |
  The public site is served by Vercel at https://maidrunner.dev/, but the
  repository still deploys and contract-tests a second copy through GitHub
  Pages. Retire that stale deployment surface, define website/ as Vercel's
  static output directory in repository configuration, and document the
  Vercel project/domain settings that keep the HTTPS apex URL canonical.

  Preserve the existing static landing page, accessibility behavior, local
  assets, Google Analytics, bootstrap installers, robots policy, and sitemap.
  Google Search Console's "Page with redirect" classification remains
  intentional for HTTP and www aliases; no canonical, sitemap, or internal
  link may advertise those redirecting variants as indexable pages. Preserve
  the active analytics and bootstrap-installer contracts while replacing their
  stale GitHub Pages wording and deleted-workflow dependency.
temptations:
  - risk: "Do not try to make HTTP or www aliases return 200 merely to remove Search Console's redirect classification."
    instead: "Keep one indexable HTTPS apex URL and preserve permanent domain normalization in Vercel's Domains settings."
  - risk: "Do not leave the GitHub Pages workflow active after declaring Vercel canonical."
    instead: "Delete the obsolete workflow and replace its behavioral assertion with a repository-owned Vercel deployment contract."
  - risk: "Do not add broad clean-URL or trailing-slash rules without a page that needs them."
    instead: "Configure only the static output directory; retain the existing canonical, robots, and sitemap URLs unchanged."
files:
  scope:
    - path: website/index.html
      reason: "Existing homepage and canonical metadata remain part of the complete superseding website contract."
    - path: website/styles.css
      reason: "Existing responsive and accessible presentation remains part of the complete website contract."
    - path: website/script.js
      reason: "Existing progressive-enhancement navigation remains part of the complete website contract."
    - path: website/404.html
      reason: "Existing static fallback remains part of the complete website contract."
    - path: website/robots.txt
      reason: "Crawler policy must continue pointing only to the canonical HTTPS apex sitemap."
    - path: website/sitemap.xml
      reason: "Search discovery must continue listing only the final 200-status canonical homepage."
    - path: website/assets/logo.png
      reason: "The production PNG remains the authoritative brand asset."
    - path: website/assets/social-card.png
      reason: "The social preview remains part of the website asset contract."
    - path: website/data/practice-stats.json
      reason: "The evidence-backed practice statistics remain the canonical data source for homepage copy."
    - path: website/install.sh
      reason: "The existing POSIX bootstrap endpoint remains part of the complete website contract."
    - path: website/install.ps1
      reason: "The existing PowerShell bootstrap endpoint remains part of the complete website contract."
    - path: README.md
      reason: "The existing bootstrap installer onboarding hierarchy remains part of the superseded installer contract."
    - path: .github/workflows/test-installers.yml
      reason: "The cross-platform installer smoke workflow remains active and distinct from website publishing."
    - path: vercel.json
      reason: "Repository-owned Vercel configuration serves the static website/ directory without relying on stale Pages automation."
    - path: website/README.md
      reason: "Deployment documentation records Vercel as the only publisher and explains intentional canonical-domain redirects."
  delete:
    - path: .github/workflows/deploy-website.yml
      reason: "The GitHub Pages publisher is obsolete now that Vercel serves the production domain."
    - path: website/assets/logo.svg
      reason: "The removed generated logo variant must remain absent."
    - path: website/assets/mockup-redesign.png
      reason: "The disposable design reference must remain absent."
    - path: website/assets/social-card-v2.png
      reason: "The disposable social-card source variant must remain absent."
