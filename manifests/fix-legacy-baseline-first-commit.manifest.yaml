# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Allow a newly staged brownfield manifest to capture an auditable legacy baseline
  when its entire declared implementation and behavioral-test contract already exists
  cleanly at HEAD"
type: fix
created: "2026-08-05T07:00:14Z"
metadata:
  planning_state: behavioral-contract
  promotion_ready: true
  tests_status: created-red-confirmed
  source_bug_report:
    /home/atomrem/.maid/bug-report/20260801-151321-deckhand-legacy-baseline-first-commit.md
  tags:
    - plan-lock
    - legacy-migration
    - brownfield
    - anti-gaming
  priority: high
description: |
  Break the first-commit deadlock between generated strict pre-commit hooks and
  `maid plan lock --legacy-baseline` for brownfield implementation already in
  HEAD. When the manifest itself is absent from HEAD, use its staged index blob
  as the audited manifest baseline only if the worktree bytes match that blob,
  no other project path is dirty, and every declared non-deletion path plus
  every discovered behavioral test already exists at HEAD with clean bytes.

  Record whether the baseline manifest came from HEAD or the index so the
  stored hash is not misrepresented as a blob from the baseline commit. Old
  evidence without the new field remains valid as an implicit HEAD source.
  Existing tracked-manifest migration, command-strengthening, mutation, green
  validation, atomic publication, and strict-gate behavior remain unchanged.
temptations:
  - risk: "Do not accept an arbitrary untracked worktree manifest as legacy evidence."
    instead: "Require a Git index blob for a manifest absent from HEAD and require
      the worktree bytes to match it exactly."
  - risk: "Do not let the first-commit path grandfather implementation or tests that
      are staged, untracked, ignored, or otherwise absent from HEAD."
    instead: "Resolve every declared non-deletion path and discovered behavioral test
      from HEAD before running validation, while retaining the existing dirty-path
      guards."
  - risk: "Do not label an index-derived manifest hash as though it came from the
      baseline commit."
    instead: "Persist an explicit baseline_manifest_source value and treat missing
      values on historical locks as head for backward compatibility."
files:
  edit:
    - path: maid_runner/core/plan_lock.py
      artifacts:
        - kind: attribute
          name: baseline_manifest_source
          of: LegacyBaselineEvidence
          type: str
          description: "Identifies whether baseline_manifest_hash was captured from
            the HEAD manifest blob or the staged index blob."
        - kind: function
          name: capture_legacy_baseline_evidence
          args:
            - name: manifest_path
              type: Path
            - name: project_root
              type: Path
            - name: reason
              type: str
          returns: LegacyBaselineEvidence
          description: "Capture legacy green evidence from a tracked HEAD manifest
            or, for first-commit brownfield adoption, an identical staged manifest
            whose declared implementation and behavioral tests already exist cleanly
            at HEAD."
    - path: docs/maid_specs.md
      artifacts:
        - kind: attribute
          name: _legacy_baseline_first_commit_specification
          of: documentation
          type: markdown paragraph
          description: "Documents the staged-manifest bootstrap path, explicit provenance,
            and HEAD-only contract boundary."
  create:
    - path: tests/cli/test_plan_legacy_baseline_first_commit.py
      artifacts:
        - kind: test_function
          name:
            test_staged_first_commit_manifest_records_index_provenance_and_satisfies_strict_gate
          args:
            - name: tmp_path
              type: Path
          returns: None
          description: "A staged manifest absent from HEAD can lock completed clean
            brownfield code and records index provenance without claiming red evidence."
        - kind: test_function
          name: test_first_commit_manifest_must_be_staged_and_match_the_worktree
          args:
            - name: tmp_path
              type: Path
          returns: None
          description: "An unstaged manifest and a staged manifest with later worktree
            edits are both rejected."
        - kind: test_function
          name:
            test_first_commit_manifest_rejects_declared_or_test_paths_absent_from_head
          args:
            - name: tmp_path
              type: Path
          returns: None
          description: "Index provenance cannot grandfather a declared implementation
            path or discovered behavioral test that is absent from HEAD."
        - kind: test_function
          name: test_historical_legacy_payload_without_source_remains_valid
          args:
            - name: tmp_path
              type: Path
          returns: None
          description: "Locks created before baseline_manifest_source was introduced
            retain their strict-gate validity as implicit HEAD provenance."
  read:
    - tests/cli/test_plan_legacy_baseline_cmd.py
    - manifests/fix-legacy-plan-lock-baseline-migration.manifest.yaml
validate:
  - uv run python -m pytest -q
    tests/cli/test_plan_legacy_baseline_first_commit.py
    tests/cli/test_plan_legacy_baseline_cmd.py
