        - python
        - -m
        - pytest
        - -q
        - tests/cli/test_plan_legacy_baseline_acceptance_migration.py
      status: passed
      summary: Both focused validate-to-acceptance migration scenarios passed
        after the implementation; before implementation the acceptance-preserved
