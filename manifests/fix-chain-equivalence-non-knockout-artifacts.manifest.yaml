            - {name: monkeypatch, type: pytest.MonkeyPatch}
            - {name: capsys, type: "pytest.CaptureFixture[str]"}
          returns: None
  edit:
    - path: maid_runner/core/chain_merge.py
      artifacts:
        - kind: function
          name: artifact_requires_knockout_detection
          args:
            - {name: artifact_key, type: str}
          returns: bool
          description: "Return whether an artifact contract key identifies a function or method that the knockout engine can mutate."
        - kind: function
          name: build_chain_merge_report
          args:
