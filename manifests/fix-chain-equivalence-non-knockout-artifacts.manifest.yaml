            - {name: baseline_blocked, type: bool, default: "False"}
          returns: MergeEquivalenceResult
          description: "Require complete contract and coverage evidence plus a complete detection partition for every knockout-capable artifact on both sides."
    - path: maid_runner/cli/commands/_format.py
