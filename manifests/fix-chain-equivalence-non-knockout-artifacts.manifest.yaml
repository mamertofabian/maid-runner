# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Let chain-merge equivalence require detecting-nodeid evidence only for artifact kinds the knockout engine can actually mutate"
type: fix
created: "2026-08-19T14:26:05Z"
metadata:
  priority: high
  tags: [chain-merge, equivalence, knockout, evidence, regression]
description: |
  Chain-merge reports currently place every required artifact into the knockout
  detection partition. The knockout engine deliberately mutates only functions
  and methods, so classes, attributes, enums, and other declared kinds can never
  leave `unknown_detection_artifacts`. E715 consequently rejects every baseline
  containing a non-knockout kind no matter how much deep evidence is generated.

  Add one public artifact-key policy helper and use it consistently in report
  construction, strict baseline loading, core equivalence invariants, and text
  progress rendering. The complete `required_artifacts` contract and all
  artifact-coverage partitions remain unchanged. Detection evidence must form a
  complete partition of only function and method artifacts; supported artifacts
  still fail closed when evidence is missing, while evidence claimed for an
  unsupported kind is malformed rather than silently trusted.

  This is an additive behavioral evolution. Existing public signatures remain
  unchanged and the new helper is backward compatible, so the manifest chain
  remains active rather than superseding the large original report and
  equivalence contracts. The refinement narrows an impossible evidence demand;
  it does not weaken coverage or contract-identity equivalence.
temptations:
  - risk: "Do not remove classes, attributes, enums, or other non-knockout kinds from required_artifacts or artifact-coverage checks."
    instead: "Keep the complete merged contract and coverage partitions intact; narrow only the detecting-nodeid partition."
  - risk: "Do not fabricate detecting nodeids for unsupported kinds from coverage or ordinary green tests."
    instead: "Classify applicability from the declared artifact identity and require real persisted knockout evidence only for functions and methods."
  - risk: "Do not let baseline JSON omit a function or method from both detection categories, or claim detection for a class or attribute."
    instead: "Apply the same canonical policy in the strict loader and public core comparator so malformed partitions fail closed."
  - risk: "Do not special-case outcome_enrichment.py or the current pilot's artifact names."
    instead: "Derive eligibility generically from the merge key embedded in every artifact contract key, including exact signature keys."
  - risk: "Do not report detection progress against all contract artifacts once only a subset is applicable."
    instead: "Render the denominator from the canonical knockout-eligible artifact set while leaving coverage progress based on the full contract."
