            - {name: chain, type: ManifestChain}
            - {name: detection_source, type: "DetectionEvidenceSource | None"}
            - {name: coverage_source, type: "CoverageEvidenceSource | None", default: "None"}
          returns: ChainMergeReport
          description: "Build the complete chain report while requesting detecting-nodeid evidence only for knockout-capable artifacts."
    - path: maid_runner/core/chain_merge_equivalence.py
      artifacts:
