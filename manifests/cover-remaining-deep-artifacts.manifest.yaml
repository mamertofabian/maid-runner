description: |
  Owner consolidation removes duplicate E710 reports and leaves twelve genuine
  unexecuted bodies. Give the coherence package facade its own executable
  get_checks entry point while preserving the existing filtering signature and
  result. Strengthen focused tests so the legacy assertion compatibility
  delegates, session-scoped Git template fixture, and public Claude/Codex loop
  wrappers execute through observable behavior.

  The assertion delegates are private compatibility surfaces already declared
  by the active chain. Their narrow characterization compares results with the
  extracted public helpers rather than coupling tests to private state. The
  automation wrappers are exercised directly because callers rely on their
  root binding, packet conversion, approval delegation, and stream-process file
  contract. No production change is required outside the coherence facade.
temptations:
  - risk: "Do not exempt the twelve findings or mark ordinary helpers as default hooks."
    instead: "Execute each body through focused behavior and confirm the deep artifact-coverage report reaches zero E710."
  - risk: "Do not duplicate the automation core implementation in wrapper tests."
    instead: "Patch only the owned core delegation boundary and assert arguments, return values, packet conversion, and repository binding."
  - risk: "Do not mock the internals of Claude stream processing to manufacture coverage."
    instead: "Run a deterministic local Python subprocess and assert the returned result plus persisted stdout, stderr, and final-message files."
  - risk: "Do not broaden the coherence facade signature or change check filtering behavior."
    instead: "Delegate the exact optional enabled/disabled arguments to the existing checks implementation and assert facade ownership plus filtering."
