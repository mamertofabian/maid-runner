# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Reconcile the chain-merge command reference, MAID specification, original consolidation design, packaged spec mirrors, and epic inventory with the fully shipped children 1-6 behavior.
type: refactor
created: '2026-08-16T07:15:40Z'
metadata:
  origin: manifest-test-consolidation-design-2026-08-13
  epic: chain-merge-defragmentation
  tags:
  - chain-merge
  - documentation
  - maid-spec
  priority: low
description: |
  Child 7, the final child of the chain-merge-defragmentation epic.

  The command reference and one MAID-spec sentence were committed early in
  5665c18, before the evidence and equivalence children shipped. The reference
  now contains a stale "Not yet shipped" section, omits
  `--verify-equivalence BASELINE_REPORT`, and describes UNKNOWN evidence as a
  future dependency. The original design note exists on release/v2.next at
  e642cd1 but is absent from this perf-based branch even though every child cites
  it. This change reconciles those documents with the implemented command.

  The behavioral contract pins semantics rather than prose: every shipped CLI
  mode appears in the reference; the docs state that reports consume current
  recorded evidence without running coverage/knockout; apply never retires
  tests; equivalence compares artifact-level coverage and knockout detection,
  allows new test nodeids, consumes a complete saved baseline report, and fails
  closed with E715. The original design note is restored as an implemented
  decision record, and the epic inventory is marked completed with active child
  paths.

  `make sync-agent-payloads` does not copy maid_specs.md. This child therefore
  directly keeps docs/maid_specs.md, maid_runner/docs/maid_specs.md, and
  .maid/docs/maid_specs.md byte-identical and tests that invariant.

  No runtime behavior, README command catalog, howto section, or generated skill
  payload changes are in scope.
temptations:
- risk: Preserve the early reference's "not yet shipped" disclaimer or omit the final equivalence flag because the docs already look substantial.
  instead: Compare the public `maid chain merge --help` output with semantic reference assertions covering every shipped mode.
- risk: Describe equivalence as literal detecting-nodeid equality or as a coverage-only green-suite comparison.
  instead: Document artifact-identity supersets, changed candidate nodeids, and the combined coverage plus knockout-detection bar.
- risk: Claim the payload-sync Make target updates MAID spec mirrors.
  instead: Update the two tracked mirrors explicitly and assert byte identity.
- risk: Rewrite the design note as if the original evidence and open risks never existed.
  instead: Preserve its decision rationale while adding a clear implemented resolution that names the shipped commands and remaining operational limits.
