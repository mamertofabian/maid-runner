# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Run independent snapshot knockouts concurrently under one bounded process budget"
type: refactor
created: "2026-08-12T01:40:22Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - knockout
    - parallelism
    - verify
description: |
  Once unique specs, differential proof, and snapshot equivalence are green,
  schedule independent mutation identities in a bounded worker pool. Within a
  unique-spec worker, every retained declaration opens a fresh/reset snapshot
  lifecycle before its baseline; declarations never share a mutable cwd,
  generated state, or command side effects. Account for subprocesses requested
  by the command so knockout jobs plus nested pytest workers cannot exceed the
  same project max-process budget introduced by 121-07. Explicit one remains
  serial. Resolve nested cost from command arguments and effective pytest config
  addopts before acquiring tokens; a configured `-n` may not evade the budget
  simply because it is absent from the manifest command text. MAID's advisory
  pytest worker policy is not charged here because the owned knockout command
  boundary does not inject it. Any explicit/configured `auto` or process cost
  larger than the global budget fails visibly with E712.

  The owned scheduler uses threads only to coordinate independently isolated
  external command processes; it does not share project state or reinterpret
  Python test semantics. Each unique mutation reserves the maximum effective
  process cost of its sequential declaration commands for its full worker
  lifecycle. A weighted budget and the configured jobs ceiling both apply, so
  cheap commands may overlap while an xdist-backed command can reduce the pool
  to one. Explicit `jobs: 1` bypasses the pool and preserves serial execution.

  Worker completion order must not affect chain/declaration output, E711/E712
  attribution, fail policy, text, or JSON. Collect all scheduled results,
  surface every snapshot/worker harness failure, and expand unique mutations in
  original manifest order. A worker crash or lost result is E712, never a
  detected mutation or empty success. Configure this repository through
  `.maidrc.yaml`; consumer defaults remain one worker. Descendant-owned
  concurrency is enabled only where the command supervisor can prove complete
  lifecycle ownership; unsupported platforms fail knockout execution visibly
  rather than claiming or silently approximating the process budget. Ordinary
  non-knockout command execution retains its legacy platform behavior.
temptations:
  - risk: "Do not run jobs against the same snapshot cwd or generated cache."
    instead: "Give each active worker an independently verified project snapshot and cleanup lifecycle."
  - risk: "Do not miss command- or config-supplied xdist workers when budgeting knockout jobs."
    instead: "Resolve effective command/config addopts, reserve every process token that can actually execute, and reduce concurrency or run serially."
  - risk: "Do not render future-completion order."
    instead: "Buffer by immutable mutation identity and expand in chain/declaration order."
  - risk: "Do not treat a worker crash, timeout, or missing result as mutation detection."
    instead: "Emit deterministic E712 diagnostics, terminate and reap a timed-out controller's complete process group before releasing budget, and keep every unaffected result attributable."
  - risk: "Do not reuse one declaration's mutated working state for another duplicate declaration."
    instead: "Use the unique spec only for scheduling; create/reset a verified child snapshot for every declaration lifecycle."
files:
  create:
    - path: maid_runner/core/_knockout_worker.py
      artifacts:
        - kind: class
          name: KnockoutWorkerResult
          description: "One unique identity's independently isolated per-declaration reports or worker harness errors."
        - kind: attribute
          name: identity
          of: KnockoutWorkerResult
          type: KnockoutArtifactIdentity
        - kind: attribute
          name: reports
          of: KnockoutWorkerResult
          type: Mapping[str, KnockoutReport]
          description: "Per-declaration reports keyed by stable decimal plan index for exact order reconstruction."
        - kind: attribute
          name: process_cost
          of: KnockoutWorkerResult
          type: int
        - kind: attribute
          name: errors
          of: KnockoutWorkerResult
          type: tuple[ValidationError, Ellipsis]
        - kind: function
          name: execute_knockout_worker
          args:
            - name: spec
              type: KnockoutMutationSpec
            - name: project_root
              type: Path
            - name: evidence
              type: RuntimeEvidenceBundle | None
            - name: snapshot_backend
              type: ProjectSnapshotBackend
            - name: executor
              type: KnockoutCommandExecutor
          returns: KnockoutWorkerResult
          description: "Executes each declaration of one unique spec in a fresh/reset owned snapshot and never writes the shared root."
        - kind: function
          name: resolve_knockout_process_cost
          args:
            - name: command
              type: tuple[str, Ellipsis]
            - name: project_root
              type: Path
          returns: int
          description: "Accounts command-supplied and effective config-addopts worker counts before scheduling."
        - kind: function
          name: run_knockout_workers
          args:
            - name: specs
              type: Sequence[KnockoutMutationSpec]
            - name: project_root
              type: Path
            - name: evidence
              type: RuntimeEvidenceBundle | None
            - name: snapshot_backend
              type: ProjectSnapshotBackend
            - name: executor
              type: KnockoutCommandExecutor
            - name: jobs
              type: int
            - name: max_processes
              type: int
          returns: tuple[KnockoutWorkerResult, Ellipsis]
          description: "Schedules process-budgeted workers and returns results in input identity order."
    - path: tests/core/test_knockout_workers.py
      artifacts:
        - kind: test_function
          name: test_independent_mutations_overlap_without_shared_snapshot_state
          args: []
        - kind: test_function
          name: test_process_budget_bounds_jobs_plus_nested_command_workers
          args: []
        - kind: test_function
          name: test_process_budget_accounts_command_and_config_pytest_worker_counts
          args: []
        - kind: test_function
          name: test_explicit_one_worker_preserves_serial_execution
          args: []
        - kind: test_function
          name: test_worker_completion_order_preserves_manifest_declaration_order
          args: []
        - kind: test_function
          name: test_parallel_and_serial_reports_match_except_durations
          args: []
        - kind: test_function
          name: test_worker_crash_timeout_or_missing_result_is_e712
          args: []
        - kind: test_function
          name: test_original_source_bytes_and_status_remain_unchanged_during_overlap
          args: []
        - kind: test_function
          name: test_inter_declaration_side_effects_are_isolated_in_parallel_and_serial
          args: []
  edit:
    - path: maid_runner/core/config.py
      artifacts:
        - kind: class
          name: KnockoutExecutionConfig
          description: "Validated bounded knockout worker configuration with serial consumer defaults."
        - kind: attribute
          name: jobs
          of: KnockoutExecutionConfig
          type: int
        - kind: attribute
          name: knockout_execution
          of: MaidConfig
          type: KnockoutExecutionConfig
    - path: .maidrc.yaml
      artifacts:
        - kind: attribute
          name: knockout_execution
          of: maid-config
          type: mapping
          description: "Enables bounded isolated knockout workers for maid-runner's own deep gate."
    - path: maid_runner/core/knockout.py
      artifacts:
        - kind: function
          name: run_knockout_batch
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: evidence
              type: RuntimeEvidenceBundle | None
              default: "None"
            - name: limit
              type: int | None
              default: "None"
            - name: allow_dirty
              type: bool
              default: "False"
            - name: executor
              type: KnockoutCommandExecutor | None
              default: "None"
            - name: snapshot_backend
              type: ProjectSnapshotBackend | None
              default: "None"
            - name: jobs
              type: int
              default: "1"
            - name: max_processes
              type: int
              default: "1"
          returns: dict[str, KnockoutReport]
          description: "Runs bounded isolated workers and expands deterministic reports."
    - path: maid_runner/core/_test_command_execution.py
      artifacts:
        - kind: function
          name: _run_test_command
          args:
