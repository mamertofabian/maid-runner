            - name: cwd
              type: Union[str, Path]
              default: '"."'
            - name: timeout
              type: int
              default: "300"
            - name: manifest_slug
              type: str
              default: '""'
            - name: stream
              type: TestStream
              default: TestStream.IMPLEMENTATION
            - name: environment_overrides
              type: Mapping[str, str] | None
              default: "None"
            - name: environment_removals
              type: Sequence[str]
              default: "()"
            - name: require_descendant_ownership
              type: bool
              default: "False"
          returns: TestRunResult
          description: "Executes through a per-command descendant-owning supervisor and terminates/reaps detached or inherited descendants before reporting completion or timeout."
    - path: maid_runner/cli/commands/verify.py
      artifacts:
        - kind: function
          name: _knockout_stage
          args:
            - name: root
              type: Path
            - name: manifest_dir
              type: str
            - name: limit
              type: int | None
            - name: allow_dirty
              type: bool
            - name: evidence
              type: RuntimeEvidenceBundle | None
              default: "None"
          returns: VerificationStageResult
          description: "Loads jobs/process budget, passes current evidence, and preserves deterministic nested reports."
    - path: tests/core/test_config.py
      artifacts:
        - kind: test_function
          name: test_knockout_execution_jobs_requires_positive_bounded_integer
          args: []
    - path: tests/cli/test_verify_knockout_cmd.py
      artifacts:
        - kind: test_function
          name: test_configured_knockout_workers_preserve_text_and_json_results
          args: []
    - path: tests/core/validation/test_test_command_execution.py
      artifacts:
        - kind: test_function
          name: test_timeout_terminates_and_reaps_descendant_process_group
          args: []
        - kind: test_function
          name: test_missing_supervisor_status_fails_closed
          args: []
        - kind: test_function
          name: test_required_descendant_ownership_fails_closed_when_unsupported
          args: []
        - kind: test_function
          name: test_unavailable_procfs_fails_descendant_ownership
          args: []
        - kind: test_function
          name: test_timeout_cleanup_failure_fails_closed
          args: []
