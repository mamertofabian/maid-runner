validate:
  - uv run python -m pytest -q tests/core/test_knockout_workers.py tests/core/test_knockout_snapshot.py tests/core/test_knockout_differential_detection.py tests/core/test_knockout_batch.py tests/core/test_config.py tests/cli/test_verify_knockout_cmd.py tests/core/validation/test_test_command_execution.py
