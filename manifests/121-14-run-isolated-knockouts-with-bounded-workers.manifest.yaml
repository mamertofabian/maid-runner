outcome:
  status: completed
  completed_at: "2026-08-12T03:50:40Z"
  summary: "Independent knockout mutation identities now run concurrently in fresh per-declaration project snapshots under one weighted jobs/process budget. Results are buffered by immutable plan index, command and configured xdist workers consume their effective cost, and timeout, crash, lost status, unsupported ownership, or descendant-cleanup uncertainty fail visibly as E712. This repository enables eight knockout jobs while consumer projects remain serial by default."
  rationale: "Snapshot isolation from 121-13 made mutation concurrency safe, but bounded scheduling also required accounting nested pytest workers and owning every command descendant before releasing capacity. A per-command Linux supervisor becomes a local child subreaper, preflights procfs before target launch, captures target output outside descendant-held pipes, and proves cleanup. Unsupported platforms retain ordinary command compatibility but reject ownership-required knockout work rather than weaken the global process budget."
  lessons:
    - lesson_type: performance
      summary: "Weighted isolated knockout workers produced a controlled 1.49x two-artifact speedup while preserving byte/state isolation; completion order must be reconstructed by plan index because grouping duplicate identities can reorder interleaved declarations."
      tags: [performance, knockout, bounded-parallelism]
      paths:
        - maid_runner/core/_knockout_worker.py
        - maid_runner/core/knockout.py
        - tests/core/test_knockout_workers.py
    - lesson_type: validation-trust
      summary: "A process budget is trustworthy only when descendant ownership is proven before launch and cleanup is acknowledged before token release. Detached sessions, whitespace in Linux process names, unavailable procfs, malformed or missing supervisor status, and cleanup failure all need fail-closed adversaries."
      tags: [fail-closed, process-ownership, behavioral-testing]
      paths:
        - maid_runner/core/_test_command_execution.py
        - tests/core/validation/test_test_command_execution.py
    - lesson_type: performance
      summary: "The assessed deep run spent 2,798.01 seconds entirely before knockout and failed artifact coverage with 1,799 findings. Serial coverage-instrumented fallback batches—not knockout—are now the dominant 30-plus-minute bottleneck, making 121-15 fallback parallelism the next significant slice."
      tags: [performance, artifact-coverage, deep-verify]
      paths:
        - manifests/drafts/121-15-parallelize-isolated-artifact-coverage-fallbacks.manifest.yaml
        - docs/plans/full-and-deep-verification-performance-redesign.md
  review_notes:
    - source: review_121_13_implementation
      severity: warning
      summary: "Initial review found timeout descendants could escape the process group, -n=N was rejected, and duplicate declarations could expand incorrectly; revisions added a per-command ownership supervisor, parser normalization, and plan-index result keys."
    - source: review_121_13_implementation
      severity: warning
      summary: "Subsequent adversarial review found lost supervisor status, unsupported-platform ownership, whitespace-shifted proc stat parsing, unavailable procfs, and post-launch ownership failure; revisions 8-13 added explicit negative status, platform gating, robust parsing, cleanup acknowledgement, and pre-launch ownership proof."
    - source: review_121_13_implementation
      severity: ready
      summary: "Final independent review found no remaining blockers or advisories; bounded scheduling, descendant ownership, deterministic ordering, xdist accounting, and affected plan-lock evidence matched the revision-13 contract."
  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/core/test_knockout_workers.py, tests/core/test_knockout_snapshot.py, tests/core/test_knockout_differential_detection.py, tests/core/test_knockout_batch.py, tests/core/test_config.py, tests/cli/test_verify_knockout_cmd.py, tests/core/validation/test_test_command_execution.py]
      status: passed
      summary: "All 83 declared worker, snapshot, differential, batch, configuration, CLI, and command-ownership tests passed in 103.49s."
    - command: [uv, run, maid, validate, manifests/121-14-run-isolated-knockouts-with-bounded-workers.manifest.yaml, --mode, implementation]
      status: passed
      summary: "Implementation validation passed against plan-lock revision 13 with only the expected .maidrc no-validator advisory."
    - command: [uv, run, maid, verify, --profile, handoff, --require-plan-lock, --require-red-evidence, --since, 710daaf, --summary]
      status: passed
      summary: "The proportional handoff safety floor passed all nine stages in 152.484s after every affected shared-test lock was refreshed with preserved red evidence."
    - command: [uv, run, maid, verify, --profile, deep, --require-plan-lock, --require-red-evidence, --since, 710daaf]
      status: failed-unrelated
      summary: "The exact assessed deep gate ran for 2,798.01s and passed schema, behavioral, and implementation, then failed artifact coverage with 1,799 repository-wide findings before knockout began; serial coverage fallback batches are the measured next bottleneck."
