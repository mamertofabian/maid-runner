# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Document opt-in TypeScript return contracts and verify the reported CSV components without
  consumer writes.
type: feature
created: '2026-09-30T13:47:43Z'
description: 'Final documentation and acceptance slice of the approved compiler-return design,
  following the committed proof adapter and validation integration. Add a Compiler-backed TypeScript
  Return Contracts subsection (heading ##### **Compiler-backed TypeScript Return Contracts**)
  to docs/maid_specs.md. Include the actual .maidrc.yaml compiler-mode configuration with tsconfig.app.json,
  an inert TSX example named preview with Props and exact { value } argument binding returning
  number, and a YAML artifact-list contract executable by the documentation tests. Explain default
  syntax, explicit owning config (including references-only roots), local Node/TypeScript requirements,
  bidirectional semantic equivalence, effective strictNullChecks, unchanged FoundArtifact.returns/snapshots,
  exact bindings, explicit annotations, 5-second request budget, supported named non-overloaded
  top-level TS/TSX declarations, and unavailable any/unknown/unchecked/declaration-file/method/arrow
  cases. Include the module-scoped React expectation import("react/jsx-runtime").JSX.Element
  as an example, without guessing display-type names or promising stronger nullability.

  Add troubleshooting issue 36, Compiler return contract is unavailable (E309), with symptom,
  likely cause and actionable recovery through local Node/TypeScript, explicit owning tsconfig,
  resolved expectation and supported declaration. Distinguish E309 from semantic mismatch E302,
  binding mismatch E303 and default missing-annotation warning E304; compiler mode has no silent
  syntax fallback. Update the old E308 paragraph so it accurately separates parser compatibility,
  exact destructured bindings and the now-available opt-in return proof. Point registered E309
  help to docs/troubleshooting.md#36-compiler-return-contract-is-unavailable-e309 through existing
  private registry metadata only.

  Documentation tests execute the published YAML and TSX through public configuration, manifest
  and per-file validation APIs, including positive proof and negative binding/return/config
  cases; no production proof/config policy is changed. Dedicated optional acceptance uses MAID_CSV_ACCEPTANCE_PROJECT
  supplied by the caller, with no hardcoded consumer path or copied proprietary source in the
  repository. An unset variable skips optional acceptance; an invalid supplied checkout or missing
  installed SDK fails. Temporary project configuration and symlinks use existing source and
  dependencies read-only. Verify CSVImportDialog and CSVPreviewStep using actual installed SDK
  provenance, exact collected argument pattern, React jsx-runtime JSX.Element expectation, default
  warning and wrong binding/return controls. Compare original bytes, raw artifacts and Git status
  before/after. No application code is executed, SDK installed, or client source/config/manifests
  edited.

  The planning spike and optional tests already passed both reported components with TypeScript
  5.8.3. Seven new documentation cases are genuinely red because the published section and help
  target are absent; acceptance does not fabricate red evidence for behavior already implemented.
  M1/M2 Outcome lessons require semantic proof rather than inferred text mutation, explicit
  unavailable results and independent diagnostic checks. Archive the external CSV report only
  after this unit passes review, Outcome and commit, recording that the parser defect is fixed,
  props was an incorrect contract name, and inferred return verification is opt-in. Report closure
  is bookkeeping outside repository implementation scope; do not alter consumer contracts. Remaining
  SQL and Docker capability reports are separate tasks.

  Keep the canonical specification byte-identical in its maintained packaged and local mirrors
  (maid_runner/docs/maid_specs.md and .maid/docs/maid_specs.md). The existing unchanged chain-merge
  documentation regression enforces this distribution contract and is included in the documentation
  validation command.
  '
temptations:
- risk: Do not make documentation assertions pass with unevaluated or invalid YAML examples.
  instead: Publish a real mode/config and binding-pattern artifact example; execute it through
    public APIs and test binding, return and config failures.
- risk: Do not claim that compiler mode invents props aliases, updates snapshots or proves stricter
    nullability.
  instead: Document exact binding and raw-source boundaries, effective project compiler semantics
    and explicit E302/E303/E304/E309 distinctions.
- risk: Do not mutate the consumer repository or use mocked compiler data as CSV acceptance.
  instead: Use a temporary linked project with the actual installed SDK; record provenance and
    compare source/config bytes, artifact records and Git status.
- risk: Do not archive the original report while only documentation or syntax parsing has been
    checked.
  instead: Require actual compiler-return acceptance, independent implementation review, Outcome
    and commit before external report closure.
