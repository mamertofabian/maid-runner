# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
schema: "2"
goal: "Redesign the MAID Runner website to match the supplied product mockup"
type: feature
created: "2026-08-02T15:05:00Z"
metadata:
  planning_state: completed
  tags:
    - website
    - static-site
    - visual-design
    - accessibility
    - seo
  priority: medium
description: |
  Replace the first MAID Runner landing-page design with the supplied dark
  product-page direction. Treat the mockup as the visual and information
  architecture contract: a compact navigation and hero, manifest/validation
  panels, a three-card problem section, the seven-step plan-to-evidence rail,
  capability cards, tool compatibility chips, quick-start terminal, CTA, and
  footer.

  Keep the implementation dependency-free: semantic HTML, local CSS, and the
  existing progressive-enhancement navigation script. Use the supplied logo as
  the brand reference and encode the final cyan cube mark as a small native
  `logo.svg`, which serves as the header logo, footer mark, favicon, and Apple
  touch icon. Use `social-card-v2.png` as the source artwork for the production
  `social-card.png` metadata asset. The mockup, source logo, and v2 source card
  are disposable design inputs and must be absent from the finished website.

  Preserve the existing deployment boundary: the site remains under
  `website/`, renders correctly from a local checkout and the configured apex
  domain, keeps primary content usable without JavaScript, and continues to
  deploy through the existing path-scoped GitHub Pages workflow. Do not add a
  framework, remote font/script, analytics, new route, DNS artifact, or claim
  that local validation exercised live Pages/DNS settings.

  The copy is deliberately limited to capabilities documented by README.md:
  plan locks, red-phase evidence, declared scope, structural/behavioral/
  implementation validation, independent review, and Outcome learning.

  2026-08-09 reposition: the hero and social/search metadata previously reduced
  MAID Runner to "make AI coding follow the plan". This revision leads the page
  with MAID's differentiated strengths -- machine-checkable (AST-level)
  contracts, tamper-evident planning backed by genuine red-phase evidence,
  governance of the artifacts agents produce across any harness (Claude, Codex,
  Cursor, or others), and evidence-backed handoff rather than self-reported
  completion -- via a new hero headline, subhead, and a "core strengths"
  positioning band, while preserving the existing information architecture,
  workflow rail, capability grid, tools, MAID-in-practice section, and
  accessibility contract. The shared behavioral test file is also pinned by the
  active website-maid-in-practice-section and 095-01 plan locks; those
  dependents are reconciled with maid plan revise --preserve-red-evidence
  because their concerns (the practice section and the quickstart guidance) are
  unchanged by this hero reposition. The practice test remains owned by its
  website-maid-in-practice-section contract and is not redeclared here.
temptations:
  - risk: "Do not preserve the old landing page's visual system or leave its three-stream hero as the dominant story."
    instead: "Build the page hierarchy around the supplied mockup and assert its hero, seven workflow steps, capability grid, tools, quick start, and CTA in the behavioral contract."
  - risk: "Do not keep disposable mockup/source assets in the deployed asset graph or point metadata at the v2 source filename."
    instead: "Copy the selected social card into the final social-card.png asset, use the native logo.svg for every brand surface, assert the three supplied files are absent, and scan all HTML/CSS references."
  - risk: "Do not introduce a framework, remote font, icon package, or JavaScript-only content to reproduce the screenshot."
    instead: "Use semantic HTML, CSS-drawn panels/icons, local assets, and the small existing navigation enhancement with a visible no-JavaScript fallback."
  - risk: "Do not invent product promises or unsafe first-run commands."
    instead: "Keep claims and commands grounded in README.md, link to the documented quickstart, and omit maid verify from the empty-repository quick-start terminal."
  - risk: "Do not let the hero and metadata reduce MAID Runner to a single 'make AI follow the plan' promise, and do not trade the visual redesign for inaccessible contrast, focus states, overflow, or fallback behavior."
    instead: "Lead the page with MAID's machine-checkable contracts, tamper-evident planning with red evidence, artifact governance across any agent, and evidence-backed handoff; assert those strengths in the behavioral contract; and test the dark-surface tokens, focus selectors, reduced-motion rule, responsive navigation, 404 recovery, and local asset graph before handoff."
files:
  scope:
    - path: website/index.html
      reason: "The static homepage is the mockup implementation surface; its observable structure and copy are covered by the behavioral contract."
    - path: website/styles.css
      reason: "The responsive dark visual system and accessibility behavior have no stable programmatic API and are covered by source-level contract assertions plus a browser smoke check."
    - path: website/script.js
      reason: "Progressive-enhancement navigation wiring has no public API; the behavior contract covers open, close, Escape, focus return, and no-JavaScript fallback."
    - path: website/404.html
      reason: "The GitHub Pages fallback document is a static route artifact covered through canonical recovery and brand-asset assertions."
    - path: website/robots.txt
      reason: "Crawler policy remains part of the canonical static deployment surface."
    - path: website/sitemap.xml
      reason: "Search-engine discovery metadata remains part of the canonical static deployment surface."
    - path: website/assets/logo.svg
      reason: "The final native brand mark is a static asset used by the header, footer, favicon, and touch icon."
    - path: website/assets/social-card.png
      reason: "The final social preview is a static binary asset referenced by Open Graph and Twitter metadata."
    - path: .github/workflows/deploy-website.yml
      reason: "The existing Pages workflow is part of the site contract and remains covered for path scoping, permissions, and artifact-root behavior."
  delete:
    - path: website/assets/mockup-redesign.png
      reason: "Disposable supplied visual reference; the finished site must not ship its design screenshot."
    - path: website/assets/logo.png
      reason: "Disposable supplied logo reference; the finished site uses the native production SVG mark."
    - path: website/assets/social-card-v2.png
      reason: "Disposable supplied source artwork; the finished site uses the copied production social-card.png asset."
  create:
    - path: tests/test_website_static_contract.py
      artifacts:
        - kind: test_function
          name: test_homepage_matches_mockup_story_and_navigation
          args: []
          returns: None
          source_scenario: "A visitor opens the MAID Runner homepage and scans the product story."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The homepage exposes the mockup-aligned hero, primary actions, navigation anchors, validation panels, problem cards, and all major page sections with semantic headings."
        - kind: test_function
          name: test_homepage_renders_workflow_capabilities_tools_and_quickstart
          args: []
          returns: None
          source_scenario: "A visitor scrolls through the homepage to understand the MAID loop and how to start."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The page renders seven plan-to-evidence steps, six capability cards, tool compatibility labels, and the documented quick-start commands without suggesting maid verify on an empty repository."
        - kind: test_function
          name: test_homepage_uses_final_local_brand_and_social_assets
          args: []
          returns: None
          source_scenario: "A browser and social crawler load the homepage after the disposable design inputs have been consumed."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "Favicon, touch-icon, header/footer logo, and social metadata point to local final assets; every local HTML reference exists; and mockup-redesign.png, logo.png, and social-card-v2.png are absent and unreferenced."
        - kind: test_function
          name: test_mobile_navigation_covers_javascript_and_no_javascript_paths
          args: []
          returns: None
          source_scenario: "A visitor uses the compact navigation on a small screen with JavaScript enabled or disabled."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The script covers open/close, link dismissal, Escape dismissal, and focus return while CSS keeps navigation visible and usable without JavaScript."
        - kind: test_function
          name: test_dark_surface_accessibility_contract_is_declared
          args: []
          returns: None
          source_scenario: "A visitor reads and navigates the dark mockup-aligned page across desktop and mobile."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The stylesheet declares readable text tokens, visible focus states on dark surfaces, responsive rules, and reduced-motion handling."
        - kind: test_function
          name: test_static_fallback_and_search_metadata_target_canonical_domain
          args: []
          returns: None
          source_scenario: "A visitor follows a stale Pages URL or a crawler reads deployment metadata."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "404.html provides a real recovery link and local brand asset, robots.txt points to the canonical sitemap, sitemap.xml is valid XML, and all canonical locations target https://maidrunner.dev/."
        - kind: test_function
          name: test_pages_workflow_is_path_scoped_and_uploads_website_root
          args: []
          returns: None
          source_scenario: "A website change lands on main or an operator manually dispatches the Pages workflow."
          actions:
            - type: api_call
              subject:
                function: yaml.load
          expected:
            behavior: "The workflow triggers only for main website/workflow changes or manual dispatch, uses least-privilege Pages permissions, uploads website as the artifact root, and deploys through GitHub Pages with immutable action SHAs."
        - kind: test_function
          name: test_homepage_leads_with_core_strengths
          args: []
          returns: None
          source_scenario: "A visitor scans the top of the homepage to understand what MAID Runner actually enforces, not just that it 'follows the plan'."
          actions:
            - type: api_call
              subject:
                function: Path.read_text
          expected:
            behavior: "The page leads with MAID's differentiated strengths -- machine-checkable contracts, tamper-evident planning, portability across agents, and evidence-backed handoff -- frames MAID as governing the artifacts agents produce, and no longer reduces the story to a single follow-the-plan headline in the hero or the social/search metadata."
  read:
    - README.md
    - pyproject.toml
validate:
  - uv run python -m pytest -q tests/test_website_static_contract.py
  - uv run maid validate manifests/website-static-landing-page.manifest.yaml --mode behavioral --quiet
  - uv run maid validate manifests/website-static-landing-page.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-09T14:20:00Z"
  summary: "Repositioned the landing hero and social/search metadata to lead with MAID's four core strengths -- machine-checkable contracts, tamper-evident planning with red evidence, artifact governance across any agent, and evidence-backed handoff -- via a new headline, subhead, and a core-strengths band, on top of the existing mockup-aligned dark redesign and MAID-in-practice dogfooding section."
  rationale: "The prior hero and metadata reduced MAID Runner to 'make AI coding follow the plan', underselling its differentiated value. The reposition keeps the full information architecture, workflow rail, capability grid, tools, practice section, accessibility contract, and deployment boundary intact while leading with what MAID actually enforces. A new behavioral test (test_homepage_leads_with_core_strengths) pins the strengths story and forbids the superseded single-note headline, and the shared behavioral test file's other plan-lock dependents were reconciled with maid plan dependents plus preserve-red-evidence revises."
  lessons:
    - lesson_type: workflow
      summary: "Editing a behavioral test file shared by several plan locks trips E701 on every pinning lock; maid plan dependents lists them, and when the shared change does not affect a dependent's own contract, maid plan revise --preserve-red-evidence is the sanctioned reconciliation."
      tags:
        - plan-lock
        - shared-test
        - red-evidence
      paths:
        - tests/test_website_static_contract.py
        - manifests/website-maid-in-practice-section.manifest.yaml
        - manifests/095-01-wire-guidance-to-cli-entry-points.manifest.yaml
    - lesson_type: contract-scope
      summary: "The MAID-in-practice test is owned by website-maid-in-practice-section, not this manifest; a shared test that looks 'undeclared' in one manifest may simply be declared in a co-active chain-merged manifest, so verify ownership before redeclaring it."
      tags:
        - manifest-authoring
        - chain-merge
      paths:
        - manifests/website-static-landing-page.manifest.yaml
        - manifests/website-maid-in-practice-section.manifest.yaml
    - lesson_type: test-design
      summary: "A static-site redesign needs behavioral assertions for the visual story, asset graph, responsive navigation, fallback route, metadata, and deployment boundary so a screenshot match does not silently break site contracts."
      tags:
        - website
        - static-site
        - contract-tests
      paths:
        - manifests/website-static-landing-page.manifest.yaml
        - tests/test_website_static_contract.py
    - lesson_type: validation
      summary: "Final asset cleanup and responsive rendering should be checked together: source inputs must be absent and unreferenced, while desktop and mobile smoke captures confirm the dense layout remains usable."
      tags:
        - assets
        - responsive
        - browser-smoke
      paths:
        - website/index.html
        - website/styles.css
        - website/assets/logo.svg
        - website/assets/social-card.png
  review_notes:
    - source: implementation-review-subagent-socrates
      severity: advisory
      summary: "An independent read-only reviewer was spawned with a fresh context and explicit review packet, but stalled without returning a verdict after repeated waits; the reviewer thread was closed and the required local-only fallback review was performed."
    - source: local-read-only-fallback
      severity: ready
      summary: "The local adversarial review found no blockers: changed files remain within scope, final assets and deletions are correct, local references and fallback paths are consistent, accessibility and navigation selectors are present, and desktop/mobile smoke captures agree with the contract."
  validation:
    - command:
        - uv
        - run
        - python
        - -m
        - pytest
        - -q
        - tests/test_website_static_contract.py
      status: passed
      summary: "Focused website contract tests passed: 9 passed (adds test_homepage_leads_with_core_strengths)."
    - command:
        - uv
        - run
        - maid
        - validate
        - --quiet
      status: passed
      summary: "All active manifests validated with no failures."
    - command:
        - uv
        - run
        - maid
        - verify
        - --profile
        - handoff
        - --since
        - HEAD
      status: passed
      summary: "Strict handoff verification passed all 9 stages (schema, behavioral, implementation, coherence, file_tracking, plan_lock, worktree_scope, changed_scope, tests) with 0 blocking findings; the tests stage ran the full batched suite green. Only pre-existing E307 no-validator advisories remain. Plan-lock stage confirms the reconciled website-static-landing-page, website-maid-in-practice-section, and 095-01 locks."
    - command:
        - uv
        - run
        - ruff
        - check
        - tests/test_website_static_contract.py
      status: passed
      summary: "Ruff reported no issues on the touched test module."
    - command:
        - uv
        - run
        - black
        - --check
        - tests/test_website_static_contract.py
      status: passed
      summary: "Black reported the touched test module unchanged."
