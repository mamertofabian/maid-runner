schema: "2"
goal: Align the E712 troubleshooting contract with isolated snapshot recovery
type: fix
created: "2026-08-12T09:05:55Z"
supersedes:
  - 068-04-document-constraint-evidence-gates
metadata:
  epic: 121-00-fast-verification-roadmap
  tags:
    - validation-trust
    - documentation
    - regression
  priority: high
description: |
  Replace the obsolete documentation-test requirement that E712 recovery tell
  users to run `git checkout -- <file>`. Knockout execution now occurs in an
  isolated current-byte snapshot and must leave the shared checkout unchanged;
  source-repository identity drift is investigated through Git status, refs,
  configuration, and worktree registrations instead of a destructive checkout.

  This is a test-only correction of a stale contract. It supersedes 068-04
  because that manifest explicitly required the old recovery instruction;
  additive chain merge cannot retire that requirement. The current documentation
  already has the intended safe guidance from 121-13, so implementation consists
  only of aligning the behavioral assertion. The other E710-E712 and review-skill
  assertions remain unchanged.

  Evidence lifecycle is pinned: after approval, restore the tracked stale
  assertion and lock this draft against its genuine deterministic failure; then
  apply the approved safe-guidance assertions, revise the lock with
  `--test-only-green`, promote through `maid manifest promote`, and preserve-revise
  the 095-04 shared-test dependent. Do not create an initial `--no-run` lock.
temptations:
  - risk: Reinsert the obsolete `git checkout -- <file>` substring merely to make the old assertion pass.
    instead: Assert the snapshot-era recovery guidance that the shared checkout remains unchanged and Git identities are inspected.
  - risk: Normalize or ignore the deterministic full-suite failure in the performance acceptance probe.
    instead: Make the repository's ordinary serial suite green before accepting parallel report equivalence.
  - risk: Leave the shared-test dependent lock stale after changing the assertion.
    instead: Use `maid plan dependents` and revise 095-04 with its valid preserved evidence.
  - risk: Use an initial no-run lock because the documentation already has the intended guidance.
    instead: Lock against the tracked stale assertion's genuine failure, then revise the approved test-only contract with test-only-green evidence.
