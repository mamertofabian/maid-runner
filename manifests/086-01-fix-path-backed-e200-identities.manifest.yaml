schema: '2'
goal: Stop E200 false positives for Svelte state modules and dynamically loaded hyphenated Python scripts
type: fix
created: '2026-07-13T01:14:02Z'
metadata:
  planning_state: behavioral-contract
  promotion_ready: true
  tests_status: created-red-confirmed
  tags:
  - behavioral-coverage
  - e200
  - identity
  - python
  - svelte
  - typescript
  priority: high
description: |
  Two downstream reports expose path-backed module identities that MAID cannot
  currently associate with the test references accepted by their native
  runtimes.

  Svelte state modules use compound `.svelte.ts` or `.svelte.js` filenames but
  are imported through a `.svelte` runtime specifier. MAID currently strips
  only the final TypeScript/JavaScript suffix from the declared file while
  stripping `.svelte` from the import, producing different identities. The
  canonical identity must strip the full compound state-module suffix so both
  forms resolve to the same project-relative module.

  Python hook scripts may have hyphenated, non-importable filenames and be
  loaded through the established `load_module(module_name, relative_path)`
  test helper. MAID sees later `module.function()` calls but loses the file
  identity at the helper assignment, making module-level functions impossible
  to cover without weakening E200. Add one deliberately narrow syntactic
  binding for this helper shape: both arguments must be string literals, the
  path must name a non-importable `.py` module, and the normalized path stem
  must match the supplied legal runtime module name. This avoids broader
  control-flow interpretation while retaining a file-bound identity.

  This is an additive chain evolution over the existing TypeScript/Svelte
  module-path and Python identity contracts. Public signatures remain
  unchanged. Existing name-only, unrelated-module, import-only, and importable
  Python identity guards remain authoritative.
temptations:
- risk: Do not make `.svelte` imports match every `.svelte.*` path by prefix or basename alone.
  instead: Canonicalize only the supported `.svelte.ts` and `.svelte.js` compound suffixes before the existing project-relative identity comparison.
- risk: Do not restore unrestricted name-only fallback for functions in non-importable Python files.
  instead: Bind the module alias to the literal declared script path and keep the existing identity matcher unchanged.
- risk: Do not implement general helper-function dataflow or Python control-flow interpretation.
  instead: Recognize only the literal `load_module(module_name, relative_path)` assignment shape with matching normalized stem and non-importable `.py` path.
- risk: Do not accept an unrelated or misspelled dynamic-loader module name merely because the path ends in `.py`.
  instead: Require the legal runtime module name to equal the hyphen-to-underscore normalized script stem and cover mismatches with a negative test.
- risk: Do not prove only parser internals while leaving E200 integration broken.
  instead: Pair direct public resolver/collector tests with end-to-end behavioral validation reproductions for both downstream reports.
