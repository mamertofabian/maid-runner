      args:
      - name: tmp_path
        type: Path
      returns: None
      description: When `state.ts` and `state.svelte.ts` coexist, the extensionless `state` module continues to select the ordinary TypeScript entry.
    - kind: test_function
      name: test_hyphenated_python_loader_rejects_non_assignment_shapes
      args: []
      returns: None
      description: Inline calls, walrus expressions, and extra-argument loader calls do not acquire a path-backed module identity.
