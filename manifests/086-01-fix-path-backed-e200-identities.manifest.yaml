      description: Tsconfig aliases and barrel re-exports targeting `.svelte` resolve to the canonical `.svelte.ts` state-module identity.
    - kind: test_function
      name: test_svelte_state_module_alias_and_barrel_imports_satisfy_e200
      args:
      - name: tmp_path
        type: Path
      - name: monkeypatch
