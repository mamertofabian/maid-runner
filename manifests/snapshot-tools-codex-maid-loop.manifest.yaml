      type: Path
    - kind: attribute
      name: stdout_jsonl_path
      description: Path to the saved stdout JSONL stream log
      of: ClaudeRunResult
      type: Path
    - kind: attribute
      name: files
      description: Exact files to stage for the READY implementation commit
      of: CommitPacket
      type: list[str]
    - kind: attribute
      name: message
      description: Commit message requested by the READY implementation pass
      of: CommitPacket
      type: str
    - kind: class
      name: ClaudeRunResult
      description: Captured result paths and metadata for one Claude Code pass
    - kind: class
      name: CommitPacket
      description: Parsed READY commit message and exact file list
    - kind: function
      name: ask_commit_approval
      description: Require a per-pass typed approval before committing a READY packet
        when auto-commit is disabled
      args:
      - name: pass_number
        type: int
      - name: status
        type: str
      returns: bool
    - kind: function
      name: build_implementation_command
      description: Build a fresh Claude Code command whose prompt names the selected
        draft manifest batch for this pass
      args:
      - name: claude
        type: str
      - name: selected_drafts
        type: list[Path]
      - name: model
        type: str
      - name: effort
        type: str
      - name: permission_mode
        type: str
      returns: list[str]
    - kind: function
      name: build_parser
      description: Expose --batch-size as the explicit multi-draft-per-pass opt-in
      returns: argparse.ArgumentParser
    - kind: function
      name: commit_ready_changes
      description: Stage and commit a READY packet after approval or opt-in auto-commit
      args:
      - name: packet
        type: CommitPacket
      returns: int
    - kind: function
      name: find_implementable_drafts
      description: Return non-epic draft MAID manifests that remain to be implemented
      args:
      - name: draft_dir
        type: Path
      returns: list[Path]
    - kind: function
      name: git_status_short
      description: Return `git status --short` output for worktree preflight
      returns: str
    - kind: function
      name: main
      description: Claude loop entry point keeps its CLI behavior while delegating
        shared logic to tools/maid_loop_core.py and consuming failure packets.
      args:
      - name: argv
        type: list[str] | None
        default: None
      returns: int
    - kind: function
      name: parse_automation_status
      description: Extract the final AUTOMATION_STATUS marker from Claude Code output
      args:
      - name: final_message
        type: str
      returns: str | None
    - kind: function
      name: parse_commit_packet
      description: Extract a commit message and explicit file list from a READY final
        message
      args:
      - name: final_message
        type: str
      returns: CommitPacket | None
    - kind: function
      name: render_claude_stream_event
      description: Render Claude Code task_started, task_progress, and task_notification
        payload fields concisely
      args:
      - name: event
        type: dict[str, Any]
      - name: state
        type: dict[str, Any]
      - name: color_enabled
        type: bool
      returns: str
    - kind: function
      name: run_claude_stream_command
      description: Run one Claude Code stream-json session while saving and rendering
        output
      args:
      - name: args
        type: list[str]
      - name: stdout_jsonl_path
        type: Path
      - name: stderr_path
        type: Path
      - name: final_message_path
        type: Path
      returns: ClaudeRunResult
    - kind: function
      name: run_loop
      description: Reject READY packets that omit any dirty post-run worktree path
        before prompting, auto-committing, staging, or committing.
      args:
      - name: args
        type: argparse.Namespace
      returns: int
    - kind: function
      name: stage_commit_packet_files
      description: Reject invalid, directory, absolute, parent-traversal, and missing-untracked
        packet paths before staging exact existing or tracked-deleted files.
      args:
      - name: files
        type: list[str]
      returns: int
