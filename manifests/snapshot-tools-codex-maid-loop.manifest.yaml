    - kind: function
      name: agent_provenance_env
      description: 'Pure ground-truth mapping for spawned codex sessions: exactly
        MAID_AGENT_MODEL=model, MAID_AGENT_REASONING_EFFORT=reasoning_effort, MAID_AGENT_PROVIDER="openai",
        MAID_AGENT_CLIENT="codex-cli"; no os.environ access.'
      args:
      - name: model
        type: str
      - name: reasoning_effort
        type: str
      returns: dict[str, str]
    - kind: function
      name: ask_commit_approval
      description: Require a per-pass typed approval before committing a READY packet
        when auto-commit is disabled
      args:
      - name: pass_number
        type: int
      - name: status
        type: str
      returns: bool
    - kind: function
      name: build_implementation_command
      description: Unchanged signature; the returned prompt string now instructs the
        implementing agent to source outcome.agent model and reasoning_effort from
        the MAID_AGENT_* env ground truth instead of self-description.
      args:
