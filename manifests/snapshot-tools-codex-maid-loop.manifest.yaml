  scope:
  - path: maid_runner/core/manifest.py
    reason: Add the new optional AgentProvenance field to private Outcome parsing
      and omission-preserving serialization without changing the public load/save
      signatures.
  - path: maid_runner/core/outcomes.py
    reason: Carry the optional field through private Outcome-index serialization and
      legacy parsing without changing the public index API.
  - path: maid_runner/core/plan_lock.py
    reason: Carry the optional field through private advisory lock payload serialization
      and fail-closed parsing outside hashes and enforcement decisions.
  - path: maid_runner/cli/commands/plan.py
    reason: Extend private provenance composition, status payload formatting, and
      text display for the new CLI field without changing command signatures.
  - path: maid_runner/cli/commands/evaluate.py
    reason: Include the optional field in private evaluate-report serialization while
      leaving comparison keys unchanged.
  - path: .codex/skills/maid-implementation-review/SKILL.md
    reason: Keep the Codex source payload aligned with the Claude review guidance
      before sanctioned packaging sync copies it into the Codex distribution payload.
  - path: docs/agent-retry-protocol.md
    reason: Preserve ownership of a private-only writable path during chain merge.
  - path: AGENTS.md
    reason: Preserve ownership of a private-only writable path during chain merge.
  - path: maid_runner/codex/skills/maid-runner-draft-implement/SKILL.md
    reason: Preserve ownership of a private-only writable path during chain merge.
  - path: docs/manifest-outcome-records.md
    reason: Preserve ownership of a private-only writable path during chain merge.
  - path: maid_runner/docs/manifest-outcome-records.md
    reason: Preserve ownership of a private-only writable path during chain merge.
  - path: maid_runner/claude/skills/maid-implementation-review/SKILL.md
    reason: Preserve ownership of a private-only writable path during chain merge.
  - path: maid_runner/codex/skills/maid-implementation-review/SKILL.md
    reason: Preserve ownership of a private-only writable path during chain merge.
