# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Snapshot of tools/codex_maid_loop.py
type: snapshot
files:
  create:
  - path: tools/maid_loop_core.py
    artifacts:
    - kind: attribute
      name: files
      of: CommitPacket
      type: list[str]
    - kind: attribute
      name: message
      of: CommitPacket
      type: str
    - kind: attribute
      name: attempts
      of: RetryLoopResult
      type: int
    - kind: attribute
      name: escalated
      of: RetryLoopResult
      type: bool
    - kind: attribute
      name: final_packet
      of: RetryLoopResult
      type: dict | None
    - kind: attribute
      name: success
      of: RetryLoopResult
      type: bool
    - kind: class
      name: CommitPacket
      description: Parsed READY commit message and exact file list, shared by both
        loop tools.
    - kind: class
      name: RetryLoopResult
      description: 'Outcome of a bounded retry loop run: attempts used, success, escalation,
        and the final failure packet if any.'
    - kind: function
      name: ask_commit_approval
      description: Require a per-pass typed approval before committing a READY packet.
      args:
      - name: pass_number
        type: int
      - name: status
        type: str
      returns: bool
    - kind: function
      name: commit_ready_changes
      description: Stage and commit a READY packet after approval.
      args:
      - name: packet
        type: CommitPacket
      - name: root
        type: Path
      returns: int
    - kind: function
      name: find_implementable_drafts
      description: Return sorted non-epic draft MAID manifests that remain to be implemented.
      args:
      - name: draft_dir
        type: Path
      returns: list[Path]
    - kind: function
      name: git_status_short
      description: Return `git status --short` output for worktree preflight.
      args:
      - name: root
        type: Path
      returns: str
    - kind: function
      name: parse_automation_status
      description: Extract the final AUTOMATION_STATUS marker from an agent's final
        message.
      args:
      - name: final_message
        type: str
      returns: str | None
    - kind: function
      name: parse_commit_packet
      description: Extract the commit message and explicit file list from a READY
        final message; last complete packet wins.
      args:
      - name: final_message
        type: str
      returns: CommitPacket | None
    - kind: function
      name: read_failure_packet
      description: Read and parse the failure packet JSON written by a failed gate
        run; return None for a missing or unreadable packet.
      args:
      - name: path
        type: Union[str, Path]
      returns: dict | None
    - kind: function
      name: run_bounded_retry_loop
      description: 'Drive the documented loop contract: run gate, on failure read
        packet and hand it to the next attempt, re-run, stop and escalate with the
        final packet after max_attempts.'
      args:
      - name: run_gate
        type: Callable[[], int]
      - name: run_attempt
        type: Callable[[dict | None], str]
      - name: packet_path
        type: Union[str, Path]
      - name: max_attempts
        type: int
        default: '5'
      returns: RetryLoopResult
    - kind: function
      name: stage_commit_packet_files
      description: Stage the exact existing or tracked-deleted files named by a READY
        packet; refuse absolute or parent-relative paths.
      args:
      - name: files
        type: list[str]
      - name: root
        type: Path
      returns: int
  - path: tests/ci/test_maid_loop_core.py
    artifacts:
    - kind: test_function
      name: test_agent_retry_protocol_document_names_packet_cycle_and_escalation
      source_scenario: A maintainer reads the documented retry protocol.
      actions:
      - type: api_call
        subject:
          function: Path.read_text
      expected:
        behavior: The document specifies running gates with --packet, reading the
          packet, applying next_action-guided fixes, rerunning, defaulting to five
          attempts, and escalating to a human with the final packet.
    - kind: test_function
      name: test_bounded_retry_loop_escalates_after_default_attempt_bound
      source_scenario: The MAID gate continues to fail after every retry attempt.
      actions:
      - type: api_call
        subject:
          function: run_bounded_retry_loop
      expected:
        behavior: The loop stops after the default bound of five attempts and returns
          escalated=True with the final packet.
    - kind: test_function
      name: test_bounded_retry_loop_passes_packet_to_attempt_and_records_outcomes
      source_scenario: A gate fails, writes a failure packet, then passes after the
        agent attempt consumes that packet.
      actions:
      - type: api_call
        subject:
          function: run_bounded_retry_loop
      expected:
        behavior: The loop reads the packet, passes it to the next attempt callable,
          records per-attempt outcomes, and returns a successful RetryLoopResult.
    - kind: test_function
      name: test_bounded_retry_loop_stops_immediately_when_gate_passes
      source_scenario: The first MAID gate run passes before any agent retry is needed.
      actions:
      - type: api_call
        subject:
          function: run_bounded_retry_loop
      expected:
        behavior: The loop returns success without invoking the attempt callable or
          reading stale packet state.
    - kind: test_function
      name: test_discovery_excludes_epic_drafts
      source_scenario: The automation loop discovers implementable draft manifests
        before starting a pass.
      actions:
      - type: api_call
        subject:
          function: find_implementable_drafts
      expected:
        behavior: Only non-epic `.manifest.yaml` drafts are returned, sorted by path.
    - kind: test_function
      name: test_git_commit_helpers_delegate_through_public_commit_packet
      source_scenario: A READY packet names safe repository-relative paths and commit
        approval is requested for a pass.
      actions:
      - type: api_call
        subject:
          function: git_status_short
      - type: api_call
        subject:
          function: commit_ready_changes
      - type: api_call
        subject:
          function: ask_commit_approval
      expected:
        behavior: Git helpers run in the supplied root, commit_ready_changes stages
          only packet files before committing, and typed approval accepts only `commit`.
    - kind: test_function
      name: test_read_failure_packet_returns_dict_or_none
      source_scenario: The retry loop reads the packet emitted by a failed MAID gate.
      actions:
      - type: api_call
        subject:
          function: read_failure_packet
      expected:
        behavior: Valid packet JSON is returned as a dict, while missing or unreadable
          packet files return None.
    - kind: test_function
      name: test_stage_commit_packet_files_rejects_unsafe_paths
      source_scenario: A READY packet names absolute or parent-relative paths.
      actions:
      - type: api_call
        subject:
          function: stage_commit_packet_files
      expected:
        behavior: The staging helper refuses unsafe paths without invoking git.
    - kind: test_function
      name: test_status_and_commit_packet_parsing_preserves_existing_protocol
      source_scenario: An agent final message contains automation status and READY
        commit packet markers.
      actions:
      - type: api_call
        subject:
          function: parse_automation_status
      - type: api_call
        subject:
          function: parse_commit_packet
      expected:
        behavior: The last valid AUTOMATION_STATUS is selected, the last complete
          commit packet wins, and malformed packets are rejected.
  - path: tests/core/test_reasoning_effort_provenance.py
    artifacts:
    - kind: test_function
      name: test_outcome_agent_round_trips_reasoning_effort
      description: "load_manifest/save_manifest round-trip an outcome.agent reasoning_effort\
        \ losslessly and omission-preservingly \u2014 absent field emits no key."
      returns: None
    - kind: test_function
      name: test_outcome_index_round_trips_reasoning_effort
      description: build/write/read of the outcome index carries agent reasoning_effort;
        pre-provenance index files load with None.
      returns: None
    - kind: test_function
      name: test_plan_lock_round_trips_reasoning_effort_and_legacy_loads_none
      description: A lock saved with reasoning_effort loads it back; pre-existing
        lock payloads without the field load with reasoning_effort None; lock verification
        results are identical with and without the field.
      returns: None
    - kind: test_function
      name: test_reasoning_effort_without_model_warns_and_drops
      description: reasoning_effort input without model yields provenance None plus
        the labeled model-required warning, never silent loss.
      returns: None
    - kind: test_function
      name: test_resolver_reads_reasoning_effort_from_env_fallback
      description: A model flag plus MAID_AGENT_REASONING_EFFORT env yields the env
        value with source 'mixed'; env-only input yields source 'environment'.
      returns: None
    - kind: test_function
      name: test_resolver_reads_reasoning_effort_from_flags
      description: resolve_agent_provenance with model and reasoning_effort flags
        yields provenance carrying the exact reasoning_effort with source 'flags'.
      returns: None
    - kind: test_function
      name: test_schema_accepts_reasoning_effort_and_rejects_unknown_fields
      description: validate_manifest_schema accepts a reasoning_effort string, rejects
        an empty string, and still rejects unknown agent keys.
      returns: None
  - path: tests/cli/test_plan_lock_reasoning_effort_cmd.py
    artifacts:
    - kind: test_function
      name: test_plan_lock_stores_reasoning_effort_from_env
      description: With MAID_AGENT_MODEL and MAID_AGENT_REASONING_EFFORT env set,
        the stored agent carries reasoning_effort with source 'environment'.
      returns: None
    - kind: test_function
      name: test_plan_lock_stores_reasoning_effort_from_flag
      description: maid plan lock --agent-model --agent-reasoning-effort stores reasoning_effort
        on the lock agent payload.
      returns: None
    - kind: test_function
      name: test_plan_status_reports_reasoning_effort
      description: plan status --json includes reasoning_effort inside the agent object
        when set and omits the key when absent; text mode mentions it only when present.
      returns: None
  - path: tests/ci/test_codex_loop_agent_provenance_env.py
    artifacts:
    - kind: test_function
      name: test_agent_provenance_env_returns_ground_truth_mapping
      description: agent_provenance_env('gpt-5.5', 'medium') equals exactly the four-key
        MAID_AGENT_* mapping with provider 'openai' and client 'codex-cli'.
      returns: None
    - kind: test_function
      name: test_implementation_prompt_instructs_env_sourced_outcome_agent
      description: The prompt string returned by build_implementation_command instructs
        sourcing outcome.agent model and reasoning_effort from MAID_AGENT_* env ground
        truth rather than self-description.
      returns: None
    - kind: test_function
      name: test_run_codex_json_command_injects_extra_env_into_child
      description: Running a stub executable through run_codex_json_command with extra_env
        makes the child process observe the injected MAID_AGENT_* values; without
        extra_env they are absent.
      returns: None
  - path: tests/test_exact_model_provenance_docs.py
    artifacts:
    - kind: test_function
      name: test_outcome_docs_document_reasoning_effort_and_exact_model_rule
      description: docs/manifest-outcome-records.md and the packaged copy document
        reasoning_effort, MAID_AGENT_REASONING_EFFORT, and the client-ground-truth-over-self-report
        preference order, and the two copies stay in sync.
      returns: None
    - kind: test_function
      name: test_review_skill_instructs_env_sourced_outcome_agent
      description: The .claude maid-implementation-review source and both packaged
        copies instruct env-sourced outcome.agent capture with the exact-slug-plus-reasoning_effort
        rule.
      returns: None
