      and shell wrappers bypassed the Node guard after relabeling as Vitest. Added regressions,
      declared existing shell-target wiring, refreshed lock revision3 with implementation
      stashed, and fixed both.'
  - source: independent-node_vitest_final_review
    severity: ready
    summary: Fresh read-only reviewer found no blockers; independently reran default
