# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Bind dynamically path-loaded Python hook functions to their declared file identity
type: fix
created: '2026-10-20T22:50:06Z'
description: 'Recognize the reported standard path-loader wrapper as a deliberately narrow syntax pattern,
  preserving exact file identity through existing module-alias recording. Supported helper: unique module-level
  undecorated zero-argument function with exactly spec = trusted importlib.util.spec_from_file_location(literal
  runtime label, bounded path), module = trusted module_from_spec(spec), spec.loader.exec_module(module),
  return module. Do not infer arbitrary helper behavior/control flow, execute loader code in the validator,
  or use the runtime label as file identity. Bounded paths are literal Python file paths and pathlib.Path(__file__)
  with argument-free resolve, parent/constant parents indexing, literal / joins, optionally a unique unchanged
  module-level root constant. Reuse existing imported-name identity/shadowing and alias events; reject
  unsupported expressions, helper/root rebinding, local helper shadowing, decorated/extra-statement helpers
  and shadowed loader/Path imports. An unrelated same-named hook loaded from another file must retain
  E200. Cover direct public collector identity and public behavioral validation after real fixture pytest
  execution, including unittest methods and bound hook access. Existing public signatures, normal import_module/literal
  custom loader behavior, scope/reference behavior and name-fallback policy remain unchanged. Resolve
  helper loader/Path/root names in its module-global binding context, never borrow caller-local imports
  or reject valid helper globals because of caller-local shadows. No general reachability or static evaluator.
  Initial inventory recall had no related records; hardened-scope recall returned fix-python-annotation-only-type-references
  and 086-01-fix-path-backed-e200-identities. Apply their restrict-syntax-before-identity and downstream-positive/wrong-module-shadow-negative
  lessons. Annotation-only type evidence and other language identity compatibility are irrelevant to this
  runtime loader pattern and do not expand scope. Source and packaged specs stay synchronized. Review
  hardening: anchor __file__ ancestry to the absolute source path and require target containment in the
  project; reject module-rebound or globally writable __file__, and conservatively reject globally writable
  loader/Path imports. FoundArtifact has no independent source-path field. Preserve exact Python file-path
  identity for dotted filename/directory components through the existing PythonValidator.module_path hook
  and the loader reference producer; normal package paths retain their existing module identities. This
  distinguishes gunicorn.conf.py from gunicorn/conf.py in both directions without new core fields, schema
  changes, resolver fallback or changes to ordinary imports. Include ordinary-package compatibility, misleading
  package import and outside-ancestry controls. Public validation fixtures execute real pytest; separate
  public collector-only negatives cover paths escaping to filesystem root without creating external files.
  Reject multiply-bound loader/Path import dependencies even when a final import restores them, because
  root constants may have captured earlier values; do not reconstruct binding-time execution. Route the
  existing literal load_module path-backed seam through the same exact file identity so supported hyphenated
  files under dotted directories retain compatibility, without adding new loader syntax or weakening its
  existing checks. Exact file identity applies to interior dots within Python filesystem components, not
  a leading hidden-directory dot alone. Preserve the durable sys.path import compatibility for hidden
  .codex/.claude and hyphenated skill directories; these do not collide with ordinary package separators.
  Keep existing behavioral coverage fixtures unchanged and add public hidden-skill import/producer compatibility
  controls.'
temptations:
- risk: Treat the runtime module label or same hook name as exact loaded-file identity.
  instead: Derive identity only from the bounded standard loader path; unrelated same-name file and misleading
    runtime label controls must retain E200.
- risk: Grow general helper/control-flow evaluation or trust shadowed imports to make the report pass.
  instead: Use only the documented four-statement standard wrapper and bounded Path forms, existing binding/alias
    machinery, and explicit unknown/shadow/rebind/decorator negatives. Execute fixture tests genuinely,
    but never execute source in validation.
