outcome:
  status: completed
  completed_at: "2026-08-10T07:36:46Z"
  summary: "Assessed handoff verification now keeps every static, scope, plan-lock, and red-evidence gate repository-wide while running only changed active manifests' test commands. The exact handoff gate fell from 237.62 seconds to 23.10 seconds (about 10.3x faster). Explicit repository scope still runs every active manifest command, and unresolved task baselines fail closed to full tests with a visible E708 warning."
  rationale: "Profiling showed that static validation and existing in-process caches were already effective; 96.2% of baseline verify time was in the tests stage. Narrowing only the handoff test-command inventory removes unrelated test work without caching results or weakening validation. A separate broad pytest sharding experiment was removed after it changed test outcomes, preserving full repository/deep semantics."
  lessons:
    - lesson_type: performance
      summary: "Task-level selection is the safe high-leverage optimization when static gates are fast and repository tests dominate wall time; cross-invocation test caching is unnecessary and riskier."
      tags:
        - verify
        - task-scope
        - performance
      paths:
        - maid_runner/cli/commands/verify.py
        - maid_runner/core/verify_profiles.py
    - lesson_type: anti-gaming
      summary: "An unresolved optimized scope must visibly widen to the complete test inventory rather than becoming an empty or silent success."
      tags:
        - fail-closed
        - E708
        - test-selection
      paths:
        - maid_runner/cli/commands/verify.py
        - tests/cli/test_verify_task_scoped_tests_stage.py
    - lesson_type: performance
      summary: "File-target subprocess sharding is unsafe until test-file independence is proven; executing every target once does not preserve process-local fixtures, caches, or ordering semantics."
      tags:
        - pytest
        - parallelism
        - rejected-experiment
      paths:
        - manifests/drafts/121-02-shard-broad-pytest-batches-across-test-jobs.manifest.yaml
  review_notes:
    - source: implementation-review
      severity: P1
      summary: "Initial review found unresolved task baselines silently widened test execution; fixed by attaching a visible E708 tests-stage warning while running the full repository inventory."
    - source: implementation-review
      severity: P2
      summary: "Final review required end-to-end proof of explicit repository override; the revised test invokes the real CLI and proves the batched command contains both active manifests' test targets."
    - source: implementation-re-review
      severity: ready
      summary: "Independent re-review returned ready with no findings and confirmed no gate weakening or residual runtime sharding code."
    - source: assessed-deep-gate
