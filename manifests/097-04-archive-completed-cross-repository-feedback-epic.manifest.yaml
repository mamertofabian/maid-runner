description: |
  Children 097-01, 097-02, and 097-03 now have completed Outcomes and together
  deliver every implementation child named by the split-before-promote roadmap:
  privacy-bounded local export, fail-closed local aggregation, and governed
  reproduction/routing into MAID Runner self-improvement. The roadmap must no
  longer present itself as live planning work.

  Preserve `manifests/drafts/097-00-cross-repository-maid-feedback.epic.yaml`
  at its stable path as a concise `# archive-kind: consumed-draft-epic` pointer.
  Set `metadata.status: archived`, retain the privacy and no-transport boundary,
  list the three promoted child manifests in `files.read`, and state that the
  archived epic must not be promoted or implemented. Network submission,
  telemetry, automatic issue creation, and automatic self-modification remain
  separate future specifications rather than implied follow-ups.

  Evolve the shared archive inventory test so 097 appears in `CONSUMED_EPICS`
  with exactly its three children and disappears from `LIVE_PLANNING_EPICS`.
  That shared test is already hashed by the 082-06, 095-05, and 097-01 plan
  locks. Each currently carries valid red evidence with unchanged validation
  commands, so after implementation reconcile those historical contracts with
  `maid plan revise <manifest> --reason <reason> --preserve-red-evidence`.
  If preservation is rejected because evidence or commands no longer match,
  stop for a plan revision rather than hand-editing lock JSON or weakening the
  assertions.

  Outcome evidence informed this narrow closure: prior planning-hygiene lessons
  require stable archive pointers instead of deletion, exact promoted-child
  inventories, and synchronized historical locks when shared tests evolve.
  The refreshed Outcome index was used through plain deterministic insights;
  stale enrichment narrative was not read.

  Out of scope: changes to the three completed child manifests or Outcomes,
  feedback CLI behavior, feedback schemas, remote transport, release versioning,
  tagging, publishing, and cleanup of unrelated live or historical epics.
temptations:
- risk: Do not delete the 097 epic file after all children complete.
  instead: Preserve its stable path as an archived pointer with exact links to
    097-01 through 097-03.
- risk: Do not leave 097 in live planning inventory after changing only its
    prose or status.
  instead: Replace the draft marker, set archived status, register the exact
    child list in CONSUMED_EPICS, and remove 097 from LIVE_PLANNING_EPICS.
- risk: Do not treat the completed local feedback loop as authorization for
    remote submission or automatic self-modification.
  instead: Retain the no-transport and advisory-only boundary in the archive
    pointer and leave expansion to a separate specification.
- risk: Do not hand-edit or ignore historical plan locks after changing their
    shared behavioral test.
  instead: After the archive test passes, use maid plan revise
    --preserve-red-evidence for 082-06, 095-05, and 097-01 while their existing
    evidence and validation commands remain valid; stop if preservation rejects
    any lock.
