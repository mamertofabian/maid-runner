          args: []
  edit:
    - path: maid_runner/core/artifact_coverage.py
      artifacts:
        - kind: class
          name: EvidenceArtifactCoverageResult
          description: "Per-manifest reports plus exact fallback identities used during fail-closed evaluation."
        - kind: attribute
          name: reports
          of: EvidenceArtifactCoverageResult
          type: Mapping[str, ArtifactCoverageReport]
        - kind: attribute
          name: fallback_identities
          of: EvidenceArtifactCoverageResult
          type: tuple[RuntimeCommandIdentity, Ellipsis]
        - kind: attribute
          name: complete
          of: EvidenceArtifactCoverageResult
          type: bool
          description: "True only when every relevant command was evaluated from current complete runtime evidence without exact-command fallback."
        - kind: function
          name: evaluate_artifact_coverage_from_evidence
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: evidence
              type: RuntimeEvidenceBundle
            - name: fallback_executor
              type: RuntimeCommandExecutor | None
              default: "None"
          returns: EvidenceArtifactCoverageResult
          description: "Evaluates proven contexts and executes affected exact commands whenever evidence is incomplete."
