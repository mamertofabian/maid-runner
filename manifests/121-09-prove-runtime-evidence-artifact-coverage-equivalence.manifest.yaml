# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Prove evidence-derived artifact coverage reports equal the legacy exact-command gate"
type: refactor
created: "2026-08-11T08:22:51Z"
metadata:
  status: implementation-ready
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - artifact-coverage
    - runtime-evidence
    - equivalence
description: |
  Consume 121-08 evidence in the artifact-coverage core without changing CLI
  stage execution yet. For each manifest command, include only node contexts
  selected by its immutable command identity plus fixture/collection contexts
  with proven attribution and equivalent lifecycle. Consumer closure alone is
  insufficient when grouping changes fixture multiplicity, state, order, or
  yield teardown. Missing selectors, any wider/autouse/dynamic or otherwise
  unproven fixture lifecycle, ambiguous collection execution, lost workers,
  unsupported commands, content changes, or resolved-environment identity
  changes execute that affected exact legacy command; they never produce an
  empty clean report.

  Runtime collection must also detect consumer session-finish hooks before
  tracing stops. Any project-owned hook that may execute after the final test
  has no proven exact-command ownership, so the plugin marks that session-tail
  context unresolved and the evaluator executes each affected exact command.

  Compare evidence and legacy findings, E710/E900 errors, suggestions, and
  deterministic JSON on honest, missing, failing, fixture-heavy, and
  collection-heavy fixtures. The optimized call count must collapse compatible
  groups while fallback call counts remain exact. No verify orchestration may
  consume this evaluator until these equivalence tests are green.
temptations:
  - risk: "Do not union every context into every manifest report."
    instead: "Filter through exact command identities and proven node/fixture/collection consumer maps."
  - risk: "Do not infer fixture-lifecycle equivalence from a complete consumer map."
    instead: "Require proven-identical lifecycle multiplicity/state/order/teardown or execute the affected exact command."
  - risk: "Do not call an incomplete bundle a missing artifact without checking the legacy command."
    instead: "Execute only the affected exact command through the production executor and expose the fallback identity."
  - risk: "Do not compare only success booleans."
    instead: "Compare findings, error codes/messages/suggestions, command attribution, and normalized JSON."
  - risk: "Do not hide fallback work when claiming the 297-to-one reduction."
    instead: "Return fallback command identities and assert optimized and fail-closed call counts separately."
