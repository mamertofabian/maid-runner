# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Snapshot of maid_runner/cli/commands/plan.py
type: snapshot
files:
  create:
  - path: maid_runner/core/plan_lock.py
    artifacts:
    - kind: attribute
      name: artifacts_added
      description: Declared-artifact identities present in the new contract but not
        the prior, sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: artifacts_removed
      description: Declared-artifact identities present in the prior contract but
        not the new, sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: files_added
      description: Section-qualified file entries added, e.g. 'edit:path', 'create:path',
        'read:path', sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: files_removed
      description: Section-qualified file entries removed, sorted; the section prefix
        lets consumers treat read drops as neutral.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: validate_commands_added
      description: Normalized validate commands added, sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: validate_commands_removed
      description: Normalized validate commands removed, sorted.
      of: ContractDelta
      type: tuple[str, ...]
    - kind: attribute
      name: baseline_commit
      description: Resolved Git HEAD commit containing the pre-existing manifest.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: baseline_manifest_hash
      description: Hash of the committed pre-migration manifest bytes.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: baseline_manifest_source
      description: Identifies whether baseline_manifest_hash was captured from the
        HEAD manifest blob or the staged index blob.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: captured_at
      description: UTC timestamp of the migration evidence capture.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: commands
      description: Current validate-command results, all classified not_red with exit
        code zero.
      of: LegacyBaselineEvidence
      type: tuple[RedPhaseCommandEvidence, ...]
    - kind: attribute
      name: contract_delta
      description: Structured committed-to-current contract delta retained for audit.
      of: LegacyBaselineEvidence
      type: ContractDelta
    - kind: attribute
      name: reason
      description: Required human explanation for using the legacy migration path.
      of: LegacyBaselineEvidence
      type: str
    - kind: attribute
      name: agent
      description: Provenance of the agent that created revision 1; None when not
        captured or for pre-provenance locks.
      of: PlanLock
      type: Optional[AgentProvenance]
    - kind: attribute
      name: created_at
      of: PlanLock
      type: str
    - kind: attribute
      name: legacy_baseline
      description: Separate audited legacy-baseline payload; None for ordinary and
        pre-feature locks.
      of: PlanLock
      type: Optional[dict]
    - kind: attribute
      name: manifest_hash
      of: PlanLock
      type: str
    - kind: attribute
      name: manifest_path
      of: PlanLock
      type: str
    - kind: attribute
      name: red_evidence
      of: PlanLock
      type: dict | None
    - kind: attribute
      name: revision
      of: PlanLock
      type: int
    - kind: attribute
      name: revisions
      of: PlanLock
      type: tuple[PlanLockRevision, ...]
    - kind: attribute
      name: test_hashes
      of: PlanLock
      type: dict[str, str]
    - kind: attribute
      name: lock_path
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: manifest_path
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: manifest_slug
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: recovery_command
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: test_hash_matches
      of: PlanLockDependent
      type: bool
    - kind: attribute
      name: test_path
      of: PlanLockDependent
      type: str
    - kind: attribute
      name: agent
      description: Provenance of the agent that made this revision; None when not
        captured.
      of: PlanLockRevision
      type: Optional[AgentProvenance]
    - kind: attribute
      name: contract_delta
      description: The stored delta for this revision; None for pre-delta revisions
        and when the prior contract was unavailable.
      of: PlanLockRevision
      type: Optional[ContractDelta]
    - kind: attribute
      name: prior_manifest_hash
      of: PlanLockRevision
      type: str
    - kind: attribute
      name: prior_test_hashes
      of: PlanLockRevision
      type: dict[str, str]
    - kind: attribute
      name: reason
      of: PlanLockRevision
      type: str
    - kind: attribute
      name: revised_at
      of: PlanLockRevision
      type: str
    - kind: attribute
      name: classification
      of: RedPhaseCommandEvidence
      type: str
    - kind: attribute
      name: command
      of: RedPhaseCommandEvidence
      type: str
    - kind: attribute
      name: exit_code
      of: RedPhaseCommandEvidence
      type: int
    - kind: attribute
      name: output_tail
      of: RedPhaseCommandEvidence
      type: str
    - kind: attribute
      name: captured_at
      of: RedPhaseEvidence
      type: str
    - kind: attribute
      name: commands
      of: RedPhaseEvidence
      type: tuple[RedPhaseCommandEvidence, ...]
    - kind: attribute
      name: red
      of: RedPhaseEvidence
      type: bool
    - kind: class
      name: ContractDelta
      description: 'Frozen dataclass: deterministic set-difference between two locked
        manifest contracts, stored per revision as advisory evidence.'
    - kind: class
      name: LegacyBaselineEvidence
      description: Audited green-baseline evidence for a tracked manifest that predates
        plan-lock adoption.
    - kind: class
      name: PlanLock
      description: Tamper-evident per-manifest plan lock record stored at .maid/plan-locks/<manifest-slug>.lock.json.
    - kind: class
      name: PlanLockDependent
      description: Immutable public record describing one active manifest lock that
        pins the queried behavioral test.
    - kind: class
      name: PlanLockRevision
      description: One immutable revision history entry holding the prior hashes,
        revision timestamp, and non-empty reason.
    - kind: class
      name: RedPhaseCommandEvidence
      description: 'Per-command red-phase record: command string, exit code, 20-line
        output tail, derived classification.'
    - kind: class
      name: RedPhaseEvidence
      description: Aggregate red-phase evidence captured by maid plan lock/revise.
    - kind: function
      name: capture_legacy_baseline_evidence
      description: Capture legacy green evidence from a tracked HEAD manifest or,
        for first-commit brownfield adoption, an identical staged manifest whose declared
        implementation and behavioral tests already exist cleanly at HEAD.
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: reason
        type: str
      returns: LegacyBaselineEvidence
    - kind: function
      name: capture_red_phase_evidence
      description: Run the manifest's validate commands via the shared command execution
        helper and record per-command evidence.
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      returns: RedPhaseEvidence
    - kind: function
      name: classify_red_exit_code
      description: Exit 1 -> red; exit 0 -> not_red; exits 2/3/4/5 and any other nonzero
        exit -> invalid. Exit codes are the only classification input.
      args:
      - name: exit_code
        type: int
      returns: str
    - kind: function
      name: compute_behavioral_test_hash
      description: Writes sha256-pyast:v2 for parseable UTF-8 Python and sha256 byte
        hashes for other suffixes; raises instead of silently degrading.
      args:
      - name: path
        type: Path
      returns: str
    - kind: function
      name: compute_contract_delta
      description: Pure sorted set-difference over two persisted contract payloads;
        no reason parsing, no policy.
      args:
      - name: prior_contract
        type: dict
      - name: new_contract
        type: dict
      returns: ContractDelta
    - kind: function
      name: compute_manifest_contract_hash
      description: "Intentional evolution of the 085-03 contract \u2014 normalizes\
        \ date/datetime values to isoformat strings and non-string mapping keys to\
        \ their normalized string form before JSON canonicalization per pinned rule\
        \ 7, raising ValueError naming the manifest for any other non-JSON-native\
        \ value; prefix, exclusion boundary, and existing hashes are unchanged."
      args:
      - name: manifest_path
        type: Path
      returns: str
    - kind: function
      name: create_plan_lock
      description: Stores the current versioned compute_behavioral_test_hash result;
        public signature remains unchanged.
      args:
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: agent
        type: Optional[AgentProvenance]
      returns: PlanLock
    - kind: function
      name: default_plan_lock_path
      description: Return .maid/plan-locks/<manifest-slug>.lock.json under the project
        root.
      args:
      - name: project_root
        type: Path
      - name: manifest_slug
        type: str
      returns: Path
    - kind: function
      name: enforce_plan_locks
      description: Accepts mode test_only_green payloads as satisfying require_red_evidence
        only under the persisted-contract test-only bound re-derived on every call;
        all other payload and error semantics unchanged. Signature unchanged.
      args:
      - name: chain
        type: ManifestChain
      - name: project_root
        type: Path
      - name: require_plan_lock
        type: bool
      - name: require_red_evidence
        type: bool
      - name: changed_paths
        type: Collection[str] | None
        default: None
      - name: plan_lock_scope
        type: str
        default: repository
      returns: tuple[ValidationError, ...]
    - kind: function
      name: find_plan_lock_dependents
      description: Resolve one in-project test path and return every active readable
        lock that pins it, failing loudly on an unreadable active lock that must be
        inspected.
      args:
      - name: chain
        type: ManifestChain
      - name: project_root
        type: Path
      - name: test_path
        type: str | Path
      returns: tuple[PlanLockDependent, Ellipsis]
    - kind: function
      name: manifest_hash_matches
      description: Prefix-dispatched comparison supporting legacy sha256 byte hashes
        and sha256-contract hashes; unknown prefixes and missing files return False.
      args:
      - name: lock_hash
        type: str
      - name: manifest_path
        type: Path
      returns: bool
    - kind: function
      name: revise_plan_lock
      description: Re-locks current hashes and revision history, retaining an existing
        legacy_baseline only when requested and still valid for the new command contract;
        fresh-evidence callers explicitly replace it.
      args:
      - name: existing
        type: PlanLock
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: reason
        type: str
      - name: agent
        type: Optional[AgentProvenance]
        default: None
      - name: prior_contract
        type: Optional[dict]
        default: None
      - name: preserve_legacy_baseline
        type: bool
        default: 'True'
      returns: PlanLock
    - kind: function
      name: revision_preserves_red_evidence
      description: Returns true only for internally consistent red/test-only evidence
        whose contract and behavioral tests remain unchanged; ordinary red command
        payloads must bind classification to exit code through the existing consistency
        validator.
      args:
      - name: existing
        type: PlanLock
      - name: manifest_path
        type: Path
      - name: project_root
        type: Path
      - name: prior_contract
        type: dict | None
      returns: bool
    - kind: function
      name: test_hash_matches
      description: Fail-closed prefix dispatch for sha256-pyast:v2, historical sha256-pyast
        v1, and sha256 byte hashes.
      args:
      - name: lock_hash
        type: str
      - name: path
        type: Path
      returns: bool
    - kind: method
      name: to_payload
      description: Serialize an explicitly typed legacy_baseline payload without claiming
        red evidence.
      of: LegacyBaselineEvidence
      returns: dict
    - kind: method
      name: load
      description: Load a lock file; fail closed when the file exists but is corrupt,
        unreadable, or malformed.
      of: PlanLock
      args:
      - name: path
        type: Path
      returns: PlanLock
    - kind: method
      name: save
      description: Writes validate_commands into the _manifest_contract snapshot alongside
        artifacts and test_files.
      of: PlanLock
      args:
      - name: path
        type: Path
      returns: None
    - kind: method
      name: to_payload
      description: Serialize the evidence into the JSON payload stored in PlanLock.red_evidence.
      of: RedPhaseEvidence
      returns: dict
  - path: tests/cli/test_plan_cmd_stash_implementation.py
    artifacts:
    - kind: test_function
      name: test_docs_describe_stash_implementation_revise_workflow
      source_scenario: A reader checks the MAID docs for the supported review-driven
        plan-revise recovery workflow.
      actions:
      - type: api_call
        subject:
          export: Path
      expected:
        behavior: Docs name --stash-implementation, distinguish it from --preserve-red-evidence,
          and mention behavioral tests and implementation changes.
    - kind: test_function
      name: test_revise_parser_exposes_stash_implementation
      source_scenario: A planner needs a concrete CLI option for review-driven contract
        changes after implementation is present.
      actions:
      - type: api_call
        subject:
          function: build_parser
      expected:
        behavior: The plan revise parser accepts --stash-implementation and sets stash_implementation
          true.
    - kind: test_function
      name: test_stash_implementation_allows_current_lock_dirty
      source_scenario: The current task's existing plan lock is uncommitted while
        a target implementation file is also dirty.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command allows the current lock path to be dirty, does not stash
          it, restores implementation changes, and records valid red evidence.
    - kind: test_function
      name: test_stash_implementation_allows_matching_active_manifest_marker
      source_scenario: A promoted implementation session has a dirty declared implementation
        path and an untracked `.maid/active-manifest` marker pointing at the manifest
        being revised.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The revise succeeds, captures valid red evidence, restores the implementation
          path, leaves the active marker intact, and leaves no stash entry behind.
    - kind: test_function
      name: test_stash_implementation_allows_matching_promoted_draft_deletion
      source_scenario: A normal promote-then-implement workflow leaves a tracked `manifests/drafts/<slug>.manifest.yaml`
        deletion next to the promoted `manifests/<slug>.manifest.yaml` while implementation
        changes are dirty.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The revise succeeds, captures valid red evidence, restores the implementation
          path, preserves the draft deletion, and leaves no stash entry behind.
    - kind: test_function
      name: test_stash_implementation_ignores_clean_missing_create_targets
      source_scenario: A manifest has a dirty declared edit path and an absent declared
        create path that is not part of the implementation delta yet.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command stashes only dirty target paths, succeeds without passing
          the absent create path to Git, restores the dirty edit path, and leaves
          the create path absent.
    - kind: test_function
      name: test_stash_implementation_invalid_red_evidence_names_command_details
      description: Invalid red-evidence capture reports the validate command, exit
        code, classification, and bounded output tail without revising the lock.
    - kind: test_function
      name: test_stash_implementation_preserves_stash_when_validate_dirties_target
      source_scenario: A validate command writes to a stashed target implementation
        path before MAID restores the implementation stash.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before saving the lock, leaves the original
          lock bytes unchanged, and preserves the MAID-created stash for manual recovery
          instead of overwriting validation-written target changes.
    - kind: test_function
      name: test_stash_implementation_recaptures_red_evidence_and_restores_tracked_change
      source_scenario: A tracked declared implementation file makes the revised behavioral
        test green, but the pre-fix tracked version remains red.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Revision succeeds, lock evidence is valid red, the implementation
          file is restored, and no stash entry remains.
    - kind: test_function
      name: test_stash_implementation_rejects_conflicting_revise_modes
      source_scenario: A user combines --stash-implementation with --no-run or --preserve-red-evidence.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Each conflicting mode exits 2 and leaves the lock unchanged.
    - kind: test_function
      name: test_stash_implementation_rejects_different_active_manifest_marker
      source_scenario: A dirty active-task marker points at a different manifest while
        the current manifest also has dirty implementation changes.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before stashing, leaves the lock unchanged,
          preserves the implementation and active marker contents, and leaves no stash
          entry behind.
    - kind: test_function
      name: test_stash_implementation_rejects_green_stashed_state_without_revising_lock
      description: Not-red capture reports the validate command, exit code, classification,
        and bounded output tail without revising the lock.
    - kind: test_function
      name: test_stash_implementation_rejects_matching_draft_modification
      source_scenario: The matching source draft path is modified rather than deleted
        while the promoted manifest has dirty implementation changes.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before stashing, leaves the lock unchanged,
          preserves the modified draft contents and implementation contents, and leaves
          no stash entry behind.
    - kind: test_function
      name: test_stash_implementation_rejects_staged_different_active_marker
      source_scenario: The active-task marker has a staged value for a different manifest
        and a worktree value for the current manifest while implementation changes
        are dirty.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before stashing, leaves the lock unchanged,
          preserves the implementation and active marker contents, and leaves no stash
          entry behind.
    - kind: test_function
      name: test_stash_implementation_rejects_staged_matching_draft_add_then_delete
      source_scenario: The matching source draft path is staged as a new file and
        deleted from the worktree while the promoted manifest has dirty implementation
        changes.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before stashing, leaves the lock unchanged,
          preserves the staged draft/worktree deletion state and implementation contents,
          and leaves no stash entry behind.
    - kind: test_function
      name: test_stash_implementation_rejects_staged_matching_draft_modification_then_delete
      source_scenario: The matching source draft path has a staged modification and
        a worktree deletion while the promoted manifest has dirty implementation changes.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before stashing, leaves the lock unchanged,
          preserves the staged draft/worktree deletion state and implementation contents,
          and leaves no stash entry behind.
    - kind: test_function
      name: test_stash_implementation_rejects_unrelated_dirty_paths_before_stashing
      source_scenario: The worktree contains unrelated dirty user work while a target
        implementation file is also dirty.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before stashing, leaves implementation changes
          restored, leaves no stash entry, and leaves the lock bytes unchanged.
    - kind: test_function
      name: test_stash_implementation_rejects_unrelated_draft_deletion
      source_scenario: A different tracked draft manifest deletion is present while
        the current manifest has dirty implementation changes.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before stashing, leaves the lock unchanged,
          preserves the unrelated draft deletion and implementation contents, and
          leaves no stash entry behind.
    - kind: test_function
      name: test_stash_implementation_rejects_validate_mutated_behavioral_test
      source_scenario: A validate command rewrites a behavioral test after the stash-backed
        revise has hidden implementation changes and captured red evidence.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command exits 2 before saving the lock, leaves the original
          lock bytes unchanged, restores implementation changes, and leaves no MAID-created
          stash entry behind.
    - kind: test_function
      name: test_stash_implementation_restores_original_when_validate_creates_new_stash
      source_scenario: A validate command creates another stash after MAID creates
        its targeted implementation stash.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command restores and drops the exact MAID-created stash by identity,
          leaves the validate-created stash intact, restores implementation changes,
          and records valid red evidence.
    - kind: test_function
      name: test_stash_implementation_restores_untracked_declared_create_file
      source_scenario: An untracked declared create-path implementation file makes
        validation green after review adds contract metadata.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Revision succeeds with red evidence captured while the create-path
          is stashed, then restores the untracked implementation file.
  - path: tests/cli/test_plan_cmd_stash_scope_targets.py
    artifacts:
    - kind: test_function
      name: test_stash_implementation_recaptures_red_evidence_and_restores_scope_only_change
      source_scenario: A manifest declares a dirty implementation route only in files.scope
        because it has no public artifact contract.
      actions:
      - type: api_call
        subject:
          export: cmd_plan_revise
      expected:
        behavior: The command accepts the dirty files.scope path, stashes it while
          capturing red evidence, restores it, and leaves no MAID stash behind.
    - kind: test_function
      name: test_stash_implementation_rejects_dirty_read_only_path_with_scope_target
      source_scenario: A manifest has a dirty files.scope implementation target and
        a separate dirty files.read context file.
      actions:
      - type: api_call
        subject:
          export: cmd_plan_revise
      expected:
        behavior: The command rejects the dirty files.read-only path before stashing
          while preserving all dirty work.
  - path: tests/cli/test_stash_revise_files_read_targets.py
    artifacts:
    - kind: test_function
      name: test_stash_revise_counts_files_read_targets_for_dirty_guard
      source_scenario: A locked manifest whose only dirty declared path is a files.read
        wiring entry.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command's dirty-target guard treats the declared files.read
          path as stashable per the decision recorded in plan review, instead of failing
          with the misleading no-dirty-implementation-paths error while the read path
          stays dirty.
    - kind: test_function
      name: test_stash_revise_keeps_backslash_files_read_test_visible
      source_scenario: A revised manifest declares its behavioral test under files.read
        with Windows-style backslashes while the tightened test file is dirty.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The behavioral test path is normalized before test-file classification,
          so the test remains visible during red capture instead of being rejected
          as unrelated dirt or stashed as an implementation target.
    - kind: test_function
      name: test_stash_revise_never_stashes_test_files_declared_under_files_read
      source_scenario: A revised manifest adversarially lists its behavioral test
        file under files.read while that test file is dirty with the tightened assertions.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The behavioral test file is not stashed, remains visible during
          red capture, and the captured evidence reflects the tightened tests rather
          than a pre-review green state.
    - kind: test_function
      name: test_stash_revise_restores_files_read_changes_after_capture
      source_scenario: The same wiring scenario, inspecting the worktree after the
        command returns.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The files.read path's dirty content is restored byte-identical after
          evidence capture, on success and on refused-capture failure paths alike.
    - kind: test_function
      name: test_stash_revise_stashes_dirty_declared_files_read_wiring_path
      source_scenario: A locked manifest declares an implementation file under files.edit
        and a wiring file under files.read; both are dirty with implementation-era
        edits, and review tightened the behavioral tests (reproduction of the 2026-06-30
        life-dashboard report).
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The revise succeeds, red evidence is captured with both the writable
          and the files.read edits hidden, and the lock records valid red evidence
          instead of refusing the dirty read path.
    - kind: test_function
      name: test_stash_revise_still_refuses_undeclared_dirty_paths
      source_scenario: A dirty path that appears in no section of the revised manifest,
        alongside the declared dirty targets.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: The command refuses with the unrelated-dirty-path error, leaves
          the lock unchanged, and the error text names files.read declaration as the
          sanctioned way to include a wiring path.
  - path: maid_runner/core/agent_provenance.py
    artifacts:
    - kind: attribute
      name: provenance
      description: The resolved provenance, or None when nothing usable was provided.
