      actions:
      - type: api_call
        subject:
          function: cmd_manifest
      expected:
        behavior: Promotion succeeds and preserves the exact original red evidence
          rather than overwriting it with the now-green post-activation result.
    - kind: test_function
      name: test_promote_recaptures_when_locked_validate_commands_changed
      source_scenario: A draft's validate command changes after valid red evidence
        was locked, then ordinary promotion runs.
      actions:
      - type: api_call
        subject:
          function: cmd_manifest
      expected:
        behavior: The stale evidence is not preserved; promotion recaptures evidence
