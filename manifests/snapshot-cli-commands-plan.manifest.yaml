      name: ProvenanceResolution
      description: "Frozen dataclass: the outcome of resolving provenance inputs \u2014\
        \ resolved provenance or an explicit human-readable warning, never a silent\
        \ drop."
    - kind: function
      name: resolve_agent_provenance
      description: flag_values gains a "reasoning_effort" key with MAID_AGENT_REASONING_EFFORT
        env fallback; per-field flags-win merge, flags/environment/mixed source semantics,
        and the model-required visible-drop advisory are unchanged.
