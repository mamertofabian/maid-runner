    - kind: test_function
      name: test_promote_recaptures_when_self_referencing_validate_path_is_rewritten
      source_scenario: Promotion rewrites a locked validate command from its self-referencing
        draft path to the active manifest path.
      actions:
      - type: api_call
        subject:
          function: cmd_manifest
      expected:
        behavior: Promotion recaptures evidence for the rewritten active-path command
