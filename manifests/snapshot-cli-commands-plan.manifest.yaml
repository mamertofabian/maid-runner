    - kind: test_function
      name: test_revision_preservation_rejects_inconsistent_red_command_payload
      source_scenario: A direct preservation check receives forged red evidence whose
        exit code is zero but classification is red.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: The shared public predicate returns false because the serialized
          command payload is internally inconsistent.
    - kind: test_function
      name: test_revision_preservation_rejects_spliced_special_mode_commands
      source_scenario: Shape-valid stash-restoration and test-only-green evidence
        carries command text that differs from the persisted contract snapshot.
      actions:
      - type: api_call
        subject:
          function: revision_preserves_red_evidence
      expected:
        behavior: The shared predicate rejects command-spliced evidence in both sanctioned
          special modes.
    - kind: test_function
      name: test_revision_preservation_requires_consistent_test_only_commands
      source_scenario: Test-only-green evidence is checked with a valid command, a
