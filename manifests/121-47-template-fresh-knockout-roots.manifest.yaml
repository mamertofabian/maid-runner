outcome:
  status: completed
  completed_at: "2026-08-17T16:31:24Z"
  summary: Template-backed knockout workers now clone every mutation into a distinct disposable source and Git root without repeatedly scanning live repository and dependency state.
  rationale: |
    Each retained worker captures one immutable, never-executed source/Git
    template and one isolated dependency environment, then clones a fresh root
    for every declaration. The batch supplies its complete required-path union
    before capture, repository-only drift participates in persistent cache
    identity, and source/repository/dependency drift remains fail-closed.
    Editable metadata is rebound for each fresh root, while Python bytecode
    remains declaration-local after independent review reproduced stale
    editable-finder bytecode from a worker-wide prefix.

    Evidence: the focused contract passed 8 tests; the inherited snapshot,
    worker, batch, and cache suite passed 72 tests; implementation validation
    passed; all 268 active manifests validated; maid test passed 297 of 297
    commands; Black, Ruff, and git diff checks passed; and the final independent
    implementation review returned ready with no findings.

    A 40-minute release-baseline deep sample advanced 109 durable knockout
    checkpoints with bounded roots and no live-snapshot convoy, but throughput
    remained close to the prior run. Focused profiling showed the remaining
    dominant multiplier is the unchanged green-red-green lifecycle: each of
    487 mutations still launches the same command three times. That is the next
    optimization boundary; this contract intentionally did not weaken it.
  lessons:
    - lesson_type: performance
      summary: Immutable worker templates remove repeated repository capture, but end-to-end knockout throughput remains dominated by three command executions per mutation; share exact command controls rather than further weakening snapshot isolation.
      tags: [performance, knockout, deep-verify, command-grouping]
      paths:
        - maid_runner/core/_knockout_snapshot.py
        - maid_runner/core/knockout.py
        - docs/plans/full-and-deep-verification-performance-redesign.md
    - lesson_type: validation-trust
      summary: A retained Python bytecode prefix is unsafe when editable-loader source is rewritten between equal-length disposable roots because timestamp-and-size-valid pyc files can target a deleted prior root.
      tags: [bytecode, editable-install, snapshot-isolation, fail-closed]
      paths:
        - maid_runner/core/_knockout_snapshot.py
        - tests/core/test_knockout_snapshot_template.py
  review_notes:
    - source: template_snapshot_rev4_review
      severity: warning
      summary: Independent review reproduced stale editable-loader bytecode across equal-length declaration roots; revision 5 restored declaration-local pycache isolation and added the regression contract.
    - source: template_snapshot_rev4_review
      severity: ready
      summary: Final revision 6 review found no remaining findings; lock, contract prose, behavioral test, and implementation agree.
