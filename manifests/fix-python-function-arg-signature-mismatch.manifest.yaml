  rationale: "The false negative came from silent skips on missing names during name-based comparison. Emitting E303 closes that gap; collecting kwonlyargs and flattening nested Unions prevents newly visible false positives against keyword-only and BitOr annotations; skipping method self/cls preserves receiver-stripping semantics."
