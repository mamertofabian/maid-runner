        - tests/core/test_plan_lock_post_run_mutation_guard.py
    - lesson_type: test-discrimination
      summary: >-
        A write-only mutation test did not discriminate deletion behavior. The
        independent review forced a deletion case that reproduced the missed
        path and proved the sentinel fix.
      tags:
