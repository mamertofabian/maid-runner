      summary: >-
        The pre-run and post-run guards intentionally use different git scopes:
        the former is project-relative eligibility, while the latter is
        repository-relative runtime mutation evidence. Keeping those namespaces
        explicit avoids undoing the earlier subdirectory path fix.
      tags:
