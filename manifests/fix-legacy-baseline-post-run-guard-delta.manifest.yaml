        - tests/cli/test_plan_legacy_baseline_cmd.py
      status: passed
      summary: >-
        25 focused legacy-baseline tests passed, including sibling write,
        sibling deletion, and pre-existing sibling dirt scenarios.
    - command:
        - uv
        - run
        - maid
        - validate
        - manifests/fix-legacy-baseline-post-run-guard-delta.manifest.yaml
        - --mode
        - behavioral
        - --quiet
      status: passed
      summary: Behavioral validation passed for the promoted manifest.
    - command:
        - uv
        - run
