  lessons:
    - lesson_type: anti-gaming
      summary: >-
        Delta checks over dictionaries need explicit absence semantics. Treating
        a dirty deleted file and a missing snapshot key as the same None value
        allowed a command-induced deletion to pass through a repository-wide
        mutation guard.
      tags:
        - plan-lock
        - legacy-migration
        - dirty-tree
      paths:
