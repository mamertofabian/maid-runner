    - git-history
    - yaml-round-trip
    - manifest-promotion
    paths:
    - maid_runner/cli/commands/manifest.py
  - lesson_type: test-design
    summary: Round-trip YAML tests need semantic and presentation assertions together; comments and scalar styles alone missed inherited merge-key status, while parsed metadata assertions plus a real cached Git diff exposed both lifecycle and history regressions.
    tags:
    - behavioral-tests
    - yaml-merge
    - git-rename
    paths:
    - tests/cli/test_manifest_promote_git_rename_cmd.py
