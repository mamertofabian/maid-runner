  summary: "Added deterministic risk-v1 coverage recommendations while preserving legacy-v1 as the default."
  rationale: "The model scores incomplete MAID states from explainable coverage, blast-radius, change, complexity, and test-evidence signals, with batch history and conservative uncertainty."
  lessons:
