# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Add a deterministic risk-v1 coverage recommender with repository-wide history
  and dependency indexes while preserving legacy bootstrap ranking"
type: feature
created: "2026-07-31T00:01:16Z"
metadata:
  epic: 092-00-coverage-priority-recommender
  tags:
    - adoption
    - bootstrap
    - coverage-risk
    - performance
  priority: high
description: |
  Add `maid bootstrap --rank --model risk-v1` as an additive alternative to
  the existing 061-04 raw ordering. `legacy-v1` remains the default and its
  text and JSON output stay unchanged.

  risk-v1 candidates come from the same file-tracking classification as
  `maid files`: undeclared files score 30 coverage points, writable manifest
  files with no artifacts score 22, read-only registrations score 14, and
  fully tracked/scope-only files are excluded. Test files are never candidates.

  The pinned 100-point model uses:

  - blast 25: direct production inbound references 9*S(n,20), unique reverse
    transitive dependents through three levels 6*S(n,100), entrypoint
    reachability 4, and public artifacts 6*S(n,20);
  - change pressure 20: 90-day commits 5*S(n,12), 365-day commits 3*S(n,30),
    365-day added/deleted lines 6*S(n,2000), active months 3*min(n/12,1), and
    recency 3*2^(-days/90);
  - complexity 15: production-repository percentiles for logical lines 4,
    decisions 4, largest definition 3, public artifacts 2, plus parse
    uncertainty 2;
  - test/evidence gap 10: no test dependency/reference 4, no acceptance
    artifact reference 3, and no relevant validation command 3.

  S(x, cap)=min(1, log1p(x)/log1p(cap)). Percentiles use average ranks mapped
  to 0..1, with a one-item population at 0.5. Unknown or demonstrably
  incomplete measurements have normalized_value null, contribute at least
  half the affected cap, and lower the recommendation confidence.

  Priority bands are critical 80+, high 60+, medium 35+, low below 35.
  Ordering is priority, score descending, then path ascending. Explain on a
  fully tracked file returns an eligible=false explanation rather than a score.
  Missing/out-of-root paths fail. The CLI adds --model and --explain; --deep is
  reserved for 092-03 and fails visibly until configured there.

  Git history is collected by one repository-wide `git log --numstat
  --find-renames --since=365.days` process. Each source file is parsed once
  into separate production and test dependency graphs; inbound and transitive
  counts are then edge-index operations. Standard Python project scripts and
  package.json main/bin paths are entrypoints.

  Outcome recall highlighted that parser registration, defaults, handler
  behavior, and JSON parity must be exercised through the real CLI main path,
  not direct handler tests alone.
temptations:
  - risk: "Do not count test imports as production blast radius."
    instead: "Build separate production and test dependency graphs and use the test
      graph only as test evidence."
  - risk: "Do not launch git log per candidate or compare every importer to every
      candidate."
    instead: "Build one repository history index and one import-edge index, then derive
      candidate metrics from those indexes."
  - risk: "Do not turn parse, validator, shallow-history, or unresolved-import failures
      into zero-valued safe-looking signals."
    instead: "Emit null normalized evidence, use the pinned half-cap conservative
      contribution, and lower confidence."
  - risk: "Do not change legacy-v1 output while adding model selection."
    instead: "Dispatch legacy-v1 through rank_bootstrap_candidates and its existing
      formatter unchanged."
