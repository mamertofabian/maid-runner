# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Show a valid manifest and a real maid verify refusal in the homepage hero
type: feature
created: '2026-10-08T14:56:17Z'
metadata:
  planning_state: completed
  tags:
  - website
  - hero
  - content
  - evidence
  priority: high
description: |
  The 2026-10-08 Impeccable re-critique's second P1: the hero's manifest.yaml
  mock is the first artifact a developer reads, and MAID would reject it. It
  is not even parseable YAML ("used once" continues a list item without
  quoting), it uses a `behavior:` key and an empty `edit:` that the v2 schema
  does not define, and it has no `validate:`. The terminal panel claims an
  "Independent review" check that no maid command performs, shows only green
  ticks (the user chose to "show the refusal"), and at 820-1001px the
  overlapping panels cover manifest code and the status bar.

  Rework the hero preview in website/index.html and website/styles.css:
  - The manifest panel shows a trimmed Python manifest that parses as YAML and
    passes maid_runner.core.manifest.validate_manifest_schema: schema "2", a
    goal, type feature, files.edit for src/auth/service.py declaring
    reset_password with args and returns in block form (so every line
    fits a 320px phone), and a pytest validate command. Each code line holds its real indentation as literal spaces
    (white-space: pre) so the rendered text is the YAML.
  - The terminal panel is the literal output of `maid verify --summary --since
    main` run against that manifest. A plan review ran the real CLI and showed
    that an undeclared changed file is refused by file_tracking (verify is
    fail-fast and file_tracking runs before worktree_scope), not by E114, and
    that plan_lock only runs with --require-plan-lock. So the transcript is:
    run 1 refused (VERIFY: FAIL, BLOCKING (1), FAIL file_tracking, Undeclared
    (1): src/auth/session.py, Tracked (1): src/auth/service.py, PASSED (4)),
    `$ rm src/auth/session.py`, then run 2 passing (VERIFY: PASS ...,
    PASSED (8): schema, behavioral, implementation, coherence, file_tracking,
    worktree_scope, changed_scope, tests). Only the timing-dependent
    "Duration:" lines and blank lines are trimmed. HANDOFF READY stays as the
    result badge after the transcript, not as command output. The old tick
    rows, including "Independent review", are removed.

  Contract design: tests/test_website_hero_refusal.py makes the hero true by
  construction. It writes the page's own manifest YAML into a scratch git repo
  (main branch base, feature branch with the implementation and a stray file
  named by the page's `$ rm` line), runs the real CLI twice, and requires the
  page transcript to equal the trimmed real output line for line, so invented
  stages, counts, glyphs, or wording cannot pass. A headless geometry test,
  with pointer-events forced back on, requires every text line in both panels
  to be visible (opacity, visibility, transparent color), inside its own panel,
  on screen, not under the other panel, and hit-testable, with the rendered
  manifest lines identical to the authored YAML, at 320, 360, 390, 820,
  1001, 1440, and 1920px.

  The locked strings other contracts assert on the homepage stay present
  ("manifest.yaml", "maid validate", "HANDOFF READY"); "maid validate" remains
  in the practice section's as-of line. Additive chain-merge onto the active
  website contract (website-distill-why-section, website-install-trust,
  website-polish-practice-mobile, website-dated-practice-stats); supersedes
  nothing. The rendered type floor and pinned media conditions in
  tests/test_website_rendered_typography.py still apply.

  After implementation, rerun `uv run python scripts/update_practice_stats.py` so
  the MAID in practice numbers include this change (they are refused, not
  reused, if any run fails).
temptations:
- risk: Do not hand-write or tidy the verify transcript, or add stages, counts, glyphs, or ticks that
    the real run did not print.
  instead: Copy the trimmed output of maid verify --summary --since main from a scratch run of the page's
    manifest; the real-run test regenerates it and must match line for line.
- risk: Do not show YAML that differs from what renders, or hide code lines behind a visible fake manifest.
  instead: Put the manifest's literal text, with real indentation, in the code elements; the geometry
    test compares rendered lines to the authored YAML.
- risk: Do not fix the panel overlap by shrinking code below the 12px floor, by pointer-events tricks,
    or by hiding or clipping text.
  instead: Lay the panels out as an offset stack (full width on phones) so every line is visible inside
    its own panel at every checked width.
- risk: Do not refuse a file the manifest declares, which would make the refusal false.
  instead: Refuse a sibling file (src/auth/session.py) that appears in no files section of the hero manifest.
files:
  scope:
  - path: website/index.html
    reason: Hero manifest panel markup and the maid verify transcript panel.
  - path: website/styles.css
    reason: Literal-space code lines, refusal and pass styling, and a non-overlapping hero panel layout
      at every breakpoint.
  - path: website/data/practice-stats.json
    reason: Refreshed by scripts/update_practice_stats.py after this change, so the published counts include
      this change's tests and manifest; the script also rewrites the mirrored numbers in website/index.html.
  create:
  - path: tests/test_website_hero_refusal.py
    artifacts:
    - kind: test_function
      name: test_hero_manifest_passes_the_real_v2_schema
      args: []
      returns: None
    - kind: test_function
      name: test_hero_transcript_is_a_real_maid_verify_run
      args:
      - name: tmp_path
        type: Path
      returns: None
    - kind: test_function
      name: test_hero_refusal_names_a_file_the_manifest_does_not_declare
      args: []
      returns: None
    - kind: test_function
      name: test_hero_panels_show_all_their_text_without_overlap
      args: []
      returns: None
  read:
  - maid_runner/core/manifest.py
  - maid_runner/cli/commands/_format.py
  - maid_runner/cli/commands/verify.py
  - maid_runner/schemas/manifest.v2.schema.json
validate:
- uv run python -m pytest -q tests/test_website_hero_refusal.py tests/test_website_static_contract.py
  tests/test_website_rendered_typography.py tests/test_website_distilled_story.py tests/test_practice_stats_update.py
- uv run maid validate manifests/website-hero-real-refusal.manifest.yaml --mode behavioral --quiet
- uv run maid validate manifests/website-hero-real-refusal.manifest.yaml --mode schema --quiet
