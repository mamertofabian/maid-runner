    - lesson_type: validation
      summary: "Geometry beats hit-testing for overlap checks. pointer-events: none, z-index: auto (NaN comparisons), opacity, transparent color, and text-indent all defeated elementFromPoint-only checks. The final test forces pointer-events back on, checks visibility with opacity and visibility properties, color alpha, containment in the panel and viewport, and rect intersection with the other panel."
      tags:
        - playwright
        - test-quality
      paths:
        - tests/test_website_hero_refusal.py
    - lesson_type: responsive
