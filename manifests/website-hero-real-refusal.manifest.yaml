  summary: "The homepage hero now shows a manifest MAID accepts and the gate refusing work. The manifest panel is a 15-line Python manifest that passes the v2 schema: files.edit for src/auth/service.py declaring reset_password with args and returns, plus a pytest validate command. The terminal is the literal trimmed output of maid verify --summary --since main for that manifest: refused by file_tracking for an undeclared src/auth/session.py, then rm, then VERIFY: PASS with eight real stages, then the HANDOFF READY badge. The invented tick rows, including 'Independent review', are gone, and the panels stack with an offset, so no text is covered at 320-1920px. Practice stats were refreshed afterwards to 706 / 5587 / 312."
  rationale: "The re-critique's second P1: the first artifact a developer read was a manifest MAID would reject, beside a terminal claiming a check no command runs. The user chose to show the refusal. To keep the hero honest over time, the contract regenerates the transcript from a real CLI run of the page's own manifest rather than describing it."
