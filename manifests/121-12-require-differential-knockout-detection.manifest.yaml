validate:
  - uv run python -m pytest -q tests/core/test_knockout_differential_detection.py tests/core/test_knockout_batch.py tests/core/test_knockout.py tests/cli/test_verify_knockout_differential_cmd.py tests/cli/test_verify_knockout_cmd.py
  - uv run maid validate manifests/121-12-require-differential-knockout-detection.manifest.yaml --mode schema --quiet
outcome:
  status: completed
  completed_at: "2026-08-12T00:11:10Z"
  summary: "Knockout verification now requires a green baseline, a mutation-caused red result, and a green restored control. Runtime evidence narrows compatible pytest commands to the nodeids that execute each artifact, while incomplete, stale, ambiguous, or inconclusive evidence falls back to the exact declared command without weakening E711/E712 failures, legacy declaration ordering, dirty-file refusal, or byte-exact restoration."
  rationale: "A mutant-only failure could be a pre-existing test failure rather than proof that tests detect the artifact. Three-point differential execution establishes causality and lets trustworthy runtime evidence avoid replaying broad commands for every mutation. The implementation fails closed on baseline drift, command exceptions, restored-control mutation, stale evidence, and unavailable focused attribution."
  lessons:
    - lesson_type: design
      summary: "Mutation detection is causal only when the same command is green before mutation, red for the mutant, and green again after byte-exact restoration; any other transition must fail closed or use exact fallback."
      tags: [knockout, differential-testing, fail-closed]
      paths:
        - maid_runner/core/knockout.py
        - tests/core/test_knockout_differential_detection.py
    - lesson_type: testing
      summary: "Source-mutating gates need adversaries for CRLF bytes, baseline and restored-control writes or deletions, command exceptions, stale evidence, mixed manifest chains, and failed recovery, because ordinary green/red fixtures do not prove restoration integrity."
      tags: [byte-integrity, behavioral-testing, regression-testing]
      paths:
        - maid_runner/core/knockout.py
        - tests/core/test_knockout_differential_detection.py
        - tests/cli/test_verify_knockout_differential_cmd.py
    - lesson_type: performance
      summary: "Runtime evidence must be projected to manifests that actually own knockout targets before freshness validation; unrelated attribute-only manifests otherwise reject valid focused evidence and force expensive exact replay."
      tags: [runtime-evidence, knockout, performance]
      paths:
        - maid_runner/core/knockout.py
        - tests/cli/test_verify_knockout_differential_cmd.py
    - lesson_type: performance
      summary: "The measured deep run took 1,890.40 seconds and never reached knockout because serialized exact artifact-coverage fallback consumed the run before failing on 1,784 repository-wide E710 findings; isolated parallel coverage fallback remains the next dominant optimization target."
      tags: [deep-verify, artifact-coverage, performance]
      paths:
        - maid_runner/core/artifact_coverage.py
        - manifests/drafts/121-15-parallelize-isolated-artifact-coverage-fallbacks.manifest.yaml
  review_notes:
    - source: review_121_12_implementation
      severity: warning
      summary: "Initial review found that restored-control commands could alter the target, text-mode restoration normalized CRLF bytes, and stale runtime evidence could be accepted; the implementation added raw-byte recovery and currentness checks."
    - source: review_121_12_implementation
      severity: warning
      summary: "Second review found mixed-chain evidence rejection, LF-only mutation rewriting, and unrecovered restored-control deletion; revision 7 added relevant-manifest evidence projection, newline-preserving mutation, and verified recovery for deletion and exception paths."
    - source: review_121_12_implementation
      severity: ready
      summary: "Final independent review found no blocking issues; focused differential proof, exact fallback, CRLF restoration, mixed-chain projection, and E712 recovery all matched the locked contract."
  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/core/test_knockout_differential_detection.py, tests/core/test_knockout_batch.py, tests/core/test_knockout.py, tests/cli/test_verify_knockout_differential_cmd.py, tests/cli/test_verify_knockout_cmd.py]
      status: passed
      summary: "All 49 declared differential, batch, legacy, and CLI verification tests passed in 14.53s."
    - command: [uv, run, maid, validate, manifests/121-12-require-differential-knockout-detection.manifest.yaml, --mode, implementation]
      status: passed
      summary: "Implementation validation passed against plan-lock revision 8 after binding the final reviewed adversarial-test hashes."
    - command: [uv, run, maid, validate, manifests/121-12-require-differential-knockout-detection.manifest.yaml, --mode, behavioral]
      status: passed
      summary: "Behavioral validation passed against the approved contract and red evidence."
    - command: [uv, run, maid, test, --manifest, manifests/121-12-require-differential-knockout-detection.manifest.yaml]
      status: passed
      summary: "Both declared manifest command groups passed."
    - command: [uv, run, maid, validate, --quiet]
      status: passed
      summary: "Repository-wide manifest validation passed."
    - command: [uv, run, maid, test, --json]
      status: passed
      summary: "All 254 active manifest test command groups passed."
    - command: [uv, run, maid, verify, --profile, deep, --require-plan-lock, --require-red-evidence, --since, 71b959b8014c8ec7fcd2c71f3294b7ba48f4eb0c]
