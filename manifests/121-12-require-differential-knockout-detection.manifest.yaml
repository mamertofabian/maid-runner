      summary: "The exact assessed deep command completed in 1,890.40s with schema, behavioral, and implementation stages passing, then failed at the pre-existing repository-wide artifact-coverage gate with 1,784 E710 findings; serialized exact coverage fallback dominated the run and knockout was not reached."
    - command: [uv, run, ruff, check, maid_runner/core/knockout.py, tests/core/test_knockout_differential_detection.py, tests/cli/test_verify_knockout_differential_cmd.py]
      status: passed
      summary: "Focused Ruff and Black checks passed, and git diff check was clean before Outcome capture."
