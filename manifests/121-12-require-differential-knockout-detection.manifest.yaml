      reason: "Pass invocation-scoped runtime evidence to the batch knockout engine without changing public verify signatures or flags."
    - path: maid_runner/cli/commands/_format.py
      reason: "Render the report's public differential proof consistently in text while JSON continues to use KnockoutReport.to_dict()."
    - path: tests/core/test_knockout.py
      reason: "Update existing engine fixtures from mutant-only exit stubs to explicit baseline, mutant, and restored controls without weakening their rewrite, dirty-state, ordering, or restoration assertions."
    - path: tests/core/test_knockout_batch.py
      reason: "Update 121-11 batch characterizations that invoke the evolved public runner so their executor fixtures distinguish baseline, mutant, and restored source states while preserving the planning assertions."
    - path: README.md
      reason: "Document mutation-caused differential detection and exact fallback without contracting prose as code artifacts."
    - path: docs/maid_specs.md
      reason: "Update the canonical knockout semantics after maid-evolver hardening."
    - path: docs/troubleshooting.md
      reason: "Explain baseline, focused-proof, and fallback diagnostics."
    - path: maid_runner/docs/maid_specs.md
      reason: "Synchronize the packaged canonical specification."
    - path: .maid/docs/maid_specs.md
      reason: "Synchronize the repository-installed canonical specification."
