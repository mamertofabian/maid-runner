# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Require mutation-caused differential evidence and use focused nodes only as positive knockout proof"
type: refactor
created: "2026-08-11T23:05:57Z"
supersedes:
  - 068-02-add-artifact-knockout-harness
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags:
    - performance
    - knockout
    - validation-hardening
    - runtime-evidence
description: |
  Current knockout treats any nonzero validate command as mutation detection,
  including an unrelated pre-existing failure. Strengthen the gate while
  reducing work: runtime contexts may propose nodes that executed the artifact,
  but a focused run counts only after the same controlled serial execution shape proves
  unmutated green, mutant red, then restored green. It is positive differential
  proof, not evidence that any other node is irrelevant.

  When the focused candidate passes, is flaky/incomplete, has fixture/order or
  collection ambiguity, observes a subprocess without contexts, or cannot be
  restored green, execute the original command baseline and mutant forms. A
  baseline-failing original command is a blocking harness diagnostic, never
  mutation detection. Source/AST inspection, collection hooks, fixtures,
  ordering, and subprocess observers are adversarially tested to prove they
  reach the exact fallback when focused evidence is inconclusive.

  This intentionally strengthens the detection semantics pinned by 068-02 and
  wired by 068-03, so this manifest supersedes 068-02 and redeclares its
  complete public engine and E711/E712 surface. The 068-03 CLI flags remain
  active and backward compatible; their private stage wiring passes the
  invocation's runtime evidence into the evolved engine. This is not a
  performance-equivalence child and may not turn an unsupported/inconclusive
  case into success.

  Although 121-11 groups duplicate identities for planning, this child still
  executes every declaration in its own controlled mutation lifecycle. Restore
  target bytes before the next declaration and preserve the legacy serial
  command-side-effect order; never hold one mutant open across two declaration
  sequences. Runtime sharing remains blocked until the isolated child-snapshot
  design in 121-13/14.
temptations:
  - risk: "Do not treat baseline non-execution as proof that a test cannot observe source mutation."
    instead: "Use selected nodes only to establish positive green-red-green proof; otherwise run the original command."
  - risk: "Do not count a pre-existing or flaky command failure as mutation detection."
    instead: "Require unmutated green and restored green around every accepted mutant-red transition."
  - risk: "Do not silently ignore collection, fixture/order, source-reading, or subprocess observers."
    instead: "Exercise adversarial fixtures and route every unproven dependency shape to exact-command differential fallback."
  - risk: "Do not report a focused failure without the detecting node and phase."
    instead: "Attach immutable differential proof and deterministic diagnostics to each result."
  - risk: "Do not build a custom AST/control-flow model to guess which tests can observe a mutation."
    instead: "Use pytest/runtime differential evidence for positive proof and the original command as the universal fail-closed fallback."
files:
  create:
    - path: tests/core/test_knockout_differential_detection.py
      artifacts:
        - kind: test_function
          name: test_executing_node_green_red_green_is_positive_detection_proof
          args: []
          description: "Scenario: an executing node is stable green; action: mutate then restore; expected: the green-red-green node proof detects the mutant."
        - kind: test_function
          name: test_focused_candidate_that_stays_green_runs_original_command
          args: []
          description: "Scenario: attributed nodes do not fail; action: run focused candidate; expected: the original command still executes before any non-detection result."
        - kind: test_function
          name: test_source_or_ast_inspection_detector_is_found_by_exact_fallback
          args: []
          description: "Scenario: a non-executing node inspects source/AST; action: mutate the body; expected: exact fallback discovers its mutation-caused failure."
        - kind: test_function
          name: test_fixture_or_order_dependent_candidate_is_inconclusive_and_falls_back
          args: []
          description: "Scenario: focused selection changes fixture/order outcomes; action: compare controls; expected: no focused proof is accepted and the exact command runs."
        - kind: test_function
          name: test_collection_time_detector_is_found_by_exact_fallback
          args: []
          description: "Scenario: collection inspects the source; action: mutate before collection; expected: exact fallback attributes the collection transition."
        - kind: test_function
          name: test_subprocess_observer_without_context_is_found_by_exact_fallback
          args: []
          description: "Scenario: a child process observes the file without in-process contexts; action: mutate; expected: exact fallback detects the transition."
        - kind: test_function
          name: test_baseline_failing_original_command_is_harness_failure_not_detection
          args: []
          description: "Scenario: the original command already fails; action: run knockout; expected: nonzero gate output carries E712 instead of a false detected result."
        - kind: test_function
          name: test_baseline_target_mutation_fails_closed_before_mutant_overwrite
          args: []
          description: "Scenario: an unmutated baseline command changes target bytes; action: prepare the mutant; expected: E712 preserves the command-written bytes and never overwrites them with the planned mutation or stale restore."
        - kind: test_function
          name: test_restored_control_target_mutation_fails_closed_and_restores_original_bytes
          args: []
          description: "Scenario: the restored control writes or deletes the target and either exits zero or raises; action: finish the differential lifecycle; expected: E712 recovers the original bytes before any next declaration."
        - kind: test_function
          name: test_crlf_target_is_restored_byte_for_byte_after_successful_knockout
          args: []
          description: "Scenario: the target uses CRLF bytes and a newline observer cannot detect the artifact; action: mutate and restore; expected: mutation-time lines preserve CRLF and the final target bytes exactly equal the original input."
        - kind: test_function
          name: test_stale_runtime_evidence_runs_exact_fallback
          args: []
          description: "Scenario: source or resolved environment identity changes after evidence collection; action: run knockout; expected: focused selection is rejected and the original exact command performs differential fallback."
        - kind: test_function
          name: test_mutant_red_without_restored_green_is_inconclusive_and_falls_back
          args: []
          description: "Scenario: the post-restore control is red; action: attempt focused proof; expected: proof is rejected and a deterministic harness diagnostic/fallback is used."
        - kind: test_function
          name: test_proven_focused_detector_avoids_broad_original_command
          args: []
          description: "Scenario: stable focused proof exists; action: execute knockout; expected: the broad command call count stays zero without skipping any inconclusive case."
        - kind: test_function
          name: test_differential_and_legacy_honest_fixture_gate_quality_is_monotonic
          args: []
          description: "Scenario: honest and unrelated-failure fixtures; action: compare old/new decisions; expected: honest detection remains and unrelated failure no longer satisfies the gate."
        - kind: test_function
          name: test_duplicate_spec_declarations_restore_target_before_next_legacy_side_effect_sequence
          args: []
          description: "Scenario: the first declaration writes project state; action: execute both declarations; expected: target restore/reapply points, side-effect order, and reports match separate legacy declaration runs."
    - path: tests/cli/test_verify_knockout_differential_cmd.py
      artifacts:
        - kind: test_function
          name: test_differential_proof_text_and_json_expose_same_detector_and_fallback
          args: []
          description: "Scenario: focused and fallback detections; action: render verify text/JSON; expected: identical detector, fallback, and structured error attribution."
        - kind: test_function
          name: test_deep_verify_passes_runtime_evidence_to_focused_knockout
          args: []
          description: "Scenario: artifact coverage collected complete node evidence alongside active manifests with no knockout targets; action: run public verify with coverage and knockout; expected: knockout validates the relevant evidence projection and reports focused proof without exact fallback."
  edit:
    - path: maid_runner/core/knockout.py
      artifacts:
        - kind: class
          name: KnockoutResult
          description: "Per-artifact outcome backed by mutation-caused differential proof when detection succeeds."
        - kind: attribute
          name: artifact_name
          of: KnockoutResult
          type: str
        - kind: attribute
          name: artifact_kind
          of: KnockoutResult
          type: str
        - kind: attribute
          name: parent_class
          of: KnockoutResult
          type: str | None
        - kind: attribute
          name: file_path
          of: KnockoutResult
          type: str
        - kind: attribute
          name: detected
          of: KnockoutResult
          type: bool
        - kind: attribute
          name: duration_ms
          of: KnockoutResult
          type: float
        - kind: attribute
          name: proof
          of: KnockoutResult
          type: KnockoutDifferentialProof | None
        - kind: class
          name: KnockoutReport
          description: "Aggregate differential knockout result with structured E711/E712 errors."
        - kind: attribute
          name: results
          of: KnockoutReport
          type: tuple[KnockoutResult, Ellipsis]
        - kind: attribute
          name: errors
          of: KnockoutReport
          type: tuple[ValidationError, Ellipsis]
        - kind: attribute
          name: success
          of: KnockoutReport
          type: bool
        - kind: method
          name: to_dict
          of: KnockoutReport
          args: []
          returns: dict
          description: "Return deterministic JSON-ready results, differential proof, and structured diagnostics."
        - kind: class
          name: KnockoutCommandExecutor
          description: "Owned exact-command boundary with an explicit per-declaration execution lifecycle."
        - kind: method
          name: execute
          of: KnockoutCommandExecutor
          args:
            - name: command
              type: tuple[str, Ellipsis]
            - name: project_root
              type: Path
            - name: manifest_slug
              type: str
          returns: TestRunResult
        - kind: class
          name: KnockoutDifferentialProof
          description: "Immutable green-mutant-red-restored-green evidence or exact-fallback diagnostic."
        - kind: attribute
          name: identity
          of: KnockoutDifferentialProof
          type: KnockoutArtifactIdentity
        - kind: attribute
          name: command
          of: KnockoutDifferentialProof
          type: tuple[str, Ellipsis]
        - kind: attribute
          name: baseline_exit_code
          of: KnockoutDifferentialProof
          type: int
        - kind: attribute
          name: mutant_exit_code
          of: KnockoutDifferentialProof
          type: int
        - kind: attribute
          name: restored_exit_code
          of: KnockoutDifferentialProof
          type: int
        - kind: attribute
          name: detecting_nodeids
          of: KnockoutDifferentialProof
          type: tuple[str, Ellipsis]
        - kind: attribute
          name: used_exact_fallback
          of: KnockoutDifferentialProof
          type: bool
        - kind: attribute
          name: diagnostics
          of: KnockoutDifferentialProof
          type: tuple[ValidationError, Ellipsis]
        - kind: function
          name: rewrite_artifact_body
          args:
            - name: source
              type: str
            - name: artifact_name
              type: str
            - name: artifact_kind
              type: str
            - name: parent_class
              type: str | None
              default: "None"
          returns: str
          description: "Replace the named Python function or method body while preserving its decorators and signature."
        - kind: function
          name: run_knockout
          args:
            - name: manifest
              type: Manifest
            - name: project_root
              type: Path
            - name: limit
              type: int | None
              default: "None"
            - name: allow_dirty
              type: bool
              default: "False"
            - name: evidence
              type: RuntimeEvidenceBundle | None
              default: "None"
            - name: executor
              type: KnockoutCommandExecutor | None
              default: "None"
          returns: KnockoutReport
          description: "Run one manifest through differential knockout while preserving legacy ordering, dirty-file refusal, and verified restoration."
        - kind: function
          name: run_knockout_batch
          args:
            - name: manifests
              type: Sequence[Manifest]
            - name: project_root
              type: Path
            - name: evidence
              type: RuntimeEvidenceBundle | None
              default: "None"
            - name: limit
              type: int | None
              default: "None"
            - name: allow_dirty
              type: bool
              default: "False"
            - name: executor
              type: KnockoutCommandExecutor | None
              default: "None"
          returns: dict[str, KnockoutReport]
          description: "Return reports keyed by manifest source path after attempting positive focused proof and exact-command fallback separately for every declaration, restoring target bytes before the next legacy-ordered declaration sequence."
    - path: maid_runner/core/result.py
      artifacts:
        - kind: attribute
          name: ARTIFACT_KNOCKOUT_NOT_DETECTED
          of: ErrorCode
          type: str
          description: "E711: no validate command supplied mutation-caused differential detection for the named artifact."
        - kind: attribute
          name: KNOCKOUT_HARNESS_FAILURE
          of: ErrorCode
          type: str
          description: "E712: baseline, restoration, command execution, or harness integrity failed closed."
  scope:
