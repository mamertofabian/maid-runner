- uv run python -m pytest -q tests/core/test_chain_merge_coverage_wiring.py
- uv run python -m pytest -q tests/core/test_chain_merge.py tests/core/test_chain_merge_evidence.py tests/core/test_chain_merge_detection_wiring.py tests/cli/test_chain_merge_command.py tests/cli/test_artifact_coverage_evidence_cache.py
outcome:
  status: completed
  completed_at: '2026-08-16T06:31:00+08:00'
  summary: Child 3b reads current full-repository artifact-coverage evidence into the chain-merge acceptance bar, keeps stale or partial evidence UNKNOWN, and returns BLOCKED with an E710 reason for any recorded uncovered artifact.
  rationale: |
    Reused the existing hermetic artifact-coverage cache implementation by
    extracting its private reader/writer from the verify CLI into a private core
    module. The cache key now normalizes the project root so relative producer
    paths and absolute reader paths share one identity. Coverage remains keyed by
    file plus artifact merge key, and false dominates duplicate findings so one
    covered declaration cannot hide another declaration's E710. Child 5's
    candidate-state equivalence comparison remains deliberately out of scope.
  lessons:
  - lesson_type: regression
    summary: Persisted evidence keys must normalize project-root identity; otherwise a CLI producer using `.` and a library reader using an absolute path miss the same current cache and silently degrade to UNKNOWN.
    tags:
    - artifact-coverage
    - cache
    - evidence-integrity
    - maid-runner-feedback
    paths:
    - maid_runner/core/_artifact_coverage_cache.py
    - maid_runner/core/chain_merge_evidence.py
  - lesson_type: validation-trust
    summary: Fragmented manifest chains can emit conflicting duplicate coverage findings, so recorded E710 must dominate covered evidence independently of report order.
    tags:
    - artifact-coverage
    - e710
    - chain-merge
    paths:
    - maid_runner/core/chain_merge_evidence.py
    - tests/core/test_chain_merge_coverage_wiring.py
  - lesson_type: test-design
    summary: An uncovered-artifact fixture must reference the symbol behaviorally without executing its body; `assert callable(target)` reaches E710, while import-only stops earlier at E200 and a constant-return target stops at E310.
    tags:
    - red-phase
    - artifact-coverage
    - behavioral-tests
    paths:
    - tests/core/test_chain_merge_coverage_wiring.py
