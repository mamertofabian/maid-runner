description: |
  Implementation validation currently reports E300 when a TypeScript module
  imports a named function and re-exports the binding. Resolve this bounded
  value-import and named-export form to a directly exported, project-local
  declaration, then compare the actual function signature and stub status using
  existing validation rules, including configured compiler return proofs on the
  originating file. Preserve names through import and export aliases, including
  an alias in the originating module, by tracing each public name to the
  specific declaration it exposes. Distinguish TypeScript's type and value
  namespaces and inspect the top-level runtime declaration itself, excluding
  nested functions, object methods, ambient-only declarations, and ambiguous
  repeated value declarations. Preserve JavaScript JSDoc return contracts and
  accept parenthesized arrow functions, including project-local .mjs sources.
  Reject
  unsupported string-literal specifiers rather than dropping a side of a binding.
  Support relative imports and aliases resolved by the owning nested TypeScript
  project, including SvelteKit's inherited generated config. Resolve aliases
  through the owning compiler rather than an incorrectly rebased inherited
  config, and retain the compiler's exact resolved source file and usage mode.
  Follow referenced TypeScript project configs to the unique owning project;
  fail closed if the owning config cannot be determined, including when the
  compiler is unavailable. Determine project membership through TypeScript's
  program, including transitively imported source files. Distinguish destructuring
  binding positions from property keys and expressions and distinguish namespace
  scopes from module-scoped bindings.
  Resolve a shared imported module once per validation rather than starting a
  compiler process for each of its named bindings.
  This permits project-local sibling packages while rejecting unresolved
  NodeNext ESM imports and invalid inherited configurations. Use the compiler
  without a config when available; otherwise bound relative resolution to
  unambiguous files rather than guessing package-directory entry points.
  Use Tree-sitter for the bounded binding syntax and existing TypeScript resolution;
  use the existing normalized parse session so valid grammar workarounds remain
  consistent with ordinary implementation collection.
  project compiler resolution is allowed for aliases but not required for
  ordinary relative imports. Reject type-only, unexported, unresolved,
  external, and outside-project targets rather than crediting them as runtime
  function definitions. Do not assert behavior for arbitrary transitive barrels,
  namespace/default exports, overload sets, separately typed callable bindings,
  or type artifacts in this narrow fix. Strict create-mode checks must still
  report undeclared re-exported functions.

  Previous TypeScript collector outcomes emphasize collecting real declarations
  through the existing language boundary and keeping comparison policy intact.
  Accordingly the new tests exercise implementation validation end to end,
  including negative signature and visibility controls, rather than parser
  internals or a blanket E300 suppression.
temptations:
  - risk: "Do not credit an import spelling, nested function, object method, or ambient declaration as proof of a runtime function."
    instead: "Trace each export to its exact top-level runtime declaration, ignoring unrelated collected lookalikes and rejecting unsupported callable signatures."
  - risk: "Do not hard-code the report's Svelte alias or require Node for relative imports."
    instead: "Use existing TypeScript resolution for the owning package and exercise both relative imports and a nested inherited-config alias."
  - risk: "Do not silently accept type-only, external, escaped, or unreadable targets."
    instead: "Fail closed and retain the existing missing-artifact diagnostic when the bounded source declaration cannot be verified."
  - risk: "Do not infer a target from an incorrectly rebased inherited alias or select a different sibling extension."
    instead: "Use the TypeScript compiler's exact resolved file and usage mode when available; reject ambiguous package directories in the no-compiler fallback."
  - risk: "Do not run compiler return proofs against the re-export line."
    instead: "Retain the actual declaration's file, name, source and line for configured compiler proofs and map the result to the public contract."
