schema: '2'
goal: Keep manifest-declared SQL behavioral tests visible during stash-backed plan revision
type: fix
created: '2026-07-13T10:00:16Z'
metadata:
  tags:
  - plan-lock
  - stash-implementation
  - behavioral-tests
  - sql
  priority: high
description: |
  Fix `maid plan revise --stash-implementation` so a writable file explicitly
  declared with a `test_function` artifact is treated as a behavioral test even
  when its filename is outside MAID's Python and JavaScript/TypeScript naming
  conventions. This keeps pgTAP fixtures such as `*.test.sql` present while
  untracked or modified implementation paths are temporarily hidden to capture
  fresh red evidence.

  The change is an additive evolution of the completed stash-backed revision
  contracts. It does not alter the public `cmd_plan_revise(args) -> int`
  signature, expand general SQL validation, or globally classify every SQL file
  as a test. The explicit `test_function` declaration is the semantic boundary:
  files without that declaration continue to use the existing conservative
  filename classifier across every writable and read-only manifest section.

  Rationale: three downstream reports show the filename-only classifier can
  stash a declared pgTAP fixture, causing the validation command to observe a
  missing path and reject otherwise honest red evidence. Deriving the protected
  test set from the manifest's explicit artifact contract fixes the reported
  workflow without widening unrelated test discovery or introducing SQL parsing.
temptations:
- risk: Do not solve the incident by treating every .sql file or every path under a tests directory as a behavioral test.
  instead: Protect writable paths that explicitly declare at least one test_function artifact, then retain the existing filename classifier as a compatibility fallback.
- risk: Do not broaden the Git stash to all untracked files or bypass the existing unrelated-dirt and staged-path refusal checks.
  instead: Change only the protected behavioral-path set used to derive exact stash targets and allowed contract dirt.
- risk: Do not weaken invalid red-evidence handling so a missing fixture or runner usage error is accepted as behavioral red.
  instead: Keep exit-code classification unchanged and prove the fixture remains visible while only the implementation path is absent.
files:
  scope:
  - path: maid_runner/cli/commands/plan.py
    reason: Derive stash-backed revision's protected behavioral paths from explicit test_function artifacts as well as the existing filename classifier, without changing public CLI signatures.
  create:
  - path: tests/cli/test_plan_cmd_stash_declared_sql_tests.py
    artifacts:
    - kind: test_function
      name: test_stash_implementation_keeps_declared_sql_test_visible
      source_scenario: A locked manifest has an untracked files.create implementation module, untracked .test.sql and nonstandard .pgtap.sql fixtures explicitly declared as test_function, and dirty filename-classified tests under files.scope and files.delete.
      actions:
      - type: api_call
        subject:
          function: cmd_plan_revise
      expected:
        behavior: Stash-backed revision hides only the implementation file, preserves explicit and filename-classified behavioral paths across create, scope, and delete sections so validation returns genuine red, restores the implementation exactly, records valid red evidence, and leaves no temporary stash.
  read:
  - manifests/076-01-add-stash-backed-plan-revise.manifest.yaml
  - manifests/082-03-stash-revise-files-read-wiring-paths.manifest.yaml
  - manifests/fix-stash-revise-scope-targets.manifest.yaml
validate:
- uv run python -m pytest -q tests/cli/test_plan_cmd_stash_declared_sql_tests.py
outcome:
