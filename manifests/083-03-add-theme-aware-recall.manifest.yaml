schema: '2'
goal: Add an opt-in `maid recall --theme-map <digest>` that annotates recall matches with canonical themes through the runner-validated lesson_type-to-theme mapping, so the targeted per-manifest planning surface benefits from theme normalization instead of the raw 78-way fragmented lesson_type vocabulary, mirroring the 081-03 insights integration pattern
type: feature
created: '2026-07-04T10:26:58Z'
metadata:
  epic: 083-00-close-outcome-enrichment-consumption-loop
  tags:
  - outcome-records
  - recall
  - llm-enrichment
  - cli
  priority: medium
description: |
  `maid recall` is the targeted planning surface ("what bit us before on
  work like this manifest"), and it reports raw lesson_types from a
  vocabulary fragmented across 78 distinct values for 269 lessons. Theme
  normalization was explicitly scoped out of 081-06 and never picked up.
  This child wires the validated theme map into recall output the same way
  081-03 wired it into insights: deterministic mapping only, no generated
  narrative, opt-in flag, runner-owned staleness rejection.

  Pinned decisions (do not redesign):

  1. Annotation, not re-ranking. `--theme-map` decorates each recall match's
     reported lesson_types with their canonical theme; it must not change
     match scoring, ordering, filtering, or which records are returned.
     Recall results with and without the flag differ only in the theme
     annotations. Theme-aware scoring is a possible future evolution, out of
     scope here because it changes evidence selection semantics.

  2. The mapping helper is a public deterministic core seam. Add
     `theme_map_from_digest(digest)` to
     `maid_runner/core/outcome_enrichment.py`, returning the
     lesson_type-to-canonical-theme dict derived from a digest's themes.
     `apply_theme_map` in the same module already builds this mapping
     inline; the implementation should extract and reuse the shared helper
     rather than duplicating the comprehension, without changing
     `apply_theme_map` behavior.

  3. Digest acceptance matches insights exactly (081-03 semantics): the
     digest is read with `read_enrichment_digest`, deep-validated with
     `validate_enrichment_digest` against the recall index, and rejected
     when `digest_is_stale` unless `--allow-stale-index` is supplied.
     Unmapped lesson_types pass through unannotated (their own name), the
     same pass-through rule the enrichment core defines. Errors use recall's
     existing error/exit conventions.

  4. Output shape: in JSON output each match gains a `themes` field listing
     the canonical themes of its lesson_types (sorted, deduplicated); text
     output annotates lesson_types as `theme (lesson_type)` or an equivalent
     compact form consistent with recall's existing text layout. No
     generated prose (summaries, digest entries) appears in recall output in
     any mode.

  5. Registered options only; the flag is registered in `build_parser`
     alongside recall's existing options, following 072-01's
     no-abbreviation convention.

  Planned behavioral tests (red phase pending — handoff stops before tests):
  `tests/cli/test_recall_theme_map_cmd.py` builds a temp project with
  completed Outcome records whose lesson_types are mapped by a fixture
  digest, then asserts: recall without `--theme-map` output is unchanged
  (characterization); with `--theme-map` each JSON match carries the correct
  `themes` for its lesson_types while match set, scores, and order are
  identical to the unthemed run; unmapped lesson_types pass through
  unannotated; a stale digest is rejected without `--allow-stale-index` and
  accepted with it; a fabricated digest (unknown lesson_type) is rejected;
  no digest narrative strings appear in recall output. Core additions in
  `tests/core/test_outcome_enrichment.py` pin `theme_map_from_digest`
  contents and its agreement with `apply_theme_map` grouping.

  Out of scope: theme-aware scoring or filtering, planner/skill guidance for
  recall theme use (a follow-up guidance child can reference this flag once
  it ships), `maid insights` changes, and digest generation.
temptations:
- risk: Do not let --theme-map alter recall scoring, ordering, or the returned record set to make themed output look more useful.
  instead: Pin a test that the match set, scores, and order are byte-identical between themed and unthemed runs; only annotations differ.
- risk: Do not duplicate the lesson_type-to-theme comprehension from apply_theme_map inside recall.
  instead: Extract the shared theme_map_from_digest seam in the enrichment core and reuse it from both apply_theme_map and recall, with apply_theme_map behavior pinned unchanged.
- risk: Do not emit digest summaries or digest_entries prose into recall output to enrich the display.
  instead: Recall uses only the validated mapping; narrative stays in the rendered advisory markdown, and a test asserts no narrative strings leak.
- risk: Do not skip deep validation and accept any parseable digest for annotation.
  instead: Run validate_enrichment_digest against the recall index and reject stale digests without the existing --allow-stale-index opt-in, matching 081-03 insights semantics.
files:
  edit:
  - path: maid_runner/core/outcome_enrichment.py
    artifacts:
    - kind: function
      name: theme_map_from_digest
      args:
      - name: digest
        type: EnrichmentDigest
      returns: dict[str, str]
      description: Deterministic lesson_type-to-canonical-theme mapping derived from the digest's themes; the shared seam reused by apply_theme_map and recall annotation. Unmapped lesson_types are simply absent.
  - path: maid_runner/cli/commands/recall.py
    artifacts:
    - kind: function
      name: cmd_recall
      args:
      - name: args
        type: argparse.Namespace
      returns: int
      description: 'Gains opt-in --theme-map handling: read, deep-validate, and staleness-check the digest against the recall index, then annotate match lesson_types with canonical themes in JSON (themes field) and text output without changing match selection, scoring, or order.'
  - path: maid_runner/cli/commands/_main.py
    artifacts:
    - kind: function
      name: build_parser
      args: []
      returns: argparse.ArgumentParser
      description: Registers the --theme-map option on the recall subparser, defaulting to None (feature off), alongside the existing recall options.
  read:
  - maid_runner/core/outcome_recall.py
  - maid_runner/cli/commands/insights.py
  - manifests/drafts/083-00-close-outcome-enrichment-consumption-loop.epic.yaml
  - manifests/081-03-wire-theme-map-into-insights.manifest.yaml
  - manifests/077-03-add-related-match-recall-scoring.manifest.yaml
  - tests/core/test_outcome_enrichment.py
  create:
  - path: tests/cli/test_recall_theme_map_cmd.py
    artifacts:
    - kind: test_function
      name: test_recall_without_theme_map_output_unchanged
      args: []
      returns: None
      description: 'Characterization: recall without the flag matches current output shape with raw lesson_types.'
    - kind: test_function
      name: test_recall_theme_map_annotates_matches_without_changing_selection
      args: []
      returns: None
      description: With --theme-map, JSON matches carry correct sorted deduplicated themes while match set, scores, and order are identical to the unthemed run.
    - kind: test_function
      name: test_recall_theme_map_passes_unmapped_lesson_types_through
      args: []
      returns: None
      description: Lesson_types absent from the digest themes appear unannotated under their own name.
    - kind: test_function
      name: test_recall_rejects_stale_theme_map_without_allow_flag
      args: []
      returns: None
      description: A digest whose source_generated_from mismatches the index is rejected with recall's error conventions unless --allow-stale-index is passed.
    - kind: test_function
      name: test_recall_rejects_fabricated_theme_map
      args: []
      returns: None
      description: A digest citing an unknown lesson_type fails deep validation and recall reports the error.
    - kind: test_function
      name: test_recall_theme_map_emits_no_generated_narrative
      args: []
      returns: None
      description: Theme summaries and digest_entries prose never appear in themed recall output in any mode.
validate:
- uv run python -m pytest -q tests/cli/test_recall_theme_map_cmd.py tests/core/test_outcome_enrichment.py
