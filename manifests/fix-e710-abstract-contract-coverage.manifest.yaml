schema: "2"
goal: "Exclude explicit Python abstract contracts from runtime artifact coverage"
type: fix
created: "2026-08-16T23:22:56Z"
metadata:
  priority: high
  epic: 121-00-fast-verification-roadmap
  tags: [artifact-coverage, validation-trust, abstractmethod, E710]
description: |
  Deep verification still emits E710 for methods explicitly decorated with
  @abstractmethod and for classes whose declared methods are entirely abstract.
  These declarations are interface contracts, not production bodies: honest
  tests exercise concrete implementations, while calling raise
  NotImplementedError or ellipsis bodies solely for line evidence would game the
  gate.

  Treat only exact @abstractmethod and @abc.abstractmethod method declarations as
  not runtime-applicable. Omit those method findings, and omit a class finding
  only when every declared method for that class is abstract. A mixed abstract
  class retains coverage obligations for each concrete declared method and for
  the class through those concrete methods. Similar-looking decorators such as
  @fake.abstractmethod remain ordinary runtime obligations. Apply the same rule
  to exact single, exact batch, and derived evidence evaluation.

  The rule resolves direct imports and syntactically visible module-scope
  rebinding only. Dynamic mutation through setattr, exec, or arbitrary calls is
  intentionally outside this narrow rule; broad control-flow interpretation is
  not an acceptable validator-hardening strategy.

  This fix intentionally does not address dataclass/value-object coverage or
  ordinary unexecuted concrete artifacts; those remain separate blockers.
temptations:
  - risk: "Do not execute abstract raise/ellipsis bodies merely to manufacture coverage evidence."
    instead: "Classify only explicit standard-library abstractmethod decorators as non-runtime contracts during evidence evaluation."
  - risk: "Do not exempt every method whose decorator attribute happens to be named abstractmethod."
    instead: "Recognize only @abstractmethod and @abc.abstractmethod; keep custom or fake decorator attributes subject to E710."
  - risk: "Do not exempt a whole mixed abstract class and accidentally hide an untested concrete default method."
    instead: "Remove the class obligation only when no declared runtime-applicable method remains; otherwise require concrete method execution to credit the class."
  - risk: "Do not change manifest declarations or diagnostic severity to make the repository gate green."
    instead: "Keep contracts intact and change only the runtime-applicability decision shared by exact and derived coverage reports."
