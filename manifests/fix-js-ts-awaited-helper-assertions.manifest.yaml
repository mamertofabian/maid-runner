# manifest-kind: draft
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Recognize assertions in directly awaited local JS and TS test helpers
type: fix
created: '2026-11-26T10:19:42Z'
metadata:
  priority: high
  tags: [javascript, typescript, assertion-checking, e210]
description: |-
  Resolve report 20261126-064610-tma-helper-assertion-detection. A test may
  directly await a same-file named function declared in its enclosing module or
  suite; that helper can contain the observable expect(subject).matcher(...)
  assertion. Recognize this bounded shape with the existing optional TypeScript
  parser, including nested suites and JS/JSX/TS/TSX, without changing the
  existing direct-callback substring policy, diagnostics, or Python behavior.
  Handle direct awaits used as expression statements, return values, or local
  initializers; recognize direct or returned standard Vitest/Jest matcher calls,
  exported helpers, and suite modifiers. Use a bounded matcher vocabulary and
  reject locally shadowed expect bindings. Index scoped declarations and writes
  so repeated tests do not rescan an entire file for each helper call.
  Treat lexical shadowing, ambiguous bindings, unrelated scopes, unawaited or
  nested calls, and assertions merely mentioned in strings, comments, or
  uncalled functions conservatively. Require a direct matcher call in the
  helper's function body and a directly awaited identifier call in the test
  callback. Do not infer general control flow, helper chains, imported helpers,
  aliases, variable-bound arrow helpers, or proof that code executes.
  Reuse the same parser result for regex token shielding and helper recognition;
  without the optional parser retain legacy scanning and its visible warning.
  Preserve source positions, duplicate labels and the existing severity.
  Prior assertion-check Outcomes advise reusing parser evidence, independently
  testing negative cases, and preserving diagnostic locations and fallback.
temptations:
- risk: Silence E210 for all tests that call any function or for a whole file.
  instead: Match an awaited local function and its direct matcher using parser nodes and retain assertion-free controls.
- risk: Search helper text for expect or model arbitrary program execution.
  instead: Check the bounded direct syntax shape, reject ambiguous bindings, and document the remaining limits.
- risk: Hide parser absence or change existing assertion behavior.
  instead: Reuse the existing parser and observable legacy fallback, preserving current callback diagnostics and direct assertion policy.
