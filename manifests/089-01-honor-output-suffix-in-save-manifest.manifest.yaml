  validation:
    - command: [uv, run, python, -m, pytest, -q, tests/core/test_save_manifest_output_format.py, tests/core/test_snapshot_output_format.py, tests/core/test_manifest.py, tests/integration/test_library_api.py]
      status: passed
      summary: The focused contract scope passed, covering the new suffix tests and the existing save_manifest regression callers.
    - command: [uv, run, python, -m, pytest, -q, tests/]
      status: passed
      summary: The full Python suite passed 3535 tests with 5 skips, up from the 3530-test baseline by the five new cases.
    - command: [uv, run, maid, validate, manifests/089-01-honor-output-suffix-in-save-manifest.manifest.yaml, --mode, implementation]
      status: passed
      summary: Implementation validation passed for the promoted contract.
    - command: [uv, run, maid, validate]
      status: passed
      summary: All 359 active manifests passed with 0 failures; 97 superseded were skipped.
