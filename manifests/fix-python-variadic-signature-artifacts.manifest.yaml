      - name: expected
        type: list
      returns: None
      description: variadic names types and order survive both collectors
    - kind: test_function
      name: test_variadic_parameter_validates_and_snapshot_roundtrips
      args:
      - name: tmp_path
        type: Path
      - name: parameter
        type: str
      returns: None
      description: variadic parameter validates and snapshot roundtrips
    - kind: test_function
      name: test_variadic_and_regular_parameters_do_not_match_accidentally
      args:
      - name: tmp_path
        type: Path
      - name: actual
        type: str
      - name: declared
        type: str
      returns: None
      description: variadic and regular parameters do not match accidentally
    - kind: test_function
      name: test_variadic_type_mismatch_remains_blocking
      args:
      - name: tmp_path
        type: Path
      - name: parameter
        type: str
      returns: None
      description: variadic type mismatch remains blocking
