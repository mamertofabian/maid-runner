        type: ast.AST
      - name: file_path
        type: str
      returns: list[FoundArtifact]
      description: Collect exact Python callable signatures including variadic names.
  create:
  - path: tests/validators/test_fix_python_variadic_signature_artifacts.py
    artifacts:
    - kind: test_function
      name: test_variadic_names_types_and_order_survive_both_collectors
