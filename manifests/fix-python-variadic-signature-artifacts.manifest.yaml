# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Represent Python variadic parameters faithfully in artifact signatures
type: fix
created: '2026-10-20T20:31:18Z'
description: Represent Python *args and **kwargs with starred ArgSpec.name spellings (*items and **options),
  retaining their element/value annotation and no default. Preserve Python declaration order (positional,
  varargs, keyword-only, kwargs), existing positional/self/cls/default handling, async and method collection.
  Existing ArgSpec, loader, schema and exact name/type comparison already represent this without extension;
  do not add fields or broaden empty-args validation policy. Both public collection seams and downstream
  validation/snapshot roundtrip are covered. Initial inventory recall had no related records; hardened-scope
  recall found signature normalization, PEP695, Protocol and enum Outcomes. Reuse existing annotation
  rendering and preserve public signatures with exact identity/type negatives. Their import/binding/control-flow
  lessons do not require scope expansion.
temptations:
- risk: Drop variadic parameters or conflate plain, single-star and double-star names.
  instead: Preserve distinct starred names through both public collectors, snapshot save/load and exact
    downstream negative validation.
- risk: Add schema flags or alter argument validation globally for a producer omission.
  instead: Reuse current ArgSpec names and existing name/type mismatch checks; bound production edits
    to the extractor and retain regular/default/order controls.
