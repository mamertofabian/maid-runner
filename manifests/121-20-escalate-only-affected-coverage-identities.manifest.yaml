  rationale: "The single whole-batch unsafe flag discarded the entire parallel batch whenever any command failed, so on a repository with a few genuinely failing commands the isolated path did the work twice and ran slower than the legacy serial loop. A non-zero exit without material writes leaves the lane snapshot clean, so escalating it alone is safe and preserves every 121-13/121-14/121-15 material-write and worker-error adversary unchanged."
  lessons:
