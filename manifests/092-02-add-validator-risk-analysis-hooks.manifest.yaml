# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Expose optional validator dependency and complexity hooks without changing
  risk-v1 recommendation output"
type: feature
created: "2026-07-31T00:13:11Z"
metadata:
  epic: 092-00-coverage-priority-recommender
  tags:
    - validators
    - plugin-api
    - coverage-risk
  priority: high
description: |
  Add concrete, optional dependency and complexity analysis methods to
  BaseValidator. Existing third-party validators remain constructible because
  the methods are not abstract and return explicit supported=false results.

  Python, TypeScript, and Svelte implement both hooks. The dependency hook
  returns resolved module identities plus unresolved/error evidence; the
  complexity hook returns the exact logical-line, decision-point, largest
  definition, and public-artifact metrics already used by 092-01.

  Refactor the risk-v1 indexes to call these hooks. Recommendation output for
  built-in languages must remain identical for the same tree; this child adds
  plugin extensibility and does not redefine weights, percentiles, confidence,
  or priority bands.
temptations:
  - risk: "Do not make the new hooks abstract and break existing validator plugins."
    instead: "Provide concrete BaseValidator defaults with supported=false and empty
      evidence values."
  - risk: "Do not change risk-v1 metrics while moving collection behind hooks."
    instead: "Characterize current Python, TypeScript, and Svelte outputs and preserve
      their recommendation signals exactly."
  - risk: "Do not convert hook errors into zero metrics."
    instead: "Return typed errors/unsupported state so risk-v1 retains conservative
      low-confidence contributions."
files:
  edit:
    - path: maid_runner/validators/base.py
      artifacts:
        - kind: class
          name: DependencyCollectionResult
        - kind: attribute
          name: modules
          of: DependencyCollectionResult
          type: "tuple[str, ...]"
        - kind: attribute
          name: unresolved
          of: DependencyCollectionResult
          type: "tuple[str, ...]"
        - kind: attribute
          name: errors
          of: DependencyCollectionResult
          type: "tuple[str, ...]"
        - kind: attribute
          name: supported
          of: DependencyCollectionResult
          type: bool
        - kind: class
          name: ComplexityResult
        - kind: attribute
          name: logical_lines
          of: ComplexityResult
          type: "int | None"
        - kind: attribute
          name: decision_points
          of: ComplexityResult
          type: "int | None"
        - kind: attribute
          name: largest_definition_lines
          of: ComplexityResult
          type: "int | None"
        - kind: attribute
          name: public_artifacts
          of: ComplexityResult
          type: "int | None"
        - kind: attribute
          name: errors
          of: ComplexityResult
          type: "tuple[str, ...]"
        - kind: attribute
          name: supported
          of: ComplexityResult
          type: bool
        - kind: method
          name: collect_dependencies
          of: BaseValidator
          args:
            - name: source
              type: str
            - name: file_path
              type: "Union[str, Path]"
            - name: project_root
              type: Path
          returns: DependencyCollectionResult
          default_hook: true
        - kind: method
          name: collect_complexity
          of: BaseValidator
          args:
            - name: source
              type: str
            - name: file_path
              type: "Union[str, Path]"
          returns: ComplexityResult
          default_hook: true
    - path: maid_runner/validators/python.py
      artifacts:
        - kind: method
          name: collect_dependencies
          of: PythonValidator
          args:
            - name: source
              type: str
            - name: file_path
              type: "Union[str, Path]"
            - name: project_root
              type: Path
          returns: DependencyCollectionResult
        - kind: method
          name: collect_complexity
          of: PythonValidator
          args:
            - name: source
              type: str
            - name: file_path
              type: "Union[str, Path]"
          returns: ComplexityResult
    - path: maid_runner/validators/typescript.py
      artifacts:
        - kind: method
          name: collect_dependencies
          of: TypeScriptValidator
          args:
            - name: source
              type: str
            - name: file_path
              type: "Union[str, Path]"
            - name: project_root
              type: Path
          returns: DependencyCollectionResult
        - kind: method
          name: collect_complexity
          of: TypeScriptValidator
          args:
            - name: source
              type: str
            - name: file_path
              type: "Union[str, Path]"
          returns: ComplexityResult
    - path: maid_runner/validators/svelte.py
      artifacts:
        - kind: method
          name: collect_dependencies
          of: SvelteValidator
          args:
            - name: source
              type: str
            - name: file_path
              type: "Union[str, Path]"
            - name: project_root
              type: Path
          returns: DependencyCollectionResult
        - kind: method
          name: collect_complexity
          of: SvelteValidator
          args:
            - name: source
              type: str
            - name: file_path
              type: "Union[str, Path]"
          returns: ComplexityResult
  scope:
    - path: maid_runner/core/_dependency_index.py
      reason: "Delegate per-file dependency collection to registered validator hooks."
    - path: maid_runner/core/_risk_metrics.py
      reason: "Delegate per-file complexity collection to registered validator hooks."
  read:
    - maid_runner/core/coverage_recommendation.py
    - maid_runner/validators/registry.py
    - tests/validators/test_coverage_recommendation_hooks.py
    - tests/core/test_coverage_recommendation.py
validate:
