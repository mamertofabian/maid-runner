      CRLF preservation probe.
  - source: implementation-session
    severity: info
    summary: >-
      Strict handoff passed once before the final mixed-marker hardening. After
      that hardening, bounded reruns passed eight of nine stages but were blocked
      only by the unrelated intermittent artifact-coverage batch attribution
