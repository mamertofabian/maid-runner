  validation:
  - command: [uv, run, python, -m, pytest, -q, tests/cli/test_legacy_pre_commit_markers.py, tests/cli/test_uninstall_cmd.py, tests/cli/test_init_pre_commit.py]
    status: passed
    summary: All 43 declared legacy-marker, uninstall, and pre-commit tests passed.
  - command: [uv, run, python, -m, pytest, tests/, -q]
    status: passed
    summary: Full Python suite passed 3852 tests with 5 skipped before the final narrow mixed-marker hardening; the affected focused and declared suites passed again afterward.
  - command: [uv, run, maid, validate, --packet]
    status: passed
