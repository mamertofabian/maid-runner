# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Accept and normalize MAID's legacy indented pre-commit ownership marker
  during init and uninstall
type: fix
created: '2026-08-08T23:16:14Z'
metadata:
  status: implementation-ready
  tags: [cli, init, uninstall, pre-commit, compatibility]
  priority: high
description: |
  Add backward compatibility for the historical `.pre-commit-config.yaml`
  layout emitted by MAID onboarding, where the opening
  `# BEGIN MAID RUNNER PRE-COMMIT` marker was indented by exactly two spaces
  beneath `repos:` while the closing marker was at column zero.

  This is an additive chain merge over `add-owned-payload-uninstall` and
  `add-init-pre-commit-verification`: public function signatures and existing
  artifacts remain unchanged. The implementation may make a narrow private
  marker-recognition change in `maid_runner/cli/commands/init.py`. Current
  canonical column-zero marker pairs remain supported, while unmatched,
  duplicated, reversed, quoted, arbitrarily indented, or non-owning marker
  shapes continue to fail closed.

  `maid init --force` recognizes the exact historical pair, validates that its
  block owns the single reserved `maid-verify` hook, replaces only that block
  with the current canonical column-zero form, and preserves surrounding YAML
  bytes. `maid init --uninstall` recognizes the same pair in dry-run and
  execution, removes only the managed block and other selected MAID-owned
  payloads, and preserves unrelated hooks, skills, manifests, and drafts.

  Outcome evidence from `add-owned-payload-uninstall` applies directly:
  preview and execution must share one plan, user-owned content must remain
  byte-stable, and malformed ownership evidence must fail before mutation.
  The historical `codefrost-site` onboarding commit provides the regression
  fixture shape; no general whitespace-tolerant marker policy is inferred.
temptations:
- risk: Do not make all leading whitespace valid for MAID marker comments.
  instead: Recognize only the canonical column-zero form and the exact
    historical two-space opening-marker form with a column-zero close.
- risk: Do not turn malformed-marker failures into best-effort cleanup.
  instead: Keep unmatched, duplicated, reversed, quoted, and unsupported
    indentation cases fail-closed before any write.
- risk: Do not parse and reserialize the complete pre-commit YAML file.
  instead: Validate ownership semantically, then replace or remove only the byte
    span bounded by the recognized markers.
- risk: Do not test a private marker helper as the behavioral contract.
  instead: Exercise force refresh, dry-run, and uninstall through the public CLI
    and assert observable preservation and normalization.
files:
  create:
  - path: tests/cli/test_legacy_pre_commit_markers.py
    artifacts:
    - kind: test_function
      name: test_init_uninstall_accepts_legacy_generated_pre_commit_markers
      args:
      - {name: tmp_path, type: Path}
      - {name: monkeypatch, type: pytest.MonkeyPatch}
      - {name: capsys, type: 'pytest.CaptureFixture[str]'}
      returns: None
      source_scenario: A brownfield repository contains the exact pre-commit
        marker asymmetry generated by historical MAID onboarding, plus unrelated
        hooks, skills, active manifests, and drafts.
      actions:
      - type: api_call
        subject: {export: main}
      expected:
        behavior: Dry-run succeeds without changing bytes, execution removes
          only MAID-owned payload and the legacy managed block, all user-owned
          sentinels remain byte-identical, and a repeated uninstall succeeds
          idempotently.
    - kind: test_function
      name:
        test_init_uninstall_rejects_legacy_marker_block_without_reserved_hook
      args:
      - {name: tmp_path, type: Path}
      - {name: monkeypatch, type: pytest.MonkeyPatch}
      - {name: capsys, type: 'pytest.CaptureFixture[str]'}
      returns: None
      source_scenario: The historical marker indentation surrounds a block that
        does not own the reserved maid-verify hook.
      actions:
      - type: api_call
        subject: {export: main}
      expected:
        behavior: Dry-run uninstall fails before mutation, reports the ownership
          conflict, and preserves the complete pre-commit file and generated
          scaffold byte-for-byte.
    - kind: test_function
      name: test_init_force_normalizes_legacy_generated_pre_commit_markers
      args:
      - {name: tmp_path, type: Path}
      - {name: monkeypatch, type: pytest.MonkeyPatch}
      returns: None
      source_scenario: A repository initialized by historical MAID has the exact
        two-space opening marker and column-zero closing marker around its
        single reserved hook.
      actions:
      - type: api_call
        subject: {export: main}
      expected:
        behavior: Force init succeeds, emits one canonical column-zero managed
          block with the current hook, preserves surrounding user YAML bytes,
          and a second force refresh is byte-idempotent.
    - kind: test_function
      name:
        test_init_and_uninstall_reject_nonhistorical_indented_pre_commit_markers
      args:
      - {name: tmp_path, type: Path}
      - {name: monkeypatch, type: pytest.MonkeyPatch}
      returns: None
      source_scenario: Pre-commit markers use unsupported indentation, occur as
        quoted YAML values, or mix those malformed copies with one otherwise
        valid canonical or historical pair.
      actions:
      - type: api_call
        subject: {export: main}
      expected:
        behavior: Force init and executing uninstall both fail closed before
          changing the pre-commit file or removing generated scaffold.
  scope:
  - path: maid_runner/cli/commands/init.py
    reason: Add narrow private recognition for the exact legacy pre-commit
      marker pair without changing any public artifact signature.
  read:
  - manifests/add-owned-payload-uninstall.manifest.yaml
  - manifests/add-init-pre-commit-verification.manifest.yaml
  - tests/cli/test_init_pre_commit.py
  - tests/cli/test_uninstall_cmd.py
validate:
- uv run python -m pytest -q tests/cli/test_legacy_pre_commit_markers.py tests/cli/test_uninstall_cmd.py tests/cli/test_init_pre_commit.py
outcome:
  status: completed
  completed_at: '2026-08-09T07:59:42+08:00'
  summary: >-
    Added fail-closed compatibility for the exact historical pre-commit marker
    layout emitted by MAID, allowing force refresh to normalize it and uninstall
    to remove it without accepting arbitrary indentation, quoted markers, mixed
    malformed copies, or blocks that do not own the reserved hook.
  rationale: >-
    Recognition is deliberately limited to the canonical pair and the historical
    two-space opening marker with a column-zero close. Literal marker occurrence
    counts must match recognized exact-line markers, ownership requires exactly
    one reserved hook inside the managed span and globally, and byte-span edits
    preserve unrelated YAML rather than reserializing the file.
  lessons:
  - lesson_type: validation-trust
    summary: >-
      Recognizing one valid marker pair is insufficient when extra malformed
      copies are present. Comparing literal marker occurrences with exact-line
      matches made both init and uninstall fail before mutation for quoted,
      unsupported, and mixed marker shapes.
    tags: [pre-commit, ownership, fail-closed, uninstall]
    paths:
    - maid_runner/cli/commands/init.py
    - tests/cli/test_legacy_pre_commit_markers.py
  - lesson_type: testing
    summary: >-
      A disposable worktree of the affected codefrost-site repository proved the
      compatibility path against realistic historical files: dry-run was
      non-mutating, execution removed only MAID-owned payload, Cloudflare skills
      and project data survived, and repeated uninstall was stable.
    tags: [worktree, regression, preservation, brownfield]
    paths:
    - tests/cli/test_legacy_pre_commit_markers.py
  review_notes:
