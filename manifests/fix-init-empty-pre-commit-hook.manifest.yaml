# draft-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: "Make maid init's generated verification hook pass before the first manifest"
type: fix
created: "2026-08-05T06:38:42Z"
metadata:
  bug_reports:
    - ~/.maid/bug-report/20260731-145300-maid-init-empty-manifests.md
    - ~/.maid/bug-report/20260801-122806-deckhand-empty-onboarding-hook.md
  tags: [init, pre-commit, allow-empty, onboarding]
  priority: critical
description: |
  `maid init` intentionally creates `manifests/` with only inactive draft
  inventory, but its generated pre-commit hook requires active plan locks and
  red evidence without permitting the zero-manifest bootstrap state. The hook
  therefore blocks the repository's first commit with E112.

  Add `--allow-empty` to the MAID-managed verify entry. This is bounded to the
  generated pre-commit policy: `maid validate` and ordinary `maid verify` keep
  their fail-empty defaults, while the generated hook still validates normally
  and enforces locks/evidence as soon as active manifests exist. Force refresh
  must upgrade already-managed hooks without disturbing user-owned config.
temptations:
  - risk: "Do not change validate or verify to allow empty manifest sets globally."
    instead: "Add --allow-empty only to the managed hook emitted by maid init."
  - risk: "Do not drop plan-lock, red-evidence, task-scope, or advisory flags to make
      the empty hook pass."
    instead: "Preserve every existing gate and add the single bootstrap exemption
      flag."
  - risk: "Do not assert only that generated YAML contains a token."
    instead: "Execute the generated entry through the public CLI and prove the fresh
      zero-manifest repository passes."
  - risk: "Do not fix only newly created configs."
    instead: "Cover force refresh of a stale MAID-managed hook so existing onboarded
      repositories receive the correction."
  - risk: "Do not leave the established init contract or README showing the stale hook entry."
    instead: "Update the shared expected entry and public command example in the same contract revision."
files:
  scope:
    - path: maid_runner/cli/commands/init.py
      reason: "Update the private managed-hook argument constant without changing
        public command signatures."
    - path: README.md
      reason: "Keep the documented generated pre-commit command synchronized with init output."
  edit:
    - path: tests/cli/test_init_pre_commit.py
      artifacts:
        - kind: test_function
          name: test_init_creates_managed_maid_verify_pre_commit_config
          description: "Fresh init emits the complete allow-empty managed verify entry."
        - kind: test_function
          name: test_init_managed_hook_tracks_only_head_commit_candidates
          description: "The managed hook retains task-scoped HEAD candidate selection together with allow-empty bootstrap behavior."
        - kind: test_function
          name: test_init_appends_managed_hook_without_rewriting_existing_config
          description: "Appending the current allow-empty hook preserves unrelated pre-commit content."
        - kind: test_function
          name: test_init_force_refresh_replaces_only_stale_managed_block
          description: "Force refresh replaces only the stale managed block with the allow-empty entry."
        - kind: test_function
          name: test_readme_documents_init_managed_pre_commit_behavior
          description: "README documents the same allow-empty entry generated by init."
  create:
    - path: tests/cli/test_init_empty_pre_commit_hook.py
      artifacts:
        - kind: test_function
          name: test_generated_hook_passes_before_first_active_manifest
          description: "A fresh initialized repository's generated verify entry contains
            --allow-empty and exits successfully while there are no active manifests."
        - kind: test_function
          name: 
            test_force_refresh_adds_allow_empty_without_removing_strict_gates
          description: "Force refresh upgrades a stale managed hook with --allow-empty
            while retaining plan-lock, red-evidence, task-scope, and baseline arguments."
  read:
    - manifests/add-init-pre-commit-verification.manifest.yaml
    - manifests/fix-pre-commit-task-scoped-plan-locks.manifest.yaml
validate:
  - uv run python -m pytest -q tests/cli/test_init_empty_pre_commit_hook.py 
    tests/cli/test_init_pre_commit.py
  - uv run maid validate manifests/fix-init-empty-pre-commit-hook.manifest.yaml 
    --mode behavioral --quiet
  - uv run maid validate manifests/fix-init-empty-pre-commit-hook.manifest.yaml 
    --mode schema --quiet
outcome:
  status: completed
  completed_at: '2026-08-05T06:47:10Z'
  summary: MAID-managed pre-commit verification now permits the intentional zero-active-manifest bootstrap state produced by init while retaining every strict gate once manifests exist.
  rationale: The bounded correction adds --allow-empty only to init's generated verify entry, updates existing managed blocks on force refresh, and leaves ordinary validate/verify fail-empty defaults unchanged.
  lessons:
  - lesson_type: validation-trust
    summary: Generated automation must be internally consistent with the bootstrap state its generator creates; a bounded allow-empty flag is safer than weakening global validation defaults.
    tags: [init, pre-commit, allow-empty, bootstrap]
    paths: [maid_runner/cli/commands/init.py, tests/cli/test_init_empty_pre_commit_hook.py]
  - lesson_type: contract-evolution
    summary: When a shared generated command evolves, synchronize its inherited behavioral constant, public documentation, and every owning plan lock instead of bypassing historical integrity checks.
    tags: [chain-merge, shared-tests, plan-locks, documentation]
    paths: [tests/cli/test_init_pre_commit.py, README.md]
  review_notes:
