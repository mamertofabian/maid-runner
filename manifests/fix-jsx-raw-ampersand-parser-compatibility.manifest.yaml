# manifest-kind: draft
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
goal: Parse valid raw ampersands in JSX text and historical assessment baselines without weakening syntax diagnostics
type: fix
created: '2026-09-30T04:37:58Z'
metadata:
  priority: high
  tags:
  - tsx
  - jsx
  - parser-compatibility
  - assess
  bug_reports:
  - 20260912-171616-hubb-ops-maid-assess-tsx-baseline.md
  - 20260928-0630-hubb-csv-tsx-parser.md
description: |-
  Fix the shared raw-ampersand JSX grammar defect behind historical assessment
  baseline failures and CSVImportDialog parse failure. Builtin tree-sitter rejects
  valid JSX text such as Contracts & Cancels. Current-tree escaping cannot repair
  immutable baseline content. Add a narrow same-byte-width repair in the existing
  TSX/JSX parse service. Locate ampersand markers only from parser-established JSX
  text/error context, such as text-adjacent recovered ampersand tokens or direct
  text errors under JSX elements. Never globally replace ampersands or reinterpret
  JavaScript expressions, opening-tag attributes, quoted values or TS operators.
  Repeated and nested text markers may require bounded reparsing after grammar
  recovery; every pass must mask at least one new eligible marker, preserve byte
  positions and stop when no eligible markers remain. Do not build a new lexer or
  control-flow model. Adopt a repaired candidate only when it reduces reported
  parse errors; preserve unrelated errors and original diagnostics. Retain the
  original source_bytes for artifact extraction and apply changes only to parser
  input. Known valid source that parses already must remain unmodified.
  Compose the stage with existing same-width type-query and in-prefixed-property
  repairs, carrying the accepted parser-input bytes forward rather than undoing
  an earlier repair. Keep public parser signatures and artifact APIs unchanged.
  Rationale: the existing parser recovery architecture already repairs narrowly
  identified grammar limitations while preserving offsets. Extend that mechanism
  for this confirmed JSX text token rather than rewriting consumer components,
  changing historical commits or suppressing E116/E308. The CSV report also has
  destructured-prop and inferred-return modeling limitations; those are explicitly
  outside this task, so fixing its parser portion does not close the whole report.
  New tests live in a dedicated module; existing locked test modules and durable
  contracts remain untouched. Existing Supabase parser tests informed composition
  and preserved-error coverage; previous parser-boundary work informs the use of
  standard grammar context instead of custom language interpretation.
temptations:
- risk: Globally escape or replace & across source to make the grammar pass.
  instead: Repair only parser-established JSX text marker contexts in TSX/JSX; preserve expression, attribute, entity and TS syntax controls.
- risk: Drop parse diagnostics or accept repaired input that hides genuine syntax errors.
  instead: Adopt only candidates with fewer reported errors and retain malformed JSX and independent-error regression cases.
- risk: Change source length or overwrite original bytes during normalization.
  instead: Mask eligible ASCII ampersands with same-width parser-only bytes, retain original source_bytes, and check Unicode offsets/artifact locations.
- risk: Broaden the task into JSX prop inference or rewrite downstream Git baselines.
  instead: Exercise immutable-baseline assessment through public APIs; keep signature inference and the remaining CSV modeling gap out of scope.
files:
  edit:
  - path: maid_runner/validators/_typescript_parse.py
    artifacts:
    - kind: function
      name: parse_typescript_source
      args:
      - name: source
        type: str
      - name: file_path
        type: Union[str, Path]
      - name: ts_parser
        type: Parser
      - name: tsx_parser
        type: Parser
      returns: TypeScriptParseSession
      description: Parse TypeScript/TSX with bounded same-width raw JSX text ampersand recovery while retaining original bytes, existing normalization stages and genuine diagnostics.
  scope:
  - path: docs/troubleshooting.md
    reason: Explain parser compatibility for raw JSX text in current source and immutable baselines, without conflating the CSV signature-modeling gap.
  create:
  - path: tests/validators/test_jsx_raw_ampersand_parse.py
    artifacts:
    - kind: test_function
      name: test_raw_ampersands_in_jsx_text_parse_without_changing_original_bytes
      description: Raw ampersands, repeated markers, adjacent text, Unicode and fragments parse in TSX/JSX while original source bytes and tree offsets remain intact.
    - kind: test_function
      name: test_valid_jsx_expressions_attributes_and_entities_remain_unmodified
      description: Bitwise/conditional expressions, quoted attributes and valid entities remain byte-identical in the parse tree when no recovery is needed.
    - kind: test_function
      name: test_ampersand_recovery_does_not_accept_genuine_jsx_syntax_errors
      description: Missing operands, malformed attributes, wrong closing tags and incomplete elements remain syntax errors.
    - kind: test_function
      name: test_raw_ampersand_repair_preserves_unrelated_syntax_error_locations
      description: Known JSX grammar repair preserves the independent syntax error at its original source line.
    - kind: test_function
      name: test_raw_ampersand_and_existing_parse_repairs_compose_without_restoring_errors
      description: JSX repair composes with existing type-query and in-prefixed-property sanitizers without discarding accepted same-width changes.
    - kind: test_function
      name: test_collection_after_unicode_jsx_text_retains_original_names_and_lines
      description: Public TypeScript collection retains exported names, return types and original line locations after Unicode JSX text.
    - kind: test_function
      name: test_assessment_accepts_historical_raw_ampersand_baseline
      description: Assessment reads valid raw JSX text from an immutable Git baseline and emits the baseline-bound verify command without requiring historical edits.
