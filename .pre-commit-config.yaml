# Pre-commit hooks for MAID Runner
# Install: uv pip install pre-commit && pre-commit install
# Bypass: git commit --no-verify (use sparingly)

repos:
  - repo: local
    hooks:
      # Code formatting with Black
      - id: black
        name: Format code with Black
        entry: uv run black
        language: system
        types: [python]
        pass_filenames: true

      # Code linting with Ruff
      - id: ruff
        name: Lint code with Ruff
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: true

      # Comprehensive MAID handoff gate; fail before tests on lock/scope errors
      - id: maid-verify
        name: MAID verification (fail-fast handoff gates)
        entry: uv run maid verify --profile handoff --fail-fast --no-changed-scope
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Smart sync-claude - only runs when .claude/ files change
      - id: sync-claude
        name: Sync Claude files for package distribution
        entry: make sync-claude
        language: system
        files: '^\.claude/'
        pass_filenames: false
        stages: [pre-commit]
