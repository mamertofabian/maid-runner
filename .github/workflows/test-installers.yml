name: Test bootstrap installers

on:
  push:
    branches:
      - main
    paths:
      - "website/install.sh"
      - "website/install.ps1"
      - ".github/workflows/test-installers.yml"
  pull_request:
    paths:
      - "website/install.sh"
      - "website/install.ps1"
      - ".github/workflows/test-installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run local installer
        run: sh website/install.sh

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run local installer
        shell: pwsh
        run: ./website/install.ps1
